[project]
name = "aether-flow-research-control"
version = "0.0.0"
description = "Project-system tooling for the AEther-Flow research-control repository"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "PyMuPDF==1.27.2.3",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
validation = []
test = []
proof = []
documentation = []

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "coverage==7.15.2",
  "hypothesis==6.161.2",
  "mypy==2.3.0",
  "mutmut==3.6.0",
  "pip-audit==2.10.1",
  "ruff==0.16.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
required-version = ">=0.10,<0.11"

[tool.aether-flow.environment]
schema-id = "aether_flow_environment_v1"
python-series = "3.12"
lock-file = "research_control/tasks/RT-20260723-019/artifacts/requirements.lock"
quality-lock-file = "research_control/tasks/RT-20260724-002/artifacts/quality-assurance-requirements.lock"
compatibility-requirements = [
  "requirements.txt",
  "requirements-dev.txt",
]
ordinary-install-command = "python -m pip install --require-hashes -r requirements-dev.txt"
lock-maintenance-command = "uv pip compile pyproject.toml --all-extras --universal --generate-hashes --output-file research_control/tasks/RT-20260723-019/artifacts/requirements.lock"
quality-lock-maintenance-command = "uv pip compile pyproject.toml --group dev --all-extras --universal --generate-hashes --output-file research_control/tasks/RT-20260724-002/artifacts/quality-assurance-requirements.lock"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/validation/models.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "skip"
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.coverage.run]
branch = true
data_file = ".local/assurance/.coverage"
source = [
  "scripts.validation.assurance",
  "scripts.validation.portability",
]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.json]
output = ".local/assurance/coverage.json"
pretty_print = true

[tool.mutmut]
source_paths = [
  "scripts/validation/assurance.py",
]
pytest_add_cli_args_test_selection = [
  "tests/test_validation_assurance.py",
]
mutate_only_covered_lines = true

[[tool.aether-flow.external-tools]]
name = "git"
required-for = ["checkpoint", "repository identity"]
managed-by-python-lock = false

[[tool.aether-flow.external-tools]]
name = "make"
required-for = ["compatibility validation entry points"]
managed-by-python-lock = false

[[tool.aether-flow.external-tools]]
name = "uv"
required-for = ["maintainer lock regeneration only"]
managed-by-python-lock = false

[[tool.aether-flow.external-tools]]
name = "Lean"
required-for = ["formal proof packets that explicitly name Lean"]
managed-by-python-lock = false

[[tool.aether-flow.external-tools]]
name = "TeX"
required-for = ["PDF derivative tasks that explicitly authorize compilation"]
managed-by-python-lock = false

[[tool.aether-flow.external-tools]]
name = "Node.js and Playwright"
required-for = ["diagram or browser tasks that explicitly authorize those runtimes"]
managed-by-python-lock = false
