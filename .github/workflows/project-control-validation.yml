name: Project Control Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-control-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_portability_matrix:
    name: Quality and portability / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.12"
    env:
      PYTHON: .venv/bin/python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install exact quality dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run incremental quality and portability gates
        run: make PYTHON=.venv/bin/python validate-quality

      - name: Run bounded assurance gates
        run: make PYTHON=.venv/bin/python validate-assurance

  validate_project_control:
    name: Validate planner-authoritative project control
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON: .venv/bin/python
    steps:
      - name: Check out repository with comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install exact validation dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run the planner-authoritative full profile
        shell: bash
        run: |
          set +e
          mkdir -p planner-project-control-artifacts
          make PYTHON=.venv/bin/python validate-project-control \
            > planner-project-control-artifacts/full-output.log 2>&1
          exit_code="$?"
          receipt_path="$(find .local/validation-receipts -type f -name full.json -print 2>/dev/null | LC_ALL=C sort | tail -n 1)"
          if [[ -n "$receipt_path" ]]; then
            cp "$receipt_path" planner-project-control-artifacts/full.json
          fi
          if [[ "$exit_code" -ne 0 ]]; then
            tail -n 200 planner-project-control-artifacts/full-output.log
          fi
          exit "$exit_code"

      - name: Upload planner validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-project-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: planner-project-control-artifacts/
          if-no-files-found: error
          retention-days: 14
