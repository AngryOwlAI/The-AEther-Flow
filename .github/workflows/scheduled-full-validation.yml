name: Scheduled Full Validation

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduled_assurance:
    name: Scheduled dependency and mutation assurance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON: .venv/bin/python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install exact assurance dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run bounded assurance gates
        run: make PYTHON=.venv/bin/python validate-assurance

      - name: Audit exact dependencies
        run: make PYTHON=.venv/bin/python audit-assurance-dependencies

      - name: Run targeted mutation campaign
        run: make PYTHON=.venv/bin/python audit-assurance-mutations

      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/assurance/
          if-no-files-found: error
          retention-days: 30

  scheduled_full_validation:
    name: Run unfiltered planner-authoritative full validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHON: .venv/bin/python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up supported Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install exact validation dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run the unfiltered full profile
        shell: bash
        run: |
          set +e
          mkdir -p scheduled-full-artifacts
          make PYTHON=.venv/bin/python validate-project-control \
            > scheduled-full-artifacts/full-output.log 2>&1
          exit_code="$?"
          receipt_path="$(find .local/validation-receipts -type f -name full.json -print 2>/dev/null | LC_ALL=C sort | tail -n 1)"
          if [[ -n "$receipt_path" ]]; then
            cp "$receipt_path" scheduled-full-artifacts/full.json
          fi
          if [[ "$exit_code" -ne 0 ]]; then
            tail -n 200 scheduled-full-artifacts/full-output.log
          fi
          exit "$exit_code"

      - name: Upload scheduled full validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-full-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: scheduled-full-artifacts/
          if-no-files-found: error
          retention-days: 30
