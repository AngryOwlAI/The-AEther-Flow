  - Applicable registry rows and generated derivatives only when current policy requires them.
  - Any path outside this scope requires a new tracked decision or a separate included repair work item. The goal scope itself
    cannot expand.
  implementation_actions:
  - Run memory preflight, targeted retrieval, canonical source inspection, and Director context resolution.
  - Bind the narrowest role or task overlay, exact claim boundary, source allowlist, write allowlist, validators, and stop
    conditions.
  - Inspect the active program state, latest handoff, current frontier, the v19 plan lineage, and the three continue-research
    goal skills.
  - Register the exact plan path, plan ID, plan version, authority class, and SHA-256 in the appropriate Markdown source registry.
  - Record that v21 is a multi-track research program and does not itself supersede the active scientific handoff.
  - Preserve the active EqSrc audit as the first scientific work item.
  - Reject any interpretation of plan registration as task completion, physics progress, or authority expansion.
  - Record recommendation coverage, assumption delta, candidate or theorem identities, authority flags, and forbidden conclusions
    in the completion.
  - Create the next tracked handoff only after task-local evidence and validators support the stated result.
  required_artifacts:
  - registered plan row and source hash.
  - task-local plan registration receipt.
  - documentation-impact record.
  - One compact task-local receipt containing source hashes, result status, finding counts, validator IDs, and claim-boundary
    summary.
  - Full raw logs or large machine evidence stored in approved files rather than copied into completion prose.
  validator_obligations:
  - Plan path and hash are stable.
  - Registry row resolves to the exact file.
  - Research-control and documentation-impact validators pass.
  - Run the task-selected focused scientific or project-system validators.
  - Run claim-language and source-authority checks for every changed claim-bearing surface.
  - Validate documentation impact and project-improvement signal parity.
  - Run affected research-control validation and the selected test shard.
  - Run git diff --check.
  - For a state-changing PASS, use the governed checkpoint and record the final staged tree hash and commit.
  - Treat validator PASS as operational evidence only, never as proof or promotion authority.
  completion_criteria:
  - The plan is tracked and registered.
  - No science TeX or Distance-to-GR row changed.
  - The next work item is P0-T02.
  - The completion records the exact v21 work-item status and recommendation IDs.
  - 'The completion states physics_promotion_authorized: false unless a separate exact protected authority says otherwise.'
  - No unrelated tracked change remains.
  - The canonical after-state fingerprint is new or the work item has a lawful no-progress, obstruction, or human-gate disposition.
  rollback_and_stop_rules:
  - Stop on an unrelated dirty tree.
  - Stop if registration would overwrite an activated record.
  - Rollback only the new plan registration transaction on failure.
  - Stop on repository or branch mismatch, lease ambiguity, unsupported reasoning effort, unknown consumed invocation, unexpected
    dirty state, validation failure, checkpoint failure, repeated fingerprint, or no progress without a distinct safe strategy.
  - Never rerun a consumed generation or repeat the same recovery strategy for the same blocker.
  - Preserve failed artifacts and receipts. Roll back only through the current governed transaction or an exact subsequent
    repair task.
  next_task_rules:
  - 'On a qualifying finalized result, the following included work items may become eligible once all of their dependencies
    are satisfied: P0-T02.'
  - On REPAIR_REQUIRED, use one materially different, included, bounded repair strategy or record exact human action if no
    lawful route remains.
  - On a precise obstruction or family freeze, preserve the negative result and select only a route allowed by its reopening
    criteria.
