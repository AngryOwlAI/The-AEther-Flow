- plan_task_id: P0-T02
  phase_id: P0
  title: Build and approve the immutable V21 scientific baseline release
  track: shared release control
  owner: Director of Research, process-integrity auditor, and documentation curator
  declared_coverage_ids:
  - V22-R01
  - V22-R12
  - V22-R19
  - S1
  recommendation_ids:
  - V22-R01
  - V22-R19
  - V22-R12
  sequence_step_ids:
  - S1
  cross_cutting_directive_ids: []
  depends_on:
  - P0-T01
  objective: Package V21 as an immutable, internally reproducible baseline without
    implying publication, external validation, or a positive derivation.
  actions: 'Pin the terminal commit and tree. Construct a machine-readable manifest
    containing every canonical source and hash, the final Distance-to-GR ledger, Gates
    A-E, selector theorem/proof archive, P5/P6 negative results, P7 postulate ledger,
    P8/P9 obstruction and benchmark records, P16 science/system scorecards, validation
    environment, and provenance receipts. Reproduce selected theorem, Lean, TeX, Python,
    and benchmark packages in a clean environment. Verify that generated PDFs, HTML,
    wiki, and large reports are derivative release artifacts. Prepare, but do not
    create, a Git tag and release until separately authorized. Define the freeze exception
    process: only demonstrated security or reproducibility defects, repaired through
    a superseding record, may alter the baseline lineage.'
  outputs: Release manifest, canonical/derivative partition, reproduction receipt,
    freeze policy, proposed tag name, and release notes with the exact negative scientific
    status.
  acceptance: Every required baseline artifact resolves by hash; generated artifacts
    trace to canonical sources; clean reproduction is either successful or exact failures
    are disclosed; release text says Gates B/D/E are not ready, benchmarks are six
    inconclusive/zero pass/zero independent replication, and GR is not source-derived.
  verification: Release-tier validation, clean-environment reproduction, hash closure,
    source/derivative audit, claim-language review, and a human check before tag/release
    execution.
  stop_conditions: Missing canonical object, unverifiable hash, nonreproducible proof
    or build without disclosure, public-release overclaim, or absent explicit tag/release
    authority.
  implementation_status: completed
  requires_separate_agentjob: true
  max_outer_agentjobs_per_invocation: 1
  automatic_execution_authorized: false
  scientific_claims_changed: false
  distance_to_gr_delta_changed: false
  physics_promotion_authorized: false
