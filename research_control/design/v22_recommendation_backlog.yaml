  objective: Finish only the already-routed V21 checkpoint and outer terminal verification,
    without using this V22 plan to mutate or replay V21.
  actions: Reopen the live goal record, lease, repository binding, branch, HEAD, tree,
    manifest, active handoff, completion, and checkpoint status. If the record is
    still pending, follow its immutable route exactly once. Verify the returned receipt,
    canonical after-fingerprint, 122 final dispositions, 72 covered V21 recommendations,
    zero unresolved required human actions, zero successor, and released lease. If
    the state is already terminal, record that fact read-only. If any identity differs,
    stop and use the live V21 recovery route; do not infer a repair from this plan.
  outputs: Canonical terminal receipt or a precise existing-relay blocker; read-only
    V21 terminal-state snapshot for the V22 intake.
  acceptance: V21 is `terminal_complete`, no successor exists, leases are released,
    repository state matches the terminal fingerprint, and no scientific status was
    promoted by closure.
  verification: Use the exact V21 goal helper and live control validators. This package
    does not create a new AgentJob, plan task, or repository change.
  stop_conditions: Lease ambiguity, stale handoff, dirty-manifest mismatch, consumed-generation
    replay risk, checkpoint failure, or any request to broaden the terminal transaction.
