findings:
  - finding_id: "PM-P2T03-001"
    result: "With supplied component representatives and transports, evaluation gives Sel_G isomorphic to the Cartesian product of representative fixed loci."
    proof_step: "The inverse sigma_X=S(tau_X)x_[X] is natural because tau_Y^-1 f tau_X is an automorphism fixing x_[X]."
  - finding_id: "PM-P2T03-002"
    result: "Sel_G is empty exactly when the Cartesian product is empty; an empty factor is always sufficient."
    boundary: "The converse from all factors nonempty requires finite indexing, a supplied product tuple, or an explicit suitable choice principle."
  - finding_id: "PM-P2T03-003"
    result: "Global multiplicity is equivalent to one multiple factor plus a nonempty complementary product."
    boundary: "A local multiple fixed locus alone does not imply any global selector."
  - finding_id: "PM-P2T03-004"
    result: "K_* maps global selectors to natural relation sections, and component K-images determine whether selector multiplicity survives at relation level once a baseline selector exists."
    boundary: "Do not identify the global image with a product of component images without simultaneous fibre choices."
  - finding_id: "PM-P2T03-005"
    result: "If S extends beyond the core, full-category selectors form the equalizer subset satisfying every noninvertible-arrow equation."
    boundary: "Core fixedness is not full-category sufficiency."
