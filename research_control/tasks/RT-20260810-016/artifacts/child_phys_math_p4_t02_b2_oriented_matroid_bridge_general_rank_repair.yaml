constructed_theorems:
  theorem_count: 8
  theorems:
    - theorem_id: "THM-RT016-GENERAL-FINITE-RANK-BRIDGE-001"
      name: "Arbitrary finite-rank Bridge_OM typing and construction"
      statement: >-
        For every finite S and every admitted exact configuration A of finite
        rank r>=1, all five components of Bridge_OM are typed and finite where
        finiteness is claimed. The sign cube has 3^card(S) elements, the support
        search is finite, the presentation groupoid acts in every finite rank,
        declared refinements remain finite, and Strat retains its fixed tame
        path restriction.
      proof: >-
        Cstar enumeration depends on finite S, not a rank ceiling. Circuit
        enumeration needs only the rank-generic support theorem below. The
        Gordan, transport, refinement, and tame-path proofs use finite matrices
        and finitely many admitted minor events, with no step invoking r<=4.
    - theorem_id: "THM-RT016-SPAN-FACTOR-002"
      name: "Effective-span factorization"
      statement: "Bridge_OM(A) depends only on W_A=span(A), so unused ambient dimensions do not create or remove any Bridge_OM datum."
      proof: >-
        Restriction V^*->W_A^* is surjective after extending a basis of W_A;
        hence the realized sign image and strict-chamber nonemptiness agree.
        Kernels, circuits, ranks, refinements, and column-minor records depend
        only on the columns in W_A. Presentation and certificate transport
        restrict accordingly.
    - theorem_id: "THM-RT016-CIRCUIT-BOUND-003"
      name: "General positive-circuit rank, nullity, and support theorem"
      statement: >-
        If C is support-minimal and alpha in F^C_{>0} satisfies A_C alpha=0,
        then dim ker(A_C)=1, rank(A_C)=card(C)-1, and card(C)<=r+1 for
        r=rank(A), with no finite-rank upper ceiling.
      proof_steps:
        - "All coefficients are nonzero by the definition of support and are strictly positive by hypothesis."
        - >-
          If beta in ker(A_C) is not proportional to alpha, choose its sign so
          some beta_i>0 and let t=min_{beta_i>0}(alpha_i/beta_i), which exists
          because C is finite and F is ordered. Then gamma=alpha-t beta is
          nonzero, nonnegative, lies in ker(A_C), and has a zero coordinate,
          contradicting support minimality.
        - "Thus nullity is one; rank-nullity gives rank(A_C)=card(C)-1<=rank(A)=r, hence card(C)<=r+1."
    - theorem_id: "THM-RT016-SHARP-SUPPORT-004"
      name: "Sharpness of the r+1 support bound"
      statement: >-
        For every integer r>=1, A_r^-=[e_1,...,e_r,-u_r] over Q, with
        u_r=sum_i e_i, has rank r and exactly one minimal positive circuit with
        coefficient ray [(1,...,1,1)] and support r+1.
      proof: >-
        The leading identity minor has determinant one. The displayed positive
        relation is zero. Omitting -u_r leaves a basis subset; omitting e_j
        leaves coordinate j supplied only by -u_r, forcing its coefficient and
        then all others to vanish. Every proper subset is independent, so the
        dependence is minimal and the bound is sharp.
    - theorem_id: "THM-RT016-STRICT-ALTERNATIVE-005"
      name: "Strict total alternative at arbitrary finite rank"
      statement: "The unchanged Feasible and Obstructed branches remain exhaustive and exclusive for every admitted finite-rank configuration."
      proof: >-
        The fixed finite-dimensional Gordan alternative has no upper-rank
        premise. Pairing a strict k with a nonzero nonnegative kernel vector
        contradicts positivity; infeasibility supplies a nonnegative kernel
        certificate whose minimal support is a positive circuit.
    - theorem_id: "THM-RT016-PRESENTATION-EQUIVARIANCE-006"
      name: "General-rank presentation and certificate-fiber transport"
      statement: "GL(V), positive diagonal, and permutation transport every Bridge_OM component and the full certificate fibers bijectively at arbitrary finite rank."
      proof: >-
        Invertibility preserves rank and kernels, D>0 preserves signs and
        coefficient positivity, and P relabels. Raw certificates retain the
        fixed transports k->T^{-T}k and alpha->P D^{-1}alpha. No selected raw
        certificate is introduced.
    - theorem_id: "THM-RT016-REFINEMENT-007"
      name: "General-rank finite-refinement functoriality"
      statement: "Covector restriction is surjective, Gamma shrinks under added inequalities, old supported positive circuits persist, and nested restrictions compose in every finite rank."
      proof: "The fixed witness-extension, inequality-inclusion, support-minimality, and coordinate-composition proofs contain no rank ceiling."
    - theorem_id: "THM-RT016-TAME-PATH-008"
      name: "General-rank preservation of the tame path boundary"
      statement: "On the unchanged effective finite tame path family, finitely many relevant minors yield the same exact finite cell or isolated-event stratification in every finite rank."
      proof: >-
        For finite S and finite r there are finitely many relevant column
        minors. The admitted representation already requires exact root
        isolation or finite semialgebraic cell decomposition. No claim is made
        for arbitrary continuous paths or for continuum robustness.

covector_count_derivation_for_standard_sum_controls:
  family: "A_r^+=[I_r|u_r] and A_r^-=[I_r|-u_r], u_r=(1,...,1)^T."
  first_coordinate_sign_patterns: "3^r"
  one_sided_nonzero_patterns: "2*(2^r-1); their sum sign is forced."
  mixed_positive_negative_patterns: "3^r-2^(r+1)+1; each realizes negative, zero, and positive sum signs."
  all_zero_pattern: "One; its sum sign is zero."
  realized_covector_formula: "3^(r+1)-2^(r+2)+2"
  unrealized_sign_formula: "2^(r+2)-2"
  tope_formula: "2^(r+1)-2"
  constructive_integer_witness_recipe:
    - "For a mixed sign pattern with positive index set P and negative index set N, set x_i=card(N) for i in P and x_j=-card(P) for j in N; the sum is zero."
    - "Add one to a chosen positive coordinate to obtain positive sum, or subtract one from a chosen negative coordinate to obtain negative sum."
    - "For one-sided patterns assign unit magnitudes; for the zero pattern use x=0."
    - "For A_r^- reverse only the final sum sign. Thus every counted covector has an exact integer witness."

