general_rank_support_theorem:
  theorem_domain: "Every finite exact oriented configuration A:F^S->V with finite r=rank(A)>=1."
  statement: "If C is a support-minimal positive circuit, then dim ker(A_C)=1, rank(A_C)=card(C)-1, and card(C)<=r+1."
  proof_outline:
    - "A positive circuit supplies alpha in ker(A_C) with every coordinate strictly positive."
    - "If dim ker(A_C)>1, choose beta independent of alpha and move along alpha+t beta until the first coordinate reaches zero while all coordinates remain nonnegative."
    - "The resulting nonzero nonnegative kernel vector has proper support, contradicting support minimality of C."
    - "Therefore nullity(A_C)=1 and rank(A_C)=card(C)-1. Since rank(A_C)<=rank(A)=r, card(C)<=r+1."
  dependence_on_rank_at_most_four: false
  dependence_on_target_dimension: false
  dependence_on_finiteness: "Finiteness of S makes sign and support enumeration finite; it does not impose a fixed numerical rank ceiling."
  sharpness_family: "A_r_minus=[e_1,...,e_r,-sum_i e_i] has a unique full-support positive circuit with coefficients all one and card(C)=r+1 for every finite r>=1."

