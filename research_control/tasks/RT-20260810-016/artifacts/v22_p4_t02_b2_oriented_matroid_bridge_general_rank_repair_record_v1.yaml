constructed_theorems:
  - theorem_id: "THM-V22-P4T02-B2-OM-GENERAL-RANK-SUPPORT-007"
    statement: "For every finite rank r>=1 and every support-minimal positive circuit C, rank(A_C)=card(C)-1<=r; hence card(C)<=r+1."
    proof: "Let alpha>0 span one kernel direction. If dim ker(A_C)>1, perturb alpha along an independent kernel vector until a coordinate first reaches zero while all coordinates remain nonnegative. This gives a nonzero nonnegative dependence on a proper subset, contradicting support minimality. Hence dim ker(A_C)=1 and rank(A_C)=card(C)-1<=r."
    scope: "arbitrary finite rank over the fixed adequate exact domain"
  - theorem_id: "THM-V22-P4T02-B2-OM-GENERAL-RANK-SHARPNESS-008"
    statement: "For every r>=1, A_r^-=[e_1,...,e_r,-sum_i e_i] has the unique positive circuit alpha=(1,...,1) on all r+1 columns and saturates the bound."
    proof: "The displayed coefficients give a positive dependence. Every proper subset is independent because deleting the negative-sum column leaves basis vectors, while deleting e_j leaves a vector with nonzero j component outside the remaining basis span."
    scope: "exact rational control family"
  - theorem_id: "THM-V22-P4T02-B2-OM-GENERAL-RANK-FEASIBILITY-009"
    statement: "For every r>=1, A_r^+=[e_1,...,e_r,+sum_i e_i] is strictly feasible with k=(1,...,1) and has no positive circuit."
    proof: "The evaluations are (1,...,1,r), all positive; strict feasibility excludes a nonzero nonnegative kernel certificate by the unchanged total alternative."
    scope: "exact rational control family"
  - theorem_id: "THM-V22-P4T02-B2-OM-CONSERVATIVE-REPAIR-010"
    statement: "The arbitrary-rank repair changes only the theorem domain, circuit-support statement, and fixture-status label; covectors, totality, presentation transport, certificate orbits, refinements, and tame path stratification remain the fixed RT014 construction."
    proof: "The frozen RT014 source hashes and exact model pass unchanged, and the repaired artifact reuses the same formal definitions verbatim."
    scope: "task-local semantic repair"
  - theorem_id: "THM-V22-P4T02-B2-OM-EFFECTIVE-SPAN-011"
    statement: "Bridge_OM(A) depends only on W_A=span(A), so unused ambient dimensions create or remove no Bridge_OM datum."
    proof: "Restriction V^*->W_A^* is surjective, while ranks, kernels, circuits, refinements, and column-minor records depend only on the columns in W_A."
    scope: "arbitrary finite rank over the fixed adequate exact domain"
  - theorem_id: "THM-V22-P4T02-B2-OM-STANDARD-SUM-COUNT-012"
    statement: "For A_r^+ and A_r^-, the realized covector count is 3^(r+1)-2^(r+2)+2 and the tope count is 2^(r+1)-2."
    proof: "Partition the first-r-coordinate sign patterns into one-sided, mixed, and zero classes; the sum sign is respectively forced, realizes all three signs by exact integer magnitudes, or is zero. Reorienting the final column preserves the count."
    scope: "exact standard-sum conformance family"

