independent_findings:
  - finding_id: "P7T07-PHIL-F01"
    class: "textual_no_target_purity"
    severity: "nonblocking_for_candidate_math"
    finding: >-
      No direct use of a target atlas, target metric, Lorentzian signature,
      proper time, empirical detector calibration, Einstein equations,
      benchmark success, validator result, or process state was found as a
      mathematical premise in the six fixed candidate definitions.
    disposition: >-
      Candidate-relative no-target purity survives this manual audit. This is
      negative hygiene only and is not positive source derivation, physical
      semantics, coupling, or Gate C readiness.
  - finding_id: "P7T07-PHIL-F02"
    class: "positive_source_provenance_gap"
    severity: "blocking_for_gate_c_readiness"
    finding: >-
      The principal cross-layer objects are stipulated source-extension
      primitives. The current canonical ontology does not derive the
      occupation and sector ontology, enabled-row selector, kernel weighting,
      protocol fields, address bijections, equipment maps, or variational
      pairing and surrogate.
    disposition: "source_derivation remains proposed rather than source_derived"
  - finding_id: "P7T07-PHIL-F03"
    class: "physical_matter_alias"
    severity: "blocking_for_physical_matter_claim"
    finding: >-
      P7-T01 defines a finite algebraic configuration and sector taxonomy,
      but occupation, charge, current, defect, representation, excitation,
      and matter are candidate labels. No model-to-world map, reference-state
      dynamics, stability theorem, particle identity, measurement protocol,
      or empirical correspondence licenses physical matter.
    disposition: "physical matter is not established or refuted"
  - finding_id: "P7T07-PHIL-F04"
    class: "probability_and_time_alias"
    severity: "blocking_for_physical_dynamics_claim"
    finding: >-
      P7-T02 row weights and histories are nonnegative normalized rational
      bookkeeping values. Uniformity follows from stipulated row cardinality,
      not a source-derived stochastic law. The update counter is formal
      composition, not physical time, duration, rate, frequency, causal order,
      or trajectory.
    disposition: "formal finite dynamics are specified; physical dynamics are missing"
  - finding_id: "P7T07-PHIL-F05"
    class: "operational_role_alias"
    severity: "blocking_for_operational_semantics"
    finding: >-
      P7-T03 constructs explicit protocol tuples and token maps, but Clock,
      Rod, Signal, Detector, and FreeFall are guarded syntactic role names.
      Tick, endpoint, arrival, trigger, and no-intervention tokens are not
      calibrated proper time, length, causal signaling, empirical detection,
      or force-free motion.
    disposition: "formal protocols are specified; claimed measurement semantics are absent"
  - finding_id: "P7T07-PHIL-F06"
    class: "clock_signal_agreement"
    severity: "blocking_for_common_operational_geometry"
    finding: >-
      No clock-to-signal agreement is derived. P7-T03 gives Clock and Signal
      an independent Cartesian product whose joint response factors because
      the joint control and preparation are selected to be Cartesian. It does
      not define a map comparing clock cycles with signal arrival histories,
      rates, durations, or propagation. P7-T04 instead finds the Clock
      support graph incompatible with baseline FreeFall under exact bijective
      universality.
    disposition: "clock_signal_agreement_missing_not_refuted"
  - finding_id: "P7T07-PHIL-F07"
    class: "selected_cross_device_agreement"
    severity: "blocking_for_physical_agreement"
    finding: >-
      Signal and Detector response equality is derived only after a declared
      history and transition bijection is supplied. Rod and Signal share a
      three-address support skeleton only after P7-T04 stipulates an address
      bijection. The equalities are exact consequences of selected candidate
      equipment, not derivations of a common physical propagation law.
    disposition: "conditional_candidate_agreement_survives; physical_agreement_does_not_follow"
  - finding_id: "P7T07-PHIL-F08"
    class: "cone_and_metric_gap"
    severity: "blocking_for_common_geometry"
    finding: >-
      P7-T04 supplies finite Boolean adjacency and reachability only. It has
      no differential operator, covector domain, principal symbol,
      characteristic variety, low-energy parameter, continuum map, scale,
      signature, cone, or metric. The restricted three-role chain cannot be
      inflated into a common cone, and the full five-role support family has
      an exact current-package bijective-universality obstruction.
    disposition: "common physical propagation geometry is not established"
  - finding_id: "P7T07-PHIL-F09"
    class: "universality_and_coupling_overread"
    severity: "blocking_for_universal_coupling"
    finding: >-
      P7-T05's coupling map is mathematically a sectorwise reindexing on the
      domain of explicitly equipped three-address controls. Its equipment map
      is supplied, not source-derived. The same-sector identity-only and
      forward controls prove that sector data alone do not select a common
      support or update class. No physical field interacts with a geometry,
      and no universal coupling over all admitted matter sectors follows.
    disposition: "restricted intertwiner survives; universal physical coupling is obstructed for this package"
  - finding_id: "P7T07-PHIL-F10"
    class: "action_overread"
    severity: "blocking_for_matter_action"
    finding: >-
      P7-T06's nonnegative symmetric functional is a genuine finite scalar
      variational object on a new dimensionless test labeling. It is not a
      functional of the P7-T01 matter configuration, has no physical units,
      time or spacetime integration, derived geometry, stationary-action
      postulate, or calibrated field interpretation, and is not dynamically
      equivalent to the full directional P7-T02 update.
    disposition: "finite variational surrogate survives; physical matter action is absent"
  - finding_id: "P7T07-PHIL-F11"
    class: "stress_energy_and_conservation_overread"
    severity: "blocking_for_stress_energy_and_physical_conservation"
    finding: >-
      The first variation L_C q is not a stress-energy tensor because there
      is no variation with respect to a physical or derived metric, no tensor
      type, no spacetime localization, and no matter action. The antisymmetric
      edge record and total or cut cancellation are finite algebraic
      identities, not a Noether current, covariant divergence equation, or
      energy-momentum conservation.
    disposition: "exact finite cancellation survives; stress energy and physical conservation are missing"
  - finding_id: "P7T07-PHIL-F12"
    class: "bridge_target_type_gap"
    severity: "blocking_for_matter_coupling_bridge"
    finding: >-
      The package does not construct a typed map from the
      MatterCouplingBridgeTarget_v1 source-domain package to its pre-tensorial
      PTMI codomain. In particular it does not identify P7 records with the
      target's M_src, scoped g_eff context, parameterized sector family,
