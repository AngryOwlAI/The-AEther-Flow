    mathematical_status: "task-local exact interface audit over fixed document hashes"
    statement: "Let G_pkg contain only the objects and maps explicitly defined in the six fixed candidate artifacts. G_pkg has conditional paths from P7-T01 configurations to finite controls, histories, support relations, explicitly equipped reindexings, and a kernel-derived symmetric functional. It has no total typed path to PTMI, physical operational meaning, a universal source-derived coupling, a physical matter action, stress energy, or physical conservation. Every such proposed path crosses at least one absent interface listed below."
