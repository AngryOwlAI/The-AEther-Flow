  - finding_id: "P7T07-MATH-FINDING-RELABELING-001"
    severity: "nonblocking_within_declared_scope"
    disposition: "survives_compatible_relabeling"
    statement: "Compatible bijective source-presentation transports preserve the P7-T01 constraints, P7-T02 update, P7-T03 response fibers, P7-T04 graph invariants, and P7-T05 intertwining when all auxiliary equipment is transported."
    limitation: "The package proves no invariance under arbitrary nonbijective coarse-graining, field mixing, or redefinition that changes the declared pairing, equipment, token partition, or enabled rows."
  - finding_id: "P7T07-MATH-FINDING-FIELD-REDEFINITION-001"
    severity: "high"
    disposition: "scoped_obstruction_only"
    statement: "The P7-T06 nonsymmetric-Hessian obstruction is invariant under permutation and orthogonal relabeling that preserves the Euclidean pairing, but the artifact expressly leaves different lawful pairings, constrained variables, auxiliary fields, and nonlocal principles open."
    namespace_guard: "The P7-T06 probe q in Q^Omega is explicitly distinct from the P7-T01 charge chain q(Psi); conflating them would be a type error and semantic smuggling."
  - finding_id: "P7T07-MATH-FINDING-INTERACTION-CHOICE-001"
    severity: "blocking_for_universal_dynamics"
    disposition: "retain_as_robustness_gap"
    statement: "P7-T02 factorization or nonfactorization changes when Cartesian, mixed, or synchronized enabled rows are declared. No source law selects among those interaction records, and downstream responses, support profiles, equipment eligibility, and variational coefficients change with that choice."
    consequence: "The non-Cartesian branch is an exact structural interaction example, not a derived physical interaction or coupling."
  - finding_id: "P7T07-MATH-FINDING-CLOCK-SIGNAL-SELECTION-001"
    severity: "blocking_for_operational_universality"
    disposition: "reject_physical_agreement_inference"
    statement: "The displayed Clock tick response and Signal arrival response both equal 1/4 because separately stipulated two-choice rows and horizons produce the same product. No cross-device theorem derives this equality from one source law, and P7-T04 shows their support relations are not isomorphic."
    consequence: "Numerical token agreement is selected and fragile under allowed enabled-row changes; it is not clock-signal calibration, common propagation, or equivalence-principle evidence."
  - finding_id: "P7T07-MATH-FINDING-COMMON-PROPAGATION-001"
    severity: "blocking_for_gate_c"
    disposition: "retain_full_suite_obstruction"
    statement: "Only the explicitly selected Rod-Signal-Detector subfamily has a common three-address support relation. The fixed full suite fails U_bij, and the package contains no source-to-differential-operator, covector, principal-symbol, characteristic, cone, or metric map."
