  - finding_id: "P7T07-MATH-FINDING-SECTOR-DELETION-001"
    severity: "high"
    disposition: "fails_universality_overread"
    statement: "Deleting or coarsening sector labels leaves the P7-T02 kernel, P7-T03 protocol syntax, P7-T04 support relations, and per-kernel P7-T06 functional largely intact, while it makes the P7-T05 sector-indexed codomain undefined or less discriminating. Thus sector labels do not generate the dynamics or operational behavior."
