      - "P7-T04 supplies finite Boolean relations but no operator or geometry codomain; P7-T05 requires kappa as input rather than deriving it."
      - "P7-T06 maps a row kernel and a new independent probe q to a symmetric functional; it defines no map from source occupations, bookkeeping states, protocol tokens, or equipped comparisons into q."
      - "No artifact defines the MCB domain assembly, PTMI output, tensorial promotion, or model-to-world interpretation."
