edge_cases:
  - case_id: "empty-family"
    result: "The relation is vacuously an equivalence relation, but the model has no physical or EqSrc content."
  - case_id: "singleton-family"
    result: "C1 supplies reflexivity; any additional accepted loop must still satisfy inverse, composition, congruence, ledger, and negative-control clauses."
  - case_id: "empty-off-diagonal-fiber"
    result: "Cert_src(A,B) may be empty for A not equal to B; the law does not assert that every pair of objects is related."
  - case_id: "multiple-inverses-or-composites"
    result: "Uniqueness is not required. The selected total constructors must be source-defined and compatible modulo equiv_src."
  - case_id: "absent-totality-witness"
    result: "The interpretation fails C1, C2, or C3 and is not a model of the candidate law; symmetry or transitivity is not inferred."
  - case_id: "undefined-negative-control"
    result: "Undefined is block by A4 and the acceptance definition; it cannot be treated as pass."
  - case_id: "coherence-failure"
    result: "A unit, double-inverse, associativity, ledger, or congruence failure violates the candidate law even if the coarse existence relation happens to be an equivalence relation."

