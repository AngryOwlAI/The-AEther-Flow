assumptions:
  - assumption_id: "A1-declared-object-domain"
    clause: "F_src is a declared set of source objects; every object quantified below lies in F_src."
  - assumption_id: "A2-typed-certificate-fibers"
    clause: "For each ordered pair A,B in F_src, Cert_src(A,B) is a source-defined set with disjoint typed endpoint fibers."
  - assumption_id: "A3-closed-source-signature"
    clause: "Every symbol used by formation, acceptance, congruence, ledger, proxy-incidence, negative-control, and provenance rules belongs to the declared source signature Sigma_src; unlisted target or process symbols are not well formed."
  - assumption_id: "A4-total-source-predicates"
    clause: "Every predicate and constructor in Sigma_src has a declared domain and is total on that domain, returning either pass or block where a decision is required."
  - assumption_id: "A5-no-authority-import"
    clause: "Target atlases, target metrics, detector outcomes, benchmark success, generated derivatives, registry metadata, role text, handoffs, validators, and checkpoints cannot occur as premises or constructors in Sigma_src."
  - assumption_id: "A6-source-extension-only"
    clause: "All clauses below are proposed axioms of EqSrcClosureLaw_src^cand v2, not consequences already established from canonical ontology."

closed_typed_source_grammar:
  object_sort:
    notation: "Obj_src"
    family: "F_src subseteq Obj_src"
    formation_rule: "A is admissible in the candidate exactly when A is declared in F_src by source data."
  certificate_sort:
    notation: "Cert_src(A,B)"
    formation_rule: "A certificate w has one declared source domain A, one declared source codomain B, and a provenance term whose inferred endpoints are exactly A and B."
  ledger_domain:
    notation: "Lambda_src"
    formation_rule: "Lambda_src and the protected-annotation projection ell_src: Cert_src(A,B) -> Lambda_src are declared source objects; ledger comparison uses only the declared relation congruent_Lambda."
  proxy_incidence_domain:
    notation: "P_src"
    formation_rule: "Proxy incidence is the declared source relation Inc_src(w,p) on typed certificates and p in P_src; no target reconstruction or observed target success may populate Inc_src."
  negative_control_domain:
    notation: "N_src"
    formation_rule: "N_src is a declared finite family of total source predicates n: Cert_src(A,B) -> {pass,block}; an undefined result is block."
  provenance_term_algebra:
    notation: "Pi_src(A,B)"
    base_terms: "Declared primitive provenance tokens p in Pi_src(A,B) are the only leaves."
    identity_constructor: "id(A) lies in Pi_src(A,A) for every A in F_src."
    inverse_constructor: "If p lies in Pi_src(A,B), inv(p) lies in Pi_src(B,A)."
    composition_constructor: "If p lies in Pi_src(A,B) and q lies in Pi_src(B,C), comp(q,p) lies in Pi_src(A,C)."
    closure_rule: "Pi_src is the least typed term algebra generated by the declared leaves and the three constructors; no other provenance term is well formed."
  certificate_congruence:
    notation: "equiv_src"
    formation_rule: "equiv_src is a declared source equivalence relation within each endpoint fiber and is a congruence for Inv_src and Comp_src."
  no_target_predicate:
    notation: "NoTarget_src"
    formation_rule: "NoTarget_src(x) is true exactly when the syntax tree of x uses only Sigma_src symbols and declared source leaves; any unlisted symbol returns block."
  acceptance_predicate:
    notation: "Accept_src(w)"
    exact_definition: "Accept_src(w) holds exactly when w is correctly endpoint-typed, its provenance is a well-formed Pi_src term with matching endpoints, its ledger annotation satisfies the declared source congruence, its required proxy incidences lie in Inc_src, every n in N_src returns pass, and NoTarget_src(w) is true."
    fail_closed_rule: "Ill typing, missing provenance, missing ledger or proxy evidence, a failed or undefined negative control, or a failed no-target check makes Accept_src(w) false."

formal_repair_clauses:
  - clause_id: "C1-accepted-identity-totality"
    quantifiers: "For every A in F_src."
    statement: "There is a distinguished 1_A in Cert_src(A,A) with provenance id(A), and Accept_src(1_A) is true."
    compatibility:
      - "ell_src(1_A) is the declared neutral ledger annotation for A."
      - "For every accepted w in Cert_src(A,B), Comp_src(w,1_A) equiv_src w."
      - "For every accepted w in Cert_src(A,B), Comp_src(1_B,w) equiv_src w."
  - clause_id: "C2-accepted-inverse-totality"
    quantifiers: "For every A,B in F_src and every w in Cert_src(A,B) such that Accept_src(w)."
    statement: "Inv_src(w) is defined in Cert_src(B,A), has explicit provenance inv(prov_src(w)), and Accept_src(Inv_src(w)) is true."
    compatibility:
      - "Inv_src(Inv_src(w)) equiv_src w."
      - "ell_src(Inv_src(w)) is congruent_Lambda to the declared ledger inverse of ell_src(w)."
      - "Inv_src preserves the declared proxy-incidence and negative-control obligations under endpoint reversal."
  - clause_id: "C3-accepted-composition-totality"
    quantifiers: "For every A,B,C in F_src and every accepted w in Cert_src(A,B) and accepted v in Cert_src(B,C)."
    statement: "Comp_src(v,w) is defined in Cert_src(A,C), has explicit provenance comp(prov_src(v),prov_src(w)), and Accept_src(Comp_src(v,w)) is true."
    compatibility:
      - "ell_src(Comp_src(v,w)) is congruent_Lambda to the declared ledger composite of ell_src(v) and ell_src(w)."
      - "Comp_src preserves the declared proxy-incidence and negative-control obligations."
  - clause_id: "C4-associativity-compatibility"
    quantifiers: "For every composable accepted triple w in Cert_src(A,B), v in Cert_src(B,C), and u in Cert_src(C,D)."
    statement: "Comp_src(u,Comp_src(v,w)) equiv_src Comp_src(Comp_src(u,v),w)."
  - clause_id: "C5-congruence-compatibility"
    quantifiers: "For all accepted certificates in matching endpoint fibers."
    statement: "If w equiv_src w_prime then Inv_src(w) equiv_src Inv_src(w_prime); if w equiv_src w_prime and v equiv_src v_prime then Comp_src(v,w) equiv_src Comp_src(v_prime,w_prime)."
  - clause_id: "C6-ledger-compatibility"
    quantifiers: "For every accepted identity, inverse, and composable pair."
    statement: "The neutral, inverse, and composition ledger operations are total on the corresponding accepted ledger labels, respect congruent_Lambda, and make the unit, double-inverse, and associativity equations hold modulo congruent_Lambda."
  - clause_id: "C7-fail-closed-model-condition"
    quantifiers: "For every proposed interpretation of the candidate."
    statement: "If any universally required accepted witness, provenance term, typing fact, compatibility proof, or total source predicate is absent, that interpretation does not satisfy EqSrcClosureLaw_src^cand v2; no missing item is supplied by default and no positive relation claim follows from that interpretation."

conditional_equivalence_theorem:
  relation_definition: "A sim_cand B iff there exists w in Cert_src(A,B) with Accept_src(w)."
  hypotheses:
    - "F_src and all source-grammar data satisfy assumptions A1 through A6."
    - "Clauses C1 through C7 hold on the declared source family."
  conclusion: "sim_cand is an equivalence relation on F_src."
  proof_sketch:
    reflexivity: "Fix A in F_src. Clause C1 supplies 1_A in Cert_src(A,A) and states Accept_src(1_A), so A sim_cand A."
    symmetry: "Assume A sim_cand B and choose an accepted w in Cert_src(A,B). Clause C2 supplies the accepted Inv_src(w) in Cert_src(B,A), so B sim_cand A."
    transitivity: "Assume A sim_cand B and B sim_cand C and choose accepted w in Cert_src(A,B) and v in Cert_src(B,C). Clause C3 supplies the accepted Comp_src(v,w) in Cert_src(A,C), so A sim_cand C."
    source_purity: "Each witness is produced by a constructor in the least typed source provenance algebra and is accepted only by the closed source predicates; no target or process premise occurs."
    coherence_note: "The unit, double-inverse, associativity, and congruence clauses make the certificate operations coherent, although equivalence of the existence relation itself uses only C1 through C3."

