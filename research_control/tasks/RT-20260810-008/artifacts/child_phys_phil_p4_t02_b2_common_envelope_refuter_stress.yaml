five_branch_stress:
  collapse:
    branch_id: "COLLAPSE-EPSILON-Z-001"
    perturbation: "Set epsilon=0 or z=0 while retaining nonzero u."
    exact_calculation: "Then v_R=v_S=v_D=u and Resp_prin(k)=(a,a,a). The response rank is one, the kernel is ann(u) of dimension three, Q_ray has two zero-dimensional sign sheets, and Q_sign realizes only +++ and ---."
    common_admissibility_status: "The all-positive set {k:k(u)>0} can remain nonempty; collapse of response discrimination is therefore distinct from collapse of common positivity."
    source_operational_reading: "Any law that is intended to traverse this limit needs an explicit noncollapse discriminator or a stratified response rule. RT007 avoids the limit by assumption, so the fixed theorem is not contradicted."
    branch_verdict: "boundary_stratum_exposes_missing_noncollapse_rule"
  nonuniqueness:
    branch_id: "NONUNIQUENESS-FIBERS-001"
    q_ray_fiber: "For K=ann(span{u,z}) and k in D, Q_ray^{-1}(Q_ray(k))={lambda k+eta:lambda>0 and eta in K}."
    q_sign_fiber: "Each Q_sign value is a full open sign chamber in the (a,b) response plane times the two-dimensional kernel K; it discards every continuous response magnitude and ratio."
    presentation_nonuniqueness: "Replacing iota_s by lambda_s iota_s with independent lambda_s>0 preserves Q_sign but generally changes Q_ray and the displayed midpoint-plane equation."
    exact_consequence: "Neither quotient uniquely identifies a source covector, sector vector triple, response-line trivialization, normalization, or measurement protocol."
    branch_verdict: "formal_orbit_label_not_operational_identity"
  inverse_defect:
    branch_id: "INVERSE-LOSS-001"
    q_ray_retains: "one projective coordinate t and one overall sign sheet sigma for the fixed response image"
    q_ray_loses: "two kernel coordinates and one common positive magnitude"
    q_sign_retains: "one ordered sign token among the six realized fixed-candidate cells"
    q_sign_loses: "all response magnitudes, the ratio t, covector data in and transverse to span{u,z}, and relative normalization"
    operational_limit: "The equivalence classes are definitions of discarded formal information, not evidence that the discarded distinctions are physically gauge, empirically indistinguishable, or ontologically irrelevant."
    branch_verdict: "no_inverse_or_physical_equivalence_certificate"
  response_line_transition_and_cocycle_defect:
    branch_id: "Q-RAY-DESCENT-001"
    local_transition: "On an overlap let r'_s=lambda_s r_s with lambda_s>0. For a response triple with every component nonzero, [r']_{R_{>0}}=[r]_{R_{>0}} if and only if lambda_R=lambda_S=lambda_D."
    minimal_overlap_countermodel: "At k=h_0 the fixed response is (1,1,1). The legal positive re-trivialization (lambda_R,lambda_S,lambda_D)=(2,1,1) gives (2,1,1), a different common positive ray while leaving the ordered sign token +++ unchanged."
    midpoint_effect: "Independent factors carry H to r'_R/lambda_R+r'_D/lambda_D=2r'_S/lambda_S; the original equation H is presentation invariant only for a common factor."
    q_ray_descent_requirement: "A source-side line lock must reduce all sector overlap factors to one common positive factor and those common factors must satisfy inverse and triple-overlap cocycle identities."
    q_sign_descent_requirement: "Q_sign tolerates independent positive sector factors only when each sector transition remains nonzero, sign preserving, inverse compatible, and cocyclic. This weaker descent supplies no magnitude or physical unit law."
    certificate_status: "No inconsistent global bundle is claimed by RT007 because only fixed local trivializations are supplied. The exact defect is absence of a presentation-independence certificate for any operational Q_ray overread."
    branch_verdict: "q_ray_fails_independent_positive_retrivialization_descent"
  finite_variation_fragility:
    branch_id: "TRANSVERSE-DELTA-W-001"
    construction: "Choose w in ker(h_0) outside span{z}. For any nonzero delta set v_R(delta)=u+epsilon z+delta w, v_S(delta)=u, and v_D(delta)=u-epsilon z."
    arbitrary_smallness: "In finite dimension delta may tend to zero in any auxiliary source-coordinate norm; no target or physical norm is used."
    positivity_result: "h_0(v_R(delta))=h_0(v_S(delta))=h_0(v_D(delta))=1 for every delta, so the supplied common-positive witness survives exactly."
    rank_result: "For every delta not equal to zero, u,z,w are independent and the response map has rank three with kernel dimension one."
    midpoint_defect: "r_R+r_D-2r_S=delta k(w), which is not identically zero."
    sign_result: "Surjectivity onto R^3 realizes all eight nonzero ordered sign cells, including the two alternating cells excluded by the fixed midpoint plane."
    codimension_result: "The relation v_R+v_D=2v_S is the kernel of a surjective linear map V^3->V. In four dimensions it is a codimension-four subspace and is not open under unrestricted independent sector variation."
    branch_verdict: "common_positivity_stable_but_midpoint_quotient_classifier_fragile"

