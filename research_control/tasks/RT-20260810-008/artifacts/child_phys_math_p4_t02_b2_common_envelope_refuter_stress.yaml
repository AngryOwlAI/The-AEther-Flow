fixed_candidate_snapshot:
  source_space: "V=T_x U with dim(V)=4"
  covector_space: "V*=T_x^* U"
  supplied_data: "h_0 in V*, u in V with h_0(u)=1, nonzero z in ker(h_0), epsilon=1/3"
  sector_vectors:
    R: "v_R=u+epsilon z"
    S: "v_S=u"
    D: "v_D=u-epsilon z"
  response_coordinates: "a=k(u), b=k(z), Resp_0(k)=(a+epsilon b,a,a-epsilon b)"
  response_image: "H={r in L_0^3:r_R+r_D=2r_S}"
  response_rank: 2
  response_kernel: "K=ann(span{u,z})"
  response_kernel_dimension: 2
  positive_ray_atlas: "(sigma,t) with sigma=sgn(a), t=epsilon b/a, t not in {-1,+1}"
  positive_ray_dimension_per_sheet: 1
  positive_ray_sheet_count: 2
  realized_nonzero_sign_cells: ["---", "--+", "-++", "+--", "++-", "+++"]
  common_positive_cone: "Gamma_cap={k:a>epsilon|b|}"
  fixed_candidate_verdict: "Every displayed RT007 statement above remains exact under its declared fixed-data assumptions. The stress does not refute or rewrite those theorems."

stress_branches:
  collapse:
    status: "exact_boundary_collapse"
    construction: "Set epsilon=0 with u fixed, or set z=0, so v_R=v_S=v_D=u and Resp_col(k)=(a,a,a)."
    assumption_scope: "This is a boundary degeneration of the split-family assumptions, not a counterexample inside the fixed epsilon=1/3, z nonzero candidate."
    image: "Delta={lambda(1,1,1):lambda in R}"
    rank: 1
    kernel: "ann(span{u})"
    kernel_dimension: 3
    positive_ray_image: "Two isolated positive rays, [1,1,1]_+ and [-1,-1,-1]_+; continuous dimension zero and two sign sheets."
    sign_image: ["+++", "---"]
    product_polynomial: "P_col(k)=a^3"
    common_positive_cone: "{k:a>0}"
    preserved_result: "Product hyperbolicity, nonempty strict common positivity, and the appropriately collapsed all-positive preimage identities survive."
    failed_extension: "Rank two, the one-dimensional t coordinate, and the six-cell sign image do not extend through the collapse point. Rank drops discontinuously when epsilon z reaches zero."

  nonuniqueness:
    status: "exact_representation_nonuniqueness"
    formal_line_rescaling: "Replace each bookkeeping isomorphism iota_s by iota'_s=lambda_s iota_s with lambda_s>0."
    q_sign_result: "Q_sign is identical for every positive triple (lambda_R,lambda_S,lambda_D), so it cannot select any unique relative response-line normalization."
    q_ray_result: "Q_ray is identical for every common positive rescaling lambda_R=lambda_S=lambda_D, so it retains at least the unavoidable common-normalization nonuniqueness."
    exact_information_limit: "A Q_sign value retains only one of six sign cells; a Q_ray value retains only sigma and t. Neither value selects unique formal trivializations, a covector request, empirical units, or physical normalization."
    preserved_result: "Nonuniqueness of the quotient representation does not alter the fixed response-plane, sign-cell, or all-positive-preimage theorems."

  inverse_defect:
    status: "exact_noninjectivity"
    full_response_fiber: "For k_0 in V*, Resp_0^{-1}(Resp_0(k_0))=k_0+K, where K=ann(span{u,z}) has dimension two."
    positive_ray_fiber: "For k_0 in D, Q_ray^{-1}(Q_ray(k_0))={lambda k_0+eta:lambda>0, eta in K}; this is a three-parameter fiber."
    sign_fiber: "For a realized sign cell c, Q_sign^{-1}(c) is the nonempty intersection of three strict signed half-spaces in V*. It is a full four-dimensional open cone, equivalently an open two-dimensional response cone lifted by the two-dimensional kernel K."
    exact_loss:
      - "Resp_0 loses the two annihilator directions before either quotient."
      - "Q_ray additionally loses one common positive magnitude."
      - "Q_sign additionally loses the continuous ray coordinate t and all magnitudes."
    inverse_conclusion: "No inverse from either quotient value to k exists under the proposal data. The fibers are information loss, not a proved gauge orbit or empirical equivalence class."

  positive_line_trivialization_and_cocycle_descent:
    status: "exact_descent_obstruction"
    overlap_model: "On an overlap U_alpha intersect U_beta, let relabelled coordinates transform as r_s^(beta)=g_s^(alpha_beta) r_s^(alpha), with every g_s^(alpha_beta)>0."
    q_sign_descent_condition: "Q_sign is overlap-invariant under independent positive sector factors, provided each sector transition is invertible and satisfies its triple-overlap cocycle."
    q_ray_descent_condition: "On D, Q_ray is overlap-invariant for every response if and only if g_R^(alpha_beta)=g_S^(alpha_beta)=g_D^(alpha_beta)=g^(alpha_beta)>0. The common factors must themselves satisfy the overlap cocycle."
    necessity_proof: "The realized response (1,1,1) has the same positive ray after a diagonal transition only when (g_R,g_S,g_D) is a positive multiple of (1,1,1)."
    midpoint_plane_condition: "A diagonal transition preserves H={r_R+r_D=2r_S} as the same coordinate plane if and only if its three positive factors are equal. Under general factors the transported plane is r'_R/g_R+r'_D/g_D=2r'_S/g_S."
    arbitrarily_small_transition_counterexample:
      parameter: "rho>0"
      transition: "(g_R,g_S,g_D)=(1+rho,1,1)"
      witness: "k=h_0, whose fixed response is (1,1,1)"
      transformed_response: "(1+rho,1,1)"
      midpoint_residual: "rho"
      q_ray_effect: "[(1+rho,1,1)]_+ differs from [(1,1,1)]_+ for every rho>0."
      q_sign_effect: "Both responses remain in the +++ sign cell."
      limit: "rho may be arbitrarily small, so fixed-representative Q_ray descent is not secured by positivity alone."
    cocycle_defect: "If g_s^(alpha_beta) g_s^(beta_gamma) differs from g_s^(alpha_gamma), no coherent sector-line descent datum exists. Positivity may preserve local signs but does not repair the missing globalization certificate."
    fail_closed_cases:
      - "A negative factor changes oriented sign data."
      - "A zero factor is not a line isomorphism and may leave D."
      - "A singular source map, missing inverse, or failed cocycle blocks globalization."

  arbitrarily_small_unstructured_finite_variation:
    status: "minimal_source_local_countermodel"
    auxiliary_choice: "Choose w in ker(h_0) linearly independent of z; then u,z,w are linearly independent."
    perturbation: "v_R(delta)=u+epsilon z+delta w, v_S(delta)=u, v_D(delta)=u-epsilon z, with delta nonzero and arbitrarily small."
    response_coordinates: "a=k(u), b=k(z), c=k(w)"
    perturbed_response: "Resp_delta(k)=(a+epsilon b+delta c,a,a-epsilon b)"
    coefficient_matrix: "[[1,epsilon,delta],[1,0,0],[1,-epsilon,0]]"
    determinant: "-epsilon*delta"
    rank_for_nonzero_delta: 3
    kernel_for_nonzero_delta: "ann(span{u,z,w})"
    kernel_dimension_for_nonzero_delta: 1
    midpoint_residual: "r_R+r_D-2r_S=delta c"
    response_image_for_nonzero_delta: "L_0^3"
    positive_ray_image_for_nonzero_delta: "All positive rays with three nonzero coordinates; two continuous projective dimensions across eight sign components."
    sign_image_for_nonzero_delta: ["---", "--+", "-+-", "-++", "+--", "+-+", "++-", "+++"]
    common_positivity_preserved: "Because h_0(w)=h_0(z)=0 and h_0(u)=1, all three perturbed evaluations at h_0 equal one for every delta. The common-positive cone remains nonempty, open, and convex; for sufficiently small delta the prior strict-margin argument persists by continuity."
    product_hyperbolicity_preserved: "The three factors remain real oriented degree-one forms with p_s(h_0)=1, so their finite product remains hyperbolic with respect to h_0."
    smallness_statement: "For any auxiliary finite-dimensional norm and any eta>0, choose 0<|delta|<eta/||w||. Then only one sector changes, by less than eta, while rank rises from two to three and both alternating sign cells become realizable. The auxiliary norm is a calculation device, not physical structure."
    minimality_statement: "One scalar perturbation in one sector along one new source direction is the smallest number of changed sectors and new independent directions that can raise the response span from two to three."
    codimension_calculation:
      ambient_map: "F:V^3->V, F(v_R,v_S,v_D)=v_R+v_D-2v_S, is surjective."
      ambient_midpoint_codimension: 4
      normalized_affine_space: "A_h0={(v_R,v_S,v_D):h_0(v_R)=h_0(v_S)=h_0(v_D)=1}, of dimension nine."
      normalized_tangent_codomain: "F maps the tangent space (ker h_0)^3 surjectively to ker h_0, of dimension three."
      normalized_midpoint_codimension: 3
      conclusion: "The exact midpoint family has empty interior under arbitrary independent normalized sector variation. It is robust only relative to the structured midpoint-preserving subspace."

