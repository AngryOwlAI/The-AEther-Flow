    invertible: false
    purpose: "Discrete algebraic specialization and finite quotient-descent witness."
    authority_note: "Not a continuous R_ge_0 instance and not a physical discretization."

exceptional_case_matrix:
  - case_id: "CONTINUOUS"
    admitted_by_mainline: true
    disposition: "Selected R_ge_0 mainline with joint continuity."
    nonconclusion: "No physical clock rate generator or evolution."
  - case_id: "DISCRETE"
    admitted_by_mainline: false
    disposition: "N_0 specialization; equivalence to the continuous law needs a separate extension theorem."
    nonconclusion: "A step label is not a physical time interval."
  - case_id: "PERIODIC"
    admitted_by_mainline: true
    disposition: "Allowed when Phi_p(q)=q for some p>0."
    nonconclusion: "p is not established as an observed physical period."
  - case_id: "BI_INFINITE"
    admitted_by_mainline: false
    disposition: "Requires a separately proved R-action extension on an invariant subdomain."
    nonconclusion: "Backward physical evolution and reversibility do not follow."
  - case_id: "DENSE"
    admitted_by_mainline: true
    disposition: "Compatible with a continuous orbit, including torus examples."
    nonconclusion: "Density does not establish ergodicity physical topology or a clock."
  - case_id: "BRANCHING"
    admitted_by_mainline: false
    disposition: "Excluded by the single-valued action; would require a relation, multiflow, or category extension."
    nonconclusion: "Exclusion from this candidate is not a global impossibility theorem."
  - case_id: "STOCHASTIC"
    admitted_by_mainline: false
    disposition: "Excluded by the deterministic action; would require transition kernels and a Chapman-Kolmogorov law."
    nonconclusion: "No probability noise measurement or stochastic physics is inferred."

