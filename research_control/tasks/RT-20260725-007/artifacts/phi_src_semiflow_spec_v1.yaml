  conventional_name: "topological_semiflow"
  parameter_object:
    notation: "Lambda_+"
    carrier: "R_ge_0"
    operation: "addition"
    identity: 0
    order: "usual_total_order"
    topology: "euclidean"
    algebraic_type: "commutative_ordered_topological_monoid"
