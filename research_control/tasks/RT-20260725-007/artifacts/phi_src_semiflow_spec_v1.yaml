  state_object:
    notation: "Q_adm"
    type: "P5-T01 admissible source-configuration space"
    topology: "declared source-only topology T_adm"
    target_defined: false
  action:
    notation: "Phi_src: Lambda_+ x Q_adm -> Q_adm"
    orientation: "conventional left action: apply mu then lambda equals Phi_(lambda+mu) = Phi_lambda after Phi_mu"
    functional: true
    deterministic: true

axioms:
  - axiom_id: "S1_IDENTITY"
    statement: "Phi_0(q)=q for every q in Q_adm."
  - axiom_id: "S2_FORWARD_COMPOSITION"
    statement: "Phi_(lambda+mu)(q)=Phi_mu(Phi_lambda(q)) for all nonnegative lambda and mu."
  - axiom_id: "S3_ADMISSIBILITY"
    statement: "Phi_lambda(q) belongs to Q_adm for every lambda and admissible q."
  - axiom_id: "S4_REDUNDANCY_COMPATIBILITY"
    statement: "q ~_red q' implies Phi_lambda(q) ~_red Phi_lambda(q') for every lambda."
  - axiom_id: "S5_JOINT_CONTINUITY"
    statement: "The map (lambda,q) |-> Phi_lambda(q) is continuous for the Euclidean and declared source-only topologies."

theorem_payload:
  - theorem_id: "P5-T02-THM-QUOTIENT-DESCENT"
    title: "Redundancy-quotient descent"
    hypotheses:
      - "S1 identity"
      - "S2 forward composition"
      - "S4 redundancy compatibility"
    conclusion: "bar_Phi_lambda([q])=[Phi_lambda(q)] is a unique well-defined unital forward monoid action on Q_adm/~_red."
    continuity_clause:
      claimed_unconditionally: false
      additional_hypothesis: "id_Lambda x quotient_projection is a quotient map; an open quotient projection is one sufficient condition."
      conclusion_with_hypothesis: "The induced quotient action is continuous."
    proof_status: "proved_in_task_local_tex"
    status_scope: "draft/control mathematical result"
  - theorem_id: "P5-T02-THM-REPARAMETERIZATION"
    title: "Continuous additive order-preserving reparameterization classification"
    hypotheses:
      - "r:R_ge_0->R_ge_0 is continuous"
      - "r is additive and maps 0 to 0"
      - "r is order-preserving"
    conclusion: "r(lambda)=c lambda for one c>=0; it is a monoid automorphism exactly when c>0."
    physical_nonconclusion: "The action laws do not select c, a unit, rate normalization, or physical clock."
    proof_status: "proved_in_task_local_tex"
    status_scope: "draft/control mathematical result"

