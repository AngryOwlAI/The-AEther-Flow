      source-only topological configuration space Q_adm as the narrowest
      deterministic forward semantic kind.
  - finding_id: "MATH-PHI-002"
    status: "accepted_child_recommendation"
    summary: >-
      Require admissibility and Red_src orbit compatibility; these conditions
