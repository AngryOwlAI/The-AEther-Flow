      quotient topology.
  - finding_id: "MATH-PHI-003"
    status: "accepted_child_recommendation"
    summary: >-
      Continuous additive order-preserving reparameterizations are exactly
      positive scalings for automorphisms, so the candidate leaves clock
      normalization undetermined.
  - finding_id: "MATH-PHI-004"
    status: "accepted_child_recommendation"
    summary: >-
      The absorbing-amplitude witness proves consistency with genuine
