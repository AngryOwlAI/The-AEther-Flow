  - finding_id: "MATH-PHI-005"
    status: "accepted_child_recommendation"
    summary: >-
      Periodic and dense orbits fit within the action; bi-infinite,
      branching, and stochastic structures require additional independently
      typed assumptions or a distinct candidate family.

