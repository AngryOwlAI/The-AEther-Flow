    object_name: "equivariant-family nonselection lemma"
    statement: "Let C_plus and C_minus be exchanged by reflection and let Sel(sigma)=C_sigma. The equality Sel(-sigma)=-Sel(sigma) proves equivariance of the indexed family, but no reflection-invariant absolute choice of one member follows."
    proof: "Reflection maps C_plus bijectively to C_minus and the sets are distinct. An absolute member fixed by reflection would have to equal its reflected opposite, contradicting C_plus != C_minus. Supplying sigma removes the contradiction by transporting the index, not by deriving an index value."
    philosophical_payload: "Naturality can coordinate alternatives without explaining which alternative is actual. Reflection equivariance is therefore quarantine against presentation dependence, not evidence for occurrence or hidden symmetry breaking."
    sharp_falsifier: "A separately derived source asymmetry or occurrence law that fixes one sigma from current ontology would invalidate the present nonselection premise and upgrade the explanation; none is supplied here."
