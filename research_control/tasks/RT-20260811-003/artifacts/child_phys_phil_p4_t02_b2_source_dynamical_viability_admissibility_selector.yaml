    object_name: "certificate-selector separation lemma"
    statement: "For fixed sigma, varying Delta>0 or a_star>0 changes R_Delta granularity, b_sigma, and lambda_Delta but leaves U_sigma and Sel_src(sigma) unchanged."
    proof: "U_sigma and Sel_src depend only on the sign of sigma*a. Neither definition contains Delta or a_star. These parameters occur only in the successor packaging and normalized barrier certificate."
    philosophical_payload: "Delta and a_star preload certificate form, not branch identity. Treating either as physical time or scale would add interpretation not present in their mathematical role."
    sharp_falsifier: "Any future definition of U_sigma or Sel_src that depends on Delta, a_star, a target cone, or empirical success would falsify this separation and trigger goal-filtering review."
    claim_status: "draft/control"
    burden_effect: "narrows"
