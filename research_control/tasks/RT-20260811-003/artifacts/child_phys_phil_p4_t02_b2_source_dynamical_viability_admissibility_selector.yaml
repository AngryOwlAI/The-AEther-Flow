    object_name: "component-occurrence granularity proposition"
    statement: "Sel_src(sigma)=C_sigma reduces two viable components to one but cannot select a point or probability measure because every a in C_sigma remains compatible with the same selector output."
    proof: "Sel_src is constant on the continuum C_sigma as a component label. Distinct a_1 and a_2 in C_sigma therefore have identical selected-component status, and no weights are assigned."
