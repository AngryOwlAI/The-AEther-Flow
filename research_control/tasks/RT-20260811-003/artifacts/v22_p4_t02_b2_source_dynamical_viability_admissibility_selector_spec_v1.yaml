formal_domains:
  source_state_domain: "X_src=Q_amp identified with R by q_a<->a"
  nonzero_domain: "X_src^x=R\\{0}=C_+ disjoint_union C_-"
  parameter_domain: "gamma>0, Delta>0, a_star>0, sigma in {+1,-1}"
  time_domain: "T=R_{>=0}; one-step generators use 0<=t<=Delta"
  ordered_exact_domain: "positive real algebraic expressions with rational exact fixtures in the squared-amplitude chart"
  admissible_domain: "U_sigma=C_sigma={a:sigma*a>0}"
  transition_domain: "R_Delta(a)={phi_t(a):0<=t<=Delta}"
  viability_domain: "universal quantification over every finite R_Delta path"
  occurrence_domain: "Sel_src(sigma)=C_sigma; no point-valued or probabilistic initial-state law is claimed"
  covariance_domain: "positive amplitude and time regraduations plus reflection transport of the full candidate data"
  excluded_inputs:
