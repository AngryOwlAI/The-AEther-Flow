  - object_id: "BOUNDED-STEP-SUCCESSOR-RELATION"
    notation: "R_Delta"
    definition: "All Phi_gamma(t) successors with 0<=t<=Delta."
  - object_id: "NONZERO-COMPONENT-DOMAIN"
    notation: "X_src^x=C_+ disjoint_union C_-"
    definition: "The two sign components of the nonzero amplitude line."
  - object_id: "SOURCE-ORIENTATION-TOKEN"
    notation: "sigma"
    definition: "A proposal-only two-valued component-selection datum."
  - object_id: "SOURCE-ADMISSIBLE-DOMAIN"
    notation: "U_sigma"
    definition: "The selected sign component {a:sigma*a>0}."
  - object_id: "NORMALIZED-SOURCE-BARRIER"
    notation: "b_sigma(a)=sigma*a/sqrt(a_star^2+a^2)"
    definition: "A bounded exact positive certificate with U_sigma={b_sigma>0}."
  - object_id: "VIABILITY-KERNEL"
    notation: "Viab_{R_Delta}(U_sigma)"
    definition: "States whose every finite admitted successor path remains in U_sigma."
  - object_id: "SOURCE-COMPONENT-SELECTOR"
    notation: "Sel_src(sigma)=C_sigma"
    definition: "An equivariant component selector that does not select an amplitude point or probability law."
  - object_id: "DIAGNOSTIC-ONLY-READOUT"
    notation: "Diag_OM"
    definition: "Optional post-selection diagnostic with no occurrence stability physical or empirical authority."

formal_maps:
  - map_id: "SOURCE-EVOLUTION"
    signature: "Phi_gamma:R_{>=0} x R -> R"
    rule: "Phi_gamma(t,a)=a/sqrt(1+2*gamma*t*a^2)"
  - map_id: "SUCCESSOR-GENERATOR"
    signature: "R_Delta:R -> P(R)"
    rule: "R_Delta(a)={Phi_gamma(t,a):0<=t<=Delta}"
  - map_id: "BARRIER-EVALUATION"
    signature: "b_sigma:R -> (-1,1)"
    rule: "b_sigma(a)=sigma*a/sqrt(a_star^2+a^2)"
  - map_id: "VIABILITY-CONSTRUCTION"
    signature: "Viab_{R_Delta}:P(R)->P(R)"
    rule: "universal finite-path viability"
  - map_id: "COMPONENT-SELECTION"
    signature: "Sel_src:{+1,-1}->pi_0(R\\{0})"
    rule: "Sel_src(sigma)=C_sigma"
  - map_id: "REFLECTION-TRANSPORT"
    signature: "J:(a,sigma)->(-a,-sigma)"
    rule: "intertwines Phi_gamma and preserves the barrier value"
  - map_id: "POSITIVE-REGRADUATION"
    signature: "(a,a_star,gamma,t,Delta)->(d*a,d*a_star,gamma/(c*d^2),c*t,c*Delta)"
    rule: "simultaneous amplitude and time regraduation preserves gamma*t*a^2 and gamma*Delta*a_star^2"
  - map_id: "DIAGNOSTIC-EVALUATION"
    signature: "Diag_OM:X_src->Bridge_OM outputs"
    rule: "evaluate only after independent source selection and evolution"

theorems:
  - theorem_id: "THM-V22-P4T02-B2-NORMALIZED-BARRIER-PROPAGATION-001"
    status: "proved_conditionally"
    statement: "For every a in U_sigma and 0<=t<=Delta, b_sigma(Phi_gamma(t,a))>=lambda*b_sigma(a)>0 with lambda=(1+2*gamma*Delta*a_star^2)^(-1/2)."
  - theorem_id: "THM-V22-P4T02-B2-EXACT-VIABILITY-KERNEL-001"
    status: "proved_conditionally"
    statement: "Viab_{R_Delta}(U_sigma)=U_sigma, and b_sigma(a_n)>=lambda^n*b_sigma(a_0) on every finite admitted path."
  - theorem_id: "THM-V22-P4T02-B2-OCCURRENCE-VIABILITY-INDEPENDENCE-001"
    status: "proved_conditionally"
    statement: "Removing sigma leaves two viable components and no selector; adding sigma without restricting sign-flipping successors selects but does not protect."
  - theorem_id: "THM-V22-P4T02-B2-REFLECTION-EQUIVARIANT-COMPONENT-SELECTION-001"
    status: "proved_conditionally"
    statement: "J maps the sigma candidate to the -sigma candidate, intertwines the flow, maps U_sigma to U_-sigma, and satisfies b_-sigma(-a)=b_sigma(a)."
  - theorem_id: "THM-V22-P4T02-B2-POSITIVE-REGRADUATION-COVARIANCE-001"
    status: "proved_conditionally"
    statement: "Positive amplitude/time regraduations preserve the normalized barrier, gamma*Delta*a_star^2, lambda, and the selected-component structure when all proposal data are transported."
  - theorem_id: "THM-V22-P4T02-B2-FROZEN-DIAGNOSTIC-NONFACTORIZATION-001"
    status: "proved_by_provenance"
    statement: "Sel_src and R_Delta are fixed before and without any output of the four frozen families; optional Diag_OM is downstream-only and has no selector force."

