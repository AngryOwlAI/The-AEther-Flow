formal_maps:
  source_flow:
    signature: "phi^gamma:R_{>=0} x R -> R"
    rule: "phi_t^gamma(a)=a/sqrt(1+2*gamma*t*a^2)"
  bounded_successor_relation:
    signature: "R_Delta:R -> P(R)"
    rule: "R_Delta(a)={phi_t^gamma(a):0<=t<=Delta}"
  lifted_flow:
    signature: "phi_hat_t:R x {+1,-1}->R x {+1,-1}"
    rule: "phi_hat_t(a,sigma)=(phi_t^gamma(a),sigma)"
  normalized_barrier:
    signature: "b_sigma:R->(-1,1)"
    rule: "b_sigma(a)=sigma*a/sqrt(a_star^2+a^2)"
  viability_kernel:
    signature: "Viab_{R_Delta}:P(R)->P(R)"
    rule: "States in U whose every finite R_Delta path stays in U."
  component_selection:
    signature: "Sel_src:{+1,-1}->pi_0(R-minus-{0})"
    rule: "Sel_src(sigma)=U_sigma"
  reflection_transport:
    signature: "J:R x {+1,-1}->R x {+1,-1}"
    rule: "J(a,sigma)=(-a,-sigma)"
  positive_regraduation:
    signature: "G_{c,d}:(a,t,gamma,Delta,a_star,sigma)->(d*a,c*t,gamma/(c*d^2),c*Delta,d*a_star,sigma), c,d>0"
    rule: "Transport the entire proposal record, rather than holding dimensionful coordinates fixed."

theorem_bundle:
  - theorem_id: "THM-V22-P4T02-B2-CUBIC-SEMIFLOW-AND-REACHABILITY-001"
    status: "proved_conditionally"
    hypotheses: "gamma>0 and Delta>0."
    statement: "The flow is total on R for every t>=0, phi_s(phi_t(a))=phi_{s+t}(a), and the transitive closure of R_Delta from a is {phi_T(a):T>=0}. For sigma*a>0 this reachable set is {y:0<sigma*y<=sigma*a}."
    proof:
      - "The positive denominator gives totality, and the inherited P5 algebra gives the semigroup identity."
      - "Every finite path composes to total time T=sum t_i. Conversely, Delta>0 lets every T>=0 be split into finitely many increments in [0,Delta]."
      - "The magnitude |phi_T(a)| decreases continuously from |a| toward zero and never reaches zero at finite T."

  - theorem_id: "THM-V22-P4T02-B2-NORMALIZED-BARRIER-PROPAGATION-001"
    status: "proved_conditionally"
    hypotheses: "gamma>0, Delta>0, a_star>0, sigma*a>0, and 0<=t<=Delta."
    statement: "b_sigma(phi_t^gamma(a))>=lambda*b_sigma(a)>0, where lambda=(1+2*gamma*Delta*a_star^2)^(-1/2). The factor lambda is the greatest uniform lower bound over all finite a in U_sigma and t in [0,Delta], although equality is not attained at finite a."
    exact_proof:
      substitutions: "A=a_star^2>0, u=a^2>0, c=2*gamma*t, C=2*gamma*Delta."
      ratio_identity: "b_sigma(phi_t(a))^2/b_sigma(a)^2=(A+u)/(A+u+c*A*u)."
      comparison: "(A+u)*(1+C*A)-(A+u+c*A*u)=A*(C*A+(C-c)*u)>0."
      conclusion: "The ratio squared is greater than or equal to 1/(1+C*A)=lambda^2; positivity permits the square root. At t=Delta and u->infinity the ratio tends to lambda, proving sharpness."

  - theorem_id: "THM-V22-P4T02-B2-EXACT-VIABILITY-KERNEL-001"
    status: "proved_conditionally"
    hypotheses: "The candidate roots and finite-path viability definition."
    statement: "Viab_{R_Delta}(U_sigma)=U_sigma. Every n-step path obeys b_sigma(a_n)>=lambda^n*b_sigma(a_0)>0."
    proof:
      - "Flow sign preservation puts every successor of U_sigma back in U_sigma, so every selected state is viable."
      - "The viability kernel is defined as a subset of U_sigma, giving the reverse inclusion."
      - "Iterating the one-step barrier theorem proves the n-step bound."
    asymptotic_limit: "lambda^n tends to zero and phi_T(a) tends to zero as n or T tends to infinity. Thus exact open-set viability does not provide a positive uniform infinite-horizon margin or closed-set robustness."

  - theorem_id: "THM-V22-P4T02-B2-UNIQUE-TOKEN-RELATIVE-COMPONENT-SELECTION-001"
    status: "proved_conditionally"
    hypotheses: "The ordinary topology on Q_amp and sigma in {+1,-1}."
    statement: "R-minus-{0} has exactly two connected flow-invariant components C_+ and C_-. For each supplied sigma, U_sigma is the unique component satisfying sigma*a>0, so Sel_src(sigma)=U_sigma is single valued."
    proof:
      - "The connected components of the punctured real line are its two open half-lines."
      - "The cubic flow preserves sign at every finite time."
      - "Exactly one half-line satisfies the token predicate."
    nonconclusion: "No amplitude point within U_sigma and no probability law is selected."

  - theorem_id: "THM-V22-P4T02-B2-OCCURRENCE-VIABILITY-INDEPENDENCE-001"
    status: "proved_conditionally"
    statement: "Viability and component occurrence are independent: deleting sigma leaves both sign components viable but selects neither; retaining sigma while admitting a sign-flip successor selects a component but makes its viability kernel empty."
    proof:
      - "Without sigma the reflection exchanges two equally viable components, and an equivariant selector from a trivial input would require a reflection-fixed component, which does not exist."
      - "With sigma fixed, a successor a->-a takes every a in U_sigma outside U_sigma."

  - theorem_id: "THM-V22-P4T02-B2-REFLECTION-TRANSPORT-001"
    status: "proved_conditionally"
    statement: "J intertwines the lifted flow, maps U_sigma to U_{-sigma}, satisfies b_{-sigma}(-a)=b_sigma(a), and transports Sel_src(sigma) to Sel_src(-sigma)."
    proof: "The cubic flow is odd, and both signs in (-sigma)*(-a) cancel. Reflection is a candidate-record isomorphism, not declared source redundancy or physical gauge."

  - theorem_id: "THM-V22-P4T02-B2-POSITIVE-REGRADUATION-COVARIANCE-001"
    status: "proved_conditionally"
    hypotheses: "c>0 and d>0."
    statement: "d*phi_t^gamma(a)=phi_{c*t}^{gamma/(c*d^2)}(d*a); R_Delta transports to R_{c*Delta}; b_sigma is invariant when a_star transports to d*a_star; and gamma*Delta*a_star^2 and lambda are invariant."
    proof:
      - "Substitution gives 2*(gamma/(c*d^2))*(c*t)*(d*a)^2=2*gamma*t*a^2."
      - "Both numerator and denominator of b_sigma acquire the same positive factor d."
      - "The transformed dimensionless product is (gamma/(c*d^2))*(c*Delta)*(d*a_star)^2=gamma*Delta*a_star^2."
    precision: "This is covariance between transported proposal records, not invariance of fixed numerical roots and not a physical unit calibration. Negative d is reflection composed with positive regraduation and requires sigma to flip."

  - theorem_id: "THM-V22-P4T02-B2-FROZEN-DIAGNOSTIC-NONFACTORIZATION-001"
    status: "proved_at_declared_provenance_scope"
    statement: "The candidate definitions use only the amplitude flow and explicit roots; shared tau, Q_ray, common-character data, and Bridge_OM outputs are absent and cannot select sigma or R_Delta. Any optional diagnostic D that omits sigma cannot factor Sel_src because the same amplitude record with sigma=+1 and sigma=-1 has the same D value but different selected components."
    precision: "For frozen objects not typed on Q_amp, factorization is ill typed rather than disproved as an abstract statement about every possible extension."

edge_and_countermodel_suite:
  - case_id: "CM-GAMMA-NEGATIVE"
    input: "gamma<0"
    exact_result: "For any Delta>0, sufficiently large nonzero |a| reaches a zero denominator before Delta, so no total R_Delta exists on all R."
  - case_id: "CM-GAMMA-ZERO"
    input: "gamma=0"
    exact_result: "The identity flow preserves both components and the barrier with lambda=1 but fails the inherited nontrivial cubic-dynamics root."
  - case_id: "CM-HORIZON-ZERO"
    input: "Delta=0"
    exact_result: "R_Delta is identity only and the proof is vacuous; the strict root Delta>0 supplies a nontrivial step family."
  - case_id: "CM-HORIZON-UNBOUNDED"
    input: "one-step times t>=0 with no finite Delta"
    exact_result: "Sign viability remains exact, but the infimum of the barrier ratio is zero, so no state-independent lambda>0 exists."
  - case_id: "CM-ANCHOR-ZERO"
    input: "a_star=0"
    exact_result: "The printed barrier is undefined at a=0 and becomes a discontinuous sign on the punctured line; it is not the declared total continuous normalized barrier."
  - case_id: "CM-ANCHOR-NEGATIVE-PRECISION"
    input: "a_star<0"
    exact_result: "Because only a_star^2 occurs, the theorem is unchanged after replacing a_star by |a_star|. Negativity is redundant parameterization, not a mathematical barrier failure; the positive root removes this redundancy."
  - case_id: "CM-SIGMA-ABSENT"
    input: "No orientation token"
    exact_result: "Two reflection-related viable components remain and no reflection-equivariant component choice exists."
  - case_id: "CM-SIGMA-AFTER-DIAGNOSTIC"
    input: "Choose sigma using desired Bridge_OM or physical output"
    exact_result: "This is forbidden goal-property or target preload even though the subsequent algebra is correct."
  - case_id: "CM-SIGN-FLIP-SUCCESSOR"
    input: "Add a->-a to R_Delta while holding sigma fixed"
    exact_result: "Every selected state has an admitted successor outside U_sigma; the viability kernel is empty."
  - case_id: "CM-FIXED-TOKEN-REFLECTION"
    input: "Reflect a but not sigma"
    exact_result: "The transformed state leaves U_sigma; covariance requires transport of the full pair (a,sigma)."
  - case_id: "CM-EXACT-POINT-NONSELECTION"
    input: "Ask which a in U_sigma occurs"
    exact_result: "The candidate supplies no point-valued initial-state law; every amplitude in the selected component remains possible."

