  audit_conclusion: "The core conditional theorem is source-only and survives the audit. It supplies no instance and no physical causal interpretation."

uniqueness_addendum:
  source_sentence_scope: "Any other family with the same reduced local hypersurfaces differs locally by nowhere-zero units."
  audit_result: "FAIL_SCOPE_OVERCLAIM"
  finding_id: "AUD-V22-P4T02-UNIQUENESS-001"
  defect: "Equality of real projective zero sets does not imply unit association of homogeneous generators."
  counterexample:
    source_covector_space: "R4 with coordinates (k0,k1,k2,k3)"
    first_generator: "P(k)=k0"
    second_generator: "Q(k)=k0*(k0^2+k1^2)"
    homogeneous_degrees:
      - 1
      - 3
    both_square_free_over_R: true
    same_real_projective_zero_set: true
    equality_reason: "Q=0 iff k0=0 or k0^2+k1^2=0; the second real locus has k0=k1=0 and is contained in k0=0."
    quotient: "Q/P=k0^2+k1^2"
    quotient_is_nowhere_zero_unit: false
    decisive_point: "The quotient vanishes whenever k0=k1=0 and also depends on the covector, so it is not an overlap source unit."
  repair_options:
    - "Delete or weaken the uniqueness-from-real-zero-set sentence."
    - "Retain uniqueness only when explicit nowhere-zero unit association is supplied."
    - "If recovering generators from ideals, require equality of appropriate locally principal characteristic ideals and a minimal-generator convention in a ring where equal principal ideals imply unit association."
  effect_on_core_theorem: "none; the core gluing theorem already assumes explicit unit and cocycle data"
  effect_on_descriptor_instance: "blocks reliance on the uniqueness addendum and strengthens future construction evidence"

