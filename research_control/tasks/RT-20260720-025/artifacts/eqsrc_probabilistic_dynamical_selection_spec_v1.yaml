schema_id: "eqsrc_probabilistic_dynamical_selection_spec_v1"
artifact_id: "EQSRC-PROBABILISTIC-DYNAMICAL-SELECTION-SPEC-V1"
task_id: "RT-20260720-025"
plan_task_id: "P3-T04"
status: "draft/control"
adoption_status: "proposal-only"
result_kind: "source-extension data and finite scoped obstruction"
scope: "nonempty finite selector and state spaces with prospectively declared finite structural group actions"

typed_objects:
  selector_space:
    symbol: "S"
    requirements:
      - "finite and nonempty"
      - "declared before a downstream branch or target is inspected"
  structural_group:
    symbol: "G"
    requirements:
      - "finite and acting on S or Omega"
      - "structural action only; physical gauge is not inferred"
  probability_simplex:
    symbol: "Delta(S)"
    definition: "normalized nonnegative real weights on S"
  invariant_law:
    definition: "mu is invariant iff g_*mu=mu for every g in G"
  stationary_law:
    definition: "pi is stationary iff pi P=pi for the declared transition kernel P"
    guard: "stationarity and structural invariance are independent predicates unless both are proved"
  deterministic_point:
    definition: "a Dirac law delta_s or its support point s"
    guard: "a non-Dirac law is not a deterministic selected point"
  state_space:
    symbol: "Omega"
    requirements:
      - "finite and nonempty"
      - "typed independently of the selector readout"
  deterministic_dynamics:
    symbol: "T"
    equivariance: "T(gx)=gT(x)"
  markov_dynamics:
    symbol: "P"
    requirements:
      - "row-stochastic"
      - "P(gx,gy)=P(x,y) for structural equivariance"
  realized_history:
    definition: "a particular initial state and noise or transition history"
    guard: "a realization is additional run-level provenance even when its law is invariant"

assumptions:
  - id: "A1"
    statement: "All spaces actions measures dynamics decoders readouts initial data and boundaries are prospectively declared and source-typed."
  - id: "A2"
    statement: "No target atlas target metric benchmark output candidate reconstruction or validation outcome defines the objects."
  - id: "A3"
    statement: "A probability interpretation beyond formal finite weights requires a separate physical or empirical bridge."
  - id: "A4"
    statement: "A deterministic decoder is required to be G-equivariant on a G-stable domain before it can count as symmetry-compatible."
  - id: "A5"
    statement: "A dynamics claim names the state space evolution parameter transition law admissible initial or boundary data and readout."
  - id: "A6"
    statement: "Actual substrate dynamics are not supplied by the canonical effective-GR closure dynamics."

theorem_contracts:
  - theorem_id: "PM1_ORBIT_SIMPLEX_CLASSIFICATION"
    hypotheses: "G finite acting on nonempty finite S"
    conclusion: "Delta(S)^G is the simplex generated by the uniform laws on G-orbits; its affine dimension is number_of_orbits-1 and it is a singleton iff the action is transitive."
  - theorem_id: "PM2_INVARIANT_DIRAC_FIXED_POINT"
    hypotheses: "s in S"
    conclusion: "delta_s is G-invariant iff s is fixed by every element of G."
  - theorem_id: "PM3_NO_FREE_MEASURE_DECODER"
    hypotheses: "d is a deterministic G-equivariant decoder and mu is G-invariant"
    conclusion: "d(mu) is G-fixed; if the fixed locus is empty no such decoder yields a point."
  - theorem_id: "DM1_EQUIVARIANT_MARKOV_SYMMETRY_PRESERVATION"
    hypotheses: "P is a finite G-equivariant Markov kernel and nu_0 is G-invariant"
    conclusion: "nu_0 P^t and every equivariant readout law remain G-invariant for all finite t and under any existing limit."
  - theorem_id: "DM2_UNIQUE_STATIONARY_LAW_GUARD"
    hypotheses: "P is G-equivariant and has a unique stationary law pi"
    conclusion: "pi is G-invariant; it selects a deterministic point only when its readout is a Dirac law on a G-fixed point."
  - theorem_id: "DM3_GLOBAL_ATTRACTOR_FIXED_POINT"
    hypotheses: "T is finite deterministic G-equivariant and has a unique global point attractor a"
    conclusion: "a is G-fixed; non-fixed attractors and their basins occur in symmetry-related families."
  - theorem_id: "DM4_SAMPLE_HISTORY_PROVENANCE"
    hypotheses: "the history law is invariant and a realized history produces one branch"
    conclusion: "the ensemble law remains invariant while the realized history is the additional datum selecting the run-level branch."

provenance_requirements:
  probability_measure:
    atom: "M"
    required: "space normalized weights structural transformation law and interpretation"
  dynamics:
    atom: "D"
    required: "state space transition rule time or iteration semantics symmetry law and domain of validity"
  initial_state_or_law:
    atom: "I"
    required: "preparation or source-generation rule and admissible variation class"
  boundary_condition:
    atom: "B"
    required: "boundary carrier well-posedness applicability and source origin"
  realization:
    atom: "history"
    required: "sample space law ordering and the realized history token"
  asymmetric_law:
    atom: "D_asym"
    required: "named asymmetric term or coupling and independent source justification"

decision_rules:
  - "unique invariant law is not unique point unless the law is Dirac"
  - "unique stationary law is not convergence unless a convergence hypothesis is separately proved"
  - "one stochastic outcome is not a canonical cross-run selector"
  - "a non-invariant initial law may select conditionally but its asymmetry is added provenance"
  - "a non-equivariant dynamics may select conditionally but its asymmetry is added source structure"
  - "multiple symmetry-related attractors do not identify one basin without initial boundary history or environmental data"
  - "structural symmetry is not physical gauge without a separate redundancy argument"

authority_flags:
  canonical_ontology_edit_authorized: false
  probability_law_derived_from_current_ontology: false
  substrate_selector_dynamics_derived: false
  effective_gr_dynamics_used_as_substrate_law: false
