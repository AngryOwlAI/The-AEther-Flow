  - "Exact orbit-simplex classification, affine dimension, and uniqueness criterion for finite structural actions."
  - "No-free-measure decoder theorem reducing deterministic decoding of invariant laws to the structural fixed locus."
  - "Unified equivariant Markov and deterministic symmetry-preservation results with stationary-law and attractor guards."
  - "Exact separation of ensemble law, sampled history, initial-state provenance, and deterministic branch selection."
  - "Eight bounded controls covering transitive, multi-orbit, fixed-point, trivial-action, two-basin, ergodic-Markov, and asymmetric-law cases."

shared_consensus:
  - "Probability-valued, point-valued, and relation-valued targets are not interchangeable."
  - "A structural automorphism action is not thereby physical gauge."
  - "A unique invariant probability law on a transitive non-singleton orbit does not distinguish a point."
  - "Symmetry-respecting dynamics preserves symmetric ensemble data; branch selection requires a fixed point or additional asymmetric provenance."
  - "Current ontology derives none of the task-local measures, selector decoders, initial laws, boundary conditions, stochastic kernels, or substrate dynamics."
  - "Actual substrate-dynamics construction belongs to P5; P3-T04 may complete the specification and scoped obstruction without implementing such dynamics."

