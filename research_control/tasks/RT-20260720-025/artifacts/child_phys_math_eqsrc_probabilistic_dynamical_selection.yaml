answer_summary: >-
  On a nonempty finite selector space S with a prospectively declared finite
  structural action G, the G-invariant probability laws form exactly the
  simplex generated by uniform laws on the G-orbits. That law is unique
  exactly when the action is transitive, but uniqueness of a law is not
  deterministic point selection. Any G-equivariant decoder evaluated at an
  invariant law, any equivariant dynamics fed an invariant initial law, and
  any unique point attractor of equivariant finite dynamics can produce only
  a G-fixed point. A non-fixed selected branch therefore requires additional
  asymmetric source provenance such as an initial state, boundary condition,
  non-equivariant law, or realized random history.

assumptions:
  - id: "A1"
    statement: "S is a nonempty finite selector or readout set fixed before evaluating any desired branch."
  - id: "A2"
    statement: "G is a finite declared structural group acting on S; this structural action is not assumed to be physical gauge."
  - id: "A3"
    statement: "Probability means a normalized nonnegative real weight on S; no empirical calibration or target-dependent posterior is imported."
  - id: "A4"
    statement: "Every measure, initial law, boundary condition, decoder, transition kernel, and readout is declared prospectively and carries separate source provenance."
  - id: "A5"
    statement: "For dynamical statements, Omega is a nonempty finite G-state space, P is a row-stochastic G-equivariant Markov kernel, and r: Omega -> S is a G-equivariant readout."
  - id: "A6"
    statement: "Deterministic dynamics T: Omega -> Omega is the special case P(x,T(x))=1 and is symmetry-respecting exactly when T(gx)=gT(x)."

definitions:
  probability_simplex: "Delta(S) = {mu: S -> R_ge_0 | sum_s mu(s)=1}."
  pushforward_action: "(g_*mu)(s)=mu(g^{-1}s)."
  invariant_probability_law: "mu is structurally invariant iff g_*mu=mu for every g in G."
  orbit_uniform_law: "For a G-orbit O, u_O(s)=1/|O| when s is in O and 0 otherwise."
  deterministic_point_law: "delta_s is a deterministic point law; it must not be identified with a non-Dirac probability law."
  equivariant_decoder: "A decoder d: D -> S on a G-stable domain D subseteq Delta(S) is equivariant iff d(g_*mu)=g d(mu)."
  equivariant_markov_kernel: "P(gx,gy)=P(x,y) for all g,x,y; equivalently, pushforward by g commutes with the measure evolution mu -> mu P."
  stationary_law: "pi is stationary for P iff pi P=pi; temporal stationarity and structural G-invariance are logically distinct properties."
  global_point_attractor: "For finite deterministic T, a is a global point attractor here iff T(a)=a and every state reaches a after finitely many iterations."
  realized_history: "In an equivariant sampling construction, a sampled noise or transition history is an additional realized input; its distribution may be invariant even when the realized branch is not."

theorem_results:
  - theorem_id: "PM1_ORBIT_SIMPLEX_CLASSIFICATION"
    statement: >-
      If O_1,...,O_k are the G-orbits of S, then Delta(S)^G is exactly
      conv{u_O1,...,u_Ok}. Every invariant law has the unique representation
      mu=sum_i a_i u_Oi with a_i=mu(O_i), a_i>=0, and sum_i a_i=1.
    consequences:
      - "The affine dimension of Delta(S)^G is k-1."
      - "There is exactly one G-invariant probability law iff the action on S is transitive."
      - "When the action is transitive, the unique law is uniform on S, even if S has no fixed point."
    proof_sketch: >-
      Invariance under G makes the weight constant along each orbit. Its total
      weight a_i on orbit O_i therefore distributes as a_i/|O_i| at each
      orbit point. Conversely each orbit-uniform law is invariant, as is every
      convex combination. Disjoint orbit supports make the coefficients
      unique.
  - theorem_id: "PM2_INVARIANT_DIRAC_FIXED_POINT"
    statement: "delta_s is G-invariant iff s lies in the fixed locus S^G."
    proof_sketch: "g_*delta_s=delta_{g s}; equality for every g is equivalent to g s=s for every g."
    consequence: "A unique invariant law is a deterministic selected point only in the singleton-orbit case; transitivity alone does not supply a point when |S|>1."
  - theorem_id: "PM3_NO_FREE_MEASURE_DECODER"
    statement: >-
      Let d be a G-equivariant deterministic decoder whose G-stable domain
      contains an invariant law mu. Then d(mu) lies in S^G. Hence if S^G is
      empty, no such decoder can convert any invariant law into a lawful
      deterministic point.
    proof_sketch: "For every g, g d(mu)=d(g_*mu)=d(mu), so d(mu) is fixed."
    limitation: "If S^G is nonempty, an equivariant decoder may return a fixed point, but the decoder and any choice among multiple fixed points remain additional source-side structure."
  - theorem_id: "DM1_EQUIVARIANT_MARKOV_SYMMETRY_PRESERVATION"
    statement: >-
      For an equivariant finite Markov kernel P on Omega, G-invariance of the
      initial law nu_0 implies G-invariance of nu_t=nu_0 P^t for every t. If
      r: Omega -> S is equivariant, each selector law r_*nu_t is also
      G-invariant. Any finite-dimensional limit law is invariant as well.
    proof_sketch: >-
      Equivariance gives g_*(nu P)=(g_*nu)P. Induction preserves invariance,
      and equivariance of r commutes with pushforward. The invariant simplex is
      closed, so any convergent sequence remains inside it.
    consequence: "Invariant input plus symmetry-respecting dynamics cannot converge to a non-invariant Dirac selector."
  - theorem_id: "DM2_UNIQUE_STATIONARY_LAW_GUARD"
    statement: >-
      If an equivariant P has a unique stationary law pi, then pi is
      G-invariant. It yields a deterministic selected point only if its
      equivariant selector readout is a Dirac law on a G-fixed point.
    proof_sketch: >-
      For every g, g_*pi is stationary because pushforward commutes with P;
      uniqueness forces g_*pi=pi. PM2 then classifies the Dirac case.
    limitations:
      - "Uniqueness of a stationary law does not by itself imply convergence; irreducibility and aperiodicity or an equivalent hypothesis must be stated."
      - "Structural invariance of a law and temporal stationarity of a law are separate predicates."
  - theorem_id: "DM3_GLOBAL_ATTRACTOR_FIXED_POINT"
    statement: >-
      If finite deterministic T is G-equivariant and has a unique global point
      attractor a, then a lies in Omega^G. More generally, G transports each
      attractor and its basin to a symmetry-related attractor and basin.
    proof_sketch: >-
      Equivariance makes g a a fixed point and sends a trajectory reaching a
      to a trajectory reaching g a. Global uniqueness therefore gives g a=a
      for every g. The same identity transports basins when attractors are not
      unique.
    consequence: "Multiple symmetry-related attractors do not canonically select one branch; an asymmetric state, boundary, history, or law must choose a basin."
  - theorem_id: "DM4_SAMPLE_HISTORY_PROVENANCE"
    statement: >-
      In an equivariant sampling construction with an invariant history law,
      a single stochastic realization may end at a non-fixed branch although
      the ensemble output law is G-invariant. The realized sample or noise
      history is then additional selection data and cannot be reported as a
      deterministic natural selector supplied by the invariant law alone.
    proof_sketch: >-
      Symmetry constrains the distribution of histories and outputs, not each
      realized history. Symmetry-related histories have symmetry-related
      outputs, so discarding the history erases the datum that chose the branch.

proposed_finite_controls:
  - control_id: "C1_C2_TRANSITIVE_SWAP"
    carrier: "S={a,b}; C2 swaps a and b."
    orbits: "[{a,b}]"
    fixed_points: "[]"
    invariant_laws: "Only (1/2,1/2)."
    expected_result: "PM1 gives uniqueness of the invariant law; PM2 and PM3 forbid deterministic point selection."
  - control_id: "C2_C3_REGULAR"
    carrier: "S={0,1,2}; C3 acts by addition modulo 3."
    orbits: "[{0,1,2}]"
    fixed_points: "[]"
    invariant_laws: "Only (1/3,1/3,1/3)."
    expected_result: "Reproduces the P3-T02 W4 control and separates law uniqueness from point uniqueness."
  - control_id: "C3_SWAP_PLUS_FIXED_POINT"
    carrier: "S={a,b,c}; C2 swaps a and b and fixes c."
    orbits: "[{a,b},{c}]"
    fixed_points: "[c]"
    invariant_laws: "alpha*(1/2,1/2,0)+(1-alpha)*(0,0,1), 0<=alpha<=1."
    expected_result: "The invariant-law simplex is not unique; delta_c is invariant only because c was already structurally fixed."
  - control_id: "C4_TWO_DISJOINT_SWAPS"
    carrier: "S={a,b,c,d}; C2 swaps a<->b and c<->d."
    orbits: "[{a,b},{c,d}]"
    fixed_points: "[]"
    invariant_laws: "alpha*(1/2,1/2,0,0)+(1-alpha)*(0,0,1/2,1/2)."
    expected_result: "A one-dimensional invariant-law simplex exists but every equivariant deterministic decoder is obstructed."
  - control_id: "C5_TRIVIAL_ACTION"
    carrier: "S={a,b,c}; G acts trivially."
    orbits: "[{a},{b},{c}]"
    fixed_points: "[a,b,c]"
    invariant_laws: "All of Delta(S)."
    expected_result: "Equivariance alone supplies neither a unique law nor a unique point when all points are fixed."
  - control_id: "C6_EQUIVARIANT_TWO_BASIN_DYNAMICS"
    carrier: "Omega={p,q,a,b}; C2 swaps p<->q and a<->b."
    dynamics: "T(p)=a, T(q)=b, T(a)=a, T(b)=b."
    invariant_initial_law: "nu_0=(delta_p+delta_q)/2."
    exact_evolution: "nu_1=(delta_a+delta_b)/2 and nu_t=nu_1 for all t>=1."
    expected_result: "Symmetric input remains a symmetric two-branch mixture; delta_p reaches delta_a only by importing asymmetric initial-state provenance."
  - control_id: "C7_EQUIVARIANT_ERGODIC_MARKOV_CHAIN"
    carrier: "Omega={a,b}; C2 swaps a and b."
    kernel: "P=[[3/4,1/4],[1/4,3/4]]."
    stationary_laws: "Unique pi=(1/2,1/2); second eigenvalue 1/2 gives convergence from every initial law."
    fixed_points: "[] under the structural C2 action."
    expected_result: "A unique attracting stationary law is still not a deterministic selected point."
  - control_id: "C8_ASYMMETRIC_ATTRACTOR_COST"
    carrier: "Omega={a,b}; C2 swaps a and b."
    dynamics: "T(a)=a and T(b)=a."
    exact_result: "a is the unique global point attractor, but T is not equivariant because T(g a)=a while g T(a)=b."
    expected_result: "A non-fixed unique attractor is purchased by an explicitly asymmetric transition law and cannot be credited to symmetry-respecting dynamics."

