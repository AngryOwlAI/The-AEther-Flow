  - "Enumerate every group element and carrier point and verify the action law, orbit partition, and fixed locus."
  - "Solve invariant-weight equations exactly over rational numbers and compare with the stored orbit-simplex basis."
  - "Test decoder conclusions through the fixed-locus condition rather than by sampling candidate decoders."
  - "Enumerate every kernel entry, verify row normalization and P(gx,gy)=P(x,y), and multiply the stated laws exactly."
  - "Enumerate deterministic trajectories and basins for C6 and C8."
  - "Verify that C8 fails equivariance at an explicit action-state pair."

conflicts_and_risks:
  - id: "R1_EFFECTIVE_DYNAMICS_IMPORT"
    resolution: "The adopted exact-GR effective dynamics in ontology/tex/aether_flow_dynamics.tex are not substrate selector dynamics and must not instantiate P, T, or a source measure here."
  - id: "R2_LAW_POINT_CONFLATION"
    resolution: "Keep a unique G-invariant law, a unique P-stationary law, a realized sample, and a unique deterministic point as four distinct result types."
  - id: "R3_POST_HOC_DECODER"
    resolution: "A decoder chosen after seeing a desired branch is forbidden; any decoder must be prospectively defined and source-provenanced."
  - id: "R4_ORBIT_WEIGHT_PROVENANCE"
    resolution: "When more than one G-orbit exists, the orbit weights a_i are free parameters until a separate source law derives them."
  - id: "R5_INITIAL_OR_BOUNDARY_ASYMMETRY"
    resolution: "A non-invariant initial state, boundary condition, preparation, or realized history may conditionally select, but it is new source-extension data rather than selection by bare dynamics."
  - id: "R6_FINITE_SCOPE"
    resolution: "Do not generalize these finite proofs to infinite-volume spontaneous symmetry breaking, continuous groups, nonmeasurable spaces, metastability, or thermodynamic phases without new hypotheses."
  - id: "R7_FAMILY_NATURALITY"
    resolution: "Objectwise finite equivariance does not prove functorial selection over source morphisms or the P2-T03 noninvertible-arrow equalizer conditions."
  - id: "R8_CONVERGENCE_OVERREAD"
    resolution: "Unique stationarity is not convergence; only C7 supplies an exact convergence calculation."

