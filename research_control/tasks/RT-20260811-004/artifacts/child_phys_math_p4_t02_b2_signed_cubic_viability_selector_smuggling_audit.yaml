new_mathematical_payload:
  exact_count: 5
  items:
    - payload_id: "PAYLOAD-RT004-DIMENSIONLESS-ORBIT-CLASSIFICATION"
      payload_type: "theorem"
      object_name: "Positive-regraduation orbit classification"
      claim_status: "draft/control"
      burden_effect: "audits"
      statement: "For the G action on positive triples, H=gamma*Delta*a_star^2 is invariant and complete: two triples lie in one G orbit iff they have the same H. Every orbit has the unique normal-form triple (H,1,1)."
      proof:
        - "Invariance follows from (gamma/(c*d^2))*(c*Delta)*(d*a_star)^2=H."
        - "Given equal H, choose c=Delta_prime/Delta and d=a_star_prime/a_star; the transformed gamma is H/(Delta_prime*a_star_prime^2)=gamma_prime."
        - "Choosing c=1/Delta and d=1/a_star gives the normal form (H,1,1); equality of H makes it unique."
      dimensionless_form: "With x=a/a_star and tau=t/Delta, phi gives x_tau=x/sqrt(1+2*H*tau*x^2), b_sigma=sigma*x/sqrt(1+x^2), and lambda=(1+2*H)^(-1/2)."
    - payload_id: "PAYLOAD-RT004-PARAMETER-ROLE-AND-REACHABILITY"
      payload_type: "theorem"
      object_name: "Parameter-role separation and exact reachability"
      claim_status: "draft/control"
      burden_effect: "narrows"
      statement: "For every gamma>0 and Delta>0, the transitive closure from nonzero a is exactly {y:sign(y)=sign(a) and 0<abs(y)<=abs(a)}; it is independent of the positive magnitudes gamma, Delta, and a_star."
      proof: "For a reachable y, sign is preserved and magnitude cannot increase. Conversely, T=(1/y^2-1/a^2)/(2*gamma) is finite and nonnegative, and T can be split into finitely many increments at most Delta."
      role_consequence: "Sigma alone selects the component; gamma and Delta parameterize motion, a_star normalizes the certificate, and H controls finite-window conditioning."
    - payload_id: "PAYLOAD-RT004-REFLECTION-TOKEN-NONSELECTION"
      payload_type: "theorem"
      object_name: "Reflection-equivariant token nonselection"
      claim_status: "draft/control"
      burden_effect: "narrows"
      statement: "No deterministic reflection-equivariant rule can select sigma from the unsigned record (gamma,Delta,a_star): reflection fixes that record but sends every token to its negative, so equivariance would require sigma=-sigma."
      scope: "Unsigned fixed candidate record only; supplying sigma remains a lawful proposal extension."
    - payload_id: "PAYLOAD-RT004-SHARP-N-STEP-BARRIER"
      payload_type: "theorem"
      object_name: "Sharp finite-path barrier factor"
      claim_status: "draft/control"
      burden_effect: "narrows"
      statement: "For every n>=1 and every n-step admitted path, b_sigma(a_n)>=Lambda_n*b_sigma(a_0)>0 with Lambda_n=(1+2*n*H)^(-1/2). Lambda_n is the greatest uniform factor, satisfies Lambda_n>=lambda^n with strict inequality for n>1, and tends to zero."
      proof:
        - "Semigroup composition gives a_n=phi_T(a_0) with 0<=T<=n*Delta; the one-step algebra with n*Delta gives Lambda_n."
        - "Sharpness follows at T=n*Delta as abs(a_0) tends to infinity."
        - "Bernoulli gives (1+2*H)^n>=1+2*n*H, hence Lambda_n>=lambda^n."
      consequence: "The RT003 iterated lambda^n bound is valid but nonsharp; exact finite viability coexists with polynomial loss of margin and asymptotic approach to zero."
    - payload_id: "PAYLOAD-RT004-INVARIANT-PROBABILITY-EXCLUSION"
      payload_type: "theorem"
      object_name: "No stationary probability on the selected open component"
      claim_status: "draft/control"
      burden_effect: "narrows"
      statement: "For every fixed t0>0, no invariant Borel probability for phi_t0 is supported on U_sigma. On the full amplitude line the unique invariant Borel probability is delta_0, which gives U_sigma mass zero."
      proof: "The bounded function h(a)=a^2/(a_star^2+a^2)=b_sigma(a)^2 strictly decreases under phi_t0 at every nonzero a. Invariance would equate the integrals of h and h composed with phi_t0, forcing support at zero; zero is not in U_sigma."
      consequence: "Component selection cannot be upgraded to probability occurrence, stationarity, or an empirical ensemble."

