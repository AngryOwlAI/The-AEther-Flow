new_mathematical_payload:
  - payload_id: "NMP-RT004-001"
    payload_type: "dimensionless_reduction_theorem"
    name: "Complete positive-regraduation orbit classification"
    statement: "H=gamma*Delta*a_star^2 is invariant and complete for the positive regraduation action: two positive triples are in one orbit iff they have the same H, and every orbit has the unique normal form (H,1,1). With x=a/a_star and tau=t/Delta, the flow is x(tau)=x/sqrt(1+2*H*tau*x^2) and lambda=(1+2*H)^(-1/2)."
    audit_use: "Separates source-coordinate covariance from physical gauge and isolates the discrete sigma preload."
  - payload_id: "NMP-RT004-002"
    payload_type: "parameter_role_theorem"
    name: "Continuous-parameter component independence and exact reachability"
    statement: "For every gamma>0 and Delta>0, the finite transitive closure from nonzero a is exactly {y:sign(y)=sign(a), 0<abs(y)<=abs(a)}; it is independent of positive gamma, Delta, and a_star. Hence the exact viability kernel is U_sigma and continuous roots cannot choose between U_+ and U_-."
    audit_use: "Shows that sigma alone carries component-selection content."
  - payload_id: "NMP-RT004-003"
    payload_type: "symmetry_nonselection_lemma"
    name: "Reflection-token nonselection"
    statement: "The reflection action sigma->-sigma has one two-element orbit and no fixed token; equivariance transports the candidate pair but selects neither member."
    audit_use: "Blocks physical-gauge, spontaneous-symmetry-breaking, and epistemic-selection overreads."
  - payload_id: "NMP-RT004-004"
    payload_type: "asymptotic_boundary_theorem"
    name: "Sharp finite-path factor without asymptotic positive margin"
    statement: "For every n-step admitted path, b_sigma(a_n)>=Lambda_n*b_sigma(a_0)>0 with the greatest uniform factor Lambda_n=(1+2*n*H)^(-1/2). It satisfies Lambda_n>=lambda^n, is strict for n>1, and tends to zero; Phi_gamma(t,a) and the barrier also tend to zero while zero remains outside U_sigma."
    audit_use: "Precisely limits the viability theorem without invalidating its finite-path scope."
  - payload_id: "NMP-RT004-005"
    payload_type: "invariant_measure_consequence"
    name: "No stationary probability on the selected component"
    statement: "For every fixed positive-time map the only invariant Borel probability is delta_0, so no invariant probability is supported on U_sigma."
    audit_use: "Proves that component selection is not point-valued or probabilistic occurrence."
  - payload_id: "NMP-RT004-006"
    payload_type: "sign_role_countercontrol"
    name: "Gamma sign does not select sigma"
    statement: "The gamma=0 identity flow preserves both nonzero components and selects neither, whereas gamma<0 can lose global forward existence; gamma>0 is disclosed dynamical preparation rather than a component selector or target import."
    audit_use: "Separates global-flow existence from component identity."

