selector_level_mathematics:
  positive_coordinate_factorization_theorem:
    payload_id: "NMP-RT-20260810-009-MATH-001"
    payload_type: "theorem"
    name: "Independent-positive-scale pointwise factorization theorem"
    definitions:
      sector_set: "A finite nonempty declared set S."
      nonzero_response_space: "X=(R\\{0})^S."
      scale_group: "G=(R_{>0})^S acting componentwise on X."
      sign_map: "sgn:X->{-1,+1}^S."
    statement: "For any set Y, a pointwise map B:X->Y is invariant under all independent positive sector rescalings if and only if there is a unique map b:{-1,+1}^S->Y with B=b composed with sgn."
    proof: "If r and r' have the same ordered signs, then lambda_s=r'_s/r_s is positive for every s and r'=lambda.r, so invariance gives B(r')=B(r). Thus B is constant on each sign fiber and defines b uniquely. Conversely b composed with sgn is invariant because positive rescaling preserves every sign."
    consequence_for_route_a: "Every pointwise independently scale-invariant response bridge factors through Q_sign; relative positive-ray magnitudes cannot enter such a bridge."
    exact_limit: "The theorem does not cover bridges depending on zero loci, derivatives, overlap transport, the entire sign-domain geometry, refinement, or nonlocal source data. It therefore does not execute the proposed broader irrelevance packet."

  positive_character_descent_lemma:
    payload_id: "NMP-RT-20260810-009-MATH-002"
    payload_type: "lemma"
    name: "Positive-character common-line descent lemma"
    definitions:
      source_cocycle: "Transition data g_alpha_beta valued in a proposed source group G_src with g_alpha_beta g_beta_gamma=g_alpha_gamma."
      positive_character: "A group homomorphism chi:G_src->R_{>0}."
      scalar_transition: "lambda_alpha_beta=chi(g_alpha_beta)."
    statement: "The scalar transitions lambda_alpha_beta are positive, invertible, and satisfy lambda_alpha_beta lambda_beta_gamma=lambda_alpha_gamma, so they define an oriented associated real line L_chi. Any sector response line equipped with a G_src-intertwining isomorphism into L_chi shares the same descent cocycle without selecting a tangent line or covector tau."
    proof: "Positivity and invertibility follow from the codomain group. The cocycle follows by the homomorphism identity chi(g_alpha_beta g_beta_gamma)=chi(g_alpha_beta)chi(g_beta_gamma). The associated-line construction then supplies ordinary line-bundle descent."
    exact_limit: "Current ontology supplies neither G_src, chi, nor the sector intertwiners. The lemma proves coherence of a future proposal only and does not construct or adopt those objects."

  descent_variation_independence_lemma:
    payload_id: "NMP-RT-20260810-009-MATH-003"
    payload_type: "lemma"
    name: "Logical independence of line descent and admissible-variation generation"
    statement: "A common positive line cocycle and an independently generated admissible-variation law are separate burdens; neither implies the other."
    countermodel_descent_without_variation_control: "Put all response lines in one trivial line with identity transitions, but admit the full sector-triple tangent space. RT008's transverse v_R+delta w path is then admissible and destroys the rank-two six-cell geometry despite perfect line descent."
    countermodel_variation_control_without_descent: "Hold the sector triple fixed, or admit only the zero variation, while changing local response trivializations by unequal positive factors. The variation law is vacuously stable, but Q_ray still changes and fails common-line descent."
    consequence: "A lawful constructive packet must source the two primitives independently and prove both; defining one in terms of the desired output of the other is circular goal-property preload."

  minimal_positive_circuit_support_theorem:
    payload_id: "NMP-RT-20260810-009-MATH-004"
    payload_type: "theorem"
    name: "Four-dimensional minimal positive-circuit rank and support theorem"
    definitions:
      configuration: "A finite family of nonzero oriented vectors (v_s)_{s in S} in a real vector space V with dim(V)=4."
      positive_circuit: "An inclusion-minimal nonempty C subseteq S for which there are coefficients alpha_s>0 satisfying sum_{s in C} alpha_s v_s=0."
      circuit_map: "A_C:R^C->V with A_C e_s=v_s."
    statement: "For every positive circuit C, rank(A_C)=|C|-1, dim ker(A_C)=1, every nonzero kernel vector has the coefficient sign pattern of alpha or -alpha, and |C|<=5. Moreover Gamma_C={k in V*:k(v_s)>0 for all s in C} is empty."
    proof: "Minimal support makes every proper subfamily linearly independent, hence C is a minimally dependent set, rank(A_C)=|C|-1, and ker(A_C) is one-dimensional. The positive vector alpha spans the kernel, so all nonzero kernel vectors have the all-positive or all-negative coefficient sign pattern. Since rank(A_C)<=dim(V)=4, |C|-1<=4. Finally, if k were positive on every v_s, then 0=k(sum alpha_s v_s)=sum alpha_s k(v_s)>0, a contradiction."
    codimension_and_sign_consequence: "The relation space has codimension |C|-1 in R^C and dimension one; its two nonzero sign rays are (+,...,+) and (-,...,-), and the circuit is an exact certificate excluding the all-plus covector cell."
    exact_limit: "This theorem is conditional finite-dimensional mathematics. It neither proves that current ontology supplies the sector vectors nor turns formal common admissibility into physical causality."

  sector_refinement_monotonicity_lemma:
    payload_id: "NMP-RT-20260810-009-MATH-005"
    payload_type: "lemma"
    name: "Realized covector restriction and obstruction-persistence lemma"
    statement: "For finite sector configurations S subseteq T in one source vector space, restriction res_{T,S}:C*(v_T)->C*(v_S) is surjective, Gamma_T subseteq Gamma_S, and every positive circuit supported in S remains a positive circuit and obstruction in T. Thus T-feasibility implies S-feasibility, while S-feasibility need not survive extension."
    proof: "Every covector of S is induced by some k in V*; evaluating the same k on T extends it, proving surjectivity. Gamma_T imposes every S inequality plus additional T\\S inequalities, giving inclusion. A minimal dependence supported on C subseteq S is unchanged by adjoining vectors outside C, so its coefficient relation and support minimality persist."
    direct_p4_t02_consequence: "A finite successful sector sample cannot establish universality, whereas one supported positive circuit is a monotone hard-fail certificate for every declared refinement containing it."

  retained_route_c_dependency_map:
    payload_id: "NMP-RT-20260810-009-MATH-006"
    payload_type: "dependency_map_update"
    name: "Post-obstruction oriented-matroid bridge dependency map"
    disposition: "retained_later_alternative_if_route_b_obstructs"
    ordered_dependencies:
      - "independently sourced finite nonzero oriented sector vectors on one declared source patch"
      - "full realized sign-covector set and inclusion-minimal positive circuits"
      - "total feasible-or-obstructed classifier with a witness or exact circuit certificate"
      - "positive-rescaling, source-linear, and sector-relabeling invariance proofs"
      - "sector-refinement restriction, obstruction persistence, and degeneracy-boundary analysis"
      - "source-purity and frozen-route nonreconstruction audit"
      - "fresh Refuter stress before any adequacy, B2, or P4-T03 decision"
    blocked_shortcuts:
      - "using RT005's one all-positive witness as the definition of success-producing input data"
      - "reconstructing Q_ray, the RT007 midpoint relation, a shared tau, or a common response-line normalization"
      - "choosing sector orientations, refinements, or a preferred quadratic face by target or benchmark fit"

  final_selected_route_dependency_map:
    payload_id: "NMP-RT-20260810-009-MATH-007"
    payload_type: "dependency_map_update"
    name: "Final common-character and independent-source-law formalization dependency map"
    ordered_dependencies:
      - "independently declared source group or groupoid G_src"
      - "positive character chi and source-proven sector intertwiners"
      - "common associated line L_chi and verified overlap cocycle"
      - "independently declared source law E_src on a proposal-only source configuration domain C_src"
      - "nonvacuous linearized solution-and-symmetry quotient A_src generated from D E_src, not from response outcomes"
      - "finite-path integrability, source-purity, and frozen-route nonreconstruction audit"
      - "exact constructed proposal or named obstruction"
      - "fresh Refuter stress before any adequacy, B2, or P4-T03 decision"
    fail_closed_principle: "Selection authorizes testing these proposal roots, not accepting their existence, independent provenance, source truth, or adoption."

