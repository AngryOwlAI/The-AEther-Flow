source_side_definition: "On a conditional source cover, formalize a source transition group or groupoid G_src, a positive character chi, an associated oriented common response line L_chi, source-natural sector intertwiners, and a source equation or generator E_src whose independently linearized nonvacuous variation quotient A_src is fixed before response evaluation."

formal_objects:
  - object_id: "SRC-COVER"
    definition: "A conditional source cover {U_alpha} and overlap groupoid; proposal scaffolding only, not adopted M_src."
  - object_id: "DECLARED-SECTOR-LINES"
    definition: "A finite declared sector set S_decl with oriented one-dimensional response lines L_s and explicit transition data."
  - object_id: "SOURCE-TRANSITION-GROUPOID"
    definition: "A source-only transition group or groupoid G_src with pair-overlap arrows, inverses, and triple-overlap composition."
  - object_id: "POSITIVE-CHARACTER"
    definition: "A proposed source-rooted homomorphism chi:G_src->R_{>0} fixed independently of response success."
  - object_id: "COMMON-ASSOCIATED-LINE"
    definition: "The oriented associated line L_chi with scalar transition cocycle lambda_alpha_beta=chi(g_alpha_beta)."
  - object_id: "SECTOR-INTERTWINERS"
    definition: "Source-natural isomorphisms j_s:L_s->L_chi intertwining each sector transition with the same common cocycle."
  - object_id: "COMMON-LINE-REDUCTION-CLASS"
    definition: "The common-line reductions modulo one declared common positive gauge, with literal transition equality neither assumed nor required."
  - object_id: "SOURCE-CONFIGURATION-DOMAIN"
    definition: "A proposal-only configuration domain C_src with declared source symmetries and no target-field interpretation."
  - object_id: "INDEPENDENT-SOURCE-LAW"
    definition: "A source equation or generator E_src:C_src->W_src whose roots and coefficients are fixed before response evaluation."
  - object_id: "ADMISSIBLE-VARIATION-QUOTIENT"
    definition: "A_src(c)=ker(D E_src|_c)/im(D gauge_src|_c), or an equally exact source-derived alternative, plus an explicitly integrated finite path class."
  - object_id: "PROVENANCE-SEPARATION-CERTIFICATE"
    definition: "A dependency graph proving that chi, the j_s, and E_src have source roots independent of tau, Q_ray, midpoint, rank, sign-cell, target, benchmark, or workflow outcomes."

domains:
  source_patch_domain: "Objects and overlaps of the conditional source cover."
  transition_domain: "Pair and triple overlap arrows in G_src."
  line_domain: "Oriented one-dimensional response fibers for each declared sector."
  configuration_domain: "The proposal-only source configuration space C_src."
  infinitesimal_variation_domain: "Tangent vectors satisfying the independently declared linearized source law, modulo declared source symmetries."
  finite_variation_domain: "Piecewise smooth source paths generated by admissible infinitesimal representatives with exact existence and endpoint conditions."

maps:
  - map_id: "CHARACTER-DESCENT"
    signature: "chi:G_src->R_{>0}"
    obligation: "Prove source provenance, homomorphism, positivity, invertibility, and triple-overlap cocycle."
  - map_id: "SECTOR-TO-COMMON-LINE"
    signature: "j_s:L_s->L_chi for s in S_decl"
    obligation: "Prove typing, isomorphism, transition intertwining, restriction, relabeling naturality, and common-gauge uniqueness or exact nonuniqueness."
  - map_id: "COCHAIN-REDUCTION"
    signature: "Red_src:(g_s,ij)->[(a_s,i,g_ij)] or obstruction"
    obligation: "Prove a_s,i*g_s,ij=g_ij*a_s,j and pairwise-ratio coboundary equivalence; distinguish existence from source-natural selection."
  - map_id: "SOURCE-LAW"
    signature: "E_src:C_src->W_src"
    obligation: "Define source-only domain, codomain, regularity, symmetries, coefficients, and provenance before response evaluation."
  - map_id: "LINEARIZED-LAW"
    signature: "D E_src:T C_src->T W_src"
    obligation: "Construct the kernel and symmetry quotient, establish a declared nonzero variation, and identify rank-jump or singular branches."
  - map_id: "ADMISSIBLE-FLOW"
    signature: "Flow_A:(initial source state, generator, parameter)->C_src"
    obligation: "Prove local integration and composition or return a precise integrability obstruction."
  - map_id: "PROVENANCE-SEPARATION"
    signature: "Prov:(G_src,chi,j_s,E_src,A_src)->source-root dependency trees"
    obligation: "Fail if any root depends on the response feature, target structure, or outcome it is supposed to test."

proof_obligations:
  - obligation_id: "PO-01-EXACT-TYPING"
    statement: "Every groupoid, line, configuration, tangent, quotient, and map has an exact domain and codomain."
  - obligation_id: "PO-02-COMMON-COCYCLE"
    statement: "The positive character or exact source reduction induces one valid common scalar cocycle and every j_s intertwines with it."
  - obligation_id: "PO-03-REDUCTION-CRITERION"
    statement: "Prove the cochain reduction equations and their pairwise-ratio coboundary criterion, including common-gauge equivalence."
  - obligation_id: "PO-04-NO-SHARED-TAU-REPLAY"
    statement: "No tangent line, covector tau, diagonal vector, fixed Q_ray atlas, or undeclared stabilizer defines the common line."
  - obligation_id: "PO-05-INDEPENDENT-VARIATION-PROVENANCE"
    statement: "E_src and A_src are fixed before response evaluation and are not defined as stabilizers of midpoint, rank, sign image, common positivity, or target behavior."
  - obligation_id: "PO-06-NONVACUITY"
    statement: "A_src contains a declared nonzero source variation or the packet returns a precise zero-variation obstruction."
  - obligation_id: "PO-07-DESCENT-VARIATION-INDEPENDENCE"
    statement: "The common-line and variation roots are separately provenance-bound; neither is derived from the success of the other."
  - obligation_id: "PO-08-SOURCE-NATURALITY"
    statement: "The construction respects source presentation, sector relabeling, restriction, inverse, and overlap composition."
  - obligation_id: "PO-09-FINITE-VARIATION-INTEGRABILITY"
    statement: "Infinitesimal admissibility integrates to a delimited finite path class or an exact obstruction is returned."
  - obligation_id: "PO-10-TOTAL-FAIL-CLOSED-OUTPUT"
    statement: "Return either a constructed source-rooted proposal with proofs or an exact existence, provenance, cocycle, nonvacuity, or integrability obstruction."
  - obligation_id: "PO-11-SOURCE-PURITY"
    statement: "No target atlas, metric, cone, tetrad, coframe, GR coefficient, calibration, benchmark answer, registry metadata, role authority, or validation status appears as a source premise."
  - obligation_id: "PO-12-MATERIAL-DISTINCTNESS"
    statement: "The artifact reconstructs none of the RT007 response formula, Q_ray atlas, six-cell proof, midpoint restriction, or shared-tau strategy."
  - obligation_id: "PO-13-FINITE-SECTOR-SCOPE"
    statement: "Any finite sector construction remains distinct from all-P7 universality and must fail closed on unequipped sectors."
  - obligation_id: "PO-14-CLAIM-BLOCKS"
    statement: "Formalization success is not empirical response, physical units, dynamics, causality, adequacy, B2 activation, P4-T03, g_eff, adoption, Gate, benchmark, or proof promotion."

finite_selector_witness_required:
  purpose: "Show that raw unequal sector transitions can reduce to one common cocycle without literal equality, while proving no source derivation."
  common_cocycle: "(g_01,g_12,g_02)=(2,3,6)"
  sector_cocycles:
    R: "(4,6,24)"
    S: "(6,9,54)"
    D: "(5,6,30)"
  positive_cochains:
    R: "(1,2,4)"
    S: "(1,3,9)"
    D: "(2,5,10)"
  verification: "Each row satisfies its cocycle and all common-reduction equations; the future formalizer must replace loaded numbers with independently sourced data or return an obstruction."

failure_branches:
  - branch_id: "FB-01-NO-POSITIVE-CHARACTER"
    exact_failure: "No nontrivial source-side positive character compatible with G_src exists."
  - branch_id: "FB-02-NO-SECTOR-INTERTWINER"
    exact_failure: "At least one sector response line has no source-natural intertwiner into L_chi."
  - branch_id: "FB-03-COCYCLE-OR-INVERSE-DEFECT"
    exact_failure: "Transition positivity, invertibility, pairwise reduction, or triple-overlap composition fails."
  - branch_id: "FB-04-NONUNIQUENESS"
    exact_failure: "Multiple reductions are not related by one declared common positive gauge and source data do not select among them."
  - branch_id: "FB-05-FROZEN-ROUTE-REPLAY"
    exact_failure: "The candidate reduces to shared tau, fixed Q_ray, midpoint preservation, diagonal-only variation, or an undeclared stabilizer."
  - branch_id: "FB-06-VARIATION-VACUITY"
    exact_failure: "A_src is empty or zero-only and robustness would be vacuous."
  - branch_id: "FB-07-VARIATION-CIRCULARITY"
    exact_failure: "E_src or A_src is defined from the response property it is supposed to test."
  - branch_id: "FB-08-PROVENANCE-DEPENDENCE"
    exact_failure: "The line and variation primitives share an opaque or goal-selected root."
  - branch_id: "FB-09-INTEGRABILITY"
    exact_failure: "The infinitesimal variation class does not integrate to the claimed finite paths."
  - branch_id: "FB-10-TARGET-IMPORT"
    exact_failure: "Any primitive is selected using target geometry, empirical calibration, benchmark behavior, or protected status."
  - branch_id: "FB-11-SECTOR-SCOPE"
    exact_failure: "A finite declared-sector construction is generalized to unequipped sectors without typed inputs."

