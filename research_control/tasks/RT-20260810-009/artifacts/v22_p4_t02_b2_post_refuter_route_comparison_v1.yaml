    result_id: "THM-V22-P4T02-B2-INDEPENDENT-POSITIVE-SCALE-FACTORIZATION-001"
    statement: "On the nonzero response space (R\\{0})^S, every pointwise map invariant under independent positive sector scaling factors uniquely through the ordered sign map."
    proof: "Two nonzero response tuples have equal ordered signs exactly when their coordinatewise ratio is in (R_{>0})^S; invariant maps are therefore constant on, and only on, sign fibers."
    consequence: "Route A is exact for pointwise independently scale-invariant uses, but it does not cover overlap transport, derivatives, nonlocal bridges, or a source-derived reduction of the scale group."
  common_line_reduction_criterion:
    result_id: "LEM-V22-P4T02-B2-COMMON-LINE-COCYCLE-REDUCTION-001"
    setup: "Let sector response coordinates have positive transition cocycles g_s,ij."
    statement: "A reduction to one common positive cocycle g_ij exists exactly when positive patch cochains a_s,i can satisfy a_s,i*g_s,ij=g_ij*a_s,j; equivalently, every pairwise ratio cocycle is a positive coboundary with coherent sector ratios."
    proof: "Dividing the reduction equations for sectors s and t gives g_s,ij/g_t,ij=b_st,j/b_st,i with b_st,i=a_s,i/a_t,i. Conversely choose one reference sector and use coboundary representatives to define the a_s and common reference cocycle."
    exact_limit: "Existence of some reduction does not supply a source-natural choice. Selecting the reduction from source structure is the future law burden."
  unequal_transition_finite_witness:
    common_cocycle:
      g_01: 2
      g_12: 3
      g_02: 6
    positive_cochains:
      R: [1, 2, 4]
      S: [1, 3, 9]
      D: [2, 5, 10]
    raw_sector_cocycles:
      R: [4, 6, 24]
      S: [6, 9, 54]
      D: [5, 6, 30]
    verified_relations:
      - "Each raw row satisfies g_s,01*g_s,12=g_s,02."
      - "All nine equations a_s,i*g_s,ij=g_ij*a_s,j hold."
      - "The raw sector transitions are unequal, so a common-line reduction is broader than literal equality of fixed trivialization factors."
    meaning: "A distinct common-line descent target is mathematically nonempty, but the displayed numbers are a selector witness and not source-derived physics."
  descent_variation_independence:
    result_id: "LEM-V22-P4T02-B2-DESCENT-VARIATION-INDEPENDENCE-001"
    statement: "Common-line descent and admissible-variation generation are logically independent burdens."
    descent_without_variation_control: "Identity response-line transitions coexist with RT008's transverse rank jump when all independent sector variations are allowed."
    variation_control_without_descent: "Zero-only variation is stable while unequal positive line transitions still change Q_ray."
    consequence: "The selected future packet must source both objects independently and cannot define either as the stabilizer of the desired response result."

