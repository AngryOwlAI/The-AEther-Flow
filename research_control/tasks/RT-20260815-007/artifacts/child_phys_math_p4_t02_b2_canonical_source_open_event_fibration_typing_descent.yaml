fixed_hypotheses_and_conventions:
  source_signature: "The current source supplies a nonempty smooth four-manifold with its topology and smooth structure as explicit primitive debt; Phi_src remains an unresolved nonsemantic marker."
  source_target_separation: "The source manifold is not physical spacetime and no target atlas, target metric, desired cone, empirical response, benchmark answer, or physical event data is imported."
  base_category: "C_Open has standard Hausdorff, second-countable, boundaryless, nonempty smooth four-manifolds as objects and smooth open embeddings as arrows. Declared nonempty open submanifolds are objects through their induced smooth structure."
  boundary_convention: "Boundaryless is an explicit theorem hypothesis. If manifolds with boundary are admitted, the full-diffeomorphism natural-section clause must be restricted to each diffeomorphism orbit or replaced, because the interior is a proper invariant open."
  carrier_empty_convention: "The empty subset is admitted as an element of Open(U) for every nonempty base object U, but the empty manifold need not be a base object."
  cover_convention: "A cover is a jointly surjective family of open embeddings j_i:U_i->U; after identifying U_i with its open image, this is an ordinary open cover."
  variance_convention: "Inverse image j^*:Open(U)->Open(V) is contravariant on all open embeddings. Direct image j_!:Open(V)->Open(U) is covariant for open embeddings and is inverse to j^* only for diffeomorphisms. The theorem claims the discrete fibration of the inverse-image presheaf, not a discrete bifibration over all noninvertible embeddings."
  connected_section_convention: "The natural-section theorem is objectwise and componentwise on the groupoid of connected boundaryless sources and all diffeomorphisms. Different diffeomorphism classes may independently choose empty or total."
  measurable_control_convention: "The powerset sigma algebra on Open(U) is introduced only for exact formal-kernel controls. It is not a canonical physical probability space or an adopted proposal measurable structure."

