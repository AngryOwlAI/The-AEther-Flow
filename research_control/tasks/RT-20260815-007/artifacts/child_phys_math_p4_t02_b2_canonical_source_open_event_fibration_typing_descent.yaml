      name: "CanonicalContravariantOpenCarrier"
      status: "proved"
      hypotheses: "Typed open embeddings and ordinary source topology."
      statement: "Inverse image makes Open a strict contravariant frame-valued functor, and its category of elements is a discrete fibration."
      proof: "Inverse image preserves opens, frame operations, identities, and composition. The unique cartesian lift over j with codomain (U,O) has domain (V,j^{-1}O)."
      falsifier: "An admitted arrow whose inverse image is not open or violates identity or composition."
    - theorem_id: "THM-02"
      name: "UniqueOpenCoverDescent"
      status: "proved"
      hypotheses: "Jointly surjective open-embedding cover and pairwise pullback compatibility."
      statement: "Compatible local opens glue uniquely to the union of their open images."
      proof: "Open images have open union; compatibility gives the prescribed restrictions; the covering property gives uniqueness."
      falsifier: "Compatible local opens with zero or multiple globals, or a purported global for an overlap-incompatible family."
    - theorem_id: "THM-03"
      name: "ConnectedFullDiffTrivialNaturalSection"
      status: "proved_with_explicit_boundaryless_and_componentwise_scope"
      hypotheses: "Connected boundaryless smooth manifold and naturality under the full diffeomorphism group."
      statement: "Each natural selected open is empty or total, independently on each diffeomorphism-class component."
      proof: "Full diffeomorphisms act transitively on points; any nonempty invariant subset contains every point."
      falsifier: "A proper nonempty fully invariant open under the declared hypotheses. Manifold boundary, disconnectedness, or reduced symmetry falsifies only an overbroad hypothesis set."
    - theorem_id: "THM-04"
      name: "CarrierOccurrenceUnderdetermination"
      status: "proved_by_distinct_formal_kernels"
      hypotheses: "Powerset sigma algebra and inverse-image pushforward used as nonsemantic controls."
      statement: "The same Open carrier and restrictions support continuum-many distinct normalized natural formal kernels K^lambda."
      proof: "Empty and total restrict to empty and total; convex mixtures remain normalized and natural; singleton mass at empty separates lambda."
      falsifier: "A theorem deriving one lambda from carrier, restriction, covariance, and normalization without any additional source law."
    - theorem_id: "THM-05"
      name: "OpenCarrierProposalFiberComparisonDecision"
