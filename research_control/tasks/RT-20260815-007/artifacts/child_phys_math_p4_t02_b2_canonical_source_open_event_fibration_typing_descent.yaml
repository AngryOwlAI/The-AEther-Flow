composite_theorem:
  theorem_name: "CanonicalSourceOpenCarrierTypingDescentAndNonselectionTheorem"
  hypotheses:
    - "C_Open is the declared category of standard boundaryless smooth four-manifolds and smooth open embeddings."
    - "Open(U) is the frame of all topologically open subsets of U, including empty and total."
    - "Covers are jointly surjective open-embedding families and compatibility is equality after pullback to every pairwise fiber product."
    - "The natural-section classification is restricted to connected objects and naturality under every diffeomorphism."
    - "Formal kernels use the powerset sigma algebra and inverse-image pushforward only as mathematical controls."
    - "No open subset is assigned proposal, event, occurrence, probability, response, causal, temporal, geometric, or empirical semantics."
  statement_clauses:
    - clause_id: "CLAUSE-01"
      statement: "Open:C_Open^op->Frm is a strict contravariant functor with Open(j)=j^{-1}."
    - clause_id: "CLAUSE-02"
      statement: "The category of elements IntegralOpen of the underlying Set-valued presheaf projects by pi_Open:IntegralOpen->C_Open as a discrete fibration."
    - clause_id: "CLAUSE-03"
      statement: "Open is a sheaf for the declared open-cover topology: compatible local opens glue uniquely by union of their open images."
    - clause_id: "CLAUSE-04"
      statement: "On each connected component of the groupoid of connected boundaryless source manifolds and diffeomorphisms, every natural open selection is fiberwise empty or total."
    - clause_id: "CLAUSE-05"
      statement: "For every lambda in [0,1], K_U^lambda=lambda delta_empty+(1-lambda)delta_U is a normalized inverse-image-natural formal kernel, and distinct lambda give distinct kernels on the same carrier."
    - clause_id: "CLAUSE-06"
      statement: "The Open construction satisfies only the narrow topology-carrier, transport, projection, restriction, and underlying-cover-descent part of the RT003 grammar; every proposal-semantic, discriminating-admissibility, occurrence-generator, realized-token, physical-probability, and kernel-descent claim remains absent."
  proof:
    - step_id: "PROOF-01"
      derivation: "For any continuous open embedding j:V->U, inverse images of opens are open, j^{-1}(empty)=empty, j^{-1}(U)=V, and inverse image preserves arbitrary unions and finite intersections. Thus j^* is a frame homomorphism."
    - step_id: "PROOF-02"
      derivation: "Identity and composition follow from id_U^{-1}(O)=O and (j composed with k)^{-1}(O)=k^{-1}(j^{-1}(O)), so Open is strict contravariant."
    - step_id: "PROOF-03"
      derivation: "Objects of IntegralOpen are pairs (U,O). An arrow (V,O_V)->(U,O_U) over j exists exactly when O_V=j^{-1}(O_U). For each j and codomain pair there is exactly one lift (V,j^{-1}(O_U))->(U,O_U); the composition identity above proves its cartesian universal property."
    - step_id: "PROOF-04"
      derivation: "For a compatible cover, each image j_i(O_i) is open in U. Their union O is open. Fiber-product compatibility implies j_i^{-1}(O)=O_i. If O' has the same restrictions, joint surjectivity gives O'=union_i j_i(O_i)=O."
    - step_id: "PROOF-05"
      derivation: "A connected smooth manifold is path connected. Compactly supported coordinate-ball diffeomorphisms can be composed along a path from x to y, so Diff(M) acts transitively on points. A Diff(M)-invariant open containing one point contains every point; otherwise it is empty. Naturality transports the same alternative through each diffeomorphism-class component."
    - step_id: "PROOF-06"
      derivation: "For every open embedding j:V->U, j^{-1}(empty)=empty and j^{-1}(U)=V. Hence pushforward along j^* sends delta_empty to delta_empty and delta_U to delta_V, so it sends K_U^lambda to K_V^lambda. The mass of the singleton {empty} is lambda, making different lambda distinct."
    - step_id: "PROOF-07"
      derivation: "All constructors in PROOF-01 through PROOF-06 eliminate to topology, set operations, and typed source arrows. None defines a map from an open subset to a general RT003 proposal, an admissibility predicate, an occurrence generator, or a physical interpretation. The typed comparison therefore narrows but does not erase the RT003 obstruction."
  principal_falsifier: "The composite result would be falsified by an admitted arrow on which inverse image fails functoriality, compatible open-cover data with no unique global open, a proper nonempty open invariant under the full diffeomorphism group of a connected boundaryless source, uniqueness of the formal kernel from carrier and naturality alone, or a target-free current-source construction of the missing RT003 proposal semantics and occurrence generator."
  scope_falsifiers:
    - "A connected manifold with nonempty boundary has a proper invariant interior; this falsifies any version of the section clause that omits the boundaryless hypothesis."
    - "A marked point with only point-preserving diffeomorphisms makes M without {p} a proper invariant open; this falsifies any version that weakens full-diffeomorphism naturality without recording the symmetry-breaking datum."
    - "On a disconnected manifold, unions of component orbits may be proper invariant opens; this falsifies any version that omits connectedness."
    - "Direct image and inverse image are not mutually inverse for a proper open embedding; this falsifies any claim of a discrete bifibration of the discrete inverse-image category of elements over all open embeddings."

