variance_and_fibration_audit:
  base_category: "B_open"
  base_category_definition: "Objects are declared source opens U; arrows j:V->U are open embeddings."
  contravariant_carrier_signature: "OpenObj:B_open^op->Set"
  contravariant_carrier_object_map: "OpenObj(U)=Open(U)"
  inverse_image_signature: "j_star:Open(U)->Open(V)"
  inverse_image_definition: "j_star(O)=j^{-1}(O)"
  inverse_image_status: "canonical_contravariant_transport"
  direct_image_signature: "j_bang:Open(V)->Open(U)"
  direct_image_definition: "j_bang(P)=j(P)"
  direct_image_status: "canonical_covariant_transport_for_open_embeddings"
  adjunction_statement: "j_bang(P) is contained in O if and only if P is contained in j_star(O)."
  diffeomorphism_relation: "For a diffeomorphism f, f_bang is the inverse bijection of f_star; the two variances are not independent source structure."
  category_of_elements_objects: "Pairs (U,O) with O in Open(U)."
  category_of_elements_arrows: "An arrow (V,P)->(U,O) over j:V->U exists exactly when P=j_star(O)."
  projection_signature: "pi:int(OpenObj)->B_open"
  projection_definition: "pi(U,O)=U"
  projection_status: "discrete_fibration"
  cartesian_lift: "For j:V->U and (U,O), the unique lift is (V,j_star(O))->(U,O)."
  covariant_category_of_elements_note: "The direct-image functor similarly yields a discrete opfibration; over the diffeomorphism groupoid the fibration and opfibration views are equivalent by inverse arrows."
  proposal_semantics_from_fibration: false
  occurrence_semantics_from_fibration: false

theorem_target_audit:
  theorem_target_count: 5
  targets:
    - theorem_id: "THM-01"
      name: "CanonicalContravariantOpenCarrier"
      status: "proved_with_declared_hypotheses"
      statement: "Inverse image makes OpenObj a contravariant functor on B_open, and its category of elements projects as a discrete fibration."
      proof: "Inverse image of an open subset is open. For every U, id_U^{-1}(O)=O. For k:Z->V and j:V->U, (j composed with k)^{-1}(O)=k^{-1}(j^{-1}(O)). The category-of-elements lift over j with codomain (U,O) must have fiber object j^{-1}(O), so it exists and is unique."
      falsifier: "An admitted arrow whose inverse image is not open, an identity or composition failure, or two distinct lifts over one base arrow with the same codomain would refute the claim."
      semantic_nonconclusion: "A discrete fibration of open subsets is not by itself Prop, F_prop, an event fibration, or an occurrence law."
    - theorem_id: "THM-02"
      name: "UniqueOpenCoverDescent"
      status: "proved_with_declared_hypotheses"
      statement: "Every overlap-compatible family O_i in Open(U_i) on a jointly surjective open cover u_i:U_i->U glues uniquely to O=union_i u_i(O_i) in Open(U)."
      proof: "Each u_i(O_i) is open because u_i is an open embedding, so their union O is open. Pairwise compatibility on fiber-product overlaps gives u_i^{-1}(O)=O_i. Any other O_prime with the same restrictions equals the union of its covered restrictions and therefore equals O."
      falsifier: "A compatible family whose union is not open, whose union restricts incorrectly, or two distinct global opens with the same cover restrictions would refute existence or uniqueness."
      semantic_nonconclusion: "Carrier descent is not kernel descent, physical locality, observer localization, or empirical gluing."
    - theorem_id: "THM-03"
      name: "ConnectedFullDiffTrivialNaturalSection"
      status: "proved_with_scope_limit"
      statement: "For each connected smooth source manifold M without boundary, an open O_M invariant under every diffeomorphism of M is empty or all of M; a full-groupoid natural open selection is therefore objectwise empty or total."
      proof: "A connected smooth manifold is path connected. Coordinate-ball moves generated by compactly supported smooth vector fields can be composed along a path to map any point x to any point y, so Diff(M) acts transitively. If invariant O_M contains x, invariance puts every y in O_M; otherwise O_M is empty. No equation relates nonisomorphic groupoid components."
      falsifier: "A connected boundaryless smooth manifold with two full-diffeomorphism point orbits, or a proper nonempty open invariant under every diffeomorphism, would refute the theorem. Allowing a boundary, marked datum, or selected subgroup changes the hypotheses rather than refuting this scoped result."
      semantic_nonconclusion: "The empty and total assignments are mathematical natural sections, not realized events or an occurrence rule."
    - theorem_id: "THM-04"
      name: "CarrierOccurrenceUnderdetermination"
      status: "proved_by_distinct_formal_kernel_family"
      statement: "For every nonempty U and lambda in [0,1], K_U^lambda=lambda delta_empty+(1-lambda) delta_total is a normalized formal kernel supported on the fixed subcarrier {empty,U}; restriction pushes K_U^lambda to K_V^lambda. Distinct lambda give distinct natural kernels while all carrier data remain fixed."
      proof: "Restriction sends empty to empty and U to V, so pushforward preserves both endpoint Dirac measures and every convex mixture. Normalization and nonnegativity hold for all lambda in [0,1]. Lambda=0, 1/2, and 1 give at least three distinct kernels on the identical carrier and transport."
      falsifier: "A current-source theorem that, without adding a selector or outcome datum, derives one unique lambda and survives the same-carrier comparison would refute this nonimplication."
      semantic_nonconclusion: "Formal normalization and naturality do not define physical probability, empirical frequency, or a realized token."
    - theorem_id: "THM-05"
      name: "OpenCarrierProposalFiberComparisonDecision"
      status: "proved_structural_precursor_with_exact_nonidentification"
      statement: "OpenObj supplies a target-free carrier, inverse-image transport, a category-of-elements projection, and carrier descent, but no current-source typing identifies its elements with RT003 proposals or constructs the general proposal fibration, admissibility layer, occurrence generator, physical probability, or realization semantics."
      proof: "Every OpenObj constructor eliminates to current topology, establishing source purity. The canonical sources contain no proposal predicate, typed open-to-proposal map, F_prop declaration, admissibility selector, Gen_occ, or physical-event interpretation. The distinct formal kernels show that even a discrete measurable envelope cannot determine occurrence."
      falsifier: "A separately admitted target-free current-source law that types an open-to-proposal identification or general F_prop, supplies coherent measurable and local structure, derives a unique admissibility or occurrence generator, and passes same-carrier and provenance controls would remove the stated nonidentification."
      semantic_nonconclusion: "This theorem narrows the RT003 formation burden for one structural precursor and does not overturn the fixed RT003 scoped obstruction for a general proposal-fiber architecture."

