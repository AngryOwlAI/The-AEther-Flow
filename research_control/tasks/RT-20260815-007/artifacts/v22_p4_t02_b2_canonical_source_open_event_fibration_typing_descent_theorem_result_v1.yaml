    name: "CanonicalContravariantOpenCarrier"
    result: "proved"
    hypotheses: "Topological spaces supplied by current smooth manifolds; declared arrows are continuous open embeddings; empty open admitted in every fiber."
    proof: "Inverse image preserves opens, identity, composition, inclusion, finite intersections, and arbitrary unions."
