    name: "UniqueOpenCoverDescent"
    result: "proved"
    hypotheses: "Declared family is an open cover and local opens agree on pairwise overlaps."
    proof: "The union is open, restricts to every local open by compatibility, and is unique by the cover property."
    falsifier: "A noncover or an incompatible local family."
  - theorem_id: "THM-03"
    name: "ConnectedFullDiffTrivialNaturalSection"
    result: "proved_objectwise"
    hypotheses: "Connected boundaryless smooth manifold of positive dimension; invariance under the full diffeomorphism group."
    proof: "The full diffeomorphism group acts transitively on points; any nonempty invariant open contains every point."
    falsifier: "A manifold with boundary, disconnected object, or restricted arrow group may admit a proper invariant open."
  - theorem_id: "THM-04"
    name: "CarrierOccurrenceUnderdetermination"
    result: "proved"
    hypotheses: "Fixed binary subcarrier {empty,total}; normalized formal kernels only."
    proof: "For every t in [0,1], (1-t)delta_empty+t delta_total is natural and normalized; distinct t give distinct kernels on identical carrier data."
    falsifier: "An independently source-derived selector theorem uniquely fixes t without target or outcome import."
  - theorem_id: "THM-05"
    name: "OpenCarrierProposalFiberComparisonDecision"
    result: "proved_exact_partial_comparison"
    hypotheses: "RT003 general proposal-fiber requirements remain fixed and no semantic relabeling is allowed."
