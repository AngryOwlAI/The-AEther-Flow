strict_total_alternative:
  theorem: "For a finite exact configuration A, exactly one of Gamma(A) nonempty and a nonzero alpha>=0 with A alpha=0 holds. If both held, k(A alpha)=sum_s alpha_s k(v_s)>0 would equal zero. If Gamma is empty, exact Gordan separation returns a nonzero nonnegative kernel vector; minimizing its finite support returns a listed positive circuit of size at most r+1."
  exact_decision_procedure: "Use exact strict linear feasibility over K for A^*k>0. On failure, use its exact nonnegative-kernel certificate and lexicographic support minimization only at the declared presentation."
  invariant_output: "The unique branch tag plus the transported certificate-orbit bundle."
  representative_output: "One exact raw witness at each declared fixture presentation."
  fixture_branch_counts: {"Feasible": 3, "Obstructed": 2}
  every_fixture_has_exactly_one_branch_tag: true
  no_fixture_has_both_branches: true
  no_fixture_has_neither_branch: true
  both_total_branches_exercised: true

