complete_covector_method:
  method_id: "EXACT-SIGN-COVECTOR-ENUMERATION-BY-PROJECTED-GORDAN"
  sign_cube_exhausted: true
  rule: "For every sigma in {-,0,+}^S, compute the exact nullspace N_sigma of the columns with sigma_s=0. Project each signed nonzero column to N_sigma. The word is realized exactly when the projected signed family has no nonzero nonnegative dependence. Exact Gordan elimination checks every support-minimal dependence of size at most dim(N_sigma)+1."
  completeness_proof: "Every dual k determines one tested sign word. Conversely, absence of a nonnegative dependence in the projected signed family gives a strict dual witness on the equality subspace by Gordan's alternative. Exhausting all 3^|S| words therefore constructs exactly Cstar(A)."
  arithmetic: "Reduced rational arithmetic only for the five fixtures."
  approximate_tolerance_used: false
  aggregate_newline_digest: "3821927e9469e78cd90c9361db4ec12994c68db5019a7fb9b808527c33142a82"

