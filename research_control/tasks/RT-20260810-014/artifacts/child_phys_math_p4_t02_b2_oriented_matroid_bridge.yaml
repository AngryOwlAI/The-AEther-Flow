typing_audit_and_repairs:
  audit_status: "all_three_defects_resolved_inside_the_admitted_exact_domain"
  repairs_are_definitionally_material: true
  repairs_expand_scientific_authority: false
  items:
    - repair_id: "TR-01-CERTIFICATE-ORBIT-DESCENT"
      original_defect: "The raw signature Alt_A:Conf_plus(S,V)->Feasible(k) disjoint_union Obstructed(C,alpha) is not a function on presentation classes because k and alpha are representative-dependent and no natural raw witness is selected by the quotient."
      exact_repair: "Define Alt_rep on configuration-groupoid objects and transport raw certificates along every (T,D,p) arrow. Define Tot on the quotient as the invariant branch tag together with the isomorphism class of the nonempty transported certificate bundle. Fixture evaluators may record one raw certificate only at their declared presentation."
      feasible_transport: "For A'=T A D P^{-1}, transport k to k'=T^{-*}k; then A'^*k'=P D A^*k has the transported strictly positive coordinates."
      obstructed_transport: "For A alpha=0, transport alpha to alpha'=P D^{-1}alpha; then A'alpha'=T A alpha=0 and positivity plus support minimality are preserved."
      raw_certificate_claim_on_quotient: false
      groupoid_equivariance_proved: true
      blocking_after_repair: false
    - repair_id: "TR-02-EFFECTIVELY-FINITE-PATH-DOMAIN"
      original_defect: "An arbitrary continuous path on a compact interval can meet a determinant wall infinitely often, so an unqualified finite ordered wall record is false."
      exact_repair: "Restrict Strat to a predeclared finite piecewise-polynomial or piecewise-rational path family over the effective exact field, with nonvanishing denominators and each relevant nonzero minor numerator supplied to exact root isolation. Identically zero minors define a declared lower stratum instead of an infinite event list."
      arbitrary_continuous_path_robustness_claimed: false
      continuum_robustness_claimed: false
      root_isolation_required: true
      blocking_after_repair: false
    - repair_id: "TR-03-EFFECTIVE-EXACT-ORDERED-FIELD"
      original_defect: "Decidable sign and rank alone do not type exact strict linear feasibility or exact ordering of algebraic wall parameters."
      exact_repair: "Require an effective exact ordered field K embedded in R with exact arithmetic, equality and order, Gaussian elimination, strict linear-feasibility decision with certificates, and real-root isolation plus comparison for the univariate path polynomials used by Strat."
      fixture_field: "Q"
      general_admitted_field: "Any effective exact ordered real algebraic field satisfying the stated algorithms."
      approximate_floating_point_authority: false
      blocking_after_repair: false
  counterfactual_fail_condition: "If any downstream artifact reverts to a raw quotient-to-witness function, arbitrary-continuous finite wall enumeration, or a representation lacking exact feasibility and root isolation, the constructed-candidate verdict no longer applies and FB-06, FB-08, or FB-11 must fail closed."

