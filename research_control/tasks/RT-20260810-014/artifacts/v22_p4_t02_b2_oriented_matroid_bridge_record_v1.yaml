type_repairs:
  - repair_id: "BR-01-CERTIFICATE-ORBIT-DESCENT"
    original_hazard: "Alt_A was ill-typed if a presentation quotient was said to return a raw dual witness k or raw positive kernel vector alpha."
    repair: "Define Bridge_OM first as equivariant data on the configuration groupoid. Its quotient value is an isomorphism class with a certificate orbit; raw certificates transport by k -> T^{-T}k and alpha -> P D^{-1}alpha."
    result: "repaired"
  - repair_id: "BR-02-FINITE-COMPLEXITY-PATH-DOMAIN"
    original_hazard: "An arbitrary continuous compact-interval path can cross determinant walls infinitely often, so finite wall enumeration is false at that generality."
    repair: "Restrict Strat to predeclared finite semialgebraic or piecewise-rational exact paths with root isolation; make no finite-enumeration claim for arbitrary continuous paths."
    result: "repaired"
  - repair_id: "BR-03-ADEQUATE-EXACT-DECISION-DOMAIN"
    original_hazard: "Decidable sign and rank alone do not decide complete sign-cell feasibility or isolate every admitted wall event."
    repair: "Require an ordered exact field or representation with decidable sign, rank, homogeneous linear feasibility, and path-root isolation. All executable fixtures use Q."
    result: "repaired"

formal_domain:
  sector_set: "A finite nonempty predeclared set S_decl; no exhaustiveness claim over P7 sectors."
  source_space: "A finite-dimensional vector space V_src over an adequate ordered exact field F, with 1 <= rank(A)=r <= 4 in the selected packet."
  configuration: "A:R^{S_decl}->V_src with nonzero columns v_s carrying positive orientation and explicit proposal-only provenance."
  exact_input_class: "F=Q for the fixtures; generally, an exact ordered field or representation with decidable sign, rank, homogeneous linear feasibility, and root isolation on the admitted path class."
  dual_domain: "V_src^*, used only to realize sign covectors and return certificate fibers."
  presentation_groupoid: "Objects are oriented configurations; arrows are source-linear isomorphisms, independent positive column scalings, and sector relabelings."
  refinement_domain: "Finite inclusions that preserve each old oriented ray up to positive rescaling and add independently provenance-bound sectors."
  variation_domain: "Predeclared finite semialgebraic or piecewise-rational exact paths; arbitrary continuous paths are excluded from finite wall enumeration."

formal_objects:
  realized_covectors:
    notation: "Cstar(A)={sgn(A^*k):k in V_src^*}"
    construction: "Test every element of {-,0,+}^{S_decl} by exact homogeneous equality and strict-inequality feasibility, retaining every feasible sign cell with an exact witness."
  strict_positive_chamber:
    notation: "Gamma(A)={k:k(v_s)>0 for every s}"
    meaning: "Formal common sign admissibility only; not physical causality or a Lorentzian cone."
  minimal_positive_circuits:
    notation: "Cir_plus(A)"
    construction: "Enumerate supports of size at most r+1, retain exactly the support-minimal one-dimensional kernel rays with a strictly positive generator, and verify rank and kernel dimension."
  total_alternative:
    notation: "Tot(A)"
    construction: "Return exactly Feasible(k) when Gamma(A) is nonempty or Obstructed(C,alpha) for one verified minimal positive circuit."
  refinement_package:
    notation: "Ref(A_S,A_T)"
    construction: "Covector restriction, Gamma inclusion, persistence of already supported positive circuits, and nested-inclusion composition."
  path_stratification:
    notation: "Strat(A(t))"
    construction: "Isolate zero-vector, rank, and determinant-minor roots in the admitted path class, then record ordered events and wall-free intervals."

constructed_theorems:
  - theorem_id: "THM-V22-P4T02-B2-OM-COVECTOR-COMPLETENESS-001"
    statement: "Exact feasibility over the finite sign cube constructs all and only realized covectors, including zero coordinates, without selecting a preferred all-positive sign."
    scope: "finite exact configurations"
  - theorem_id: "THM-V22-P4T02-B2-OM-STRICT-ALTERNATIVE-002"
    statement: "Gordan's strict alternative makes Feasible(k) and Obstructed(C,alpha) exhaustive and exclusive; a nonzero nonnegative kernel certificate contains a support-minimal positive circuit."
    scope: "finite exact configurations"
  - theorem_id: "THM-V22-P4T02-B2-OM-CIRCUIT-BOUND-003"
    statement: "Every minimal positive circuit C has rank(A_C)=|C|-1, one-dimensional kernel, a uniform positive coefficient ray, and |C|<=r+1<=5."
    scope: "selected rank bound r<=4"
  - theorem_id: "THM-V22-P4T02-B2-OM-PRESENTATION-EQUIVARIANCE-004"
    statement: "Cstar, Cir_plus, the total branch, rank, and refinement structure transport naturally under GL(V_src), positive diagonal column scaling, and permutation; raw certificates form transported fibers."
    scope: "configuration groupoid, not physical gauge"
  - theorem_id: "THM-V22-P4T02-B2-OM-REFINEMENT-005"
    statement: "For a finite inclusion S into T, covector restriction is surjective, Gamma(A_T) is contained in Gamma(A_S), old supported positive circuits persist, and restrictions compose."
    scope: "declared finite inclusions"
  - theorem_id: "THM-V22-P4T02-B2-OM-PATH-STRATIFICATION-006"
    statement: "On the admitted finite-complexity exact path class, isolated zero, rank, and determinant-minor events give a finite ordered wall record and constant oriented-matroid data on wall-free strata."
    scope: "not arbitrary continuous paths and not continuum robustness"

