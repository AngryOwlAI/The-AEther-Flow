independent_assessment:
  verdict: "constructed_candidate"
  exact_positive_result: "The finite classifier is mathematically constructible after three explicit type repairs: output raw certificates only equivariantly or as certificate orbits; admit only predeclared tame paths with finitely isolable wall events; and admit only exact ordered inputs supporting all required feasibility and root-isolation decisions."
  exact_limit: "The construction classifies finite oriented vector configurations. It does not derive the configurations from current ontology, choose a physical common time, define physical gauge, establish empirical response, cover all P7 sectors, or construct a quadratic cone, conformal geometry, scale, or g_eff."
  decisive_basis:
    - "Every realized sign covector is finitely enumerable by exact sign-feasibility over the repaired input domain."
    - "Every minimal positive circuit is finitely enumerable by exact subset, rank, nullspace, positivity, and support-minimality tests."
    - "Gordan's strict alternative makes the feasible and obstructed tags exhaustive and mutually exclusive for each valid configuration."
    - "Presentation changes transport raw witnesses but do not canonically identify them; using an equivariant data groupoid removes the quotient-to-raw-witness type error."
    - "Fixed-ambient finite refinements give surjective covector restriction, chamber inclusion, and persistence of old supported positive circuits."
    - "Piecewise-rational or semialgebraic declared paths have exactly isolable finite wall records; no claim is made for arbitrary continuous paths."
    - "The total two-branch rule and precommitted provenance boundary prevent favorable-branch filtering from counting as source evidence."
  blocking_conflicts: []
  mandatory_fusion_corrections:
    - "Represent presentation invariance as equivariance on a configuration groupoid, or quotient both configurations and certificates into compatible orbits; never map a presentation quotient directly to raw k or alpha."
    - "Restrict Strat to a predeclared finite family of piecewise-rational, piecewise-algebraic, or semialgebraic paths with finitely isolable discriminant events; arbitrary continuous paths are outside the constructed domain."
    - "Restrict exact computation to rational or real-algebraic inputs, or another ordered exact field package with decidable finite linear feasibility, nullspace positivity, determinant signs, and path-event root isolation; sign and rank predicates alone are insufficient."
  fail_closed_rule: "If the fused artifact omits any mandatory type repair, the corresponding result is not this constructed candidate and must trigger FB-06, FB-08, or FB-11 and return a precise obstruction."

