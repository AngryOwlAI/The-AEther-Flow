typed_construction:
  input_package:
    notation: "A_dec=(K,S_decl,V_src,A,Prov,D_ref,P_decl)"
    exact_field: "K is Q, a real algebraic ordered field with effective operations, or an explicitly equivalent exact ordered domain supporting all declared decision procedures."
    sector_set: "S_decl is finite and nonempty; it is a declared sample, not all-P7 coverage."
    source_space: "V_src is a finite-dimensional K-vector space of rank r with 1<=r<=4."
    sector_map: "A:K^{S_decl}->V_src has predeclared nonzero oriented columns v_s."
    provenance: "Prov records each sector label, orientation, representative, exact datum, and construction source before any branch evaluation."
    refinement_diagram: "D_ref is a finite diagram of sector inclusions in a fixed ambient V_src, or with explicitly supplied invertible source transport."
    variation_family: "P_decl is a finite list of piecewise-rational, piecewise-algebraic, or semialgebraic paths whose relevant determinant events admit exact root isolation."
    excluded_data:
      - "target atlas, metric, tetrad, coframe, desired cone, or GR coefficient"
      - "empirical calibration, benchmark fit, or desired all-plus outcome"
      - "shared tau, Q_ray, midpoint, repaired plane, common character, anchor, cochain, holonomy, or protection law"
      - "registry, role, validation, checkpoint, consensus, or Gate state as a scientific premise"
  formal_objects:
    - object_id: "ORIENTED-SECTOR-CONFIGURATION"
      definition: "The exact presented map A with nonzero oriented proposal-only sector rays and frozen provenance."
    - object_id: "CONFIGURATION-PRESENTATION-GROUPOID"
      definition: "Objects are exact presented configurations; morphisms are source-linear isomorphisms T, positive diagonal representative changes D, and sector permutations P."
    - object_id: "REALIZED-SIGN-COVECTORS"
      definition: "Cstar(A) is the complete image of k|->sgn(A^*k), including all zero coordinates and the zero covector."
    - object_id: "MINIMAL-POSITIVE-CIRCUITS"
      definition: "Cir_plus(A) contains every support-minimal nonzero alpha>=0 with A alpha=0, represented by its support and positive coefficient ray."
    - object_id: "TOTAL-ALTERNATIVE-CERTIFICATE"
      definition: "Tot(A) returns exactly Feasible(k) or Obstructed(C,alpha); the tag is presentation invariant and the raw witness is equivariant."
    - object_id: "REFINEMENT-PACKAGE"
      definition: "Ref(A) contains covector restrictions, strict-chamber inclusions, circuit persistence maps, and their nested-composition laws for D_ref."
    - object_id: "TAME-VARIATION-STRATIFICATION"
      definition: "Strat(A) contains the exact ordered wall records and wall-free intervals for P_decl only."
    - object_id: "BRIDGE-DATA-GROUPOID"
      definition: "Bridge outputs and certificates with their natural T,D,P transports; its isomorphism classes are the quotient-level outputs."
  formal_maps:
    - map_id: "SIGN-EVALUATION"
      signature: "sigma_A:V_src^*->{-,0,+}^{S_decl}"
      construction: "Enumerate every sign word and retain exactly those whose equality and strict-inequality system is feasible over K."
    - map_id: "POSITIVE-CIRCUIT-ENUMERATOR"
      signature: "CirEnum_A:subsets(S_decl)->positive coefficient rays or empty"
      construction: "Test every support of size at most r+1 by exact rank, kernel, strict positivity, and proper-subset tests."
    - map_id: "TOTAL-ALTERNATIVE"
      signature: "Tot_A:presented configurations->Feasible(k) disjoint_union Obstructed(C,alpha)"
      construction: "Use exact normalized linear feasibility; minimize any nonzero nonnegative kernel support before returning the obstruction."
    - map_id: "PRESENTATION-TRANSPORT"
      signature: "A'=T A D P^{-1}; k'=(T^{-1})^*k; alpha'=P D^{-1}alpha"
      construction: "Transport sign coordinates, circuit supports, certificate rays, ranks, branches, and labels equivariantly."
    - map_id: "COVECTOR-RESTRICTION"
      signature: "rho_i:Cstar(A_T)->Cstar(A_S)"
      construction: "Restrict coordinates; every k realizing a covector on S also realizes an extension on T, so rho_i is surjective and compositions are literal restrictions."
    - map_id: "FEASIBILITY-INCLUSION"
      signature: "Gamma(A_T)->Gamma(A_S)"
      construction: "A functional positive on every T column is positive on every old S column."
    - map_id: "CIRCUIT-PERSISTENCE"
      signature: "kappa_i:Cir_plus(A_S)->Cir_plus(A_T) on old supports"
      construction: "An old positive dependence remains, and no proper old subset becomes dependent merely by adjoining outside columns."
    - map_id: "VARIATION-WALL-RECORD"
      signature: "Wall:P_decl->finite ordered exact event lists"
      construction: "Isolate zero-column, rank, and relevant minor roots on each tame path piece; retain constant oriented-matroid data only between events."
    - map_id: "BRIDGE-FACING-CLASSIFIER"
      signature: "Bridge_OM:configuration presentation groupoid->bridge data groupoid"
      construction: "Assemble Cstar, Cir_plus, Tot, Ref, and Strat functorially; pass to isomorphism classes only after transporting certificates."
  exact_totality_argument:
    exclusivity: "If k(v_s)>0 for every s and alpha>=0 is nonzero with A alpha=0, then 0=k(A alpha)=sum_s alpha_s k(v_s)>0, a contradiction."
    exhaustivity: "Gordan's finite strict alternative supplies one branch. In the obstructed branch, minimizing support produces a positive circuit."
    exact_computation: "For finite rational or real-algebraic data, normalized strict feasibility and normalized nonnegative-kernel feasibility are decidable by exact linear methods."
    branch_neutrality: "Both tags are terminal construction evidence for the classifier; neither fixture admission nor scientific credit is conditioned on Feasible."
  presentation_semantics:
    presentation_equivalence_is_physical_gauge: false
    reason: "T,D,P are declared mathematical re-presentations for this proposal. Current ontology supplies no physical gauge principle identifying the represented states."
    raw_witness_invariant: false
    raw_witness_treatment: "Raw k and alpha transform equivariantly. Only branch, transported covector/circuit data, and certificate orbit are quotient-level data."
    negative_reorientation_quotiented: false
    negative_reorientation_reason: "Multiplying one column by -1 changes its oriented ray, flips one covector coordinate, and can create or destroy positive circuits; it is new source input requiring provenance."
  variation_semantics:
    arbitrary_continuous_paths_supported: false
    finite_tame_paths_supported: true
    reason: "An arbitrary continuous or smooth path can cross a determinant wall infinitely often on a compact interval. Finite exact wall enumeration therefore requires a tame path category and exact event isolation."
    robustness_credit: "Only stratumwise stability and recorded crossings for P_decl; no arbitrary finite-variation, continuum, or physical robustness."

