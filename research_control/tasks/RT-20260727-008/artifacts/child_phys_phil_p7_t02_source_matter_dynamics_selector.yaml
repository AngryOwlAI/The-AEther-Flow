branch_comparison:
  source_action:
    ontology_versus_model_status: >-
      Adds a source-history functional and stationarity principle as new model
      postulates. It is not derived ontology, a physical matter action, or an
      adopted law.
    new_ontological_commitments:
      - "composable history domain and history orientation"
      - "scalar or ordered action codomain, weights, and coefficients"
      - "variation class, boundary data, and stationarity principle"
      - "history symmetry if a Noether-style result is sought"
    identity_and_modality_of_state_changes: >-
      Extremal histories remain possible mathematical histories; an action
      supplies neither persistent particle identity nor physical actuality.
    semantic_risks:
      time: "History order may be overread as physical or proper time."
      probability: "An action gives no probability unless a separate history measure and normalization are added."
      action: "The functional and privilege of stationary histories are stipulated."
      circularity_and_target_import: "Desired balance, cone, coupling, target Lagrangian, metric contraction, or GR behavior can be encoded directly in the action."
    minimal_primitive_commitment:
      rating: "high"
      basis: "P7-T01 supplies no history measure, scalar pairing, variation class, or extremality principle."
    derivation_versus_stipulation_test:
      stipulated: "action, coefficients, history domain, variations, and boundary conditions"
      could_count_as_derived: "Reproducible stationarity equations or symmetry identities that follow from, rather than occur verbatim in, the action."
      cannot_count_as_derived: "P7-T01 admissibility or desired downstream behavior inserted as hard action constraints."
    empirical_or_operational_overread_risk:
      level: "high"
      examples: "extremal history as observed trajectory; coefficients as calibrated masses or couplings; formal invariance as physical conservation"
    constructibility:
      rating: "medium"
      reason: "Finite-history actions are possible, but every weighting and variational structure would be new and currently unmotivated."
    honest_future_claim: "At most one proposal-only source-history action with candidate-relative stationarity or symmetry results; no physical action, stress energy, coupling, or realized dynamics."

  source_evolution_equation:
    ontology_versus_model_status: >-
      Adds an evolution parameter or ordered action, a state-space
      representation, and a generator or update operator as proposal-only model
      primitives. None is derived by P7-T01.
    new_ontological_commitments:
      - "oriented evolution parameter, step object, or semigroup"
      - "state-space embedding supporting a difference or derivative"
      - "generator, initial data, and existence or uniqueness semantics"
      - "constraint propagation and degenerate-branch rules"
    identity_and_modality_of_state_changes: >-
      A unique map gives formal state persistence, not diachronic identity of
      physical particles or observers; nonunique evolution gives possible
      continuations, not probabilities or actual events.
    semantic_risks:
      time: "Strongest risk of identifying an iteration parameter with physical time."
      probability: "A deterministic equation has none; a stochastic equation requires new sample and normalization data."
      action: "No action follows without additional variational structure."
      circularity_and_target_import: "Constraint preservation, target wave equations, continuum time, principal cones, or desired dispersion can be built into the generator."
    minimal_primitive_commitment:
      rating: "medium_high"
      basis: "Avoids action weights but adds temporal, state-space, generator, and initial-value semantics."
    derivation_versus_stipulation_test:
      stipulated: "evolution order, state embedding, generator, and initial-value domain"
      could_count_as_derived: "Constraint propagation, fixed points, or an invariant proved from an independently specified generator."
      cannot_count_as_derived: "Preservation explicitly imposed on the generator, or a formal principal part called a physical cone."
    empirical_or_operational_overread_risk:
      level: "high"
      examples: "update order as clock time; solution as physical trajectory; uniqueness as physical determinism; spectrum as measured energy"
    constructibility:
      rating: "medium_low_as_a_distinct_branch"
      reason: "Integer occupations have no canonical differential structure; a discrete recurrence without independent evolution semantics collapses into a transition law."
    honest_future_claim: "At most one proposal-only parameterized update model with candidate-relative solutions and constraint results; no physical time, determinism, causality, or realized dynamics."

  source_transition_law:
    ontology_versus_model_status: >-
      Adds one source-only relation or selector over the already declared
      kinematically admissible transitions. It is derivation-critical missing
      source-law data, but remains proposal-only source-extension data rather
      than canonical ontology or physical law.
    new_ontological_commitments:
      - "abstract source-side successor orientation"
      - "relation-valued or selector-valued rule on existing transition records"
      - "source-local dependence and finite-support scope"
      - "presentation-equivariance or explicit symmetry-breaking datum"
      - "composition, null, interacting, and degenerate branch semantics"
    identity_and_modality_of_state_changes: >-
      A relation-valued law distinguishes allowed candidate successors without
      assigning physical actuality, probability, persistent particle identity,
      trajectory, or worldline.
    semantic_risks:
      time: "Only abstract precedence is needed; duration, clock time, and proper time remain absent."
      probability: "Multiplicity of allowed successors is not a distribution, rate, or frequency."
      action: "No functional or stationarity principle is assumed."
      circularity_and_target_import: "A selector can hide desired endpoints, target geometry, detector outputs, process order, or GR behavior; properties copied into its predicate are stipulated."
    minimal_primitive_commitment:
      rating: "lowest_of_the_three"
      basis: "Reuses the fixed configuration and transition domains without first adding histories, scalar weights, continuous state space, physical time, or probability."
    derivation_versus_stipulation_test:
      stipulated: "future relation or selector, step orientation, dependence domain, and any symmetry-breaking data"
      could_count_as_derived: "Closure, composition, constraint propagation, a new invariant, or a scoped obstruction following from a separately specified minimal rule."
      cannot_count_as_derived: "Q and [z] preservation obtained only by restricting the codomain to P7-T01-admissible transitions, or another constraint written into the selector."
    empirical_or_operational_overread_risk:
      level: "medium_and_controllable"
      examples: "successor order as measured time; allowed edge as observed event; edge multiplicity as probability; naturality as physical covariance"
    constructibility:
      rating: "high_relative_to_the_other_branches"
      reason: "The fixed finite candidate already supplies endpoints, admissible edges, relabelings, and positive and failure branches."
    honest_future_claim: "At most one proposal-only transition-law candidate or precise scoped obstruction with candidate-relative closure or constraint results; no physical law, time, probability, action, detector meaning, coupling, or GR recovery."

