fixed_basis:
  status_rule: "Every branch is compared against the same unchanged proposal-only SourceMatterIncidenceCandidate_v1 basis."
  source_incidence_complex:
    object: "finite augmented source incidence complex K_src"
    chain_data:
      - "C_2(K_src; Z)"
      - "C_1(K_src; Z)"
      - "C_0(K_src; Z)"
    fixed_axioms:
      - "partial_1 partial_2 = 0"
      - "epsilon partial_1 = 0"
      - "each declared source-link boundary has one positive and one negative endpoint, with zero-boundary self-loops allowed"
    interpretation_limit: "finite combinatorial source incidence only"
  internal_data:
    - "A_int is a finitely generated abelian source charge-label coefficient group."
    - "B_def is a finitely generated abelian source defect-label coefficient group."
    - "G_int has a finite declared representation set with carriers and homomorphisms."
    - "chi maps declared representation labels to A_int and sends the empty label to zero."
  configuration_data:
    primitive_tuple: "Psi = (m,z)"
    occupation_type: "m is a nonnegative multiplicity function on the finite vertex and declared-representation domain"
    defect_type: "z is a closed B_def-valued source one-chain"
    derived_records:
      - "nu is derived from m."
      - "q is derived from m and chi."
      - "M is the derived representation grade."
      - "Q is the augmentation of q."
      - "D is the homology class of z."
  invariant_sector:
    definition: "Sec_src(Psi) = (Q(Psi),D(Psi))"
    exact_scope: "candidate-relative sector coordinate preserved by the declared P7-T01 transition constraints"
    representation_grade_rule: "M is not transition invariant unless a later packet adds an explicit update constraint."
  kinematic_transition_grammar:
    tuple: "T = (Psi_minus,J,w,Pi,Psi_plus)"
    continuity_constraint: "q_plus minus q_minus is the boundary of J"
    defect_constraint: "z_plus minus z_minus is the boundary of w"
    update_constraint: "Pi uses only declared source data"
    fixed_limit: "The grammar determines kinematic admissibility but selects no occurrence, ordering, rate, probability, action, or evolution."
  source_presentation_naturality:
    transformations: "compatible source-chain, coefficient-group, internal-group, and representation-label isomorphisms"
    exact_result: "admissibility and transition constraints transport equivariantly"
    fixed_limit: "This is not target covariance, diffeomorphism invariance, physical gauge equivalence, or general EqSrc."
  fixed_controls:
    nontrivial: "the two-vertex finite incidence witness with one admissible nonidentity transition"
    null: "Psi_0 with m=0 and z=0"
    nontrivial_neutral: "a nonzero occupation record with total source charge zero"
    malformed: "a transition with a nonzero continuity residual"
    underdetermined: "a typed request for which no candidate rule is supplied"
  fixed_nonconclusions:
    - "The chain-level sector invariant is not an independently derived dynamical, Noether, or physical conservation law."
    - "The null record is not a physical vacuum or ground state."
    - "The current chain is not physical flux, a worldline, or stress energy."
    - "No target atlas, target metric, effective geometry, detector semantics, coupling, or GR result is available as a premise."
    - "The candidate remains proposal-only with blocked_adoption_open_continuation."

comparison_criteria:
  - "minimum exact assumption delta beyond the fixed P7-T01 basis"
  - "ability to yield one reproducible future equation or update law"
  - "ability to derive or expose a basic conserved, normalization, or constraint structure"
  - "finite positive, null, interacting, and degenerate controls"
  - "source-presentation naturality and no-target-import discipline"
  - "bounded one-AgentJob constructibility"
  - "utility for later P7-T04 principal-symbol or propagation work without claiming that work here"

branch_comparison:
  - branch_id: "source_action"
    branch_status: "lawful_future_option_not_selected_here"
    required_primitives:
      - primitive: "source history domain"
        exact_delta: "Add an ordered finite sequence, history complex, or other declared source-only notion of successive configurations."
      - primitive: "action codomain and aggregation"
        exact_delta: "Add a scalar coefficient system and a finite source-only rule for aggregating contributions over a history."
      - primitive: "source pairings or weights"
        exact_delta: "Add pairings or weights for occupation changes, current chains, defect relations, and interaction terms; P7-T01 supplies none."
      - primitive: "admissible variations"
        exact_delta: "Define endpoint conditions and a variation or finite-difference calculus compatible with integer multiplicities and homology-valued defect data."
      - primitive: "constraint implementation"
        exact_delta: "Choose constrained-history restriction, multiplier data, or an equivalent source-only method for enforcing the P7-T01 transition grammar."
      - primitive: "interaction and scale data"
        exact_delta: "Declare all candidate kinetic, interaction, and relative-scale coefficients with no target calibration."
      - primitive: "history symmetry"
        exact_delta: "Extend source-presentation transport to histories and to every action contribution."
    assumption_delta_summary: "largest of the three branches because P7-T01 has neither histories, scalar pairings, differentiable variations, kinetic weights, interaction coefficients, nor a time or ordering semantics."
    can_yield_reproducible_future_equation: true
    future_equation_target: "A later packet could derive a finite discrete stationarity or Euler-Lagrange-type update condition after supplying the missing history and variation structures."
    conserved_or_constraint_target:
      target: "A later packet could derive conditional source-label invariants from a declared variational symmetry and identify primary constraints from its constrained history space."
      caveat: "No Noether, conservation, or constraint result is derived in this selector."
    finite_control_coverage:
      positive: "Feasible after a nonconstant finite history and nonzero action difference are constructed."
      null: "Feasible only after the null-history weight and boundary conditions are declared."
      interacting: "Feasible through an explicitly nonseparable source interaction contribution."
      degenerate: "Feasible through a singular variation, flat action direction, or constraint-only history."
    strengths:
      - "Provides a systematic route from one common object to equations, interactions, and symmetry-based identities."
      - "Aligns structurally with the later matter-action and stress-energy burden, while not satisfying it by itself."
      - "Can compare free and interacting histories in one formalism."
    liabilities:
      - "Ordinary variational derivatives do not apply directly to the integer-valued occupation field without a declared relaxation or discrete variation calculus."
      - "Any kinetic norm, volume weight, temporal interval, or quadratic form would be a new primitive and a major target-import risk."
      - "A conserved quantity could be built into admissible histories rather than independently derived, so the proof burden must separate imposed constraints from variational consequences."
      - "The number of mutually dependent choices makes a complete positive, null, interacting, and degenerate package ambitious for one bounded construction job."
    constructibility:
      rating: "medium_low"
      one_job_constructible: "conditional"
      exact_assessment: "One finite toy action is constructible in one job, but an audit-ready action plus discrete variation, equations, symmetry result, and four controls has high assumption and validation density."
    target_import_risk:
      rating: "high"
      risk_vectors:
        - "using a target metric or effective geometry to define kinetic or norm terms"
        - "using target volume, proper time, causal order, or continuum locality to aggregate the action"
        - "choosing familiar matter-action terms because they reproduce GR or known field theory"
      required_guard: "Every pairing, weight, order, and scale must be declared source-side proposal data and may not be reverse-engineered from target behavior."

  - branch_id: "source_evolution_equation"
    branch_status: "lawful_future_option_not_selected_here"
    required_primitives:
      - primitive: "source evolution parameter"
        exact_delta: "Add a discrete step, semigroup parameter, or other source-only ordering and state explicitly that it is not physical time or proper time."
      - primitive: "evolution domain"
        exact_delta: "Extend or embed the integer and homology-valued configuration set into a space on which an update operator, generator, or difference equation is well typed."
      - primitive: "source evolution operator"
        exact_delta: "Add one deterministic or otherwise exactly specified source-only update operator, including initial and boundary data."
      - primitive: "incidence operator weights"
        exact_delta: "If boundary matrices are used for propagation, add any adjoint, pairing, weighting, or Laplacian data because P7-T01 supplies boundary maps but no canonical adjoints."
      - primitive: "constraint propagation rule"
        exact_delta: "Require the evolution to preserve configuration admissibility and to produce P7-T01 transition witnesses at each step."
      - primitive: "interaction nonlinearity"
        exact_delta: "Add a source-only nonlinear or coupled update term and a precise factorization criterion for the interacting control."
      - primitive: "well-posedness data"
        exact_delta: "Declare the finite domain, initial data, uniqueness convention, and treatment of singular or stalled states."
    assumption_delta_summary: "intermediate; it avoids a full action but still requires an evolution parameter, a well-typed operator domain, source weights or adjoints for propagation, initial data, and a constraint-propagation theorem."
    can_yield_reproducible_future_equation: true
    future_equation_target: "A later packet could construct an explicit finite difference or semigroup update equation on a declared extension of the candidate configuration space."
    conserved_or_constraint_target:
      target: "A later packet could prove that the update preserves admissibility and the candidate sector coordinates, and could characterize fixed points or algebraic constraints."
      caveat: "Preservation of Q and D would remain candidate-relative and may be imposed through operator design rather than derived from an independent physical symmetry."
    finite_control_coverage:
      positive: "Feasible through one nonstationary finite solution."
      null: "Feasible after the evolution of the valid null configuration is declared."
      interacting: "Feasible through one nonfactorizing coupled update."
      degenerate: "Feasible through a singular, nonunique, or stationary branch with exact classification."
    strengths:
      - "Produces the most direct future input for propagation and principal-symbol-style analysis."
      - "Can state initial-value, stability, and constraint-propagation questions explicitly."
      - "Needs fewer history-level choices than a source action."
    liabilities:
      - "The P7-T01 configuration set is discrete and is not already a vector space, differentiable manifold, or generator domain."
      - "A source Laplacian or kinetic operator is not fixed by incidence boundary maps alone; adjoints and weights would be extra assumptions."
      - "Physical time, causal propagation, and metric locality can be imported by familiar equation notation unless the update parameter remains explicitly source-syntactic."
      - "An operator chosen to preserve Q and D can make the conservation result design-level rather than dynamically explanatory."
    constructibility:
      rating: "medium"
      one_job_constructible: "conditional"
      exact_assessment: "A bounded finite update equation and controls are plausible in one job, but the required state-space extension and operator typing add a material preliminary burden."
    target_import_risk:
      rating: "medium_high"
      risk_vectors:
        - "identifying the update parameter with physical time"
        - "using a target metric, target cone, or continuum coordinate derivative to define propagation"
        - "using an unearned inner product to define an adjoint or norm"
        - "selecting coefficients by desired GR, relativistic, or detector behavior"
      required_guard: "All ordering, operator, pairing, and coefficient data must be source-declared and target-atlas-free."

  - branch_id: "source_transition_law"
    branch_status: "selected_for_one_future_constructive_packet"
    required_primitives:
      - primitive: "bounded finite control domain"
        exact_delta: "Declare a finite source-only subset of admissible P7-T01 configurations and transition records, with explicit occupation and defect bounds used only as a mathematical control regulator."
      - primitive: "source update index"
        exact_delta: "Add a discrete bookkeeping step for composing transition-law applications, without physical time, duration, or causal meaning."
      - primitive: "transition-kernel coefficient system"
        exact_delta: "Add nonnegative scalar transition weights and a normalization rule; no weights or probabilities are chosen in this selector."
      - primitive: "support rule"
        exact_delta: "Require kernel support only on P7-T01 kinematically admissible tuples and require every selected endpoint to remain a valid configuration."
      - primitive: "presentation-equivariance rule"
        exact_delta: "Require transition assignments to transport on source-presentation isomorphism orbits rather than depend on arbitrary vertex or representation-label names."
      - primitive: "interaction criterion"
        exact_delta: "Declare an interacting update as one whose occupation update cannot be factored into independent disjoint-support moves in the declared source composition structure."
      - primitive: "degenerate-state convention"
        exact_delta: "Declare how a valid state with no nonidentity enabled move is represented while keeping it distinct from malformed and underdetermined records."
    assumption_delta_summary: "smallest usable delta because the branch operates directly on the already typed P7-T01 transition tuples; its new content is selection weight, normalization, finite control scope, composition index, and equivariance rather than a new geometry, pairing, or differentiable state space."
    can_yield_reproducible_future_equation: true
    future_equation_target: "A later packet can derive one finite normalized transition-update equation from the constructed kernel and declared initial control data."
    conserved_or_constraint_target:
      target: "A later packet can prove normalization, support closure, pathwise preservation of the P7-T01 sector coordinates, and the corresponding distribution-level invariant statement on the finite control domain."
      caveat: "Sector preservation follows from support on the fixed kinematic constraints; it is not yet a physical conservation law or a Noether result."
    finite_control_coverage:
      positive: "Directly testable with at least one enabled nonidentity transition based on the P7-T01 nontrivial witness."
      null: "Directly testable by declaring and evaluating the transition-law behavior of the valid null configuration."
      interacting: "Directly testable with one finite nonfactorizing multi-occupation update satisfying the fixed current and defect constraints."
      degenerate: "Directly testable with a valid state having no enabled nonidentity move or an orbit-degenerate transition assignment, with exact halt or self-transition handling declared later."
    strengths:
      - "Reuses the exact P7-T01 transition tuple and chain constraints instead of inventing a continuous configuration geometry."
      - "Can provide a reproducible finite update equation and a normalization constraint in the same bounded construction."
      - "Makes positive, null, interacting, and degenerate cases finite and auditable."
      - "Can enforce source-presentation equivariance at the transition-assignment level."
      - "Avoids target metric, target atlas, physical clock, inner product, action, and stress-energy prerequisites."
      - "A successful finite packet can later inform, but does not itself perform, evolution-equation or principal-symbol analysis."
    liabilities:
      - "Probability and normalization are new proposal-only source primitives; P7-T01 does not derive them."
      - "A finite control bound is a regulator for the construction and is not yet a canonical cutoff or physical finiteness claim."
      - "Presentation equivariance may force equal orbit weights, degeneracy, or a set-valued outcome where a unique deterministic selector is unavailable."
      - "A transition kernel does not by itself supply an action, energy, physical time, stability theorem, or continuum principal symbol."
      - "If support is restricted to sector-preserving transitions by definition, the sector invariant remains a conditional design consequence."
    constructibility:
      rating: "high"
      one_job_constructible: true
      exact_assessment: "A Candidate Constructor can define one bounded finite source-only kernel, derive its update and normalization structure, prove support and equivariance properties, and evaluate four finite controls within one outer AgentJob."
    target_import_risk:
      rating: "low_medium"
      risk_vectors:
        - "interpreting the source update index as physical time"
        - "choosing weights from target metric distance, target causal separation, detector response, or known particle behavior"
        - "using desired GR or benchmark recovery to tune transition support"
        - "calling normalized source weights empirically established probabilities"
      required_guard: "Weights, support, control bounds, and equivariance must be source-only proposal data, with target-atlas, metric, detector, coupling, GR, and benchmark inputs prohibited."

