formal_objects:
  groupoid: "A small groupoid G."
  eligible_choice_functor: "A functor S:G->Set."
  connected_components: "A set I=pi_0(G) with supplied representative r_i and transport tau_X:r_i->X in each component."
  automorphism_fixed_locus: "F_i=S(r_i)^{Aut_G(r_i)}."
  selector_space: "Nat(1_G,S)."
  relation_interface: "An optional natural transformation K:S=>E into another Set-valued functor."
  extension_universe: "A finite declared capability set U with nonempty obstruction clauses C_j."
  quotient_candidate: "A prospectively fixed functor I:C->D and the object relation A~_I B iff I(A) is isomorphic to I(B)."

proof_obligations:
  - theorem_id: "SEL-CORE-CLASSIFICATION-V1"
    statement: "Evaluation at component representatives is a bijection Nat(1_G,S) congruent to the product of fixed loci F_i."
    proof_method: "Naturality forces representative values to be automorphism-fixed. Supplied transports reconstruct a natural selector and automorphism invariance makes the reconstruction transport-independent."
    status: "reproduced_with_full_proof"
    scope_guard: "Arbitrary factorwise nonemptiness does not imply a product element in ZF without a supplied tuple finite component set or suitable choice principle."
  - theorem_id: "SEL-EXISTENCE-UNIQUENESS-COROLLARIES-V1"
    statement: "An empty factor obstructs selectors. A selector is unique exactly when every fixed locus is a singleton. Multiple selectors require one multiple fixed locus plus a nonempty complementary product."
    proof_method: "Apply elementary product-set facts to the classification bijection."
    status: "reproduced_with_full_proof"
    scope_guard: "Objectwise fixed points do not automatically solve additional equalizer equations from noninvertible arrows."
  - theorem_id: "SEL-RELATION-IMAGE-UNIQUENESS-V1"
    statement: "When selectors exist the image of K_* has one element exactly when every K(F_i) is a singleton."
    proof_method: "Naturality makes K compose with selectors. Representative evaluation identifies relation-section variability componentwise."
    status: "reproduced_with_full_proof"
    scope_guard: "Selector multiplicity and relation-image multiplicity are distinct."
  - theorem_id: "SEL-FULL-CATEGORY-EQUALIZER-GUARD-V1"
    statement: "Selectors on a category C inject into selectors on its wide core G and are exactly the core selectors satisfying the remaining naturality equalizers."
    proof_method: "Restriction to the wide core is injective because it retains all objects. Naturality along every noninvertible arrow supplies the additional equations."
    status: "reproduced_with_proof_sketch"
    scope_guard: "The fixed-locus product classifies the groupoid core only unless the equalizer obligations are checked."
  - theorem_id: "SEL-B8-DECLARATION-ENVELOPE-V1"
    statement: "The powerset of eight declaration atoms is B8 with 256 nodes 1024 directed cover edges and rank sizes 1 8 28 56 70 56 28 8 1."
    proof_method: "Count subsets cover pairs and binomial coefficients."
    status: "reproduced_with_finite_calculation"
    scope_guard: "Boolean inclusion is syntactic declaration order and not by itself scientific assumption strength."
  - theorem_id: "SEL-COMPATIBLE-FIXED-LOCUS-TRICHOTOMY-V1"
    statement: "For a realized finite extension the compatible selector set is the intersection of its compatibility set with the stabilizer fixed locus and cardinalities zero one and greater than one give obstruction uniqueness and residual underdetermination."
    proof_method: "A compatible natural choice is exactly an element satisfying both predicates."
    status: "reproduced_with_proof"
    scope_guard: "Uniqueness is not monotone under declaration inclusion because reducing the stabilizer may enlarge the raw fixed locus."
  - theorem_id: "SEL-MINIMUM-EXTENSION-HITTING-SET-V1"
    statement: "Every escaping signature in a finite sound clause model contains an inclusion-minimal escaping signature and the family of minima is finite and nonempty."
    proof_method: "Delete dispensable elements until finite descent terminates. The full finite universe hits every nonempty clause."
    status: "reproduced_with_full_proof"
    scope_guard: "The result is necessary routing structure only. Omitted capabilities and unsound clauses are outside its quantifiers."
  - theorem_id: "SEL-INVARIANT-FUNCTOR-QUOTIENT-CONDITIONALS-V1"
    statement: "A prospectively fixed invariant functor defines an equivalence relation and declared monoidal localization coarse-graining and variation structures preserve it under the stated comparison hypotheses."
    proof_method: "Use identity inverse and composition of isomorphisms and conjugation by the declared natural comparison isomorphisms."
    status: "reproduced_with_conditional_proof_summary"
    scope_guard: "Reflection interface descent source derivation operational meaning and physical gauge require separate premises."

