typed_extension_lattice:
  atoms:
    R: "root or partition provenance"
    O: "orientation or line datum"
    Q: "quotient discriminator or readout law"
    G: "grade rank order or minimum"
    M: "measure stochastic kernel or readout"
    I: "initial state preparation or history"
    B: "boundary or terminal condition"
    D: "transition evolution order or flow"
  declaration_envelope:
    lattice: "B8"
    node_count: 256
    directed_cover_edge_count: 1024
    rank_sizes: [1, 8, 28, 56, 70, 56, 28, 8, 1]
  admissible_reduct_guard: >-
    Boolean inclusion is syntactic bookkeeping. Scientific assumption order
    requires a well-typed target-neutral reduct between realized extensions.
  compatible_fixed_locus: >-
    Compatible selectors are C_E(e_E) intersect Fix(H_E). Cardinalities zero,
    one, and greater than one give obstruction, uniqueness, and residual
    underdetermination.
  nonmonotonicity_guard: >-
    Adding declarations can reduce the stabilizer and enlarge the raw fixed
    locus, so selector uniqueness is not monotone in declaration inclusion.

minimum_extension_theorem:
  statement: >-
    For a finite capability universe U and nonempty sound obstruction clauses
    C_j, every escaping capability set contains an inclusion-minimal hitting
    signature and the family of such minima is finite and nonempty.
  proof: >-
    Repeatedly delete dispensable elements from a finite escaping set until
    finite descent terminates. U itself hits all nonempty clauses and P(U) is
    finite.
  finite_control:
    universe: ["d", "n", "q"]
    clauses:
      - ["d", "q"]
      - ["n", "q"]
    minimal_signatures:
      - ["q"]
      - ["d", "n"]
    failing_signatures:
      - []
      - ["d"]
      - ["n"]
  incomplete_universe_guard: >-
    Omitted capabilities lie outside the theorem quantifiers. A separate
    completeness theorem would be needed for future-extension impossibility.
  forbidden_interpretation: "Inclusion-minimal does not mean physically sufficient preferred selected or adopted."

conditional_quotient_implications:
  base: "For a prospectively fixed I:C->D, A~_I B iff I(A) is isomorphic to I(B) is an equivalence relation."
  composition: "Congruence requires declared bifunctors and an invertible natural comparison."
  localization: "Preservation follows from factorization through localization; the converse requires isomorphism reflection."
  coarse_graining: "Exact preservation requires I to factor through Q; recovering equality before information loss requires reflection."
  variations: "Variation preservation requires the declared natural comparison I composed with V isomorphic to I."
  arbitrary_partition_obstruction: "Prospectivity alone permits every finite partition including identity and universal extremes."
  marked_interface_countermodel: >-
    Marked K2 and marked P3 both have homology (1,0), but adding an absent edge
    between marked endpoints leaves K2 at (1,0) and sends P3 to (1,1). The
    object quotient forgets interface data needed by that operation.
  exact_limit: >-
    This refutes a missing descent premise rather than the conditional
    congruence theorem. Source derivation, reflection, interface completeness,
    operational meaning, and physical gauge remain separate.

