purpose: >-
  Supply a source-grounded mathematical architecture integrating the natural-
  selector classification, exact existence and uniqueness qualifications,
  finite countermodels, the typed B8 extension lattice, the finite minimum-
  extension theorem, and conditional quotient alternatives without enlarging
  any theorem domain or scientific authority.

generic_selector_theorem:
  independent_statement: >-
    Let G be a small groupoid, let S:G->Set be a covariant functor, and let
    I=pi_0(G). Choose one representative r_i for every connected component and
    isomorphisms tau_X:r_[X]->X. Put H_i=Aut_G(r_i) and let F_i be the points
    of S(r_i) fixed by every H_i action. Evaluation at representatives is a
    bijection Nat(1_G,S)->product_i F_i, with inverse
    sigma_X=S(tau_X)(x_[X]).
  proof_steps:
    - "Naturality at each automorphism forces the representative value into F_i."
    - "For f:X->Y, the conjugate tau_Y^{-1} f tau_X lies in H_[X], so fixedness proves naturality of the reconstructed family."
    - "Identity transports and naturality at tau_X prove the two constructions are inverse."
  existence_qualifications:
    empty_factor_implies_no_selector: true
    arbitrary_factorwise_nonempty_implies_product_nonempty: false
    sufficient_product_conditions:
      - "finite component set"
      - "supplied product tuple"
      - "declared suitable choice principle"
  uniqueness_qualifications:
    unique_selector: "Every F_i is a singleton."
    multiple_selectors: "Some F_i has at least two points and the complementary product is nonempty."
    multiple_fixed_factor_alone_sufficient: false
  full_category_guard: >-
    If S extends to a category C with wide core G, full selectors are exactly
    the core selector tuples satisfying the additional naturality equalizers
    for every noninvertible arrow of C.

relation_image_theorem:
  data: "A functor E:G->Set and a natural transformation K:S=>E."
  statement: >-
    If at least one selector exists, the image of K_* is a singleton exactly
    when every component image K_r_i(F_i) is a singleton.
  guards:
    - "Multiple selectors do not necessarily induce multiple relations."
    - "A unique selector-induced relation does not imply a unique selector."
    - "If no selector exists, the K_* image is empty."
    - "Available relation values on eligible choices must not be conflated with selector-induced natural relation sections."
    - "K_* is not asserted to be surjective onto all natural E-sections."

