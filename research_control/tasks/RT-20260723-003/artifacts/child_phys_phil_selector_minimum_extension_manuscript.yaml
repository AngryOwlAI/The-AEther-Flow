ontology_model_empirical_distinctions:
  ontology: >-
    The canonical ontology proposes an underlying substrate and interpretive
    flow picture, but P15-T03 derives or adopts no selector, discriminator,
    quotient, probability, dynamics, morphism, variation, or source-
    equivalence law.
  mathematical_model: >-
    The category, groupoid, Set-valued choice functor, structural actions,
    natural map K, extension atoms, and invariant functor are supplied
    proposal inputs. Classification does not prove that ontology generates
    them or that their morphisms are physically admissible.
  empirical_layer: >-
    The active exact-closure theory agrees with GR at current downstream
    scope. This manuscript supplies no detector semantics, complete observable
    algebra, empirical tolerance, matter response, independent low-energy
    signature, or bridge from structural isomorphism to observation.
  exact_closure: "Exact downstream GR agreement is not a first-principles source derivation."
  congruence_choice: "The selector theorem does not derive a preferred observer congruence or frame."

structural_naturality_and_fixed_points:
  positive_meaning:
    - "Naturality is coherence relative to every morphism in one declared category."
    - "A deterministic natural selector must lie in the fixed locus of the supplied structural automorphism action."
    - "Empty singleton and multiple fixed loci give obstruction conditional uniqueness and residual multiplicity on that domain."
  blocked_meaning:
    - "Naturality is not by itself physical preference covariance ontology derivation or empirical adequacy."
    - "A structural automorphism is not thereby physical gauge."
    - "A fixed point is not thereby a physical state preferred frame adopted source law or realized branch."
    - "A singleton selector-induced K-image is not uniqueness of every target section or complete physical relation semantics."
    - "Marked probability-valued partial or dynamics-mediated variants change the problem rather than refute the fixed-domain theorem."
  physical_bridge_requirements:
    - "a physically justified state space and redundancy action"
    - "a prospectively declared observable or readout family"
    - "preservation and any claimed reflection of operational content"
    - "interface completeness for relevant operations"
    - "matter response detector semantics empirical tolerance and exact-GR recovery"
    - "separate protected authority for physical or ontology interpretation"

finite_and_extension_interpretation:
  finite_controls: >-
    Response line root grading and partition examples are scoped structural
    calculations. Their positive cases depend on supplied marks roots or
    grades. Guarded noninstances fail admission before the selector domain is
    formed.
  family_freeze: >-
    Five historical families and exact quotient candidates retain local
    dispositions. Local freeze preserves negative evidence and same-milestone
    continuation; it is not a programme-wide rejection.
  declaration_lattice: >-
    B8 counts declared atom combinations. Scientific extension order requires
    typing and target-neutral reducts and is not Boolean rank.
  minimum_extensions: >-
    Inclusion-minimal hitting signatures are necessary only in the declared
    finite sound clause model. They are not physically sufficient preferred
    uniquely selected or adopted.
  incomplete_universe: >-
    An omitted capability lies outside the quantifiers, so future-extension
    impossibility requires a separate completeness theorem.

quotient_and_irrelevance_alternatives:
  representative_irrelevance: >-
    A supplied readout may factor through structural orbits, but orbit
    constancy does not establish a complete physical observable family,
    physical gauge, or empirical indistinguishability.
  probability_and_dynamics: >-
    An invariant probability or supplied state-plus-dynamics is a distinct
    target with separate provenance and does not freely produce a canonical
    deterministic point.
  quotient: >-
    Image isomorphism under a prospectively fixed functor defines an object
    equivalence. Preservation, reflection, localization, coarse-graining,
    variation, source derivation, interface descent, and physical meaning
    remain separate obligations.
  adequacy_obstructions:
    - "Every finite partition can be represented as such a kernel."
    - "Prospective fixation alone does not provide nontriviality or source derivation."
    - "An interface-sensitive operation may fail to descend."
  current_disposition: "The exact generic quotient route remains locally frozen pending new source and interface evidence."

