review_questions:
  - question_id: "RQ-01"
    question: "Are the selector theorem hypotheses stated independently of project vocabulary?"
    acceptance: "The manuscript starts from a small groupoid a Set-valued functor component representatives transports and automorphism fixed loci."
  - question_id: "RQ-02"
    question: "Are existence uniqueness and relation-image uniqueness kept distinct?"
    acceptance: "The product classification relation-image theorem and two-choice constant-map control are all present."
  - question_id: "RQ-03"
    question: "Does the manuscript disclose its axiom-of-choice qualification?"
    acceptance: "Factorwise nonemptiness is not converted to arbitrary-product nonemptiness without a supplied tuple finite component set or suitable choice principle."
  - question_id: "RQ-04"
    question: "Are noninvertible arrows handled?"
    acceptance: "A separate full-category equalizer guard states the remaining naturality equations."
  - question_id: "RQ-05"
    question: "Are finite examples reproducible and status-preserving?"
    acceptance: "The JSON data reproduces the sign line root graded and relation-image controls without rewriting historical artifacts."
  - question_id: "RQ-06"
    question: "Is minimum defined as inclusion-minimal rather than physically preferred?"
    acceptance: "The hitting-set theorem is bounded to a finite declared universe with explicit soundness and incomplete-universe guards."
  - question_id: "RQ-07"
    question: "Are quotient implications conditional?"
    acceptance: "Preservation and reflection are separated and the arbitrary-partition and marked-interface controls remain visible."
  - question_id: "RQ-08"
    question: "Are mathematical symmetry and physical gauge kept distinct?"
    acceptance: "The foundations section says no physical gauge observational equivalence or operational bridge follows from the structural hypotheses."
  - question_id: "RQ-09"
    question: "Is novelty calibrated against primary literature?"
    acceptance: "The manuscript claims only a project-specific integrated synthesis and attributes naturality model-specific election local/global slice and quotient-first precedents."
  - question_id: "RQ-10"
    question: "Are review and publication authority accurately represented?"
    acceptance: "The packet is same-context internal review only and explicitly records no peer review submission eligibility or publication authority."

