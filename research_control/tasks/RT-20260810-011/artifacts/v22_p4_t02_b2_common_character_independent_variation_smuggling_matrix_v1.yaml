audit_dimensions:
  - dimension_id: "source_groupoid_orientation_and_basepoint"
    local_result: "PASS_EXPLICIT_PROPOSAL_DATA"
    evidence: "Gamma_desc, orientation, ell, and base object 0 are declared before any response evaluation and carry no target-manifold meaning."
    limitation: "The current ontology does not derive this pointed source graph, and the basepoint is preparation structure rather than a physical origin."
  - dimension_id: "positive_sector_frames"
    local_result: "PASS_ONLY_IN_FRAMED_STRUCTURED_CATEGORY"
    evidence: "Every common and sector line has an explicit positive source frame; positivity supplies algebraic orientation and invertibility without metric, unit, time, or causal semantics."
    limitation: "Forgetting the frames removes the selected coordinates and restores representation automorphisms."
  - dimension_id: "anchor_normalization"
    local_result: "PASS_AS_EXPLICIT_REPRESENTATIVE_SELECTOR"
    evidence: "The law fixes a_s(0)=1, so independent sector constants change the framed anchored object rather than act as gauge inside that fixed object."
    limitation: "The anchor does not alter cycle holonomy and does not derive a physical or source-canonical normalization; after forgetting anchors the relative torsor is (R_{>0})^2."
  - dimension_id: "universal_character_relation"
    local_result: "PASS_AS_TRANSPARENT_HIGH_COST_NEW_PRIMITIVE"
    evidence: "rho_s=a_s(source)^{-1} chi a_s(target) is stated directly from source data and contains no target-selected coefficient."
    limitation: "For three independently presented positive line representations, common descent requires equality of three log holonomies, the codimension-two diagonal in R^3. RT010 posits this goal property; it does not derive it."
  - dimension_id: "cochain_and_intertwiner_arrays"
    local_result: "PASS_CONDITIONAL_MATHEMATICS"
    evidence: "The integer arrays are fixed before evaluation; positivity, composition, inverse, and intertwining identities follow exactly. Constant shifts alter anchored intertwiner coordinates but not sector holonomy."
    limitation: "The chosen arrays have no current-ontology or empirical selector and earn no uniqueness or physical calibration credit."
  - dimension_id: "shared_source_state_and_covector"
    local_result: "PASS_TRANSPARENT_SHARED_ROOT"
    evidence: "The state x and covector m=(1,-1,0,0) are visible typed source roots; m(d)=0 and rank([B;m])=3."
    limitation: "Sharing x is not opacity, but the particular m is proposal data and its epistemic selection is unestablished."
  - dimension_id: "independent_balance_gauge_and_variation_roots"
    local_result: "PASS_DEFINITIONAL_INDEPENDENCE_AND_NONVACUITY"
    evidence: "B and d determine A_src=ker(B)/span(d) before descent evaluation; rank(B)=2, B d=B v=0, and m(v)=2."
    limitation: "The independence is structural, not statistical or historical. The exact coefficients remain newly chosen law data."
  - dimension_id: "logical_versus_epistemic_independence"
    local_result: "PASS_LOGICAL_ONLY_EPISTEMICALLY_UNESTABLISHED"
    evidence: "The dependency graph is acyclic and neither A_src nor its representative is defined as a response-success stabilizer."
    limitation: "A DAG cannot show that B, d, m, Gamma_desc, and the sector law were motivated independently of the desired common-descent goal. The allowed claim is noncircular construction, not independent explanation."
  - dimension_id: "source_presentation_and_naturality"
    local_result: "PASS_NARROW_TYPED_TRANSPORT"
    evidence: "Transporting the complete typed tuple, including basepoint, frames, anchors, B, d, m, and k_s, commutes with every displayed formula."
    limitation: "The pointed oriented three-cycle has only the identity presentation automorphism. This covariance is coherent but supplies no broad invariant selector for the structured tuple."
  - dimension_id: "sector_scope"
    local_result: "PASS_FINITE_FAIL_CLOSED"
    evidence: "Only the declared labels R, S, and D are equipped; all other P7 sectors fail closed."
    limitation: "No sector semantics or full-P7 universality follows from the labels."
  - dimension_id: "target_empirical_and_physical_overread"
    local_result: "PASS_NO_IMPORT_DETECTED"
    evidence: "No target atlas, topology, metric, tetrad, coframe, proper time, desired cone, calibration, empirical response, detector answer, benchmark result, or physical causal rule occurs among the roots."
    limitation: "The line, orientation, positivity, character, holonomy, and flow remain formal source syntax only."
  - dimension_id: "workflow_and_adoption_authority_smuggling"
    local_result: "PASS_NO_IMPORT_DETECTED"
    evidence: "No registry row, generated derivative, role identity, validator result, checkpoint, Gate status, or benchmark label is used as a mathematical premise."
    limitation: "Validation can establish file and calculation consistency only; adoption and protected claims remain unauthorized."

new_mathematical_audit_payload:
  - payload_id: "NMP-RT011-PARENT-001"
    payload_type: "classification_theorem"
    name: "Common-holonomy codimension theorem"
    hypotheses:
      - "G_src is the fundamental groupoid of a connected graph with one cycle."
      - "Each of three declared sectors carries a positive one-dimensional representation."
    statement: "Modulo positive object cochains, each sector representation is classified by one positive cycle holonomy. Descent to some common character requires the three sector log holonomies to lie on the diagonal Delta={(h,h,h)}, codimension two in R^3. If the RT010 chi class is held fixed as a fourth coordinate, the three equalities [rho_s]=[chi] have codimension three in the four-dimensional class space."
    proof_summary: "Positive object cochains cancel around a closed cycle, so holonomy is invariant. Equality with one common character is necessary. If the holonomies agree, choose objectwise transports from a base object to construct positive cochain intertwiners, proving sufficiency."
    audit_use: "The RT010 universal-character relation is an explicit source-law preload, not a consequence of anchors or current ontology."
  - payload_id: "NMP-RT011-PARENT-002"
    payload_type: "forgetful_obstruction_theorem"
    name: "Anchors select representatives but cannot repair holonomy"
    statement: "When common holonomy holds, unanchored sector intertwiners form one positive-constant torsor per sector and retain two relative moduli after common diagonal gauge. Pointed anchors select one representative. If sector holonomies differ, no anchor choice supplies a common descent."
    audit_use: "The anchors are lawful structured preparation data but neither a common-character derivation nor physical normalization."
  - payload_id: "NMP-RT011-PARENT-003"
    payload_type: "open_family_lemma"
    name: "Source-typed nonvacuity is not an isolated coefficient accident"
    statement: "In the relative parameter space Bd=0 and m(d)=0, the conditions rank(B)=2 and rank([B;m])=3 are open. They imply dim(ker(B)/span(d))=1 and a nonzero induced m on that quotient. The RT010 witness satisfies both and exact rational perturbation samples at epsilon=-1/10,0,1/10 preserve them."
    audit_use: "The balance-law nonvacuity persists in a source-typed neighborhood even though the law remains proposal-only."
  - payload_id: "NMP-RT011-PARENT-004"
    payload_type: "finite_automorphism_count"
    name: "Pointed-presentation naturality scope"
    statement: "The oriented three-cycle has three orientation-preserving rotations, but after fixing base object 0 only the identity remains."
    audit_use: "Typed transport is valid covariance, not independent selection evidence for the pointed structured candidate."
  - payload_id: "NMP-RT011-MATH-002"
    payload_type: "arbitrarily_small_source_local_countermodel"
    name: "Single-edge holonomy perturbation"
    statement: "Multiplying only rho_R on e_01 by exp(epsilon), extended as an additive positive representation, changes its cycle-holonomy ratio to exp(epsilon). For every nonzero epsilon no positive object cochain intertwines it with the fixed chi, and the generator-log change can be arbitrarily small."
    audit_use: "Common descent is nongeneric in the larger target-free sector-law space; this is a Refuter robustness burden rather than a hidden-import defect in the fixed law."
  - payload_id: "NMP-RT011-MATH-003"
    payload_type: "symmetry_nonselection_lemma"
    name: "Bare-cycle point and oriented-line frame nonselection"
    statement: "The C3 rotations of the undecorated oriented cycle select no vertex, and positive scalar automorphisms of an oriented real line select no positive frame."
    audit_use: "Point 0 and the frames are genuine added source structure; transporting them is structure-relative naturality rather than derivation from the bare source."
  - payload_id: "NMP-RT011-MATH-004"
    payload_type: "logical_epistemic_independence_countermodel"
    name: "Alternative covector with identical DAG shape"
    statement: "Replacing m by m_0=(1,-1,1,-1), the first row of B, preserves m_0 d=0 and the typed acyclic graph but gives m_0 v=m_0 x_*=0."
    audit_use: "Dependency order cannot select the RT010 covector or establish epistemic independence."
  - payload_id: "NMP-RT011-PHIL-001"
    payload_type: "exact_collapse_countercontrol"
    name: "Admissible-flow trivialization point"
    statement: "At t=-1/2 the admitted positive flow reaches x=(3/2,3/2,3/2,3/2), so mu=0 and chi=a_s=rho_s=1 while the formal descent identities remain true."
    audit_use: "Formal common descent does not guarantee nontrivial transition content throughout the admitted source flow."

