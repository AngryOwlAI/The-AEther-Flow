new_mathematical_payload:
  - payload_id: "NMP-RT011-PHIL-001"
    payload_type: "conceptual_formal_separation_theorem"
    name: "Four-layer source-legitimacy non-entailment theorem"
    definitions:
      source_syntactic_purity: "Every ancestor of the candidate maps lies in declared source vocabulary, with no target or workflow-authority root."
      logical_acyclicity: "No path runs from the evaluated success predicate back to a primitive root."
      epistemic_independence: "A source-grounded selector motivates the primitive roots without conditioning on the desired success property."
      ontology_derivation: "The current ontology entails the roots and law rather than merely allowing them to be postulated."
    statement: "Source-syntactic purity together with logical acyclicity does not entail epistemic independence or ontology derivation."
    witness: "The fixed candidate has a target-free acyclic DAG, while rho_s=a_s^{-1}chi a_s and a_s(0)=1 are selected precisely to realize common descent, and the current ontology derives none of their roots."
    proof:
      - "The source and logical predicates constrain vocabulary and dependency direction only."
      - "Choose source-typed roots and define every sector representation as a twist of one chosen character with anchored cochains. The graph is acyclic and target-free."
      - "Nevertheless the commonity predicate holds by definition, so it supplies no selector for the roots, and an ontology lacking those roots does not derive them."
      - "Therefore neither epistemic independence nor ontology derivation follows from the first two predicates."
    burden_effect: "separates_existence_credit_from_derivation_credit"
  - payload_id: "NMP-RT011-PHIL-002"
    payload_type: "non_discrimination_lemma"
    name: "Constructive-preload non-discrimination lemma"
    statement: "Within the model family defined by rho_s=a_s(source)^{-1}chi a_s(target), the common-character intertwining predicate is identically true for every admitted choice of chi and positive a_s. Observing that predicate therefore cannot discriminate among characters, cochains, frames, anchors, or their source legitimacy."
    proof: "Substitution cancels a_s(source) and gives a_s(source)rho_s=chi a_s(target) for every admitted root tuple; no evaluated outcome can prefer one tuple when the predicate is constant on the family."
    consequence: "The identity is valid construction evidence but zero independent evidence for current-ontology universality or physical common propagation."
    burden_effect: "narrows_claim_without_invalidating_existence_witness"
  - payload_id: "NMP-RT011-PHIL-003"
    payload_type: "exact_admissible_collapse_witness"
    name: "Positive admissible flow reaches trivial-character collapse"
    construction: "At t=-1/2, the admitted flow from x_* gives x(t)=(3/2,3/2,3/2,3/2), which remains in the positive control domain and satisfies E_src=0."
    calculation:
      - "mu(x(t))=mu(x_*)+t Dmu(v)=1+2(-1/2)=0."
      - "chi_x(gamma)=exp(0*ell(gamma))=1 for every arrow."
      - "a_s(i;x)=exp(k_s,i*0)=1 and rho_s,x(gamma)=1 for every declared sector and arrow."
    exact_result: "The anchored common descent remains algebraically valid, but its nontrivial holonomy and all sector-transition distinctions collapse at an interior point of the admitted positive finite flow."
    audit_relevance: "Collapse is not source smuggling and does not change this verdict; it is a sharp falsifier for the separately admitted Refuter robustness packet."
    burden_effect: "selects_next_stress"
  - payload_id: "NMP-RT011-PHIL-004"
    payload_type: "presentation_dependence_proposition"
    name: "Pointed-anchor covariance versus unpointed naturality"
