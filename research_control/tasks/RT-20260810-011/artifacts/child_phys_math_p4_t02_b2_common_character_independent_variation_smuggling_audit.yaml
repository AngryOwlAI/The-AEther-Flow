audit_standard:
  local_source_purity: "A local pass requires definitions entirely in declared source-side types, absence of target, empirical, physical, benchmark, and workflow-authority inputs, explicit proposal-only labeling of goal-aligned new primitives, accurate naturality scope, and complete downstream claim quarantine."
  logical_non_circularity: "A directed acyclic construction proves that no defined node is computed from a later success predicate."
  epistemic_independence: "A separately motivated selector or source derivation would show why these roots, rather than other source-typed roots, are chosen. RT010 does not provide such a selector."
  decisive_distinction: "Failure to derive or independently motivate an openly declared new primitive is source-extension debt, not hidden-import evidence by itself. Concealing target data, empirical calibration, evaluated response success, or process authority would fail the local audit."
  adoption_threshold: "Ontology or source-law adoption requires authority and evidence beyond local source purity; it is not reached here."

decisive_reasoning:
  - "Every defining object is built from the explicitly declared finite source cycle, source state, integer path record, source covectors and matrices, positive line frames, and finite sector labels. No target atlas, metric, cone, GR coefficient, empirical calibration, benchmark answer, registry result, role status, or validator outcome enters a definition."
  - "The universal-character equation is exactly the desired common-descent law, but RT010 states it as the proposal law itself before evaluation and repeatedly denies derivation, adoption, physical meaning, and all-sector scope. It is high-cost transparent preload, not a hidden imported theorem premise."
  - "The pointed object, frames, anchors, and cochain arrays narrow the presentation category and eliminate the internal intertwiner torsor. They are not natural outputs of the undecorated cycle or oriented lines, but the candidate treats them as additional structured source data and makes that limitation explicit."
  - "The B,d branch is logically independent of descent success, while m and the sector law are chosen so the non-gauge flow changes the character. No independent epistemic selector for those choices is established; the audit grants no derivation, robustness, or adoption credit for that tuning."
  - "Exact source-local countermodels below show that common-character descent is nongeneric under the larger space of positive sector representations. That is a robustness and Refuter burden, not evidence that the fixed, fully disclosed candidate imports forbidden target or workflow data."

new_mathematical_payload:
  - payload_id: "NMP-RT011-MATH-001"
    payload_type: "theorem_with_proof"
    name: "Positive-representation cohomology and common-character locus theorem"
    hypotheses:
      - "G_src is the fundamental groupoid of the connected oriented three-cycle."
      - "Positive one-dimensional representations are compared by positive object-cochain intertwiners."
    statement: "Taking logarithms identifies representation isomorphism classes with H^1(Gamma_desc;R), which is one-dimensional. For fixed chi, a sector representation rho_s admits a positive cochain intertwiner to chi exactly when [log rho_s]=[log chi]. For three sectors, simultaneous common descent is the codimension-three diagonal condition [log rho_R]=[log rho_S]=[log rho_D]=[log chi] in the four-dimensional holonomy-class space."
    proof: "The logarithm of a positive multiplicative representation is an additive one-cocycle. Multiplication by a positive object cochain adds its logarithmic coboundary, so isomorphism classes are H^1. The three-cycle has first Betti number one. A cochain intertwiner exists exactly when the difference cocycle is exact. The three independent equality equations against fixed [log chi] have rank three."
    candidate_application: "RT010 defines log rho_s=log chi+delta(log a_s), so the equality is exact by construction. The anchor fixes constants in a_s but does not select the H^1 class."
    burden_effect: "clarifies_without_distance_delta"
  - payload_id: "NMP-RT011-MATH-002"
    payload_type: "arbitrarily_small_source_local_countermodel"
    name: "Single-edge holonomy perturbation"
    construction: "Let omega be the additive edge cochain with omega(e_01)=1, omega(e_12)=omega(e_20)=0, inverse-odd and extended by concatenation. For nonzero real epsilon define rho_R^epsilon(gamma)=rho_R(gamma)exp(epsilon*omega(gamma)); leave rho_S, rho_D, chi, G_src, B, d, m, x, and every source frame fixed."
    exact_checks:
      positivity: "Every factor is positive."
      composition_and_inverse: "Additivity and inverse-oddness of omega preserve representation composition and inverse."
      cycle_holonomy_ratio: "Hol(rho_R^epsilon)/Hol(chi)=exp(epsilon), because omega has cycle integral one."
      common_intertwiner: "No positive object cochain can remove nonunit loop holonomy, so the R-sector common intertwiner fails for every epsilon not equal to zero."
      arbitrarily_small: "The maximum change of generator log-values is |epsilon| and can be made smaller than any prescribed positive tolerance."
    interpretation: "The perturbation is an alternative source-typed sector law outside the fixed RT010 universal-character axiom. It proves nongenericity and a future robustness burden, not hidden target import into the fixed candidate."
    burden_effect: "narrows_next_refuter_question"
  - payload_id: "NMP-RT011-MATH-003"
    payload_type: "symmetry_nonselection_lemma"
    name: "Bare-cycle basepoint and oriented-line frame nonselection"
    statement: "The undecorated oriented three-cycle has no automorphism-natural selected vertex, and an oriented real line has no automorphism-natural positive frame."
    proof: "The cyclic orientation-preserving automorphism group C3 acts transitively on the three vertices and fixes none, so an equivariant selected vertex cannot exist. Positive scalar automorphisms act freely and transitively on positive frames of an oriented line and fix no frame."
    exact_consequence: "Point 0 and the frames are genuinely added source structure. Naturality under isomorphisms transporting them is correct structure-relative naturality, not a derivation from the undecorated source cycle."
    reanchoring_witness: "At mu=1, reanchoring from vertex 0 to vertex 1 multiplies the R,S,D cochains by exp(-1), exp(2), exp(-3), respectively. These unequal constants are not one common gauge."
    burden_effect: "classifies_new_primitive_debt"
  - payload_id: "NMP-RT011-MATH-004"
    payload_type: "logical_epistemic_independence_countermodel"
    name: "Alternative gauge-invariant source covector with identical DAG shape"
    construction: "Replace m=(1,-1,0,0) by m_0=(1,-1,1,-1), the first row of B, while leaving C_src, B, d, v, G_src, ell, frames, and the dependency order unchanged."
    exact_checks: "m_0*d=0, m_0*v=0, and m_0*x_*=0. Thus the alternative character is gauge invariant but is trivial on the base root and constant along the non-gauge admissible flow."
    consequence: "Acyclic typing alone does not select m over m_0 or prove that character relevance to A_src was independently motivated. RT010 accurately leaves that epistemic selection unproved."
    burden_effect: "separates_logical_from_epistemic_independence"

pointed_anchor_and_retrivialization_analysis:
  fixed_law_result: "For fixed rho_s, chi, positive frames, and a_s(0)=1, any two intertwiners have constant ratio c_s and the anchor forces c_s=1. FB-04 therefore remains closed inside the fixed structured law."
  unanchored_result: "Removing anchors restores an (R_{>0})^3 intertwiner torsor and an (R_{>0})^2 relative torsor after one diagonal common gauge."
  unequal_retrivialization: "Multiplying only j_R by c>0 preserves the unanchored intertwining equation but changes the R anchor. It is a different anchored candidate law, not another output of the fixed one."
  basepoint_change: "Normalizing at vertex q replaces a_s(i) by a_s(i)/a_s(q). At q=1 and mu=1 the sector multipliers are exp(-1), exp(2), exp(-3), so a basepoint change is sector-relative and cannot be absorbed by one common scale."
  purity_classification: "The point, frames, and anchors are disclosed mathematical source-structure tokens. They supply neither physical units nor an operational calibration. Their absence from current ontology creates primitive and adoption debt, not a hidden target import."

