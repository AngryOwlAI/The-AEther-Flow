constructive_restricted_domain_audit:
  domain_id: "ExplicitlyEquippedThreeAddressControls_v1"
  carrier:
    carrier_id: "B_3"
    vertices: ["0", "1", "2"]
    full_support_matrix:
      - [1, 1, 0]
      - [0, 1, 1]
      - [0, 0, 1]
    reduced_edges:
      - "0->1"
      - "1->2"
    exact_meaning: "stipulated finite reflexive forward-chain source carrier"
    physical_geometry: false
  equipped_instance:
    tuple: "(sigma,C,kappa_C)"
    requirements:
      - "C is a finite valid P7-T02 control."
      - "Every configuration in Omega_C has one explicitly recorded P7-T01 sector sigma, or a declared sector-transport record is supplied."
      - "kappa_C is a declared bijection from Omega_C to B_3."
      - "kappa_C transports typed identities to typed identities."
      - "x R_C y if and only if kappa_C(x) R_B3 kappa_C(y)."
      - "No target metric, detector result, physical action, or desired GR behavior selects kappa_C."
    excluded_by_definition:
      - "unequipped controls"
      - "controls of nonmatching cardinality"
      - "maps that preserve but do not reflect support when exact intertwining is claimed"
      - "maps selected from target or process authority"
  available_examples:
    Rod_src:
      control: "P7T03-CONTROL-ROD-ADDRESS-CHAIN-001"
      map: "kappa_R(r_j)=j"
      status: "new explicit proposal-only equipment if parent declares it"
    Signal_src:
      control: "P7T03-CONTROL-SIGNAL-CHAIN-001"
      map: "kappa_S(s_j)=j"
      status: "explicit proposal-only equipment"
    Detector_src:
      control: "P7T03-CONTROL-DETECTOR-TRANSDUCER-001"
      map: "kappa_D(q_j)=j"
      status: "explicit proposal-only equipment"
  available_example_limit: >-
    These are three protocol controls, not an enumeration of admitted source
    sectors. Their address maps are support maps. Cross-control preservation
    of P7-T01 Q and D is not supplied merely by the matching address index.
  induced_control_comparison:
    definition: "h_(D<-C)=kappa_D^(-1) composed with kappa_C"
    exact_result: >-
      If both equipments are valid, h_(D<-C) is a bijective support
      intertwiner. For three valid equipments, h_(E<-D) composed with
      h_(D<-C) equals h_(E<-C).
    semantic_limit: "finite support-level comparison only"

naturality_theorem_audit:
  theorem_id: "P7T05-THM-THREE-ADDRESS-COUPLING-NATURALITY-001"
  controlled_title: "Conditional naturality of explicitly equipped three-address source comparisons"
  minimum_hypotheses:
    - "C and D are valid finite P7-T02 controls in the explicitly equipped restricted domain."
    - "kappa_C and kappa_D are declared bijective support intertwiners to B_3."
    - "h:Omega_C->Omega_D is a declared control-support isomorphism."
    - "The equipment-coherence equation kappa_D composed with h equals kappa_C is checked."
    - "If P7-T01 sector naturality is claimed, h must additionally be a declared compatible P7-T01 presentation map with the exact Q,D transport recorded."
  exact_conclusions:
    - "the comparison square commutes"
    - "full and reduced support transport"
    - "Boolean exact and bounded reachability transport"
    - "composition of induced equipped-control comparisons"
  proof_character: >-
    Conditional and largely definitional coherence relative to explicitly
    supplied equipment. The theorem is useful because it exposes every
    premise; it is not evidence that current ontology derives the equipment.
  conclusions_not_licensed:
    - "naturality under every source presentation without an equipment transport rule"
    - "sector preservation across controls without a Q,D transport check"
    - "universality over all admitted sectors"
    - "target covariance or diffeomorphism invariance"
    - "physical gauge symmetry"
    - "physical matter coupling"
    - "effective geometry"
    - "equivalence-principle behavior"
  theorem_status: "task-local_exact_if_parent_supplies_and_checks_all_hypotheses"
  proof_authority: false

same_sector_nonselection_obstruction_audit:
  theorem_id: "P7T05-THM-SECTOR-DATA-NONSELECTION-001"
  obstruction_id: "OBST-P7T05-SECTOR-COUPLING-FUNCTOR-NONSELECTION-001"
  shared_p7_t01_data:
    source_complex: "the exact P7-T02 positive two-vertex control basis with link e and zero defect"
    configurations:
      x_u:
        occupation: "m(u,rho)=1"
        charge_chain: "[u]"
        defect_chain: "0"
        sector: "(1,[0])"
      x_v:
        occupation: "m(v,rho)=1"
        charge_chain: "[v]"
        defect_chain: "0"
        sector: "(1,[0])"
    admitted_forward_transition:
      id: "T_e"
      tuple: "(x_u,e,0,Pi_e,x_v)"
      continuity_check: "[v]-[u]=partial_1 e"
      defect_check: "0-0=0"
      sector_preserved: true
  equal_cardinality_controls:
    identity_only_control:
      control_id: "P7T05-CTRL-SAME-SECTOR-IDENTITY-ONLY-001"
      configuration_set: ["x_u", "x_v"]
      enabled_rows:
        x_u: ["id_u"]
        x_v: ["id_v"]
      full_support_matrix:
        - [1, 0]
        - [0, 1]
      profile:
        vertex_count: 2
        reduced_edge_count: 0
        strongly_connected_component_count: 2
        reduced_directed_cycle_present: false
        reachable_pair_diameter: 0
    forward_control:
      control_id: "P7T05-CTRL-SAME-SECTOR-FORWARD-001"
      configuration_set: ["x_u", "x_v"]
      enabled_rows:
        x_u: ["id_u", "T_e"]
        x_v: ["id_v"]
      full_support_matrix:
        - [1, 1]
        - [0, 1]
      profile:
        vertex_count: 2
        reduced_edge_count: 1
        strongly_connected_component_count: 2
        reduced_directed_cycle_present: false
        reachable_pair_diameter: 1
  held_fixed:
    - "the source incidence complex"
    - "the two configurations"
    - "the exact P7-T02 sector value sigma_0=(1,[0])"
    - "the vertex cardinality"
    - "the typed-identity convention"
  varied:
    - "only the enabled-row inclusion of the admitted transition T_e"
  exact_nonisomorphism_reason:
    - "reduced edge count is zero versus one"
    - "reachable-pair diameter is zero versus one"
  invariants_not_distinguishing_this_pair:
    - "vertex count is equal"
    - "strongly connected component count is equal"
    - "nontrivial directed-cycle status is equal"
  two_model_argument:
    premises:
      - "Both controls satisfy the P7-T02 finite-control type."
      - "Every configuration in both controls has the same P7-T01 sector sigma."
      - "P7-T01 sector data contain no enabled-row field."
      - "Current ontology does not derive the P7-T02 enabled-row selection."
    conclusion: >-
      The same current sector record is compatible with two
      support-nonisomorphic controls. Therefore the sector record and current
      ontology do not determine a unique control-support object, and hence do
      not determine a unique equipment or comparison assignment from sector
      values alone.
  exact_obstruction_components:
    - "missing sector-to-control selector Sel"
    - "missing proof that Sel(sigma) lies in the B_3-equipped domain for every admitted sigma"
    - "missing equipment assignment kappa_sigma"
    - "missing coherence law under admissible source-presentation maps"
  relation_to_b3: >-
    The two-state countermodel is deliberately upstream of B_3 equipment. It
    shows that sector data do not even select control cardinality or support,
    so they cannot derive membership in the three-address equipped domain.
    It does not prove that no separately stipulated three-state control or
    comparison can be supplied for sigma.
  exact_allowed_conclusion: >-
    Current proposal-only sector data do not derive the universal
    sector-indexed control-and-comparison selection required by P7-T05.
  conclusions_not_licensed:
    - "no mathematical selector exists"
    - "no choice function may be stipulated"
    - "no nonbijective or lossy common comparison exists"
    - "no other carrier can be used"
    - "physical matter cannot couple universally"
    - "future conservative source extension is impossible"
    - "the global theory is false"

