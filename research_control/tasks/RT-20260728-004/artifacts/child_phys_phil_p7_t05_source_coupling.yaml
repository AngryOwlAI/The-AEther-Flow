    preferred_prose: "source support comparison"
    forbidden_overread: "physical matter coupling or coupling constant"
  universal:
    risk: "suggests coverage and one law for every admitted physical matter sector"
    allowed_use: >-
      Use for the unmet P7-T05 target or the precisely obstructed
      sector-indexed selection obligation.
    preferred_prose: "uniform on the explicitly equipped restricted domain"
    forbidden_overread: "universal over all admitted sectors"
  all_admitted_sectors:
    risk: >-
      P7-T01 does not supply a finite enumeration, one control per sector, or
      a proof that every realized sector has B_3 equipment.
    allowed_use: >-
      State that coverage of all admitted sectors is an unfulfilled
      obligation and an exact failed component.
    forbidden_overread: "Rod_src, Signal_src, and Detector_src exhaust all sectors"
  common_carrier:
    risk: "may be mistaken for a common physical spacetime or geometry"
    allowed_use: "one stipulated finite reference support relation B_3"
    forbidden_overread: "common physical carrier, background, cone, or metric"
  geometry:
    risk: "suggests dimension, locality, distance, bilinear form, signature, or causal structure"
    allowed_use: "only in explicit negative or missing-map statements"
    forbidden_overread: "B_3 is common geometry or preserves common geometry"
  matter:
    risk: "suggests empirically interpreted physical fields or particles"
    allowed_use: "P7-T01 source-matter candidate nomenclature with proposal-only qualification"
    forbidden_overread: "the protocol controls are physical matter sectors"
  naturality:
    risk: "suggests a source-derived functorial law under every symmetry"
    allowed_use: >-
      Conditional equipment coherence under explicitly declared maps and
      exact hypotheses.
    forbidden_overread: "automatic covariance, gauge invariance, or source-derived universality"
  effective:
    risk: "suggests a justified coarse graining, low-energy limit, or physical output theory"
    allowed_use: "only as the still-open source-to-effective target named by the plan"
    forbidden_overread: "the finite carrier or support map is an effective geometry or effective coupling"

exact_allowed_wording:
  - "The map kappa_C is an explicitly supplied proposal-only support intertwiner on an equipped finite control."
  - "The same comparison schema applies uniformly to each object already admitted to the equipped restricted domain."
  - "Conditional on equipment coherence, the source support comparison is natural under the declared compatible control map."
  - "The Rod_src, Signal_src, and Detector_src controls can be equipped with maps to the same stipulated three-address support carrier."
  - "The role names remain formal protocol labels and are not physical matter sectors."
  - "The sector record Sec_src=(Q,D) is coarser than configuration identity and omits enabled-row control data."
  - "Two equal-size controls in the same sector can have nonisomorphic support relations."
  - "Current ontology does not derive the sector-indexed control selector or equipment assignment required for all-sector coverage."
  - "The exact result is a precise current-data obstruction with a constructive restricted domain."
  - "Adoption is blocked while conservative same-milestone continuation remains open."
  - "No physical interpretation or protected status follows from the task-local exact theorems."

forbidden_wording:
  - "A universal matter-coupling law has been derived."
  - "The comparison acts on all admitted physical matter sectors."
  - "The three protocol roles are the admitted matter sectors."
  - "B_3 is a common physical carrier or common geometry."
  - "The source comparison is a covariant derivative."
  - "The comparison defines minimal coupling."
  - "The finite support relation defines an action or field equation."
  - "The equipped-control theorem derives stress energy."
  - "The finite chain defines a physical cone, light cone, or metric."
  - "Conditional equipment coherence is diffeomorphism covariance or gauge invariance."
  - "The construction establishes the equivalence principle."
  - "The obstruction proves physical nonuniversality."
  - "No universal comparison or coupling can ever exist."
  - "The ontology has adopted the selector, equipment, or coupling law."
  - "The theorem is a proof or promotion of the physical theory."
  - "Einstein equations, exact GR, or benchmark recovery have been derived."
  - "The result is a global no-go theorem or global theory rejection."
  - "Future source extension is impossible."

