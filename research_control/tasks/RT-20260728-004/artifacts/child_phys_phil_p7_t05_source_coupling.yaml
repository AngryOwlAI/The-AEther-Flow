conservative_reopening_criteria:
  valid_reopening_classes:
    - reopening_class: "new_sector_to_control_selector"
      required_delta: >-
        Supply a target-atlas-free proposal for Sel on a declared admitted
        sector domain and prove its typing, sector confinement, and
        presentation coherence.
    - reopening_class: "new_total_equipment_family"
      required_delta: >-
        Supply one explicitly typed carrier and comparison map for every
        selected sector control, with a nontrivial coverage and information
        retention criterion.
    - reopening_class: "new_comparison_not_exact_bijection"
      required_delta: >-
        Define a quotient, embedding, span, common cover, coarse graining, or
        enriched comparison, and state exactly which data it preserves,
        reflects, or discards.
    - reopening_class: "new_intervention_stability_law"
      required_delta: >-
        Supply a source-only rule transporting or updating equipment when
        allowed interventions change enabled support.
    - reopening_class: "new_source_to_operator_map"
      required_delta: >-
        Supply a field domain, operator type, locality or composition rule,
        source provenance, and no-target-import audit before coupling or
        correction-operator language is used.
    - reopening_class: "new_model_to_world_bridge"
      required_delta: >-
        Supply physical matter, carrier, geometry, and operational
        interpretation maps and route them through the required audits and
        protected authority.
    - reopening_class: "protected_source_law_authority"
      required_delta: >-
        Obtain explicit human-gated authority before canonical-ontology
        candidate designation, adoption, rejection, or physical promotion.
  invalid_reopening_bases:
    - "renaming kappa_C as a covariant derivative"
    - "calling B_3 common geometry"
    - "treating the three protocol roles as all matter sectors"
    - "using a target metric or desired GR result to choose the selector"
    - "collapsing every control to a one-point quotient without an information criterion"
    - "repeating the same same-sector control pair without a material premise delta"
    - "treating validator or checkpoint success as scientific proof"

