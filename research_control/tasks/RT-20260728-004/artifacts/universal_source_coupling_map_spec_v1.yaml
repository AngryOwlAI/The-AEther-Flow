source_types:
  source_sector:
    notation: "sigma=(Q,D)"
    exact_status: "proposal-only P7-T01 derived record"
  finite_control:
    notation: "C=(Omega,E,s,t,K_C)"
    exact_status: "proposal-only P7-T02 finite enabled-row object"
  sector_fiber:
    notation: "Omega_(C,sigma)={x in Omega:Sec_src(x)=sigma}"
    exact_property: "every supported edge remains within one fiber"
  common_carrier:
    notation: "B3={b_0,b_1,b_2}"
    exact_support: "typed identities plus b_0->b_1 and b_1->b_2"
    physical_geometry: false
  bookkeeping_space:
    notation: "V_C=Q^(Omega)"
    exact_status: "finite rational bookkeeping vector space; not a quantum state space or empirical ensemble"

explicitly_equipped_control:
  notation: "C_hat=(C,Sigma_C,lambda_C,kappa_C)"
  lambda: "lambda_C=Sec_src restricted to Omega"
  kappa_type: "kappa_C:Omega -> B3 x Sigma_C"
  required_conditions:
    - "kappa_C is explicitly supplied rather than inferred from a familiar protocol name"
    - "pr_Sigma composed with kappa_C equals lambda_C"
    - "each sector-fiber restriction is a bijection to B3 x {sigma}"
    - "kappa_C transports every enabled transition row and typed identity bijectively"
    - "transport preserves every rational P7-T02 kernel coefficient"
    - "kappa_C is defined from source records only"
  constructive_domain: "all and only controls carrying these explicit data"
  universal_over_domain: "the construction acts on every sector fiber of each explicitly equipped control"
  universal_over_all_p7_t01_sectors: false
  current_ontology_derives_equipment: false

coupling_comparison:
  notation: "Kappa_(C_hat):V_C -> direct_sum_(sigma in Sigma_C) Q^(B3)"
  component_formula: "(Kappa_(C_hat) mu)_sigma(b)=mu(kappa_C^(-1)(b,sigma))"
  inverse_formula: "(Kappa_(C_hat)^(-1) nu)(x)=nu_(Sec_src(x))(pr_B3(kappa_C(x)))"
  exact_classification: "sectorwise rational reindexing and update intertwiner"
  minimal_effective_generalized_status:
    minimal_physical_coupling: false
    effective_physical_coupling: false
    generalized_physical_coupling: false
    proposal_only_source_comparison: true
  diagnostic_residual: "Delta_(C,kappa)=U_C-Kappa^(-1)(direct_sum U_B3)Kappa"
  admitted_exact_branch: "Delta_(C,kappa)=0"
  nonzero_branch: "incompatible_source_comparison"

theorems:
  - theorem_id: "P7T05-THM-THREE-ADDRESS-COUPLING-NATURALITY-001"
    title: "Explicit equipment yields an invertible sectorwise update intertwiner natural under compatible presentations"
    statement: "For every explicitly equipped control C_hat, Kappa_(C_hat) is an invertible rational-linear reindexing and Kappa_(C_hat) U_C=(direct_sum_sigma U_B3) Kappa_(C_hat). Compatible source-presentation maps commute with Kappa, and compatible equipment transports compose."
    proof_basis:
      - "fiberwise bijectivity makes the displayed inverse well defined"
      - "row-bijective transition transport preserves every kernel coefficient"
      - "finite change of variables in the P7-T02 update sum gives the intertwining equation"
      - "associativity of map composition proves presentation naturality and equipment composition"
    exact_scope: "task-local proposal-only explicitly equipped finite controls"
    physical_coupling_theorem: false
  - theorem_id: "P7T05-THM-SECTOR-DATA-NONSELECTION-001"
    title: "P7-T01 sector data alone do not select a universal support-preserving coupling carrier"
    statement: "In the explicit P7-T02 sector sigma_0=(1,[0]), the equal-cardinality identity-only control and identity-plus-forward control have full support edge counts two and three. No one two-state relation is support-isomorphic to both; hence Sec_src alone cannot determine a carrier relation and comparison valid for every admitted finite control in that sector."
    proof_basis:
      - "P7-T02 explicitly provides distinct configurations x_u and x_v in sector sigma_0 and the admissible same-sector record T_e"
      - "P7-T02 permits the displayed identity-plus-forward control and the identity-only control on the same two states"
      - "support edge count is invariant under every carrier bijection"
      - "the sector record is identical in both controls and therefore omits the deciding enabled-row datum"
    exact_scope: "current proposal-only P7-T01/P7-T02 candidate data"
    p7_t04_obstruction_repeated: false
    global_no_go_claimed: false

