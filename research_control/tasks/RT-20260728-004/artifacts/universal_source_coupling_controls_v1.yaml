  definition: "Delta_(C,kappa)=K_C-kappa^{-1} K_B kappa on the finite rational bookkeeping vector space whenever both sides are typed"
  exact_candidate_requirement: "Delta_(C,kappa)=0"
  nonzero_meaning: "source comparison mismatch requiring fail-closed incompatible status"
  physical_nonuniversal_correction_operator: false
