fail_closed_controls:
  - control_id: "P7T05-CTRL-VALID-EQUIPPED-001"
    condition: "all equipped-control predicates hold"
    result: "valid_constructive_domain"
  - control_id: "P7T05-CTRL-MISSING-KAPPA-001"
    condition: "control and sector fibers are supplied but kappa_C is absent"
    result: "underdetermined_source_comparison"
  - control_id: "P7T05-CTRL-NONBIJECTIVE-KAPPA-001"
    condition: "kappa_C is not bijective on a declared sector fiber"
    result: "malformed_source_comparison"
  - control_id: "P7T05-CTRL-NONINTERTWINING-KAPPA-001"
    condition: "kappa_C fails support or rational-row transport"
    result: "incompatible_source_comparison"
  - control_id: "P7T05-CTRL-SECTOR-FIBER-NOT-B3-001"
    condition: "a sector fiber does not have the explicitly equipped three-address type"
    result: "outside_constructive_domain_not_refuted"
  - control_id: "P7T05-CTRL-MIXED-SECTOR-EDGE-001"
    condition: "an alleged P7-T02 edge changes Sec_src"
    result: "malformed_against_fixed_p7_t01_basis"
  - control_id: "P7T05-CTRL-TARGET-IMPORT-001"
    condition: "kappa_C or the carrier is selected from a target metric cone detector outcome benchmark behavior validator registry generated derivative or commit state"
    result: "forbidden_target_import"
  - control_id: "P7T05-CTRL-PHYSICAL-OVERREAD-001"
    condition: "the source comparison is called a physical coupling covariant derivative action stress tensor metric geometry or equivalence principle"
    result: "forbidden_model_to_world_overread"

