same_sector_countermodel:
  countermodel_id: "P7T05-CM-SAME-SECTOR-TWO-CONTROLS-001"
  source_basis: "P7-T02 explicitly supplies distinct x_u and x_v in sector sigma_0=(1,[0]) and the admissible nonidentity record T_e:x_u->x_v"
  fixed_sector:
    sector_id: "sigma_0"
    sector_value: "(1,[0])"
    configurations: ["x_u", "x_v"]
    equal_cardinality: true
    state_count_each: 2
  identity_only_control:
    control_id: "C_id_sigma_0"
    states: ["x_u", "x_v"]
    enabled_rows:
      x_u:
        - transition_id: "id_xu"
          target: "x_u"
          weight: "1"
      x_v:
        - transition_id: "id_xv"
          target: "x_v"
          weight: "1"
    update_matrix_rows_target_columns_source:
      - ["1", "0"]
      - ["0", "1"]
    full_support_edges: ["x_u->x_u", "x_v->x_v"]
    full_support_edge_count: 2
    reduced_support_edge_count: 0
    strongly_connected_component_count: 2
  forward_control:
    control_id: "C_fwd_sigma_0"
    states: ["x_u", "x_v"]
    enabled_rows:
      x_u:
        - transition_id: "id_xu"
          target: "x_u"
          weight: "1/2"
        - transition_id: "T_e"
          target: "x_v"
          weight: "1/2"
      x_v:
        - transition_id: "id_xv"
          target: "x_v"
          weight: "1"
    update_matrix_rows_target_columns_source:
      - ["1/2", "0"]
      - ["1/2", "1"]
    full_support_edges: ["x_u->x_u", "x_u->x_v", "x_v->x_v"]
    full_support_edge_count: 3
    reduced_support_edge_count: 1
    strongly_connected_component_count: 2
  held_fixed:
    - "P7-T01 incidence complex and internal label declarations"
    - "the two configurations x_u and x_v"
    - "sector label sigma_0=(1,[0])"
    - "carrier cardinality two"
    - "typed identity convention"
  varied:
    - "whether the admissible nonidentity record T_e is enabled"
    - "the resulting support and rational update matrices"
  incompatible_invariants:
    - "full support edge count 2 versus 3"
    - "reduced support edge count 0 versus 1"
    - "identity update versus nonidentity forward update"
  exact_conclusion: "no relation on one two-state carrier can be support-isomorphic to both controls; therefore Sec_src alone does not determine a universal support-preserving carrier or comparison for all admitted controls in sigma_0"
  p7_t04_obstruction_repeated: false
  global_no_go_claimed: false

