matrix_conventions:
  orientation: "rows are target configurations and columns are source configurations"
  identity_rule: "every P7-T02 enabled row contains its typed identity"
  support_rule: "a matrix entry is support-present exactly when its rational coefficient is positive"
  composition_index: "formal update count only; not physical time or causal order"
  sector_rule: "every enabled P7-T01 transition preserves Sec_src=(Q,D)"

common_three_address_carrier:
  carrier_id: "B3_SOURCE_CHAIN_V1"
  states: ["b_0", "b_1", "b_2"]
  sector_parameter: "sigma"
  enabled_rows:
    b_0:
      - transition_id: "id_b0"
        target: "b_0"
        weight: "1/2"
      - transition_id: "f_b01"
        target: "b_1"
        weight: "1/2"
    b_1:
      - transition_id: "id_b1"
        target: "b_1"
        weight: "1/2"
      - transition_id: "f_b12"
        target: "b_2"
        weight: "1/2"
    b_2:
      - transition_id: "id_b2"
        target: "b_2"
        weight: "1"
  update_matrix_rows_target_columns_source:
    - ["1/2", "0", "0"]
    - ["1/2", "1/2", "0"]
    - ["0", "1/2", "1"]
  full_support_edges:
    - "b_0->b_0"
    - "b_0->b_1"
    - "b_1->b_1"
    - "b_1->b_2"
    - "b_2->b_2"
  reduced_support_edges:
    - "b_0->b_1"
    - "b_1->b_2"
  physical_geometry_claimed: false

equipped_control_type:
  type_id: "ExplicitlyEquippedSectorControl_v1"
  tuple: "(C,Sigma_C,lambda_C,kappa_C)"
  fields:
    C: "one fixed proposal-only P7-T02 finite control"
    Sigma_C: "finite set of P7-T01 sector labels occurring in C"
    lambda_C: "restriction of Sec_src to the finite carrier Omega_C"
    kappa_C: "explicit bijection Omega_C -> B3 x Sigma_C"
  predicates:
    - "for every x, pr_Sigma(kappa_C(x))=lambda_C(x)"
    - "for every sigma in Sigma_C, kappa_C restricts to a bijection Omega_(C,sigma) -> B3 x {sigma}"
    - "kappa_C transports typed identities and nonidentity transition rows bijectively"
    - "transported rational kernel coefficients equal the B3 coefficients in the same sector fiber"
    - "no target atlas metric cone detector calibration desired benchmark result validator or generated derivative defines kappa_C"
  consequence: "the comparison is total on every sector occurring in this explicitly equipped control"
  global_sector_selection_claimed: false

