equipped_sector_control_type:
  type_id: "B3EquippedSectorControl_v1"
  object_notation: "E=(sigma,C,kappa,kappa_hat)"
  fields:
    sector:
      notation: "sigma"
      type: "an admitted P7-T01 sector coordinate"
    finite_control:
      notation: "C=(Omega,E,s,t,K_C)"
      requirements:
        - "C is a valid finite P7-T02 control."
        - "Omega is contained in Sec_src_inverse(sigma)."
        - "Omega has exactly three elements."
    state_comparison:
      notation: "kappa:Omega->B_3"
      requirements:
        - "kappa is an explicitly supplied source-state bijection."
    transition_comparison:
      notation: "kappa_hat:E->E_B3"
      requirements:
        - "kappa_hat is an explicitly supplied transition-record bijection."
        - "s_B3(kappa_hat(T))=kappa(s_C(T)) for every T."
        - "t_B3(kappa_hat(T))=kappa(t_C(T)) for every T."
        - "kappa_hat maps each typed identity 1_x to iota_(kappa(x))."
        - "kappa_hat maps E_x bijectively to the enabled row E_B3_(kappa(x))."
        - "K_B3(kappa_hat(T)|kappa(x))=K_C(T|x)."
  source_of_equipment: "The comparison maps are explicit proposal-only source-extension data; they are not inferred from the sector label."
  excluded_cases:
    - "A control of cardinality other than three is outside this restricted type, not malformed solely for that reason."
    - "A state bijection without a row-bijective transition lift is not equipped."
    - "A support map that does not preserve the P7-T02 kernel is not an exact update comparison."

restricted_source_coupling_comparison:
  map_id: "ThreeAddressSupportCouplingMap_v1"
  exact_scope: "all and only B3EquippedSectorControl_v1 objects"
  map_notation: "Gamma_E=kappa_*"
  domain: "B(Omega)=Q_nonnegative^Omega"
  codomain: "B(B_3)=Q_nonnegative^B3"
  definition: "(kappa_* mu)(j)=sum_(x in kappa_inverse(j)) mu(x)=mu(kappa_inverse(j)) because kappa is bijective"
  inverse: "(kappa_* inverse nu)(x)=nu(kappa(x))"
  exact_properties:
    - "Gamma_E is a nonnegative rational linear isomorphism."
    - "Gamma_E preserves total bookkeeping mass."
    - "Gamma_E maps delta_x to delta_(kappa(x))."
    - "Gamma_E U_C=U_B3 Gamma_E."
    - "Gamma_E transports every exact and bounded support-reachability relation."
  authorized_reading: "sector-labelled reindexing of proposal-only bookkeeping states under explicitly supplied control transport"
  prohibited_reading:
    - "physical matter coupling"
    - "covariant derivative"
    - "connection or gauge field"
    - "matter action or interaction term"
    - "stress-energy map"
    - "metric or common physical geometry"
    - "equivalence-principle law"

mathematical_results:
  - theorem_id: "P7T05-THM-THREE-ADDRESS-COUPLING-NATURALITY-001"
    title: "Exact update intertwining, naturality, and composition on explicitly B3-equipped sector controls"
    status: "draft/control exact theorem within the proposal-only restricted candidate"
    hypotheses:
      - "E=(sigma,C,kappa,kappa_hat) is a B3EquippedSectorControl_v1 object."
      - "C and B3 carry the fixed P7-T02 uniform row kernels."
      - "For the naturality clause, h:C->C_prime and h_hat:E->E_prime are source-presentation control isomorphisms preserving endpoints, identities, enabled rows, and kernel coefficients."
      - "The equipment commutes: kappa_prime composed with h equals kappa, and kappa_hat_prime composed with h_hat equals kappa_hat."
    conclusions:
      - "For every mu in B(Omega), kappa_* U_C mu=U_B3 kappa_* mu."
      - "For compatible h, kappa_prime_* h_*=kappa_*."
      - "If b:C->D and c:D->F are compatible control transports, then (c composed with b)_*=c_* b_*."
      - "Pairwise comparison between two B3-equipped controls is kappa_D_inverse_* kappa_C_*, and these comparisons compose associatively."
      - "The exact source comparison therefore defines a natural reindexing on the explicitly equipped restricted domain."
    proof_sketch:
      - "Evaluate the left side at j in B_3 and expand the P7-T02 update over x in Omega and T in E_x with target kappa_inverse(j)."
      - "Change variables x_bar=kappa(x) and T_bar=kappa_hat(T). The state and transition bijections preserve row membership, endpoints, identities, and every kernel coefficient."
      - "The transformed finite sum is exactly (U_B3 kappa_* mu)(j), proving the update intertwiner."
      - "For naturality, evaluate kappa_prime_* h_* mu at j. The commuting identity kappa_prime h=kappa makes the unique preimage equal to the kappa-preimage, so the result is kappa_* mu."
      - "Pushforward composition follows directly by evaluating a bookkeeping function on the unique inverse image under composed bijections."
      - "Associativity of pairwise comparisons follows from associativity of map composition and cancellation of each intermediate kappa_* with its inverse."
    constructive_status: "constructed on the restricted equipped-control domain"
    proof_authority: false
    physical_coupling_claimed: false

  - theorem_id: "P7T05-THM-SECTOR-DATA-NONSELECTION-001"
    title: "The current P7-T01 sector coordinate does not select enabled-row control data or one exact universal comparison"
    status: "draft/control exact same-sector countermodel theorem"
    hypotheses:
      - "Use the explicit P7-T02 positive-control configurations x_u and x_v with one rho occupation moved along e, zero defect, and common sector sigma_0=(1,[0])."
      - "Use the displayed admitted forward transition T_e=(x_u,e,0,Pi_e,x_v)."
      - "C_id and C_fwd use the same two-element carrier Omega={x_u,x_v}."
      - "C_id has only the typed identity in each enabled row."
      - "C_fwd has {1_xu,T_e} at x_u and {1_xv} at x_v."
      - "Both controls use the fixed P7-T02 uniform row kernel."
    conclusions:
      - "Every state in both controls has the same P7-T01 sector sigma."
      - "The controls have equal carrier cardinality and even the identical state carrier."
      - "C_id has no reduced support edge, while C_fwd has the reduced support edge x_u->x_v."
      - "C_id and C_fwd are not support-transport isomorphic and their bookkeeping updates differ."
      - "No law whose only mathematical input is sigma can recover the enabled-row isomorphism class of both admissible controls."
      - "Consequently current sector data alone do not derive a sector-indexed exact support-preserving universal carrier/comparison."
    proof_sketch:
      - "The P7-T02 positive control fixes Sec_src(x_u)=Sec_src(x_v)=sigma_0=(1,[0]) and admits T_e, so both controls are well typed inside one fixed sector."
      - "Deleting typed identities leaves the empty reduced relation for C_id and the singleton relation {(x_u,x_v)} for C_fwd."
      - "Reduced support-edge count is invariant under every support-preserving bijection; zero is not one, so the controls are nonisomorphic."
      - "Equivalently, U_id delta_xu=delta_xu while U_fwd delta_xu=(delta_xu+delta_xv)/2, so the exact updates cannot be identified by a state bijection preserving x_u and x_v support."
      - "A sector-only selector sees the identical input sigma in the two admissible realizations. Selecting one control class therefore adds information not contained in sigma; it cannot be presented as a consequence of Sec_src."
    exact_scope:
      - "nonselection from the current P7-T01 sector coordinate alone"
      - "exact support-preserving and kernel-preserving bijective comparisons"
      - "the two fixed proposal-only P7-T02 control realizations"
    not_proved:
      - "that an arbitrary extra selector cannot be stipulated"
      - "that a quotient, embedding, lax morphism, stochastic map, enriched carrier, or non-bijective comparison cannot be defined"
      - "that future source extensions cannot derive a selector"
      - "that physical universal coupling is impossible"
    proof_authority: false

