resolutions:
  - conflict_id: "PHIL-CONFLICT-P7T05-01"
    issue: "The word coupling can overstate a finite support comparison."
    resolution: >-
      The parent packet defines kappa_C as an equipped-control source support
      comparison or support intertwiner. Coupling remains only inside
      controlled artifact identifiers and explicitly qualified P7 target
      language.
    status: "resolved"
  - conflict_id: "PHIL-CONFLICT-P7T05-02"
    issue: "Protocol roles are not admitted matter sectors."
    resolution: >-
      Rod_src, Signal_src, and Detector_src are recorded only as three
      constructive equipped-control instances. They do not establish
      all-sector coverage or physical matter.
    status: "resolved"
  - conflict_id: "PHIL-CONFLICT-P7T05-03"
    issue: "An address bijection is not automatically a full source-presentation map."
    resolution: >-
      The positive theorem remains at finite support and bookkeeping-kernel
      level. Any claim transporting Q, D, or a full source presentation
      requires a separately supplied and checked compatible source map.
    status: "resolved"
  - conflict_id: "PHIL-CONFLICT-P7T05-04"
    issue: "Naturality requires equipment coherence."
    resolution: >-
      The theorem hypothesis explicitly requires a compatible control
      isomorphism h and kappa_D composed with h equals kappa_C. Naturality is
      candidate-relative and conditional on that equation.
    status: "resolved"
  - conflict_id: "PHIL-CONFLICT-P7T05-05"
    issue: "The same-sector pair proves nonselection rather than absolute nonexistence."
    resolution: >-
      The conclusion is limited to current ontology not deriving the
      selector. New source-side selectors, nonbijective comparisons,
      quotients with information criteria, different carriers, and future
      conservative source extensions remain open.
    status: "resolved"
  - conflict_id: "PHIL-CONFLICT-P7T05-06"
    issue: "The two-state countermodel is not itself B_3-equipped."
    resolution: >-
      The countermodel is used upstream to show loss of control-selection
      information in the sector projection. It does not claim that no
      proposed map to B_3 or another carrier can exist.
    status: "resolved"
  - conflict_id: "PHIL-CONFLICT-P7T05-07"
    issue: "P7-T04 supplies no common physical geometry."
    resolution: >-
      B_3 is a stipulated finite reference relation only. Common physical
      geometry, cone, metric, and model-to-world interpretation are neither
      premises nor results of P7-T05.
    status: "resolved"
  - conflict_id: "PHIL-CONFLICT-P7T05-08"
    issue: "Nonuniversal correction operators lack a typed operator domain."
    resolution: >-
      Such operators are recorded as underdetermined. A lawful later
      construction must supply at least the source field or module, operator
      type, locality or nonlocality rule, scale ordering, coefficients, and
      model-to-world meaning.
    status: "resolved"
  - conflict_id: "PHIL-CONFLICT-P7T05-09"
    issue: "The two child route recommendations disagree on the P7-T06 role and route."
    resolution: >-
      The tracked v21 P7-T06 work-item block outranks advisory child
      recommendations. It selects ontology-formalizer@0.2.0 and
      ontology-law-research-packet for the bounded source-equivalent
      variational construction or precise obstruction. The earlier
      candidate-constructor next-route note is corrected before handoff.
