formal_definitions:
  exact_domain: >-
    F is an ordered exact field or exact ordered representation on which sign,
    matrix rank, homogeneous linear feasibility, and the root-isolation and
    root-order operations required by the admitted path class are decidable.
    The executable fixtures use F=Q. This is an algorithmic input domain, not a
    physical number-field selection.
  oriented_configuration: >-
    S is finite and nonempty, V is finite-dimensional over F, and
    A:F^S->V has nonzero predeclared oriented columns v_s with explicit
    proposal-only provenance. Let rho=rank(A) and W=span_F{v_s}.
  realized_covectors: "Cstar(A)={sgn(A^*k): k in V^*}."
  strict_chamber: "Gamma(A)={k in V^*: k(v_s)>0 for every s in S}."
  minimal_positive_circuits: >-
    Cir_plus(A) is the set of inclusion-minimal supports C contained in S for
    which A_C alpha=0 has a vector alpha in F^C_{>0}; its coefficient is retained
    only as a positive projective ray.
  total_branch: >-
    Tot_branch(A) is Feasible exactly when Gamma(A) is nonempty and Obstructed
    exactly when ker(A) intersects F^S_{>=0} nontrivially. Gordan's strict
    alternative makes the tags exhaustive and exclusive.
  presentation_groupoid: >-
    Objects are oriented configurations. An arrow g=(T,D,P) sends
    A to A'=T A D P^{-1}, with T in GL(V), D positive diagonal, and P a sector
    relabeling. Negative diagonal entries are excluded and constitute new source
    reorientation data.
  certificate_fibers: >-
    E_F(A)=Gamma(A) on the Feasible branch and
    E_O(A)={(C,[alpha]_+): C in Cir_plus(A), A_C alpha=0, alpha>0} on the
    Obstructed branch. The quotient datum is the isomorphism class of the full
    transported nonempty fiber, or its orbit space, not a canonically selected
    raw witness.
  refinement: >-
    A declared finite inclusion i:S->T preserves every old oriented ray up to
    positive scaling and adds independently provenance-bound sectors. Ref(A)
    retains covector restriction, chamber inclusion, old-circuit persistence,
    and composition only for such declared inclusions.
  tame_path_domain: >-
    Strat is defined only on a predeclared finite family of effectively encoded
    semialgebraic or piecewise-rational exact paths whose zero-column, rank, and
    relevant determinant-minor zero sets admit exact finite cell decomposition
    or isolated-root records. Arbitrary continuous paths are excluded.

rank_cap_audit:
  declared_input: "The selected packet states 1<=r<=4; RT014 states r=rank(A)<=4 and uses rank-three fixtures."
  provenance_finding: >-
    The numerical value four is inherited from the selected proposal-only
    packet and is not derived from current ontology. No audited source supplies
    an independent nonphysical computation budget or conformance rationale, and
    no mathematical step needs the ceiling.
  classification: "transparent_but_source_underived_target_shaped_theorem_domain_restriction"
  target_shape_detected: true
  forbidden_target_origin_proven: false
  source_purity_defect_detected: true
  narrow_domain_repair_required: true
  ontology_derivation_detected: false
  physical_dimension_inference_allowed: false
  theorem:
    theorem_id: "THM-RT015-GENERAL-FINITE-RANK-EXTENSION"
    statement: >-
      For every finite oriented configuration A of rank rho>=1 over the admitted
      exact domain, Bridge_OM factors through W=span(A); every minimal positive
      circuit C satisfies rank(A_C)=|C|-1, dim ker(A_C)=1, and
      |C|<=rho+1. All covector, totality, presentation, finite-refinement, and
      admitted tame-path definitions remain meaningful with no upper bound on
      rho.
    proof:
      - "Restriction V^*->W^* is surjective after extending a basis of W, so Cstar(A in V)=Cstar(A in W) and Gamma nonemptiness is unchanged."
      - "The kernel of A and every restricted kernel A_C depend only on the columns in W, so Cir_plus and the total branch also factor through W."
      - "If C is support-minimal and alpha_C>0, then a kernel dimension above one permits an exact signed perturbation of alpha_C until one coefficient becomes zero while all remain nonnegative, contradicting minimality."
      - "Hence nullity(A_C)=1, rank(A_C)=|C|-1<=rho, and |C|<=rho+1. Finiteness of S, not rho<=4, makes support and sign-cube enumeration finite."
  exact_all_rank_controls:
    field: "Q"
    rank_parameter: "Every integer rho>=1"
    sector_set: "S_rho={1,...,rho,star}"
    feasible_configuration: "A_F^(rho)=(e_1,...,e_rho,u), where u=sum_i e_i."
    feasible_certificate: "k=(1,...,1), with k(e_i)=1 and k(u)=rho, so Gamma is nonempty."
    feasible_no_circuit_proof: "A_F alpha=0 gives alpha_i+alpha_star=0 for every i; alpha>=0 forces alpha=0."
    obstructed_configuration: "A_O^(rho)=(e_1,...,e_rho,-u)."
    obstructed_certificate: "alpha=(1,...,1,1), with sum_i e_i-u=0."
    obstructed_exact_structure: "rank(A_O)=rho, ker(A_O)=Q*(1,...,1,1), and the unique positive circuit has support rho+1."
    obstructed_no_feasible_proof: "k(e_i)>0 for all i implies k(-u)=-sum_i k(e_i)<0."
    conclusion: "The support bound is sharp in every finite rank and both total branches exist without any four-dimensional target input."
  parent_exact_control_confirmation:
    model_path: "research_control/tasks/RT-20260810-015/artifacts/v22_p4_t02_b2_oriented_matroid_bridge_smuggling_audit_model.py"
    status: "PASS"
    ranks_checked: [1, 2, 3, 4, 5, 6]
    rank_five_constructible_outside_selected_cap: true
    rank_six_constructible_outside_selected_cap: true
    full_construction_survives_cap_removal: true
  narrow_repair_specification: >-
    Replace the general-domain clause 1<=rank(A)<=4 by finite rank(A)>=1,
    replace the derived numeric ceiling <=5 by the rank-generic bound
    |C|<=rank(A)+1, and rerun the existing exact controls. Do not alter fixtures,
    certificate typing, path typing, status, or authority boundaries.

independent_reorientation_audit:
  definition: "For epsilon in {+1,-1}^S, define A^epsilon=A diag(epsilon)."
  covector_law: "Cstar(A^epsilon)={epsilon coordinatewise-times X: X in Cstar(A)}."
  circuit_law: >-
    Positive circuits of A^epsilon are precisely signed circuits of A whose
    signs agree with epsilon on their support up to a global sign; they are not
    generally the positive circuits of A.
  branch_invariance_under_positive_presentation: true
  branch_invariance_under_independent_negative_reorientation: false
  exact_counterexample_family: >-
    Flipping only the star column of A_F^(rho) produces A_O^(rho). The branch
    changes from Feasible to Obstructed for every rho>=1 while the underlying
    unoriented projective configuration is unchanged.
  conclusion: >-
    Orientation is substantive disclosed source input. Symmetric acceptance of
    both branches removes favorable-output filtering, but Bridge_OM neither
    derives nor epistemically selects an orientation. No orientation may be
    called physical time orientation without a separate source law.

certificate_groupoid_audit:
  adopted_repair_id: "BR-01-CERTIFICATE-ORBIT-DESCENT"
  raw_quotient_map_would_be_typed: false
  full_fiber_groupoid_map_is_typed: true
  exact_transport:
    feasible: "k maps to T^{-T}k."
    obstructed: "(C,[alpha]_+) maps to (P C,[P D^{-1}alpha]_+)."
    proof: "A'(P D^{-1}alpha)=T A alpha=0, positivity is preserved by D>0, and (T^{-T}k)(T v)=k(v)."
  functoriality: "Identity arrows act identically and the displayed transports compose with groupoid arrows and their inverses."
  no_natural_single_witness_lemma:
    lemma_id: "LEM-RT015-NO-CANONICAL-RAW-CERTIFICATE"
    statement: >-
      Presentation covariance alone supplies no natural single raw certificate.
      A generic feasible configuration has an open chamber with infinitely many
      projective witness directions but only a finite or trivial projective
      stabilizer; hence distinct certificate orbits remain over the same
      configuration class. Obstructed configurations may likewise contain
      several inequivalent minimal positive circuits.
    consequence: >-
      The adopted repair is sound only at full-fiber or orbit-space level. The
      model's bounded-search witness is an exact conformance receipt, not a
      canonical quotient value or an epistemic selector.
  defect_in_fixed_candidate_detected: false
  preservation_condition: >-
    Preserve the registered statement that raw witnesses are fiber data and
    interpret "certificate orbit" as the full transported certificate-fiber
    datum. Any future overread as a canonical map [A]->raw k or [A]->raw alpha
    would trigger the existing presentation-transport failure branch.

tame_path_audit:
  adopted_repair_id: "BR-02-FINITE-COMPLEXITY-PATH-DOMAIN"
  arbitrary_continuous_path_finite_wall_claim: false
  restricted_effective_tame_path_claim: true
  theorem:
    theorem_id: "THM-RT015-EFFECTIVE-TAME-PATH-FINITENESS"
    statement: >-
      On finitely many rational path pieces, every relevant minor is a rational
      function p(t)/q(t). After denominator-zero events are split off, each
      nonzero numerator has finitely many roots; exact root isolation orders
      their union. For effectively encoded semialgebraic pieces, exact cell
      decomposition gives finitely many point and interval cells. Oriented
      matroid data are constant on cells with fixed signs of all relevant
      minors, fixed rank, and no zero columns.
    persistent_zero_case: >-
      An identically zero relevant minor is not an isolated event. It must be
      recorded as a persistent wall cell and stratified by the remaining minors,
      or the path piece must be excluded by the declared isolated-root domain.
      It cannot be silently counted as one wall.
    proof_outline:
      - "There are finitely many path pieces and finitely many column minors."
      - "A nonzero one-variable polynomial has finitely many roots, and the admitted exact representation isolates and orders them."
      - "Chirotope/minor signs plus rank and zero-column data determine the realizable oriented-matroid stratum."
      - "Finite semialgebraic cell decomposition handles point and interval zero sets when that effective representation is admitted."
  exact_rt014_control: "v_4(t)=(1,1,t), -1<=t<=1, has one isolated wall t=0 and covector/tope counts 51/14, 39/12, 51/14 at t=-1,0,1."
  source_dynamics_selected: false
  finite_variation_robustness_established: false
  defect_in_fixed_restricted_claim_detected: false

exact_domain_audit:
  adopted_repair_id: "BR-03-ADEQUATE-EXACT-DECISION-DOMAIN"
  adequate_reading: "Every admitted field or representation supports all decisions actually invoked: sign, rank, homogeneous linear feasibility, and admitted-path root isolation and ordering."
  generic_ordered_field_without_algorithms_admitted: false
  fixture_field: "Q"
  physical_or_empirical_field_selection_detected: false
  ontology_field_derivation_detected: false
  conclusion: >-
    Exactness prevents numerical branch or wall ambiguity; it does not make the
    chosen field a physical primitive. An ineffective ordered field or a path
    representation lacking the declared decision procedures lies outside the
    fixed candidate domain rather than receiving an invented result.

sector_refinement_and_status_nonselection:
  sector_nonselection: >-
    Bridge_OM is total on any admitted finite configuration but supplies no law
    choosing S, no P7 completeness theorem, and no reason to identify fixture
    sectors with matter sectors.
  orientation_nonselection: >-
    The exact reorientation family proves that branch identity depends on an
    input orientation. The construction audits, but does not select, that input.
  provenance_nonselection: >-
    Provenance labels are required and disclosed, yet the oriented-matroid maps
    do not validate the truth, completeness, or ontology origin of those labels.
  refinement_nonselection: >-
    Ref proves natural maps for a declared finite inclusion. It does not choose a
    preferred refinement tower, establish convergence, or guarantee branch
    preservation when new sectors are added.
  path_nonselection: >-
    A finite tame family is an analysis domain selected before evaluation, not
    a source equation of motion, perturbation law, or robustness ensemble.
  fixture_nonselection: >-
    Feasible, obstructed, reoriented, presentation, refinement, and wall fixtures
    are transparently engineered conformance controls. Because both branches are
    exercised and neither is promoted, they are not empirical calibration or
    source evidence.
  status_nonselection: >-
    Registered-source, validator-PASS, checkpoint, role, handoff, and route
    labels provide provenance and workflow control only. None enters A, Cstar,
    Cir_plus, Tot, Ref, or Strat, and none supplies theorem, physical, empirical,
    adoption, or Gate authority.

