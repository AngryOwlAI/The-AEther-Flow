no_fog_explanation: >-
  The fixed RT014 bridge contains no target atlas, metric, empirical answer,
  physical cone, frozen-route object, or workflow-status premise, and all of its
  conditional oriented-matroid mathematics survives at arbitrary finite rank.
  Nevertheless the registered theorem domain itself imposes rank(A)<=4, with
  no independent source derivation and no explicit nonphysical computation or
  conformance-budget rationale. The general-rank proof and exact rank-five and
  rank-six controls show that the ceiling is unnecessary, while the unexplained
  value four is target-shaped in a GR project. Transparency does not cure that
  source-purity defect. The narrow repair is to state the domain at every finite
  rank and retain |C|<=rank(A)+1, without changing any other mathematics or
  granting physical, empirical, adoption, or promotion authority.

