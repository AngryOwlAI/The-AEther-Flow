  component_type: "source scalar"
  finite_jet_order_available: 1
  dynamics_defined_here: false

type_and_domain_table:
  - object: "U"
    domain: "object of Open(A)"
    codomain: "source-open subset of A"
    regularity: "open"
    status: "source domain only"
  - object: "E_B1|U"
    domain: "U"
    codomain: "U x R^6"
    regularity: "smooth trivial bundle"
    status: "proposal-only"
  - object: "q"
    domain: "U"
    codomain: "R^6"
    regularity: "C2"
    status: "local section"
  - object: "rho_i=q^i/q^6, i=1,2"
    domain: "U_reg(q)"
    codomain: "R"
