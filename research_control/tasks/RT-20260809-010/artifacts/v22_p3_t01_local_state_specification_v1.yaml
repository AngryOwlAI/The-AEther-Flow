    codomain: "C2(U,(0,1)^2)"
    regularity: "C1 as a local map of section spaces"
    status: "source-response map; not geometry"

restriction_law:
  map_symbol: "res_UV:Q_B1(U)->Q_B1(V)"
  condition: "V subset U"
  formula: "res_UV(q)=q|V componentwise"
  identity: "res_UU=id"
  composition: "res_VW o res_UV = res_UW for W subset V subset U"
  observable_naturality: "rho_i(q)|V=rho_i(q|V), p_i(q)|V=p_i(q|V) wherever q6 is nonzero"

gluing_law:
  cover: "U=union_i U_i by source-open sets"
  compatibility: "q_i|U_i_intersect_U_j=q_j|U_i_intersect_U_j componentwise for every i,j"
  result: "there is a unique q in Q_B1(U) with q|U_i=q_i"
  transition_rule: "identity in the fixed R6 fiber; source-chart coordinate representatives transform as six scalars"
  cocycle: "identity transition maps obey g_ii=id and g_ij g_jk=g_ik"
  target_coordinate_use: false
  regular_subdomain_gluing: "If every q_i has q_i^6 nonzero and d rho_1 wedge d rho_2 nonzero, compatibility gives a unique glued section with the same pointwise regularity."

regular_operational_subdomain:
  symbol: "Q_reg(U)"
  definition: "sections q in Q_B1(U) with q6(x) nonzero and (d rho1 wedge d rho2)(x) nonzero for every x in U"
  restriction_stable: true
  gluing_stable_under_compatible_regular_cover: true
  singular_strata:
    - "S_den={x:q6(x)=0}"
    - "S_rank={x:d rho1 wedge d rho2=0}"
  disposition: "Base sections may exist on singular strata, but the two-channel operational map is undefined or rank-deficient there; no regularization is inferred."

admissible_variations:
  tangent_symbol: "V_q(U;B)=Gamma_C2,c(U,E_B1) with declared boundary trace conditions"
  variation: "delta q=(delta q1,...,delta q6)"
  support: "compact in the interior of the chosen source patch unless boundary data are explicitly released"
  boundary_preserving_conditions:
    - "i_B^*(delta q)=0"
    - "i_B^*(d delta q)=0"
  regularity_preservation: "For each relatively compact V subset U_reg(q), sufficiently small C1 variations remain in Q_reg(V)."
  no_metric_norm_claimed: true
  independent_response_witnesses:
    - witness_id: "VAR-B1-01"
      definition: "delta_1 q1=chi q6 and all other components zero"
      condition: "chi is C2 compactly supported with chi(x0)=1"
      response_at_x0: "delta_1(rho1,rho2)=(1,0)"
    - witness_id: "VAR-B1-02"
      definition: "delta_2 q2=chi q6 and all other components zero"
      condition: "the same type of C2 compactly supported chi has chi(x0)=1"
      response_at_x0: "delta_2(rho1,rho2)=(0,1)"
  response_rank: 2

boundary_data:
  source_pair: "(U,B) with B embedded as a declared closed source hypersurface or patch-boundary stratum and inclusion i_B:B->closure(U)"
  dirichlet_trace: "i_B^*q"
  first_jet_trace: "i_B^*(dq), containing tangential source derivatives only"
  compatibility_on_overlaps: "boundary traces agree wherever boundary charts overlap"
  excluded_imports:
    - "unit normal"
    - "normal derivative"
    - "induced metric"
    - "boundary measure"
    - "causal boundary"
  dynamics_role: "P3-T02 must decide which declared traces are actually admissible for a source law."

source_symmetry_and_equivalence:
  passive_groupoid: "the source-chart transition pseudogroup of A"
  action: "For a source reparametrization phi, local scalar representatives act by pullback q -> phi^*q; rho_i, p_i, and d rho_i act by the corresponding pullback."
  equivalence: "Two chart records are equivalent exactly when they represent the same abstract section q and its natural tensors on their common source domain."
  restriction_naturality: "res(phi^*q)=phi^*(res(q)) on every common restricted domain"
  internal_gauge_assumed: false
  active_dynamical_symmetry_assumed: false
  target_diffeomorphism_or_target_gauge_claimed: false

