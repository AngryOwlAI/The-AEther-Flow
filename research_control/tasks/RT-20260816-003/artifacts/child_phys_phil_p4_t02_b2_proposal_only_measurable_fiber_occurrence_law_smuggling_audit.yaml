coupling_nonuniqueness_analysis:
  per_component_iid_status: "not_admitted_as_a_full_naturality_control"
  per_component_iid_failure: "An open restriction can split one connected component into several components. Assigning fresh IID drivers per restricted component does not equal the pushforward of the single driver assigned before restriction, so component-indexed IID sampling fails full Open-inclusion naturality."
  natural_alternative: "Assign one global formal flip driver B_s to each token value s in S, unused when that token class is absent, rather than one driver per connected component; define y(u)=x(u) XOR B_{x(u)}. Restrictions preserve the original token value pointwise, so this construction commutes with every admitted open restriction."
  token_class_marginal: "For each s, P(B_s=stay)=p and P(B_s=flip)=1-p."
  shared_driver_joint_law: "P(B_0=S,B_1=S)=p, P(S,F)=0, P(F,S)=0, P(F,F)=1-p."
  independent_token_class_joint_law: "P(S,S)=p^2, P(S,F)=p(1-p), P(F,S)=p(1-p), P(F,F)=(1-p)^2."
  symmetric_token_class_coupling_family: "For max(0,2p-1)<=a<=p, set P(S,S)=a, P(S,F)=P(F,S)=p-a, and P(F,F)=1-2p+a."
  naturality_proof: "For any restriction r, r(y)(v)=x(r(v)) XOR B_{x(r(v))}=(r(x))(v) XOR B_{(r(x))(v)}. Exchange-symmetry of the joint law under B_0<->B_1 also gives token-swap equivariance."
  constant_section_result: "Every token-class coupling coincides with K_p on a constant section because only one B_s is used."
  mixed_section_result: "For a section containing both tokens, a=p gives the shared K_p support {x,c(x)}, while a<p permits additional constant-token outputs and therefore a distinct natural kernel."
  exact_result: "Full restriction naturality removes naive component-indexed IID coupling but does not select the shared driver: the token-class a-family is fully restriction-natural, token-swap equivariant, agrees on constant-section marginals, and differs on mixed sections."
  source_consequence: "The global shared driver is source-pure as a disclosed proposal choice but is not independently source-derived or epistemically selected."
  falsifier: "Derive a unique a=p from the fixed local kernel, cover overlaps, and admitted arrows without an added joint-coupling axiom."

