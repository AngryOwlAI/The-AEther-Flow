coupling_nonselection_theorems:
  disconnected_control:
    base_open: "O=A disjoint_union B with A and B nonempty and connected"
    section: "x=(0,1)"
    parameter: "p in (0,1)"
  shared_global_coupling:
    formula: "J_shared_p(x)=p delta_(0,1)+(1-p)delta_(1,0)"
    first_component_marginal: "p delta_0+(1-p)delta_1"
    second_component_marginal: "p delta_1+(1-p)delta_0"
    full_open_restriction_naturality: true
  componentwise_independent_countercontrol:
    formula: "J_component_p(x)=p^2 delta_(0,1)+p(1-p)delta_(0,0)+p(1-p)delta_(1,1)+(1-p)^2 delta_(1,0)"
    component_marginals_equal_shared: true
    joint_law_distinct_from_shared: true
    mixed_outcome_mass: "2p(1-p)>0"
    natural_on_component_preserving_subcategory: true
    full_open_restriction_naturality: false
    failure_proof: "Start with a constant section on a connected open O and restrict to a disconnected U. Pushforward of the one-component independent law has one shared bit and supports only the constant section and its complement, whereas freshly independent bits on the two components put positive mass p(1-p) on each mixed state."
    role_in_audit: "Invalid as a full replacement natural kernel, but a valid disjoint-cover marginal-coupling nonuniqueness control."
  token_class_independent_natural_coupling:
    driver_definition: "Sample independent stay-or-flip bits B_0 and B_1 with stay weight p, and apply B_s to every point whose input token equals s."
    general_formula: "J_token_p(x)=p^2 delta_x+(1-p)^2 delta_c(x)+p(1-p)delta_const0+p(1-p)delta_const1, combining coincident atoms."
    disconnected_formula: "For x=(0,1), the four weights on (0,1),(0,0),(1,1),(1,0) are p^2,p(1-p),p(1-p),(1-p)^2."
    component_marginals_equal_shared: true
    joint_law_distinct_from_shared: true
    full_open_restriction_naturality: true
    source_diffeomorphism_natural: true
    token_swap_equivariant: true
    restriction_proof: "Restriction only removes input points and possibly an unused token class. The output on the subopen depends on the same B_s for token values still present; integrating an unused independent bit leaves exactly the token-class law defined on the restricted section."
    source_diffeomorphism_naturality: "A source diffeomorphism transports points but preserves their token values, so it commutes with the token-indexed drivers."
    token_swap_equivariance: "Global complement swaps B_0 and B_1; their identical independent law is invariant under that swap."
    constant_section_limit: "If x contains one token value, the two unused-bit atoms combine and J_token_p(x)=J_shared_p(x)."
  exact_nonselection_conclusion: "Even full restriction naturality, source-diffeomorphism naturality, token-swap equivariance, and all token-homogeneous local marginals do not select the globally shared coupling. The fixed shared rule is mathematically correct but is a disclosed new correlation primitive."
