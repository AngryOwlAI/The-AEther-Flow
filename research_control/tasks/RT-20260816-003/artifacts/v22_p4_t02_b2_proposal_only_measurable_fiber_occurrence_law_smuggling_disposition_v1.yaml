new_mathematical_payload:
  - payload_id: "NMP-RT016-003-001"
    payload_type: "coupling_nonuniqueness_theorem"
    name: "Shared-global versus token-class natural coupling nonuniqueness"
    summary: "A shared Bernoulli flip and a Bernoulli driver indexed by token value are both restriction-natural and complement-equivariant, agree on every constant one-component marginal, but differ on mixed-token sections."
    falsifier: "A source-derived axiom forcing equality of every admissible joint law would overturn this nonuniqueness."
  - payload_id: "NMP-RT016-003-002"
    payload_type: "countermodel"
    name: "Componentwise-independent coupling restriction failure"
    summary: "Independent flips per connected component have the same one-component marginals as the shared law but fail naturality when one connected open restricts to a disconnected subopen."
    falsifier: "Restricting the arrow category to component-preserving maps would repair this law but would add a separately justified arrow restriction."
  - payload_id: "NMP-RT016-003-003"
    payload_type: "stationarity_nonselection_theorem"
    name: "Uniform stationary law does not identify p"
    summary: "The uniform law on each two-point complement orbit is stationary for all p in (0,1), so p=1/3 and p=2/3 share stationary data while defining distinct kernels."
    falsifier: "A source-derived asymmetric stationary observable or dynamical rate calibration could distinguish p but is absent."
  - payload_id: "NMP-RT016-003-004"
    payload_type: "occurrence_nonselection_lemma"
    name: "Kernel without initial law or realization selects no occurrence"
    summary: "K_p specifies conditional one-step weights only; delta_0 K_p and delta_1 K_p differ, and no sample realization follows from the abstract kernel."
    falsifier: "An independently sourced initial law and sampling or realization map would define stronger occurrence semantics."
  - payload_id: "NMP-RT016-003-005"
    payload_type: "clock_nonselection_lemma"
    name: "Positive generator-rate rescaling leaves formal transitions underdetermined"
    summary: "Replacing L_p by a L_p for a>0 changes any time scale while retaining the same fixed points and transition support, so the one-step generator supplies no physical clock normalization."
    falsifier: "A current-source clock standard fixing a would remove this freedom."
  - payload_id: "NMP-RT016-003-006"
    payload_type: "metric_scope_lemma"
    name: "Empty-open total-variation degeneration"
    summary: "On nonempty complement orbits d_TV(K_p,K_q)=|p-q|, while the unique empty-open section is complement-fixed and both kernels equal the same Dirac law, giving distance zero."
    falsifier: "A nontrivial empty-open fiber would change the domain and is not part of the fixed candidate."

