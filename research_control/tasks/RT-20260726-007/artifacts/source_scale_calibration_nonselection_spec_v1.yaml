theorems:
  - theorem_id: "P6T04-THM-CONDITIONAL-VOLUME-GAUGE"
    claim: "Given an independent four-dimensional Lorentzian conformal class and a positive density there is a unique representative with that absolute metric volume density."
    hypotheses:
      - "a Lorentzian conformal class [g] is independently available"
      - "mu is a smooth positive density"
    formula: "Omega=(mu/|vol_g|)^(1/4)"
    burden_effect: "conditionally fixes Weyl scale but not conformal shape or physical units"
  - theorem_id: "P6T04-THM-UNIMODULAR-DENSITY-CONE-ROD-NONSELECTION"
    claim: "The g_a family has identical D_1 and volume density but pairwise nonconformal members with different null cones and rod lengths."
    witness_family: "g_a=-ds^2+exp(2a)(dy1)^2+exp(-2a)(dy2)^2+(dy3)^2"
    determinant: "-1"
    burden_effect: "proves fixed-density conformal-shape and rod nonselection"
  - theorem_id: "P6T04-PROP-CLOCK-REPARAMETERIZATION"
    claim: "Absolute phase rates rescale under V_f=fV while relative phase-rate ratios remain invariant."
    transformation: "V_f(theta_A)=f V(theta_A)"
    invariant: "R_AB=V(theta_A)/V(theta_B)"
    burden_effect: "permits relative cycle agreement but not absolute time calibration"

