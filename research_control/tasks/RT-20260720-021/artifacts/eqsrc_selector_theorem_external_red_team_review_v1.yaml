claim_under_review: "For a fixed small groupoid and fixed Set-valued eligible-choice functor with supplied component coordinates, deterministic total point-valued natural selectors are classified by the product of automorphism fixed loci; selector-induced relation-image uniqueness and full-category extension claims hold only under their explicit additional hypotheses."
assumptions_read:
  - "The review domain is a fixed small groupoid and its component set is a set."
  - "The eligible-choice assignment is a fixed covariant Set-valued functor."
  - "One representative and transport to every object are supplied as proof coordinates."
  - "A product element rather than factorwise nonemptiness alone is required for arbitrary global existence."
  - "Relation-image claims require a supplied functor E and natural transformation K."
  - "Full-category claims require a separately supplied extension over noninvertible arrows."
  - "Selectors are deterministic total and point-valued on the fixed domain."
  - "Objects arrows eligibility actions and K are fixed before selector evaluation."
  - "Structural automorphisms carry no assumed physical-gauge semantics."
  - "All category selector coordinate and extension data remain proposal inputs rather than ontology-derived objects."
definitions_read:
  - "component set representatives and certified transports"
  - "automorphism groups H_i"
  - "fixed loci F_i"
  - "selector space Nat(1_G,S)"
  - "natural transformation K and induced map K_*"
  - "coordinate image sets R_i"
  - "conditional full-category extension and naturality equalizer"
proof_steps_checked:
  - "Naturality at representative automorphisms places evaluation values in fixed loci."
  - "Conjugating any groupoid arrow by supplied transports produces a representative automorphism."
  - "Fixedness removes that automorphism and proves reconstructed-family naturality."
  - "Identity transports and naturality along transports prove the two constructions inverse."
  - "Empty singleton and multiple-selector consequences follow from the product bijection with the stated complementary-product guard."
  - "The choice-sensitive existence converse is separated from factorwise nonemptiness."
  - "Naturality of K makes K composed with a selector a natural section."
  - "A baseline selector supplies complementary coordinates for the relation-image converse."
  - "Wideness makes restriction of natural transformations injective because object components are retained."
  - "The displayed equations are exactly the additional naturality requirements for noninvertible arrows."
