notation_overload_findings:
  - "Define 1_G explicitly as the constant singleton functor to remove component-map versus selected-point ambiguity."
  - "Keep R_i=K_{r_i}(F_i) and im K_* distinct from any unqualified raw K(D)."
  - "Keep an action kernel distinct from an individual point stabilizer."
  - "Calling E-elements relation sections supplies no physical relation or detector semantics."
unproven_equivalence_findings:
  - "Structural automorphism invariance is not equivalent here to physical gauge or empirical indistinguishability."
  - "A singleton im K_* is not equivalent to a singleton Nat(1_G,E) because K_* need not be surjective."
  - "The coordinate image sets are not proved to assemble as a product description of im K_* for arbitrary infinite families."
  - "The bounded one-object Lean fragment is not equivalent to a formal proof of the multi-component K-image or full-category claims."
