raw_boundary_case_findings:
  - case: 1
    assessment: "Consistent. Quotienting by an action kernel preserves the effective action and hence preserves the empty fixed locus in this example."
  - case: 2
    assessment: "Out of scope. A partial map is neither a total Set map nor an invertible groupoid arrow, so it cannot refute Claims 1 or 2 and does not instantiate Claim 3 as written."
  - case: 3
    assessment: "Confirms the complementary-product qualification: profiles (2,0) and (2,1) yield zero and two global tuples."
  - case: 4
    assessment: "Changing from points to probability distributions can create an invariant value where no invariant point exists. The abstract classification still applies to the new functor, but point-valued obstruction conclusions do not transfer unchanged."
  - case: 5
    assessment: "Adding a mark changes the proposal signature, eligible set, and admitted automorphisms; the new fixed point is not a counterexample to the original fixed inputs."
  - case: 6
    assessment: "Restricting from G to a subgroup H can enlarge the fixed locus, while quotienting by a kernel that already acts trivially preserves it. Results must be recomputed after the variation group changes."

scope_overread_findings:
  - "Claim 1 classifies deterministic total point-valued selectors only; it does not rule out invariant probability-valued selectors."
  - "Claim 2 proves uniqueness only inside im(K_*), not uniqueness of every natural E-section and not a physical relation unless relation semantics are separately supplied."
  - "Claim 3 gives a conditional equalizer after an extension is supplied; it neither proves that an extension exists nor selects one."
  - "The theorem supplies no ontology, physical gauge, detector, metric, coupling, Einstein-equation, exact-GR, benchmark, adoption, or publication conclusion."
  - "Altered source marks, admitted variation groups, codomains, or partial-arrow semantics define different problems and cannot be used to strengthen or refute the fixed-input theorem without an explicit assumption delta."

