assumptions_read:
  - id: "A01"
    reading: "The review domain is a fixed small wide groupoid of certified isomorphisms."
  - id: "A02"
    reading: "The eligible-choice assignment and arrow actions are supplied as a fixed covariant Set-valued functor S."
  - id: "A03"
    reading: "Component representatives and transports are supplied proof coordinates, not physical or source marks."
  - id: "A04"
    reading: "The converse from factorwise nonemptiness to a product element is qualified by finiteness, a supplied tuple, or an explicit choice principle."
  - id: "A05"
    reading: "K-image claims are conditional on a supplied Set-valued functor E and natural transformation K from S to E."
  - id: "A06"
    reading: "Full-category claims are conditional on a supplied functor extension over all noninvertible arrows."
  - id: "A07"
    reading: "Selectors are deterministic, total on the declared domain, and point-valued."
  - id: "A08"
    reading: "The signature, eligibility, actions, and K are held fixed before existence or uniqueness is evaluated."
  - id: "A09"
    reading: "Automorphisms are structural proposal symmetries; physical-gauge meaning is not assumed."
  - id: "A10"
    reading: "All category, functor, K, selector-coordinate, and extension data are proposal inputs rather than ontology-derived objects."

definitions_read:
  - "I as the component set pi_0(G), with representatives r_i and transports tau_X"
  - "H_i as Aut_G(r_i) and F_i as the H_i-fixed subset of S(r_i)"
  - "Sel(G) as Nat(1_G, S), interpreted componentwise as selected points"
  - "K_* as postcomposition of a selector with K"
  - "R_i as the coordinate image K_{r_i}(F_i)"
  - "The conditional full-category extension S_bar on a category C with wide core G"

proof_steps_checked:
  - step: "Typing of selectors and evaluation"
    status: "passes"
    finding: "With 1_G understood as the constant singleton functor, each component of a natural transformation is equivalently a point of S(X), and evaluation at r_i is well typed."
  - step: "Evaluation lands in fixed loci"
    status: "passes"
    finding: "Naturality at every h in H_i gives S(h)(sigma_{r_i}) = sigma_{r_i}."
  - step: "Tuple reconstruction and naturality"
    status: "passes"
    finding: "For f:X->Y in one component, a=tau_Y^{-1} f tau_X is an automorphism of r_i; H_i-fixity removes a and proves naturality. No connectedness across distinct components is assumed."
  - step: "Mutual inverse"
    status: "passes"
    finding: "Identity transport at representatives recovers each tuple coordinate, while naturality at tau_X recovers every selector component."
  - step: "Product existence and cardinality consequences"
    status: "passes"
    finding: "The empty, singleton, and at-least-two statements follow from the bijection. The nonempty-factor converse is correctly qualified by availability of a product tuple; the classification itself uses no global choice function."
  - step: "Claim 2, singleton coordinate images imply singleton global image"
    status: "passes"
    finding: "Equality of K-images at representatives propagates to all objects by naturality of K and the supplied transports."
  - step: "Claim 2, non-singleton coordinate image implies non-singleton global image"
    status: "passes"
    finding: "The assumed baseline selector supplies every complementary coordinate, so replacing one coordinate is legitimate and yields distinct induced K-sections."
  - step: "Claim 3 restriction injectivity"
    status: "passes_with_typing_guard"
    finding: "Wideness gives the same objects, so natural transformations are determined by their components. The word extension should mean S_bar restricted to G equals S, or a specified comparison isomorphism must be inserted."
  - step: "Claim 3 equalizer characterization"
    status: "passes"
    finding: "Core naturality is exactly Claim 1, and the displayed equations are exactly the additional naturality conditions for all arrows of C. No unsupplied extension is inferred."
  - step: "Bounded formalization relevance"
    status: "properly_scoped"
    finding: "The stated one-object finite-group capsule is not evidence for the multi-component, K-image, full-category, ontology, or physical-semantic claims."

