scope_overread_findings:
  - id: "SCOPE-01"
    topic: "structural_automorphism_vs_physical_gauge"
    finding: "The proof establishes naturality under the chosen proposal core only. It supplies no physical state space, quotient, observable algebra, empirical equivalence relation, or argument that the admitted automorphisms are gauge redundancies."
  - id: "SCOPE-02"
    topic: "proposal_input_laundering"
    finding: "G, S, eligibility, actions, E, K, coordinates, and any S_bar extension are inputs. The theorem conditionally classifies selectors for those inputs; it does not derive the eligibility rule, a selector law, a source law, or the admitted variation group from ontology. Tailoring those inputs to a desired output and then calling the result derived would be circular, but that circular step is not present in the supplied proof."
  - id: "SCOPE-03"
    topic: "K_image_overreach"
    finding: "Claim 2 establishes uniqueness only within im K_*, among K-sections induced by existing selectors. It establishes neither uniqueness of every E-section nor surjectivity, injectivity, empirical adequacy, detector semantics, or ontology-level relation uniqueness."
  - id: "SCOPE-04"
    topic: "coordinate_dependence"
    finding: "Representatives and transports give a noncanonical product presentation. Selector existence and cardinality are invariant, but the chosen coordinates are not source marks and cannot be promoted to physical structure."
  - id: "SCOPE-05"
    topic: "formalization_authority"
    finding: "The bounded Lean fragment can support only its encoded one-object finite-group statements and cannot be cited as proof authority for the full theorem, semantics, or ontology."
  - id: "SCOPE-06"
    topic: "clean_review_authority"
    finding: "A clean verdict here means only that the stated conditional mathematics survived this internal blinded review. It is not adoption, external replication, publication authority, Gate Chair authority, or proof of any physical theory."

altered_domain_scope:
  probabilistic:
    conclusion: "Deterministic fixed-point conclusions do not transfer unchanged."
    detail: "Replacing points by probability measures defines a different functor. A cyclic three-point action has no invariant point but does have an invariant uniform distribution. A groupoid fixed-object classification may be rerun for a precisely defined probability functor, but it would classify invariant distributions, not deterministic selectors."
  partial_arrows:
    conclusion: "Claim 1 no longer applies as stated."
    detail: "A partial function is not a morphism in Set and need not be invertible. It requires a category of partial maps or explicit domain data; Claim 3 also requires a correspondingly typed extension and altered naturality equations."
  source_marks:
    conclusion: "Marks change the signature and generally change the automorphism group and fixed loci."
    detail: "A selector created after restricting to mark-preserving automorphisms is conditional on the supplied mark. It is not a selector law derived from the unmarked ontology, and the proof coordinates tau_X are not such marks."
  variation_domain:
    conclusion: "Existence and multiplicity are relative to the admitted automorphism group."
    detail: "For H contained in G on a fixed carrier, D^G is contained in D^H. Restricting variation can create selectors; enlarging variation can destroy them. No physical principle selecting the variation domain is derived here."

