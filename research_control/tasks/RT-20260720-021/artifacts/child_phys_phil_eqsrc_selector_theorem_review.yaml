notation_overload_findings:
  - id: "NOT-01"
    severity: "scope_guard"
    finding: "R_i=K_{r_i}(F_i) is a coordinate image and im K_* is a set of global natural sections induced by selectors. Neither is an unqualified raw K(D), and they must not be conflated."
  - id: "NOT-02"
    severity: "scope_guard"
    finding: "An action kernel is the subgroup acting trivially on the entire carrier; an individual point stabilizer fixes only that point. The raw boundary example uses the former, not the latter."
  - id: "NOT-03"
    severity: "semantic_clarity"
    finding: "Calling E-elements or K-images relations adds no mathematical relation or detector semantics. In the theorem they are only elements and natural sections of a supplied Set-valued functor."

unproven_equivalence_findings:
  - id: "EQ-01"
    finding: "Structural automorphism invariance is not shown equivalent to physical gauge invariance, physical covariance, or empirical indistinguishability."
  - id: "EQ-02"
    finding: "A singleton im K_* is not shown equivalent to a singleton Nat(1_G,E), because K_* need not be surjective."
  - id: "EQ-03"
    finding: "Coordinatewise image sets R_i are not shown to assemble as im K_*=product_i R_i for arbitrary infinite families; the packet correctly withholds that equivalence."
  - id: "EQ-04"
    finding: "A bounded one-object Lean fragment is not equivalent to formal verification of the full theorem package."

minimal_countermodel_attempt:
  objective: "Attempt to falsify Claims 1-3 while retaining A01-A10, deterministic total point-valued selectors, and all conditionally required data."
  construction:
    category: "Let C have one object and endomorphism monoid {1,g,z}, with g^2=1 and z absorbing. Its wide core G has the units {1,g}."
    selector_functor: "Let S_bar(*)={0,1}, with S_bar(1)=S_bar(g)=identity and S_bar(z) the constant map to 0. Let S be the restriction to G."
    coordinates: "Take I={i}, r_i=*, tau_*=1, H_i={1,g}, and hence F_i={0,1}."
    image_data: "Let E be the constant singleton functor on G and K:S=>E the unique natural transformation, so R_i is a singleton."
    semantic_assignment: "Treat G, S, E, K, the coordinates, and S_bar as fixed proposal inputs; assign no physical-gauge or ontology-derived meaning."
  checks:
    - "Claim 1 predicts two core selectors, and the two point choices 0 and 1 are exactly the natural selectors."
    - "Claim 2 predicts singleton im K_*, and both selectors map to the same singleton E-section."
    - "Claim 3 predicts that the z-equalizer retains only x=0, and Nat(1_C,S_bar) indeed has exactly that selector."
  result: "No countermodel to the stated conditional claims was obtained. The construction instead supplies a minimal countermodel to the unclaimed overread that every core selector extends to the full category: the core has two selectors while the full category has one."

