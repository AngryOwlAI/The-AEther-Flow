source_side_definition: "On the full source realization/state space, formalize an independently source-provenanced transition relation or semiflow, an admissible-domain predicate fixed before outcome evaluation, a positive barrier or viability certificate, and an occurrence/component selector; prove a source-side forward-invariance and selection theorem or return the smallest exact missing primitive or countermodel."

formal_domains:
  source_state_domain: "A declared exact source-state/realization space X_src retaining the quantitative data needed by the source equations; no quotient by Bridge_OM outputs and no target manifold."
  source_transition_domain: "A relation R_src subset X_src x X_src or semiflow Phi_src derived from current source equations or explicitly labeled proposal-only source-extension data."
  admissible_domain: "A source-side subset U_src fixed before evaluation by exact source predicates; desired target cones, empirical response, and benchmark behavior are forbidden selectors."
  barrier_domain: "An ordered exact field K and a source scalar b_src:X_src->K with U_src={x:b_src(x)>0}, or a precise obstruction to such a global representation."
  viability_domain: "All R_src trajectories or allowed one-step successors from one source state; nondeterminism must be quantified universally rather than success-filtered."
  occurrence_domain: "A source occurrence/initial-data law O_src selecting a state or a unique invariant component independently of desired P4-T02 success."
  covariance_domain: "Only source transformations already justified by EqSrc or explicitly proposal-only candidate intertwiners; presentation arrows are not automatically physical gauge."
  exact_input_class: "Finite rational/algebraic controls and exact symbolic predicates with decidable sign and transition checks, plus a precise non-decidability failure branch."
  excluded_inputs:
    - "shared tau, Q_ray, midpoint plane, common character, anchor, cochain, or holonomy-protection law"
    - "Bridge_OM sign/circuit/total/refinement/path components used as a standalone selector"
    - "target atlas, metric, tetrad, coframe, desired GR cone, proper time, physical normalization, empirical response calibration, or benchmark answer"
    - "registry, validation, role, checkpoint, or workflow status treated as source evidence"

formal_objects:
  - object_id: "FULL-SOURCE-STATE-SPACE"
    notation: "X_src"
    definition: "The exact proposal domain of source states and quantitative realizations on which source evolution and admissibility are typed."
  - object_id: "SOURCE-TRANSITION-LAW"
    notation: "R_src or Phi_src"
    definition: "The source-derived or proposal-only admissible successor relation; it is not inferred from wall avoidance or desired physical output."
  - object_id: "SOURCE-ADMISSIBLE-DOMAIN"
    notation: "U_src"
    definition: "A predeclared source-predicate domain whose membership is independent of target geometry and benchmark success."
  - object_id: "SOURCE-BARRIER"
    notation: "b_src"
    definition: "An exact scalar certificate with positive superlevel U_src and a transition inequality establishing forward invariance."
  - object_id: "VIABILITY-KERNEL"
    notation: "Viab_{R_src}(U_src)"
    definition: "States whose every admitted source evolution stays inside U_src for all admitted future steps."
  - object_id: "OCCURRENCE-OR-COMPONENT-SELECTOR"
    notation: "O_src or Sel_src"
    definition: "An independently source-provenanced law selecting initial data or one invariant viable component without goal filtering."
  - object_id: "DIAGNOSTIC-ONLY-BRIDGE-READOUT"
    notation: "Diag_OM"
    definition: "Optional evaluation of already-valid Bridge_OM components on selected source states solely as diagnostics; it has no occurrence, stability, physical, or empirical authority."

formal_maps:
  - map_id: "SOURCE-EVOLUTION"
    signature: "Phi_src:T x X_src -> X_src or R_src:X_src -> P(X_src)"
    obligation: "Prove typing, composition/closure, source provenance, and covariance without selecting paths by desired output."
  - map_id: "BARRIER-EVALUATION"
    signature: "b_src:X_src -> K"
    obligation: "Define its source-side provenance and prove U_src={b_src>0} on the declared domain."
  - map_id: "BARRIER-PROPAGATION"
    signature: "x |-> inf_{y in R_src(x)} b_src(y)"
    obligation: "Prove an exact lower bound inf b_src(y) >= lambda b_src(x) with lambda>0 or return a countermodel."
  - map_id: "VIABILITY-CONSTRUCTION"
    signature: "Viab_{R_src}:P(X_src)->P(X_src)"
    obligation: "Quantify over every admitted successor and prove forward invariance without ignoring wall-crossing branches."
  - map_id: "SOURCE-COMPONENT-SELECTION"
    signature: "Sel_src:(R_src,U_src,O_src)->C_star or precise_obstruction"
    obligation: "Prove existence and uniqueness of a selected viable component from source premises alone; multiple components fail closed."
  - map_id: "DIAGNOSTIC-EVALUATION"
    signature: "Diag_OM:X_src->Bridge_OM outputs"
    obligation: "Keep the frozen classifier diagnostic-only and prove that selection does not factor through its noninjective named components."

theorem_targets:
  - theorem_id: "THM-SOURCE-BARRIER-VIABILITY"
    statement: "If b_src(x)>0 and every admitted successor y satisfies b_src(y)>=lambda b_src(x) for one lambda>0, then every finite admitted trajectory remains in U_src and satisfies b_src(x_n)>=lambda^n b_src(x_0)>0."
    status: "future_proof_required"
  - theorem_id: "THM-OCCURRENCE-STABILITY-SEPARATION"
    statement: "A viability/barrier law without O_src selects no realized component, while an occurrence law without a viability condition does not protect the selected state from leaving U_src; the two primitives are logically independent."
    status: "future_proof_required"
  - theorem_id: "THM-FROZEN-DIAGNOSTIC-NONFACTORIZATION"
    statement: "A materially distinct selector must use independently source-derived transition or occurrence data and cannot factor only through shared-tau, Q_ray, common-character, or Bridge_OM diagnostic outputs."
    status: "future_proof_required"

proof_obligations:
  - obligation_id: "PO-01-SOURCE-STATE-TYPING"
    statement: "Type X_src and every state/realization component from tracked source-side premises."
  - obligation_id: "PO-02-TRANSITION-PROVENANCE"
    statement: "Derive R_src or Phi_src from current source equations or classify every added clause as proposal-only new ontology primitive data."
  - obligation_id: "PO-03-ADMISSIBLE-DOMAIN-PREDECLARATION"
    statement: "Fix U_src and its predicates before evaluating whether they retain a desired branch; prohibit success-filtered definitions."
  - obligation_id: "PO-04-BARRIER-DEFINITION"
    statement: "Define b_src over an exact ordered domain and prove U_src={b_src>0}, including boundary and singular cases."
  - obligation_id: "PO-05-BARRIER-PROPAGATION-THEOREM"
    statement: "Prove the universal successor inequality and finite-trajectory induction with lambda>0."
  - obligation_id: "PO-06-VIABILITY-NONEMPTINESS"
    statement: "Construct at least one exact viable state or return a minimal countermodel showing the viability kernel is empty."
  - obligation_id: "PO-07-OCCURRENCE-OR-COMPONENT-SELECTION"
    statement: "Derive O_src or prove a unique invariant viable component from source premises; multiplicity without a selector is an obstruction."
  - obligation_id: "PO-08-SOURCE-COVARIANCE"
    statement: "Prove the law and certificates transport under justified source equivalences without promoting presentation arrows to physical gauge."
  - obligation_id: "PO-09-FOUR-FREEZE-INDEPENDENCE"
    statement: "Prove the candidate neither imports nor reconstructs shared-tau, repaired-Q_ray, common-character, or unchanged Bridge_OM selector data."
  - obligation_id: "PO-10-REALIZATION-SENSITIVITY-WITHOUT-TARGET-METRIC"
    statement: "If quantitative realization data are used, identify their source provenance and avoid an arbitrary norm or target-shaped margin."
  - obligation_id: "PO-11-FINITE-AND-CONTINUUM-SCOPE"
    statement: "State the exact finite/local domain and do not infer continuum, global, or all-P7 sector coverage."
  - obligation_id: "PO-12-PHYSICAL-EMPIRICAL-SEPARATION"
    statement: "Keep source viability distinct from physical causality, empirical response, conformal geometry, scale, and g_eff."
  - obligation_id: "PO-13-SOURCE-EXTENSION-CLASSIFICATION"
    statement: "Classify every non-derived primitive and preserve blocked_adoption_open_continuation with no ontology edit or adoption."
  - obligation_id: "PO-14-DECISIVE-FORMALIZATION-OR-FAIL"
    statement: "Return a theorem with explicit hypotheses and proof plus a complete candidate-law packet, or the smallest exact missing primitive/countermodel; obligations-only fog is forbidden."

failure_branches:
  - branch_id: "FB-01-UNTYPED-SOURCE-STATE"
    exact_failure: "X_src or a required state component has no tracked source-side type or provenance."
  - branch_id: "FB-02-NO-SOURCE-TRANSITION-LAW"
    exact_failure: "No R_src or Phi_src is derived or explicitly classified as proposal-only source-extension data."
  - branch_id: "FB-03-GOAL-OR-TARGET-SELECTED-DOMAIN"
    exact_failure: "U_src or b_src is chosen using desired positivity, physical cone, empirical response, target metric, or benchmark behavior."
  - branch_id: "FB-04-BARRIER-REPRESENTATION-FAILURE"
    exact_failure: "U_src cannot be represented by the declared exact barrier and no precise alternative or obstruction is supplied."
  - branch_id: "FB-05-BARRIER-PROPAGATION-FAILURE"
    exact_failure: "An admitted successor violates b_src(y)>=lambda b_src(x) for every lambda>0."
  - branch_id: "FB-06-EMPTY-VIABILITY-KERNEL"
    exact_failure: "Every admitted state has an allowed trajectory leaving U_src."
  - branch_id: "FB-07-NONSELECTION"
    exact_failure: "Multiple viable components or occurrence states remain and no independent source selector distinguishes them."
  - branch_id: "FB-08-SOURCE-COVARIANCE-DEFECT"
    exact_failure: "The candidate depends on source presentation beyond justified source-equivalence transport."
  - branch_id: "FB-09-FROZEN-ROUTE-REPLAY"
    exact_failure: "The formalization imports any object or success restriction from one of the four frozen routes."
  - branch_id: "FB-10-PHYSICAL-OR-EMPIRICAL-OVERREAD"
    exact_failure: "Source viability is called physical causality, calibrated response, universal matter propagation, conformal geometry, scale, or g_eff."
  - branch_id: "FB-11-OBLIGATIONS-ONLY-FOG"
    exact_failure: "The future completion restates missing laws without proving a theorem, constructing a candidate law, or giving a precise obstruction/countermodel."

