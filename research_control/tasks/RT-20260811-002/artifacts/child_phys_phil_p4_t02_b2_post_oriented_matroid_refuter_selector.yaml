new_mathematical_payload:
  - payload_id: "PAYLOAD-RT019-PHIL-REPRESENTATION-OCCURRENCE-SEPARATION"
    payload_type: "lemma"
    object_name: "representation-occurrence separation lemma"
    statement: "For a set X with at least two source realizations, even an injective representation R:X->Y does not by itself supply a distinguished element of X, an occurrence map into X, or an admissible transition relation on X."
    proof: "Take X={x_0,x_1} and R=id_X. The same representation rule is compatible with selecting x_0, selecting x_1, or leaving occurrence unselected, and it contains no ordered-pair subset that declares allowed changes. Injectivity distinguishes states after they are supplied; it does not cause, select, or evolve them."
    philosophical_meaning: "Information retention and explanation are different achievements. This is why Route B cannot answer the RT018 occurrence and variation obstruction merely by preserving more realization data."
    sharp_falsifier: "A source-derived occurrence map O_src and transition relation R_src with independent provenance would supply the missing structures and end the lemma's stated absence condition; no such map is currently established."
    claim_status: "draft/control"
    burden_effect: "narrows"
  - payload_id: "PAYLOAD-RT019-PHIL-SOURCE-VIABILITY-BARRIER-FALSIFIER"
    payload_type: "lemma"
    object_name: "source-dynamical viability barrier lemma and sharp falsifier"
    statement: "If b_src(x_0)>0 and every admitted transition satisfies b_src(x_{n+1})>=lambda*b_src(x_n) for one lambda>0, then b_src(x_n)>=lambda^n*b_src(x_0)>0 for every finite admitted trajectory."
    proof: "Induction on n. The base is given; applying the universal transition inequality to the induction hypothesis supplies the next bound."
    exact_control: "For b(t)=t, lambda=1/3, and F_q(t)=q*t with q in {1/3,1/2,1,2}, all sixteen exact rational samples at t in {1/1000,1/10,1,7/3} satisfy the bound."
    sharp_falsifier: "If the source law admits F_flip(t)=-t, then at t=1/10 the successor has b=-1/10, violating b(F_flip(t))>=lambda*b(t) for every lambda>0. One such admitted transition falsifies the claimed viability theorem."
    epistemic_guard: "The control exhibits a theorem form and falsifier only. It does not derive b(t)=t, lambda, the q-family, or exclusion of F_flip from current ontology. Defining them from the desired Bridge_OM branch would be circular."
    claim_status: "draft/control"
    burden_effect: "selects_next"

