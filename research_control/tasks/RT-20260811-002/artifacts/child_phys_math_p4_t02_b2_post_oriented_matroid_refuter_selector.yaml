new_mathematical_payload:
  payload_id: "THM-V22-P4T02-B2-REACHABILITY-COMPONENT-BRANCH-ROBUSTNESS-001"
  payload_type: "exact_theorem_and_dependency_map"
  title: "Reachability-component criterion for source-side branch robustness"
  definitions:
    - "Let X be any set, E subset X x X a directed one-step relation, and beta:X->B a total diagnostic classifier."
    - "Reach_E(x) is the set of endpoints of all finite E-paths beginning at x, including the length-zero path."
    - "A subset U of X is E-forward-invariant when x in U and x E y imply y in U."
  theorem_statement: "For x in X, beta is robust under every finite admitted E-path from x if and only if beta is constant on Reach_E(x). Equivalently, there exists an E-forward-invariant subset U containing x on which beta is constant. Reach_E(x) is the least such forward-invariant carrier whenever robustness holds."
  proof:
    - "Reach_E(x) contains x and is E-forward-invariant by path concatenation."
    - "If every finite admitted path is branch preserving, every y in Reach_E(x) has beta(y)=beta(x), so beta is constant on Reach_E(x)."
    - "If beta is constant on Reach_E(x), every admitted finite path endpoint lies in Reach_E(x) and has the initial branch."
    - "If an E-forward-invariant U contains x, induction on path length gives Reach_E(x) subset U; constancy of beta on U therefore implies robustness."
    - "Thus Reach_E(x) is the least forward-invariant carrier and supplies the converse choice U=Reach_E(x)."
  rt018_application:
    wall_family: "A(t)=[e1,e2,(-1,t)] over Q has fixed rank two and nonzero columns."
    diagnostic_values: "beta(A(t)) is Feasible for t>0 and Obstructed for t<=0."
    countermodel: "Any E relation admitting a finite path from A(1/n) to A(-1/n), for arbitrarily large n, has a branch-inhomogeneous reachable set and fails robustness."
    conclusion: "Pointwise totality of beta cannot repair this failure; only a separately source-derived Occ_src and E_src can determine the actual reachable component."
  dependency_map:
    - upstream: "tracked source ontology or explicit proposal-only extension"
      supplies: "Sigma_src, X_src, Occ_src, and E_src"
      missing_now: true
    - upstream: "Occ_src"
      supplies: "which initial state or invariant component occurs"
      missing_now: true
    - upstream: "E_src"
      supplies: "which finite variations and refinements are admitted"
      missing_now: true
    - upstream: "Reach_E plus diagnostic beta"
      supplies: "a check of branch homogeneity only after occurrence and transition laws are fixed"
      missing_now: false
    - upstream: "source-only branch stability"
      supplies: "no automatic physical causality, empirical response, universal matter compatibility, conformal class, scale, or g_eff"
      missing_now: true
  novelty: "RT018 proves that the frozen classifier does not select or protect a realization. This theorem decomposes the exact repair burden into a source occurrence map and an admitted-transition reachability component, with a necessary-and-sufficient robustness test that is independent of all four frozen candidate constructions."
  decision_consequence: "Route A is the unique compared route that directly targets both missing upstream maps while remaining proposal-only and target free."

