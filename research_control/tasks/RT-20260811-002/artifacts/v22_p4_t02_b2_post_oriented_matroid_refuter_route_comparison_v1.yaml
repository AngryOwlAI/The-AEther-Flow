selector_level_results:
  representation_occurrence_separation_lemma:
    result_id: "LEM-V22-P4T02-B2-REPRESENTATION-OCCURRENCE-SEPARATION-001"
    statement: "Even an injective representation J:X->Y of a source-state set with at least two elements supplies neither a distinguished element of X, an occurrence map into X, nor an admissible transition relation on X."
    proof: "For X={x0,x1}, J=id_X is compatible with occurrence of x0, occurrence of x1, or no selection, and contains no subset of XxX declaring allowed changes."
    consequence: "Information retention and explanatory selection are distinct; Route B is downstream of a source occurrence and transition law."
  reachability_component_robustness_theorem:
    result_id: "THM-V22-P4T02-B2-REACHABILITY-COMPONENT-BRANCH-ROBUSTNESS-001"
    setup: "Let E be a source successor relation on X, beta:X->B a total diagnostic, and Reach_E(x) the endpoints of every finite E-path from x, including the length-zero path."
    statement: "Every finite admitted path from x preserves beta if and only if beta is constant on Reach_E(x); equivalently there is an E-forward-invariant beta-homogeneous set containing x, and Reach_E(x) is the least such carrier whenever robustness holds."
    proof: "Reach_E(x) is forward invariant by path concatenation. Pathwise branch preservation is exactly constancy on all reachable endpoints. Every forward-invariant set containing x contains Reach_E(x) by induction on path length."
    rt018_control: "Any admitted path from A(1/n) to A(-1/n) has branch-inhomogeneous reachability and fails robustness; excluding it after diagnostic evaluation is goal-property preload."
  barrier_propagation_lemma:
    result_id: "LEM-V22-P4T02-B2-SOURCE-BARRIER-PROPAGATION-001"
    setup: "Let R_src be a supplied source successor relation on X_src, let b_src:X_src->K take values in an ordered field, and suppose b_src(y)>=lambda b_src(x) for every y in R_src(x), with one fixed lambda>0."
    statement: "Every finite admitted trajectory beginning at b_src(x_0)>0 remains in the positive domain and satisfies b_src(x_n)>=lambda^n b_src(x_0)>0."
    proof: "Induct on n. The successor inequality supplies the induction step; positivity follows because lambda and the initial barrier value are positive."
    epistemic_limit: "The lemma is conditional. It neither derives R_src or b_src nor proves that the current ontology supplies them."
  occurrence_viability_independence:
    result_id: "LEM-V22-P4T02-B2-OCCURRENCE-VIABILITY-INDEPENDENCE-001"
    statement: "A viability law without an occurrence or component selector protects every admitted starting point but selects none; an occurrence selector without a viability law chooses an initial state but does not prevent an admitted trajectory from leaving the domain."
    proof: "The first structure quantifies conditionally over supplied initial states and contains no existence or uniqueness clause selecting one. The second constrains initial data but contains no universal successor condition. Models can vary either clause while holding the other fixed."
  diagnostic_nonselection_corollary:
    result_id: "COR-V22-P4T02-B2-DIAGNOSTIC-NONSELECTION-001"
    statement: "The frozen Bridge_OM readout may diagnose a selected source trajectory, but pointwise totality and presentation equivariance cannot replace an independently source-provenanced occurrence law or admissible-transition law."
    proof_basis: "RT018 pointwise-totality nonselection plus the occurrence-viability independence lemma."
  rational_control_fixture:
    result_id: "CTRL-V22-P4T02-B2-RATIONAL-BARRIER-FIXTURE-001"
    setup: "On the RT018 wall coordinate t, take U={t>0}, b(t)=t, and the separately supplied transition t|->q t with q>=1/3."
    result: "The exact bound b(qt)>=b(t)/3 preserves U, whereas the independently admitted sign-flip t|->-t crosses the wall."
    interpretation: "This fixture exhibits what a protection law would have to control. It is validation-only proposal data, not a source-law derivation or adoption."

