exact_mathematical_control:
  theorem_name: "Compact-total root-family coercive-minimum theorem"
  hypotheses:
    - "G_src assigns each admitted source presentation a nonempty compact total root space R_P."
    - "kappa_P is finite, strictly positive, and lower-semicontinuous on R_P."
    - "EqSrc arrows transport R_P and kappa_P naturally."
    - "Declared source variation and transverse operations close on the total family."
  conclusion: "kappa_star(P)=min_{r in R_P} kappa_P(r) exists, is attained, and is strictly positive."
  proof_summary: "A finite real-valued lower-semicontinuous function on a nonempty compact space attains its minimum. Strict positivity at every root makes the attained value positive. Naturality transports the value across EqSrc arrows."
  exact_rational_fixture:
    roots: ["r0", "r1", "r2"]
    kappa_values: ["2", "3/2", "5/4"]
    attained_minimum: "5/4"
    eqsrc_transport: "a three-cycle transports roots and their kappa labels"
    variation_closure: true
    transverse_closure: true
  countercontrols:
    - control_id: "CC-NONCOMPACT"
      family: "R=[0,infinity), kappa(t)=1/(1+t)"
      result: "pointwise positive with infimum zero; compact-total hypothesis is not optional"
    - control_id: "CC-NONLSC"
      family: "R={0} union {1/n:n>=1}, kappa(0)=1, kappa(1/n)=1/n"
      result: "compact and pointwise positive with infimum zero; lower semicontinuity is not optional"
    - control_id: "CC-OUTCOME-FILTER"
      family: "remove every root that fails the desired downstream protection test"
      result: "invalid circular family generation and frozen-route replay"

