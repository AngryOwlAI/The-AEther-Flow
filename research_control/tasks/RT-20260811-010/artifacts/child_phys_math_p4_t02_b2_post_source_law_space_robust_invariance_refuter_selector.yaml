new_mathematical_payload:
  payload_id: "PAYLOAD-RT010-PM-001"
  payload_type: "theorem"
  name: "compact-total-root-space uniform-coercivity theorem"
  claim_status: "draft/control conditional mathematics"
  formal_objects:
    - object_id: "OBJ-CRF-01"
      symbol: "C_src"
      definition: "A small source-presentation groupoid with objects p and admitted EqSrc arrows g:p->q; no arrow is inferred to be physical gauge."
    - object_id: "OBJ-CRF-02"
      symbol: "R_tot"
      definition: "A compact metrizable total space of all source-generated root records admitted for the packet, with projection pi_R:R_tot->Obj(C_src); compactness is required of the total declared family, not merely each fiber."
    - object_id: "OBJ-CRF-03"
      symbol: "R_p"
      definition: "The fiber pi_R^{-1}(p). Every admitted EqSrc arrow g:p->q acts by a homeomorphism R(g):R_p->R_q satisfying identity, inverse, and composition laws."
    - object_id: "OBJ-CRF-04"
      symbol: "V_src and act"
      definition: "A pre-outcome source-variation category and a typed continuous action act(r,v) in R_tot for every admitted pair; closure means no adverse admitted variation is deleted after inspection."
    - object_id: "OBJ-CRF-05"
      symbol: "Ext_src and E"
      definition: "A category of independently admitted transverse or dimensional source extensions with continuous maps E_e:R_p->R_q landing in R_tot and obeying declared identity and composition laws."
    - object_id: "OBJ-CRF-06"
      symbol: "kappa"
      definition: "A finite-valued lower-semicontinuous map kappa:R_tot->(0,infinity), derived from source syntax before any RobInv, principal-cone, or P4-T02 outcome test."
    - object_id: "OBJ-CRF-07"
      symbol: "mu_diag"
      definition: "The already conditional RT007 normalized protection-margin diagnostic on the domain where its hypotheses hold; it is not used to generate R_tot or define kappa."
    - object_id: "OBJ-CRF-08"
      symbol: "Comp"
      definition: "A proposed comparison theorem mu_diag(r)>=kappa(r) for every r in R_tot; proving Comp is a downstream interface to the fixed conditional theorem, not a definition of kappa."
  domains:
    topology_domain: "One explicitly bounded compact metrizable total root space; fiberwise compactness without total compactness is insufficient."
    positivity_domain: "Every root r in R_tot has finite kappa(r)>0; nonnegativity alone is insufficient."
    regularity_domain: "Lower semicontinuity suffices for the minimum theorem; continuity is stronger than necessary."
    presentation_domain: "Every declared nonidentity EqSrc generator, its inverse, and every composable pair, not an identity-only groupoid."
    variation_domain: "Every independently admitted source variation and every declared finite composite for which act is defined."
    transverse_domain: "Every independently admitted extension map, including maps changing ambient source dimension; such maps are not called EqSrc unless invertible and admitted as EqSrc."
    target_exclusions: "No target atlas, target metric, desired cone, physical norm, empirical response, benchmark answer, Gate status, or outcome-selected failure filter."
  maps:
    - map_id: "MAP-CRF-01"
      signature: "pi_R:R_tot->Obj(C_src)"
      role: "Types every root record by its source presentation."
    - map_id: "MAP-CRF-02"
      signature: "R(g):R_p->R_q"
      role: "Transports root records functorially along an admitted EqSrc arrow."
    - map_id: "MAP-CRF-03"
      signature: "act:R_tot fiber_product V_src->R_tot"
      role: "Imposes predeclared variation closure on the selected total family."
    - map_id: "MAP-CRF-04"
      signature: "E_e:R_p->R_q"
      role: "Imposes predeclared transverse-extension closure without identifying dimension change with equivalence."
    - map_id: "MAP-CRF-05"
      signature: "kappa:R_tot->(0,infinity)"
      role: "Assigns the independently source-generated coercivity datum."
    - map_id: "MAP-CRF-06"
      signature: "kappa_*:=min_{r in R_tot} kappa(r)"
      role: "Produces the family-uniform positive lower bound after compactness, lower semicontinuity, and positivity are established."
    - map_id: "MAP-CRF-07"
      signature: "Comp:r|->(mu_diag(r)>=kappa(r))"
      role: "Connects the new upstream coercivity law to the fixed diagnostic theorem without defining or selecting the new roots by the old outcome."
  theorem:
    theorem_id: "THM-RT010-COMPACT-LSC-UNIFORM-MIN-001"
    statement: "If R_tot is nonempty compact metrizable and kappa:R_tot->(0,infinity) is finite and lower semicontinuous, then kappa attains a minimum kappa_*>0. If each EqSrc arrow preserves kappa and all admitted variation and transverse-extension images remain in R_tot, the same kappa_* bounds every transported, varied, and extended root record. If Comp also holds, then mu_diag(r)>=kappa_*>0 throughout the total family."
    hypotheses:
      - "R_tot is nonempty and compact as a total space."
      - "kappa is finite-valued, pointwise strictly positive, and lower semicontinuous."
      - "Each R(g) is the functorially typed homeomorphism supplied by the EqSrc action and kappa(R(g)r)=kappa(r)."
      - "Every admitted act(r,v) and E_e(r) lands in R_tot; no outcome-filtered closure rule is allowed."
      - "The final protection consequence additionally assumes the separately proved comparison mu_diag>=kappa on the full domain."
    proof: "Lower semicontinuity on nonempty compact R_tot attains its infimum. If the attained value were zero, the minimizer would contradict the codomain (0,infinity); hence kappa_*>0. EqSrc invariance preserves each value. Variation and extension closure place every image back in R_tot, so its kappa value is at least the same global minimum. The optional final inequality follows by transitivity from mu_diag(r)>=kappa(r)>=kappa_*."
    dependency_limit: "The theorem does not prove that current ontology supplies R_tot, kappa, the action, extension maps, EqSrc naturality, or Comp. Those are the selected packet's constructive-or-obstruction burden."
  corollaries:
    - corollary_id: "COR-RT010-FIBERWISE-COMPACTNESS-INSUFFICIENT-001"
      statement: "Compactness of each individual R_p gives a positive minimum per fiber but no common lower bound across a noncompact family of fibers."
    - corollary_id: "COR-RT010-ADMITTED-SEQUENCE-DICHOTOMY-001"
      statement: "If admitted variation or extension images contain a convergent sequence r_n->r with kappa(r_n)->0, then total compactness, lower semicontinuity, and strict positivity cannot all remain true; the future packet must identify which premise fails."
    - corollary_id: "COR-RT010-EQSRC-ORBIT-INVARIANCE-001"
      statement: "Kappa naturality makes the minimum invariant on every EqSrc orbit, but equality across disconnected orbits requires the single compact-total-family theorem rather than arrow transport alone."
  exact_countercontrols:
    - countercontrol_id: "CC-RT010-NONCOMPACT-001"
      root_space: "R=[1,infinity)"
      kappa: "kappa(t)=1/t"
      exact_result: "kappa is finite, positive, and continuous, yet inf_R kappa=0 because kappa(n)=1/n; no positive uniform minimum exists."
      failed_hypothesis: "compact_total_root_space"
    - countercontrol_id: "CC-RT010-NONLSC-001"
      root_space: "R={0} union {1/n:n in N_positive}, compact in the Euclidean topology"
      kappa: "kappa(0)=1 and kappa(1/n)=1/n"
      exact_result: "Every value is positive and inf_R kappa=0, but kappa is not lower semicontinuous at 0 because liminf_n kappa(1/n)=0<kappa(0)=1."
      failed_hypothesis: "lower_semicontinuity"
    - countercontrol_id: "CC-RT010-FIBERWISE-ONLY-001"
      root_space: "Base P=N_positive with singleton compact fibers R_n={r_n}; total space is discrete and noncompact"
      kappa: "kappa(r_n)=1/n"
      exact_result: "Each fiber minimum 1/n is positive, while the family infimum is zero."
      failed_hypothesis: "compactness_of_total_space_not_merely_fibers"
    - countercontrol_id: "CC-RT010-ZERO-ALLOWED-001"
      root_space: "R=[0,1]"
      kappa: "kappa(t)=t"
      exact_result: "Kappa is continuous on compact R but min_R kappa=0."
      failed_hypothesis: "strict_positivity"
    - countercontrol_id: "CC-RT010-NONTRIVIAL-EQSRC-001"
      root_space: "R_p={a}, R_q={b} with one admitted swap arrow g:p->q and its inverse"
      kappa: "kappa(a)=1 and kappa(b)=2"
      exact_result: "The root functor can transport a to b, but kappa naturality fails since kappa(R(g)a)=2 is not kappa(a)=1; identity-only checks would miss the defect."
      failed_hypothesis: "EqSrc_kappa_naturality"
    - countercontrol_id: "CC-RT010-OUTCOME-DEFINED-KAPPA-001"
      root_space: "Any root space generated by retaining only records with mu_diag>0"
      kappa: "kappa:=mu_diag or any monotone recoding chosen after the protection verdict"
      exact_result: "The minimum theorem becomes a circular restatement of the frozen RobInv pass set and supplies no independent source law."
      failed_hypothesis: "preoutcome_independent_source_provenance"
  exact_rational_control:
    root_space: "R={r_1,r_2,r_3}"
    kappa_values: "(3/5,2/5,4/5)"
    exact_minimum: "2/5"
    meaning: "A finite compact control verifies the minimum operation only; it supplies no ontology, completeness, EqSrc, variation, transverse, or physical claim."
  material_distinctness_result:
    result_id: "DEP-RT010-UPSTREAM-COERCIVITY-NONREPLAY-001"
    statement: "Route A is materially distinct only if a pre-outcome source generator constructs R_tot and kappa independently, and Comp is proved afterward. Defining R_tot as the RobInv pass set, defining kappa from mu_diag, or deleting low-margin variation or extension images is an unchanged robust-invariance repair and must terminate in frozen_route_replay."
    old_candidate_role: "Conditional classifier and downstream diagnostic theorem on supplied roots."
    new_candidate_role: "Upstream source law that generates the complete compact family, its coercivity datum, and its variation, transverse, and presentation closure before classification."
    current_ontology_derivation_established: false

diagnostic_bundle_nonfactorization_payload:
  payload_id: "PAYLOAD-RT010-PM-002"
  payload_type: "dependency_map_update"
  name: "principal-factor fibre-constancy criterion and nonselection result"
  formal_objects:
    - "D_diag is a typed enriched source diagnostic bundle."
    - "q:D_diag->B_src is a surjective forgetful map dropping the proposed auxiliary protection data."
    - "Pi_prin:D_diag->P_prin is a required independently source-derived principal-factor map."
    - "Pi_bar:B_src->P_prin is a putative factorization through q."
  theorem:
    theorem_id: "THM-RT010-FIBRE-CONSTANCY-001"
    statement: "For surjective q, a unique map Pi_bar with Pi_prin=Pi_bar composed with q exists if and only if Pi_prin is constant on every q-fiber."
    proof: "Factorization implies fibre constancy immediately. Conversely define Pi_bar(b)=Pi_prin(d) for any d with q(d)=b); fibre constancy gives well-definedness, surjectivity gives totality, and equality plus uniqueness follow."
  countermodel_form: "Two records d_0,d_1 with q(d_0)=q(d_1) but Pi_prin(d_0)!=Pi_prin(d_1) refute factorization exactly."
  decisive_limit: "RT009 provides pairs with differing robust-invariance verdicts, not a source-derived Pi_prin value. Without independently deriving Pi_prin and its P4-T02 decision role, the abstract theorem proves neither relevance nor irrelevance of protection data to P4-T02."
  route_consequence: "Route B remains mathematically lawful but is not selected because its required decision map is absent and its present abstract lemma cannot close or advance the active P4-T02 burden."

