new_mathematical_payload:
  payload_count: 3
  items:
    - payload_id: "NMP-RT010-PHIL-01"
      payload_type: "theorem"
      name: "Compact generated-family coercive sufficiency theorem"
      statement: "For a nonempty compact total pre-outcome seed space C_tot and continuous generator G_src, the total root image R_tot is compact. A finite-valued lower-semicontinuous source modulus kappa:R_tot->(0,infinity) attains beta=min_R_tot kappa>0. If a downstream residual m satisfies m(r)>=kappa(r), then inf_{r in R_tot}m(r)>=beta>0."
      proof: "A continuous image of compact C_tot is compact. Lower semicontinuity on compact R_tot gives an attained minimum. Since kappa is finite-valued and its codomain excludes zero, the attained value is positive. Apply the comparison inequality pointwise."
      exact_countercontrols:
        - "C=(0,1] and kappa(epsilon)=epsilon has pointwise positivity but no compact domain and infimum zero."
        - "C=[0,1] and kappa(epsilon)=epsilon is compact but includes a zero and fails strict positivity."
        - "R={0} union {1/n:n>=1} with kappa(0)=1 and kappa(1/n)=1/n is compact and pointwise positive but not lower-semicontinuous at zero, and its infimum is zero."
        - "Defining C={epsilon:kappa(epsilon)>0} after evaluating kappa is circular and supplies no source generator."
        - "A disjoint union of compact singleton fibres indexed by epsilon=1/n can be fibrewise compact while its total protection infimum is zero."
      selector_consequence: "Route A has an exact minimal theorem target and an exact fail-closed boundary."
      falsifier: "A proof that no source-derived G_src or kappa can be formed under the current ontology would force the precise-obstruction branch; a definition of either object using the desired protection verdict invalidates the constructive selection."
    - payload_id: "NMP-RT010-PHIL-02"
      payload_type: "lemma"
      name: "Nonfactorization is not irrelevance lemma"
      statement: "Let D:S->B and V:S->Y. If D(x_0)=D(x_1) but V(x_0)!=V(x_1), then no f:B->Y satisfies V=f composed with D. This proves only that D is insufficient to determine V. It does not prove D irrelevant to another map W, that V is source-derived, or that V represents P4-T02."
      proof: "If V=f composed with D, equality of D on x_0 and x_1 forces equality of V, contradiction. For the non-irrelevance boundary choose W=D; D is maximally relevant to W. Semantic relevance therefore needs an independently typed codomain and dependency theorem."
      route_b_requirement: "Supply a source-derived principal-factor map Pi_prin and prove the exact relation between Pi_prin, the forgotten diagnostic bundle, and the P4-T02 burden. A supplied opposite proposal label is insufficient."
      selector_consequence: "The live finite model validates the nonfactorization calculation but not its route-level claim of source-side P4 irrelevance."
      falsifier: "A canonical source derivation of Pi_prin plus a theorem that P4-T02 depends exactly on the displayed factorization or forgetful quotient would remove this objection and could make Route B preferable."
    - payload_id: "NMP-RT010-PHIL-03"
      payload_type: "definition_and_falsifier"
      name: "Pre-outcome epistemic independence criterion"
      definition: "In the provenance DAG, no node among m_test, RobInv_src verdict, desired P4 result, target geometry, empirical answer, or workflow status may be an ancestor of G_src, the total source functional, threshold rule, C_tot, kappa, orientation, or operation admissibility. Every primitive must additionally have a derivation edge from canonical source premises or remain an explicit unresolved debt."
      precision: "Acyclic ordering, predeclaration, or hashing proves nonadaptation of recorded bytes only; it does not prove that an author's earlier choice was epistemically independent of the desired outcome. A source derivation or independent falsifiable rationale is still required."
      falsifier: "Any dependency path from a protection, target, empirical, or workflow outcome to a family or modulus primitive fails the selected packet; absence of a canonical source derivation also prevents the theorem-success result."

