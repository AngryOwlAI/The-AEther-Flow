objective: "Formalize or precisely obstruct a source-derived functor from admitted source presentations to nonempty compact total root spaces, together with an independently source-derived finite strictly positive lower-semicontinuous natural coercive modulus and complete variation, transverse, and EqSrc closure."

material_distinctness_contract:
  primitive_is_source_generator_and_modulus: true
  frozen_rob_inv_is_downstream_test_only: true
  may_not_define_kappa_as_frozen_margin: true
