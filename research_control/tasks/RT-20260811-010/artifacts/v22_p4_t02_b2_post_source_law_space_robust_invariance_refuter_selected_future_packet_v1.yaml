  required_statement: "G_src and kappa must be derived or precisely obstructed before any RobInv, P4-T02, physical-cone, matter-sector, or benchmark diagnostic is evaluated."

formal_domains:
  - domain_id: "DOM-01"
    name: "Pres_src"
    definition: "A typed category of admitted source presentations and EqSrc arrows, fixed without target or outcome information."
  - domain_id: "DOM-02"
    name: "R_P"
    definition: "The nonempty compact total space of every root generated by the declared source law at presentation P."
  - domain_id: "DOM-03"
    name: "R_total"
    definition: "The total root-space family over all admitted presentations, with topology and fibre data explicitly typed."
  - domain_id: "DOM-04"
    name: "KappaCod"
    definition: "Finite strictly positive real values with their ordinary order topology."
  - domain_id: "DOM-05"
    name: "Var_src"
    definition: "The independently source-derived admitted variation operations on total roots."
  - domain_id: "DOM-06"
    name: "Trans_src"
    definition: "The independently source-derived transverse closure operations on total roots."
  - domain_id: "DOM-07"
    name: "EqSrcOverlap"
    definition: "Declared overlap domains on which presentation arrows, inverses, and cocycles act."

formal_objects:
  - object_id: "OBJ-01"
    name: "G_src"
    type: "functor Pres_src -> CompactTotalRoot"
  - object_id: "OBJ-02"
    name: "CompleteRoot_P"
    type: "pre-outcome total-root membership predicate"
  - object_id: "OBJ-03"
    name: "kappa_P"
    type: "finite positive lower-semicontinuous function R_P -> R_{>0}"
  - object_id: "OBJ-04"
    name: "kappa_star_P"
    type: "attained minimum of kappa_P on R_P"
  - object_id: "OBJ-05"
    name: "VarClosure_P"
    type: "variation closure relation internal to R_P or coherently transported fibres"
  - object_id: "OBJ-06"
    name: "TransClosure_P"
    type: "transverse closure relation internal to R_P or coherently transported fibres"
  - object_id: "OBJ-07"
    name: "EqSrcNat"
    type: "natural transport of total roots and kappa"
  - object_id: "OBJ-08"
    name: "DownstreamCompare"
    type: "optional non-defining comparison to frozen diagnostics"

formal_maps:
  - map_id: "MAP-01"
    signature: "G_src(P)=R_P"
    purpose: "generate the complete root family from source presentation data"
  - map_id: "MAP-02"
    signature: "G_src(f):R_P -> R_Q"
    purpose: "transport total roots along EqSrc arrows"
  - map_id: "MAP-03"
    signature: "kappa_P:R_P -> R_{>0}"
    purpose: "assign the independently derived coercive protection value"
  - map_id: "MAP-04"
    signature: "kappa_star(P)=min kappa_P"
    purpose: "produce the conditional family-uniform lower bound"
  - map_id: "MAP-05"
    signature: "V:R_P -> R_Q"
    purpose: "encode source-derived admitted variation closure"
  - map_id: "MAP-06"
    signature: "T:R_P -> R_Q"
    purpose: "encode source-derived transverse closure"
  - map_id: "MAP-07"
    signature: "DownstreamCompare(G_src,kappa;diagnostic)"
    purpose: "test a fixed generated law without defining or selecting it"

theorem_targets:
  - theorem_id: "THM-01"
    name: "Source-generation theorem or first obstruction"
    target: "Derive G_src and the total-root predicate from current source primitives, or identify the first exact missing primitive."
  - theorem_id: "THM-02"
    name: "Compact-total root-family coercive-minimum theorem"
    target: "If R_P is nonempty compact and kappa_P is finite, strictly positive, and lower-semicontinuous, then kappa_star(P) exists, is attained, and is positive."
  - theorem_id: "THM-03"
    name: "EqSrc naturality theorem"
    target: "Prove G_src and kappa transport with coherent identity, inverse, and cocycle laws."
  - theorem_id: "THM-04"
    name: "Variation and transverse closure theorem"
    target: "Prove every independently admitted source variation and transverse operation remains within the generated total family or its declared transported fibre."
  - theorem_id: "THM-05"
    name: "Frozen-route nonfactorization theorem"
    target: "Prove G_src and kappa are not defined by or factored through any of the six frozen candidates."

proof_obligations:
  - obligation_id: "PO-01"
    requirement: "Type Pres_src, objects, arrows, topology, fibres, and source provenance."
  - obligation_id: "PO-02"
    requirement: "Derive or precisely obstruct nonempty total-root generation from current source primitives."
  - obligation_id: "PO-03"
    requirement: "Prove compactness of the total root space, not merely compactness of selected fibres while the total family is noncompact."
  - obligation_id: "PO-04"
    requirement: "Define complete-root membership before and independently of every downstream outcome."
  - obligation_id: "PO-05"
    requirement: "Derive kappa independently of the frozen RobInv margin or any desired P4 result."
  - obligation_id: "PO-06"
    requirement: "Prove kappa is finite, strictly positive, and lower-semicontinuous."
  - obligation_id: "PO-07"
    requirement: "Prove the attained positive minimum theorem with exact hypotheses."
  - obligation_id: "PO-08"
    requirement: "Prove EqSrc identity, inverse, naturality, and cocycle coherence."
  - obligation_id: "PO-09"
    requirement: "Derive and prove closure for every declared source variation operation."
  - obligation_id: "PO-10"
    requirement: "Derive and prove closure for every declared transverse operation."
  - obligation_id: "PO-11"
    requirement: "Run the noncompact and compact-non-lower-semicontinuous zero-infimum controls."
  - obligation_id: "PO-12"
    requirement: "Run incomplete-family, goal-filtering, and frozen-margin replay falsifiers."
  - obligation_id: "PO-13"
    requirement: "Separate formal coercivity from causality, response, physical gauge, sector universality, conformal geometry, scale, and g_eff."
  - obligation_id: "PO-14"
    requirement: "Return exactly one theorem with hypotheses and proof or one precise obstruction; an obligation list alone fails."

failure_branches:
  - failure_id: "FB-01"
    trigger: "Pres_src or its source provenance is untyped."
    result: "precise_source_category_obstruction"
  - failure_id: "FB-02"
    trigger: "G_src is stipulated rather than derived and no source-generation primitive is identified."
    result: "precise_generator_provenance_obstruction"
  - failure_id: "FB-03"
    trigger: "The generated root family is empty, incomplete, outcome-filtered, or non-total."
    result: "precise_totality_obstruction"
  - failure_id: "FB-04"
    trigger: "The total root family is noncompact."
    result: "zero_infimum_noncompact_countermodel"
  - failure_id: "FB-05"
    trigger: "kappa is nonpositive, infinite, undefined, or not lower-semicontinuous."
    result: "precise_modulus_regularity_obstruction"
  - failure_id: "FB-06"
    trigger: "kappa is defined as the frozen RobInv margin or another downstream verdict."
    result: "frozen_route_replay"
  - failure_id: "FB-07"
    trigger: "EqSrc transport lacks identity, inverse, naturality, or cocycle coherence."
    result: "presentation_transport_obstruction"
  - failure_id: "FB-08"
    trigger: "An admitted variation leaves the total family."
    result: "variation_closure_obstruction"
  - failure_id: "FB-09"
    trigger: "An admitted transverse operation leaves the total family."
    result: "transverse_closure_obstruction"
  - failure_id: "FB-10"
    trigger: "A target atlas, metric, desired cone, physical norm, empirical label, or benchmark answer defines G_src or kappa."
    result: "forbidden_target_import"
  - failure_id: "FB-11"
    trigger: "The result remains obligations-only, ambiguous, or non-falsifiable."
    result: "fog_failure"

