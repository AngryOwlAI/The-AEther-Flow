stress_branches:
  - branch_id: "STRESS-H1-INDEPENDENT-SECTOR-HOLONOMY"
    variation: "Multiply only rho_R by exp(epsilon*omega), where omega(e_01)=1 and omega vanishes on the other displayed generators."
    preserved:
      - "positive one-dimensional representation syntax"
      - "identity inverse and composition"
      - "target-free source presentation"
    exact_result: "For every epsilon not equal to zero, sector cycle log holonomies are (3*mu+epsilon,3*mu,3*mu), so no common character and no fixed-chi descent exist."
    limiting_result: "Failure occurs for arbitrarily small absolute epsilon."
    disposition: "SCOPED_OBSTRUCTION"
  - branch_id: "STRESS-INTERNAL-T-MINUS-HALF-COLLAPSE"
    variation: "Use the declared affine flow x(t)=x_*+t*v at t=-1/2."
    preserved:
      - "positive source-state coordinates"
      - "balance-law root condition"
      - "formal descent identity"
      - "inverse and cocycle identities"
    exact_result: "x=(3/2,3/2,3/2,3/2), mu=0, and chi=a_s=rho_s=1 for every declared sector and arrow."
    limiting_result: "The full declared positive interval contains the collapse point, so mu!=0 is not invariant under the admitted flow."
    disposition: "NONTRIVIALITY_UNPROTECTED"
  - branch_id: "STRESS-ANCHOR-ERASURE-AND-REANCHORING"
    variation: "Erase or change pointed anchor and positive frame representatives."
    preserved:
      - "cycle holonomy classes"
      - "conditional existence of intertwiners when holonomies agree"
    exact_result: "Object coboundary edge shifts telescope to zero around the cycle. Erasure restores two relative positive moduli; reanchoring selects representatives but cannot repair unequal holonomy."
    disposition: "REPRESENTATIVE_ONLY"
  - branch_id: "STRESS-SOURCE-PRESENTATION-ENLARGEMENT"
    variation: "Forget the transported ell, pointed framed decoration, and anchor normalization, or subdivide one displayed edge and reapply ell=+1 per displayed generator."
    preserved:
      - "bare oriented cycle"
      - "oriented line types"
      - "fixed structured presentation remains valid"
    exact_result: "The fixed structured presentation transports coherently, but the per-displayed-edge winding recipe changes cycle winding from three to four after one subdivision unless ell is retained as source decoration or a new normalization law is supplied."
    disposition: "STRUCTURE_RELATIVE_NATURALITY_ONLY"
  - branch_id: "STRESS-POINT-AND-FRAME-NONSELECTION"
    variation: "Retain only the undecorated oriented cycle and abstract oriented line types."
    preserved:
      - "orientation of the cycle"
      - "orientation of each abstract line"
    exact_result: "The transitive C3 cycle action selects no vertex and positive line automorphisms select no nonzero frame; the fixed point and frames remain disclosed preparation data."
    disposition: "NONSELECTION_RECORDED"
  - branch_id: "STRESS-ALTERNATIVE-COVECTOR"
    variation: "Replace m=(1,-1,0,0) by m0=(1,-1,1,-1)."
    preserved:
      - "covector source type"
      - "m0(d)=0"
      - "acyclic dependency-graph shape"
    exact_result: "m0 is a row of B and satisfies m0(v)=m0(x_*)=0, so the character is trivial at the base and throughout the v-flow."
    disposition: "SOURCE_SELECTOR_MISSING"
  - branch_id: "STRESS-RANK-PRESERVING-BALANCE-FAMILY"
    variation: "Use B_s with rows m0 and (1-s)r2+s*m for 0<=s<=1."
    preserved:
      - "rank(B_s)=2"
      - "B_s*d=0"
      - "one-dimensional quotient ker(B_s)/span(d)"
    exact_result: "The kernel witness w_s has m(w_s)=4(1-s); at s=1 the balance rank remains two while m vanishes on the quotient."
    disposition: "BALANCE_RANK_INSUFFICIENT"
  - branch_id: "STRESS-INVERSE-AND-COCYCLE"
    variation: "Reverse and compose every fixed, perturbed, reanchored, or collapsed path."
    preserved:
      - "log weight negation"
      - "positive reciprocal transition"
      - "additive log weights"
      - "multiplicative positive transitions"
    exact_result: "No inverse or cocycle defect is found; malformed zero-transition or nonadditive controls fail closed, and the obstruction is common-class equality plus nontriviality protection rather than representation syntax."
    disposition: "SURVIVES"
  - branch_id: "STRESS-FROZEN-ROUTE-CONTROLS"
    variation: "Scan premises and formulas for shared tau, fixed Q_ray, midpoint, rank-two response, sign-cell, or desired-response stabilizer replay."
    preserved:
      - "NDCL-V22-P4T02-B2-SHARED-TAU-SELECTOR"
      - "NDCL-V22-P4T02-B2-REPAIRED-QUOTIENT-DESCENT-ROBUSTNESS"
    exact_result: "No frozen-route object is reconstructed and neither inherited freeze is reopened."
    disposition: "PASS_PRESERVED"

new_mathematical_payload:
  - payload_id: "NMP-RT012-PARENT-001"
    payload_type: "countermodel"
    name: "Arbitrarily small independent H1 holonomy countermodel family"
    statement: "rho_R^epsilon=rho_R*exp(epsilon*omega) remains a positive representation for every epsilon but leaves the common-holonomy diagonal for every nonzero epsilon."
    burden_effect: "obstructs"
  - payload_id: "NMP-RT012-PARENT-002"
    payload_type: "theorem"
    name: "Admitted-flow transition-collapse theorem"
    statement: "The positive RT010 orbit crosses mu=0 at t=-1/2, where every character, cochain, and sector transition factor is one while formal descent survives."
    burden_effect: "obstructs"
  - payload_id: "NMP-RT012-PARENT-003"
    payload_type: "theorem"
    name: "Rank-preserving balance-family relevance collapse"
    statement: "A continuous rank-two gauge-preserving B_s family retains a one-dimensional quotient while m on its quotient witness equals 4(1-s) and vanishes at s=1."
    burden_effect: "narrows"
  - payload_id: "NMP-RT012-PARENT-004"
    payload_type: "lemma"
    name: "Anchor coboundary holonomy invariance"
    statement: "Every objectwise reanchor contributes telescoping edge-log shifts with zero cycle sum and therefore cannot repair a nonzero H1 defect."
    burden_effect: "narrows"
  - payload_id: "NMP-RT012-PARENT-005"
    payload_type: "explicit_witness"
    name: "Alternative-covector selector witness"
    statement: "m0=(1,-1,1,-1) has the same declared source-covector type and dependency shape but annihilates d, v, and x_*."
    burden_effect: "narrows"
  - payload_id: "NMP-RT012-FUSION-006"
    payload_type: "exact_transversality_theorem"
    name: "Coordinate distances to the common-character loci"
    statement: "In standard log-holonomy coordinates, the squared distances induced by one-sector epsilon stress are 2*epsilon^2/3 to the R3 common diagonal and 3*epsilon^2/4 to the R4 all-equal diagonal; fixed-chi distance is |epsilon|."
    scope: "A bookkeeping coordinate norm only; not source-derived geometry or a physical metric."
    burden_effect: "obstructs"
  - payload_id: "NMP-RT012-FUSION-007"
    payload_type: "source_solution_locus_nonidentifiability_lemma"
    name: "Row-space aliasing of the source covector"
    statement: "For every r in Row(B), m+r agrees with m on ker(B), so root-locus behavior identifies only [m] modulo Row(B), not an off-root representative, sign, normalization, unit, or operational scale."
    burden_effect: "narrows"
  - payload_id: "NMP-RT012-FUSION-008"
    payload_type: "orbit_topology_theorem"
    name: "Disconnected nontriviality locus"
    statement: "On the admitted positive orbit, mu!=0 holds on (-2,-1/2) union (-1/2,1); excluding the identity-character crossing requires a new invariant domain or protection law."
    burden_effect: "obstructs"
  - payload_id: "NMP-RT012-FUSION-009"
    payload_type: "presentation_obstruction"
    name: "Per-edge winding subdivision control"
    statement: "Reapplying ell=+1 to every displayed generator changes cycle winding from three to four after subdividing one edge; refinement invariance requires transported ell data or a new source normalization rule."
    burden_effect: "narrows"

