formal_setup:
  source_groupoid: "G_src=Pi_1 of the oriented three-cycle with generators e_01,e_12,e_20."
  state_space: "C_src=R^4"
  base_state: "x_*=(2,1,1,2)"
  gauge_generator: "d=(1,1,1,1)"
  variation_generator: "v=(1,-1,-1,1)"
  character_covector: "m=(1,-1,0,0)"
  balance_rows:
    - "r_1=(1,-1,1,-1)"
    - "r_2=(1,1,-1,-1)"
  exact_base_relations:
    - "B*x_*=0"
    - "B*d=0"
    - "B*v=0"
    - "rank(B)=2"
    - "ker(B)=span{d,v}"
