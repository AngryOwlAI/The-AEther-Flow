new_mathematical_payload:
  - payload_id: "NMP-RT012-CHILD-MATH-001"
    payload_type: "exact_transversality_theorem"
    name: "Metric distance to the common-character loci"
    novelty_relative_to_rt011_and_parent_draft: "Adds exact Euclidean distances, not only codimensions and failure."
    hypotheses:
      - "Use log-holonomy coordinates and the standard Euclidean norm."
      - "Perturb only the R-sector class by epsilon."
    statement: "For sector vector (h+epsilon,h,h), the squared distance to the some-common-character diagonal in R3 is 2*epsilon^2/3. For four-class vector (h,h+epsilon,h,h), the squared distance to the all-equal diagonal in R4 is 3*epsilon^2/4. With chi fixed, the sector vector is distance |epsilon| from the fixed-chi point."
    proof: "Orthogonal projection replaces all entries by their arithmetic mean. In R3 the deviations are (2*epsilon/3,-epsilon/3,-epsilon/3); in R4 they are (-epsilon/4,3*epsilon/4,-epsilon/4,-epsilon/4). Squaring and summing gives the stated values."
    consequence: "The common-character locus has zero robustness radius in every admitted independent-sector neighborhood, while the failure magnitude tends continuously to zero with epsilon."
  - payload_id: "NMP-RT012-CHILD-MATH-002"
    payload_type: "source_solution_locus_irrelevance_theorem"
    name: "Row-space indistinguishability of source covector representatives"
    novelty_relative_to_rt011_and_parent_draft: "Strengthens the single m0 counterexample to an exact affine family indistinguishable on every E_src root."
    hypotheses:
      - "E_src(x)=B*x and x lies in ker(B)."
      - "r belongs to Row(B)."
      - "m_r=m+r."
    statement: "For every x in ker(B), m_r(x)=m(x). Therefore chi, every anchored a_s, and every rho_s agree for m and m+r on the entire source-law solution set, not merely on the displayed affine witness."
    proof: "Write r=c*B for a row coefficient c. Then r(x)=c*(B*x)=0 for every x in ker(B), so every construction depending only on mu=m*x is unchanged on that locus."
    explicit_family: "m_lambda=m+lambda*(1,-1,1,-1), lambda in R; all members are gauge invariant and produce exactly the same transition data on ker(B), while differing off the root locus."
    exact_scope: "This is off-root representative nonselection for the declared covector, not failure of the induced quotient functional and not a physical equivalence claim."
  - payload_id: "NMP-RT012-CHILD-MATH-003"
    payload_type: "rank_preserving_deformation_theorem"
    name: "Rank-two balance does not protect character relevance"
    novelty_relative_to_rt011: "Extends local openness by locating an exact finite endpoint where quotient nonvacuity survives but character relevance vanishes."
    construction: "Let B_s have rows r_1=(1,-1,1,-1) and (1-s)r_2+s*m for 0<=s<=1, and w_s=(2-3s,s-2,3s-2,2-s)."
    exact_checks:
      rank: "rank(B_s)=2 for every s in [0,1]."
      gauge: "B_s*d=0."
      quotient: "B_s*w_s=0 and w_s is never proportional to d, so dim(ker(B_s)/span{d})=1."
      relevance: "m(w_s)=4*(1-s)."
      endpoint: "At s=1, rank([B_s;m])=2 and the induced m on the non-gauge quotient is zero."
      interior: "For 0<=s<1, rank([B_s;m])=3 and relevance remains nonzero."
    consequence: "RT011 local openness near s=0 survives; global robustness does not follow from rank(B_s)=2, gauge preservation, and quotient dimension alone."
  - payload_id: "NMP-RT012-CHILD-MATH-004"
    payload_type: "minimal_countermodel"
    name: "One-generator positive H1 perturbation"
    construction: "Let omega(e_01)=1, omega(e_12)=omega(e_20)=0, extend additively and inverse-odd, and set rho_R^epsilon=rho_R*exp(epsilon*omega) while holding chi,rho_S,rho_D,B,d,m,x,frames,and anchors fixed."
    minimality: "Only one oriented generator pair is changed; any nonzero representation perturbation must change at least one generator value."
    exact_checks:
      positivity: "All multipliers are strictly positive."
      inverse: "omega(gamma^-1)=-omega(gamma), so perturbed inverse transitions are reciprocals."
      cocycle: "Additivity of omega preserves composition."
      loop_defect: "Hol(rho_R^epsilon)/Hol(chi)=exp(epsilon)."
      obstruction: "For epsilon!=0 no positive object cochain can remove the nonunit loop ratio."
      smallness: "The maximum generator-log change is |epsilon| and is below any prescribed positive tolerance for a suitable nonzero epsilon."
    consequence: "Exact candidate-scoped robustness obstruction without inverse, cocycle, positivity, target, or provenance failure."

