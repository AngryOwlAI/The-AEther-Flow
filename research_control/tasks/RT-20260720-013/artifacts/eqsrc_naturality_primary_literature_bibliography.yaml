    primary_source: true
    citation_apa7: "Palais, R. S. (1961). On the existence of slices for actions of non-compact Lie groups. Annals of Mathematics, 73(2), 295–323. https://doi.org/10.2307/1970335"
    publisher_url: "https://www.jstor.org/stable/1970335"
    exact_hypotheses: "A Lie group acting on a Cartan G-space; equivalently in the paper's theorem, compact isotropy together with a slice at every point. Proper G-spaces are a controlled subclass."
    established_conclusion: "Under the scoped action hypotheses, slices exist locally through points and yield invariant-neighborhood structure."
    transfer_boundary: "A local slice is not a global cross-section, a unique orbit representative, or a natural selector across an independently defined source category."
