  - source_id: "EML-1945-NATURAL-EQUIVALENCES"
    topics: ["naturality", "functors", "natural transformations"]
    primary_source: true
    citation_apa7: "Eilenberg, S., & Mac Lane, S. (1945). General theory of natural equivalences. Transactions of the American Mathematical Society, 58, 231–294. https://doi.org/10.1090/S0002-9947-1945-0013131-6"
    publisher_url: "https://www.ams.org/journals/tran/1945-058-00/S0002-9947-1945-0013131-6/"
    exact_hypotheses: "Specified categories, functors on both objects and mappings, and component maps required to commute with every mapping in the declared category."
    established_conclusion: "Naturality is a simultaneous coherence condition across the declared mappings; an objectwise isomorphism need not be natural."
