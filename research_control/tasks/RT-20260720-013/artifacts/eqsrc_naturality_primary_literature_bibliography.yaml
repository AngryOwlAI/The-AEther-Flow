  - source_id: "ANGLUIN-1980-ANONYMOUS-NETWORKS"
    topics: ["symmetry", "anonymous processors", "leader election"]
    primary_source: true
    citation_apa7: "Angluin, D. (1980). Local and global properties in networks of processors (Extended abstract). In Proceedings of the twelfth annual ACM symposium on Theory of computing (pp. 82–93). Association for Computing Machinery. https://doi.org/10.1145/800141.804655"
    publisher_url: "https://dl.acm.org/doi/10.1145/800141.804655"
    exact_hypotheses: "A network model with processors designed without network-specific identity knowledge and identical processors at equal port degree, required to guarantee a global function over the admitted connected networks."
    established_conclusion: "Local indistinguishability and graph-cover symmetry constrain which global functions can be guaranteed; anonymous election is obstructed on symmetric instances."
    transfer_boundary: "Provides a model-specific operational symmetry obstruction, not a theorem about the project source functor or physical covariance."
  - source_id: "ITAI-RODEH-1981-SYMMETRY-BREAKING"
    topics: ["leader election", "randomization", "symmetry-breaking resource"]
    primary_source: true
    citation_apa7: "Itai, A., & Rodeh, M. (1981). Symmetry breaking in distributive networks. In 22nd Annual Symposium on Foundations of Computer Science (pp. 150–158). IEEE. https://doi.org/10.1109/SFCS.1981.41"
    publisher_url: "https://doi.org/10.1109/SFCS.1981.41"
    exact_hypotheses: "An anonymous ring of indistinguishable processors communicating along the ring; the analyzed constructive algorithms add independent randomness and, for stated bounds, knowledge of ring size."
    established_conclusion: "No deterministic algorithm elects a unique leader under the symmetric anonymous assumptions, while probabilistic algorithms can elect one with bounded expected resource use under added assumptions."
    transfer_boundary: "Shows that a successful selector can depend on an explicit symmetry-breaking resource. Randomness or size knowledge is added structure, not canonical source derivation."
  - source_id: "PALAIS-1961-SLICES"
