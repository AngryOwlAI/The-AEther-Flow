  theorem_statement: >-
    For finite U and nonempty obstruction clauses C_j, every escaping extension
    signature contains an inclusion-minimal hitting set, and the collection of
    such signatures is finite and nonempty.
  proof_summary: >-
    Escaping is definitionally the hitting-set property. Repeated deletion of
    dispensable elements terminates because U is finite, yielding a minimal
    hitting set. The power set of U is finite and U hits all nonempty clauses.
  countermodel_or_obstruction: >-
    With U={d,n,q}, C1={d,q}, and C2={n,q}, the exact minimal signatures are
    {q} and {d,n}; empty, {d}, and {n} fail. Omitted capabilities remain outside
    the theorem's universe and therefore block a future-impossibility overread.

