exact_controls:
  control_count: 5
  controls:
    - control_id: "CTRL-01-TWO-POINT-SWAP"
      setup: "F={0,1}; G=Z2 acts by the transposition 0<->1."
      result: "No fixed point, no nonempty proper invariant subset, and exactly one invariant normalized probability K=(1/2,1/2); no token is selected."
      proof: "The transposition fixes neither point. Its only invariant subsets are empty and F. For weights (p,1-p), invariance gives p=1-p, hence p=1/2. A pair of weights contains no realized value."
      falsifier: "A fixed token, a proper invariant subset, a nonuniform invariant normalized probability, or an independently typed realization map."
      relation_to_result: "conditional_separation_control_not_current_source_Prop_instance"
    - control_id: "CTRL-02-TRANSLATION-TORSOR"
      setup: "F=R with its Borel sigma-algebra; G=R acts by translations."
      result: "No countably additive normalized translation-invariant Borel probability exists."
      proof: "Let m=mu([0,1)). Integer translates are disjoint and have equal mass. If m>0, a large finite union has mass greater than one. Hence m=0. Since R is the disjoint countable union of the intervals [n,n+1), countable additivity gives mu(R)=0, contradicting normalization."
      falsifier: "An explicit countably additive normalized Borel probability invariant under every translation, or an honest declaration that a different finitely additive or nonnormalized object is being used."
      relation_to_result: "conditional_kernel_nonexistence_control_not_global_no_kernel_claim"
    - control_id: "CTRL-03-COMPATIBLE-LOCAL-UNIFORM-KERNELS"
      setup: "Let X=U union V with nonempty overlap, constant finite fiber F={0,1}, and local kernels K_U=K_V=(1/2,1/2), with ordinary restriction."
      result: "The local kernels agree on U cap V and the global constant kernel K_X=(1/2,1/2) restricts to both."
      proof: "All restriction maps preserve the same two weights, so overlap equality is literal. Defining the same weights globally supplies the required amalgamation in this explicit constant-kernel sheaf control."
      falsifier: "A restriction changing either weight, an overlap on which the two local kernels differ, or failure of the declared constant-kernel object to satisfy its sheaf equation."
      relation_to_result: "positive_descent_fixture_under_explicit_sheaf_hypothesis"
    - control_id: "CTRL-04-OPPOSITE-LOCAL-DIRAC-KERNELS"
      setup: "On the same cover and fiber, set K_U=delta_0 and K_V=delta_1."
      result: "The two restrictions disagree on every nonempty overlap and no global kernel can restrict to both."
      proof: "A global restriction to U cap V would have to equal both delta_0 and delta_1, but these measures differ on the measurable set {0}."
      falsifier: "An empty overlap, identification of 0 with 1 in the declared fiber, or a global measure whose one restriction assigns both zero and one to {0}."
      relation_to_result: "exact_locality_descent_failure_control"
    - control_id: "CTRL-05-SAME-REDUCT-OPPOSITE-DESIRED-LABEL"
      setup: "Let p(e_plus)=p(e_minus)=r while h(e_plus)=plus and h(e_minus)=minus, with plus not equal to minus."
      result: "h does not factor through the typed current reduct r."
      proof: "If h=h_bar composed with p, then h(e_plus)=h_bar(r)=h(e_minus), contradicting the opposite labels."
