conditional_theorem_schemas:
  theorem_target_count: 5
  current_source_theorem_instance_count: 0
  schemas:
    - theorem_id: "THM-01"
      name: "GroupoidDeterministicSectionFixedPointCriterion"
      hypotheses:
        - "Src is a groupoid."
        - "U:Prop->Src is a split fibration with discrete object fibers F_s and strictly functorial bijective transport f_*:F_s->F_t."
        - "A deterministic section is required to commute strictly with every transport."
      statement: "A strict deterministic section exists exactly when one Aut_Src(r)-fixed element can be chosen in the fiber over each representative r of every connected component of Src."
      proof: "A section value x_r must satisfy g_*x_r=x_r for every automorphism g of r by naturality. Conversely, choose one fixed x_r per component. For any s choose f:r->s and define x_s=f_*x_r. If f' is another choice, f^{-1}f' is an automorphism of r, so fixedness makes the value independent of the choice. Functoriality gives naturality."
      falsifier: "Provide a split discrete-fiber counterexample with fixed representative elements but no strict natural section, or a strict natural section whose representative value is moved by an automorphism. A non-discrete or only-up-to-isomorphism fibration falls outside the stated hypotheses."
      current_source_status: "valid_conditional_schema_no_Prop_instance"
    - theorem_id: "THM-02"
      name: "InvariantAdmissibleSubfunctorCriterion"
      hypotheses:
        - "The split discrete-fiber action hypotheses of THM-01 hold."
        - "Admissibility is objectwise a subset and must transport bijectively along source arrows."
      statement: "A nonempty proper invariant admissibility subfunctor exists exactly when every component representative fiber admits a nonempty proper Aut_Src(r)-invariant subset; transported representative subsets then define it uniquely up to the representative choices."
      proof: "Necessity follows by restricting an admissibility subfunctor to each representative and using automorphism naturality. Conversely, transport each invariant representative subset. Independence of the chosen arrow follows from invariance, and functoriality supplies the subfunctor equations. Empty and full fibers are invariant but do not provide discriminating proper admissibility."
      falsifier: "Exhibit a nonempty proper invariant subset in the two-point transitive swap fiber, or a transported family violating the subfunctor equation under the stated strict action hypotheses."
      current_source_status: "valid_conditional_schema_no_Prop_instance"
    - theorem_id: "THM-03"
      name: "EquivariantOccurrenceKernelCriterion"
      hypotheses:
        - "Every F_s is a measurable space."
        - "Every transport f_* is a measurable bijection."
        - "K_s is a countably additive normalized probability measure and transport uses pushforward."
      statement: "An equivariant normalized kernel family exists exactly when every component representative fiber admits an Aut_Src(r)-invariant probability measure; transport of representative measures defines the family. Existence of the measure family does not select a token."
      proof: "A kernel family restricts at each representative to an invariant probability by automorphism equivariance. Conversely, push each invariant representative measure forward along an arrow to s. If two arrows are used, their difference is a representative automorphism, whose invariance makes the result independent of choice. Pushforward functoriality proves equivariance. A probability is measure-valued and contains no sample or realization map."
      falsifier: "Give an invariant probability on the real translation torsor, or show that a measure alone contains a canonically selected realized element without adding a realization or sampling map."
      current_source_status: "valid_conditional_schema_no_measurable_Prop_instance"
    - theorem_id: "THM-04"
      name: "LocalOccurrenceDescentCriterion"
      hypotheses:
        - "For each occurrence tier, local data form a separated presheaf D on source opens."
        - "Effective gluing is claimed only when D is a sheaf or a separately stated effective-descent object."
      statement: "Overlap equality and cocycle compatibility are necessary for gluing. They are sufficient and give a unique global datum only under the declared sheaf or effective-descent hypothesis."
      proof: "Any global datum restricts equally to every overlap and satisfies cocycles by functoriality, proving necessity. Under the sheaf axiom, every compatible local family has one unique global amalgamation, proving sufficiency. Without effectivity, compatibility alone need not provide a global object."
      falsifier: "A compatible family in a declared sheaf with no global amalgamation would refute sufficiency. For the control against omitting the sheaf hypothesis, define D(W)={0,1} on nonempty opens, D(empty)={star}, identity restrictions between nonempty opens, and the unique restriction to empty. On a disconnected union, unequal local constants agree in D(empty) but do not arise from one global constant."
      current_source_status: "valid_conditional_schema_no_proposal_local_presheaf_instance"
    - theorem_id: "THM-05"
      name: "CurrentSourceProvenanceFactorCriterion"
      hypotheses:
        - "p:E->R is a map forgetting proposal-only expansion data."
        - "h:E->Y is a proposed occurrence, admissibility, or label generator."
      statement: "There is a unique map h_bar:p(E)->Y with h=h_bar composed with p exactly when h is constant on every p-fiber. If p is surjective, the factor is unique on all of R."
      proof: "Factorization implies fiber constancy immediately. Conversely, define h_bar(p(e))=h(e); fiber constancy makes this well defined, and the displayed factorization follows. Uniqueness holds on p(E), and surjectivity identifies p(E) with R."
      falsifier: "Find e_plus and e_minus with p(e_plus)=p(e_minus) but h(e_plus) not equal to h(e_minus) while retaining h=h_bar composed with p, or add independently typed source data so the two reducts cease to be identical."
