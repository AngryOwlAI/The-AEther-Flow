new_mathematical_payload:
  - payload_id: "NMP-RT015-003-001"
    payload_type: "theorem_with_hypotheses_and_proof"
    statement: "On each connected component of a typed groupoid action, natural deterministic sections are equivalent to stabilizer-fixed representative-fiber elements with transport-independent extension."
    falsifier: "The two-point swap fiber has no fixed element and therefore no section."
  - payload_id: "NMP-RT015-003-002"
    payload_type: "theorem_with_hypotheses_and_proof"
    statement: "Invariant admissible subfunctors are classified componentwise by stabilizer-invariant subsets; a discriminating layer requires proper nonempty fibers."
    falsifier: "The two-point swap has only empty and full invariant subsets."
  - payload_id: "NMP-RT015-003-003"
    payload_type: "theorem_and_countermodel"
    statement: "Normalized equivariant kernels are invariant representative-fiber measures; the two-point swap has the unique uniform kernel while the translation torsor has no invariant Borel probability."
    falsifier: "A finite orbit admits its uniform measure, whereas a noncompact translation torsor defeats normalization."
  - payload_id: "NMP-RT015-003-004"
    payload_type: "descent_theorem_and_countermodel"
    statement: "On a declared measurable proposal stack, local kernels descend exactly under overlap equality and cocycle compatibility; equal uniform kernels glue and opposite Dirac kernels do not."
    falsifier: "Changing either overlap measure changes the descent outcome exactly."
  - payload_id: "NMP-RT015-003-005"
    payload_type: "factorization_theorem"
    statement: "For a surjective reduct map U, an output factors uniquely through the reduct exactly when it is constant on every U-fiber; exhaustive binary enumeration checks 16 maps and 4 passing maps."
    falsifier: "The same-reduct opposite-label pair violates fiber constancy."
  - payload_id: "NMP-RT015-003-006"
    payload_type: "precise_typing_and_provenance_obstruction"
    statement: "The current source signature forms SmoothMan_4^iso but cannot form Prop, U, fiber actions, measurable structures, descent data, or Gen_occ, so the conditional occurrence theorem family has no current-source instance."
