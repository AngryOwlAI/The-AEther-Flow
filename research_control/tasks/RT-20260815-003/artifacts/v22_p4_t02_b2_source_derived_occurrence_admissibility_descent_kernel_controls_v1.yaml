conditional_theorem_family:
  - theorem_id: "THM-RT003-SECTION-FIXED-POINT-001"
    status: "proved_conditionally"
    hypotheses: "Let Src be a small groupoid and F:Src->Set a typed proposal-fiber functor."
    conclusion: "On each connected component, natural sections 1=>F are in bijection with Aut(s)-fixed elements of F(s) at one representative s, transported along arrows."
    proof: "Naturality makes the representative value stabilizer-fixed. Conversely, a fixed value transported along any representative arrow is independent of the arrow because two choices differ by a stabilizer, and functoriality gives a natural section."
    current_source_instantiation: "not_formable_without_Prop_U_and_fiber_action"
  - theorem_id: "THM-RT003-INVARIANT-SUBFUNCTOR-001"
    status: "proved_conditionally"
    hypotheses: "Let F:Src->Set be a typed groupoid action and let A_s be subsets of F(s)."
    conclusion: "A is an invariant subfunctor exactly when every arrow transports A_s bijectively to A_t. Selector force requires every A_s to be nonempty and proper; empty and full choices are nonselecting."
    proof: "The subfunctor square is precisely arrowwise subset transport. In a connected component it reduces to a stabilizer-invariant subset at one representative."
    current_source_instantiation: "not_formable_without_typed_proposal_fibers_and_actions"
  - theorem_id: "THM-RT003-EQUIVARIANT-KERNEL-001"
    status: "proved_conditionally"
    hypotheses: "Let every F(s) carry a declared measurable structure and every arrow act measurably."
    conclusion: "Normalized equivariant kernels are exactly transport-compatible stabilizer-invariant probability measures on representative fibers."
    proof: "Equivariance restricts a kernel to invariant representative measures and transports them uniquely; invariance makes transport independent of the chosen arrow."
    semantic_boundary: "A normalized mathematical measure does not select a realized token, empirical frequency, physical probability, time orientation, or causal structure."
    current_source_instantiation: "not_formable_without_sigma_algebras_actions_and_kernel_generator"
  - theorem_id: "THM-RT003-KERNEL-DESCENT-001"
    status: "proved_conditionally"
    hypotheses: "Let the proposal assignment be a declared stack or sheaf on a typed source restriction site, with measurable restriction maps."
    conclusion: "Normalized local kernels glue uniquely exactly when all overlap restrictions agree and satisfy the ordinary cocycle compatibility."
    proof: "Necessity follows by restricting a global kernel. Sufficiency and uniqueness are the separated gluing axiom applied to compatible local measures."
    current_source_instantiation: "not_formable_without_restriction_site_stack_or_sheaf_and_kernel_restrictions"
  - theorem_id: "THM-RT003-SAME-REDUCT-FACTORIZATION-001"
    status: "proved_conditionally"
    hypotheses: "Let U:E->Src be a surjective forgetful map and q:E->Y a proposed generator output."
    conclusion: "There is a unique q_bar:Src->Y with q=q_bar composed with U exactly when q is constant on every U-fiber."
    proof: "Factorization implies fiber constancy. For the converse, define q_bar(s) by any lift e with U(e)=s; surjectivity gives a lift and constancy gives well-definedness and uniqueness."
    current_source_instantiation: "fails_formation_without_U_and_fails_provenance_for_same_reduct_opposite_labels"

