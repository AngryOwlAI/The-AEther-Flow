theorem_target_evaluation:
  theorem_count: 5
  theorems:
    - theorem_id: "THM-01"
      name: "GroupoidDeterministicSectionFixedPointCriterion"
      conditional_statement: "For each connected component of a groupoid action, a natural section exists exactly when a representative fiber contains an automorphism-fixed element, with transport defining compatible elements in the remaining fibers."
      proof: "A natural section evaluated at a representative is fixed by every representative automorphism. Conversely, choose a fixed element x_r. For any s choose an arrow f:r->s and set x_s=T_f(x_r). If f' is another arrow, f'^-1 f is an automorphism of r and fixes x_r, so x_s is choice-independent; functoriality gives naturality. Apply componentwise."
      falsifier: "A component with a natural section whose representative value is moved by an automorphism, or fixed representative data whose transported value depends on the chosen arrow."
      status: "conditional_theorem_preserved_not_applicable_before_F_prop"
    - theorem_id: "THM-02"
      name: "InvariantAdmissibleSubfunctorCriterion"
      conditional_statement: "A discriminating admissibility subfunctor is exactly a family A_s with empty excluded, full fiber treated as nondiscriminating, proper nonempty A_s when discrimination is claimed, and T_f(A_s)=A_t for every source arrow."
      proof: "Subfunctoriality supplies transport closure and inverse arrows supply equality rather than one-sided inclusion. Empty families admit nothing; full families exclude nothing; only a proper nonempty invariant family supplies mathematical discrimination."
      falsifier: "A claimed discriminating family that is empty, full, or not preserved by some declared source arrow."
      status: "conditional_theorem_preserved_not_source_derived"
    - theorem_id: "THM-03"
      name: "EquivariantOccurrenceKernelCriterion"
      conditional_statement: "Given measurable fiber transports, an equivariant kernel is a normalized countably additive family K_s satisfying (T_f)_*K_s=K_t; on each groupoid component it is equivalent to an invariant representative-fiber measure transported coherently."
      proof: "Equivariance restricts K_r to an Aut(r)-invariant measure. Conversely transport an invariant K_r along any arrow r->s. Invariance makes the definition arrow-independent, and functoriality gives pushforward coherence."
      falsifier: "A normalized equivariant family with a noninvariant representative measure, or an invariant representative measure whose transported family is arrow-dependent."
      status: "conditional_theorem_preserved_not_source_derived_not_token_semantics"
    - theorem_id: "THM-04"
      name: "LocalOccurrenceDescentCriterion"
      conditional_statement: "For a declared proposal stack, local sections, admissible subobjects, or kernels descend only when their overlap restrictions and cocycles agree; effective descent then supplies a global object unique up to the declared equivalence."
      proof: "Any global object has equal restrictions on overlaps and satisfies the cocycle by functoriality. The converse is precisely the effective-descent hypothesis and therefore cannot be inferred from objectwise data alone."
      falsifier: "Compatible local data without a glue in a setting where effective descent was claimed, or incompatible overlap data represented as global."
      status: "conditional_theorem_preserved_mathematical_locality_only"
    - theorem_id: "THM-05"
      name: "CurrentSourceProvenanceFactorCriterion"
      conditional_statement: "An occurrence generator derived only from a reduct map r factors as G=G_bar composed with r and is therefore constant on identical current reducts; opposite labels on one reduct require additional typed source data."
      proof: "If r(e_1)=r(e_2), factorization gives G(e_1)=G_bar(r(e_1))=G_bar(r(e_2))=G(e_2). The contrapositive shows that unequal outputs on one reduct forbid factorization through that reduct."
      falsifier: "A typed distinguishing source datum making the two reducts unequal, or a well-defined factor G_bar reproducing both allegedly opposite outputs."
      status: "criterion_proved_current_packet_fails_before_generator_formation"

