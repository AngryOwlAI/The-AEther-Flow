      burden_effect: "obstructs_current_source_derivation_at_first_carrier"
    - payload_id: "NMP-RT003-PHIL-002"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "Invariant Dirac if and only if fixed token lemma"
      statement: "For a group action on a measurable set, delta_x is invariant exactly when x is fixed by every group element."
      proof: "Pushforward sends delta_x to delta_{g x}. Equality with delta_x holds exactly when g x=x, for every g."
      falsifier: "A moved point x whose Dirac measure remains invariant, or a fixed point whose Dirac measure is not invariant."
      burden_effect: "separates_deterministic_selection_from_kernel_invariance"
    - payload_id: "NMP-RT003-PHIL-003"
      payload_type: "source_side_irrelevance_proof"
      name: "No equivariant token realization from the swap-uniform kernel"
      statement: "There is no Z2-equivariant map that turns the invariant uniform measure on the two-point swap fiber into one of its tokens."
      proof: "The uniform measure is fixed by the swap. Equivariance would force its image token to be fixed by the swap, but the action has no fixed token."
      falsifier: "A Z2-equivariant realization map returning 0 or 1 from the uniform measure."
      burden_effect: "blocks_probability_as_realized_occurrence_overread"
    - payload_id: "NMP-RT003-PHIL-004"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "Same-reduct constancy theorem"
      statement: "Any generator factored through typed current-source reduct data is constant on each reduct fiber."
      proof: "Equality follows immediately by applying the single reduced generator value to both presentations sharing the reduct."
      falsifier: "A typed distinguishing source field or a valid reduced generator returning two values on one input."
      burden_effect: "sharpens_current_source_provenance_test"
    - payload_id: "NMP-RT003-PHIL-005"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "Descent does not manufacture realization semantics"
      statement: "Gluing compatible mathematical kernels produces only a global kernel in the declared stack; without a separately typed realization or response map, descent cannot yield a realized event or Resp_lc."
      proof: "The descent codomain is the kernel object type. No morphism from that type to tokens, observations, or responses occurs in the hypotheses, so such an output is not type-formable from glue alone."
      falsifier: "A separately derived natural realization or response map included among the source hypotheses."
      burden_effect: "separates_mathematical_locality_from_physical_locality"
    - payload_id: "NMP-RT003-PHIL-006"
      payload_type: "countermodel_or_obstruction"
      name: "Translation symmetry does not guarantee a normalized kernel"
      statement: "The real translation torsor has no normalized invariant Borel probability, so replacing deterministic selection with symmetry averaging adds a genuine existence burden."
      proof: "Equal masses of disjoint integer translates of [0,1) contradict normalization whether their common mass is positive or zero."
      falsifier: "A countably additive normalized translation-invariant Borel probability on R."
      burden_effect: "obstructs_automatic_kernel_from_symmetry"

