hypotheses:
  - hypothesis_id: "H-FIXED-01"
    statement: "Every registered P5-T01 through P6-T08 source object, hash, premise, candidate status, comparison status, variation class, and scope guard is held fixed."
  - hypothesis_id: "H-NO-DELTA-02"
    statement: "No new source primitive, source law, selector, quotient, operational protocol, robustness law, physical interpretation, or protected authority is added."
  - hypothesis_id: "H-P5-REG-03"
    statement: "U is differentiable, a:U->R is differentiable, B:R->E is differentiable, and the deterministic reconstruction under review is R=B o a."
  - hypothesis_id: "H-P5-RICHNESS-04"
    statement: "The rank consequence is invoked only for an interface that requires at least two independent response directions at a relevant source point."
  - hypothesis_id: "H-P6-COMP-05"
    statement: "The P6 comparison forms are admissible mathematical completions or controls of D_6 and are not adopted source or physical geometries."
  - hypothesis_id: "H-P6-SAME-06"
    statement: "For each pairwise non-entailment claim, the two compared completions have the same restriction to the complete premise signature relevant to that output."
  - hypothesis_id: "H-P6-DIFF-07"
    statement: "The compared completions differ in the required output or in an invariant needed to define that output, and the fixed package supplies no derived observable-preserving equivalence relation identifying the difference."
  - hypothesis_id: "H-ENTAIL-08"
    statement: "A required output is called entailed only if all admissible completions of the same fixed premise signature yield the same output class."
  - hypothesis_id: "H-CERT-09"
    statement: "Certification as a unique source-natural robust operational Lorentzian geometry requires both the applicable local-response condition and the P6 entailment condition, in addition to the remaining Gate B conditions."
  - hypothesis_id: "H-CLOCK-10"
    statement: "Clock non-entailment is formulated over the unnormalized oriented-flow data or over completion-level operational calibration semantics; a normalized physical clock is not silently included in D_6."

formal_entailment_and_single_valuedness_logic:
  entailment_definition: "D_6 entails output O modulo ~ exactly when [O(M)]_~ is identical for every M in Comp(D_6)."
  functional_form: "Equivalently, an entailed deterministic reconstruction F_O must satisfy F_O(D_6)=[O(M)]_~ for every M in Comp(D_6)."
  separating_model_rule: "If M_1 and M_2 both lie in Comp(D_6), agree on D_6, and [O(M_1)]_~ differs from [O(M_2)]_~, then no such single-valued F_O exists and D_6 does not entail O modulo ~."
  proof_steps:
    - "Assume a single-valued entailed reconstruction F_O exists."
    - "Because M_1 and M_2 restrict to the same D_6, both outputs must equal the one value F_O(D_6)."
    - "The separating witness gives inequivalent output classes, contradicting single-valuedness."
    - "The conclusion is non-entailment from D_6, not nonexistence of an externally chosen output and not impossibility after adding new premises."
  quotient_guard: "Declaring all comparison outputs gauge-equivalent after the fact does not repair the proof burden; the equivalence and observable transport must themselves be source-derived and proved compatible with the fixed package."

p5_rank_review:
  inherited_theorem_id: "P5T08-THM-FACTOR-THROUGH-AMPLITUDE-RANK-BOUND"
  obstruction_id: "OBST-P5T08-FACTOR-THROUGH-AMPLITUDE-RANK-001"
  derivation:
    - "The chain rule gives D R_u = D B_{a(u)} o D a_u."
    - "D a_u has image in the one-dimensional tangent space T_{a(u)}R."
    - "Therefore rank(D R_u) <= min(rank(D a_u), rank(D B_{a(u)})) <= 1."
    - "In coordinates, D R_u is an outer product, so every 2 by 2 minor vanishes identically."
  accepted_consequence: "Deterministic differentiable post-processing through the sole amplitude coordinate cannot supply two independently variable local response directions."
  rejected_overreads:
    - "The rank bound does not say that no unique rank-one metric-valued curve can be written down."
    - "It does not cover nondifferentiable, stochastic, relational, or materially richer source reconstructions."
    - "It does not prove that every geometry target intrinsically requires rank at least two without a separately stated interface requirement."
    - "It does not apply to a conservative source extension with independent local source degrees of freedom."
  verdict: "mathematically_valid_and_exactly_candidate_scoped"

p6_witness_review:
  - witness_id: "SEP-01-CHARACTERISTIC"
    witness_mode: "structural_type_mismatch"
    same_premise_pair: false
    exact_result: "The linear characteristic hyperplane Ann(V) cannot equal the nonlinear null cone of a nondegenerate Lorentzian quadratic form; equivalently, a three-dimensional totally isotropic subspace is impossible for Lorentzian Witt index one."
    consequence: "The P6-T02 principal polynomial xi(V) does not itself identify a Lorentzian characteristic cone."
  - witness_id: "SEP-02-CONFORMAL"
    witness_mode: "same_premise_pair_and_infinite_family"
    same_premise_pair: true
    exact_result: "The family g_H=-ds^2+H_ij dy^i dy^j shares [V]_+, Ann(V), and the forward V-flow preorder while containing infinitely many pairwise nonconformal forms."
    consequence: "No single-valued Lorentzian conformal reconstruction is entailed by the one-ray datum."
  - witness_id: "SEP-03-SCALE-ROD-CLOCK"
    witness_mode: "same_premise_family_plus_normalization_freedom"
    same_premise_pair: true
    exact_result: "The family g_a=-ds^2+e^(2a)(dy^1)^2+e^(-2a)(dy^2)^2+(dy^3)^2 preserves the ray, annihilator, preorder, density, and phase carriers while changing conformal class, null cone, and transverse rod ratios; positive flow rescaling leaves absolute clock normalization free."
    consequence: "Density and dimensionless phases do not entail conformal shape, rod calibration, or an absolute clock."
  - witness_id: "SEP-04-SIGNATURE-NATURALITY"
    witness_mode: "same_premise_signature_pair_near_degeneracy_and_fixed_point_naturality"
    same_premise_pair: true
    exact_result: "q_L and q_S share the admitted carriers but have different inertia; q_epsilon approaches degeneracy with no source lower bound; and invariance under the admitted determinant-one diagonal automorphisms forces every symmetric bilinear output to vanish."
    consequence: "Lorentzian signature, uniform nondegeneracy, and a nonzero source-natural bilinear selector are not entailed."
  - witness_id: "SEP-05-ROBUSTNESS-ADMISSIBILITY"
    witness_mode: "same_premise_two_parameter_family"
    same_premise_pair: true
    exact_result: "q_(a,epsilon)=diag(-1,e^(2a),e^(-2a),epsilon^2) keeps the admitted source carriers fixed while changing fixed-covector classification and transverse ratios, with inverse conditioning diverging as epsilon^(-2)."
    consequence: "Unique cone selection, observable-preserving gauge, rod comparison, uniform robustness, and physical admissibility are not certified."
p6_witness_family_conclusion: "SEP-02 through SEP-05 furnish the same-premise non-entailment mechanism; SEP-01 independently blocks a proposed identity between the available characteristic object and a Lorentzian null cone."

composition_review:
  logical_form: "The certification predicate is conjunctive. Under its explicit interface, certification requires both sufficient local response rank and single-valued source entailment of the required P6 outputs."
  proof_steps:
    - "The fixed P5 amplitude-factorized branch has differential rank at most one, so it fails any declared requirement for two or more independent local response directions."
    - "The fixed P6 premise signature admits structural mismatch and same-premise separating completions, so the listed geometry outputs are not single-valued consequences of that signature."
    - "Failure of either necessary condition blocks certification; here both failures are documented for their exact scopes."
    - "Therefore the unchanged P5-P6 package cannot be certified as a unique source-natural robust operationally calibrated unscoped Lorentzian geometry or lawful P7 input."
  composition_kind: "conjunction_of_independent_necessary_condition_failures"
  literal_map_composition_claimed: false
  exhaustive_global_dichotomy_claimed: false
  p6_non_entailment_alone_blocks_uniqueness: true
  p5_rank_clause_adds_response_dimension_obstruction: true
  result_scope: "exact fixed-package certification status only"

what_the_result_proves:
  - "The P5 factor-through-amplitude reconstruction differential has rank at most one under the displayed differentiability and factorization hypotheses."
  - "The fixed P6 premise package does not entail the listed causal, conformal, scale, signature, rod, clock, naturality, or conditioning outputs under the declared completion and output-equivalence semantics."
  - "The unchanged combined package fails the stated certification interface for a unique source-natural robust operational Lorentzian geometry."
  - "Gate B remains zero of eight and no lawful unscoped P7 effective-geometry input exists."
  - "The exact unchanged P5 geometry-support route and the P6-to-P7 promotion route remain locally frozen."

what_the_result_does_not_prove:
  - "It does not edit or complete canonical ontology and does not adopt or reject a source law."
  - "It does not derive physical time, locality, causality, a cone, a conformal class, metric scale, clocks, rods, M_src, unscoped g_eff, or a physical metric."
  - "It does not derive matter coupling, stress-energy semantics, an action, Einstein equations, or benchmark recovery."
  - "It does not revoke, rename in place, or expand the protected historical ScopedMetricStructureRecord_src or its exact g_eff^{GSC-cand} legacy alias."
  - "It does not prove that no arbitrary choice function or externally supplied metric can be written down; it proves that the required output is not entailed by the fixed source package."
  - "It does not rule out a source-derived quotient, operational protocol, robust variation law, or richer source ontology supplied in a future authorized packet."
  - "It is not a global no-go theorem, global theory rejection, future-source-extension impossibility result, completed derivation, publication, or Gate Chair verdict."
  - "It does not turn same-context internal review or validator success into theorem truth, independent replication, human-expert review, or proof authority."

