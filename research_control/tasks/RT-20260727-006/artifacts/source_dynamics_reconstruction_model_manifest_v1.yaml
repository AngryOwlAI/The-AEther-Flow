    expected: "determinant is -1 while the rod ratio varies"
  - control_id: "CTRL-P6-SIGNATURE"
    calculation: "inertia of q_L and q_S"
    expected: "equal absolute determinant with one versus two negative directions"
  - control_id: "CTRL-P6-CONDITIONING"
    calculation: "determinant and inverse conditioning of q_epsilon"
    expected: "determinant tends to zero and inverse conditioning diverges"
