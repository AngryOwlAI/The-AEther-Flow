    preserved_limit: "No physical or empirical meaning may be inferred from the formal score or its sign."

  - audit_id: "CEA-03-UNITS-AND-DEGREE"
    dimension: "units_and_degree"
    question: "Are cross-sector units, homogeneous degree, density weight, or multiplicity silently made compatible?"
    exact_finding: "All three audited forms are explicitly degree one with density weight zero, so positive covector rescaling acts commonly. Positive independent unit conversions change Q_ray but not Q_sign. The repaired record must state that Q_ray is formal fixed-trivialization syntax; physical cross-sector units and multiplicities remain unresolved."
