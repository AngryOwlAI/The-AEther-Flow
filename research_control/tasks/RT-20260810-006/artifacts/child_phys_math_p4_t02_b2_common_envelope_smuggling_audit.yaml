    status: "CORRECT_ON_THE_DECLARED_DOMAIN"

new_mathematical_payload:
  payload_id: "LEM-V22-P4T02-B2-SPLIT-RESPONSE-IMAGE-RANK-001"
  type: "response-image rank lemma and counterexample to the stated independent-ratio count"
  statement: "For the exact split candidate, im(Resp_prin)=H={r in R^3:r_R+r_D=2r_S}, rank(Resp_prin)=2, ker(Resp_prin)=ann(span{u,z}), and dim ker(Resp_prin)=2. The projectivized ray image therefore has dimension one, not two."
  proof:
    forward: "Writing a=k(u) and b=k(z) gives Resp_prin(k)=(a+epsilon b,a,a-epsilon b), hence r_R+r_D=2r_S."
    converse: "Because u and z are linearly independent, arbitrary a and b are realized by some k; every r in H is obtained with a=r_S and b=(r_R-r_D)/(2 epsilon)."
    rank: "H is a two-dimensional plane and V* is four-dimensional, so rank is two and the kernel has dimension two."
    projective_dimension: "On D, common positive projectivization removes one dimension from the two-dimensional nonzero image. The oriented projective image is one-dimensional; the sign of p_S is additional discrete data, not a second continuous ratio."
  exact_parameterization: "Let a=k(u)=p_S(k), t=epsilon k(z)/k(u)=(p_R-p_D)/(2p_S), and sigma=sign(a). Then Resp_prin(k)=a(1+t,1,1-t), and division by the allowed positive scale |a| gives Q_ray(k)=[sigma(1+t,1,1-t)]_+. Thus p_R/p_S=1+t and p_D/p_S=1-t are determined by the single continuous ratio t; sigma is the surviving discrete orientation sign. On Gamma_intersection, sigma=+1 and |t|<1."
  sign_orbit_image:
    statement: "Only six of the eight ordered nonzero sign orbits occur on the exact response image."
    positive_a_patterns: ["-++ for t<-1", "+++ for -1<t<1", "++- for t>1"]
    negative_a_patterns: ["+--", "---", "--+"]
    excluded_patterns: ["+-+", "-+-"]
    reason: "The identity r_R+r_D=2r_S prevents the middle component from having the opposite sign when the two outer components share a sign."
  impact:
    preserved: "Both quotient maps and both all-positive preimage identities remain correct."
    defect: "The manuscript, record, fusion notes, and handoff state that Q_ray retains two independent relative response ratios. On the actual candidate image it retains only one independent projective parameter."
    repair_scope: "Keep the existing Q_ray codomain if desired but record im(Q_ray) inside P^+(H), replace the two-independent-ratios statement by one continuous parameter t plus the discrete sign sigma, and record the six-orbit Q_sign image."

