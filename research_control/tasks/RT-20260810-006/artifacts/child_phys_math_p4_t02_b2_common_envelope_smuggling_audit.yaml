  audit_id: "AUDIT-V22-P4T02-B2-QUOTIENT-EQUIVALENCE-001"
  response_ray:
    response_space: "(R minus {0})^3"
    group: "Delta R_{>0}, the diagonal common-positive-scale subgroup"
    relation: "r ~_ray r' iff r'=a r for one a>0 shared by all three coordinates"
    equivalence_check: "Reflexivity uses a=1, symmetry uses a^{-1}, and transitivity uses multiplication."
    fixed_representative_status: "Well-defined for the explicitly fixed p_R,p_S,p_D representatives."
    independent_scale_status: "Not invariant under p_s->a_s p_s unless the a_s are coherently reduced to one common scale."
  sign_orbit:
    response_space: "(R minus {0})^3"
    group: "G_+=(R_{>0})^3 acting componentwise"
    relation: "r ~_sign r' iff r'_s=a_s r_s for positive a_s independently in each sector"
