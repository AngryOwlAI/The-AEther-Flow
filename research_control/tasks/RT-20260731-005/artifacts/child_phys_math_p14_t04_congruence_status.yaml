mathematical_recommendation:
  recommended_status_code: "INTERPRETIVE_TARGET_BENCHMARK_REPRESENTATIVE_OBSERVER_STRUCTURE"
  recommendation_strength: "entailed_within_the_fixed_canonical_and_dependency_scope"
  mathematical_type: "A chosen smooth future-directed unit timelike vector field u on a common target-spacetime domain, normalized by g(u,u) = -c^2."
  physical_role_at_current_scope: "An observer-family representative used to decompose the already-fixed GR solution into rest-space and congruence-relative kinematic quantities."
  independent_dynamical_status: "not_part_of_the_current_exact_GR_dynamical_field_content"
  pure_gauge_status: "not_established"
  source_dynamic_selection_status: "not_established"
  source_identity_status: "u_is_not_identified_with_Phi_src"
  rationale: >-
    The canonical target equations and universal matter coupling depend on g and
    the ordinary matter fields, not on a separately varied u.  Canonical geometry
    explicitly permits different natural congruences for different target-side
    questions.  The source slot is unresolved, P5-T08 provides no positive local
    geometry input, and P14-T03 forbids converting target independence or source
    purity into positive physical provenance.  Hence representative language is
    supported, while pure-gauge, source-selected, and independent-field language
    each exceeds the evidence.

alternative_assessment:
  interpretive:
    disposition: "supported"
    reason: "Canonical geometry calls the congruence a target-side interpretive dictionary subordinate to the single Einsteinian effective law."
  representative:
    disposition: "supported_at_target_benchmark_scope"
    reason: "For fixed (M,g,psi), admissible congruence replacement changes the observer decomposition but not the base GR solution, its field equations, or observables that do not include the selected observer family as part of the protocol."
  pure_gauge:
    disposition: "not_warranted"
    reason: "No gauge group or groupoid action, constraint generator, orbit equivalence, action symmetry, quotient configuration space, or source-side gauge meaning has been supplied; moreover observer-relative quantities generally change when u changes."
  dynamically_selected_state:
    disposition: "not_supported_by_current_source_package"
    reason: "There is no typed source evolution with positive local geometry input and no bridge whose output selects u.  A natural target-side choice such as static, comoving, ZAMO-like, or freely falling observers is a question- or protocol-dependent choice, not a source-dynamics theorem."
  independent_dynamical_field:
    disposition: "excluded_from_the_current_exact_GR_benchmark_but_not_globally_impossible_for_future_extensions"
    reason: "The current action and field equations contain no independent u variation, equations, initial data, modes, constraints, stability analysis, coupling, causal cone, or preferred-frame phenomenology.  Calling u a vector field mathematically does not make it an independent physical degree of freedom."

representative_independence_theorem:
  theorem_id: "P14T04-THM-TARGET-BENCHMARK-REPRESENTATIVE-INDEPENDENCE-V1"
  theorem_kind: "task_local_target_benchmark_theorem"
  title: "Target-benchmark representative independence"
  scope: "One fixed exact-GR solution on a common domain and observables whose physical protocol is fixed independently of the auxiliary congruence representative."
  definitions:
    base_solution: >-
      B = (M,g,psi), where g and psi satisfy the Einstein and ordinary-matter
      equations obtained from S_eff[g,psi] on a time-oriented spacetime region O.
    admissible_representatives: >-
      U_O(B) is the set of smooth future-directed unit timelike congruences u on
      O satisfying g(u,u) = -c^2 and any regularity needed by the displayed
      kinematic decomposition.
    extended_dictionary_space: >-
      E_O(B) = {(B,u) : u in U_O(B)} with projection pi(B,u) = B.
    representative_replacement: >-
      R_{u_to_v} maps (B,u) to (B,v) for u,v in U_O(B), leaving M, g, psi,
      boundary data, and the independently specified physical protocol fixed.
    base_observable: >-
      A base observable F is any diffeomorphism-respecting geometric or
      operational functional that factors through pi: F(B,u;P) = F_base(B;P),
      where P is a fixed protocol not defined by the replaceable u.  Examples
      include curvature scalars, causal relations, and proper time or redshift
      for already specified physical worldlines.
  hypotheses:
    H1: "The exact-GR benchmark action is S_eff[g,psi] and contains no independently varied congruence field u."
    H2: "B = (M,g,psi) and its boundary or initial data are held fixed."
    H3: "u and v are both admissible on the same region O; no global congruence existence is presumed beyond O."
    H4: "Matter couples universally to g as in the fixed benchmark and has no additional coupling to u or v."
    H5: "The source slot Phi_src is not identified with either u or v, and no source-to-congruence bridge is assumed."
    H6: "The compared base observable uses the same independently specified physical protocol P before and after representative replacement."
  statement:
    - "Replacing u by v leaves the Euler-Lagrange equations for g and psi, and the fact that B solves them, unchanged."
    - "For every base observable F that factors through pi, F(B,u;P) = F(B,v;P)."
    - "The metric causal cones, curvature tensors, universal matter coupling, and proper-time or null-propagation predictions for the same fixed protocol are therefore representative-independent."
    - "The tensors h[u], a[u], theta[u], sigma[u], omega[u], observer-measured energy, relative velocity, and electric or magnetic curvature splits need not equal their v-relative counterparts."
    - "Consequently the current exact-GR benchmark supports representative independence of base solution content, not equality of all observer-relative descriptions and not a source-side gauge theorem."
  proof_sketch:
    - "By H1 and H4, u is absent from the benchmark variational functional and its matter-coupling rule.  R_{u_to_v} leaves every varied field and all fixed data unchanged, so the field equations and solution status are identical."
    - "By definition, each base observable factors as F_base composed with pi.  Since pi(B,u) = B = pi(B,v), the factorization gives F(B,u;P) = F(B,v;P)."
    - "The observer projector and kinematic split contain u explicitly, so replacing u by v generally changes them.  This supplies the required exception and prevents the result from being overread as equality of observer-indexed measurements."
  status: "proved_conditionally_from_the_displayed_hypotheses_at_task_local_scope"

observer_relative_exceptions:
  - exception_id: "different_physical_observer_protocols"
    statement: "If u and v specify different detector or observer worldlines, changing u changes the physical protocol rather than merely its representative label; their measured energies, velocities, accelerations, redshifts, or tidal splits may differ without changing the base GR solution."
  - exception_id: "matter_selected_four_velocity"
    statement: "A fluid four-velocity may be selected by target-side matter equations and initial data.  That physical matter state is not evidence that the generic interpretive congruence is selected by Phi_src."
  - exception_id: "geometry_selected_natural_family"
    statement: "Static, comoving, ZAMO-like, or freely falling congruences can be natural or unique after target-side symmetry, matter, boundary, or protocol conditions are imposed.  Such target-side conditional selection is not a source-side selection law."
  - exception_id: "local_domain_only"
    statement: "The theorem applies on a common domain admitting both congruences; it does not prove global existence, global uniqueness, hypersurface orthogonality, or a common foliation."

why_this_is_not_a_gauge_theorem:
  - "The theorem defines a limited representative relation by equality of the fixed base solution; it does not exhibit a symmetry action on a source or target configuration space."
  - "No first-class constraint, Noether identity, gauge generator, orbit space, or proof that all physical observables separate gauge orbits is provided."
  - "Observer-indexed quantities can distinguish u from v because the observer family may be part of the physical protocol."
  - "Phi_src has no adopted gauge meaning, so target representative independence cannot be transported to the source by analogy."

