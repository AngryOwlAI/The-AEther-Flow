status_matrix:
  interpretive:
    disposition: "SUPPORTED"
    precise_meaning: >-
      The congruence supplies a disciplined observer-based reading of the
      historical flow vocabulary inside the already adopted target metric
      geometry.
    source_support:
      - "SRC-GEOMETRY"
      - "SRC-FOUNDATIONS"
    blocked_overread: >-
      Interpretive usefulness does not establish a source derivation, a
      physical substrate identity, emergence, or empirical novelty.
  observer_representative:
    disposition: "SUPPORTED_WITH_TARGET_SCOPE_QUALIFIER"
    precise_meaning: >-
      For a fixed exact-GR target solution, different admissible congruences
      can represent different observer families and decompositions without
      changing the underlying metric and matter solution.
    source_support:
      - "SRC-GEOMETRY"
      - "SRC-P14-T03"
    blocked_overread: >-
      Representative independence of the underlying target solution does not
      imply that all observer-indexed readings, trajectories, rest spaces, or
      kinematic tensors are identical.
  pure_gauge:
    disposition: "NOT_ESTABLISHED_AND_NOT_REQUIRED_FOR_CURRENT_BENCHMARK"
    precise_meaning: >-
      No configuration space, gauge group or groupoid, equivalence relation,
      quotient, gauge-invariant observable algebra, constraint analysis, or
      operational redundancy theorem for u is adopted.
    philosophical_reason: >-
      A change of observer family can change proper acceleration, measured
      energy, rest-space decomposition, expansion, shear, and vorticity. These
      are lawful observer-relative physical readings, not automatically
      redundant descriptions. Calling every such change pure gauge would
      confuse invariance of the underlying GR solution with identity of
      observer situations.
    blocked_overread: >-
      Diffeomorphism covariance or auxiliary status alone does not prove that
      u is pure gauge.
  dynamically_selected:
    disposition: "NOT_ESTABLISHED_BY_CURRENT_SOURCE_PACKAGE"
    precise_meaning: >-
      No source state, source evolution law, selection functional, bridge, or
      uniqueness theorem maps Phi_src or other source data to a target
      congruence.
    contextual_qualification: >-
      A congruence can be natural relative to target-side symmetry, matter
      flow, an apparatus trajectory, or a posed measurement problem. Such
      conditional naturalness is not a substrate-derived dynamic selection.
    blocked_overread: >-
      Static, comoving, ZAMO-like, geodesic, or detector-adapted choices do not
      establish one universal preferred AEther frame.
  independent_dynamical_field:
    disposition: "NOT_PRESENT_IN_CURRENT_EXACT_GR_BENCHMARK"
    precise_meaning: >-
      The current action and Einstein equations contain no independent u
      variation, u equation of motion, u stress tensor, extra mode, causal
      cone, matter coupling, or preferred-frame observable sector.
    scope_guard: >-
      This is a status statement about the current benchmark, not a theorem
      that no future extended theory could introduce a new vector or
      congruence field.
    blocked_overread: >-
      The kinematic tensors derived from an observer field are not evidence
      that the observer field is an independently propagating physical
      degree of freedom.

representative_independence_theorem_candidate:
  theorem_id: "P14T04-THM-TARGET-SOLUTION-REPRESENTATIVE-INDEPENDENCE"
  recommended_name: "Target-solution independence under observer-congruence replacement"
  assumptions:
    - >-
      X = (M,g,psi) is a fixed solution of the exact-GR benchmark with its
      ordinary matter content psi.
    - >-
      U_X is the nonempty set of admissible smooth future-directed unit
      timelike observer congruences on the declared target domain.
    - >-
      u is auxiliary observer structure: it is not varied in the benchmark
      action, is not an additional component of psi, and has no independent
      matter coupling or field equation.
    - >-
      For each u in U_X, D_u denotes X together with the u-relative rest-space
      projector and kinematic decomposition.
  construction:
    projection: "pi(D_u) = X"
    representative_relation: >-
      D_u is target-solution-equivalent to D_v exactly when both project to
      the same fixed X. This is an equivalence for underlying benchmark
      solution content, not an asserted physical gauge quotient of observer
      experiences.
  conclusion: >-
    For every u and v in U_X, the Einstein equation residual, the benchmark
    action evaluated on X, and every covariant observable functional that
    depends only on X have the same value in D_u and D_v. Replacing u by v
    changes only the observer-relative decomposition and quantities explicitly
    indexed by the chosen observer family.
  proof_strategy: >-
    The benchmark action and field equations depend on g and psi but not on
    the auxiliary u. The projection from either augmented description returns
    the same X, so any functional that factors through that projection is
    equal. No equality follows for functionals that depend explicitly on u.
  essential_nonconclusions:
    - "u and v are not thereby pure-gauge configurations."
    - "Observers following u and v need not record the same measurements."
    - "The congruences need not be related by a diffeomorphism or symmetry."
    - "No source-side equivalence relation or Phi_src semantics is supplied."
    - "No global existence or uniqueness theorem for admissible congruences is supplied."
    - "No source-to-congruence selection or emergence theorem is supplied."
  terminology_guard: >-
    Public prose should call this target-solution representative independence,
    not congruence gauge invariance, unless a later theorem defines and proves
    the stronger gauge claim.

