    admissible, generally non-unique target-side observer-representative used
    for interpretation and kinematic decomposition; it is not Phi_src, not
    presently source-selected, not established as pure gauge, and not an
    independent dynamical field.
  preferred_explanatory_statement: >-
    Different static, comoving, ZAMO-like, freely falling, or detector-adapted
    congruences can be natural for different target-side questions. Changing
    that observer family leaves the fixed GR metric and matter solution
    unchanged while changing observer-relative decompositions and readings.
  required_qualifiers:
    - "Say target-side whenever u or its congruence kinematics are meant."
    - "Say unresolved source slot whenever Phi_src is meant."
    - "Qualify representative independence as independence of fixed benchmark solution content."
    - "State that GR has not been derived from the source package."
    - "State that no source-to-congruence bridge or unique preferred frame exists in current evidence."
  forbidden_public_phrases_without_new_evidence:
