      eliminable_now: false
      adoption_status: "proposal-only"
      falsifier: "Every construction imports metric-equivalent data or has identically degenerate reduced principal determinant."
    - assumption_id: "B1-A03"
      proposition: "Two dimensionless source ratios can type two proposal-only P7 response-token channels."
      cost_class: "new_ontology_primitive_candidate"
      eliminable_now: false
      adoption_status: "proposal-only"
      falsifier: "The response bridge requires target detector, clock, rod, location, or geometry semantics."
    - assumption_id: "B1-A04"
      proposition: "A nonempty local patch has q6 nonzero and rank d(q1/q6,q2/q6) equal to two."
      cost_class: "candidate_domain_restriction"
      eliminable_now: false
      adoption_status: "testable-restriction"
      falsifier: "The declared regular patch is empty or the quotient differential has rank below two everywhere."
