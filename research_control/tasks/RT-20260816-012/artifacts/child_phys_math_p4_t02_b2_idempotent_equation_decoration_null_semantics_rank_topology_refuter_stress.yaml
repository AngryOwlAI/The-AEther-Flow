ten_dimension_stress_audit:
  required_dimension_count: 10
  adjudicated_dimension_count: 10
  all_dimensions_decisively_adjudicated: true
  dimensions:
    - dimension_id: "fixed_candidate_and_rt011_audit_preservation"
      local_result: "PRESERVED_NO_SCIENCE_DELTA"
      exact_evidence: "All RT009 and RT011 construction, child, conflict-review, fusion, control, disposition, and model hashes are bound. The fixed candidate remains mathematically well formed, narrowly source_pure_as_written, and semantically a proposal-only new ontology primitive."
      consequence: "This stress attacks only stronger natural-selection, robustness, and bridge-force readings."
      falsifier: "Any altered predecessor byte, changed audit verdict, changed semantic classification, or reconstructed candidate would trigger FB-01 or FB-02."
    - dimension_id: "null_vs_identity_natural_endpoint_nonselection"
      local_result: "SCOPED_OBSTRUCTION_CONFIRMED"
      exact_evidence: "The commutant of the full GL(6,R) conjugation action is the scalar algebra. Its idempotents are exactly zero and identity, both restriction-natural. The complement map P maps to I-P is a natural involution exchanging them."
      consequence: "Full-frame naturality supplies two endpoints and no rule selecting zero over identity."
      falsifier: "A current-source-derived, full-arrow-natural law that excludes identity and uniquely selects zero without target or output-relative input would overturn this dimension."
    - dimension_id: "semantic_relabeling_invariance"
      local_result: "SEMANTIC_FORCE_ABSENT"
      exact_evidence: "Swapping the external occurrence and nonoccurrence readings changes no carrier, equation, transport, idempotency predicate, rank control, or exact check. Complement also exchanges the two extreme algebraic readings while preserving the idempotent carrier and transport."
      consequence: "The algebra alone assigns neither occurrence nor nonoccurrence semantics."
      falsifier: "An independently sourced observable or law whose value changes under the semantic swap and whose provenance does not use desired output would distinguish the readings."
    - dimension_id: "inert_expansion_and_old_language_conservativity"
      local_result: "CONDITIONAL_ONLY"
      exact_evidence: "If no old equation, coefficient, constraint, gauge rule, or lawful reduction reads P, then every old law factors through U and every old model has the zero expansion. Old-language model conservativity follows exactly under that hypothesis."
      consequence: "Conservativity gives no P-sensitive old-source force and does not derive inertness or semantics."
      falsifier: "An old rule that reads P, or an old model without an admissible expansion, invalidates the conservativity proof and moves the proposal outside the fixed inert candidate."
    - dimension_id: "inert_or_bridge_force_dichotomy"
      local_result: "SCOPED_OBSTRUCTION_CONFIRMED"
      exact_evidence: "For any proposed bridge B on the decorated carrier, B=b composed with U implies B(d,0)=B(d,I) on the same U-fibre. If B distinguishes them, then no such factorization exists and B uses P or another added primitive."
      consequence: "The unchanged candidate is either inert and bridge-force-free, or P-sensitive and no longer derived solely from the unchanged reduct."
      falsifier: "A single-valued bridge that both factors through U and takes different values on two objects with the same U-image would refute the elementary factorization theorem."
    - dimension_id: "exact_idempotent_norm_topology_and_rank_metric_scope"
      local_result: "EXACT_ALGEBRA_PRESERVED_PHYSICAL_TOPOLOGY_BLOCKED"
      exact_evidence: "For an induced operator norm, nonzero idempotents have norm at least one. If exact idempotents P and Q satisfy norm(P-Q)<1, then Q restricted to im(P) and P restricted to im(Q) are injective, so their ranks agree. Yet rational rotation projectors P_t approach P_0 in operator norm while rank(P_t-P_0)=2 for every nonzero t."
      consequence: "Different ranks are norm-separated, but the rank metric makes even norm-near same-rank projectors discretely separated. It is not a sourced physical or perturbative topology."
      falsifier: "Two exact idempotents of different rank at induced operator-norm distance below one would refute rank separation; an independently sourced topology and stability theorem could establish a different physical result."
    - dimension_id: "approximate_idempotency_variation_boundary"
      local_result: "EXTERNAL_CONTROL_ONLY"
      exact_evidence: "For 0<epsilon<1, A_epsilon=epsilon I is not idempotent, has norm epsilon, and has defect norm epsilon(1-epsilon). It approaches zero with vanishing defect while remaining outside Adm_occ."
      consequence: "Relaxing exact idempotency destroys endpoint isolation in this external control, but no approximate element is imported into the fixed law."
      falsifier: "An exact idempotent A_epsilon=epsilon I for a tested epsilon strictly between zero and one would refute the control; adopting a tolerance law would instead define a new candidate."
    - dimension_id: "image_kernel_quotient_and_rank_descendant_factorization"
      local_result: "SCOPED_OBSTRUCTION_CONFIRMED"
      exact_evidence: "On one U-fibre, im(0)=0, ker(0)=W, W/ker(0)=0, rank(0)=0, while im(I)=W, ker(I)=0, W/ker(I)=W, rank(I)=6. Each raw descendant is nonconstant on the fibre and therefore does not factor through U. Any composite bridge factors only if it erases all P-sensitive distinction."
      consequence: "No nontrivial image, kernel, quotient, rank, sector, or response descendant is simultaneously P-sensitive and source-reduct-factored."
      falsifier: "A nonconstant descendant on a U-fibre that nevertheless equals a single-valued function of U would refute factorization logic."
    - dimension_id: "full_GL6_naturality_and_nontrivial_reduction"
      local_result: "NONTRIVIAL_OUTPUT_RELATIVE_REDUCTION_REJECTED"
      exact_evidence: "Every nontrivial idempotent has a proper centralizer in GL(6,R); for P=diag(1,0,0,0,0,0), the shear I+E_21 moves P. Restricting arrows after selecting P to its stabilizer manufactures naturality relative to the output."
      consequence: "No nontrivial projector is natural under the fixed full action, and output-relative stabilizers supply no independent source provenance."
      falsifier: "A proper arrow reduction defined independently from P by registered source data, with a uniquely invariant nontrivial idempotent and no desired-output dependence, would require a new audit rather than refute the full-GL(6) statement."
    - dimension_id: "source_provenance_physical_semantics_and_p4_relevance"
