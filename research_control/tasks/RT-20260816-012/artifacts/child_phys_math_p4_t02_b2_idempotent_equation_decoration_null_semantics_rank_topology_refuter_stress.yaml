new_exact_mathematical_results:
  result_count: 6
  results:
    - result_id: "THM-PM-RT012-001-INERT-BRIDGE-FACTORIZATION-DICHOTOMY"
      result_type: "theorem"
      name: "Inert-or-bridge-force factorization dichotomy"
      hypotheses:
        - "U:X_OCC to D_source forgets P."
        - "Old laws are inert and hence factor through U."
        - "B:X_OCC to Y is a proposed bridge."
      statement: "If B=b composed with U, then B is constant on each U-fibre and has no P-sensitive bridge force. If B differs on any same-reduct pair, then B does not factor through U and requires P or another extension primitive."
      proof: "For U(x)=U(x'), factorization gives B(x)=b(U(x))=b(U(x'))=B(x'). The contrapositive gives the second clause."
      falsifier: "A single-valued b and same-reduct x,x' with b(U(x)) not equal to b(U(x')) would refute function composition."
      burden_effect: "locally_obstructs_unchanged_candidate_bridge_force"
    - result_id: "COR-PM-RT012-002-ENDPOINT-DESCENDANT-NONFACTORIZATION"
      result_type: "corollary"
      name: "Zero-identity descendant fibre obstruction"
      hypotheses:
        - "W is real six-dimensional."
        - "P=0 and P=I are two admissible expansions of one old reduct."
      statement: "The raw image, kernel, quotient W/ker(P), rank, and ordered splitting descendants are nonconstant on one U-fibre and therefore do not factor through U. Any factored composite of them must erase their endpoint distinction."
      proof: "At zero their dimensions are image zero, kernel six, quotient zero, rank zero. At identity they are image six, kernel zero, quotient six, rank six. Apply THM-PM-RT012-001."
      falsifier: "Equality of all listed descendants at zero and identity, or a nonconstant same-fibre descendant equal to one function of U, would refute the corollary."
      burden_effect: "locally_obstructs_descendant_bridge"
    - result_id: "THM-PM-RT012-003-OPERATOR-NORM-RANK-SEPARATION"
      result_type: "theorem"
      name: "Exact-idempotent operator-norm rank separation"
      hypotheses:
        - "P and Q are exact idempotents on a finite-dimensional normed vector space."
        - "The matrix norm is the induced operator norm."
      statement: "If norm(P-Q)<1, then rank(P)=rank(Q). In particular, zero and identity are norm-isolated among exact idempotents by open radius-one balls."
      proof: "If x is in im(P) and Qx=0, then x=Px=(P-Q)x, so norm(x) is at most norm(P-Q) times norm(x), forcing x=0. Thus Q restricted to im(P) is injective and rank(P) is at most rank(Q). Interchanging P and Q gives equality. Taking Q=0 or Q=I gives endpoint isolation; equivalently every nonzero idempotent has spectral radius and operator norm at least one."
      falsifier: "Two exact idempotents of unequal rank at induced operator-norm distance strictly below one would refute the theorem."
      burden_effect: "narrows_exact_topology_without_physical_credit"
    - result_id: "CTR-PM-RT012-004-RATIONAL-ROTATION-RANK-METRIC"
      result_type: "counterfamily"
      name: "Rational norm-continuous exact projectors with persistent rank distance"
      hypotheses:
        - "For rational t, set u=(1-t^2)/(1+t^2), v=2t/(1+t^2), and let P_t be the rank-one orthogonal projector onto (u,v,0,0,0,0)."
      statement: "P_t is exact idempotent of rank one. For t nonzero, rank(P_t-P_0)=2 and the Euclidean operator norm of P_t-P_0 is abs(v), which tends to zero with t."
      proof: "u^2+v^2=1 gives P_t^2=P_t. On the moving two-plane D_t=P_t-P_0 has trace zero, nonzero determinant -v^2, and D_t^2=v^2 I, so its rank is two and operator norm abs(v)."
      falsifier: "A nonzero tested rational t with failed idempotency, rank difference other than two, or operator norm different from abs(v) would refute the family."
      burden_effect: "refutes_rank_metric_as_perturbative_topology"
    - result_id: "CTR-PM-RT012-005-APPROXIMATE-IDEMPOTENT-BOUNDARY"
      result_type: "external_countercontrol"
      name: "Approximate-idempotent endpoint de-isolation under a relaxed law"
      hypotheses:
        - "For 0<epsilon<1, A_epsilon=epsilon I."
      statement: "A_epsilon is not an exact idempotent, norm(A_epsilon)=epsilon, and norm(A_epsilon^2-A_epsilon)=epsilon(1-epsilon), so approximate solutions approach zero with vanishing defect."
      proof: "A_epsilon^2-A_epsilon=-epsilon(1-epsilon)I and the Euclidean operator norm of a scalar identity is the scalar absolute value."
      falsifier: "Exact idempotency for an epsilon strictly between zero and one, or failure of the displayed defect identity, would refute the control."
      burden_effect: "marks_external_variation_boundary_only"
    - result_id: "LEM-PM-RT012-006-NATURAL-COMPLEMENT-SYMMETRY"
      result_type: "lemma"
      name: "Natural complement symmetry of the exact idempotent carrier"
      hypotheses:
        - "P is an exact idempotent and transport is pullback plus conjugation."
      statement: "C(P)=I-P is an involutive natural automorphism of the idempotent carrier; it swaps zero with identity, image with kernel, and rank r with rank 6-r."
      proof: "(I-P)^2=I-P, C(C(P))=P, and C(SPS inverse)=S(I-P)S inverse. The image-kernel and rank statements follow from the projector splitting."
      falsifier: "An admitted transport for which C(T(P)) differs from T(C(P)), or an idempotent whose complement is not idempotent, would refute the lemma."
      burden_effect: "strengthens_endpoint_nonselection_and_semantic_symmetry"

