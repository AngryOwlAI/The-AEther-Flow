  refuter_class: "scoped_obstruction"
  result_scope: "The unchanged RT009 idempotent-decoration candidate under RT011's narrow source-pure-as-written and unadopted new-ontology-primitive boundary, with the full GL(6,R) conjugation action and inert old-source reduct fixed."
  exact_result: "Full GL(6,R) naturality fixes exactly zero and identity, and the natural complement involution exchanges them, so naturality and algebra do not select the declared null endpoint or its occurrence semantics. If every old law and proposed bridge factors through the forgetful reduct U, then it is constant on each U-fibre and cannot acquire nontrivial force from P. Conversely, image, kernel, quotient, rank, and any nontrivial sector descendant distinguish the same-reduct endpoints P=0 and P=I, so any bridge retaining that distinction does not factor through U and requires the new decoration or an additional source law. Exact operator-norm isolation of different-rank idempotents is algebraic, while fixed-rank exact projectors form norm-continuous families on which rank distance stays positive. Approximate idempotents show a nearby relaxed-law control but remain outside the candidate. This is a local obstruction to the unchanged candidate's claimed natural nontrivial attachment and source-factored bridge force, not a global no-go or future-extension impossibility."
  obstruction_id: "OB-V22-P4T02-B2-IDEMPOTENT-EQUATION-DECORATION-NULL-SEMANTICS-RANK-TOPOLOGY-BRIDGE-FORCE-001"
