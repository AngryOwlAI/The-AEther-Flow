decisive_reasoning:
  - reasoning_id: "DR-01"
    theorem: "full_frame_endpoint_nonselection"
    statement: "An endomorphism commuting with every GL(6) frame change is scalar, and a scalar idempotent is zero or identity. Both endpoints are natural; no full-arrow naturality condition chooses the null endpoint."
  - reasoning_id: "DR-02"
    theorem: "complement_involution"
    statement: "P maps to I-P by a conjugation-natural involutive isometry of the exact idempotent carrier, swapping zero and identity and exchanging image with kernel."
  - reasoning_id: "DR-03"
    theorem: "semantic_relabeling_nonforce"
    statement: "Changing the semantic labels attached to P leaves the entire algebraic construction and every validation check invariant, so algebra does not derive occurrence meaning."
  - reasoning_id: "DR-04"
    theorem: "inert_or_bridge_force_dichotomy"
    statement: "If all old-language laws ignore P, the expansion is conservative but P contributes no bridge force. If a downstream law distinguishes P, it depends on the new primitive and must independently satisfy provenance and naturality."
  - reasoning_id: "DR-05"
    theorem: "descendant_fibre_factorization"
    statement: "A descendant factors through the forgetful source reduct exactly when it is constant on each decoration fibre. Rank, image, kernel, quotient, and faithful projector data distinguish zero from identity and fail this test."
  - reasoning_id: "DR-06"
    theorem: "topology_scope"
    statement: "Exact nonzero idempotents are norm-separated from zero, while fixed-rank conjugate idempotents can approach one another in norm with positive rank distance. Approximate idempotents need a new tolerance and variation law."

minimal_countermodels:
  - countermodel_id: "CM-01"
    name: "same_reduct_zero_identity"
    data: "The same rank-six source equation datum supports decorations P=0 and P=I."
    defeated_claim: "Naturality or current-source data uniquely selects the null decoration."
    falsifier: "An independently current-source-defined law excluding I while admitting 0 on the full arrow class."
  - countermodel_id: "CM-02"
    name: "small_shear_rank_distance"
    data: "P_t=g_t P_0 g_t^{-1} with g_t=I+tE_12 is exactly idempotent, P_t approaches P_0 entrywise and in norm, but rank(P_t-P_0)=1 for every nonzero t."
    defeated_claim: "Rank distance is a perturbative or physical topology."
    falsifier: "A source-derived variation topology whose metric is proved equivalent to rank distance on the admitted family."
  - countermodel_id: "CM-03"
    name: "approximate_zero_family"
    data: "Q_epsilon=epsilon I approaches zero while Q_epsilon squared minus Q_epsilon equals epsilon(epsilon-1)I and is nonzero for 0<epsilon<1."
    defeated_claim: "Exact idempotency alone supplies robustness under approximate source variation."
    falsifier: "A source-derived tolerance, projection, or restoration law with quantified stability."

