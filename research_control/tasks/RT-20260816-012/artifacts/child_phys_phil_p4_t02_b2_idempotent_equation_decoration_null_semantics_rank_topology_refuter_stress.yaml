      proof: "The bound canonical artifacts match their fixed hashes, and this child adds only stress conclusions without altering or repairing predecessor material."
      falsifier: "Any changed predecessor hash, rewritten candidate premise, or reclassification of the semantic layer would fail this result."
    - dimension_id: "null_vs_identity_natural_endpoint_nonselection"
      local_result: "nonselection_proved"
      finding: "Full-GL(6) conjugation naturality and exact idempotency leave both zero and identity, and the complement involution exchanges them in the unpointed carrier."
      proof: "A matrix fixed by conjugation under every GL(6) element is scalar; scalar idempotency gives only 0 and I. Both commute with every frame change and restriction."
      falsifier: "An independently source-derived invariant predicate that holds for zero and fails for identity would break the endpoint tie."
    - dimension_id: "semantic_relabeling_invariance"
      local_result: "semantic_force_absent"
      finding: "Occurrence, attachment, and nonoccurrence readings can be reassigned while every algebraic equation, transport statement, and exact check remains unchanged."
      proof: "The semantic labels are absent from the algebraic predicates. Forgetting the labels gives identical models, and complement transports the unpointed endpoint data while preserving idempotency, conjugation, restrictions, and pairwise rank distance."
      falsifier: "A source observable or law whose value changes under the relabeling and whose provenance does not presuppose the desired label would distinguish the readings."
    - dimension_id: "inert_expansion_and_old_language_conservativity"
      local_result: "conditional_only"
      finding: "Old-language conservativity survives exactly while every old law factors through the forgetful reduct and every old model admits an expansion."
      proof: "If U(d,P)=d and each old formula is evaluated as f composed with U, its truth is independent of P; the zero decoration supplies an expansion of each old model."
      falsifier: "An old equation, coefficient, constraint, gauge rule, reduction, or admissibility condition that reads P invalidates the factorization proof."
    - dimension_id: "inert_or_bridge_force_dichotomy"
      local_result: "scoped_obstruction_proved"
      finding: "An inert expansion cannot exert bridge force; any output that distinguishes same-reduct decorations is a new P-reading law and is not inherited from the old reduct."
      proof: "For B:E to Y, factorization B=b composed with U implies B(d,P)=b(d)=B(d,Q). Contrapositively, B(d,P) not equal to B(d,Q) forbids factorization through U and records additional extension-law debt."
      falsifier: "A typed current-source construction of a nonconstant B together with a proof that B factors through U would refute the dichotomy, but those two properties are algebraically incompatible under the stated definitions."
    - dimension_id: "exact_idempotent_norm_topology_and_rank_metric_scope"
      local_result: "exact_algebra_preserved_physical_overread_refuted"
      finding: "The rank metric is discrete on distinct exact idempotents, whereas ordinary matrix norms admit nonconstant continuous exact-idempotent paths within a fixed rank. Neither topology is selected as physical."
      proof: "For P_t=(I+tE_21)P(I-tE_21)=P+tE_21 with P=diag(1,0,0,0,0,0), P_t is idempotent, norm(P_t-P) tends to zero, and rank(P_t-P)=1 for every nonzero t."
      falsifier: "A source-derived perturbation topology and stability theorem connecting admissible source variations to P would support a stronger robustness claim."
    - dimension_id: "approximate_idempotency_variation_boundary"
      local_result: "external_stress_only"
      finding: "Small idempotency defect is not membership in the exact candidate law and supplies no automatic projection, semantics, or robustness."
      proof: "For A_epsilon=epsilon I with 0<epsilon<1, A_epsilon squared minus A_epsilon equals -epsilon(1-epsilon)I, whose norm tends to zero as epsilon tends to zero, yet A_epsilon is not idempotent."
      falsifier: "A separately admitted covariant source law that maps approximate data to exact admissible idempotents with a proved stability modulus would change this boundary."
