      payload_type: "complement_symmetry_theorem"
      name: "Conjugation-natural complement involution on exact idempotents"
      assumptions: "P and Q are exact idempotent endomorphisms of a real rank-six equation fibre, with full GL(6) conjugation, ordinary restriction, and d_rank(P,Q)=rank(P-Q)."
      statement: "C(P)=I-P is an involution that preserves exact idempotency, commutes with conjugation and restriction, is an isometry for d_rank and every norm distance, and swaps zero with identity, image with kernel, and rank r with rank 6-r."
      proof: "(I-P)^2=I-2P+P^2=I-P; C(SPS^-1)=S(I-P)S^-1; C(C(P))=P; C(P)-C(Q)=Q-P; im(I-P)=ker(P), ker(I-P)=im(P), and rank(I-P)=6-rank(P)."
      falsifier: "A claimed counterexample must exhibit an exact idempotent or admitted arrow for which one displayed identity fails; a source selector may break the symmetry but would be additional structure rather than a counterexample."
      novelty_relative_to_rt011: "RT011 recorded two endpoints and endpoint descendants; this theorem identifies one exact automorphism simultaneously preserving the unpointed carrier, arrows, restrictions, pairwise topology, and exchanging all descendant endpoints."
      burden_effect: "obstructs_unpointed_semantic_endpoint_selection"
    - payload_id: "NMP-RT012-PHIL-002"
      payload_type: "reduct_factorization_dichotomy_theorem"
      name: "Inert-or-bridge-force factorization dichotomy"
      assumptions: "E is the fixed expansion model class, U:E to D forgets P, and B:E to Y is any proposed descendant or bridge output."
      statement: "If B factors through U, then B is constant on every reduct fibre and the decoration has no bridge force. If B distinguishes any two expansions with the same reduct, then B does not factor through U and requires a new P-reading source law."
      proof: "If B=b composed with U and U(e_1)=U(e_2), then B(e_1)=b(U(e_1))=b(U(e_2))=B(e_2). The second clause is the contrapositive."
      falsifier: "A map B with both a valid factorization B=b composed with U and unequal values on one U-fibre would falsify the theorem, but equality substitution rules this out."
      novelty_relative_to_rt011: "RT011 proved inert old-language conservativity; this theorem converts that premise into an exhaustive force test for every attempted descendant and identifies the exact extra-law boundary."
      burden_effect: "obstructs_unchanged_candidate_bridge_force"
    - payload_id: "NMP-RT012-PHIL-003"
      payload_type: "descendant_semantic_debt_corollary"
      name: "Projector descendants inherit endpoint-selection debt"
      assumptions: "The same old reduct admits the exact decorations P=0 and P=I."
      statement: "Projector, image, kernel, image quotient, kernel quotient, rank, and any sector or response that distinguishes their endpoint values are nonconstant on a reduct fibre and therefore inherit the unselected semantic and source-provenance debt of P."
      proof: "The endpoint table gives P:0 versus I, im(P):0 versus W, ker(P):W versus 0, W/im(P):W versus 0, W/ker(P):0 versus W, and rank(P):0 versus 6; apply the reduct-factorization dichotomy."
      falsifier: "A descendant proved constant on every reduct fibre does factor through U, but then it cannot transmit decoration-dependent bridge information."
      novelty_relative_to_rt011: "RT011 warned that descendants depend on endpoints; this corollary proves the factorization failure for the complete named descendant list and every nonconstant postprocessing."
      burden_effect: "blocks_projector_or_quotient_bridge_overread"
    - payload_id: "NMP-RT012-PHIL-004"
      payload_type: "exact_versus_approximate_boundary_lemma"
      name: "Vanishing idempotency defect does not extend the exact law"
      assumptions: "The candidate admits exactly P squared equals P and contains no rounding, retraction, noise, or transition rule."
      statement: "There are non-idempotents with arbitrarily small norm and arbitrarily small idempotency defect near an admitted endpoint; hence exact-law membership and approximate robustness are distinct obligations."
      proof: "For A_epsilon=epsilon I, both norm(A_epsilon) and norm(A_epsilon squared minus A_epsilon)=epsilon(1-epsilon) norm(I) tend to zero, but equality A_epsilon squared=A_epsilon fails for every 0<epsilon<1."
      falsifier: "A separately admitted stable covariant retraction from a specified approximate neighborhood to exact idempotents would add, rather than derive from, the missing transition rule."
      novelty_relative_to_rt011: "RT011 compared exact idempotents in two topologies; this lemma stresses variations outside the exact locus without silently changing the candidate law."
      burden_effect: "preserves_finite_variation_robustness_debt"
