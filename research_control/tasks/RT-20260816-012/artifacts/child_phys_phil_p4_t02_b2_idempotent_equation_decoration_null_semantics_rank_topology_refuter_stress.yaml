      payload_type: "pointedness_provenance_lemma"
      name: "A chosen null point is extra structure, not endpoint discovery"
      assumptions: "The unpointed exact idempotent carrier has the complement symmetry and the proposal separately declares s0 to be zero."
      statement: "Naming s0 breaks the zero-identity symmetry by stipulation, but the name alone supplies no source-side reason that zero means attachment, occurrence, or nonoccurrence."
      proof: "The complement involution maps the same unpointed algebraic structure with distinguished zero to the isomorphic unpointed structure with distinguished identity. Only the added pointing distinguishes them, so using the pointing to justify itself is circular."
