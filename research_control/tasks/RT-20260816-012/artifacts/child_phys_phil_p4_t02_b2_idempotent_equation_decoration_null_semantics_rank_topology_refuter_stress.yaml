      local_result: "unselected_debt_inherited"
      finding: "Every raw listed descendant varies across same-reduct zero and identity expansions, so none factors through the unchanged reduct; any constant postprocessing that does factor has no decoration-dependent bridge force."
      proof: "At zero and identity, images are 0 and W_eq, kernels are W_eq and 0, quotients W_eq/im(P) are W_eq and 0, and ranks are 0 and 6. Projector sectors inherit these differences. The reduct-factorization lemma then applies."
      falsifier: "A separately sourced invariant descendant constant on every reduct fibre but still carrying independently defined physical bridge content would evade this candidate-local test."
    - dimension_id: "full_GL6_naturality_and_nontrivial_reduction"
      local_result: "nontrivial_full_natural_reduction_absent"
      finding: "No rank-one through rank-five idempotent is fixed by all GL(6) conjugations, and replacing the full arrow class by its stabilizer is output-relative selection."
      proof: "The full commutant of GL(6) consists of scalars, so an exact globally fixed idempotent has rank 0 or 6. A nontrivial projector is moved by a shear, while its stabilizer is defined only after choosing that projector."
      falsifier: "Independently predeclared source structure reducing the frame group before P is chosen could make a nontrivial projector natural without output-relative filtering."
