new_mathematical_payload:
  - payload_id: "NMP-RT-20260718-024-MATH-001"
    payload_type: "lemma"
    name: "bare_four_object_symmetry_obstruction"
    statement: "On a bare four-element set, every equivalence relation invariant under the full symmetric group is either equality or the universal relation."
    proof: "If no distinct pair is related, the relation is equality. If one distinct pair is related, two-transitivity of S4 sends that pair to every other distinct pair, so every distinct pair is related and the relation is universal."
    implication: "A nondegenerate two-plus-two EqSrc partition cannot be canonical from the bare object set alone. It requires s or equivalent symmetry-breaking source structure. Transporting s under relabeling proves isomorphism of decorated structures, not removal of this burden."
    burden_effect: "narrows_the_arbitrary_label_burden"
    claim_status: "draft/control"
    source_path: "research_control/tasks/RT-20260718-024/artifacts/child_phys_math_eqsrc_quotient_selector_smuggling_audit.yaml"
  - payload_id: "NMP-RT-20260718-024-MATH-002"
    payload_type: "theorem"
    name: "exact_additive_relation_stabilizer"
    statement: "For f=q composed with s:F_src->Z/2Z and r:F_src->Z/4Z, the perturbed profile s_r=s+r induces the same equivalence relation as s if and only if q composed with r is constant on F_src."
    proof: "The forward implication follows because f is surjective with exactly two fibers: any Z/2Z-valued map with the same kernel pair must be f+c for one constant c, hence q(r)=c. The reverse implication follows because adding one common quotient value to both endpoint labels preserves equality."
    cardinality:
      all_profile_shifts: 256
      full_relation_stabilizer: 32
      V_H: 16
      index_of_V_H_in_full_stabilizer: 2
    implication: "V_H is precisely the pointwise quotient-label stabilizer q(r)=0, not the full relation stabilizer. Uniform odd-coset shifts form its other stabilizer coset. The candidate's relative stability and nonmaximality claims are mathematically correct."
    burden_effect: "sharpens_the_variation_class_claim"
    claim_status: "draft/control"
    source_path: "research_control/tasks/RT-20260718-024/artifacts/child_phys_math_eqsrc_quotient_selector_smuggling_audit.yaml"
  - payload_id: "NMP-RT-20260718-024-MATH-003"
    payload_type: "explicit_witness"
    name: "source_only_profile_reassignment_counterfactual"
    statement: "The alternate bijective profile s'=(0,2,1,3) on (A0,A1,A2,A3), with the same G and H, induces classes {A0,A1} and {A2,A3} rather than {A0,A2} and {A1,A3}."
    implication: "Both profiles support the same exact-v3 lifting and the same form of relative-stability theorem. The written framework therefore does not select one partition from source-object cardinality, group structure, or exact-v3 closure alone."
    target_data_used: false
    process_authority_used: false
    burden_effect: "exhibits_profile_selection_underdetermination"
    claim_status: "draft/control"
    source_path: "research_control/tasks/RT-20260718-024/artifacts/child_phys_math_eqsrc_quotient_selector_smuggling_audit.yaml"

