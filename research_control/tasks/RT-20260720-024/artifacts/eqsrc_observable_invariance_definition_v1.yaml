milestone_burden: "Prefer quotient-level physics over arbitrary gauge fixing when lawful."
fixed_input_contract:
  representative_domain: "A nonempty finite set D_X of admissible source-side representatives fixed before evaluation."
  structural_action: "A finite declared structural automorphism group G_X acting on D_X."
  observable_family: "A finite family F_X of task-local source readouts f:D_X->A_f, with each codomain and value rule fixed before evaluation of any representative."
  joint_readout: "O_F(d)=(f(d))_{f in F_X}."
  orbit_quotient: "q_X:D_X->D_X/G_X."
  target_exclusions:
    - "target atlas"
    - "target metric"
    - "benchmark success"
    - "candidate reconstruction"
    - "validation status"
    - "registry metadata authority"
criteria:
  orbit_factorization:
    statement: "O_F factors uniquely through q_X iff O_F(g.d)=O_F(d) for every g in G_X and d in D_X."
    scope: "within each declared structural orbit"
  all_choice_equality:
    statement: "Because D_X is nonempty, every admissible representative has the same joint readout iff the image of O_F is a singleton, equivalently the induced quotient readout is constant on D_X/G_X."
    nonempty_guard_required: true
  equivariance_guard:
    statement: "For a G_X-action on the codomain, equivariance gives O_F(g.d)=g.O_F(d), not equality. Equality follows exactly when the image is pointwise fixed; only the codomain-orbit readout [O_F(d)] descends automatically."
  multiple_orbit_guard:
    statement: "Orbit factorization does not imply all-choice equality when D_X/G_X has more than one point and the induced quotient readout separates two orbits."
  selector_image_corollary:
    statement: "When admissible selectors exist, selector-level representative irrelevance at a declared relation interface is equivalent to a singleton image of the induced selector-to-readout map; an empty selector domain has empty, not unique, image."
real_valued_invariant_algebra:
  carrier: "Fun(D_X,R)^{G_X}"
  interpretation: "the maximal real-valued source-readout subalgebra constant on structural orbits"
  reynolds_projection: "P_G f(d)=|G_X|^{-1} sum_{g in G_X} f(g.d)"
  exact_scope: "finite G_X and real-valued readouts only"
  does_not_apply_to: "arbitrary nonconvex or merely labelled codomains without an averaging operation"
  adequacy_guard: "Choosing the invariant algebra proves internal factorization but does not prove that it is complete, operationally adequate, empirically meaningful, or sufficient for downstream physics."
  projection_guard: "The Reynolds projection is linear and idempotent but is generally not multiplicative; applying it to a sensitive readout constructs a new readout rather than proving the original one irrelevant."
family_naturality_guard:
  statement: "Objectwise orbit factorization defines a natural quotient-readout family only after the orbit relation and descended readouts are proved compatible with every admitted source morphism."
  current_status: "not established by the finite P3-T03 controls"
readout_adequacy_contract:
  prospective_binding_required: true
  provenance_required: true
  interface_completeness_established: false
  statement: "Representative irrelevance is always relative to a named prospectively declared readout family; the invariant family is not shown to exhaust physical operational or empirical information."
finite_control_contract:
  artifact: "eqsrc_representative_irrelevance_orbit_examples_v1.json"
  required_case_ids:
