  complete_domain_enumeration_required: true
  raw_interface_requires_sensitive_control: true
result_summary:
  invariant_subfamily: "Every declared invariant subfamily factors through the structural orbit quotient in all six bounded controls."
  raw_interface: "Every bounded raw interface contains at least one source-side representative-sensitive readout and therefore fails full representative irrelevance."
  multiple_orbit: "The multi-orbit control factors through its two-point quotient but its induced component-class readout is not all-choice constant."
  marked_singleton_guard: "A P3-T02 marked singleton changes the source domain and is added source structure, not representative irrelevance on the unmarked domain."
  classification: "scoped_orbit_factorization_theorem_with_raw_interface_countermodels"
