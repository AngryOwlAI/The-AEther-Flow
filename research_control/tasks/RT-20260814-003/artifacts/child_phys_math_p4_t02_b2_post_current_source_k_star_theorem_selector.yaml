formal_domains:
  domain_count: 13
  domains:
    - domain_id: "DOM-01"
      symbol: "C_cur"
      definition: "SmoothMan_4^iso, the RT002 current typed groupoid of nonempty smooth four-manifolds and all diffeomorphisms, used for mathematical naturality only and not adopted as EqSrc."
    - domain_id: "DOM-02"
      symbol: "Open(M)"
      definition: "The poset of nonempty open subsets U of one M in C_cur, with inclusions V subset U."
    - domain_id: "DOM-03"
      symbol: "LDiff(M)"
      definition: "The local-diffeomorphism pseudogroup whose arrows are triples (U,V,f) with U and V open in M and f:U->V a diffeomorphism."
    - domain_id: "DOM-04"
      symbol: "K_star(U)"
      definition: "The exact RT002 two-branch object assignment applied to U as a nonempty smooth four-manifold; it is not silently replaced by a sheafification or local pseudogroup."
    - domain_id: "DOM-05"
      symbol: "Diff_c(U)"
      definition: "Diffeomorphisms of U whose support is compact in the intrinsic topology of U."
    - domain_id: "DOM-06"
      symbol: "Emb_c(U,M)"
      definition: "Open inclusions U into M together with diffeomorphisms of U supported in a compact subset of U, so identity extension to M is smooth."
    - domain_id: "DOM-07"
      symbol: "Germ_x(M)"
      definition: "The groupoid of germs at x of local diffeomorphisms fixing x, with first-jet map to GL(T_xM)."
    - domain_id: "DOM-08"
      symbol: "J_x(K_star)"
      definition: "The subgroup of GL(T_xM) realized as first derivatives at x of K_star(M) elements fixing x."
    - domain_id: "DOM-09"
      symbol: "Q_inf(M)"
      definition: "The algebraic quotient Diff(M)/Diff_c(M) on the declared noncompact object class, using normality of Diff_c(M); no topology or universal end structure is assumed."
    - domain_id: "DOM-10"
      symbol: "X_src"
      definition: "A future packet's explicitly source-defined presheaf or sheaf of local source data, formed without target atlas, metric, cone, response label, or Phi_src semantics."
    - domain_id: "DOM-11"
      symbol: "B_loc"
      definition: "A future packet's independently source-defined local bridge codomain with declared restriction and gluing operations; it is not physical merely by being local."
    - domain_id: "DOM-12"
      symbol: "X_src/LDiff"
      definition: "The full local-diffeomorphism orbit quotient used only to test whether a proposed K_star-sensitive map has discriminator force beyond the bare smooth local symmetry."
    - domain_id: "DOM-13"
      symbol: "Cert_A"
      definition: "The coproduct of one scoped K_star localization or bridge-irrelevance theorem certificate and one explicit source-only counterexample certificate defeating that theorem."

