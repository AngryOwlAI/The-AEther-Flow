locality_and_germ_hypotheses:
  printed_assignment_scope: "K_star is held exactly as RT002 defined it objectwise on every nonempty smooth four-manifold."
  compact_control_object: "Any compact nonempty smooth four-manifold M with a relatively compact coordinate ball U diffeomorphic to R4."
  open_control_object: "The coordinate ball U, intrinsically noncompact."
  restriction_control_pair: "M=R4 and U=R4 minus {0}, with a compactly supported diffeomorphism fixing 0 but moving every sufficiently small nonzero point."
  germ_control_object: "M=R4 at x=0."
  jet_regularities:
    - "All manifolds and maps are smooth."
    - "Only orientation-preserving first jets are asserted realizable by compactly supported diffeomorphisms of connected R4."
    - "The no-cone result uses the exact hypothesis J_0(K_star) contains GL^+(4,R)."
    - "No claim is made that every nonlinear local diffeomorphism germ extends compactly."
  local_cone_hypothesis: "A proposed cone at x is a nonempty proper subset of T_xM minus {0}, or of T_x^*M minus {0}, invariant under every admitted K_star germ fixing x."
  lorentzian_cone_scope: "A time or hyperbolicity cone is proper and nonempty, so invariance under the transitive GL^+(4,R) action is impossible."
  orientation_precision: "Compactly supported diffeomorphisms on connected oriented R4 have positive Jacobian orientation class, but invariance of both mathematical orientation sheets does not select one and does not establish physical time orientation."
  quotient_scope: "Q_inf is algebraic and object-class dependent. Without an independently defined topology, ends, asymptotic condition, or local codomain, it carries only a coarse large-transformation classification."

new_mathematical_payload:
  payload_count: 5
  items:
    - payload_id: "PAYLOAD-RT003-PM-001"
      payload_type: "countermodel_or_obstruction"
      name: "compact-versus-open identity-extension and gluing countermodel"
      statement: "Let M be compact and let U be a coordinate ball diffeomorphic to R4. Then K_star(M)={id_M}, while K_star(U)=Diff_c(U). A nonidentity f in Diff_c(U) extends by identity to a nonidentity diffeomorphism ext^M_U(f), which is excluded from K_star(M). The compatible pair f on U and id on M minus supp(f) therefore glues outside the printed K_star assignment."
      proof: "Every support in compact M is compact, so Diff_c(M)=Diff(M) and the fallback branch gives K_star(M)={id_M}. Intrinsic noncompactness of U and a transported translation show Diff_c(U) is proper in Diff(U), so K_star(U)=Diff_c(U). Choose a nonzero compactly supported vector field in U and a nonidentity small-time flow f. Because f is identity near the boundary of its compact support, it extends smoothly by identity and glues with the outside identity, but the resulting global map is nonidentity and hence not in K_star(M)."
      falsifier: "Show that M is not compact, U is not intrinsically noncompact, f is not compactly supported in U, identity extension is not smooth, or ext^M_U(f) equals id_M."
      scope_limit: "This countermodel proves that the printed objectwise assignment supplies no extension-and-gluing-compatible local law. It does not prove that every enriched localization or new source law is impossible."
      burden_effect: "pressures_K_star_bridge_relevance"
    - payload_id: "PAYLOAD-RT003-PM-002"
      payload_type: "countermodel_or_obstruction"
      name: "punctured-open restriction countermodel"
      statement: "There exists f in K_star(R4) fixing 0 such that f restricts to a diffeomorphism of U=R4 minus {0}, but f|U is not in K_star(U)."
      proof: "Let X(x)=chi(|x|)x for a smooth compactly supported bump chi equal to one near zero, and take a nonzero sufficiently small-time flow f. Then f fixes zero, moves every sufficiently small nonzero point, and has compact support in R4, so f lies in K_star(R4)=Diff_c(R4). The restriction preserves U. Its support in U accumulates at the deleted point and is not compact in U. Since a dilation on U has noncompact support, Diff_c(U) is proper and K_star(U)=Diff_c(U); hence f|U is excluded."
      falsifier: "Prove that the restricted support is compact in U, that f does not preserve U, or that Diff_c(U)=Diff(U)."
      scope_limit: "The statement concerns the canonical partial restriction of the printed assignment along one invariant open subset; it is not a no-go for all alternative pseudogroups."
      burden_effect: "shows_restriction_failure"
    - payload_id: "PAYLOAD-RT003-PM-003"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "compact-support first-jet isotropy and local no-cone lemma"
      statement: "At zero in R4, first jets of compactly supported diffeomorphisms fixing zero contain GL^+(4,R). Consequently no nonempty proper vector or covector cone, nonzero vector or covector, or Lorentzian conformal class is invariant under all such first jets."
      proof: "For A in GL^+(4,R), choose a smooth path A_t from I to A. Near zero use the time-dependent linear vector field X_t(y)=dot(A_t) A_t^{-1} y and multiply it by a bump equal to one near zero. Its compactly supported flow fixes zero and has derivative A_t there, so the time-one derivative is A. GL^+(4,R) acts transitively on nonzero vectors and on nonzero covectors; an invariant nonempty subset is therefore the entire punctured space, not a proper Lorentzian cone. A fixed nonzero vector or covector and a conformal Lorentzian class would have proper stabilizers, so none is selected."
      falsifier: "Exhibit A in GL^+(4,R) that cannot be realized by the stated compactly supported flow construction, or exhibit a nonempty proper subset of the punctured vector or covector space invariant under all GL^+(4,R)."
      scope_limit: "The conclusion holds under the displayed smooth first-jet and invariance hypotheses at the R4 control object. It does not assert a global no-go for richer source data, and mathematical spatial orientation is not physical time orientation."
      burden_effect: "rules_out_cone_from_K_star_invariance_alone"
    - payload_id: "PAYLOAD-RT003-PM-004"
      payload_type: "source_side_irrelevance_proof"
      name: "quotient-at-infinity local-jet erasure lemma"
      statement: "For noncompact M, q_inf:Diff(M)->Diff(M)/Diff_c(M) kills every compactly supported local bump. On R4 it therefore identifies the identity with representatives realizing every GL^+(4,R) first jet at zero. Any construction factoring only through q_inf loses that first-order local information and cannot by itself select a proper Lorentzian cone or local principal-symbol response."
      proof: "Normality of Diff_c(M) makes q_inf well formed. Every f_A from PAYLOAD-RT003-PM-003 lies in the kernel, so q_inf(f_A)=q_inf(id). A factorized output is constant on this kernel and hence invariant under all realized GL^+ first jets. The no-cone lemma applies."
      falsifier: "Reject normality or the declared quotient, show that one f_A is not in Diff_c(R4), or give a quotient-factorized local output that distinguishes two representatives in the same coset."
      scope_limit: "The quotient can classify large or asymptotic transformation classes on a declared object class. No universal topology, end structure, local response semantics, or global impossibility claim is inferred."
      burden_effect: "classifies_Q_inf_as_global_not_local_bridge_data"
    - payload_id: "PAYLOAD-RT003-PM-005"
      payload_type: "packet_selection"
      name: "restriction-germ-factor bridge relevance criterion"
      statement: "K_star can have bridge-facing force only if a separately source-defined local datum X_src, local codomain B_loc, and natural family b_U are restriction and gluing compatible, invariant under the declared K_star action, and do not factor through the full local-diffeomorphism orbit quotient. The currently printed assignment provides none of these data and fails the two exact locality controls."
      proof: "Restriction and gluing are formation requirements for a local bridge. If b_U factors through the full local-diffeomorphism quotient, K_star supplies no additional discriminator beyond bare smooth local equivalence. The compact-open and punctured-open controls show that the objectwise K_star groups themselves do not define the required local functor."
      falsifier: "Construct X_src, B_loc, and b from registered current-source data, prove every restriction and gluing square, prove K_star invariance, and exhibit two full-local-diffeomorphism-related cases on which the K_star-sensitive output remains nonfactorable without importing target or empirical labels."
      scope_limit: "This is a decision criterion and future proof burden, not an adopted bridge or a physical interpretation."
      burden_effect: "selects_route_A_before_any_bridge_or_law_packet"

