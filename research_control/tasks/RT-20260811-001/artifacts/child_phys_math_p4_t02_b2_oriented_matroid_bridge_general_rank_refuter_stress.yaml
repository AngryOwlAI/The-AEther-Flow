    result: "A_1^+=[1,1] is Feasible and its negative reorientation A_1^-=[1,-1] is Obstructed; the support bound card(C)<=2 is sharp."
  - edge_case: "full column rank"
    result: "Cir_+ is empty and a functional assigning positive values to the independent columns exists; the support theorem is vacuous and totality is Feasible."
  - edge_case: "wall with a vanishing minor but no zero sector"
    result: "A(0) retains rank two and all nonzero columns while the circuit support changes to {1,3}."
  - edge_case: "wall-free perturbation"
    result: "For t restricted to either open half-line, oriented-matroid data and the total branch are locally constant, preserving the fixed stratification theorem."
  - edge_case: "obstructed refinement"
    result: "An old positive circuit persists, so an Obstructed configuration cannot become Feasible under an allowed column-adjoining refinement."
  - edge_case: "feasible refinement"
    result: "A new column positive on an old strict witness preserves Feasible, showing that failure is not asserted for every refinement."
  - edge_case: "effective-span embedding"
    result: "Adding unused ambient dimensions preserves every bridge datum and does not repair or worsen the candidate-scoped robustness obstruction."
  - edge_case: "arbitrary finite rank"
    result: "The reorientation pair exists for every finite r; the rank-two wall countermodel suffices to refute a universal finite-variation survival implication over the candidate domain."

