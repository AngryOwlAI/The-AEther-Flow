new_mathematical_payload:
  - payload_id: "NMP-RT20260811-001-CHILD-MATH-001"
    payload_type: "exact_rational_countermodel_family"
    name: "Arbitrarily small fixed-rank wall crossing with no zero columns"
    novelty_relative_to_rt016_rt017: "Adds the first exact general-rank-candidate robustness counterfamily rather than another fixture-domain or source-purity argument."
    construction: "For rational t let A(t)=[e1,e2,(-1,t)] in Q^2."
    exact_checks:
      nonzero_columns: "All three columns are nonzero for every t."
      fixed_rank: "rank(A(t))=2 for every t because e1 and e2 remain a basis."
      feasible_side: "For t>0, k_t=(1,2/t) evaluates to (1,2/t,1), hence Tot(A(t)) is Feasible and Cir_+(A(t)) is empty."
      wall: "At t=0, e1+v3=0 gives the support-minimal positive circuit {1,3}, so Tot(A(0)) is Obstructed."
      obstructed_side: "For t<0, alpha=(1,-t,1)>0 satisfies e1+(-t)e2+v3=0; every pair is independent, so {1,2,3} is the unique positive circuit."
      arbitrarily_small_exact_pair: "For every delta>0 choose rational q>0 with 2q<delta; A(q) and A(-q) differ only in the last column by (0,2q), have fixed rank two and nonzero columns, yet have Feasible and Obstructed total branches."
    consequence: "The total branch and positive-circuit inventory have zero neighborhood-stability radius at the admissible wall; exact totality remains correct pointwise."
    exact_scope: "Proposal-only source-extension candidate; not a global no-go and not a physical perturbation law."
  - payload_id: "NMP-RT20260811-001-CHILD-MATH-002"
    payload_type: "refinement_monotonicity_theorem"
    name: "One-way persistence and feasible-branch fragility under finite refinement"
    statement: "Under a refinement that leaves old oriented columns unchanged up to positive scale, an Obstructed base remains Obstructed because an old positive circuit persists, whereas a Feasible base need not remain Feasible."
    exact_controls:
      destroyed_feasibility: "[e1,e2] is Feasible via k=(1,1), but adjoining -(e1+e2) produces the positive circuit e1+e2-(e1+e2)=0 and an Obstructed refinement at the same rank two."
      preserved_feasibility: "Adjoining +(e1+e2) to [e1,e2] preserves Feasible via the same k=(1,1)."
    proof: "The old-circuit persistence theorem proves obstruction monotonicity. Chamber inclusion Gamma(A_T) subseteq Gamma(A_S) permits loss of strict feasibility; the two exact refinements show both possible outcomes."
    consequence: "Finite-refinement functoriality is valid but is not a uniform feasible-branch robustness theorem."
  - payload_id: "NMP-RT20260811-001-CHILD-MATH-003"
    payload_type: "information_forgetting_theorem"
    name: "Oriented-matroid component noninjectivity on projective realization moduli"
    construction: "For m>1 in Q define B_m=[(1,0),(1,1),(1,m),(0,1)] and supply only identity refinements and constant paths."
    exact_checks:
      common_rank_and_chirotope: "rank(B_m)=2 and every ordered two-column minor with increasing labels is positive, so all m>1 have the same labeled uniform acyclic oriented matroid and the same Cstar."
      common_circuits_and_totality: "Cir_+(B_m) is empty and k=(1,1) is strict, so Tot is Feasible."
      common_certificate_fiber: "The endpoint inequalities reduce Gamma(B_m) exactly to a>0 and b>0; the two interior inequalities are redundant."
      inequivalent_moduli: "For m=2 a four-ray cross ratio is 2 with permutation orbit {2,1/2,-1}; for m=3 it is 3/2 with orbit {3/2,2/3,-1/2,-2,3,1/3}. The disjoint orbits forbid any GL(2), positive column scaling, and relabeling presentation arrow between B_2 and B_3."
    theorem: "B_2 and B_3 have identical Cstar, Cir_+, total branch tag, strict-chamber set, identity-refinement, and constant-path component values but inequivalent projective realizations. This does not claim that full presentation-groupoid objects retaining their base configurations are isomorphic."
    consequence: "Those oriented-matroid and trivial Ref/Strat components cannot recover a downstream quantity sensitive to the forgotten projective modulus. Retaining A separately can retain the modulus, but the candidate provides no bridge-facing factorization or physical semantics for it; no claim is made that every possible physical law is modulus-sensitive."
  - payload_id: "NMP-RT20260811-001-CHILD-MATH-004"
    payload_type: "selection_nonimplication_lemma"
    name: "Pointwise totality is not a source selector"
    statement: "Gordan totality gives exactly one valid tag after A is supplied, but it supplies no map from current ontology to A, no orientation choice, no refinement or path-family choice, and no preference for the Feasible tag over the Obstructed tag."
    proof: "The sharp families A_r^+ and A_r^- are both admitted at every finite rank r, differ by a negative source reorientation, and realize opposite total branches while satisfying every fixed domain condition."
    consequence: "Completeness of classification cannot be promoted to source selection or stable common-branch existence."

required_stress_branches:
  - branch_id: "STRESS-01-TOTALITY-VERSUS-SOURCE-SELECTION"
    branch_name: "Totality versus source selection"
    exact_evidence: "For each finite rank r, A_r^+=[e1,...,er,+sum(e_i)] is Feasible and A_r^-=[e1,...,er,-sum(e_i)] is Obstructed; both satisfy the exact candidate domain."
    fixed_candidate_result: "Gordan totality remains exhaustive and exclusive for every supplied configuration."
    stress_result: "Totality classifies an already supplied input and neither selects that input nor privileges either branch."
    local_disposition: "SELECTION_NONIMPLICATION"
  - branch_id: "STRESS-02-TARGET-FREE-FINITE-PERTURBATION"
    branch_name: "Arbitrarily small exact rational wall crossing"
    exact_evidence: "A(t)=[e1,e2,(-1,t)] has rank two and nonzero columns for all rational t; t>0 is Feasible, t=0 has circuit {1,3}, and t<0 has circuit {1,2,3}."
    smallness_quantifier: "For every positive tolerance delta there is rational q with 0<2q<delta and opposite branches at A(q),A(-q)."
    fixed_candidate_result: "Local constancy on each wall-free stratum survives."
    stress_result: "No neighborhood robustness holds at the admissible wall."
    local_disposition: "EXACT_SCOPED_COUNTERMODEL"
  - branch_id: "STRESS-03-NEGATIVE-REORIENTATION"
    branch_name: "Negative source reorientation"
    exact_evidence: "Negating only the final column of A_r^+ gives A_r^-; k=(1,...,1) certifies the first and alpha=(1,...,1) certifies the second for every r>=1."
    fixed_candidate_result: "Negative scaling is correctly excluded from presentation arrows and correctly treated as new source data."
    stress_result: "The candidate contains no independent source orientation selector or invariance theorem across reorientation."
    local_disposition: "ORIENTATION_SELECTION_GAP"
  - branch_id: "STRESS-04-FINITE-REFINEMENT"
    branch_name: "Finite refinement and branch persistence"
    exact_evidence: "The Feasible base [e1,e2] becomes Obstructed after adjoining -(e1+e2), while adjoining +(e1+e2) preserves Feasible; any already Obstructed base remains Obstructed by old-circuit persistence."
    fixed_candidate_result: "Covector restriction, chamber inclusion, old-circuit persistence, and nested composition all survive."
    stress_result: "Strict feasibility is not preserved by arbitrary admitted refinement; preservation is one-way only for obstruction."
    local_disposition: "REFINEMENT_ROBUSTNESS_OBSTRUCTION"
  - branch_id: "STRESS-05-CERTIFICATE-ORBIT-TRANSPORT"
    branch_name: "Certificate-orbit transport"
    exact_evidence: "For A'=TADP^-1, k'=T^-T k preserves strict evaluations up to positive scale and relabeling, while alpha'=P D^-1 alpha is positive and satisfies A'alpha'=0."
    fixed_candidate_result: "Equivariant certificate fibers and quotient-orbit typing are exact and remain valid."
    stress_result: "Transport applies only along declared presentation isomorphisms; it supplies neither a canonical raw certificate nor continuation across a determinant wall, negative reorientation, or nonisomorphic refinement."
    local_disposition: "TRANSPORT_SURVIVES_ROBUSTNESS_NONIMPLICATION"
  - branch_id: "STRESS-06-TAME-PATH-EVENT-RECORD"
    branch_name: "Tame-path event records versus robustness"
    exact_evidence: "The polynomial rational path A(t) has one isolated determinant wall at t=0 and exact branch/circuit strata on either side."
    fixed_candidate_result: "Finite root-isolated event enumeration on a predeclared tame family survives exactly."
    stress_result: "A finite event record describes the discontinuity; it does not remove it, bound it away, select an allowed side, or extend to arbitrary continuous paths."
    local_disposition: "BOOKKEEPING_NOT_ROBUSTNESS"
  - branch_id: "STRESS-07-SCALING-AND-REALIZATION-MODULI"
    branch_name: "Positive scaling and information forgetting"
    exact_evidence: "Positive column scaling is a valid presentation arrow, while B_2 and B_3 share all fixed bridge data yet have disjoint projective cross-ratio orbits."
    fixed_candidate_result: "Positive-scaling naturality and sign/circuit completeness survive."
    stress_result: "Presentation naturality is not an adopted physical gauge law, and the listed oriented-matroid plus trivial Ref/Strat component values are noninjective on quantitative projective realization data; no stronger claim about a full base-configuration-retaining groupoid object is made."
    local_disposition: "QUANTITATIVE_REALIZATION_DATA_FORGOTTEN"
  - branch_id: "STRESS-08-P4-T02-BRIDGE-RELEVANCE"
    branch_name: "Bridge relevance to the P4-T02 burden"
    exact_evidence: "Opposite total branches occur arbitrarily close at fixed rank, Feasible can fail under finite refinement, and equal sign, circuit, total-tag, strict-chamber, and trivial Ref/Strat component values can accompany inequivalent realization moduli."
    fixed_candidate_result: "Bridge_OM remains a complete finite algebraic classifier on each supplied exact configuration."
    stress_result: "The package supplies no current-ontology selector, stability margin, physical response factorization, universal sector coverage, or source-to-cone law; it therefore does not discharge finite-variation robustness or bridge relevance for P4-T02."
    local_disposition: "CANDIDATE_SCOPED_OBSTRUCTION"

