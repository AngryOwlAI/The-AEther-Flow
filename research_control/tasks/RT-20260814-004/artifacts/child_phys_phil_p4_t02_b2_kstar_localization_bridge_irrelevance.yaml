formal_hypotheses:
  smoothness: "All manifolds, vector fields, paths, and diffeomorphisms used below are smooth."
  compact_host: "M is a compact connected nonempty smooth four-manifold."
  coordinate_ball: "U is a relatively compact coordinate ball in M, viewed intrinsically as a noncompact smooth four-manifold diffeomorphic to R4."
  local_point: "x is a point of U and a chart centered at x is fixed only for the proof construction."
  compact_support: "Support is the closure of the moved-point set in the intrinsic topology of the manifold on which the diffeomorphism is defined."
  first_jet_group: "Only first jets of compactly supported stabilizers at x are asserted; no claim is made that every nonlinear local germ extends globally."
  quotient_object: "The algebraic quotient Diff(R4)/Diff_c(R4) is used after normality is proved; no quotient topology or universal end functor is assumed."
  bridge_scope: "The bridge grammar is fixed before outcomes and contains nonzero tangent vector, nonzero cotangent covector, proper nonempty cone, Lorentzian conformal cone, mathematical orientation sheet, and scalar local-response candidates."

proof_and_falsifier_payloads:
  payload_count: 6
  payloads:
    - payload_id: "NMP-RT004-PHIL-001"
      payload_type: "countermodel_or_obstruction"
      name: "Compact-host open-ball restriction nonexhaustion and gluing failure"
      theorem_target: "THM-01 CompactOpenRestrictionNonExhaustion"
      statement: "For compact M and relatively compact coordinate ball U, K_star(M)={id_M} while K_star(U)=Diff_c(U). The restriction image from the K_star(M) stabilizer of U is {id_U}, so it does not exhaust K_star(U). A nonidentity h in Diff_c(U) extends by identity to a nonidentity H in Diff(M), but H is excluded from K_star(M); compatible local smooth data therefore glue in Diff while failing to glue in the printed K_star assignment."
      proof: "Every subset of compact M has compact closure, so every diffeomorphism of M has compact support and Diff_c(M)=Diff(M), activating the identity branch. The intrinsic open ball U is diffeomorphic to R4; a transported translation has noncompact support, so Diff_c(U) is proper in Diff(U), while a nonzero compactly supported vector-field flow supplies nonidentity h in Diff_c(U). Since supp(h) is compactly contained in U, identity extension is smooth and nonidentity. K_star(M) contains only id_M, proving both restriction nonexhaustion and extension or gluing failure."
      smallest_falsifier: "Show that M is noncompact, U is compact as an intrinsic manifold, Diff_c(U)=Diff(U), the chosen h is identity or lacks compact support, identity extension is nonsmooth, or the printed K_star(M) contains a nonidentity arrow."
      scope_limit: "This defeats locality of the printed objectwise assignment only. It does not exclude an enriched pseudogroup or a materially new source-local law."
    - payload_id: "NMP-RT004-PHIL-002"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "Exact GL+(4) compact-support first-jet realization"
      theorem_target: "THM-02 LocalFirstJetNoCanonicalVectorCovectorCone"
      statement: "At x in U, the derivative image of compactly supported diffeomorphisms fixing x is exactly GL+(T_xU)."
      proof: "Any compactly supported diffeomorphism of connected U is identity outside a compact set, so the sign of its Jacobian determinant is positive everywhere and its first jet lies in GL+. Conversely, for A in GL+(T_xU), choose a smooth path A_t in GL+ from I to A, put B_t=dot(A_t)A_t^-1, choose a bump chi equal to one near x and compactly supported in the chart, and integrate X_t(y)=chi(y)B_t y. The compactly supported flow fixes x and its derivative solves dot(Dphi_t)=B_t Dphi_t with Dphi_0=I, hence Dphi_1=A."
      smallest_falsifier: "Exhibit A in GL+(T_xU) that cannot be joined to I or whose bumped time-dependent field fails to generate a compactly supported flow with derivative A, or exhibit a compactly supported stabilizer with negative determinant at x."
      scope_limit: "The result concerns first jets at the declared chart point and makes no claim about all nonlinear germs."
    - payload_id: "NMP-RT004-PHIL-003"
      payload_type: "source_side_irrelevance_proof"
      name: "Predeclared local invariant grammar collapse under GL+(4)"
      theorem_target: "THM-02 LocalFirstJetNoCanonicalVectorCovectorCone"
      statement: "GL+(4) fixes no nonzero vector or covector and acts transitively on each punctured vector and covector space, so it preserves no nonempty proper cone and no Lorentzian conformal cone. Compactly supported isotopies preserve both mathematical orientation sheets but select neither, and K_star-invariant scalar data on connected U are constant because Diff_c(U) acts transitively on points."
      proof: "For any two nonzero vectors or covectors, an orientation-preserving linear isomorphism maps one to the other. A nonempty invariant subset is therefore the whole punctured space, and a fixed nonzero element would have to equal every image. The stabilizer of any Lorentzian conformal class is a proper subgroup of GL+, so full GL+ invariance is impossible. Compactly supported diffeomorphisms act trivially on the two-sheet orientation torsor, leaving two equally invariant sheets rather than a canonical selection. A compactly supported flow along a path moves any point of connected U to any other, forcing invariant scalar functions to be constant."
      smallest_falsifier: "Provide a nonzero fixed vector or covector, a nonempty proper GL+(4)-invariant cone, a Lorentzian conformal class fixed by all GL+(4), a unique orientation sheet selected without prior orientation data, or a nonconstant Diff_c(U)-invariant scalar derived from the current source."
      scope_limit: "Mathematical orientation is not physical time orientation, and failure under full local isotropy does not constrain a future independently source-derived structure-group reduction."
    - payload_id: "NMP-RT004-PHIL-004"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "Algebraic large-quotient local-information separation"
      theorem_target: "THM-03 LargeQuotientLocalInformationSeparation"
      statement: "Diff_c(R4) is normal. The quotient q_inf erases every compactly supported local first-jet variation, while a radial diffeomorphism equal to identity near zero and equal to dilation outside a compact radius shares the identity germ at zero but lies in a different quotient coset. Therefore the quotient neither determines nor is determined by the chosen local germ."
      proof: "For any f in Diff_c(R4) and g in Diff(R4), supp(gfg^-1)=g(supp(f)) is compact, so Diff_c is normal. Every compactly supported first-jet witness lies in ker(q_inf), hence has the identity coset despite arbitrary GL+ first jet. Choose a smooth strictly increasing radial function rho with rho(r)=r near zero and rho(r)=2r for large r; G(x)=rho(|x|)x/|x| is a diffeomorphism equal to identity near zero and nonidentity on an unbounded set. Thus G has the identity germ but G is not in Diff_c and q_inf(G) differs from q_inf(id)."
      smallest_falsifier: "Show failure of normality, show a compactly supported first-jet witness outside the quotient kernel, show the radial map is not a diffeomorphism or has compact support, or show q_inf(G)=q_inf(id) despite G not in Diff_c."
      scope_limit: "The quotient may encode object-dependent large or end behavior, but no topology, asymptotic charge, local response, principal symbol, or empirical interpretation follows."
    - payload_id: "NMP-RT004-PHIL-005"
      payload_type: "source_side_irrelevance_proof"
      name: "Necessary bridge relevance and nonfactorization criterion"
      theorem_target: "THM-04 BridgeRelevanceFactorCriterion"
      statement: "K_star has nontrivial local bridge force only if an independently current-source-defined local domain X_src, codomain B_i, and nonconstant map b_i are formed; b_i is natural under current source isomorphisms, compatible with restrictions, compositions, covers, overlaps, and gluing; and b_i does not factor through the full local-diffeomorphism orbit quotient in a way that erases the claimed discriminator."
      proof: "A local bridge is ill typed without domain, codomain, and map. Naturality and descent are necessary for presentation-independent localization. If b_i factors through full local-diffeomorphism orbits, K_star provides no finer discriminator than bare smooth local equivalence. The compact-open countermodel shows the objectwise groups do not supply the missing restriction or gluing structure. The first-jet and quotient theorems eliminate every formed candidate in the predeclared grammar, while no independent current-source codomain or map is registered."
      smallest_falsifier: "Construct from registered current-source data one nonconstant b_i with an independently formed codomain, prove K_star invariance, every naturality and descent square, and nonfactorization through full local-diffeomorphism orbits without target, empirical, or workflow import."
      scope_limit: "The criterion is mathematical and source-provenance discipline; satisfying it would not by itself assign physical or empirical semantics or authorize adoption."
    - payload_id: "NMP-RT004-PHIL-006"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "Scoped K_star standalone local bridge irrelevance theorem"
      theorem_target: "THM-05 ExclusiveScopedDecision"
      statement: "Under the fixed current smooth-source signature, unchanged K_star assignment, declared object hypotheses, and six-member bridge grammar, K_star alone supplies no localization-compatible nontrivial local P4 bridge."
      proof: "The printed assignment fails restriction exhaustivity and gluing on the compact-open witness. Its exact local first-jet image is GL+, which blocks nonzero vector, covector, proper cone, and Lorentzian conformal-cone selection. Orientation remains two-sheet nonunique and physically untyped, while invariant scalar readout is constant. The algebraic large quotient erases local jets and varies independently of a fixed local germ. No independently source-defined local codomain or natural nonfactorizing restriction-and-gluing map exists. Every declared grammar branch therefore fails a necessary bridge criterion."
      smallest_falsifier: "One exact current-source-derived bridge witness satisfying all provenance, naturality, nonfactorization, restriction, overlap, and gluing conditions defeats the scoped theorem and changes the result to bridge_facing_candidate_path."
      scope_limit: "The conclusion freezes only unchanged K_star as a standalone local bridge under the declared current ontology and grammar. It is not a global theory rejection and does not prove future source-extension impossibility."

