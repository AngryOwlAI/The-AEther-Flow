new_mathematical_payload:
  - payload_id: "NMP-01"
    payload_type: "theorem_with_hypotheses_and_proof"
    name: "Compact-open restriction nonexhaustion theorem"
    statement: "For compact M and relatively compact coordinate ball U, restrictions of K_star(M) do not exhaust K_star(U)."
    falsifier: "A nonidentity h in Diff_c(U) would need to be the restriction of an arrow in K_star(M), but K_star(M) contains only id_M."
  - payload_id: "NMP-02"
    payload_type: "theorem_with_hypotheses_and_proof"
    name: "Compact-support GL+(4) first-jet realization lemma"
    statement: "Every A in GL+(4) is realized at a chart point by a compactly supported stabilizer flow."
    falsifier: "Failure of the compactly supported time-dependent flow to realize A would defeat the lemma; its derivative ODE is exactly A_t."
  - payload_id: "NMP-03"
    payload_type: "source_side_irrelevance_proof"
    name: "Local invariant selector elimination theorem"
    statement: "Local K_star invariance selects no nonzero vector, covector, proper cone, Lorentzian cone, orientation sheet, or nontrivial scalar response."
    falsifier: "A separately sourced reduced structure group could invalidate the full-GL+(4) stabilizer premise; none is present in unchanged K_star."
  - payload_id: "NMP-04"
    payload_type: "theorem_with_hypotheses_and_proof"
    name: "Large-quotient local-information separation proposition"
    statement: "Diff/Diff_c kills compact local bumps and distinguishes identity from a same-local-germ radial dilation at infinity."
    falsifier: "If the dilation were compactly supported its quotient class would collapse; its nonidentity behavior persists outside every compact set."
  - payload_id: "NMP-05"
    payload_type: "source_side_irrelevance_proof"
    name: "Scoped K_star standalone local-bridge irrelevance theorem"
    statement: "Within the fixed grammar, unchanged K_star alone lacks the local restriction, selector, and quotient properties required for nontrivial bridge force."
    falsifier: "An independently current-source-defined local codomain and map passing naturality, nonfactorization, restrictions, overlaps, and gluing would defeat the scoped conclusion and form the positive witness branch."

