compact_open_restriction_audit:
  theorem_id: "THM-RT004-PM-001"
  theorem_name: "CompactOpenRestrictionNonExhaustion"
  status: "proved"
  statement: "The unchanged objectwise K_star assignment is not restriction-exhaustive and is not closed under identity-extension gluing on the declared compact-host coordinate-ball witness."
  proof_steps:
    - "For compact M, the support of every diffeomorphism is a closed subset of compact M, so Diff_c(M)=Diff(M). The fixed fallback branch therefore gives K_star(M)={id_M}."
    - "The coordinate ball U is intrinsically noncompact. A transported translation of R4 has noncompact support, while compactly supported bump flows exist, so Diff_c(U) is proper in Diff(U) and K_star(U)=Diff_c(U)."
    - "Choose a nonzero compactly supported smooth vector field on U and a nonidentity sufficiently small-time flow h. Its support is contained in a compact subset of U."
    - "Because h equals the identity on a neighborhood of the complement of that compact subset, extending h by the identity outside U gives a smooth nonidentity H in Diff(M)."
    - "H is excluded from K_star(M)={id_M}, even though h belongs to K_star(U) and glues with the outside identity. Thus the printed assignment supplies neither extension-surjectivity nor a K_star gluing law."
  exact_scope: "One admissible compact-open pair disproves a universal presheaf or local-completeness claim for the printed objectwise assignment."
  falsifier: "Defeat compactness of M, intrinsic noncompactness of U, compact support or nonidentity of h, smoothness of identity extension, or the fixed K_star branch calculation."
  forbidden_overread: "The theorem does not obstruct an enriched local pseudogroup or a new source-side localization law."
  punctured_open_control:
    status: "proved_as_independent_restriction_witness"
    construction: "On R4 choose X(y)=chi(|y|)y with chi compactly supported and equal to one near zero. A nonzero small-time flow f fixes zero, preserves V=R4 minus {0}, and belongs to Diff_c(R4)."
    conclusion: "The support of f|V accumulates at the deleted point and is not compact in V, so f|V is not in K_star(V)=Diff_c(V)."
    falsifier: "Show that f fails to preserve V, that its restricted moved-point closure is compact in V, or that Diff_c(V)=Diff(V)."

local_first_jet_audit:
  theorem_id: "THM-RT004-PM-002"
  theorem_name: "CompactSupportFirstJetAndInvariantGrammarTheorem"
  status: "proved_under_declared_hypotheses"
  realized_group: "GL_plus(4,R)"
  realization_proof:
    - "For any A in GL_plus(4,R), connectedness of GL_plus gives a smooth path A_t from the identity to A."
    - "Set L_t=dot(A_t) composed with A_t^{-1}. In centered coordinates choose a smooth compactly supported bump chi equal to one near zero and define X_t(y)=chi(y)L_t y."
    - "The time-dependent field has support in one fixed compact set, its global flow phi_t is compactly supported, and zero is a fixed point."
    - "At zero the derivative solves d/dt Dphi_t(0)=L_t Dphi_t(0) with identity initial value. The same initial-value problem is solved by A_t, hence Dphi_1(0)=A."
  representation_results:
    - candidate_id: "BRIDGE-VECTOR"
      status: "fails"
      proof: "GL_plus acts transitively on nonzero vectors; equivalently the positive dilation 2I fixes no nonzero vector."
      falsifier: "Exhibit a nonzero vector fixed by every realized first jet."
    - candidate_id: "BRIDGE-COVECTOR"
      status: "fails"
      proof: "The contragredient GL_plus action is transitive on nonzero covectors and a positive dilation fixes no nonzero covector."
      falsifier: "Exhibit a nonzero covector fixed by every realized contragredient first jet."
    - candidate_id: "BRIDGE-PROPER-CONE"
      status: "fails"
      proof: "Transitivity on the punctured vector and covector spaces makes every nonempty invariant subset the full punctured space, so no proper nonempty cone survives."
      falsifier: "Exhibit a nonempty proper subset of a punctured tangent or cotangent space invariant under all GL_plus transformations."
    - candidate_id: "BRIDGE-LORENTZ-CONFORMAL-CONE"
      status: "fails"
      proof: "A Lorentzian null or hyperbolicity cone is a proper nonempty subset and its conformal stabilizer is a proper subgroup of GL_plus; it is not fixed by the realized group."
      falsifier: "Exhibit a Lorentzian conformal cone fixed by every element of GL_plus(4,R)."
    - candidate_id: "BRIDGE-ORIENTATION-SHEET"
      status: "fails_unique_selection"
      proof: "Every compactly supported diffeomorphism of connected U is orientation preserving, so both orientation sheets are individually invariant. K_star therefore preserves two alternatives but distinguishes no canonical one. Full current-source diffeomorphisms include orientation reversal and forbid a natural section of the orientation torsor."
      falsifier: "Construct from the bare smooth germ alone a unique orientation sheet natural under every current-source diffeomorphism."
    - candidate_id: "BRIDGE-SCALAR-LOCAL-RESPONSE"
      status: "fails_formation_or_nonfactorization"
      proof: "No response carrier or response law exists in the current typed source. If the input is restricted to the bare pointed smooth germ, all four-dimensional local germs are locally diffeomorphic, so any natural scalar is constant on the full local-diffeomorphism orbit and factors through it."
      falsifier: "Provide a separately typed current-source local response carrier and a nonconstant target-free natural scalar map that fails to factor through full local-diffeomorphism orbits."
  orientation_precision: "A mathematical orientation torsor and its two invariant sheets are not a uniquely selected sheet, a temporal orientation, a causal cone, or physical time."

large_quotient_locality_audit:
  theorem_id: "THM-RT004-PM-003"
  theorem_name: "LargeQuotientLocalGermSeparation"
  status: "proved_on_R4"
  normality_proof: "For every h in Diff(M) and f in Diff_c(M), supp(h f h^-1)=h(supp(f)), which is compact. Thus Diff_c(M) is normal and the algebraic quotient is well formed."
  same_germ_different_coset_witness:
    construction: "Choose a smooth strictly increasing radial function s with s(r)=r for r at most one and s(r)=2r for r at least two. Define F(0)=0 and F(x)=s(|x|)x/|x| for nonzero x."
    proof: "F is a smooth diffeomorphism, agrees with the identity near zero, and has noncompact support because F(x)=2x outside a compact ball. Hence F is not in Diff_c(R4), so q_inf(F) differs from q_inf(id) although their germs at zero agree."
    falsifier: "Show F is not a diffeomorphism, does not equal the identity near zero, has compact support, or lies in the identity quotient coset."
  same_coset_different_jet_witness:
    construction: "For any A in GL_plus(4,R), the compactly supported flow phi_A from the first-jet theorem has q_inf(phi_A)=q_inf(id) and Dphi_A(0)=A."
    conclusion: "The quotient both varies while a local germ is fixed and stays fixed while local first jets vary. It records large or end transformation class, not local germ or response data."
    falsifier: "Exhibit a quotient-factorized output that distinguishes two representatives in one Diff_c coset."
  scope_limit: "No topology, asymptotic charge, universal end structure, or physical response meaning is assigned to the quotient."

