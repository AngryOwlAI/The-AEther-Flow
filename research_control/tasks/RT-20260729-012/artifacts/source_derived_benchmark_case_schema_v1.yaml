    - "compare"
    - "independent_reproduction"
    - "classify_case"
  analytic_equivalence:
    priority: "preferred_when_exact_relation_is_available"
    required_fields:
      - "equivalence_relation"
      - "domain_and_regularities"
      - "units_or_dimensionless_status"
      - "gauge_or_presentation_quotient"
      - "boundary_conditions"
    target_label_reuse_is_equivalence: false
  numerical_residual:
    formula: "rho=norm_W(O_src-O_tgt)/max(s_prereg,norm_W(O_tgt),epsilon_floor)"
    required_fields:
      - "norm_W"
      - "sampling_domain"
      - "s_prereg"
      - "epsilon_floor"
      - "uncertainty_propagation"
      - "threshold_tau"
      - "threshold_units"
      - "error_budget_basis"
      - "calibration_source"
    threshold_status_in_this_task: "unset_for_all_cases"
    target_fit_may_select_threshold: false
  residual_corrections:
    categories:
      - "finite_size"
      - "coarse_graining"
      - "discretization"
      - "truncation"
      - "boundary"
      - "calibration"
      - "stochastic"
    uncontrolled_correction_disposition: "INCONCLUSIVE"

