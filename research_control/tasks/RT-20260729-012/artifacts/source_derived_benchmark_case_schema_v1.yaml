outcome_classifier:
  NOT_RUN: "Protocol exists but no source execution began."
  FAIL_FIREWALL: "A forbidden path, post-hoc tolerance, undeclared dependency, altered seal, or comparison feedback is detected."
  FAIL_SOURCE: "The source computation is ill-typed or fails its own declared validity checks."
  INCONCLUSIVE: "A required input, physical interpretation, tolerance, uncertainty bound, correction control, or independent reproduction is absent."
  CONDITIONAL: "The result depends on an underived proposal-only source extension or exposed calibration and is not recovery from unchanged ontology."
  FORMAL_ANALOGY: "Only formal source syntax or uncalibrated operational tokens are compared with physical target observables."
  FAIL_COMPARISON: "A valid sealed and independently reproduced source output lies outside the preregistered target criterion."
  PASS: "Firewall, source validity, independent reproduction, and preregistered comparison all pass in the exact case scope."
  pass_by_definition_forbidden: true
  local_pass_implies_benchmark_promotion: false

