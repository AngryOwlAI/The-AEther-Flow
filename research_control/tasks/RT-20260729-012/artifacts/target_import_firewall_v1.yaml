allowed_edges:
  source_stage:
    - "admissible_root_to_source_input"
    - "source_input_to_source_intermediate"
    - "source_intermediate_to_source_intermediate"
    - "source_intermediate_to_source_output"
    - "source_output_to_source_uncertainty_or_correction"
