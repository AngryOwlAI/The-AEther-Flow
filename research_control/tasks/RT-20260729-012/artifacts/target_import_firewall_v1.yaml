provenance_graph:
  graph_kind: "finite_directed_acyclic_graph"
  edge_semantics: "u_to_v means the value or selection of v depends on u"
  node_classes:
    admissible_roots:
      - "fixed_source_datum"
      - "disclosed_proposal_only_source_extension"
      - "independent_calibration_not_selected_by_target_fit"
      - "hashed_code_algorithm_environment_and_randomness_policy"
    source_stage:
      - "source_input"
      - "source_parameter"
      - "source_initial_or_boundary_datum"
      - "source_branch_or_stopping_rule"
      - "source_intermediate"
      - "source_output"
      - "source_uncertainty_and_correction"
    seal:
      - "immutable_source_manifest"
      - "preregistered_comparison_rule"
    target_roots:
      - "read_only_target_reference"
      - "external_observational_reference"
    comparison_stage:
      - "target_observable"
      - "comparison_residual"
      - "outcome_classifier"
  required_partition_disjointness: true
  acyclicity_required: true
  complete_edge_manifest_required: true
  undeclared_side_channel_disposition: "FAIL_FIREWALL"

