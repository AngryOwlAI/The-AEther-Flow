  - "outcome_classifier_to_source_stage"
  - "target_oracle_to_seal"
  - "post_seal_mutation_of_source_manifest"

stage_machine:
  initial_state: "PREREGISTRATION"
  states:
    PREREGISTRATION:
      required:
        - "complete case schema"
        - "source and code hash manifest"
        - "provenance DAG"
        - "analytic equivalence or numerical tolerance definition"
        - "failure and inconclusive rules"
      next: "FIREWALL_PRECHECK"
    FIREWALL_PRECHECK:
      required:
        - "DAG parses and is acyclic"
        - "every node is classified"
        - "every edge is declared"
        - "no forbidden root reaches source stage"
      failure: "FAIL_FIREWALL"
      next: "SOURCE_EXECUTION"
    SOURCE_EXECUTION:
      target_oracle_available: false
      required:
        - "exact manifest verified"
        - "source validity checks run"
        - "all intermediates recorded"
      failure: "FAIL_SOURCE"
      next: "SOURCE_SEAL"
    SOURCE_SEAL:
      required:
        - "canonical serialization"
        - "SHA-256 for roots code intermediates outputs rules and corrections"
        - "immutable write-once receipt"
      failure: "FAIL_FIREWALL"
      next: "TARGET_ORACLE_OPEN"
    TARGET_ORACLE_OPEN:
      precondition: "seal verifies byte-for-byte"
      source_mutation_allowed: false
      next: "COMPARISON"
    COMPARISON:
      source_feedback_allowed: false
      post_hoc_tuning_allowed: false
      missing_control_disposition: "INCONCLUSIVE"
      next: "INDEPENDENT_REPRODUCTION"
    INDEPENDENT_REPRODUCTION:
      primary_intermediate_sharing_allowed: false
      target_oracle_before_reproduction_seal_allowed: false
      next: "CLASSIFICATION"
    CLASSIFICATION:
      allowed_results:
        - "PASS"
        - "FAIL_COMPARISON"
        - "FAIL_FIREWALL"
        - "FAIL_SOURCE"
        - "INCONCLUSIVE"
      benchmark_promotion_effect: false

source_output_seal:
  serialization: "canonical JSON or an exactly specified byte serialization"
  hash_algorithm: "SHA-256"
  required_entries:
    - "case_id"
    - "protocol_version"
    - "source_input_paths_and_hashes"
    - "source_extension_status_and_hashes"
    - "independent_calibration_provenance_and_hashes"
    - "code_environment_and_dependency_hashes"
    - "randomness_policy_and_seed_commitment"
    - "derived_intermediate_manifest_and_hashes"
    - "source_output_and_hash"
    - "approximation_order_and_validity_domain"
    - "residual_corrections_and_bounds"
    - "analytic_equivalence_or_numerical_tolerance"
    - "success_failure_and_inconclusive_rules"
    - "provenance_dag_and_hash"
  target_reference_hashes_in_source_execution_manifest: false
  target_reference_identity_may_be_preregistered: true
  target_reference_content_available_before_seal: false
  seal_mutation_disposition: "FAIL_FIREWALL"

soundness_theorem:
  theorem_id: "TargetImportFirewallSoundness_v1"
  hypotheses:
    - hypothesis_id: "TF-H1"
      statement: "The provenance record is a finite DAG with a complete node and edge manifest."
    - hypothesis_id: "TF-H2"
      statement: "Every source-stage root is admissible and no forbidden or target root reaches any source-stage node."
    - hypothesis_id: "TF-H3"
      statement: "Every source node is a deterministic function of its parents or uses a sealed randomness distribution and seed policy."
    - hypothesis_id: "TF-H4"
      statement: "The full source manifest and outputs are immutable after the seal."
    - hypothesis_id: "TF-H5"
      statement: "The target oracle is unavailable until the seal verifies."
    - hypothesis_id: "TF-H6"
      statement: "Comparison nodes cannot alter a source value branch tolerance stopping rule or seal."
  conclusion: "The sealed source output is invariant under changes to target-reference roots that leave admissible source roots fixed; declared target data therefore cannot be the upstream cause of the source output or its later agreement."
  proof_method: "topological induction over source-stage nodes followed by seal immutability"
  necessary_not_sufficient:
    - "does not prove the manifest has no implementation side channel"
    - "does not prove a proposal-only source extension follows from current ontology"
    - "does not supply model-to-world semantics"
    - "does not execute or pass a benchmark"
    - "does not authorize Gate E or benchmark promotion"

counterexample_control:
  control_id: "TARGET-IMPORT-MINIMAL-COUNTEREXAMPLE-001"
  target_root: "target_metric_or_solution"
  illicit_edge: "target_root_to_source_boundary_parameter"
  downstream_path:
    - "source_boundary_parameter"
    - "source_solver"
    - "source_output"
  observed_agreement: "may_be_exact"
  expected_firewall_result: "FAIL_FIREWALL"
  lesson: "Exact agreement does not cure circular provenance."

