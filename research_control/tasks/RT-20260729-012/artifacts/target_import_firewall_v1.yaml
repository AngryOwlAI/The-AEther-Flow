failure_branches:
  - failure_id: "TIF-F01"
    trigger: "A forbidden target root reaches a source-stage node."
    result: "FAIL_FIREWALL"
  - failure_id: "TIF-F02"
    trigger: "The provenance graph is cyclic incomplete or contains an unclassified node."
    result: "FAIL_FIREWALL"
  - failure_id: "TIF-F03"
    trigger: "The target oracle opens before the source seal verifies."
    result: "FAIL_FIREWALL"
  - failure_id: "TIF-F04"
    trigger: "A source value parameter branch tolerance or stopping rule changes after target comparison."
    result: "FAIL_FIREWALL"
  - failure_id: "TIF-F05"
    trigger: "A fixed source or code hash differs."
    result: "FAIL_SOURCE"
  - failure_id: "TIF-F06"
    trigger: "Source equations controls units or validity regime fail."
    result: "FAIL_SOURCE"
  - failure_id: "TIF-F07"
    trigger: "Tolerance correction uncertainty physical semantics or reproduction evidence is missing."
    result: "INCONCLUSIVE"
  - failure_id: "TIF-F08"
    trigger: "A valid sealed independently reproduced source output misses the preregistered criterion."
    result: "FAIL_COMPARISON"

