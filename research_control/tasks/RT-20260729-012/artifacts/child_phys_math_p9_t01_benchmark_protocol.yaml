provenance_dag:
  object_id: "TypedBenchmarkProvenanceDAG_v1"
  case_graph: "G_c=(V_c,E_c,tau_c,lambda_c)"
  graph_properties:
    - "V_c is finite."
    - "E_c is directed and acyclic."
    - "tau_c is a total vertex-type map."
    - "lambda_c binds each vertex to a content-addressed record."
  vertex_types:
    admissible_roots:
      - type: "source_fixed"
        meaning: "unchanged, hashed source-side record already admitted at its exact status"
      - type: "source_extension_proposal_only"
        meaning: "explicitly declared proposal-only source-extension datum; never silently upgraded to adopted input"
      - type: "independent_calibration"
        meaning: "non-target calibration acquired or fixed without optimizing benchmark agreement"
      - type: "code_and_environment"
        meaning: "hashed executable code, dependency lock, solver configuration, hardware-relevant settings, and random-seed policy"
    forbidden_roots:
      - "target_atlas"
      - "target_metric"
      - "target_solution_or_ansatz"
      - "Einstein_Hilbert_action"
      - "Einstein_equations"
      - "target_geodesic_or_characteristic_cone"
      - "target_cosmological_or_compact_source_equations"
      - "desired_target_residual"
      - "benchmark_success_label"
      - "target_fitted_parameter_or_tolerance"
      - "adopted_GR_dynamics_used_as_source_dynamics"
    source_stage:
      - "source_input"
      - "source_intermediate"
      - "source_approximation"
      - "source_correction_bound"
      - "source_output"
      - "sealed_source_output"
    comparison_stage:
      - "oracle_commitment"
      - "target_oracle_reveal"
      - "comparison_projection"
      - "analytic_equivalence_check"
      - "numerical_residual_check"
      - "case_verdict"
  root_partition:
    statement: "Every root is classified exactly once as admissible, forbidden, or target-oracle; an unclassified root invalidates the case."
    hidden_or_embedded_target_rule: "Code, lookup tables, initial data, priors, training data, boundary data, or calibration containing target information are reclassified as forbidden-target roots even when their filename or declared type says code or source."
  source_region:
    symbol: "S_c"
    definition: "all source-stage vertices up to and including the sealed source output"
  admissible_root_set:
    symbol: "A_c"
    definition: "source_fixed, proposal-only source-extension, independent-calibration, and clean code/environment roots"
  forbidden_root_set:
    symbol: "F_c"
    definition: "all forbidden roots, including any contaminated nominally admissible root"
  target_oracle_set:
    symbol: "T_c"
    definition: "committed target-reference material revealed only after source sealing"
  source_closure_condition:
    formula: "Anc(S_c) intersect Roots(G_c) is a subset of A_c"
    equivalent_no_path_form: "for every z in F_c union T_c and every s in S_c, there is no directed path z ->* s"
  comparison_direction_condition:
    formula: "target-oracle and comparison vertices may receive an edge from a sealed source output, but no comparison-stage vertex may reach S_c"
  verdict_parent_condition:
    formula: "every decisive case verdict has both the sealed-source-output hash and the revealed target-oracle hash as ancestors"
  graph_completeness_condition:
    statement: "Every data, code, parameter-selection, initialization, approximation, correction, and human-choice dependency affecting source output is represented by a vertex and edge."
    failure_status: "INVALID_PROVENANCE_INCOMPLETE"

source_seal:
  seal_id: "SourceOutputSeal_v1"
  hash_algorithm: "SHA-256"
  canonical_preimage:
    - "case schema hash"
    - "ordered admissible-root manifest and content hashes"
    - "code commit and executable-source hashes"
    - "dependency-lock and environment hashes"
    - "solver and approximation configuration"
    - "random-seed policy and realized seed manifest"
    - "source intermediates selected for audit"
    - "source outputs"
    - "source correction and uncertainty budgets"
    - "execution log hash"
  seal_formula: "sigma_c=SHA256(canonical_encode(case_id,revision,input_manifest,code_manifest,environment_manifest,configuration,intermediate_manifest,source_output,uncertainty_budget,log_hash))"
  acceptance_rule: "A seal is accepted before any target-oracle reveal and is immutable for that case revision."
  mutation_rule: "Any changed input, code, environment, parameter, intermediate, output, tolerance, or correction budget requires a new case revision and a new blind run; the old revision remains immutable."

target_oracle:
  oracle_id: "PostSealTargetOracle_v1"
  purpose: "hold target reference definitions and values for comparison only"
  pre_run_commitment: "Commit the oracle manifest hash and comparator specification before source execution while withholding oracle payload values from the source executor."
  release_precondition:
    - "source output is sealed"
    - "source provenance graph passes completeness and no-path checks"
    - "case-local comparison functional, observable projection, units, norms, and thresholds are pre-registered"
  allowed_edges:
    - "target_oracle_reveal -> comparison_projection"
    - "sealed_source_output -> comparison_projection"
    - "comparison_projection -> case_verdict"
  forbidden_edges:
    - "target_oracle_reveal -> source_input"
    - "target_oracle_reveal -> source_intermediate"
    - "target_oracle_reveal -> source_parameter_selection"
    - "comparison_result -> source_rerun_under_same_case_revision"
  target_reference_authority: "comparison target only; never evidence that the source theory derives the target"

theorem:
  theorem_id: "TargetImportFirewallSoundness_v1"
  theorem_kind: "theorem_with_hypotheses_and_proof"
  theorem_status: "draft/control"
  statement: "For a case c whose typed provenance DAG is complete, whose roots are correctly classified, whose source region satisfies Anc(S_c) intersect Roots(G_c) subseteq A_c, whose source output and provenance are bindingly sealed before target-oracle reveal, and whose case revision is immutable after reveal, no forbidden target root or target-oracle datum can be a directed causal ancestor of the sealed source output. Consequently, a later PASS verdict cannot be obtained by an upstream target import within the declared computation."
  hypotheses:
    - hypothesis_id: "H1_FINITE_DAG"
      statement: "G_c is finite, directed, acyclic, and every vertex has exactly one declared type."
    - hypothesis_id: "H2_COMPLETE_PROVENANCE"
      statement: "The graph contains every dependency that can affect source inputs, parameter selection, execution, intermediates, approximations, corrections, or outputs."
    - hypothesis_id: "H3_CORRECT_ROOT_CLASSIFICATION"
      statement: "Every root is correctly classified; target-contaminated code, calibration, boundary, prior, or lookup material belongs to F_c."
    - hypothesis_id: "H4_SOURCE_CLOSURE"
      statement: "All root ancestors of S_c lie in A_c, equivalently no vertex in F_c union T_c reaches any vertex in S_c."
    - hypothesis_id: "H5_BINDING_SEAL"
      statement: "The accepted seal binds the complete source manifest and output before any target-oracle reveal; hash collisions or canonicalization ambiguity are excluded operationally."
    - hypothesis_id: "H6_PRE_REGISTERED_COMPARISON"
      statement: "Observable projections, analytic-equivalence criteria, norms, units, uncertainty rules, tolerances, and failure branches are committed before the source run."
    - hypothesis_id: "H7_POST_SEAL_ORACLE"
      statement: "The oracle is inaccessible to the source executor until the seal is accepted, and after reveal it has edges only into comparison-stage vertices."
    - hypothesis_id: "H8_REVISION_IMMUTABILITY"
      statement: "No source-stage mutation or rerun is accepted under the same case revision after oracle reveal."
  proof_sketch:
    - "Assume for contradiction that some z in F_c union T_c causally affects the sealed source output y_c in the declared computation."
    - "By complete provenance H2, that dependence is represented by a directed path z ->* y_c."
    - "Because y_c lies in S_c, this path contradicts H4."
    - "H5 and H7 ensure that target material revealed after sealing cannot retroactively change y_c, while H8 prevents a target-informed rerun from being substituted under the same case revision."
    - "Therefore no forbidden or target-oracle vertex is an ancestor of y_c; comparison may depend on both y_c and the oracle, but the source output may not depend on the oracle."
    - "A PASS can therefore express post-seal agreement only. It cannot, under H1 through H8, be satisfied by importing target dynamics into the declared upstream source computation."
  converse_not_claimed:
    - "No-path provenance does not imply that the source model is physically correct."
    - "No-path provenance does not imply agreement with GR."
    - "A recorded graph cannot exclude an undisclosed dependency; H2 and H3 must be audited."
    - "Hash integrity does not prove semantic correctness of code or source classifications."
    - "Protocol soundness is not a derivation of geometry, field equations, observables, or exact-GR recovery."

negative_controls:
  - control_id: "NC-01-TARGET_TUNED_PARAMETER"
    construction: "target oracle -> parameter selector -> source solver -> sealed output"
    expected_firewall_result: "INVALID_TARGET_IMPORT"
    reason: "a forbidden path reaches the source region"
  - control_id: "NC-02-EMBEDDED_GR_CODE"
    construction: "nominal code root contains an Einstein-equation solver or target solution lookup table"
    expected_firewall_result: "INVALID_ROOT_CLASSIFICATION"
    reason: "the contaminated code root must be reclassified as forbidden"
  - control_id: "NC-03-POST_SEAL_COMPARISON"
    construction: "sealed source output and later target-oracle reveal meet only at a comparison node"
    expected_firewall_result: "FIREWALL_VALID_IF_ALL_OTHER_HYPOTHESES_HOLD"
    reason: "target comparison is downstream and cannot alter the sealed source output"
  - control_id: "NC-04-ORACLE_INFORMED_RERUN"
    construction: "comparison residual -> parameter change -> rerun accepted under the original case revision"
    expected_firewall_result: "INVALID_POST_REVEAL_MUTATION"
    reason: "the original blind case is immutable; a new revision and new blind protocol are required"

case_schema:
  schema_id: "SourceDerivedBenchmarkCase_v1"
  required_fields:
    identity:
      - "case_id"
      - "case_revision"
      - "aligned_plan_task_id"
      - "scientific_question"
      - "status"
      - "claim_boundary"
    source_provenance:
      - "source_input_manifest with path, object_id, status, allowed_use, and sha256"
      - "proposal-only source-extension manifest kept distinct from adopted inputs"
      - "independent-calibration manifest with acquisition provenance and uncertainty"
      - "forbidden-root manifest"
    mathematical_definition:
      - "domains, codomains, regularity, units or dimensionless status, and gauge or quotient relation"
      - "source-derived equations or finite analogues"
      - "initial and boundary data with source provenance"
      - "derived intermediates and their dependency edges"
      - "existence, uniqueness, branch-selection, and failure assumptions"
    approximation_contract:
      - "regime and dimensionless expansion parameter"
      - "retained order"
      - "remainder norm and correction bound"
      - "finite-size, discretization, coarse-graining, and solver errors"
      - "breakdown and out-of-domain conditions"
    observable_contract:
      - "source-output observables and source-only extraction maps"
      - "post-seal comparison projection"
      - "analytic-equivalence criteria where applicable"
      - "numerical residual definition, units, normalization, uncertainty, and pre-registered threshold"
    execution_contract:
      - "code, dependency, environment, solver, and seed hashes"
      - "provenance DAG"
      - "source-output seal"
      - "target-oracle commitment and reveal receipt"
      - "primary execution receipt"
      - "independent reproduction receipt"
    verdict_contract:
      - "mandatory observable list"
      - "PASS, FAIL, INCONCLUSIVE, INVALID, and NOT_RUN branches"
      - "no-aggregation rule that prevents a failed mandatory observable from being averaged away"
      - "scope-limited interpretation"

comparison_rules:
  analytic_equivalence:
    use_when: "both source output and target reference admit exact symbolic objects in a declared common comparison domain"
    required_evidence:
      - "explicit comparison map with domain and codomain"
      - "equivalence relation or canonical normal form"
      - "all hypotheses and valid regime"
      - "machine-checkable symbolic trace or a complete proof"
      - "independent checker or reproduction"
    pass_rule: "the mapped source object equals the target object under the predeclared equivalence relation exactly"
    numerical_tolerance_used: false
    forbidden_shortcut: "Do not call a small sampled residual an analytic equivalence proof."
  numerical_tolerance:
    use_when: "the comparison is approximate, discretized, stochastic, or contains measured uncertainty"
    normalized_residual: "rho_i=Norm_i(P_i(y_c)-t_i)/s_i, where P_i, Norm_i, and positive scale s_i are pre-registered"
    absolute_residual: "r_i=Norm_i(P_i(y_c)-t_i)"
    pass_rule: "Every mandatory i satisfies its pre-registered absolute or dimensionless threshold after separately reporting solver, discretization, approximation, calibration, and target-reference uncertainty."
    threshold_constraints:
      - "fixed before source execution and oracle reveal"
      - "dimensionally valid"
      - "justified independently of observed target agreement"
      - "not widened after seeing a residual"
      - "not used to select source parameters or branches"
      - "not larger than the regime in which the approximation and correction bounds are valid"
    missing_threshold_result: "INCONCLUSIVE_TOLERANCE_NOT_JUSTIFIED"
    target_tuned_threshold_result: "INVALID_TARGET_TUNED_TOLERANCE"
  hybrid_case:
    rule: "Judge exact identities by analytic equivalence and approximate observables by numerical thresholds; do not let one substitute for the other."
  residual_correction_separation:
    rule: "Report model-target residual separately from computational and approximation uncertainty; never relabel an unexplained physical deviation as numerical correction."

verdict_lattice:
  statuses:
    - status: "PASS_ANALYTIC"
      condition: "all mandatory exact comparisons satisfy analytic equivalence and every firewall and reproduction requirement passes"
    - status: "PASS_NUMERICAL"
      condition: "all mandatory residuals meet pre-registered thresholds with controlled uncertainty and every firewall and reproduction requirement passes"
    - status: "FAIL_BENCHMARK_DISAGREEMENT"
      condition: "a valid sealed source output disagrees with at least one mandatory target observable beyond its controlled threshold or violates an exact equivalence"
    - status: "FAIL_INTERNAL_SOURCE_CONSISTENCY"
      condition: "source equations, constraints, conservation relations, stability requirements, or source-derived branch conditions fail within the declared regime"
    - status: "INCONCLUSIVE_UPSTREAM_OBJECT_ABSENT"
      condition: "a required source-derived carrier, equation, observable map, physical semantics, calibration, or correction bound is absent"
    - status: "INCONCLUSIVE_UNCERTAINTY_DOMINATES"
      condition: "the uncertainty or approximation envelope is too broad for a decisive comparison"
    - status: "INCONCLUSIVE_REPRODUCTION_NOT_ACQUIRED"
      condition: "the primary computation is otherwise valid but the required independent reproduction is absent or nondecisive"
    - status: "INVALID_TARGET_IMPORT"
      condition: "a forbidden target root reaches the source region"
    - status: "INVALID_PROVENANCE_OR_HASH"
      condition: "the dependency graph is incomplete, a root is unclassified, or a required content hash fails"
    - status: "INVALID_POST_REVEAL_MUTATION"
      condition: "a source-stage change or rerun is substituted under the same case revision after oracle reveal"
    - status: "NOT_RUN"
      condition: "the case protocol exists but no execution has occurred"
  aggregation_rule: "A case passes only if every mandatory observable has a PASS status and no INVALID, FAIL, or unresolved INCONCLUSIVE status is present."

hash_and_reproducibility_contract:
  source_hashing:
    algorithm: "SHA-256"
    required_manifest_entries:
      - "canonical source path and registry object_id when registered"
      - "scientific status and allowed use"
      - "byte hash"
      - "transitive parent hashes"
      - "case-local assumption and calibration hashes"
  code_hashing:
    required_manifest_entries:
      - "repository commit"
      - "dirty-diff hash, which must be empty or exactly authorized and preserved"
      - "executable source hashes"
      - "dependency-lock hash"
      - "interpreter or compiler version"
      - "solver and numerical-library versions"
      - "environment or container manifest hash"
      - "hardware-sensitive settings where results can vary"
      - "configuration and random-seed manifest hashes"
  independent_reproduction:
    required_independence:
      - "fresh executor or independently controlled execution unit"
      - "clean reconstruction from the committed source and code hashes"
      - "new environment built from the declared lock manifest"
      - "no shared intermediate files, caches, serialized solver state, or source outputs"
      - "independent source-output seal before target-oracle reveal"
      - "independent provenance and firewall audit"
    deterministic_rule: "The reproduced source output must match exactly or within a predeclared platform tolerance justified before oracle reveal."
    stochastic_rule: "Use a predeclared independent seed family and compare distributions with a predeclared statistic and error control."
    disagreement_rule: "Preserve both executions and return INCONCLUSIVE_REPRODUCTION_DISAGREEMENT until the discrepancy is resolved without target tuning."
    external_replication_boundary: "P9-T08 remains responsible for the full audit and external replication; task-local checking cannot promote the suite."

