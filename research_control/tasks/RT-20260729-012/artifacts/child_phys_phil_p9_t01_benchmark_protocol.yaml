cross_case_suite_audit:
  immutable_suite_commitments:
    - "one fixed source ontology and adopted-law version unless a new suite version is opened"
    - "one explicit ledger of proposal-only extensions and target exposure"
    - "suite-global physical constants and calibration rules"
    - "shared model-to-world maps or explicit reasons for lawful case-local differences"
    - "stable unit conventions and uncertainty semantics"
    - "stable approximation and correction hierarchy"
  consistency_failures:
    - "case-specific parameter retuning"
    - "case-specific source ontology or hidden source-extension changes"
    - "using an earlier target-exposed case result as an unmarked source derivation in a later case"
    - "different physical meanings assigned to the same formal operational token"
    - "excluding a fatal case from the aggregate verdict"
  calibration_sequence_rule: >-
    If P9-T02 or another early case fixes a parameter using target information,
    that case is a calibration case for that parameter. Only later cases whose
    oracles remained unopened after the parameter freeze may provide
    out-of-sample evidence, and every result remains conditional on the status
    of any proposal-only extension.
  aggregation_rule: >-
    Report every pass, failure, rejection, and inconclusive case separately.
    No weighted average, majority vote, or broad qualitative resemblance may
    erase a fatal target import, uncontrolled instability, missing physical
    semantics, or failed required benchmark.

findings:
  - finding_id: "P9T01-PHIL-001"
    severity: "blocking_against_overclaim"
    statement: "A provenance-DAG non-reachability theorem can establish protocol-level computational non-circularity under explicit hypotheses; it cannot establish physical recovery, theorem truth outside those hypotheses, or absence of unrecorded human target influence."
  - finding_id: "P9T01-PHIL-002"
    severity: "blocking_against_overclaim"
    statement: "A result depending on proposal-only source-extension data must remain conditional and cannot be reported as recovery from the unchanged ontology."
  - finding_id: "P9T01-PHIL-003"
    severity: "blocking"
    statement: "The fixed P7 operational roles remain formal tokens; without a model-to-world map, clock, rod, signal, detector, and free-fall comparisons are formal analogies or physically inconclusive."
  - finding_id: "P9T01-PHIL-004"
    severity: "high"
    statement: "Calibration and testing require an explicit partition; a target datum used to fix a parameter cannot also count as an independent prediction of that parameter."
  - finding_id: "P9T01-PHIL-005"
    severity: "high"
    statement: "The post-seal boundary must be one-way. Any oracle-informed rerun is a new target-exposed protocol version, not continuation of the original blind case."
  - finding_id: "P9T01-PHIL-006"
    severity: "high"
    statement: "Independent reproduction requires independent code or method provenance and no shared intermediates; same-context parent-child synthesis and ordinary reruns do not qualify."
  - finding_id: "P9T01-PHIL-007"
    severity: "high"
    statement: "Current fixed P5 through P8 evidence lacks the effective metric, physical dynamics, principal symbol, scale control, and model-to-world semantics needed by the proposed cases; a future case must add materially new lawful payload or return an exact inconclusive or failure status."
  - finding_id: "P9T01-PHIL-008"
    severity: "blocking_against_promotion"
    statement: "Protocol correctness, case agreement, validators, commits, and internal review do not create Gate E authority or repair the protected Gate D NOT READY verdict."
  - finding_id: "P9T01-PHIL-009"
    severity: "high"
    statement: "Suite-global parameter, source-status, semantic, and correction commitments must be frozen across P9-T02 through P9-T07; unexplained case-specific changes are target-tuning evidence."
  - finding_id: "P9T01-PHIL-010"
    severity: "high"
    statement: "Firewall rejection, benchmark failure, conditional proposal-only agreement, formal analogy, and physical inconclusiveness are distinct outcomes and must never be collapsed into pass."
  - finding_id: "P9T01-PHIL-011"
    severity: "medium"
    statement: "Known target cases can legitimately guide what is tested, but target exposure must be recorded; it weakens claims of blind discovery and increases the importance of held-out cases and independent replication."
  - finding_id: "P9T01-PHIL-012"
    severity: "high"
    statement: "A post-seal match shows correspondence within the declared regime; it does not establish ontological truth, uniqueness, completed derivation, or empirical novelty."

