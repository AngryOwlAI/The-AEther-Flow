epistemic_type_separation:
  source_model:
    definition: >-
      Canonical or lawfully adopted source ontology, source laws, source
      states, and source-side consequences with exact version and provenance.
    admissible_use: "May be an upstream source-computation root within its exact declared scope."
    required_metadata:
      - "object identity and authority status"
      - "exact source hash"
      - "derivation or adoption provenance"
      - "domain, codomain, regime, and failure set"
    does_not_include:
      - "a familiar target-side name attached to an untyped source token"
      - "a proposal-only extension silently treated as derived"
      - "a validator, checkpoint, registry row, or role declaration used as scientific evidence"
  source_extension_construction:
    definition: >-
      An explicitly introduced proposal-only source-side object, law, map,
      ansatz, completion, or coefficient not derived by the fixed source
      model.
    admissible_use: >-
      May be explored as a declared source-extension root, but its contribution
      must remain visible in the case result and cannot establish recovery from
      the unchanged ontology.
    result_ceiling_without_adoption_or_derivation: "conditional_on_proposal_only_source_extension"
    target_exposure_rule: >-
      If the extension was designed, selected, or altered after exposure to a
      target oracle, its matching case is calibration or construction evidence,
      not an independent benchmark test.
    holdout_rule: >-
      A proposal-only extension frozen before unopened later cases may support
      conditional holdout evidence for those later cases, but it still does
      not become canonical, adopted, or source-derived.
  independent_calibration:
    definition: >-
      A declared unit, scale, nuisance parameter, or empirical calibration
      fixed by a provenance source independent of the target case being tested.
    required_partition:
      - "calibration inputs and cases"
      - "validation inputs and cases"
      - "held-out benchmark inputs and cases"
    suite_rule: >-
      A quantity calibrated on one case must be frozen suite-wide before later
      target oracles are opened. The calibration case cannot simultaneously be
      counted as an independent prediction of the calibrated quantity.
    forbidden:
      - "choosing signs, normalizations, dimension, signature, or branch from target agreement and calling the choice source-derived"
      - "case-specific retuning without a preregistered universal source rule"
      - "using a target residual to change preprocessing, solver settings, approximation order, stopping rules, or accepted output"
  operational_tokens:
    definition: >-
      Formal source-syntax outputs such as Clock_src ticks, Rod_src hops,
      Signal_src arrivals, Detector_src triggers, and FreeFall_src contrasts.
    current_status: "formal_only_no_empirical_referent"
    licensed_claims:
      - "typed source history produced a declared formal token"
      - "formal token counts or rational bookkeeping responses agree or differ"
    blocked_claims_without_model_to_world_map:
      - "elapsed physical time or clock rate"
      - "physical distance, rigidity, or rod length"
      - "physical causal propagation or signal speed"
      - "measurement, detection, or observed response"
      - "physical free fall, acceleration, or geodesic motion"
  target_oracle:
    definition: >-
      A read-only target theory, target solution, benchmark expectation, or
      empirical comparison record that is inaccessible to source computation
      until the source output and its complete provenance are sealed.
    permitted_use:
      - "define a post-seal comparison object"
      - "evaluate preregistered analytic-equivalence or numerical-residual rules"
      - "report agreement, deviation, failure, or inconclusive status"
    forbidden_use:
      - "select source inputs, fields, ansatz, branch, coefficients, boundary data, gauge, code path, tolerance, or stopping rule"
      - "repair or rerun the same sealed case while preserving its blind-test label"
  comparison:
    definition: >-
      A post-seal operation that maps an immutable source output and an opened
      target oracle into preregistered residual and classification objects.
    epistemic_effect: >-
      Agreement is evidence of output correspondence under the declared case;
      it is not a derivation of the source model, a proof of unique explanation,
      an ontology adoption, or a protected benchmark promotion.
  protocol_correctness:
    definition: >-
      Satisfaction of schema, provenance-DAG, root classification, reachability,
      hashing, sealing, and outcome-classification rules.
    possible_theorem_scope: >-
      Under explicit hypotheses, a forbidden target root is not an ancestor of
      any source output and cannot cause agreement through an encoded upstream
      dataflow edge.
    cannot_establish:
      - "truth or physical adequacy of source premises"
      - "absence of target influence in an author's prior knowledge"
      - "physical meaning of formal tokens"
      - "numerical correctness of an implementation"
      - "independent replication"
      - "physical recovery or Gate E promotion"
  physical_recovery:
    definition: >-
      A case-qualified relation from source-model inputs through derived
      physical observables and a justified model-to-world map to a target
      benchmark within a controlled regime.
    necessary_not_sufficient_conditions:
      - "all scientific roots have exact status and provenance"
      - "no forbidden target ancestor or target-conditioned control flow"
      - "source-derived or explicitly scoped construction path"
      - "physical observable typing and model-to-world semantics"
      - "units, approximation order, residual corrections, and uncertainty"
      - "case-local success and failure criteria fixed before execution"
      - "suite-global parameters frozen according to the calibration partition"
      - "independent reproduction without shared intermediates"
    underdetermination_guard: >-
      Agreement on selected benchmarks does not by itself establish that the
      source ontology is true, uniquely explanatory, or derivationally complete.
  protected_Gate_E_promotion:
    definition: "A later exact human-gated verdict over the complete benchmark and replication package."
    prerequisites:
      - "P9-T02 through P9-T07 have explicit decisive or preserved inconclusive outcomes"
      - "P9-T08 target-import audit and genuinely independent reproduction are complete"
      - "all earlier protected gate statuses and unresolved failures are visible"
      - "exact nonblank human Gate E authority is present and consumed once"
    not_created_by:
      - "this protocol"
      - "a protocol-soundness theorem"
      - "one or more case matches"
      - "validator PASS"
      - "checkpoint or commit"
      - "internal parent-child synthesis"
  model_to_world_semantics:
    definition: >-
      A typed, independently justified map from source states and formal tokens
      to preparation procedures, physical quantities, units, interventions,
      measurement records, and uncertainty-bearing observables.
    minimum_fields:
      - "source domain and formal token domain"
      - "physical or empirical codomain"
      - "preparation and intervention semantics"
      - "unit and scale calibration provenance"
      - "uncertainty and failure model"
      - "regime of validity"
      - "cross-device and cross-sector identification rule"
      - "independent reproduction method"
    current_status: "not_supplied_by_fixed_P5_through_P8_package"

provenance_dag_audit:
  admissible_upstream_root_classes:
    - "fixed_source_model"
    - "declared_proposal_only_source_extension"
    - "independent_calibration"
    - "hashed_code_and_environment"
  prohibited_upstream_root_classes:
    - "target_atlas"
    - "target_metric_or_connection"
    - "target_solution_or_ansatz"
    - "Einstein_Hilbert_action"
    - "Einstein_equations_or_target_constraints"
    - "target_benchmark_success_or_residual"
    - "target_derived_parameter_or_branch_selection"
    - "target_conditioned_tolerance_or_stopping_rule"
  node_level_requirements:
    - "stable node identity, type, content hash, and authority status"
    - "declared parent edges with semantic roles"
    - "source-extension and calibration flags propagated to every descendant"
    - "deterministic or explicitly seeded transformation record"
    - "no mutable external dependency without an exact snapshot hash"
  pre_seal_reachability_rule: >-
    Every source input, intermediate, branch selector, parameter, approximation,
    residual estimator, solver setting, stopping rule, and output must be
    reachable only from admissible upstream roots.
  seal_record_requirements:
    - "case schema hash"
    - "complete provenance-DAG hash"
    - "all source, calibration, code, dependency, and environment hashes"
    - "source output and intermediate hashes"
    - "parameter, approximation, tolerance, and stopping-rule commitments"
    - "timestamped immutable run identifier"
    - "target-exposure ledger"
  post_seal_rule: >-
    The target oracle may be opened only after a valid seal exists. Comparison
    edges point from the sealed output and oracle into a comparison record;
    no edge may return to the sealed source graph.
  rerun_rule: >-
    Any change after oracle exposure creates a new protocol version and a new
    nonblind run. The original sealed result remains preserved. A repaired run
    cannot inherit the original run's blind or independent-test status.
  theorem_limit: >-
    DAG non-reachability proves a syntactic and computational firewall under
    the declared graph. It cannot represent unrecorded human knowledge,
    undocumented manual edits, omitted dependencies, or covert channels.

