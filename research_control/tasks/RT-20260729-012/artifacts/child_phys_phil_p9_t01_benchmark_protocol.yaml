benchmark_lifecycle_contract:
  preregistration_before_any_case_run:
    required:
      - "case identity and exact source question"
      - "scientific root allowlist with statuses and hashes"
      - "source-extension and calibration ledger"
      - "complete computation graph and code/environment hashes"
      - "all free parameters, branch rules, seeds, and boundary data"
      - "approximation order, valid regime, correction terms, residual norm, and uncertainty model"
      - "analytic-equivalence criterion and numerical tolerance"
      - "success, benchmark-failure, protocol-rejection, and inconclusive rules"
      - "target oracle identity or sealed hash commitment"
      - "model-to-world map or explicit statement that physical interpretation is unavailable"
      - "independent-reproduction plan"
    missing_required_field_disposition: "protocol_invalid_not_run"
  source_execution:
    oracle_access: "forbidden"
    undeclared_manual_intervention: "forbidden"
    provenance_capture: "mandatory_for_every_node_and_edge"
    hash_drift_disposition: "fail_closed_dependency_drift"
  output_seal:
    required_before_comparison: true
    seal_is_immutable: true
    seal_failure_disposition: "protocol_invalid_no_comparison"
  post_seal_comparison:
    oracle_access: "permitted_read_only"
    feedback_to_source_graph: "forbidden"
    result_preservation: "mandatory_including_failure_and_inconclusive"
  independent_reproduction:
    required_for_recovery_evidence: true
    minimum_conditions:
      - "fresh execution environment"
      - "independently established code or method provenance"
      - "no shared source intermediates or cached outputs"
      - "same public protocol and exact scientific-root hashes"
      - "oracle remains inaccessible until the independent output seal"
      - "all divergences and failed attempts are retained"
    does_not_count:
      - "rerunning the same code in the same environment"
      - "same-context parent-child role separation"
      - "copying shared intermediates"
      - "reviewing only the final comparison table"
      - "validator PASS"

outcome_taxonomy:
  protocol_invalid_not_run:
    applies_when:
      - "required schema, provenance, hashes, tolerances, or branch rules are absent"
      - "source graph cannot be sealed"
    benchmark_meaning: "none"
  firewall_rejected:
    applies_when:
      - "a forbidden target root reaches source computation"
      - "oracle feedback or undeclared dependency is detected"
      - "proposal, calibration, or process status is laundered"
    benchmark_meaning: "none; preserve as a protocol failure"
  benchmark_fail:
    applies_when:
      - "a valid sealed source output is outside preregistered analytic or numerical acceptance criteria"
      - "a required stability, universality, conservation, or residual criterion fails"
    benchmark_meaning: "negative evidence in the exact declared scope"
  inconclusive:
    applies_when:
      - "numerical or analytic uncertainty straddles the threshold"
      - "a required physical observable or model-to-world map is missing"
      - "correction or regime control is insufficient"
      - "independent reproduction is absent or conflicts without resolution"
      - "multiple source branches remain admissible with incompatible target outcomes"
    benchmark_meaning: "no pass or fail; exact missing datum must be named"
  conditional_on_proposal_only_source_extension:
    applies_when:
      - "the case is valid but a result depends on an unadopted or underived source-extension construction"
    benchmark_meaning: "conditional candidate behavior, not recovery from the unchanged ontology"
  formal_analogy_only:
    applies_when:
      - "only uncalibrated formal tokens or structural source objects are compared to physical target observables"
    benchmark_meaning: "mathematical resemblance without physical recovery"
  pass_eligible:
    applies_when:
      - "the protocol, firewall, physical typing, model-to-world semantics, tolerances, corrections, and independent reproduction all pass"
    benchmark_meaning: "case-qualified recovery evidence only"
    automatic_Gate_E_or_completed_derivation: false
  current_P9_T01_status: "protocol_only_not_run"

proposed_case_audits:
  - plan_task_id: "P9-T02"
    case_name: "vacuum_and_Minkowski_effective_limit"
    target_question: "Does a source-defined vacuum or stationary phase yield a physically typed flat effective background and controlled perturbative behavior?"
    required_source_side_products:
      - "source-defined vacuum or stationary-state predicate independent of target flatness"
      - "source-derived effective carrier, metric or lawful replacement, dimension, signature, and locality"
      - "source-derived matter-vacuum criterion"
      - "source-derived perturbative operator, physical mode interpretation, and stability regime"
      - "correction and finite-size or coarse-graining control"
    live_fixed_constraints:
      - "P6 Gate B reports zero of eight and no lawful unscoped effective metric."
      - "P8 supplies an exact finite static equation but no physical dynamical completion."
      - "Gate D remains NOT READY."
    principal_circularity_channels:
      - "defining vacuum as vanishing target stress energy or curvature"
      - "selecting four dimensions, Lorentz signature, flat atlas, constant target metric, or zero target connection because the desired oracle is Minkowski"
      - "using the target linearized equations or target mode count as the source perturbation operator"
      - "choosing a source branch because its post hoc reconstruction looks flat"
    oracle_only_content:
      - "Minkowski invariant and coordinate-independent flatness expectations"
      - "target matter-vacuum and perturbative comparison data"
    fail_closed_if:
      - "target flat geometry or target vacuum is an upstream definition"
      - "target perturbations select the source operator or branch"
    inconclusive_if:
      - "no source-derived effective geometry or physical vacuum map exists"
      - "flatness is only a formal finite-graph analogy"
      - "physical perturbation and stability semantics remain absent"
    current_case_status: "NOT_RUN_PROTOCOL_ONLY"

  - plan_task_id: "P9-T03"
    case_name: "Newtonian_weak_field_redshift_and_clock"
    target_question: "Do source-derived weak-field observables reproduce potential, slow-motion, redshift, and clock relations in a declared regime?"
    required_source_side_products:
      - "source-derived weak-response expansion with units and approximation order"
      - "physical matter-source map and independently calibrated coupling scale"
      - "physical FreeFall_src, Clock_src, and Signal_src model-to-world maps"
