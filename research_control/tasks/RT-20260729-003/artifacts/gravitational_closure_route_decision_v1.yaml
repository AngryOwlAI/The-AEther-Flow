selection_rule:
  relation_id: "P8T01-SOURCE-PRECURSOR-DOMINANCE"
  definition: "For two routes r and s, r weakly source-precursor-dominates s only when every presently usable adopted or controlled source-side precursor used by s is also usable by r, r introduces no additional protected or target-side premise, and r has a strict advantage in at least one declared precursor or dependency depth. Incomparable routes are decided by the least-assumption-debt policy and recorded as policy choices, not theorem-level optima."
  policy: "Choose the route with the greatest direct overlap with the adopted P7 source matter action, finite variation, source response, and componentwise conservation records, subject to zero benchmark-as-premise and zero target-geometry-as-premise imports."
  uniqueness_claimed: false
  global_optimality_claimed: false

