independent_source_law:
  notation: "E_src"
  signature: "E_src:C_src->W_src=R^2"
  definition: "E_src(x)=B*x"
  balance_matrix:
    - [1, -1, 1, -1]
    - [1, 1, -1, -1]
  coefficient_provenance: "The integer balance matrix is declared proposal-only source data before chi, sector transitions, or any response property is evaluated."
  regularity: "linear and smooth"
  rank: 2
  base_state_is_root: true
  gauge_invariance_proof: "B*d=0, hence E_src(x+r*d)=E_src(x)."
  response_success_selected: false
  target_import: false

linearized_law:
  notation: "D E_src"
  definition: "D E_src|_x=B at every source state"
  kernel_dimension: 2
  kernel_basis:
    gauge_generator: [1, 1, 1, 1]
    non_gauge_generator: [1, -1, -1, 1]
  rank_jump_branches: []
  proof: "The two rows of B are independent, B*d=0, B*v=0, and d,v are independent; therefore ker(B)=span{d,v}."

admissible_variation_quotient:
  notation: "A_src(x)"
  definition: "ker(B)/span{d}"
  dimension: 1
  nonzero_class_representative: [1, -1, -1, 1]
  nonvacuity_proof: "v is in ker(B) and is not proportional to d, so [v] is nonzero."
  diagonal_only: false
  fixed_before_response_evaluation: true
  success_stabilizer_definition_used: false

finite_admissible_flow:
  notation: "Flow_A"
  definition: "Flow_A(x,t)=x+t*v with v=(1,-1,-1,1)"
  law_preservation_proof: "E_src(x+t*v)=B*x+t*B*v=0 for every root x and every real t."
  composition_proof: "Flow_A(Flow_A(x,t),u)=x+(t+u)v=Flow_A(x,t+u)."
  inverse_proof: "Flow_A(Flow_A(x,t),-t)=x."
  base_positive_interval: "-2<t<1"
  positive_interval_proof: "At x_*=(2,1,1,2), the path is (2+t,1-t,1-t,2+t), which is positive exactly when t>-2 and t<1."
  sample_parameters:
    - "-1/2"
    - "0"
    - "1/2"
  endpoint_scope: "Only endpoints inside the declared interval belong to the positive control subdomain; the R^4 flow itself is global."

coupling_to_descent_data:
  source_scalar_covector: [1, -1, 0, 0]
  source_scalar: "mu(x)=x_0-x_1"
  gauge_invariance: "mu(d)=0"
  base_value: 1
  variation_rate: "D mu(v)=2"
  common_cycle_log_holonomy: "3*mu(x)"
  common_cycle_log_holonomy_variation_rate: 6
  sector_log_transition_variation_rates:
    e_01:
