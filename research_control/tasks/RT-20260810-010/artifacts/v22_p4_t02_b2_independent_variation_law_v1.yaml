      S: -2
      D: 8
    e_12:
      R: 6
      S: 4
      D: -6
    e_20:
      R: -4
      S: 4
      D: 4
  relevance_proof: "The nonzero quotient class changes mu, common holonomy, and the three sector transition families. On e_01 the rate vector (4,-2,8) has three distinct nonzero entries, so the variation is neither response-vacuous nor diagonal-only."
  structural_descent_preservation: "For every x(t), rho_s,x(t)=a_s(source;x(t))^{-1}chi_x(t)a_s(target;x(t)); therefore the intertwining identity holds along the entire source flow without defining A_src as its stabilizer."

independence_and_noncircularity:
  source_law_root: "B and d"
  descent_root: "The pointed Gamma_desc, ell, mu, declared positive line frames, a_s(0)=1 anchors, and anchored cochain exponent arrays"
  explicit_shared_root: "The typed source state x is shared transparently; no opaque or goal-selected hidden variable is used."
  logical_order:
    - "Declare C_src, B, d, and the quotient class [v]."
    - "Declare Gamma_desc, ell, mu, and exponent arrays."
    - "Define chi, sector representations, and intertwiners."
    - "Only then evaluate descent and variation identities."
  circularity_excluded: "Neither B nor v is defined by preserving midpoint, rank, sign cells, Q_ray, common positivity, a target cone, or a benchmark answer."
  caveat: "The universal-character sector law and source-base intertwiner anchors are explicit new proposal premises; neither is derived from current ontology or a physical normalization, and both require separate smuggling audit."

