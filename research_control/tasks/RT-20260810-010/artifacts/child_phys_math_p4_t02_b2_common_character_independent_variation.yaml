formal_construction:
  construction_id: "CONSTR-V22-P4T02-B2-COMMON-CHARACTER-INDEPENDENT-AFFINE-FLOW-001"
  object_count: 16
  formal_objects:
    - object_id: "SOURCE-CHAIN-K"
      type: "finite_structured_source_domain"
      definition: "K is the based ordered node set I={0,1,2} with distinguished anchor 0; its presentation carries the covector B(x)=x_0+2x_1-3x_2."
    - object_id: "DECLARED-SECTOR-SET"
      type: "finite_label_set"
      definition: "S_decl={R,S,D}, with no extension rule to unequipped sectors."
    - object_id: "SOURCE-CONFIGURATION-DOMAIN"
      type: "real_vector_space"
      definition: "C_src=R^I direct_sum (direct_sum over s in S_decl of {beta_s in R^I:beta_s,0=0}), with coordinates c=(r,beta_R,beta_S,beta_D), hence dim C_src=3+3*2=9."
    - object_id: "SOURCE-BALANCE-CODOMAIN"
      type: "real_vector_space"
      definition: "W_src=R direct_sum R^{S_decl}, hence dim W_src=4."
    - object_id: "SOURCE-BALANCE-LAW"
      type: "linear_map"
      definition: "E_src:C_src->W_src is E_src(r,beta_R,beta_S,beta_D)=(B r,B beta_R,B beta_S,B beta_D)."
    - object_id: "SOURCE-SOLUTION-MANIFOLD"
      type: "linear_submanifold"
      definition: "Sigma_src=E_src^{-1}(0); modulo constants, every coordinate block has the weighted form (0,3d,2d), so generally it is not an arithmetic-progression or midpoint block."
    - object_id: "SOURCE-SYMMETRY-GROUP"
      type: "additive_lie_group"
      definition: "H_src=R acts only by r->r+c*1. The anchored sector weights admit no sector-relative constant gauge."
    - object_id: "SOURCE-TRANSITION-GROUPOID"
      type: "lie_groupoid"
      definition: "G_src has objects I and arrows (i,a,j):j->i for a in R, composition (i,a,j) o (j,b,k)=(i,a+b,k), identities (i,0,i), and inverse (i,a,j)^{-1}=(j,-a,i)."
    - object_id: "REALIZED-SOURCE-COCYCLE"
      type: "groupoid_valued_one_cocycle"
      definition: "For c in C_src, h_ij(c)=(i,r_j-r_i,j), so h_ij o h_jk=h_ik and h_ji=h_ij^{-1}."
    - object_id: "POSITIVE-CHARACTER"
      type: "smooth_groupoid_character"
      definition: "chi:G_src->R_{>0} is chi(i,a,j)=exp(a), the unique object-neutral smooth positive character with chi(i,0,j)=1 and d(log chi)/da at a=0 equal to the declared unit 1."
    - object_id: "COMMON-ASSOCIATED-ORIENTED-LINE"
      type: "oriented_real_line_descent_datum"
      definition: "L_chi has local fibers R with their standard orientation and transition T^chi_ij:R_j->R_i, ell->lambda_ij ell, where lambda_ij=exp(r_j-r_i)>0."
    - object_id: "DECLARED-SECTOR-LINES"
      type: "finite_family_of_oriented_line_descent_data"
      definition: "L_s has local fibers R and transition T^s_ij:x->g^s_ij x, where g^s_ij=exp((r_j-r_i)+(beta_s,j-beta_s,i))."
    - object_id: "SECTOR-INTERTWINERS"
      type: "fiberwise_oriented_line_isomorphisms"
      definition: "j_s,i:L_s,i->L_chi,i is multiplication by a_s,i=exp(beta_s,i)>0."
    - object_id: "COMMON-LINE-REDUCTION-CLASS"
      type: "gauge_equivalence_class"
      definition: "The fixed law data (lambda,a_s) satisfy a_s,i g^s_ij=lambda_ij a_s,j. Common-line presentation changes act on lambda and all a_s together; the proposal additionally fixes the sector presentations and a_s,0=1 through beta_s,0=0. Thus residual sector-relative constants are excluded by declared law data, not mislabeled as H_src gauge."
    - object_id: "ADMISSIBLE-VARIATION-QUOTIENT"
      type: "quotient_vector_space"
      definition: "A_src(c)=ker(D E_src|_c)/im(d act_Hsrc|_c), with beta_s,0=delta beta_s,0=0 held fixed; this space is canonically isomorphic to R^4 through one common-scale slope and three anchored sector slopes."
    - object_id: "INTEGRATED-FINITE-PATH-CLASS"
      type: "piecewise_C1_path_groupoid"
      definition: "P_A consists of paths c(t) in Sigma_src whose derivatives represent classes in A_src; concatenation and reversal give composition and inverse."

  exact_maps:
    - map_id: "CHARACTER-DESCENT"
      signature: "chi:G_src->R_{>0}"
      rule: "(i,a,j) maps to exp(a)."
    - map_id: "REALIZATION-COCYCLE"
      signature: "h:C_src x I x I->G_src"
      rule: "h(c,i,j)=(i,r_j-r_i,j)."
    - map_id: "COMMON-LINE-TRANSITION"
      signature: "T^chi_ij:L_chi,j->L_chi,i"
      rule: "T^chi_ij(ell)=exp(r_j-r_i)*ell."
    - map_id: "SECTOR-LINE-TRANSITION"
      signature: "T^s_ij:L_s,j->L_s,i"
      rule: "T^s_ij(x)=exp((r_j-r_i)+(beta_s,j-beta_s,i))*x."
    - map_id: "SECTOR-TO-COMMON-LINE"
      signature: "j_s,i:L_s,i->L_chi,i"
      rule: "j_s,i(x)=exp(beta_s,i)*x."
    - map_id: "COCHAIN-REDUCTION"
      signature: "Red_src:(g^s_ij)->[(lambda_ij,a_s,i)] or obstruction"
      rule: "For fixed character-selected lambda, return anchored positive cochains exactly when every g^s/lambda is a positive coboundary. If lambda is not fixed, existence of some common cocycle is equivalent to all pairwise ratios g^s/g^t being positive coboundaries."
    - map_id: "SOURCE-LAW"
      signature: "E_src:C_src->W_src"
      rule: "Apply B=(1,2,-3) independently to r and each beta_s block."
    - map_id: "LINEARIZED-LAW"
      signature: "D E_src:T C_src->T W_src"
      rule: "D E_src=E_src, a rank-four constant linear map."
    - map_id: "ADMISSIBLE-FLOW"
      signature: "Flow_X:Sigma_src x R->Sigma_src"
      rule: "Flow_X(c,t)=c+tX for any constant X in ker E_src; a distinguished non-diagonal X is given below."
    - map_id: "PROVENANCE-SEPARATION"
      signature: "Prov:(G_src,chi,j_s,E_src,A_src)->directed_acyclic_dependency_graph"
      rule: "Record only the source-root arrows declared in the provenance certificate and fail on any forbidden inbound edge."

  typing_checks:
    source_groupoid: "Composition is defined exactly when the target object of the second arrow is the source object of the first; the result has type k->i."
    character: "chi maps every groupoid arrow to an invertible positive scalar and maps identities to 1."
    line_transitions: "T^chi_ij and T^s_ij map the j-fiber to the i-fiber and are orientation-preserving isomorphisms."
    intertwiners: "j_s,i has domain L_s,i and codomain L_chi,i and is invertible because exp(beta_s,i)>0."
    source_law: "E_src maps a nine-dimensional anchored real configuration vector to four real balance residuals."
    variation_quotient: "The one-dimensional im(d act_Hsrc) is contained in ker D E_src because B(1,1,1)=0; no sector-relative constant lies in the anchored tangent domain."
    finite_paths: "Each path begins and ends in Sigma_src and reversal has the same typed configuration domain."

theorems_and_proofs:
  - theorem_id: "THM-V22-P4T02-B2-POSITIVE-CHARACTER-ASSOCIATED-LINE-DESCENT-001"
    title: "Unit-normalized positive-character groupoid descent"
    hypotheses:
      - "G_src is the translation groupoid defined above."
      - "The additive source-scale coordinate has declared orientation and unit."
      - "chi is smooth, positive, multiplicative, object-neutral on zero-label arrows, and has unit logarithmic derivative at the identity."
    statement: "chi(i,a,j)=exp(a) is the unique character under these hypotheses; lambda_ij=chi(h_ij) is positive, invertible, and satisfies lambda_ij lambda_jk=lambda_ik and lambda_ji=lambda_ij^{-1}."
    proof: "Object neutrality removes object-dependent factors: chi(i,a,j)=chi(i,0,j)chi(j,a,j)=chi(j,a,j). Multiplicativity on the additive isotropy label implies log chi(a+b)=log chi(a)+log chi(b), hence smoothness gives log chi(a)=kappa*a. The declared unit derivative fixes kappa=1. Addition of r differences gives h_ij o h_jk=h_ik; applying chi gives the scalar cocycle, and negating the arrow label gives the inverse."
    limitation: "Orientation, unit, and object neutrality are new source-extension assumptions, not current-ontology consequences or physical units. Without object neutrality the derivative condition leaves object-frame coboundary factors, so uniqueness would fail."

  - theorem_id: "THM-V22-P4T02-B2-COCHAIN-INTERTWINER-CLASSIFICATION-001"
    title: "Positive cochain reduction, anchored uniqueness, and frame-gauge classification"
    hypotheses:
      - "The declared cover nerve is connected."
      - "Every sector transition g^s is a positive one-cocycle."
      - "One source-character cocycle lambda is selected before response evaluation."
      - "A base node 0 is used as a gauge slice, not as a physical calibration."
    statement: "For fixed lambda, a family a_s,i>0 satisfying a_s,i g^s_ij=lambda_ij a_s,j exists exactly when g^s/lambda is a positive coboundary for every s. If no lambda is fixed, some common reduction exists exactly when all pairwise ratios g^s/g^t are positive coboundaries. On this complete based nerve, two common cocycles are related by one common positive gauge. For fixed lambda and fixed a_s,0=1, each a_s is unique. Without those anchors, solutions differ by independent sector constants that generally are not one declared common gauge."
    proof: "The fixed-lambda equation rearranges to g^s_ij/lambda_ij=a_s,j/a_s,i, precisely the coboundary condition, and conversely such a cochain supplies the intertwiner. If one common reduction exists, division of the s and t equations makes g^s/g^t a coboundary. Conversely, choose one sector t as provisional common cocycle and use the pairwise coboundaries as cochains; on the complete nerve any other common cocycle differs by a coboundary q_i/q_j, which is one common positive gauge. For fixed lambda, the ratio of two solutions is constant on the connected nerve for each sector; a_s,0=1 sets every constant to one. Without anchors, constants c_s remain, and unequal c_s cannot be absorbed by one common target-line gauge. Under frames q_i>0 and p_s,i>0, lambda'_ij=q_i lambda_ij q_j^{-1}, g'^s_ij=p_s,i g^s_ij p_s,j^{-1}, and a'_s,i=q_i a_s,i p_s,i^{-1}; substitution preserves the abstract square. Numeric anchors are preserved by the based-frame subgroup p_s,0=q_0, while arbitrary frames transport the anchor maps as part of the presentation."
    exact_candidate_application: "Here g^s_ij/lambda_ij=exp(beta_s,j-beta_s,i), a_s,i=exp(beta_s,i), and the independently fixed beta_s,0=0 data give a_s,0=1. Alternative sector-relative constants define different candidate laws and are not silently accepted."
    pairwise_ratio_corollary: "For any sectors s,t, g^s_ij/g^t_ij=b^st_j/b^st_i with b^st_i=exp(beta_s,i-beta_t,i); literal equality of raw transition rows is unnecessary."

  - theorem_id: "THM-V22-P4T02-B2-INDEPENDENT-VARIATION-INTEGRABILITY-001"
    title: "Rank, gauge quotient, and complete affine integration of the independent source balance law"
    hypotheses:
      - "E_src applies the nonzero asymmetric covector B=(1,2,-3) to four disjoint coordinate blocks."
      - "H_src acts only by a constant shift on the unanchored r block; beta_s,0=0 is held fixed."
    statement: "On the nine-dimensional anchored C_src, rank(D E_src)=4, dim ker(D E_src)=5, dim im(d act_Hsrc)=1, and dim A_src(c)=4 for every c. Every constant class has a global affine representative flow; every piecewise continuous slope curve integrates to a piecewise C1 path in Sigma_src."
    proof: "The r block contributes a two-dimensional kernel of B. Each anchored beta block has dimension two and B restricts with rank one, so each contributes a one-dimensional kernel; the total kernel dimension is 2+3=5 and E_src has rank four. The single common r-shift generator lies in the kernel because B*1=0. Therefore the quotient has dimension four. Every kernel vector X satisfies E_src(c+tX)=E_src(c)+tE_src(X)=0 for c in Sigma_src and all real t while preserving beta_s,0=0. Integrating time-dependent kernel representatives preserves both E_src and the anchors, and concatenation and reversal remain in Sigma_src."
    quotient_coordinates: "The r kernel is (a,a+3d_r,a+2d_r), and its constant a is quotiented. Every anchored beta kernel is exactly (0,3d_s,2d_s), with no remaining sector constant. Thus A_src is exactly coordinatized by (d_r,d_R,d_S,d_D)."
    rank_and_singularity_branches: "There is no rank-jump locus inside the fixed linear candidate: D E_src is the same rank-four matrix at every c. Replacing B, deleting an anchored coordinate, or allowing the anchor itself to vary changes the proposal law and requires a fresh rank proof; a zero or gauge-only quotient then triggers FB-06 rather than inheriting this theorem."

  - theorem_id: "THM-V22-P4T02-B2-NONVACUOUS-DESCENT-PRESERVING-SOURCE-FLOW-001"
    title: "Explicit non-diagonal finite source flow changing common and sector transition data"
    hypotheses:
      - "The initial state and tangent are the exact vectors in finite_flow_witness."
    statement: "The path c(t)=c_0+tX is defined for every real t, remains in Sigma_src, has nonzero class [X]=(1,1,2,4) in A_src, changes lambda and every sector transition cocycle nontrivially, preserves positivity and all descent equations, and is not diagonal-only."
    proof: "Every listed block has the weighted form (0,3d,2d), so B vanishes on c_0 and X. The quotient slope tuple is nonzero and its sector entries are unequal. Along edge 01, log lambda=3+3t, while log g^R=9+6t, log g^S=12+9t, and log g^D=18+15t; edge 12 gives -1-t, -3-2t, -4-3t, and -6-5t respectively; edge 02 gives 2+2t, 6+4t, 8+6t, and 12+10t. Their nonzero, unequal derivatives prove nonvacuity and non-diagonality. Exponentials remain positive, and each edge-01 plus edge-12 exponent equals its edge-02 exponent."
    exact_limit: "Preservation concerns this proposal-only descent law, not Q_ray, response rank, midpoint structure, common positivity, causality, or any target behavior."

  - theorem_id: "THM-V22-P4T02-B2-DESCENT-VARIATION-LOGICAL-INDEPENDENCE-001"
    title: "Logical and provenance independence of descent and source variation"
    hypotheses:
      - "Descent and variation are treated as separately typed predicates."
    statement: "Neither a common-character line reduction nor a nonzero admissible-variation quotient implies the other."
    proof_by_countermodels:
      descent_without_variation: "Use the constructed G_src, chi, lines, and intertwiners, but take the source law E_src=id on C_src and the trivial source-symmetry group. Its kernel and A_src are zero, so descent exists without nonvacuous variation."
      variation_without_descent: "Use the affine balance law and its four-dimensional A_src on a source loop, but assign sector flat-line holonomies H_R=2 and H_S=3. A positive coboundary has unit loop holonomy, so the ratio holonomy 2/3 cannot be a coboundary; no common reduction exists despite nonzero integrable variation."
    provenance_consequence: "The candidate must cite ROOT-LINE-SCALE for chi and ROOT-WEIGHTED-BALANCE for E_src; no proof arrow may run from success of either predicate to selection of the other root."

