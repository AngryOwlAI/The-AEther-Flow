  - root_id: "ROOT-SECTOR-COCHAINS"
    object: "declared-sector integer cochain exponent arrays k_s normalized by k_s,0=0"
    status: "proposal-only source-extension data"
    fixed_before_response: true
  - root_id: "ROOT-SECTOR-FRAMES-AND-ANCHORS"
    object: "positive frames of the common and declared-sector lines together with the source-base-object anchor a_s(0)=1"
    status: "proposal-only source-extension data"
    fixed_before_response: true

dependency_nodes:
  - node_id: "NODE-E-SRC"
    definition: "E_src(x)=B*x"
    parents: ["ROOT-VAR-BALANCE"]
  - node_id: "NODE-A-SRC"
    definition: "A_src=ker(B)/span{d}"
    parents: ["ROOT-VAR-BALANCE", "ROOT-VAR-GAUGE"]
  - node_id: "NODE-G-SRC"
    definition: "G_src=Pi_1(Gamma_desc)"
    parents: ["ROOT-DESC-CYCLE"]
  - node_id: "NODE-CHI"
    definition: "chi_x(gamma)=exp(mu(x)ell(gamma))"
    parents: ["ROOT-DESC-CYCLE", "ROOT-DESC-WINDING", "ROOT-DESC-MU"]
  - node_id: "NODE-L-CHI"
    definition: "oriented associated representation line of chi_x"
    parents: ["NODE-G-SRC", "NODE-CHI"]
  - node_id: "NODE-RHO-S"
    definition: "rho_s=a_s(source)^{-1}chi_x a_s(target)"
    parents: ["NODE-CHI", "ROOT-SECTOR-COCHAINS"]
  - node_id: "NODE-J-S"
    definition: "relative to the declared positive source frames, j_s sends e_s,i to a_s(i)e_i and is anchored by j_s,0(e_s,0)=e_0"
    parents: ["NODE-L-CHI", "NODE-RHO-S", "ROOT-SECTOR-COCHAINS", "ROOT-SECTOR-FRAMES-AND-ANCHORS"]
  - node_id: "NODE-FLOW-A"
    definition: "Flow_A(x,t)=x+t*v for the nonzero quotient representative v"
    parents: ["NODE-A-SRC"]

explicit_shared_dependencies:
  - shared_node: "typed source state x"
    consumers: ["NODE-E-SRC", "NODE-CHI", "NODE-RHO-S", "NODE-FLOW-A"]
    opacity: false
    justification: "The shared source state is typed and visible; the variation law and descent law use different declared coefficient roots and neither is selected from the other's success."

