new_mathematical_payload:
  - payload_id: "NMP-RT010-PHIL-001"
    payload_type: "theorem_with_hypotheses_and_proof"
    name: "Sector-intertwiner torsor and common-gauge residual theorem"
    hypotheses:
      - "S is a finite declared sector set with |S|>=2."
      - "G_src is connected on the bounded patch, chi is a supplied positive character, and every L_s is positively G_src-isomorphic to L_chi."
      - "No nonzero normalized source section, sector calibration functional, or independently derived relative-weight law is supplied."
      - "The declared equivalence removes only one common positive gauge."
    statement: "After choosing one reference intertwiner per sector, the positive intertwiner family is a torsor for (R_{>0})^S. Quotient by one diagonal common gauge leaves (R_{>0})^{|S|-1} relative-normalization moduli. Therefore the source data do not select a unique common-gauge reduction class."
    applicability_to_parent: "counterfactual_unanchored_comparison_only"
    proof:
      - "Any two positive equivariant isomorphisms between the same oriented one-dimensional representations differ by a positive source-invariant scalar c_s on the connected patch."
      - "The scalars act independently for each sector, giving the product torsor (R_{>0})^S."
      - "One common gauge identifies only c_s=c for every s, so the quotient is parameterized by the ratios c_s/c_t and has |S|-1 dimensions."
      - "No admitted source datum evaluates those ratios, so selecting one point in the quotient would require an additional normalization primitive."
    burden_effect: "clarifies_operational_limit_without_obstructing_fixed_law_descent"
    exact_limit: "The unanchored theorem is exact. The parent candidate additionally declares a pointed source object, positive frames, and a_s(0)=1; these anchors force every sector constant to one. Thus the residual torsor diagnoses what the new anchor data resolve mathematically and what still lacks physical legitimacy, not FB-04 for the fixed proposal."
  - payload_id: "NMP-RT010-PHIL-002"
    payload_type: "reclassified_automorphism_witness"
    name: "Same-unanchored-equations sector-rescaling witness"
    construction: "Start from any supplied common-cocycle reduction (j_R,j_S,j_D) and replace it by (2 j_R,j_S,j_D), leaving G_src, chi, L_chi, every sector cocycle, E_src, A_src, and all source histories unchanged."
    exact_result: "Both triples satisfy the unanchored intertwining equations, but the second violates the fixed R-sector anchor j_R,0(e_R,0)=e_0. It therefore changes explicit proposal-law data and is a distinct law, not a second reduction of the same structured candidate."
    burden_effect: "narrows_claim"
    interpretation: "Common transformation law identifies formal line type but supplies no preferred cross-sector numerical calibration or operational magnitude."
  - payload_id: "NMP-RT010-PHIL-003"
    payload_type: "finite_concrete_source_object_witnesses"
    name: "Independent nonzero integrable source-field variation control"
    construction: "For E_src(x)=Bx and gauge span{d}, take v=(1,-1,-1,1). Then Bv=0, v is not proportional to d, and x_*+tv=(2+t,1-t,1-t,2+t)."
    proof: "rank(B)=2 and ker(B)=span{d,v}, so [v] is nonzero in A_src. Linearity gives E_src(x+tv)=E_src(x), positivity holds for -2<t<1, and Dmu(v)=2 produces unequal transition-log rates (4,-2,8) rather than a diagonal stabilizer."
    burden_effect: "narrows"
    exact_limit: "This proves one finite relevant proposal variation, not arbitrary-variation robustness, physical causality, or empirical response."
  - payload_id: "NMP-RT010-PHIL-004"
    payload_type: "dependency_map_update"
    name: "Formal construction versus normalization and preload fork"
    ordered_branches:
      - "Hold the declared law tensors fixed: chi, rho_s, a_s, and j_s are deterministic and the finite descent candidate exists."
      - "Ask for preferred numerical or operational cross-sector normalization: the candidate does not supply it, and the sector-scaling torsor becomes relevant."
      - "Ask whether fixing the universal-character tensors is legitimate source extension or goal preload: defer exactly that question to the separately admitted smuggling audit."
    burden_effect: "separates_formalizer_success_from_later_audit"

