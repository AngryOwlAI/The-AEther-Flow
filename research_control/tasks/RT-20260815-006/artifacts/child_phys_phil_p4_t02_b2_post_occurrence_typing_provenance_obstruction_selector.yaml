      statement: "For a smooth source manifold M, the assignment U maps to Open(U) on its open-site, with res_VU(W)=W intersect V for V subset U, is a contravariant set-valued functor. Any overlap-compatible family W_i in Open(U_i) on an open cover of U glues uniquely to W=union_i W_i in Open(U)."
      proof: "Identity is W intersect U=W. For Z subset V subset U, (W intersect V) intersect Z=W intersect Z, proving composition. A union of opens is open. Compatibility gives (union_i W_i) intersect U_j=W_j, and any other global open with these restrictions equals the union of its restrictions, proving uniqueness."
      falsifier: "A nested-inclusion composition failure, a compatible family whose union does not restrict correctly, or two distinct global opens with identical cover restrictions would refute the lemma."
      burden_effect: "establishes_a_canonical_typing_and_descent_precursor_only"
    - payload_id: "NMP-RT015-006-PHIL-002"
      payload_type: "theorem"
      object_name: "ObjectwiseTrivialFullDiffeomorphismNaturalOpenSelectionLemma"
      claim_status: "proved_selector_level_with_scope_limit"
      statement: "For each connected smooth four-manifold M, an open W_M invariant under every diffeomorphism of M is empty or all of M. Therefore a natural open selection over the full diffeomorphism audit groupoid is objectwise trivial, although empty-versus-total choices may differ across groupoid components with no arrows between them."
      proof: "If W_M is nonempty, choose x in W_M. The full diffeomorphism group of a connected smooth manifold acts transitively on points, so for any y there is f with f(x)=y. Invariance gives y in W_M, hence W_M=M. The empty set is also invariant. Naturality adds no equation between objects in disconnected groupoid components."
      falsifier: "A connected M with a proper nonempty open invariant under all diffeomorphisms refutes the theorem; restricting arrows to identities or adding a marked source datum changes the hypotheses and allows nontrivial opens."
      burden_effect: "proves_carrier_syntax_does_not_supply_nontrivial_full_symmetry_token_selection"
    - payload_id: "NMP-RT015-006-PHIL-003"
      payload_type: "countermodel"
      object_name: "SameOpenCarrierDifferentOccurrenceAssignmentsControl"
      claim_status: "exact_conceptual_countermodel"
      statement: "The same canonical carrier and transport admit distinct proposal-only assignments concentrated on empty, concentrated on total, or uniformly weighted over empty and total. Hence carrier data alone do not determine deterministic occurrence, physical probability, or a realized token."
      proof: "The carrier Open(U) and all restriction maps are held fixed. The three assignments differ only in additional occurrence data. Since no current-topology equation selects among them, uniqueness of occurrence cannot be inferred from the carrier. Uniform weighting also supplies no realized token."
      falsifier: "A current-source theorem that uniquely derives one assignment from topology and survives same-carrier comparison would refute the nonimplication."
      burden_effect: "separates_carrier_admissibility_kernel_and_realization"
    - payload_id: "NMP-RT015-006-PHIL-004"
      payload_type: "lemma"
      object_name: "OpenCarrierDefinitionalEliminabilityLemma"
      claim_status: "proved_selector_level"
      statement: "Adding names for the Open carrier, its restriction, and its category-of-elements projection is conservative over the current smooth topology when every formula is translated back to open-subset membership, intersection, union, inclusion, and inverse image."
      proof: "Every introduced carrier object is a pair (U,W) with W open in U; every introduced map is intersection or inverse image; and the projection forgets W. Replacing each new symbol by these definitions changes neither models nor source-side consequences."
      falsifier: "If the packet adds a selector, measure, law, orientation, physical event predicate, or model distinction not eliminated by those substitutions, the extension is not definitional and must be reclassified."
      burden_effect: "fixes_exact_source_extension_classification"
    - payload_id: "NMP-RT015-006-PHIL-005"
      payload_type: "packet_selection"
      object_name: "CanonicalSourceOpenEventFibrationTypingDescentFuturePacket"
      claim_status: "selected_not_executed"
      statement: "Select Route A as the one least-assumption constructive continuation under ontology-formalizer@0.2.0."
      proof: "Route A is formable from current topology, has a precise theorem-or-obstruction contract, costs no new ontology primitive, and leaves all occurrence and physical claims blocked. Routes B and C remain lawful later alternatives; Route D is premature."
      falsifier: "A demonstrated target dependency, non-eliminable primitive, or ill-typed open-carrier construction would remove Route A's present selection basis."
      burden_effect: "selects_one_future_packet_without_distance_to_gr_delta"

