formal_domains:
  - domain_id: "DOM-01"
    name: "SmoothOpenSrc4"
    definition: "The category whose objects are nonempty smooth four-manifolds and their declared open submanifolds, with open embeddings as typed arrows."
  - domain_id: "DOM-02"
    name: "OpenLattices"
    definition: "For each source open U, the set Open(U) of topologically open subsets ordered by inclusion."
  - domain_id: "DOM-03"
    name: "OpenCovers"
    definition: "Declared covers {U_i->U}, their overlaps, inverse-image restrictions, and compatibility equations."
  - domain_id: "DOM-04"
    name: "OpenGrothendieckCarrier"
    definition: "The category of pairs (U,O) with O in Open(U), transported contravariantly along open embeddings."
  - domain_id: "DOM-05"
    name: "ConnectedObjects"
    definition: "Connected smooth source objects used only for the full-diffeomorphism natural-section classification."
  - domain_id: "DOM-06"
    name: "RT003ProposalFiberSchema"
    definition: "The conditional target-free proposal-fiber pseudofunctor schema and its Prop, U, source-arrow transport, and measurable-structure requirements from RT003."
  - domain_id: "DOM-07"
    name: "FormalKernelControls"
    definition: "Purely mathematical probability kernels on finite controls, including delta_empty, delta_total, and their convex mixtures; no physical probability meaning is admitted."
  - domain_id: "DOM-08"
    name: "TypeComparisonEvidence"
    definition: "Typed maps, commuting diagrams, countermodels, and the first exact mismatch between the Open carrier and RT003 proposal fibers."
  - domain_id: "DOM-09"
    name: "SourceProvenanceEvidence"
    definition: "Eliminability, current-signature dependency, target-atlas exclusion, and source-arrow naturality records."
  - domain_id: "DOM-10"
    name: "ExclusiveResult"
    definition: "Exactly one theorem, type-mismatch obstruction, restriction/descent obstruction, or current-source definitional-extension obstruction."

formal_objects:
  - object_id: "OBJ-01"
    name: "OpenCarrier"
    type: "U maps to Open(U)"
  - object_id: "OBJ-02"
    name: "InverseImageRestriction"
    type: "j:V->U maps O to j^{-1}(O)"
  - object_id: "OBJ-03"
    name: "CompatibleOpenFamily"
    type: "{O_i in Open(U_i)} satisfying overlap equality"
  - object_id: "OBJ-04"
    name: "UniqueGlobalOpen"
    type: "O in Open(U) with every restriction equal to O_i"
  - object_id: "OBJ-05"
    name: "OpenCarrierGrothendieckObject"
    type: "pair (U,O) with typed cartesian transport"
  - object_id: "OBJ-06"
    name: "NaturalOpenSection"
    type: "assignment s(U) in Open(U) natural for the declared arrow class"
  - object_id: "OBJ-07"
    name: "TrivialSectionPair"
    type: "the empty and total natural open assignments"
  - object_id: "OBJ-08"
    name: "FormalKernelFamily"
    type: "delta_empty, delta_total, and convex mixtures on a finite two-point carrier control"
  - object_id: "OBJ-09"
    name: "ProposalFiberComparison"
    type: "typed comparison or exact mismatch between OpenGrothendieckCarrier and F_prop"
  - object_id: "OBJ-10"
    name: "ProvenanceFactorization"
    type: "record that every Open-carrier constructor factors through current smooth topology only"
  - object_id: "OBJ-11"
    name: "NonsemanticBoundaryLedger"
    type: "explicit separation of opens, proposals, events, occurrence, probability, response, and physical meaning"
  - object_id: "OBJ-12"
    name: "PacketResult"
    type: "exclusive permitted result with proof or first precise obstruction"

formal_maps:
  - map_id: "MAP-01"
    signature: "OpenObj:SmoothOpenSrc4^op->Set"
    purpose: "Assign Open(U) to each source open U."
  - map_id: "MAP-02"
    signature: "Restrict_j:Open(U)->Open(V)"
    purpose: "Use inverse image along an open embedding j:V->U."
  - map_id: "MAP-03"
    signature: "Glue:{compatible O_i}->Open(U)"
    purpose: "Form the union of compatible local opens."
  - map_id: "MAP-04"
    signature: "Groth(Open):SmoothOpenSrc4->Cat"
    purpose: "Build the typed Grothendieck carrier of pairs (U,O)."
  - map_id: "MAP-05"
    signature: "AutAction:Diff(U)xOpen(U)->Open(U)"
    purpose: "Act on opens for the connected full-diffeomorphism section classification."
  - map_id: "MAP-06"
    signature: "ClassifySection:NaturalOpenSection->TrivialSectionPair or Counterexample"
    purpose: "Decide whether a full-Diff-natural open assignment is empty or total under the declared hypotheses."
  - map_id: "MAP-07"
    signature: "KernelControl:[0,1]->Prob({empty,total})"
    purpose: "Exhibit carrier-compatible formal kernels that differ while carrier data is fixed."
  - map_id: "MAP-08"
    signature: "CompareProp:OpenGrothendieckCarrier->RT003ProposalFiberSchema or TypeMismatch"
    purpose: "Prove a typed comparison or return the first exact mismatch."
  - map_id: "MAP-09"
    signature: "AuditProvenance:Construction->SourceProvenanceEvidence"
    purpose: "Prove current-topology eliminability and exclude target or outcome-selected inputs."
  - map_id: "MAP-10"
    signature: "Decide:TypeComparisonEvidence x SourceProvenanceEvidence->PacketResult"
    purpose: "Return exactly one scoped result without adoption or promotion."

theorem_targets:
  - theorem_id: "THM-01"
    name: "CanonicalContravariantOpenCarrier"
    target: "Prove that inverse image makes U->Open(U) a contravariant functor on the declared open-embedding category."
  - theorem_id: "THM-02"
    name: "UniqueOpenCoverDescent"
    target: "Prove that compatible local opens glue uniquely and recover their local restrictions."
  - theorem_id: "THM-03"
    name: "ConnectedFullDiffTrivialNaturalSection"
    target: "Prove that a selected open invariant under all diffeomorphisms of a connected declared object is empty or total."
  - theorem_id: "THM-04"
    name: "CarrierOccurrenceUnderdetermination"
    target: "Prove by distinct formal kernels on the same carrier that carrier formation alone does not determine occurrence."
  - theorem_id: "THM-05"
    name: "OpenCarrierProposalFiberComparisonDecision"
    target: "Construct the exact typed comparison to the RT003 F_prop schema or return the first precise type, naturality, restriction, descent, or provenance obstruction."

