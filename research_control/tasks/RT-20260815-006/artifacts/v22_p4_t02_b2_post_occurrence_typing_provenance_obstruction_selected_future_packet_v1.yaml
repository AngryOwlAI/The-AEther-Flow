  - obligation_id: "PO-04"
    text: "Prove inverse image preserves opens, identities, and composition."
  - obligation_id: "PO-05"
    text: "Prove compatible-cover gluing by union and uniqueness from the covering property."
  - obligation_id: "PO-06"
    text: "Type the Grothendieck construction and every restriction arrow without importing Prop or proposal semantics by name."
  - obligation_id: "PO-07"
