  - obligation_id: "PO-09"
    text: "Keep empty and total sections as mathematical sections, not occurrence laws or realized events."
  - obligation_id: "PO-10"
    text: "Exhibit at least two distinct formal kernels on one fixed carrier and state that they have no physical probability semantics."
  - obligation_id: "PO-11"
    text: "Give an explicit typed comparison with each RT003 F_prop requirement or return the first exact mismatch."
  - obligation_id: "PO-12"
    text: "Prove current-topology eliminability and exclude target atlas, target metric, empirical response, desired cone, and benchmark answer inputs."
  - obligation_id: "PO-13"
    text: "Preserve D7, B2, P4-T03, g_eff, adoption, proof, publication, and global-no-go locks."
  - obligation_id: "PO-14"
    text: "Return exactly one permitted result with a falsifier and no claim that current topology determines occurrence."

failure_branches:
  - branch_id: "FB-01"
    trigger: "The RT003 predecessor obstruction or any inherited freeze is altered."
