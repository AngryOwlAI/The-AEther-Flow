    text: "Bind the plan, RT003 parent fusion and TeX, RT003 completion, handoff-1039, burden map, and live control state by exact hashes."
  - obligation_id: "PO-02"
    text: "Hold the RT003 obstruction, five conditional theorem schemas, eight freezes, and fourteen no-delta burdens fixed."
  - obligation_id: "PO-03"
