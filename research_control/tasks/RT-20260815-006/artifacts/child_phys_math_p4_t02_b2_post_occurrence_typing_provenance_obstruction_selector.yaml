new_mathematical_payload:
  payload_count: 5
  items:
    - payload_id: "NMP-RT015-006-001"
      payload_type: "definition_and_lemma"
      object_name: "CanonicalOpenCarrierBifibration"
      statement: "For every diffeomorphism f:M->N, direct image is a frame isomorphism Open(M)->Open(N). The category of elements of Open_! projects to SmoothMan4Iso as a discrete bifibration."
      assumptions: "M and N are smooth four-manifolds and f is a diffeomorphism."
      proof: "A diffeomorphism is a homeomorphism, so direct image and inverse image preserve arbitrary unions and finite intersections and are mutually inverse. In the category of elements an arrow over f from (M,A) must end at (N,f(A)), giving a unique cocartesian lift; for an object (N,B), (M,f^{-1}(B))->(N,B) is the unique cartesian lift."
      falsifier: "For a general non-open smooth map, direct image need not preserve openness, so the stated variance would fail; the packet is restricted to diffeomorphisms for the bifibration and inverse images for restrictions."
    - payload_id: "NMP-RT015-006-002"
      payload_type: "theorem_with_proof"
      object_name: "OpenSubsetCoverDescent"
      statement: "If {U_i} covers M and A_i is open in U_i with A_i intersect U_j equal to U_i intersect A_j for all i,j, then A=union_i A_i is the unique open subset of M satisfying A intersect U_i=A_i."
      assumptions: "Each U_i is open in M and the pairwise overlap equalities hold."
      proof: "Each A_i is open in M because it is open in the open subspace U_i, hence their union A is open. Compatibility gives A intersect U_i subset A_i, while A_i subset A intersect U_i is immediate. Any other global open with the same restrictions equals the union of those restrictions and therefore equals A."
      falsifier: "Opposite local choices on a nonempty overlap violate the equality and cannot be restrictions of one global open."
    - payload_id: "NMP-RT015-006-003"
      payload_type: "theorem_with_proof"
      object_name: "ConnectedFullDiffeomorphismNaturalOpenSectionClassification"
      statement: "On each connected component of ConnectedSmoothMan4Iso, every natural section of Open_! is fiberwise either the empty open or the whole manifold."
      assumptions: "Sources are connected and naturality is required for all diffeomorphisms."
      proof: "At a representative M, naturality makes A_M invariant under Diff(M). Connected smooth manifolds are diffeomorphism-point-transitive: a path between two points can be covered by coordinate balls and compactly supported local moves composed along the path. If A_M is nonempty and contains x, transitivity sends x to every y, so invariance implies A_M=M; otherwise A_M is empty. RT003 transport then determines the same alternative throughout the component."
      falsifier: "With a marked source point p and only point-preserving diffeomorphisms, M minus {p} is a proper nonempty invariant open, showing that the full-diffeomorphism and bare-source hypotheses are essential."
    - payload_id: "NMP-RT015-006-004"
      payload_type: "conditional_countermodel"
      object_name: "OpenCarrierDoesNotDetermineOccurrenceKernel"
      statement: "After conditionally equipping Open(M) with the powerset sigma algebra, equivariance and normalization admit the distinct kernels delta_empty, delta_total, and every K_lambda=lambda delta_empty+(1-lambda) delta_total. Therefore carrier formation plus equivariance does not determine a unique occurrence kernel."
      assumptions: "The measurable structure is declared only for this control; no physical probability or current-source generator is inferred."
      proof: "The empty and total opens are fixed by every diffeomorphism, so both Dirac measures and their convex mixtures are invariant and normalized. Distinct lambda give distinct mass to the singleton {empty}."
      falsifier: "An additional independently source-derived law fixing lambda could select one kernel, but that law is not contained in the carrier, covariance, or normalization constraints."
    - payload_id: "NMP-RT015-006-005"
      payload_type: "packet_selection"
      object_name: "CanonicalSourceOpenEventFibrationTypingDescentPrecursorPacket"
      statement: "The unique selected next packet is Route A under ontology-formalizer@0.2.0, bounded_theoretical_calculation, and selected_not_executed status."
      assumptions: "All four route scores, constructive preference, eight freezes, and the RT003 obstruction remain fixed."
      proof: "Route A scores 24 of 24 and strictly exceeds Routes B, C, and D at 20, 17, and 15. It is constructive, target-free, exact, and lower-assumption than Route C, while Route D's necessity condition is false because Route A is available."
      falsifier: "A demonstrated inability to type smooth-topology opens or their restriction site from the current source would invalidate Route A and require the future packet's precise-obstruction branch; it does not authorize automatic substitution of Route C."

exact_controls:
  control_count: 6
  controls:
    - control_id: "CTRL-A1-R4-TRANSLATION-TRIVIALITY"
      fixture: "M=R^4 with every translation T_a(x)=x+a."
      exact_result: "Any translation-invariant open A is empty or R^4: if x is in A, T_(y-x)(x)=y is in A for every y."
      falsifies: "A claim that bare full-symmetry naturality selects a proper nonempty open on R^4."
    - control_id: "CTRL-A2-MARKED-POINT-SCOPE"
      fixture: "M=R^4 with marked point p=0 and only p-preserving diffeomorphisms."
      exact_result: "R^4 minus {0} is a proper nonempty invariant open."
      falsifies: "Any overread of the trivial-section theorem after adding independently typed symmetry-breaking source data."
    - control_id: "CTRL-A3-RATIONAL-COVER-GLUING"
      fixture: "U_minus={x0<1}, U_plus={x0>-1}, A_minus={x0<0} intersect U_minus, A_plus={x0<0} intersect U_plus."
      exact_result: "The local opens agree on the overlap and glue uniquely to {x0<0}."
      falsifies: "A claim that canonical open-subset descent requires a target atlas, metric, or occurrence law."
    - control_id: "CTRL-A4-RATIONAL-OVERLAP-MISMATCH"
      fixture: "Use the same cover with B_minus={x0<0} intersect U_minus and B_plus={x0<1/2} intersect U_plus."
      exact_result: "They disagree for overlap points with 0<=x0<1/2, so no global open has both restrictions."
      falsifies: "A claim that arbitrary local carrier values glue without overlap equality."
    - control_id: "CTRL-A5-RATIONAL-KERNEL-NONUNIQUENESS"
      fixture: "K_1/3=(1/3)delta_empty+(2/3)delta_total and K_2/3=(2/3)delta_empty+(1/3)delta_total."
      exact_result: "Both are normalized and Diff(M)-invariant but are unequal because their mass at {empty} differs."
      falsifies: "A claim that carrier plus covariance plus normalization uniquely determines a kernel."
    - control_id: "CTRL-A6-CARRIER-LAW-SEPARATION"
      fixture: "Hold M, Open(M), pi_Open, restrictions, and gluing fixed while choose delta_empty or delta_total as the conditional kernel."
      exact_result: "The identical carrier supports opposite normalized invariant laws, so the law does not invert uniquely from carrier data."
      falsifies: "A claim that typing Open(M) already derives admissibility, occurrence, physical probability, or a realized token."

