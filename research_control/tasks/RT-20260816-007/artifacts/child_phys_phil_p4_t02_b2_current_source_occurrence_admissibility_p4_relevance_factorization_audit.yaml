theorem_targets:
  - theorem_id: "THM-01-FIBRE-FACTORIZATION"
    statement: "R factors through U on im(U) if and only if R is constant on every U-fibre."
    audit_disposition: "proved_as_an_abstract_set_level_theorem_not_instantiated_by_current_source"
    proof: "If R=f after U, equal U-images have equal R-values. Conversely define f(d)=R(x) for any x with U(x)=d; fibre constancy gives well-definedness, and surjectivity onto im(U) gives uniqueness there."
  - theorem_id: "THM-02-FACTOR-UNIQUENESS"
    statement: "The factor is unique on im(U); uniqueness on all of D requires surjectivity or independently fixed off-image data."
    audit_disposition: "proved_conditionally_with_image_and_global_claims_separated"
    proof: "Every d in im(U) has a preimage fixing f(d). Values on D minus im(U) are not constrained by R=f after U. Surjectivity removes that complement; otherwise existence and uniqueness require separate off-image structure."
  - theorem_id: "THM-03-CONSERVATIVE-PRINCIPAL-CONSTANCY"
    statement: "Within the declared conservative subcategory, P4-T01 principal data depends only on the fixed reduced highest-derivative operator and is constant across occurrence/admissibility roots."
    audit_disposition: "verified_on_an_explicit_proposal_only_product_control_not_derived_for_current_source_extensions"
    proof: "Holding the full leading operator, constraints, gauge generators, redundancies, reduced fibers, and quotient fixed makes sigma_L and its determinant-line polynomial identical for all occurrence decorations."
  - theorem_id: "THM-04-OPERATOR-DEPENDENCE-FALSIFIER"
    statement: "A change to highest-derivative coefficients, constraints, gauge generators, or the reduced quotient is a source-law/reduction change, not an occurrence-only conservative variation."
    audit_disposition: "proved_by_explicit_coefficient_and_reduction_controls"
    proof: "An occurrence parameter entering X_1 as X_1+eY changes the first principal factor generically; changing a constraint, gauge, or redundancy space changes the lawful reduced symbol domain, codomain, or quotient. Such cases cannot remain in a fixed-D conservative U-fibre."
  - theorem_id: "THM-05-NONSELECTION-NONIMPLICATION"
    statement: "Multiplicity or nonselection of occurrence roots alone implies neither P4 factorization nor nonfactorization."
    audit_disposition: "proved_by_constant_and_nonconstant_relevance_countercontrols_on_the_same_abstract_reduct_fibres"
    proof: "The same abstract fibre with multiple occurrence decorations admits a constant R_ctrl and a nonconstant R_alt. Root multiplicity fixes neither map, so it entails neither fibre constancy nor its failure."
  - theorem_id: "THM-06-NATURALITY"
    statement: "Any factorization result descends through all declared current-source arrows without deleting arrows by desired output."
    audit_disposition: "obstructed_for_current_source_combined_extensions"
    proof: "P4-T01 supplies passive source-presentation covariance on D and Y_PS, but the current source supplies neither X_OCC nor E_g on extensions. Restricting arrows to those preserving a desired R would be circular, so no structured naturality theorem is claimed."

proof_falsifier_payloads:
  payload_count: 6
  payloads:
    - payload_id: "NMP-RT016-007-PHIL-001"
      payload_type: "countermodel_or_obstruction"
      name: "First current-source combined-carrier typing obstruction"
      statement: "The first missing primitive is X_OCC: no bound current-source artifact forms a combined occurrence/admissibility extension carrier over the registered P4-T01 law."
      proof: "The P4-T01 source defines D, sigma_L, P_D, and covariance only. The registered RT006 sources explicitly record X_OCC, U, and R as missing and authorize this audit rather than treating them as formed. With no carrier, U and R lack domains and cannot be maps in the current-source theory."
      falsifier: "A registered current-source construction giving X_OCC objects, their attachment to D, independently declared arrows, and a lawful reduct U would falsify this first-failure claim and move the audit to R provenance or fibre constancy."
    - payload_id: "NMP-RT016-007-PHIL-002"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "Image-factorization criterion"
      statement: "For independently typed U:X->D and R:X->Y, a unique f_im:im(U)->Y with R=f_im after U exists exactly when R is constant on every U-fibre."
      proof: "Factorization implies constancy. Fibre constancy makes f_im(U(x))=R(x) independent of the chosen preimage; the corestriction X->im(U) is surjective, so f_im is unique."
      falsifier: "Any x_0,x_1 with U(x_0)=U(x_1) and R(x_0) distinct from R(x_1) blocks the factor."
    - payload_id: "NMP-RT016-007-PHIL-003"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "Image versus full-domain extension boundary"
      statement: "The image factor determines no value on D minus im(U); an all-domain factor requires a separate extension and is not unique without surjectivity or fixed off-image data."
      proof: "The equation R=f after U evaluates f only at U(x). Altering f on any off-image element preserves the equation, so image uniqueness cannot be promoted globally."
      falsifier: "Surjectivity of U, or an independently specified unique off-image extension rule, removes the nonuniqueness."
    - payload_id: "NMP-RT016-007-PHIL-004"
      payload_type: "concrete_certificate_step_families"
      name: "Conservative product factorization control"
      statement: "Let E_occ contain three disclosed decorations e_1,e_2,e_3 and set X_ctrl={D_0} times E_occ, U_ctrl(D_0,e)=D_0, and R_ctrl=Prin after U_ctrl. Then all three extensions have the same P4-T01 principal data and R_ctrl factors on im(U_ctrl)."
      proof: "The construction holds background, leading coefficients, constraint and gauge data, redundancies, and lawful reduction fixed. Therefore the reduced symbol and determinant-line polynomial remain exactly those of D_0."
      scope_guard: "This is a task-local proposal-only product control and does not show that the current source derives X_ctrl or the attachment rule."
      falsifier: "A verified change in any held-fixed leading or reduction datum shows that the tested extension was not in the conservative subcategory."
    - payload_id: "NMP-RT016-007-PHIL-005"
      payload_type: "countermodel_or_obstruction"
      name: "Same-reduct relevance-underdetermination countercontrol"
      statement: "On the same abstract X_ctrl and U_ctrl, both a constant map R_const and a map R_alt assigning two distinct Y_PS values to two occurrence decorations are formally definable. U and root multiplicity alone therefore do not select fibre constancy."
      proof: "The carrier and reduct syntax constrain only U. They impose no equation on R until a source-provenanced recomputation law is supplied. R_const factors and R_alt does not, while the U-fibre is identical."
      scope_guard: "R_alt is a logical underdetermination control, not a current-source nonfactorization witness or a lawful physical response."
      falsifier: "A current-source derivation uniquely fixing R=Prin after U would exclude R_alt and discharge this provenance ambiguity."
    - payload_id: "NMP-RT016-007-PHIL-006"
      payload_type: "countermodel_or_obstruction"
      name: "Operator and lawful-reduction change falsifier"
      statement: "If an occurrence parameter e changes X_1 to X_1+eY, then the first principal factor becomes k(X_1)+e k(Y) and P_e changes generically. If e changes constraints, gauge generators, redundancies, or the quotient, the lawful reduced symbol may change even with unreduced labels fixed."
      proof: "Principal data is a function of the highest-derivative operator after lawful reduction. Changing either input changes the determinant-line object in general. Such a variation is a source-law or reduction change and must not be hidden inside a conservative fixed-D fibre."
      falsifier: "If k(Y)=0 for every k then Y=0 and the coefficient control is trivial; if the reduction data is canonically isomorphic with commuting reduced symbols, the proposed reduction change does not yield a distinct principal datum."

