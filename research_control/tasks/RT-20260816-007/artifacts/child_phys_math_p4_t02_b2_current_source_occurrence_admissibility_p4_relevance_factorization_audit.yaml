theorem_target_audit:
  theorem_target_count: 6
  current_source_factorization_theorem_instance_count: 0
  targets:
    - theorem_id: "THM-01-FIBRE-FACTORIZATION"
      name: "ImageFibreFactorizationCriterion"
      hypotheses:
        - "X, D, and Y are sets and U:X->D and R:X->Y are functions."
      statement: "There exists a unique f_im:im(U)->Y satisfying R=f_im composed with U exactly when R is constant on every U-fibre."
      proof: "If R=f_im composed with U and U(x)=U(x'), then R(x)=f_im(U(x))=f_im(U(x'))=R(x'). Conversely, if R is fibre-constant, define f_im(U(x))=R(x). Fibre constancy makes the definition independent of x, factorization follows, and every point of im(U) has a preimage, so any other factor agrees there."
      falsifier: "Provide x and x' with U(x)=U(x') but R(x) different from R(x'); this blocks factorization. A factor on im(U) cannot be falsified by disagreement only at D points outside im(U)."
      audit_status: "conditional_theorem_proved_no_current_X_OCC_or_R_instance"
    - theorem_id: "THM-02-FACTOR-UNIQUENESS"
      name: "ImageVersusAllDomainExtensionAndUniqueness"
      hypotheses:
        - "THM-01 gives f_im on im(U)."
        - "For the elementary set-level clause, Y is a fixed set."
      statement: "The factor is unique on im(U). At set level, extending it to all D is a separate off-image assignment problem; when Y is nonempty an extension exists, and it is unique exactly when D equals im(U) or Y has at most one element. In a fibrewise, functorial, or natural codomain, existence additionally requires independently typed off-image objects and compatibility data."
      proof: "Uniqueness on im(U) is THM-01. If Y is nonempty, choose y_0 in Y and set f(d)=f_im(d) on im(U) and f(d)=y_0 outside. If D minus im(U) is nonempty and Y contains distinct y_0,y_1, changing the value at one off-image point gives two extensions, so uniqueness fails. If no off-image point exists or Y has at most one element, any two extensions agree. Structured naturality is not implied by this pointwise choice and must be proved separately."
      falsifier: "Claim unique all-D factorization while exhibiting one off-image d_0 and two admissible distinct Y values, or claim a structured extension without the required fibre and arrow compatibility."
      audit_status: "conditional_theorem_proved_global_claim_blocked"
    - theorem_id: "THM-03-CONSERVATIVE-PRINCIPAL-CONSTANCY"
      name: "ConservativeProductPrincipalConstancy"
      hypotheses:
        - "A proposal-only product X_prod=D_source x O exists."
        - "U(d,o)=d."
        - "D, background, all highest-derivative coefficients, C_alg, C_diff, G_int, R_alg, field and equation fibres, and the lawful reduced quotient are independent of o."
        - "R_prod=Prin composed with U."
      statement: "R_prod is constant on each U-fibre and factors uniquely on im(U) as Prin. For the fixed P4-T01 law, every o over d has sigma_L_D=diag(k(X_A)) and P_D=product_A k(X_A)."
      proof: "Every element (d,o) in U^{-1}(d) has the same D and identical lawful reduction data by hypothesis. P4-T01 computes principal data only from that reduced highest-derivative operator, so R_prod(d,o)=Prin(d) independently of o. THM-01 supplies the image factor."
      falsifier: "Exhibit an o-dependence in a leading coefficient, constraint, gauge generator, equation redundancy, reduced field/equation fibre, or quotient map while still calling the family conservative."
      audit_status: "exact_task_local_control_not_a_current_source_derivation_of_X_prod"
    - theorem_id: "THM-04-OPERATOR-DEPENDENCE-FALSIFIER"
      name: "OperatorOrLawfulReductionChangeBoundary"
      hypotheses:
        - "U is required to retain the complete source law and lawful reduction data."
      statement: "If an occurrence-associated parameter changes a highest-derivative coefficient, constraint space, constraint propagation, gauge generator, equation redundancy, reduced field/equation fibre, or lawful quotient, then it changes D_source or the type/value of Prin(D); it is not an occurrence-only conservative variation in one honest U-fibre."
      proof: "The source-principal symbol is the leading operator after lawful restriction and quotient. Changing a leading coefficient changes sigma directly. Changing constraints, gauge, redundancies, or quotient changes the domain, codomain, or induced reduced map. Since an honest U retains those data, the changed objects have different U-images. If a purported U erases the change, it is not the declared source-law reduct."
      falsifier: "Produce a nontrivial change to one listed datum while proving equality of the complete reduced principal map, its determinant-line type, and all quotient identifications under the same retained D."
      audit_status: "theorem_with_exact_coefficient_and_reduction_controls"
    - theorem_id: "THM-05-NONSELECTION-NONIMPLICATION"
      name: "OccurrenceNonselectionDoesNotDecideP4Relevance"
      hypotheses:
        - "A two-root extension set {x_0,x_1} has no selected root and both roots share one proposed reduct d."
        - "Y contains y_0 and a distinct control value y_1."
      statement: "The same nonselection facts are compatible with a constant relevance assignment R_c(x_i)=y_0 that factors and a split assignment R_s(x_0)=y_0, R_s(x_1)=y_1 that does not. Therefore multiplicity or nonselection alone entails neither factorization nor nonfactorization."
      proof: "R_c is fibre-constant, so THM-01 gives a factor. R_s takes two values on the same fibre, so THM-01 forbids a factor. The extension set and absence of a selected root are identical in both controls; only the independently unspecified relevance law changes."
      falsifier: "Derive one unique relevance assignment from independently registered source data without using the desired factorization verdict or a target response."
      audit_status: "independence_theorem_proved_controls_are_metatheoretic_not_current_source_R"
    - theorem_id: "THM-06-NATURALITY"
      name: "ConditionalImageFactorNaturality"
      hypotheses:
        - "D_source and X_OCC are categories or groupoids."
        - "U and extension transport E_g are defined independently of output."
        - "Y_PS has principal transport Y_g."
        - "U(E_g x)=T_g(Ux) and R(E_g x)=Y_g(R(x)) for every admitted source arrow g."
        - "R is constant on each U-fibre."
      statement: "The image factor satisfies f_im(T_g d)=Y_g(f_im(d)) for every d in im(U) and every admitted arrow whose transported object remains in im(U)."
      proof: "Choose x with U(x)=d. Then f_im(T_g d)=f_im(U(E_gx))=R(E_gx)=Y_g(R(x))=Y_g(f_im(d)). Fibre constancy makes the choice of x irrelevant. No arrow is removed because of the desired output."
      falsifier: "An admitted g and x for which U(E_gx) differs from T_gU(x), R(E_gx) differs from Y_gR(x), or E_g is undefined; deleting that arrow by desired-output preservation is not a repair."
      audit_status: "P4_T01_principal_transport_available_but_extension_naturality_uninstantiated_after_X_OCC_failure"

