stress_branches:
  - branch_id: "STRESS-01-ARBITRARILY-SMALL-DRIFT"
    input: "F_{sigma,mu}(a)=-gamma*a^3+mu*sigma with mu=-epsilon and epsilon>0"
    exact_result: "On y=sigma*a the equation is ydot=-gamma*y^3-epsilon<=-epsilon; every y0>0 crosses zero by time y0/epsilon."
    source_covariance: "F_{-sigma,mu}(-a)=-F_{sigma,mu}(a)"
    perturbation_size: "The global C0 distance from the fixed field is epsilon and every derivative difference of positive order is zero."
    disposition: "countermodel_to_unrestricted_perturbative_viability"
  - branch_id: "STRESS-02-BOUNDARY-MARGIN-TRICHOTOMY"
    input: "mu<0, mu=0, and mu>0 in the same reflection-equivariant family"
    exact_result: "The unique attracting equilibrium on y=sigma*a is real_cuberoot(mu/gamma), respectively opposite, on, or inside the selected half-line."
    disposition: "fixed_candidate_has_zero_inward_margin_and_is_on_the_robustness_boundary"
  - branch_id: "STRESS-03-BOUNDARY-TANGENCY-THEOREM"
    input: "Locally Lipschitz scalar token family ydot=f(y)"
    exact_result: "f(0)=0 plus uniqueness protects the open sign component only inside a tangency-preserving class; f(0)<0 makes nearby selected states cross; f(0)>0 supplies an open inward-margin neighborhood."
    disposition: "missing_source_derived_tangency_or_positive_inward_margin_primitive"
  - branch_id: "STRESS-04-OFF-FAMILY-TRANSVERSE-MODE"
    input: "adot=-gamma*a^3+epsilon*z, zdot=0, reflection (a,z,sigma)->(-a,-z,-sigma)"
    exact_result: "The source slice z=-sigma reproduces the outward drift. More sharply at gamma=1 epsilon=1/N z0=-sigma/N and sigma*a0=1/N^2 the state begins 1/N from the embedded sheet crosses by time one and the compact-open C1 field difference tends to zero."
    disposition: "one_dimensional_viability_does_not_lift_without_a_full_state_admissibility_law"
  - branch_id: "STRESS-05-TRANSVERSE-TUBE-EXIT"
    input: "adot=-gamma*a^3, zdot=epsilon*sigma on the lifted domain sigma*a>0 and |z|<rho"
    exact_result: "The amplitude remains selected while every trajectory exits the transverse tube in finite time no greater than 2*rho/epsilon."
    disposition: "component_selection_alone_does_not_protect_an_off_family_source_domain"
  - branch_id: "STRESS-06-TOKEN-ERASURE-OR-REVERSAL"
    input: "Remove sigma or replace sigma by -sigma while holding a fixed"
    exact_result: "Erasure restores the exact two-component nonselection; reversal changes the declared selected component without a source event law."
    disposition: "missing_token_identity_and_persistence_primitive"
  - branch_id: "STRESS-07-STOCHASTIC-TOKEN-FLIP"
    input: "Symmetric token flips at rate kappa>0 while amplitude follows the fixed cubic law"
    exact_result: "The selected set exits at the first flip; survival through time T is exp(-kappa*T), so exit probability tends to one. In the discrete control uninterrupted survival is (1-p)^n but endpoint occupancy is [1+(1-2p)^n]/2; the joint stationary law is delta_0 times the uniform token law."
    disposition: "arbitrarily_small_flip_rate_destroys_infinite_horizon_token_persistence"
  - branch_id: "STRESS-08-FINITE-VERSUS-ASYMPTOTIC-MARGIN"
    input: "The fixed cubic law with a0 in U_sigma"
    exact_result: "b_sigma(a(t))^2=[1+a_star^2/a0^2+2*gamma*a_star^2*t]^{-1}; it is positive at every finite time and tends to zero."
    disposition: "finite_viability_survives_but_no_uniform_asymptotic_margin_exists"
  - branch_id: "STRESS-09-INVARIANT-PROBABILITY-BIFURCATION"
    input: "The mu-family above"
    exact_result: "A strict Lyapunov function makes delta_{real_cuberoot(mu/gamma)} the unique invariant probability; its support is selected only for mu>0, on the boundary for mu=0, and opposite for mu<0."
    disposition: "source_purity_and_token_data_do_not_select_stationary_occurrence"
  - branch_id: "STRESS-10-FROZEN-ROUTE-CONTROLS"
    input: "All four inherited frozen candidate families"
    exact_result: "No shared tau, repaired Q_ray, common character or holonomy law, or oriented-matroid bridge output is used as selector or stabilizer."
    disposition: "all_inherited_freezes_preserved"

new_mathematical_payload:
  - payload_id: "MATH-RT005-BOUNDARY-BIFURCATION"
    payload_type: "exact_countermodel_family"
    statement: "The reflection-equivariant one-parameter family F_{sigma,mu}=-gamma*a^3+mu*sigma has an exact selected/boundary/opposite equilibrium trichotomy and arbitrarily small negative-mu members destroy U_sigma viability."
  - payload_id: "MATH-RT005-ROBUSTNESS-BOUNDARY"
    payload_type: "theorem_pressure"
    statement: "Reflection forces the two oriented boundary velocities to agree but leaves their common sign free. The fixed field has zero inward margin; tangency must be protected by an independently justified class restriction or replaced by a strictly positive inward-margin primitive for open perturbative robustness."
  - payload_id: "MATH-RT005-TRANSVERSE-LIFT"
    payload_type: "off_family_countermodel"
    statement: "Arbitrarily small reflection-equivariant transverse couplings or drifts destroy lifted-domain viability while the one-mode theorem remains true on its exact slice."
  - payload_id: "MATH-RT005-TOKEN-PERSISTENCE"
    payload_type: "stochastic_countermodel"
    statement: "Any positive symmetric token-flip rate gives survival exp(-kappa*T) and eventual exit probability one; discrete uninterrupted survival differs exactly from endpoint occupancy, and the unique joint stationary law remains off the selected open set."
  - payload_id: "MATH-RT005-OCCUPATION-DECAY"
    payload_type: "asymptotic_identity"
    statement: "The exact normalized-barrier square decays as [1+a_star^2/a0^2+2*gamma*a_star^2*t]^{-1}, so its long-time average also tends to zero."

