formal_setup:
  fixed_source_state: "X_src=Q_amp identified with R through q_a<->a."
  lifted_token_state: "E=R x {+1,-1} with reflection J(a,sigma)=(-a,-sigma)."
  selected_lifted_domain: "A={(a,sigma):y=sigma*a>0}."
  fixed_vector_field: "F_0(a,sigma)=-gamma*a^3 with gamma>0."
  fixed_flow: "phi_t(a)=a/sqrt(1+2*gamma*t*a^2)."
  fixed_successor_relation: "R_Delta(a)={phi_t(a):0<=t<=Delta}, Delta>0."
  fixed_barrier: "b_sigma(a)=sigma*a/sqrt(a_star^2+a^2), a_star>0."
  oriented_coordinate: "y=sigma*a, so the fixed field is y_dot=-gamma*y^3."
  admitted_drift_family: "F_mu(a,sigma)=-gamma*a^3+mu*sigma, with target-free source parameter mu."
  drift_reflection_law: "F_mu(-a,-sigma)=-F_mu(a,sigma)."
  drift_oriented_field: "y_dot=-gamma*y^3+mu."
  transverse_state: "E_tilde=R^2 x {+1,-1}, coordinates (a,z,sigma), reflection (a,z,sigma)->(-a,-z,-sigma)."
  transverse_field: "G_kappa(a,z,sigma)=(-gamma*a^3+kappa*z,0)."
  stochastic_token_kernel: "After a sign-preserving amplitude step, sigma flips independently with probability p and remains fixed with probability 1-p."
