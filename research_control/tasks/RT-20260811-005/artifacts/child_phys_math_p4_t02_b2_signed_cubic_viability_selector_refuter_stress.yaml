stress_branch_results:
  - branch_id: "STRESS-01-TOTALITY-VERSUS-SELECTION"
    required_branch: "totality and selector robustness"
    local_result: "totality_survives_selection_fails_for_negative_mu"
    exact_evidence: "For every real mu, r=cuberoot(mu/gamma) is the unique equilibrium of y_dot=-gamma*(y^3-r^3). The field points toward r, so every forward solution is bounded and total. For mu<0, however, every y_0>0 crosses y=0 in finite time."
    fixed_candidate_effect: "No fixed theorem is refuted; totality does not imply selected-component viability."
  - branch_id: "STRESS-02-ARBITRARILY-SMALL-TOKEN-AWARE-DRIFT"
    required_branch: "arbitrarily small reflection-equivariant token-aware drift"
    local_result: "exact_component_crossing_counterfamily"
    exact_evidence: "Set gamma=1 and eta_N=N^(-3). The field F_N^-(a,sigma)=-a^3-eta_N*sigma is reflection-equivariant and has global C0 distance eta_N from F_0, with all continuous-state derivative differences zero. From y_0=eta_N, y_dot=-y^3-eta_N<=-eta_N while y>=0, so crossing occurs by t<=1; the exact attracting equilibrium is y=-1/N."
    fixed_candidate_effect: "The exact mu=0 flow remains valid, but it has no two-sided structural-stability neighborhood in the admitted drift class."
  - branch_id: "STRESS-03-OFF-FAMILY-TRANSVERSE-MODE"
    required_branch: "one transverse source mode"
    local_result: "one_mode_viability_does_not_lift_without_full_state_primitive"
    exact_evidence: "For gamma=1, G_kappa=(-a^3+kappa*z,0) is reflection-equivariant. Let kappa=1/N, z_0=-sigma/N, and y_0=sigma*a_0=1/N^2. Then z is constant and y_dot=-y^3-1/N^2, so y crosses zero by t<=1. The initial state is 1/N from the z=0 sheet; on each compact |z|<=R, the field-value perturbation is at most R/N and its only new first derivative is 1/N."
    fixed_candidate_effect: "The candidate states no theorem on E_tilde; this is an exact failure of a universal full-state lift, not a contradiction of its one-dimensional result."
  - branch_id: "STRESS-04-TOKEN-ERASURE"
    required_branch: "token erasure"
    local_result: "exact_two_component_nonselection_survives"
    exact_evidence: "After forgetting sigma, the unsigned cubic flow preserves both nonempty components C_+ and C_- and reflection exchanges them. No component identity is selected by the unchanged unsigned dynamics."
    fixed_candidate_effect: "This preserves the RT003 occurrence-versus-viability independence theorem."
  - branch_id: "STRESS-05-TOKEN-REVERSAL"
    required_branch: "deterministic token reversal"
    local_result: "immediate_selector_exit"
    exact_evidence: "The source-local map rho(a,sigma)=(a,-sigma) commutes with reflection J and sends every selected state with sigma*a>0 to a state with (-sigma)*a<0 while leaving amplitude unchanged."
    fixed_candidate_effect: "A supplied token selects only while a separate law preserves it."
  - branch_id: "STRESS-06-STOCHASTIC-TOKEN-FLIP"
    required_branch: "symmetric stochastic token flips"
    local_result: "almost_sure_viability_and_persistence_fail"
    exact_evidence: "For 0<p<=1, a selected state exits on the next step with probability p. The probability of never exiting through n steps is (1-p)^n, while the probability of occupying the selected sheet at step n is (1+(1-2p)^n)/2. The distinction prevents a later even-parity return from being miscounted as uninterrupted viability."
    fixed_candidate_effect: "No probability law was part of the candidate; this stress exposes the missing token-persistence primitive without importing empirical semantics."
  - branch_id: "STRESS-07-FINITE-VERSUS-ASYMPTOTIC-VIABILITY"
    required_branch: "finite versus asymptotic viability"
    local_result: "finite_theorem_survives_no_uniform_asymptotic_margin"
    exact_evidence: "For an admitted path with cumulative time T_n=sum_j t_j, y_n=y_0/sqrt(1+2*gamma*T_n*y_0^2)>0 at every finite n. If T_n tends to infinity, y_n and b_sigma(a_n) tend to zero; the sharp worst-case n-step factor Lambda_n=(1+2*n*gamma*Delta*a_star^2)^(-1/2) also tends to zero."
    fixed_candidate_effect: "Exact finite-path viability is preserved; closed limiting viability and an n-independent positive barrier margin do not follow."
  - branch_id: "STRESS-08-INVARIANT-PROBABILITY"
    required_branch: "invariant probability"
    local_result: "no_stationary_occurrence_on_selected_open_component"
    exact_evidence: "For every fixed t_0>0, phi_t0^n(a) tends pointwise to zero. Invariance plus dominated convergence for bounded continuous tests forces every invariant Borel probability on R to be delta_0, which gives U_sigma zero mass. With any symmetric flip probability p>0, the unique joint invariant law is delta_0 times the uniform token law, again supported off A."
    fixed_candidate_effect: "The RT004 invariant-measure consequence survives and blocks probability-occurrence overread."
  - branch_id: "STRESS-09-BOUNDARY-TANGENCY-AND-INWARD-MARGIN"
    required_branch: "exact boundary tangency and inward-margin robustness"
    local_result: "reflection_does_not_anchor_or_orient_boundary_velocity"
    exact_evidence: "For any reflection-equivariant lifted field F, v_sigma=sigma*F(0,sigma) satisfies v_+=v_-, but symmetry imposes no sign. In the exact family v=mu: mu>0 is strictly inward and preserves A, mu=0 is tangent and preserves A only under the exact anchored locally Lipschitz law, and mu<0 is outward and crosses."
    fixed_candidate_effect: "The candidate sits at zero inward margin; robustness requires either a derived anchoring restriction F(0,sigma)=0 or a positive margin stable over a declared perturbation class."
  - branch_id: "STRESS-10-P4-T02-BRIDGE-RELEVANCE"
    required_branch: "relevance to the active P4-T02 burden and frozen-route independence"
    local_result: "source_sign_component_certificate_is_not_a_physical_common_cone_certificate"
    exact_evidence: "The candidate contains no sector principal polynomial, common hyperbolicity cone, physical time orientation, response semantics, or full-state finite-variation law. None of the four frozen route outputs occurs in the countermodels or conclusions."
    fixed_candidate_effect: "No D7, B2, P4-T03, g_eff, matter-coupling, or Einstein-equation consequence follows."

new_mathematical_payload:
  - payload_id: "NMP-RT20260811-005-CHILD-MATH-001"
    payload_type: "reflection_boundary_velocity_quotient_lemma"
    name: "Reflection equivariance identifies sheet velocities but does not choose their sign"
    statement: "Let F:R x {+1,-1}->R obey F(-a,-sigma)=-F(a,sigma), and define v_sigma=sigma*F(0,sigma). Then v_+=v_-. Conversely every real v occurs in the reflection-equivariant family F_mu=-gamma*a^3+mu*sigma with v=mu."
    proof: "At a=0, equivariance gives F(0,-sigma)=-F(0,sigma), hence (-sigma)F(0,-sigma)=sigma F(0,sigma). The displayed family realizes arbitrary mu."
    barrier_consequence: "Writing b(y)=y/sqrt(a_star^2+y^2), b_dot=a_star^2*(-gamma*y^3+mu)/(a_star^2+y^2)^(3/2), so b_dot at y=0 is mu/a_star. The source reflection therefore protects equality across token sheets but supplies neither anchoring nor inward orientation."
    novelty_relative_to_rt003_rt004: "RT003 proved reflection transport and RT004 proved token nonselection; this lemma isolates the exact scalar boundary datum that those symmetries leave free."
  - payload_id: "NMP-RT20260811-005-CHILD-MATH-002"
    payload_type: "exact_rational_structural_instability_counterfamily"
    name: "Total reflection-equivariant wall crossing at arbitrarily small drift"
    construction: "At gamma=1 choose N>=1, eta_N=1/N^3, F_N^-(a,sigma)=-a^3-eta_N*sigma, and y_0=eta_N."
    exact_checks:
      reflection_equivariance: "F_N^-(-a,-sigma)=-F_N^-(a,sigma)."
      perturbation_size: "sup_{a,sigma}|F_N^--F_0|=eta_N and every derivative difference with respect to a is zero."
      finite_crossing: "While y>=0, y_dot=-y^3-eta_N<=-eta_N; therefore the first crossing time is at most y_0/eta_N=1."
      totality: "The unique equilibrium is -1/N and the scalar field points toward it, so every forward orbit remains bounded and is global."
      exact_rationality: "eta_N, y_0, and the equilibrium are rational for every positive integer N."
    consequence: "There is no open compact-C1 or global-C0 neighborhood of the fixed field within the admitted token-aware reflection-equivariant class on which selected-component viability follows from symmetry alone."
    scope: "source_extension_candidate"
  - payload_id: "NMP-RT20260811-005-CHILD-MATH-003"
    payload_type: "off_family_transverse_near_sheet_counterfamily"
    name: "Arbitrarily near transverse states reproduce the outward drift"
    construction: "At gamma=1 take G_N(a,z)=(-a^3+z/N,0), z_0=-sigma/N, and sigma*a_0=1/N^2."
    exact_checks:
      reflection_equivariance: "G_N(-a,-z)=-G_N(a,z)."
      near_sheet_state: "|z_0|=1/N tends to zero."
      compact_field_convergence: "On |z|<=R the value difference from (-a^3,0) is at most R/N and the new z derivative is 1/N."
      crossing: "The oriented amplitude satisfies y_dot=-y^3-1/N^2 and crosses by t<=1."
    consequence: "The one-mode theorem has no automatic full-state viability lift even arbitrarily near the embedded amplitude sheet."
    scope: "source_extension_candidate"
  - payload_id: "NMP-RT20260811-005-CHILD-MATH-004"
    payload_type: "token_flip_survival_and_stationarity_theorem"
    name: "Uninterrupted viability differs from later sheet occupancy"
    statement: "Under independent symmetric token flips with probability p>0, uninterrupted survival through n steps is (1-p)^n, whereas selected-sheet occupancy at step n is (1+(1-2p)^n)/2. The unique invariant joint probability is delta_0 times the uniform token distribution."
    proof: "Uninterrupted survival forbids every flip; endpoint occupancy asks for even flip parity. The amplitude marginal of an invariant law is delta_0 by contraction, and the two-state flip kernel has the unique stationary uniform distribution for p>0."
    consequence: "Neither reflection symmetry nor eventual return supplies token persistence, pathwise viability, or probability occurrence inside A."
    scope: "source_extension_candidate"

