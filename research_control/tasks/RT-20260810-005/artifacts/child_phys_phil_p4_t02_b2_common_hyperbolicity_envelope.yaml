positive_projective_response_ray_assessment:
  formal_domain:
    response_space: "R^{S_eq} minus the zero vector"
    quotient_group: "common multiplication by R_{>0}"
    excluded_zero_locus: "Z_x={k:p_R(k)=p_S(k)=p_D(k)=0}"
    boundary_treatment: "A response with at least one zero coordinate lies outside O_+++; the projective class remains defined only if some other coordinate is nonzero."
  why_positive_not_unsigned: "lambda>0 preserves the chosen joint sign orientation. Quotienting by negative lambda would identify the positive and negative orthants and erase the orientation datum being tested."
  exact_preimage_scope:
    linear_witness: "The positivity locus of each linear form is its chosen hyperbolicity component, so the full positive-orthant preimage equals Gamma_intersection."
    general_hyperbolic_family: "For higher-degree or multi-component positivity sets, the connected component containing h, rather than the entire positive-orthant preimage, must be identified with the chosen common hyperbolicity component unless an additional component theorem is supplied."
  source_operational_legitimacy:
    candidate_is_well_defined: true
    candidate_is_target_metric_free: true
    candidate_is_source_presentation_covariant_on_explicit_pairing_witness: true
    candidate_is_empirically_interpreted: false
    exact_assessment: "It is a legitimate proposal-only source-operational classifier because it gives an explicit finite equivalence law and an exact positivity test on declared source values. Its operationality is formal and internal, not empirical."
  noncircularity_audit:
    no_desired_target_used: true
    independent_sector_forms_retained: true
    commonity_not_forced_by_equal_forms: true
    preimage_identity_is_definitional: true
    independent_physical_justification_supplied: false
    exact_assessment: "The map is noncircular as a target-free mathematical classifier: it reads independently supplied sector values and tests joint positivity. It is not an independent reason to call that positivity domain physical causality, because rho_x is defined from the same forms whose common positivity defines the envelope."
  representation_and_typing_limits:
    common_scale_removed: true
    sectorwise_scale_removed: false
    issue: "Principal representatives may admit independent positive rescalings. Those preserve the orthant but generally change the response ray's cross-sector coordinate ratios, so one common projectivization does not by itself produce a canonical quotient of principal-polynomial representation freedom."
    degree_issue: "If sector forms have unequal degrees, positive rescaling of k changes coordinates by different powers and need not preserve one ordinary projective response ray. The explicit equal-degree linear witness avoids this; a general packet would need common degree, weighted projectivization, or a justified alternative."
    multiplicity_issue: "Replacing one reduced factor by a positive power can preserve a characteristic set while changing response-ray ratios. Reduced-factor and multiplicity conventions therefore remain part of the proposal data."
    unit_issue: "Cross-sector ratios have no physical or empirical meaning until common typing, normalization, and units are source-derived."
