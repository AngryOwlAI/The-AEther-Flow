    positive_orthant_is_physical_future_cone: false
    quotient_identifies_sector_propagation: false
    quotient_derives_universal_signal_speed: false
    reason: "Projectivizing a tuple of polynomial evaluations discards one normalization; it neither identifies distinct characteristic hypersurfaces nor supplies a model-to-world law."

