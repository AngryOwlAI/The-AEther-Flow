  cocycle_defect:
    status: "CONDITIONALLY_ABSENT_FOR_DECLARED_GLOBAL_SCALARS"
    witness: "The candidate has identity transitions. General local representatives must have one common positive unit satisfying inverse and triple-overlap cocycles; otherwise the quotient fails closed."
  variation_fragility:
    status: "LOCALLY_CONTROLLED_NOT_GLOBALLY_REMOVED"
    witness: "A positive compact margin gives an explicit independent-product open neighborhood. The Gordan empty witness and zero-margin boundary show that unrestricted or large independent variations can destroy the intersection."

