    status: "PRESENT_AND_EXPLICITLY_LIMITED"
    witness: "Sector sign orientations and scalar normalizations are proposal choices, while ker(rho_x) gives distinct covectors the same response. No unique h, inverse covector ray, or physical orientation is derived."
  inverse_defect:
    status: "FORWARD_QUOTIENT_ONLY"
    witness: "dim ker(rho_x)>=1, so Q_x has no inverse even in the maximal-rank three-sector case. On overlaps, a sector-dependent transition unit also prevents a projective inverse/gluing rule."
