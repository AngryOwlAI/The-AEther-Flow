source_entries:
  - source_id: "EPS-1972-FREE-FALL-LIGHT"
    comparison_side: "continuum_first"
    topics: ["constructive spacetime axiomatics", "conformal structure", "projective structure"]
    primary_source: true
    citation_apa7: "Ehlers, J., Pirani, F. A. E., & Schild, A. (2012). Republication of: The geometry of free fall and light propagation. General Relativity and Gravitation, 44, 1587–1609. https://doi.org/10.1007/s10714-012-1353-4 (Original work published 1972)"
    publisher_url: "https://doi.org/10.1007/s10714-012-1353-4"
    exact_hypotheses: "A four-dimensional differentiable event manifold plus axioms for light rays and freely falling particles sufficient to define compatible conformal and projective structures."
    established_conclusion: "Within those assumptions, compatible light and free-fall structures determine a Weylian/Lorentzian geometrical framework, with further clock assumptions needed for the pseudo-Riemannian specialization."
    transfer_boundary: "Supports continuum-first constructive axiomatics after dimension and differentiability are supplied. It does not derive those primitives, source dynamics, metric normalization, or AEther-Flow ontology."
  - source_id: "HKM-1976-PATH-TOPOLOGY"
    comparison_side: "continuum_first"
    topics: ["causal structure", "path topology", "differentiable structure"]
    primary_source: true
    citation_apa7: "Hawking, S. W., King, A. R., & McCarthy, P. J. (1976). A new topology for curved space-time which incorporates the causal, differential, and conformal structures. Journal of Mathematical Physics, 17(2), 174–181. https://doi.org/10.1063/1.522874"
    publisher_url: "https://doi.org/10.1063/1.522874"
    exact_hypotheses: "A curved spacetime with its timelike paths and associated causal structure, under the paper's causality and regularity setting."
    established_conclusion: "The path topology is constructed so that causal, differential, and conformal information is encoded more tightly than by the ordinary manifold topology."
    transfer_boundary: "Shows strong recoverability among continuum spacetime structures once spacetime paths are available. It does not construct paths, topology, or differentiability from the P4-T03 minimal source order."
  - source_id: "MALAMENT-1977-TIMELIKE-CURVES"
    comparison_side: "continuum_first"
    topics: ["causal reconstruction", "conformal geometry", "topology"]
    primary_source: true
    citation_apa7: "Malament, D. B. (1977). The class of continuous timelike curves determines the topology of spacetime. Journal of Mathematical Physics, 18(7), 1399–1404. https://doi.org/10.1063/1.523436"
    publisher_url: "https://doi.org/10.1063/1.523436"
    exact_hypotheses: "Past- and future-distinguishing relativistic spacetimes, with the class of continuous timelike curves fixed."
    established_conclusion: "For the scoped spacetime class, causal/timelike-curve structure determines topology and conformal structure; the paper also relates the path topology to topological, differential, and conformal structure."
    transfer_boundary: "Supports the information content of mature continuum causal structure. It does not show that an arbitrary locally finite order is manifoldlike, four-dimensional, smooth, or dynamically GR-like."
  - source_id: "CONNES-2013-SPECTRAL-RECONSTRUCTION"
    comparison_side: "continuum_first"
    topics: ["reconstruction theorem", "spectral triples", "smooth manifolds"]
    primary_source: true
    citation_apa7: "Connes, A. (2013). On the spectral characterization of manifolds. Journal of Noncommutative Geometry, 7(1), 1–82. https://doi.org/10.4171/JNCG/108"
    publisher_url: "https://ems.press/journals/jncg/articles/1649"
    exact_hypotheses: "A commutative spectral triple satisfying the strengthened reconstruction axioms used in the paper, including regularity, finiteness, orientability, and spectral conditions."
    established_conclusion: "The algebra is the smooth-function algebra of a unique compact oriented smooth manifold and the operator is of Dirac type, in the Riemannian spin setting."
    transfer_boundary: "Demonstrates that continuum reconstruction is possible from sufficiently rich algebraic data, while also exposing how strong the needed axioms are. It is not a Lorentzian, dynamical, or minimal-order emergence theorem."
  - source_id: "BFV-2003-LOCALLY-COVARIANT-QFT"
    comparison_side: "continuum_first"
    topics: ["category theory", "local covariance", "matter compatibility"]
    primary_source: true
    citation_apa7: "Brunetti, R., Fredenhagen, K., & Verch, R. (2003). The generally covariant locality principle—A new paradigm for local quantum physics. Communications in Mathematical Physics, 237, 31–68. https://arxiv.org/abs/math-ph/0112041"
    publisher_url: "https://arxiv.org/abs/math-ph/0112041"
    exact_hypotheses: "A category of globally hyperbolic spacetimes with admissible isometric embeddings and a category of unital algebras, with theories represented by covariant functors and fields by natural transformations."
    established_conclusion: "Locally covariant quantum field theory can be formulated functorially, including relative Cauchy evolution and a stress-energy interpretation in the stated setting."
    transfer_boundary: "Supports categorical organization and downstream matter-theory compatibility on supplied continuum backgrounds. It neither derives the backgrounds nor establishes AEther-Flow matter semantics or coupling."
