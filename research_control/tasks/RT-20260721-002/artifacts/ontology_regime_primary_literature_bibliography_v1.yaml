  - source_id: "MAJOR-RIDEOUT-SURYA-2007-TOPOLOGY"
    comparison_side: "emergence_first"
    topics: ["continuum topology recovery", "thickened antichains", "manifoldlikeness"]
    primary_source: true
    citation_apa7: "Major, S., Rideout, D., & Surya, S. (2007). On recovering continuum topology from a causal set. Journal of Mathematical Physics, 48(3), 032501. https://doi.org/10.1063/1.2435599"
    publisher_url: "https://arxiv.org/abs/gr-qc/0604124"
    exact_hypotheses: "A causal set faithfully embedded at sufficiently high sprinkling density into a globally hyperbolic spacetime, with a suitable inextendible antichain and thickening regime."
