score_uncertainty:
  interval_semantics: "Plausible judgment range under the same fixed evidence, not a statistical confidence or posterior interval."
  baseline_difference_interval_continuum_minus_emergence: [-0.875, 1.125]
  interval_calculation: "For each criterion, subtract the emergence upper endpoint from the continuum lower endpoint for the minimum, and subtract the emergence lower endpoint from the continuum upper endpoint for the maximum; then apply baseline weights."
  consequence: "The baseline uncertainty interval crosses zero. Neither proposal has a robust quantitative lead."
  dominant_uncertainties:
    - "How strongly to credit potential explanation when no reconstruction theorem currently exists."
    - "Whether formalization tractability should emphasize bare source syntax or the entire source-to-GR chain."
    - "How the parent primary-literature review changes the literature-maturity scores after exact transfer limits are applied."
    - "Whether downstream compatibility deserves decision weight beyond project planning, given that it is not evidence of physical truth."

downstream_physics_audit:
  M_src:
    continuum_first:
      formal_consequence: "The proposal supplies a smooth four-dimensional carrier on which a source-manifold-like object can be typed."
      open_burden: "No authorized identification A=M_src, no proof that the existing scoped M_src object instantiates the proposal, and no physical-space interpretation follows."
      judgment: "High mathematical compatibility and low migration cost, but compatibility is not evidential support for ontology truth."
    emergence_first:
      formal_consequence: "The minimum signature has no manifold object, topology, dimension, or differentiable structure."
      open_burden: "M_src must be reconstructed or related through a target-separated realization map with topology, dimension, differentiability, stability, and uniqueness controls."
      judgment: "Existing M_src work is primarily evaluator-side evidence until that reconstruction exists."
  g_eff:
    continuum_first:
      formal_consequence: "Metric tensors can be typed on the smooth carrier, but the fixed theorem shows that Lorentzian signature plus order invariance does not fix constant normalization."
      open_burden: "Metric existence, Lorentzian signature, physical scale, uniqueness or equivalence class, clock calibration, and source dependence remain open."
      judgment: "The route shortens the type-construction path but does not derive a physical effective metric."
    emergence_first:
      formal_consequence: "No tangent spaces, tensor fields, conformal structure, measure, or metric exist in the minimum source signature."
      open_burden: "A source-only chain must recover causal semantics, measure and scale, dimension, differentiability, conformal and metric data, stability, and uniqueness before g_eff is available."
      judgment: "The route offers deeper potential explanation at substantially higher reconstruction risk."
  matter:
    continuum_first:
      formal_consequence: "Smooth bundles and sections provide field syntax."
      open_burden: "Bundle type does not supply matter semantics, observables, universal coupling, constants, conservation, or backreaction. Existing target matter or stress-energy cannot be imported as source premises."
      judgment: "The proposal is a convenient host for current matter-interface formalism, not a matter derivation."
    emergence_first:
      formal_consequence: "The minimum signature contains no matter species, local field values, observables, detector semantics, or coupling."
      open_burden: "Matter must be added source-side or reconstructed while preserving target neutrality, followed by universal-coupling and backreaction results."
      judgment: "The burden is larger and may force a richer source signature, reducing the initial economy advantage."
  dynamics:
    continuum_first:
      formal_consequence: "A structural monoid action and admissibility slot are typed, but neither is a source action, equation of motion, probability law, physical time, or clock."
      open_burden: "Supply a source law, conservation bridge, physical interpretation, and Einstein-recovery theorem without relabeling Phi or importing target dynamics."
      judgment: "The continuum calculus is ready, while physical law selection remains wholly open."
    emergence_first:
      formal_consequence: "A partial order and guarded fragment composition do not define a growth kernel, amplitude, action, ensemble, or typicality measure."
      open_burden: "Supply an isomorphism-invariant source dynamics with consistency, normalization or composition, manifoldlike typicality, effective dynamics, and no target-conditioned selection."
      judgment: "Dynamics is both scientifically central and a severe bottleneck; a successful law could connect explanatory economy to testable structure."
  exact_GR_recovery:
    continuum_first:
      formal_consequence: "Assuming a smooth four-dimensional arena removes only the burden of deriving a bare arena within this branch."
      open_burden: "A nonempty target-neutral realization relation, metric and clocks, matter and coupling, source dynamics, conservation, and Einstein-equation recovery in a stated regime remain unproved."
      judgment: "This is the lower-risk engineering route to formulate bridge theorems, but exact-GR recovery is still distant."
    emergence_first:
      formal_consequence: "The fixed finite examples and dimension-nonselection witness do not establish a continuum limit, four dimensions, physical causality, or GR."
      open_burden: "All eleven reconstruction layers plus source dynamics, operational semantics, matter coupling, and Einstein recovery must form an acyclic source-to-target chain."
      judgment: "This is the higher-risk, higher-potential-explanation route; no current result establishes a favorable probability of completion."
  distance_to_GR_delta: "zero for both fixed proposal-only options"

