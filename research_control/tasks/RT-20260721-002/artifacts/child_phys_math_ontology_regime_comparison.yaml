fixed_option_inventory:
  continuum_first:
    identifier: "CF-PREMETRIC-OPTION-V1"
    minimum_description: "A four-dimensional Hausdorff, second-countable, boundaryless smooth manifold with a structural ordered action, smooth bundle syntax, an admissibility class, and a structural automorphism groupoid, but no physical metric, clock, matter semantics, coupling, or dynamics."
    primitive_package_count: 6
    remaining_burden_count: 7
    adopted_primitive_count: 0
    derived_physical_object_count: 0
    principal_advantage: "A mature smooth arena is already available for differential and bundle constructions."
    principal_cost: "Dimension, topology, smoothness, field syntax, admissibility, and structural equivalence are assumed rather than explained."
  emergence_first:
    identifier: "EF-LFPO-OPTION-V1"
    minimum_description: "A nonempty finite or countably infinite token set with one locally finite strict partial order, plus guarded finite-fragment composition, but no topology, dimension, differentiability, metric, physical causality, matter, or dynamics."
    primitive_package_count: 2
    remaining_burden_count: 11
    adopted_primitive_count: 0
    reconstructed_continuum_layer_count: 0
    principal_advantage: "The declared source signature does not presuppose target manifold structure."
    principal_cost: "Every manifoldlike, metric, operational, matter, dynamical, and GR layer remains to be reconstructed and controlled."
  count_interpretation: "The counts expose different locations of assumption debt. They are not commensurate proof lengths, probabilities of truth, or sufficient statistics for ontology choice."

scoring_rubric:
  scale:
    minimum: 0.0
    maximum: 5.0
    direction: "Higher is more favorable for the stated criterion."
    anchors:
      "0.0": "No present support at proposal scope, or an unbounded unresolved obstacle dominates the criterion."
      "1.0": "Weak present support; most relevant burdens are undefined or uncontrolled."
      "2.0": "Some coherent structure exists, but major criterion-specific burdens remain."
      "3.0": "Mixed evidence with a usable core and substantial unresolved burdens."
      "4.0": "Strong present support with identifiable but bounded remaining burdens."
      "5.0": "Very strong present support at the fixed proposal scope; this still does not mean physical truth or adoption."
  criteria:
    assumption_economy:
      definition: "How little target-like spacetime structure and ancillary source structure is postulated before any derivation begins."
      guard: "Counts inform the score, but ontological parsimony is not equated with truth."
    formalization_tractability:
      definition: "How tractable the full declared source-to-target burden appears for precise definitions, proofs, counterexamples, and controlled computations, not merely how easy the bare source syntax is to state."
      guard: "A finite combinatorial syntax can be easy while its continuum and dynamics program remains difficult."
    explanatory_power:
      definition: "How much target structure the option could explain rather than assume, discounted when that explanatory reach is only aspirational and has no current reconstruction theorem."
      guard: "Ambition is credited conditionally, not counted as achieved emergence."
    primary_literature_maturity:
      definition: "Expected maturity of directly relevant mathematical and physical precedent, subject to parent verification of primary sources and exact transfer limits."
      guard: "This child score is provisional because the child did not perform the authorized literature review."
    downstream_compatibility:
      definition: "How directly the option can interface, as a research scaffold, with the existing scoped M_src, g_eff, matter-interface, dynamics, and exact-GR target artifacts without importing those artifacts as source premises."
      guard: "Compatibility measures engineering reuse and burden alignment, never physical correctness."

