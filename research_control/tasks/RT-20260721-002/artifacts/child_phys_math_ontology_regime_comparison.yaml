weighted_difference_hyperplane:
  simplex_definition: "Let w=(w_A,w_T,w_E,w_L,w_D), with every component nonnegative and w_A+w_T+w_E+w_L+w_D=1. This five-weight domain is mathematically the four-simplex Delta^4; 'five-simplex' is used only informally if it means five criteria."
  score_difference_vector_continuum_minus_emergence:
    assumption_economy: -2.5
    formalization_tractability: 2.0
    explanatory_power: -1.5
    primary_literature_maturity: 1.0
    downstream_compatibility: 2.5
  full_equation: "Delta(w) = -2.5*w_A + 2.0*w_T - 1.5*w_E + 1.0*w_L + 2.5*w_D."
  reduced_equation_using_w_D: "Delta(w) = 2.5 - 5.0*w_A - 0.5*w_T - 4.0*w_E - 1.5*w_L, where w_D=1-w_A-w_T-w_E-w_L."
  tie_hyperplane: "Delta(w)=0."
  continuum_first_halfspace: "Delta(w)>0."
  emergence_first_halfspace: "Delta(w)<0."
  formal_status: "The partition is an exact arithmetic consequence of the declared scores. The scores themselves are auditable judgments, so the hyperplane is not a theorem about nature or about ontology truth."
  non_dominance_certificate: "The difference vector has both positive and negative entries: emergence-first leads on assumption economy and explanatory power, while continuum-first leads on tractability, provisional literature maturity, and downstream compatibility. Therefore no option componentwise dominates the other under this rubric."

