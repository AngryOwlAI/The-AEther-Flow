      evidence: "Six proposal primitive packages include four-dimensional topology, smooth structure, ordered action, bundle types, admissibility, and a structural automorphism groupoid."
      judgment: "The option is coherent but carries substantial target-adjacent arena debt."
    emergence_first:
      score: 4.5
      plausible_interval: [4.0, 5.0]
      evidence: "The minimum signature has two packages, token carrier and locally finite strict partial order, with topology, dimension, differentiability, metric, matter, and dynamics explicitly absent."
      judgment: "The signature is strongly parsimonious, although local finiteness and order remain substantive primitives."
    difference_continuum_minus_emergence: -2.5
  formalization_tractability:
    continuum_first:
      score: 4.0
      plausible_interval: [3.5, 4.5]
      evidence: "Smooth manifolds, bundles, sections, pullbacks, and groupoids give immediately typed mathematics; the option already proves a bounded metric-normalization result."
      judgment: "Metric selection, physical semantics, source dynamics, and the realization relation remain hard, so the score is below maximal."
    emergence_first:
      score: 2.0
      plausible_interval: [1.5, 2.5]
      evidence: "Finite partial orders and guarded composition are precise, but eleven reconstruction layers remain open and a countable directed union need not preserve local finiteness automatically."
      judgment: "Bare syntax is highly formalizable; the full source-to-GR proof program is presently much less tractable."
    difference_continuum_minus_emergence: 2.0
  explanatory_power:
    continuum_first:
      score: 2.5
      plausible_interval: [2.0, 3.0]
      evidence: "The branch can seek source explanations for metric, clocks, matter, coupling, and dynamics, but it cannot explain the assumed four-dimensional smooth arena."
      judgment: "Its explanatory target is substantial yet structurally narrower."
    emergence_first:
      score: 4.0
      plausible_interval: [3.5, 4.5]
      evidence: "If successful, the branch could explain topology, dimension, smoothness, causal and metric structure, matter interfaces, and dynamics from weaker source data."
      judgment: "The score reflects conditional explanatory reach, discounted because zero continuum layers are currently reconstructed."
    difference_continuum_minus_emergence: -1.5
  primary_literature_maturity:
    continuum_first:
      score: 4.0
      plausible_interval: [3.5, 4.5]
      evidence: "The option uses standard continuum differential and bundle structures, but the project-specific tuple and source-to-GR bridge remain proposal-only."
      judgment: "Direct support for mathematical tools is expected to be strong; support for this ontology or its physical bridge is not presumed."
    emergence_first:
      score: 3.0
      plausible_interval: [2.5, 3.5]
      evidence: "The fixed P4-T03 source identifies causal-set precedents for locally finite order, growth dynamics, and topology-recovery tests, while explicitly denying that those sources complete continuum or GR recovery."
      judgment: "There is a serious research program, but the burden chain is less mature than its minimum syntax. Parent literature review may revise this score."
    difference_continuum_minus_emergence: 1.0
  downstream_compatibility:
    continuum_first:
      score: 4.5
      plausible_interval: [4.0, 5.0]
      evidence: "A smooth four-dimensional arena supports the mathematical types used by scoped source-manifold, tensor, bundle, metric-response, and matter-interface artifacts."
      judgment: "The compatibility is high as scaffolding, but no identification with M_src or transfer of physical authority follows."
    emergence_first:
      score: 2.0
      plausible_interval: [1.5, 2.5]
      evidence: "The minimum source signature has no topology, tangent space, tensor, metric, field, action, or operational semantics on which current downstream constructions could directly live."
      judgment: "Most current artifacts can serve only as target-side tests until a reconstruction map exists."
    difference_continuum_minus_emergence: 2.5

