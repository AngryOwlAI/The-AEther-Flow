formal_protocol:
  tuple:
    symbol: "D=(C,P,I,A,r,S,F)"
    name: "finite source operational-role protocol"
    components:
      C: "a finite P7-T02 source control system"
      P: "a finite nonempty set of preparation records p=(mu_0^p,N_p), with unit bookkeeping mass and bounded horizon N_p"
      I: "a finite family of explicit source-only intervention labels i, each selecting a well-typed control C_i on declared source data; i_0 denotes the baseline label"
      A: "a finite formal-token alphabet disjointly typed by protocol role"
      r: "for every p,i,n<=N_p, a total single-valued map r_(p,i,n):H_n(C_i)->A"
      S: "a token classifier S:A->{success,no_event,auxiliary}"
      F: "a fail-closed evaluator distinguishing malformed, underdetermined, and cross-device mismatch records"
  finite_histories:
    symbol: "H_n(C_i)"
    definition: "H_n(C_i) is the finite set of tuples (x_0,T_1,x_1,...,T_n,x_n) with T_k in E^i_(x_(k-1)) and t(T_k)=x_k."
    path_weight: "W_(p,i,n)(h)=mu_0^p(x_0) product_(k=1)^n K_(C_i)(T_k|x_(k-1))"
    codomain: "Q_nonnegative"
    semantic_rule: "W is a path-bookkeeping coefficient only"
  response_trace:
    symbol: "R^D_(p,i,n)(a)"
    definition: "R^D_(p,i,n)(a)=sum_{h in H_n(C_i):r_(p,i,n)(h)=a} W_(p,i,n)(h)"
    intervention_difference: "Delta^D_(p,i,n)(a)=R^D_(p,i,n)(a)-R^D_(p,i_0,n)(a)"
    semantics:
      - "R is a finite rational token-response record."
      - "Delta is a signed rational comparison between two declared source controls."
      - "Neither R nor Delta is a physical probability, response rate, frequency, detector statistic, or empirical prediction."
  result_branches:
    valid_success:
      symbol: "ok_D"
      condition: "all types and partitions validate and at least one token classified success has nonzero bookkeeping response"
    valid_no_event:
      symbol: "no_event_D"
      condition: "the protocol is valid but every success token has zero response at the requested bounded horizon"
      distinct_from_malformed: true
      distinct_from_underdetermined: true
    malformed:
      symbol: "bottom_D"
      triggers:
        - "preparation has negative, nonrational, unsupported, or non-unit bookkeeping entries"
        - "an intervention row is empty, omits the typed identity, or contains a non-P7-T01 transition"
        - "a token alphabet is not finite or its role types overlap"
        - "a readout is partial, multivalued, or emits a token outside A"
        - "a preparation, intervention, horizon, token, readout, success rule, or failure rule is defined from a forbidden target or process-authority datum"
    underdetermined:
      symbol: "undetermined_D"
      condition: "source data are well typed but a requested preparation, intervention, finite horizon, token alphabet, readout map, or comparison bridge is absent"
      distinct_from_no_event: true
      distinct_from_malformed: true
    cross_device_mismatch:
      symbol: "mismatch_D"
      condition: "two otherwise valid protocols fail an explicitly declared source-token bridge or independent-factorization check"
      semantic_rule: "mismatch_D is a formal consistency failure, not an empirical anomaly or violation of a physical universality principle"

mathematical_results:
  - theorem_id: "P7T03-THM-FINITE-TOKEN-RESPONSE-CLOSURE-001"
    status: "draft/control exact theorem within the proposal-only candidate"
    hypotheses:
      - "C_i is a finite P7-T02 control system for every admitted intervention i."
      - "mu_0^p is a nonnegative rational bookkeeping vector with total mass one."
      - "N_p is finite."
      - "A is finite."
      - "r_(p,i,n) is total and single valued."
    conclusions:
      - "H_n(C_i) is finite."
      - "Every W_(p,i,n)(h) and R^D_(p,i,n)(a) is a nonnegative rational."
      - "The inverse images r^(-1)(a) form a disjoint partition of H_n(C_i)."
      - "sum_(a in A) R^D_(p,i,n)(a)=1."
      - "sum_(a in A) Delta^D_(p,i,n)(a)=0."
    proof_sketch:
      - "Finite Omega, finite enabled rows, and finite n make the history set finite."
      - "P7-T02 rational kernels and rational preparation entries make every finite product and sum rational and nonnegative."
      - "Total single-valued r assigns each history to exactly one inverse-image cell."
      - "Summing response cells therefore sums all path weights; repeated P7-T02 row normalization reduces the total to the unit preparation mass."
      - "Subtracting the two normalized response totals gives the zero-sum intervention identity."
    prohibited_overread: "not probability normalization, empirical exhaustiveness, detector completeness, or physical response conservation"
    proof_authority: false

  - theorem_id: "P7T03-THM-SOURCE-PRESENTATION-NATURALITY-001"
    status: "draft/control exact theorem within the proposal-only candidate"
    hypotheses:
      - "g is a compatible P7-T01 source-presentation isomorphism transporting every C_i to C_i_prime."
      - "g transports preparation weights by (g_*mu)(gx)=mu(x)."
      - "intervention labels are transported bijectively i->i_prime."
      - "lambda:A->A_prime is a token-type-preserving bijection."
      - "the readouts commute: r_prime(g_*h)=lambda(r(h)) for every bounded history."
      - "success and failure classifiers commute with lambda."
    conclusions:
      - "g gives a weight-preserving bijection H_n(C_i)->H_n(C_i_prime)."
      - "R^(D_prime)_(g_*p,i_prime,n)(lambda(a))=R^D_(p,i,n)(a)."
      - "Delta^(D_prime)_(g_*p,i_prime,n)(lambda(a))=Delta^D_(p,i,n)(a)."
      - "valid-success, valid-no-event, malformed, underdetermined, and mismatch classifications are preserved under compatible transport."
    proof_sketch:
      - "P7-T02 equivariance preserves every transported kernel factor."
      - "Preparation transport preserves the initial factor."
      - "The finite history bijection and commuting readout map identify corresponding token cells."
      - "Changing variables in the finite response sum yields response equality; subtraction yields intervention-difference equality."
    prohibited_overread: "not target covariance, diffeomorphism invariance, observer equivalence, physical gauge equivalence, or empirical calibration invariance"
    proof_authority: false

device_suite:
  Clock_src:
    role_status: "guarded formal source-protocol role only"
    source_system:
      source_complex: "two source vertices c_0,c_1 with one oriented link e_c satisfying partial_1 e_c=[c_1]-[c_0]"
      states:
        c_0: "one rho occupation at c_0, zero defect, sector (1,[0])"
        c_1: "one rho occupation at c_1, zero defect, sector (1,[0])"
      transitions:
        id_0: "(c_0,0,0,Pi_id,c_0)"
        f_01: "(c_0,e_c,0,Pi_01,c_1)"
        id_1: "(c_1,0,0,Pi_id,c_1)"
        f_10: "(c_1,-e_c,0,Pi_10,c_0)"
      rows:
        c_0: ["id_0", "f_01"]
        c_1: ["id_1", "f_10"]
      kernel_each_enabled_record: "1/2"
    preparation:
      id: "CLK-PREP-START-0"
      bookkeeping_state: "delta_(c_0)"
      horizon: 2
    interventions:
      baseline: "clk_run uses both two-member enabled rows"
      hold: "clk_hold replaces both rows by their typed identity only"
      intervention_source: "explicit enabled-row declaration only"
    readout:
      nonidentity_count: "M(h)=the number of f_01 or f_10 records in h"
      completed_cycle_count: "Cyc(h)=floor(M(h)/2)"
      phase: "Phase(h)=M(h) mod 2"
      token: "clk_cycle_(Cyc(h))_phase_(Phase(h))"
      finite_alphabet_at_horizon_2:
        - "clk_cycle_0_phase_0"
        - "clk_cycle_0_phase_1"
        - "clk_cycle_1_phase_0"
    success_map:
      success: ["clk_cycle_1_phase_0"]
      no_event: ["clk_cycle_0_phase_0", "clk_cycle_0_phase_1"]
      exact_scope: "success means one complete alternating source-transition pair in the bounded history"
    formal_duration_comparison:
      map: "Cmp_clk(h,h_prime)=sign(Cyc(h)-Cyc(h_prime)) in {-1,0,1}"
      exact_scope: "integer comparison of source-transition pair counts only"
      proper_time_or_duration_claimed: false
    analytic_control:
      baseline_history_tokens:
        clk_cycle_0_phase_0: "1/4"
        clk_cycle_0_phase_1: "1/2"
        clk_cycle_1_phase_0: "1/4"
      hold_history_tokens:
        clk_cycle_0_phase_0: "1"
        clk_cycle_0_phase_1: "0"
        clk_cycle_1_phase_0: "0"
      hold_minus_baseline_delta:
        clk_cycle_0_phase_0: "3/4"
        clk_cycle_0_phase_1: "-1/2"
        clk_cycle_1_phase_0: "-1/4"
      delta_sum: "0"
    error_model:
      - "bottom_D if a tick token is supplied from target proper time, frequency, metric interval, or external clock calibration"
      - "undetermined_D if the cycle word, horizon, or token map is absent"
    not_claimed:
