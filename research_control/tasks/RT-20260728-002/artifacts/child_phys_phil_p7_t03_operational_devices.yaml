fixed_basis:
  p7_t01:
    candidate_id: "SourceMatterIncidenceCandidate_v1"
    status: "proposal-only"
    configuration: "Psi=(m,z)"
    sector_map: "Sec_src(Psi)=(Q(Psi),D(Psi)) with D(Psi)=[z]"
    transition_record: "T=(Psi_minus,J,w,Pi,Psi_plus)"
    transition_conditions:
      - "q_plus-q_minus=partial_1 J"
      - "z_plus-z_minus=partial_2 w"
      - "Pi uses only declared source data"
    supplied_meaning: "finite source incidence and label bookkeeping only"
    not_supplied:
      - "persistent physical object identity"
      - "observer or measurement semantics"
      - "physical locality or spatial adjacency"
      - "physical motion or worldline semantics"
      - "target geometry or matter coupling"
  p7_t02:
    candidate_id: "SourceMatterFiniteTransitionKernelCandidate_v1"
    status: "proposal-only"
    finite_control: "C=(Omega,E,s,t)"
    bookkeeping_state: "mu in Q_nonnegative^Omega"
    update: "(U_C mu)(y)=sum_x mu(x) sum_{T in E_x:t(T)=y} K_C(T|x)"
    composition_index: "n in N_0"
    index_meaning: "formal composition count only"
    kernel_meaning: "finite rational bookkeeping coefficient only"
    supplied_consequences:
      - "finite nonnegative rational closure"
      - "row normalization"
      - "total bookkeeping-mass preservation"
      - "inherited P7-T01 sector support"
      - "transport under compatible source-presentation isomorphisms"
    not_supplied:
      - "actualized histories"
      - "physical probability, frequency, rate, or propensity"
      - "physical time, duration, or causal order"
      - "empirical preparation, intervention, or readout"
      - "physical independence, interaction, or propagation"
      - "detector calibration, geometry, or coupling"
  inherited_underdetermination_statement: >-
    Current ontology and the fixed proposal-only P7-T01 and P7-T02 candidates
    do not derive a canonical preparation protocol, intervention family,
    token alphabet, history-to-token readout, success condition, failure
    classifier, cross-device identification, empirical calibration, or
    physical interpretation.
  impossibility_claimed: false

proposed_protocol_semantic_contract:
  candidate_id: "SourceOperationalDeviceSuiteCandidate_v1"
  candidate_tuple: "D=(C,P,I,A,r,F)"
  tuple_fields:
    C:
      exact_kind: "finite proposal-only P7-T02 source control"
      semantic_limit: "not a physical apparatus or environment"
    P:
      exact_kind: "finite source-only preparation record or declared set of initial bookkeeping states"
      semantic_limit: "not laboratory preparation or physical initialization"
    I:
      exact_kind: "finite family of typed source-control replacements or source-only intervention labels"
      semantic_limit: "not a physical manipulation, force, treatment, or causal operation"
    A:
      exact_kind: "finite formal token alphabet"
      semantic_limit: "tokens have only declared source syntax"
    r:
      exact_kind: "single-valued source-only map from a declared finite-history domain to A, or to A with one explicit no-readout token"
      semantic_limit: "not an empirical observation, measurement, or semantic assignment"
    F:
      exact_kind: "typed classifier for successful execution, valid no-token execution, malformed input, underdetermined request, and cross-device inconsistency"
      semantic_limit: "not empirical falsification or physical failure"
  finite_history:
    exact_kind: "typed finite word of P7-T02 source configurations and enabled transition records"
    admissibility: "every adjacent record is enabled and its source and target match the adjacent configurations"
    blocked_readings:
      - "trajectory through spacetime"
      - "worldline"
      - "actual event sequence"
      - "causal history"
      - "experimental run"
  operational_word_guard: >-
    Operational means executable relative to explicit source syntax,
    preparation, transition, and readout rules. It does not mean physically
    realizable, empirically calibrated, observable, or measurement-bearing.

model_to_world_ladder:
  level_1_stipulated_candidate_primitives:
    items:
      - "finite history domains"
      - "source-only preparation records"
      - "source-only intervention labels and transported controls"
      - "finite formal token alphabets"
      - "single-valued readout maps"
      - "success and failure classifiers"
      - "role-name assignments Clock_src Rod_src Signal_src Detector_src and FreeFall_src"
    status_effect: "proposal-only source-extension data, not ontology derivation or adoption"
  level_2_candidate_derived_mathematics:
    licensed_if_demonstrated:
      - "finite token-response closure"
      - "exact token partition when the readout map is total and single-valued"
      - "rational intervention-difference bookkeeping"
      - "source-presentation naturality under transport of the entire protocol"
      - "finite protocol executability and declared success or failure classification"
      - "conditional cross-device compatibility under an explicit source-only comparison map"
    status_effect: "exact only inside the stipulated finite candidate"
  level_3_source_role_semantics:
    status: "formal_only"
    exact_scope: >-
      The five device names classify source protocol roles and their formal
      token grammars; this level adds no empirical referent.
  level_4_physical_or_empirical_interpretation:
    status: "open_not_supplied"
    missing_maps:
      - "tick token to clock reading or duration"
      - "endpoint or hop token to spatial length"
      - "emission and arrival tokens to causal signaling"
      - "trigger token to empirical detection or observation"
      - "unforced-baseline label to gravitational or inertial free fall"
      - "bookkeeping response to observed frequency or probability"
      - "intervention difference to physical response or coupling"
  level_5_canonical_or_protected_status:
    status: "human-gated"
    blocked_here:
      - "canonical-ontology candidate designation"
      - "source-protocol or source-law adoption"
      - "physical interpretation adoption"
      - "benchmark or derivation promotion"
  ladder_rule: >-
    A candidate-relative mathematical result or a familiar device name cannot
    move an object from formal source syntax to physical interpretation or
    protected status.

token_response_audit:
  response_id: "SourceOperationalResponseTrace_v1"
  conditional_formula: "R_D,n(a)=sum_{h in H_D,n:r(h)=a} w_n(h)"
  exact_input_meanings:
    H_D_n: "finite declared domain of length-n source histories"
    w_n: "finite rational bookkeeping weight induced from the P7-T02 candidate"
    a: "formal token in the declared finite alphabet A"
  licensed_consequences_if_well_typed:
    - "R_D,n(a) is a finite nonnegative rational number"
    - "tokens with empty preimage have response coefficient zero"
    - "a bijective relabeling of the token alphabet only relabels response coordinates"
    - "intervention differences are exact rational differences of two separately declared source protocols"
  total_partition_condition: >-
    The equality sum_a R_D,n(a)=sum_h w_n(h) is licensed only when r is total
    and single-valued on the entire weighted history domain. A partial
    readout requires either an explicit no-readout token or an inequality
    limited to the declared readout domain.
  intervention_difference:
    formula: "Delta_D,n^i(a)=R_D^i,n(a)-R_D^0,n(a)"
    exact_meaning: "candidate-relative rational comparison between declared source-control variants"
    does_not_mean:
      - "physical response coefficient"
      - "causal effect"
      - "experimental treatment effect"
      - "susceptibility"
      - "coupling strength"
      - "observed excess"
  blocked_readings:
    - "probability of token occurrence"
    - "relative frequency"
    - "detector efficiency"
    - "measurement distribution"
    - "empirical expectation"
    - "physical conservation of probability"
  zero_response_distinction: >-
    A zero formal response coefficient means that no weighted history in the
    declared domain maps to that token. It does not mean physical
    impossibility, nonoccurrence in nature, detector silence, or a null
    source configuration.

device_role_audit:
  Clock_src:
    role_status: "formal source-protocol role only"
    admissible_formal_content:
      - "a source-only preparation record"
      - "a finite history domain over the P7-T02 control"
      - "a declared cycle-completion or recurrence predicate"
      - "a tick-token readout map"
      - "a formal cycle-count or token-count comparison"
      - "malformed and underdetermined branches"
    exactly_licensed_language:
      - "the declared history emits a tick token"
      - "the source protocol has k completed formal cycles"
      - "two formal token counts or integer cycle counts agree or differ"
      - "the transported Clock_src protocol preserves its token trace up to declared token relabeling"
    blocked_meanings:
      - "physical clock"
      - "elapsed time or duration"
      - "proper time"
      - "frequency, period, rate, or temporal calibration"
      - "time standard or synchronization"
      - "worldline parameter"
      - "metric normalization"
    smuggling_risks:
      - risk_id: "PHIL-CLOCK-IMPORT-01"
        trigger: "the cycle predicate or preparation is selected using target proper time, a target metric, or desired benchmark behavior"
        disposition: "malformed_target_import"
      - risk_id: "PHIL-CLOCK-SEMANTICS-02"
        trigger: "integer cycle count is called measured duration or equal ticks are called equal physical intervals"
        disposition: "blocked_overread"
      - risk_id: "PHIL-CLOCK-INDEX-03"
        trigger: "P7-T02 composition index is renamed clock time without a separately derived interpretation map"
        disposition: "blocked_overread"
    success_language: "formal_cycle_token_executed"
    valid_no_success_language: "well_typed_history_without_declared_tick_token"
    underdetermined_when: "the cycle predicate, preparation, readout map, or comparison rule is absent"

  Rod_src:
    role_status: "formal source-protocol role only"
    admissible_formal_content:
      - "a finite ordered source-address or incidence-word declaration"
      - "distinguished formal endpoint tokens"
      - "a source-only hop-count or address-comparison readout"
      - "orientation or reversal data when explicitly declared"
      - "malformed and underdetermined branches"
    exactly_licensed_language:
      - "the declared source word has k typed links or addresses"
      - "the endpoint token pair is well typed"
      - "two declared source words have equal or unequal formal hop count"
      - "a compatible presentation transport preserves the ordered incidence word up to declared relabeling"
    blocked_meanings:
      - "physical rod"
      - "spatial length or distance"
      - "rigidity"
      - "spatial direction or orientation"
      - "local neighborhood in spacetime"
      - "metric interval"
      - "physical scale calibration"
    smuggling_risks:
      - risk_id: "PHIL-ROD-IMPORT-01"
        trigger: "link weights or word selection use target distance, a metric norm, physical units, or a desired spatial relation"
        disposition: "malformed_target_import"
      - risk_id: "PHIL-ROD-SEMANTICS-02"
        trigger: "equal hop count is called equal physical length"
        disposition: "blocked_overread"
      - risk_id: "PHIL-ROD-RIGIDITY-03"
        trigger: "preserved address word is called rigidity or shape preservation"
        disposition: "blocked_overread"
    success_language: "formal_endpoint_or_hop_token_executed"
    valid_no_success_language: "well_typed_source_word_without_requested_endpoint token"
    underdetermined_when: "ordering, endpoints, readout, or comparison rule is absent"

  Signal_src:
    role_status: "formal source-protocol role only"
    admissible_formal_content:
      - "a source-only emission-token preparation"
      - "a finite set of enabled transition words"
      - "an arrival-token predicate on declared histories"
      - "a formal first-arrival index when defined purely as least composition count"
      - "failure and no-arrival-token classifications"
    exactly_licensed_language:
      - "an emission token labels the prepared source record"
      - "an arrival token labels histories in a declared readout preimage"
      - "the least formal composition index with an arrival token is k"
      - "the response coefficient for the arrival-token class is a finite rational bookkeeping value"
    blocked_meanings:
      - "physical signal"
      - "causal influence or causal arrival"
      - "propagation speed"
      - "light cone or characteristic cone"
      - "spacelike, timelike, or null relation"
      - "transmission through physical space"
      - "communication or information transfer in nature"
    smuggling_risks:
      - risk_id: "PHIL-SIGNAL-IMPORT-01"
        trigger: "enabled history or arrival predicate is chosen using a target cone, target distance, physical travel time, or desired propagation law"
        disposition: "malformed_target_import"
      - risk_id: "PHIL-SIGNAL-CAUSALITY-02"
        trigger: "source-map and target-map orientation is treated as causal before and after"
        disposition: "blocked_overread"
      - risk_id: "PHIL-SIGNAL-SPEED-03"
        trigger: "hop count divided by formal composition count is called propagation speed"
        disposition: "blocked_overread"
    success_language: "formal_arrival_token_executed"
    valid_no_success_language: "well_typed_bounded_history_without_arrival_token"
    underdetermined_when: "emission preparation, arrival predicate, history bound, or readout map is absent"

  Detector_src:
    role_status: "formal source-token transducer role only"
    admissible_formal_content:
      - "a ready-token preparation"
      - "a source-only typed input-token alphabet"
      - "a transition or history rule producing a trigger token"
      - "a no-trigger token when total response partition is claimed"
      - "a malformed-input and missing-map classifier"
    exactly_licensed_language:
      - "the source transducer maps the declared input-token class to the trigger-token class"
      - "the trigger-token response coefficient is a finite rational bookkeeping value"
      - "the transduction map composes with another source readout only when domains and codomains match"
      - "transported source presentations preserve the transducer table up to declared token relabeling"
    blocked_meanings:
      - "empirical detector"
      - "observation or measurement"
      - "physical outcome"
      - "instrument response or efficiency"
      - "calibration"
      - "sensitivity, specificity, or noise in an empirical sense"
      - "matter detection or localization"
    smuggling_risks:
      - risk_id: "PHIL-DETECTOR-IMPORT-01"
        trigger: "trigger labels are assigned from observed data, empirical outcomes, target observables, or desired benchmark fit"
        disposition: "malformed_target_import"
      - risk_id: "PHIL-DETECTOR-SEMANTICS-02"
        trigger: "formal trigger token is called a detected event or measured outcome"
        disposition: "blocked_overread"
      - risk_id: "PHIL-DETECTOR-EFFICIENCY-03"
        trigger: "bookkeeping response is called detector efficiency or empirical likelihood"
        disposition: "blocked_overread"
      - risk_id: "PHIL-DETECTOR-COMPOSITION-04"
        trigger: "an arrival token and a trigger token are identified without an explicit typed source-only transduction map"
        disposition: "underdetermined_or_malformed_by_typing"
    success_language: "formal_trigger_token_executed"
    valid_no_success_language: "well_typed_input_history_mapped_to_explicit_no_trigger_token"
    underdetermined_when: "input alphabet, transduction map, preparation, or no-trigger convention is absent"

  FreeFall_src:
    role_status: "formal source-baseline comparison role only"
    preferred_formal_name: "UnintervenedBaseline_src"
    admissible_formal_content:
      - "a baseline source control with no member of a declared intervention family applied"
      - "one or more explicitly altered source controls"
      - "a shared formal token alphabet and comparison map"
      - "a finite intervention-difference trace"
      - "failure branches for hidden, ill-typed, or target-defined interventions"
    exactly_licensed_language:
      - "the baseline branch omits every intervention label declared in I"
      - "the baseline and altered source protocols have equal or unequal formal response traces"
      - "Delta_D,n^i(a) is zero or nonzero as a rational source-bookkeeping comparison"
      - "the comparison is invariant under transport of the whole declared source protocol"
    blocked_meanings:
      - "physical free fall"
      - "absence of physical force"
      - "inertial motion"
      - "gravitational motion"
      - "geodesic behavior"
      - "equivalence principle"
      - "universal acceleration"
      - "force-free worldline"
    smuggling_risks:
      - risk_id: "PHIL-FREEFALL-NEGATIVE-01"
        trigger: "absence from the declared intervention list is treated as absence of every physical force or coupling"
        disposition: "blocked_overread"
      - risk_id: "PHIL-FREEFALL-IMPORT-02"
        trigger: "baseline or success is defined by geodesics, target connection, target metric, acceleration, proper time, or desired GR behavior"
        disposition: "malformed_target_import"
      - risk_id: "PHIL-FREEFALL-UNIVERSALITY-03"
        trigger: "matching formal traces across two source controls is called universality of free fall"
        disposition: "blocked_overread"
    success_language: "formal_unintervened_baseline_trace_executed"
    valid_no_success_language: "well_typed_baseline_trace_without_requested_comparison token"
    underdetermined_when: "the intervention family is not exhaustive relative to the claimed source scope, or no baseline comparison map is declared"

cross_device_consistency_audit:
  exact_scope: "compatibility among formal source protocols only"
  required_checks:
    - check_id: "PHIL-CROSS-01-TYPED-COMPOSITION"
      requirement: "Every composed readout or transduction has matching declared source-token domain and codomain."
      pass_meaning: "formal composition is well typed"
      blocked_overread: "not empirical compatibility between instruments"
    - check_id: "PHIL-CROSS-02-SHARED-HISTORY"
      requirement: "Claims about the same history name an explicit shared finite history object or a source-only transport map."
      pass_meaning: "two token assignments are compared on declared common source data"
      blocked_overread: "not co-location, simultaneity, or observation of one physical event"
    - check_id: "PHIL-CROSS-03-CLOCK-SIGNAL"
      requirement: "Any comparison of tick count with arrival index remains a pair of formal integer records."
      pass_meaning: "integer relation inside the proposal-only suite"
      blocked_overread: "not travel time, signal speed, synchronization, or causal delay"
    - check_id: "PHIL-CROSS-04-ROD-SIGNAL"
      requirement: "Any comparison of hop count with arrival index records source-word combinatorics only."
      pass_meaning: "formal source-word response relation"
      blocked_overread: "not distance, speed, cone, or spacetime interval"
    - check_id: "PHIL-CROSS-05-SIGNAL-DETECTOR"
      requirement: "Arrival and trigger tokens are related only through an explicit source-only typed transduction map."
      pass_meaning: "formal token composition"
      blocked_overread: "not a signal being physically detected"
    - check_id: "PHIL-CROSS-06-BASELINE-DEVICES"
      requirement: "Baseline comparisons preserve the same declared preparation, alphabet, and readout scope except for the named source intervention."
      pass_meaning: "controlled formal comparison"
      blocked_overread: "not an experiment, causal intervention, or universality test in nature"
    - check_id: "PHIL-CROSS-07-INDEPENDENT-SYSTEMS"
      requirement: "At least two systems use separately declared finite controls or a fully declared Cartesian product with separate readout factors."
      pass_meaning: "candidate-relative protocol independence"
      blocked_overread: "not statistical independence, physical separability, or independent replication"
  inconsistency_rule: >-
    If two protocols purport to share one history and one token-identification
    map but assign incompatible token classes, the result is
    cross_device_inconsistent with the conflicting maps recorded. It is not
    empirical falsification, physical nonuniversality, or a global
    obstruction.

source_presentation_naturality_audit:
  required_transport_data:
    - "compatible P7-T01 and P7-T02 transport of configurations, transitions, and finite histories"
    - "transported preparation records"
    - "transported intervention family with a bijection of intervention labels"
    - "a bijection theta:A->A_prime of formal token alphabets"
    - "readout compatibility r_prime(h_* h)=theta(r(h))"
    - "transported success and failure classes"
  exact_candidate_consequence: >-
    Under the full transport hypotheses, token-response coordinates agree up
    to theta and the classification of valid, malformed, underdetermined,
    and inconsistent branches is preserved.
  insufficient_hypotheses:
    - "configuration transport without history-domain transport"
    - "history transport without readout compatibility"
    - "token-name similarity without an alphabet bijection"
    - "transport of the baseline but not the intervention family"
    - "an arbitrary finite truncation not closed under the declared transport"
  does_not_mean:
    - "observational equivalence"
    - "empirical indistinguishability"
    - "target-coordinate covariance"
    - "diffeomorphism invariance"
    - "physical gauge symmetry"
    - "instrument invariance"
    - "universal physical law"

branch_distinctions:
  valid_executable:
    defining_condition: "all source objects are typed and at least one declared finite history receives the requested formal token"
    exact_meaning: "the proposal-only source protocol executes on its declared finite domain"
    blocked_meanings:
      - "physical realizability"
      - "experimental success"
      - "empirical observation"
  valid_no_success_token:
    defining_condition: "the protocol is well typed but the bounded history receives an explicit no-readout, no-arrival, or no-trigger token"
    exact_meaning: "a valid negative branch inside the formal classifier"
    distinct_from:
      - "null source configuration"
      - "identity-only degenerate control"
      - "malformed input"
      - "underdetermined request"
      - "zero physical event"
  valid_null:
    defining_condition: "the underlying P7-T01 configuration is the valid null source record and the protocol is otherwise well typed"
    exact_meaning: "formal protocol over an empty source configuration"
    blocked_meanings:
      - "physical vacuum"
      - "detector dark count baseline"
      - "zero spacetime interval"
  valid_degenerate:
    defining_condition: "the underlying P7-T02 control has an identity-only row and the readout rule is well typed"
    exact_meaning: "formal identity-only history branch"
    blocked_meanings:
      - "physical rest"
      - "inertial motion"
      - "infinite duration"
      - "absence of force"
  malformed:
    symbol: "bottom_D"
    defining_condition: "typing, source-only, totality, composition, or declared-scope requirements fail"
    triggers:
      - "a history uses a transition not enabled by the fixed P7-T02 control"
      - "preparation data fall outside the declared finite source domain"
      - "a readout is multivalued where a single-valued partition is claimed"
      - "a partial readout is treated as a total partition without an explicit no-readout token"
      - "an intervention has no typed source-control action"
      - "composed token domains and codomains do not match"
      - "target geometry, proper time, physical distance, causal cone, empirical outcome, calibration, desired GR behavior, process authority, or generated derivative supplies a premise"
    exact_meaning: "fail-closed invalid candidate datum"
    blocked_meanings:
      - "physically forbidden outcome"
      - "zero physical probability"
      - "failure of every future source protocol"
  underdetermined:
    symbol: "undetermined_D"
    defining_condition: "all supplied objects are well typed but a requested preparation, intervention, readout, comparison, or interpretation rule is absent"
    examples:
      - "asking which physical duration a tick count represents"
      - "asking which spatial length a hop token represents"
      - "asking whether an arrival token is causally connected"
      - "asking which empirical outcome a trigger token represents"
      - "asking whether omission of a listed intervention means force-free motion"
    exact_meaning: "the candidate contains no rule answering the request"
    impossibility_claimed: false
  cross_device_inconsistent:
    symbol: "inconsistent_D"
    defining_condition: "declared shared history or token-identification maps yield incompatible formal assignments"
    exact_meaning: "the proposed suite fails its own declared compatibility condition"
    blocked_meanings:
      - "experimental falsification"
      - "physical violation of universality"
      - "global no-go theorem"

