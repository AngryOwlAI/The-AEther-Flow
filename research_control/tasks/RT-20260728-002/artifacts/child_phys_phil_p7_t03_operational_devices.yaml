conflict_review_input:
  blocking_conflicts_found: false
  items_parent_must_resolve_or_state:
    - conflict_id: "PHIL-CONFLICT-P7T03-01"
      issue: "Familiar device names can import their ordinary physical meanings by implication."
      required_resolution: "Define every name as a guarded formal source role and repeat the corresponding blocked interpretation at first use."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-P7T03-02"
      issue: "A total token-partition identity can be overread as probability normalization."
      required_resolution: "Call all weights bookkeeping coefficients and state the total-single-valued readout hypothesis explicitly."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-P7T03-03"
      issue: "A partial readout silently loses bookkeeping mass if no no-readout token is declared."
      required_resolution: "Either make the readout total with an explicit no-readout token or state only a restricted-domain inequality."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-P7T03-04"
      issue: "Clock cycle count and signal arrival index can be combined into apparent duration or speed."
      required_resolution: "Keep both as formal integer records and prohibit physical ratios without a separately derived interpretation map."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-P7T03-05"
      issue: "Rod hop count can be mistaken for spatial length or metric distance."
      required_resolution: "Use source-address or incidence-word language and prohibit physical units and target metric inputs."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-P7T03-06"
      issue: "Signal arrival and detector trigger may be identified by shared English meaning rather than a typed source map."
      required_resolution: "Require an explicit source-only token transduction with matching domain and codomain."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-P7T03-07"
      issue: "No declared intervention can be overread as no physical force."
      required_resolution: "Use unintervened baseline language and state that the intervention list is candidate-relative and not physically exhaustive."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-P7T03-08"
      issue: "Matching formal traces across devices or sectors can be called physical universality."
      required_resolution: "Limit the conclusion to formal source-token compatibility and leave physical universality open."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-P7T03-09"
      issue: "Presentation naturality can be asserted while omitting transport of preparations, interventions, alphabets, or failure classes."
      required_resolution: "Quantify over transport of the entire protocol tuple and an explicit token-alphabet bijection."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-P7T03-10"
      issue: "A validator or successful checkpoint can be mistaken for scientific confirmation of the device semantics."
      required_resolution: "Keep process receipts operational only and exclude them from every scientific premise."
      blocking_if_unresolved: true

