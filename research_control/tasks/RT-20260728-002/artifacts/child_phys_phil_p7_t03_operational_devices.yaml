  Which exact formal source-token statements may
  SourceOperationalDeviceSuiteCandidate_v1 support for the role names
  Clock_src, Rod_src, Signal_src, Detector_src, and FreeFall_src, and which
  physical, empirical, geometric, ontological, or downstream statements
  remain blocked when the suite adds finite source-only preparation,
  intervention, history, readout, and failure data to the fixed proposal-only
  P7-T01 and P7-T02 candidates?

