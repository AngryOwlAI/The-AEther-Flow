  total_readout_guard: >-
    Any token-mass equality must state that the history domain is finite and
    the readout is total and single-valued, including an explicit
    no-readout token when needed.
  theorem_scope_guard: >-
    Every exact result must quantify over the declared finite protocol,
    source-only preparations and interventions, typed history domain, and
    full presentation transport. No result may infer physical realization,
    empirical interpretation, ontology adoption, or downstream authority.
  witness_scope_guard: >-
    Device witnesses are finite source-word and token-table constructions,
    not apparatuses, experiments, trajectories, worldlines, signals,
    measurements, rods, clocks, or free-fall systems in nature.

