no_target_no_process_guard:
  declaration_closure: "Every nonlogical symbol has a complete type before use is generated by an explicit least grammar or is locally quantified."
  acyclicity: "Every definition tree is finite and every dependency edge points from a lower rank to a higher rank."
  transitive_exclusion: "For every source symbol s the transitive dependency closure of s is disjoint from target and workflow classes."
  semantic_factorization: "Holding all declared source leaves fixed while varying target or workflow state leaves every source interpretation certificate decision Accept_src value and candidate-law truth value unchanged."
  provenance_closure: "Aliases lookup tables hashes learned parameters opaque oracles proxy labels base provenance tokens congruence classes and negative controls are classified by transitive provenance rather than source-looking names."
  no_backward_authority: "Accept_src cannot depend on law satisfaction audit PASS candidate status adoption validator output benchmark match or Distance-to-GR state."
  fail_closed: "A missing type declaration rank or source-only provenance blocks the candidate instance; target and process evidence cannot repair it."

