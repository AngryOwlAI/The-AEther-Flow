  ledger_family:
    carrier: "Lambda(A,B)"
    identity: "e_A in Lambda(A,A)"
    inverse: "dagger_Lambda(A,B): Lambda(A,B) -> Lambda(B,A)"
    composition: "odot_Lambda(A,B,C): Lambda(B,C) x Lambda(A,B) -> Lambda(A,C)"
    congruence: "equiv_Lambda(A,B) subseteq Lambda(A,B)^2"
    decision: "L(A,B): Lambda(A,B) -> B"
  proxy_family:
    carrier: "P(A,B)"
    identity: "iota_A in P(A,A)"
    inverse: "jmath(A,B): P(A,B) -> P(B,A)"
    composition: "mu(A,B,C): P(B,C) x P(A,B) -> P(A,C)"
    congruence: "equiv_P(A,B) subseteq P(A,B)^2"
    decision: "PCheck(A,B): P(A,B) -> B"
