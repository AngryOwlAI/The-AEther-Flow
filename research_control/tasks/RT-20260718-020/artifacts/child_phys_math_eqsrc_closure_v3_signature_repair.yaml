  inverse: "For every accepted w:A->B Accept(Inv(w))=Pass."
  composition: "For every accepted w:A->B and v:B->C Accept(Comp(v,w))=Pass."
  distinction: "Total raw functions supply distinguished typed witnesses; the three acceptance clauses remain substantive candidate-law axioms."

