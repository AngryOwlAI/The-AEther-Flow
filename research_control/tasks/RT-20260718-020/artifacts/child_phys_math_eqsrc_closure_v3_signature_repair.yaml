  raw_certificate:
    type: "Cert(A,B)=Lambda(A,B) x P(A,B) x Pi(A,B)"
    endpoints: "indices rather than freely duplicated tuple data"
  certificate_congruence:
    type: "equiv_Cert(A,B) subseteq Cert(A,B)^2"
    definition: "componentwise ledger proxy and provenance congruence"
  negative_controls:
    outcome_type: "O_n with declared equivalence equiv_n and saturated pass set O_n^Pass"
    evaluator: "delta(n,A,B): Cert(A,B) -> O_n"
    predicate: "NegPass(n,A,B,w) iff delta(n,A,B,w) lies in O_n^Pass"
    invariance: "w equiv_Cert w_prime implies delta(n,A,B,w) equiv_n delta(n,A,B,w_prime)"
  raw_certificate_operations:
    identity: "1_A=(e_A,iota_A,id[A])"
    inverse: "Inv(lambda,p,pi)=(lambda^dagger,jmath(p),inv[pi])"
    composition: "Comp((mu,q,rho),(lambda,p,pi))=(mu odot lambda,mu_P(q,p),comp[rho,pi])"
  acceptance:
    type: "Accept(A,B): Cert(A,B) -> B"
    definition: "finite conjunction of ledger pass proxy pass and every negative-control pass"
    provenance_membership: "formation judgment built into the certificate fiber"

