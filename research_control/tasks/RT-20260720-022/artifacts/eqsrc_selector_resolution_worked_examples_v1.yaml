        source_provenance: "finite symmetry control"
        baseline_derivation_status: "not a source probability law derived by current ontology"
        symmetry_effect: "preserves the full C3 action"
        target_dependence_check: "uniform weights follow from declared transitivity and normalization, not a preferred outcome"
        necessity_or_minimality_status: "unique among C3-invariant probability laws on this finite control"
        reversibility_or_reopening_condition: "change the action, measurable target, or measure principle"
    status_axes:
      definition_status: "explicit finite probability control"
      existence_status: "proved"
      uniqueness_status: "unique law; sampled point nonunique"
      naturality_status: "C3-invariant on the declared control"
