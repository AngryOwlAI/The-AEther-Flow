agent_job_id: "AJ-RT-20260720-022-001"
plan_task_id: "P3-T01"
target_derivation_milestone: "source_equivalence_eqsrc"
status: "completed"
claim_status: "draft/control"
adoption_status: "blocked_adoption_open_continuation"
result_scope: "proposal-only classification guidance for the fixed P2 selector-theorem burden"

question:
  statement: "What would each of the five lawful selector-resolution classes establish, and what further evidence would be required before that formal result could support ontology, physical, empirical, or adoption claims?"
  answer_summary: >-
    Each class identifies a distinct conditional response to a deterministic
    natural point-selector burden. A class label establishes only that its
    declared evidence predicates have been met on a declared model and scope.
    It does not by itself establish current-ontology derivation, physical-gauge
    meaning, empirical adequacy, source-law adoption, general EqSrc discharge,
    exact-GR derivation, or benchmark promotion.

source_basis:
  - path: "ontology/tex/aether_flow_foundations.tex"
    authority: "canonical ontology and exact-closure claim boundary"
    use: "separates adopted exact-GR closure from open first-principles substrate derivation"
  - path: "research_control/tasks/RT-20260720-016/artifacts/eqsrc_no_selector_nonuniqueness_theorem_v1.tex"
    authority: "registered proposal-only theorem artifact"
    use: "fixes the deterministic total point-valued selector problem and its fixed-domain scope"
  - path: "research_control/tasks/RT-20260720-016/artifacts/eqsrc_no_selector_nonuniqueness_assumptions.yaml"
    authority: "task-local assumption ledger"
    use: "fixes proposal inputs, selector codomain, structural-versus-physical boundary, and domain-integrity guards"
  - path: "research_control/tasks/RT-20260720-019/artifacts/eqsrc_selector_theorem_smuggling_audit_v1.tex"
    authority: "task-local source-purity audit"
    use: "preserves target-neutrality and explicit provenance burdens"
  - path: "research_control/tasks/RT-20260720-020/artifacts/eqsrc_selector_theorem_stress_cases.json"
    authority: "task-local refuter stress evidence"
    use: "separates deterministic point obstruction from probabilistic, marked, partial, and altered-domain cases"
  - path: "research_control/tasks/RT-20260720-021/artifacts/eqsrc_selector_theorem_external_red_team_review_v1.yaml"
    authority: "internal blinded review synthesis, not external replication"
    use: "confirms conditional scope and records remaining semantic pressure points"
  - path: "research_control/design/gr_derivation_burden_map.md"
    authority: "research-control burden map"
    use: "preserves Distance-to-GR and source-extension governance boundaries"

claim_layers:
  ontology:
    question: "What entities, structures, or laws belong to the fundamental source description, and are they derived, proposed, or adopted?"
    pass_condition: "Every new object or law has explicit provenance and an authorized status; supplied structure is not relabeled as ontology-derived."
  model:
    question: "What formal objects, maps, dynamics, measures, quotients, or proof assumptions make the resolution mathematically valid?"
    pass_condition: "The resolution is typed, scoped, and proved or witnessed on its declared domain."
  physical:
    question: "Why should the formal objects represent physical states, gauge redundancy, dynamics, chance, or admissible source distinctions?"
    pass_condition: "A source-side physical interpretation and its invariance, state, or mechanism conditions are independently justified."
  empirical:
    question: "What observables or probability distributions follow, and what measurements could discriminate or constrain the route?"
    pass_condition: "An explicit observable bridge and empirical adequacy or test condition are supplied; exact-GR benchmark behavior remains intact where required."
  authority:
    question: "What project status may the evidence lawfully confer?"
    pass_condition: "The result remains inside the exact tracked authority; validators and role labels are operational receipts rather than scientific or adoption authority."

global_boundaries:
  current_ontology_statement: >-
    The canonical ontology fixes the AEther and AEther-flow framework and the
    exact-closure benchmark, but it does not currently derive or adopt the P2
    source category, eligible-choice functor, structural variation class,
    selector interface, relation map, added selector data, source dynamics,
    or probability law used by these classes.
  exact_gr_statement: >-
    Exact GR is the adopted operational benchmark of the exact-closure theory;
    no selector-resolution class supplies a first-principles derivation of that
    benchmark from substrate variables.
  structural_symmetry_statement: >-
    Automorphisms in the proposal category are structural symmetries only.
    They are not physical gauge transformations, physical redundancies, or
    empirically invisible transformations without separate evidence.
  theorem_scope_statement: >-
    The fixed P2 theorem concerns deterministic, total, point-valued natural
    selectors on a fixed declared domain. Changing the codomain, source
    signature, variation class, dynamics, or probability semantics changes the
    problem rather than refuting the theorem.
  authority_statement: >-
    A successful classification authorizes at most the next bounded route.
    It does not authorize ontology modification, source-law adoption, physical
    gauge establishment, general EqSrc discharge, publication, Gate Chair
    verdict, benchmark promotion, or completed-derivation language.

classification_policy:
  primary_class_requirement: "Exactly one primary class is required for a terminal classification record."
  supporting_classes: >-
    Zero or more supporting classes may record auxiliary apparatus, but each
    must include an overlap rationale and its own assumption and provenance
    costs. A supporting label never inherits the primary class's evidence.
  operative_resolution_rule: >-
    The primary class names what actually resolves the selected burden, not
    merely every formal ingredient present in the construction.
  decision_order:
    - order: 1
      primary_class: "representative_irrelevance"
      condition: "The downstream quantity or complete declared observable content is proved independent of representative choice, so no representative need be selected."
    - order: 2
      primary_class: "probabilistic_selection"
      condition: "The resolved output is a probability object or stochastic rule rather than a deterministic selected point."
    - order: 3
      primary_class: "dynamical_symmetry_breaking"
      condition: "A state or trajectory is selected by declared source dynamics plus declared state, initial, or boundary data."
    - order: 4
      primary_class: "added_source_structure"
      condition: "Static target-neutral source-side data make a lawful point selector available and neither irrelevance, probability, nor dynamics is the operative resolution."
    - order: 5
      primary_class: "scoped_obstruction"
      condition: "A theorem or countermodel blocks the declared resolution within an exact scope and no positive class is evidenced there."
  ambiguity_rule: "If more than one primary condition remains live, classification fails closed pending an explicit operative-resolution and overlap analysis."
  unclassified_rule: "An outcome with no evidenced primary class is invalid; use blocked or repair-required status rather than inventing a sixth class."
  adoption_rule: "No primary or supporting class implies adoption by label alone."

classes:
  - class_id: "added_source_structure"
    label: "added source structure"
    resolution_claim: >-
      A deterministic selector becomes natural only after a declared,
      target-neutral extension of the source description supplies additional
      selector-relevant structure.
    ontology_layer:
      permitted_claim: >-
        The added datum is source-extension data with explicit provenance and
        a declared relation to the unextended source model.
      not_established:
        - "that the datum is derived from the current ontology"
        - "that the datum is fundamental, unique, necessary, or adopted"
        - "that a mark which names the answer explains rather than relocates the choice"
    model_layer:
      required_objects:
        - "an extended source domain and a forgetful or reduction map to the frozen base domain"
        - "a target-neutral selector on the extended domain"
        - "proof that the selector is natural under the extension's independently declared variations"
        - "a comparison showing exactly which base symmetry or nonuniqueness is changed"
      success_meaning: "The extended formal problem has a lawful point selector; the base problem remains unchanged."
    physical_layer:
      required_evidence:
        - "an independent reason that the added datum represents physical source structure rather than bookkeeping"
        - "a justification of which transformations preserve the datum and why those transformations are physically admissible"
        - "a mechanism or interpretation connecting the datum to the selected physical state, if such a claim is made"
      not_established: "Physical salience does not follow from formal selector success."
    empirical_layer:
      required_evidence:
        - "an observable bridge for the added datum"
        - "compatibility with exact-GR benchmark behavior in the applicable regime"
        - "a discriminating prediction or a justified explanation of empirical underdetermination"
      not_established: "No new empirical signature or adequacy follows from adding a formal mark."
    authority_layer:
      current_status: "proposal-only source-extension data"
      lawful_next_routes:
        - "source-extension smuggling audit"
        - "minimality and provenance comparison"
        - "refuter stress"
        - "human-gated ontology review only after the planned evidence chain"
      blocked_statuses_without_human_gate:
        - "canonical-ontology candidate"
        - "adopted"
        - "rejected"
    assumption_and_provenance_costs:
      - "new carrier, mark, orientation, order, field, boundary datum, or equivalent primitive"
      - "choice of extension morphisms and revised automorphism group"
      - "forgetful/reduction semantics and proof of conservativity where claimed"
      - "minimality relative to weaker source extensions"
      - "independent no-target-import provenance"
    invalid_promotional_language:
      - "The ontology selects the representative."
      - "The preferred mark is derived because it restores uniqueness."
      - "A source-pure construction is therefore adopted physical structure."
      - "The extension completes EqSrc or the GR derivation."
    advance_or_reopen_evidence:
      - "construct a source-only extension with a typed natural selector and explicit reduction to the base domain"
      - "show the datum was not selected post hoc from target metric, benchmark, validator, or desired-answer information"
      - "compare weaker extensions and cost the residual arbitrariness"
      - "supply physical and empirical bridges separately if claims at those layers are sought"
    overlap_semantics:
      - "Use as supporting for dynamical symmetry breaking when the dynamics require genuinely added source-side structure."
      - "Use as supporting for probabilistic selection when a measure or kernel is supplied rather than derived."
      - "Do not use as primary when the only new object is an observable quotient that proves representatives irrelevant."

  - class_id: "representative_irrelevance"
    label: "representative irrelevance"
    resolution_claim: >-
      The task is discharged without selecting a representative because the
      complete declared downstream quantity or observable content is proved
      independent of every admissible representative choice.
    ontology_layer:
      permitted_claim: "Representative multiplicity may remain in the model while a named downstream object factors through the declared equivalence relation."
      not_established:
        - "that representatives are unreal or ontologically identical"
        - "that the structural equivalence is physical gauge"
        - "that every possible observable is representative-independent"
    model_layer:
      required_objects:
        - "a declared equivalence relation, quotient, orbit object, or complete comparison family"
        - "a downstream map that is constant on every declared equivalence class"
        - "a factorization through the quotient, or an equivalent all-choice observable-independence theorem"
        - "domain-wide checks including any noninvertible variations required by the application"
      success_meaning: "No representative is required for the named downstream task."
      known_boundary: "A singleton selector-induced K-image is not a proof that all E-sections are unique unless surjectivity and the relevant completeness conditions are also established."
    physical_layer:
      required_evidence:
        - "a physical account of why the equivalence relation identifies redundant descriptions"
        - "a demonstrated observable algebra or state equivalence adequate to the claimed physical scope"
        - "compatibility with dynamics, coupling, and admissibility rather than kinematic invariance alone"
      not_established: "Structural naturality or factorization alone does not establish physical gauge."
    empirical_layer:
      required_evidence:
        - "representative independence for the complete declared empirical interface"
        - "an argument that omitted observables cannot recover the representative within the claim scope"
        - "exact-GR benchmark compatibility where the interface reaches relativistic observables"
      not_established: "Independence of one relation map is not universal empirical indistinguishability."
    authority_layer:
      current_status: "conditional proposal-only irrelevance route"
      lawful_next_routes:
        - "factorization and observable-completeness proof"
        - "physical-gauge equivalence audit"
        - "robustness under domain or dynamics extension"
      blocked_readings:
        - "gauge established by terminology"
        - "ontology quotient adopted"
        - "general EqSrc discharged"
    assumption_and_provenance_costs:
      - "choice and provenance of equivalence relation or quotient"
      - "choice and claimed completeness of observable or downstream map"
      - "factorization, surjectivity, or separation assumptions needed by the exact claim"
      - "stability under the full declared variation and dynamics domain"
      - "physical interpretation of redundancy if gauge language is used"
    invalid_promotional_language:
      - "The representatives are gauge because automorphisms permute them."
      - "A unique K-image proves a unique physical relation."
      - "No observable can depend on the choice"
      - "Quotienting establishes physical equivalence and completes EqSrc."
    advance_or_reopen_evidence:
      - "prove explicit quotient factorization or all-choice independence for the named downstream object"
      - "prove the declared observable set is adequate to the physical or empirical claim being made"
      - "test the factorization under noninvertible variations, dynamics, and source extensions relevant to the application"
      - "supply a separate physical-gauge argument before using gauge terminology"
    overlap_semantics:
      - "Primary over all other classes when the burden disappears because no representative is needed."
      - "Added structure may be supporting only if a new quotient or observable interface is itself introduced and costed."
      - "Probabilistic agreement of distributions counts here only if the operative claim is distribution-level observable irrelevance, not selection of a random outcome."

  - class_id: "dynamical_symmetry_breaking"
    label: "dynamical symmetry breaking"
    resolution_claim: >-
      A declared source dynamics, together with declared state, initial, or
      boundary data, yields a branch, state, or trajectory even though the
      underlying laws retain a relevant symmetry.
    ontology_layer:
      permitted_claim: "A proposal dynamics and state-data package can be studied as a candidate selection mechanism."
      not_established:
        - "that the current ontology derives the dynamics, state space, time parameter, or initial data"
        - "that a chosen branch is fundamental rather than contingent"
        - "that explicit asymmetry in the dynamics is spontaneous symmetry breaking"
    model_layer:
      required_objects:
        - "a state space and a typed evolution law or variational principle"
        - "a declared symmetry action and proof of whether the law is equivariant"
        - "initial, boundary, perturbation, or environmental data sufficient for the claimed branch result"
        - "existence, uniqueness or multiplicity, stability, basin, and finite-variation analysis appropriate to the claim"
        - "a map from the evolved branch to the selector-relevant output"
      success_meaning: "The formal evolution mechanism yields the stated branch under its explicit data and validity regime."
    physical_layer:
      required_evidence:
        - "a physical interpretation of state, evolution parameter, dynamics, and admissible perturbations"
        - "a distinction among spontaneous, explicit, boundary-induced, and noise-induced breaking"
        - "a reason the branch-selection mechanism is source-side rather than imported from the target solution"
      not_established: "A toy double-well or symmetry-breaking trajectory is not a current-ontology derivation."
    empirical_layer:
      required_evidence:
        - "branch-dependent observables or a justified claim that branches are empirically equivalent"
        - "robust predictions across admissible initial or boundary data"
        - "recovery of exact-GR benchmark behavior and absence of forbidden preferred-frame signatures where required"
      not_established: "A stable branch in a toy model supplies no empirical evidence by itself."
    authority_layer:
      current_status: "proposal-only dynamical mechanism class"
      lawful_next_routes:
        - "source-dynamics construction"
        - "well-posedness, stability, and target-import audit"
        - "physical and empirical interpretation packets"
      blocked_readings:
        - "dynamics adopted"
        - "physical spontaneous symmetry breaking established"
        - "unique source history or GR branch derived"
    assumption_and_provenance_costs:
      - "state space and evolution parameter"
      - "dynamical law, action, generator, or transition rule"
      - "initial and boundary conditions, environment, perturbations, or noise"
      - "stability and branch-selection criteria"
      - "physical interpretation and no-target-import provenance"
    invalid_promotional_language:
      - "Symmetry breaking selects the answer"
      - "The dynamics are source-derived because they preserve the structural group."
      - "One simulated trajectory proves a unique physical branch."
      - "A stable branch derives the effective metric or Einstein equations."
    advance_or_reopen_evidence:
      - "derive or explicitly propose source-side dynamics with an independently fixed state space and symmetry action"
      - "prove the exact branch result, validity regime, stability, and dependence on initial or boundary data"
      - "separate spontaneous from explicit or boundary-imposed asymmetry"
      - "show the mechanism's relativistic observables remain compatible with the exact-GR benchmark"
    overlap_semantics:
      - "Primary when evolution is the operative mechanism selecting a state or trajectory; added source structure is supporting when the dynamics introduce new primitives."
      - "Probabilistic selection is primary when the terminal result is only a distribution or stochastic kernel; dynamical symmetry breaking may support a realized-branch account if separately modeled."
      - "Representative irrelevance is primary if all evolved branches give the same complete downstream content and no branch selection is required."

  - class_id: "probabilistic_selection"
    label: "probabilistic selection"
    resolution_claim: >-
      A natural probability object or stochastic transition rule is supplied or
      derived on the declared domain, replacing deterministic point selection
      with distribution-valued or stochastic output.
    ontology_layer:
      permitted_claim: "A probability law can be introduced as proposal data or conditionally derived from separately declared source structure."
      not_established:
        - "that probability is ontic rather than epistemic"
        - "that a prior, measure, or kernel is derived by symmetry alone"
        - "that an invariant distribution selects one representative"
    model_layer:
      required_objects:
        - "measurable or finite probability spaces and a precisely typed probability functor or Markov kernel"
        - "normalization, positivity, measurability, and naturality or equivariance proofs"
        - "existence and, if claimed, uniqueness or ergodicity of the distribution"
        - "sampling or realized-outcome semantics when a point outcome is later used"
        - "a clear distinction between invariant measure, stochastic transition, and deterministic selector"
      success_meaning: "The model yields a lawful distribution or stochastic rule; it does not thereby yield a canonical point."
      theorem_relation: "An invariant distribution on a transitive orbit is compatible with an empty deterministic fixed-point locus and therefore changes the codomain rather than refuting P2."
    physical_layer:
      required_evidence:
        - "an interpretation of probability as objective chance, typicality, ignorance, or effective coarse graining"
        - "a physical source for randomness or measure selection"
        - "a model of actual outcomes if the physical claim concerns realized branches"
      not_established: "Randomness does not by itself break symmetry or explain why a specific outcome occurred."
    empirical_layer:
      required_evidence:
        - "a map from distributions to frequency or likelihood predictions"
        - "identifiability and calibration against an explicitly declared empirical interface"
        - "exact-GR benchmark recovery for the predicted observable distribution where applicable"
      not_established: "A normalized invariant distribution alone is not an empirical prediction."
    authority_layer:
      current_status: "proposal-only altered-codomain route"
      lawful_next_routes:
        - "probability-functor or kernel construction"
        - "measure-provenance and stochastic-semantics audit"
        - "dynamics, calibration, and empirical-interface stress"
      blocked_readings:
        - "deterministic theorem refuted"
        - "probability law adopted"
        - "unique representative or physical branch selected"
    assumption_and_provenance_costs:
      - "sigma algebra or finite measurable structure"
      - "measure, prior, kernel, or transition probabilities"
      - "normalization, naturality, stationarity, ergodicity, or regularity assumptions"
      - "sampling and probability-interpretation semantics"
      - "empirical calibration and no-target-import provenance"
    invalid_promotional_language:
      - "The uniform distribution selects a canonical representative."
      - "Randomness breaks the symmetry and therefore solves deterministic selection."
      - "Symmetry uniquely derives the physical probability law."
      - "A stochastic route completes EqSrc or the GR derivation."
    advance_or_reopen_evidence:
      - "define the probability-valued functor or kernel and prove every typing, normalization, and naturality condition"
      - "state whether the measure is supplied, maximum-entropy, dynamically stationary, or otherwise derived, with exact provenance"
      - "provide realized-outcome semantics if a point choice is subsequently claimed"
      - "connect the distribution to calibrated observables without importing target-GR answers"
    overlap_semantics:
      - "Primary when the terminal resolved object is a distribution or stochastic rule."
      - "Added source structure is supporting when the measure or kernel is a supplied primitive."
      - "Dynamical symmetry breaking is supporting only when a separately defined stochastic dynamics realizes branches; do not collapse ensemble and realized-state claims."
      - "Representative irrelevance is primary if only distribution-level observables matter and all representative choices are proved irrelevant."

  - class_id: "scoped_obstruction"
    label: "scoped obstruction"
    resolution_claim: >-
      A theorem, exhaustive finite classification, or countermodel shows that a
      declared selector mechanism cannot meet its declared burden within an
      exact frozen scope.
    ontology_layer:
      permitted_claim: "The current declared ontology-plus-proposal package does not derive the blocked object under the theorem's assumptions."
      not_established:
        - "that the ontology is globally inconsistent or false"
        - "that no conservative source extension can succeed"
        - "that all future dynamics, quotients, or probabilistic routes are impossible"
    model_layer:
      required_objects:
        - "an exact domain, signature, selector codomain, variation class, and success predicate"
        - "a proof, exhaustive search with completeness argument, or decisive countermodel"
        - "a list of mechanisms actually tested and assumptions held fixed"
        - "reopening criteria identifying which assumption or domain change escapes the result"
      success_meaning: "The named mechanism is blocked only in the stated scope."
    physical_layer:
      required_evidence:
        - "an independently justified mapping from the formal scope to the intended physical source domain"
        - "a demonstration that the blocked mathematical mechanism was physically required"
      not_established: "A structural obstruction has no automatic physical-gauge, admissibility, or theory-rejection meaning."
    empirical_layer:
      required_evidence:
        - "an empirical bridge showing what observation would follow from the obstruction"
        - "comparison with alternative models that remain open"
      not_established: "A no-selector theorem is not an observed failure of the exact-GR benchmark."
    authority_layer:
      current_status: "scoped proposal-only negative result with open continuation"
      lawful_next_routes:
        - "freeze exact repeated families within the proven scope"
        - "pursue a named reopening criterion through another lawful class"
        - "record a human gate only if protected ontology authority is genuinely required"
      mandatory_language: "blocked_adoption_open_continuation"
      blocked_readings:
        - "global no-go"
        - "future source-extension impossibility"
        - "global theory rejection"
        - "benchmark failure or derivation completion"
    assumption_and_provenance_costs:
      - "exact scope and completeness burden"
      - "proof or countermodel authority and reproducibility"
      - "frozen-domain integrity"
      - "explicit distinction between tested and untested mechanisms"
      - "precise reopening criteria"
    invalid_promotional_language:
      - "Selection is impossible."
      - "The ontology cannot derive EqSrc under any extension."
      - "The theorem falsifies the AEther-flow interpretation."
      - "The obstruction proves that only a target-GR import could work."
    advance_or_reopen_evidence:
      - "weaken or replace a named assumption and show that the changed premise is independently source-motivated"
      - "add target-neutral source structure and re-run the selector and smuggling burdens"
      - "prove representative irrelevance through a quotient or observable factorization"
      - "define source dynamics or a probability-valued codomain and treat it as a changed problem"
      - "broaden the theorem only with a new proof and a correspondingly broader exact scope"
    overlap_semantics:
      - "Use as primary only when a negative theorem or countermodel is the terminal result in the frozen scope."
      - "Potential positive classes are reopening routes, not supporting evidence for the obstruction."
      - "A scoped obstruction may freeze one family while leaving other classes and same-milestone continuation open."

assumption_ledger_requirements:
  required_fields:
    - "assumption_id"
    - "assumption_type"
    - "statement"
    - "provenance"
    - "derived_or_supplied"
    - "target_neutrality_status"
    - "class_usage"
    - "necessity_or_minimality_status"
    - "physical_interpretation_status"
    - "empirical_bridge_status"
    - "authority_status"
    - "consequence_if_removed"
  allowed_assumption_types:
    - "source_extension_data"
    - "domain_or_variation_choice"
    - "equivalence_or_quotient"
    - "observable_map_or_completeness"
    - "dynamics_or_action"
    - "state_initial_or_boundary_data"
    - "probability_measure_or_kernel"
    - "logical_or_set_theoretic"
    - "physical_interpretation"
    - "empirical_bridge"
  fail_closed_conditions:
    - "a supplied assumption is described as ontology-derived without a derivation and authority record"
    - "a target metric, benchmark answer, validator result, registry order, or desired output is used as source premise"
    - "an assumption cost is omitted because the same object appears in a supporting class"
    - "a class change is implemented by post hoc domain engineering without independent source motivation"

status_vocabulary:
  recognized_terms:
    - "draft/control"
    - "proposal-only"
    - "source-extension data"
    - "canonical-ontology candidate"
    - "adopted"
    - "rejected"
    - "human-gated"
  current_packet_may_assign:
    - "draft/control"
    - "proposal-only"
    - "source-extension data"
  current_packet_may_not_assign_without_protected_authority:
    - "canonical-ontology candidate"
    - "adopted"
    - "rejected"
    - "human-gated ontology decision completed"

cross_class_failure_modes:
  - failure_id: "CF-001"
    condition: "A class label is used in place of its evidence predicates."
    disposition: "invalid_unclassified"
  - failure_id: "CF-002"
    condition: "Representative irrelevance is asserted from structural automorphism language without factorization or observable-independence proof."
    disposition: "blocked"
  - failure_id: "CF-003"
    condition: "Dynamical symmetry breaking is asserted without explicit dynamics, state data, and branch analysis."
    disposition: "blocked"
  - failure_id: "CF-004"
    condition: "Probabilistic selection is asserted without a typed normalized measure or kernel and declared sampling semantics."
    disposition: "blocked"
  - failure_id: "CF-005"
    condition: "Added source structure is hidden inside eligibility, arrows, observables, dynamics, or priors without provenance and cost."
    disposition: "blocked_as_hidden_extension"
  - failure_id: "CF-006"
    condition: "A scoped obstruction is generalized beyond its theorem domain or used to claim future source-extension impossibility."
    disposition: "overclaim_rejected"
  - failure_id: "CF-007"
    condition: "An overlap record omits the operative resolution or tries to assign multiple primary classes."
    disposition: "invalid_ambiguous"

shared_forbidden_conclusions:
  - "current ontology derives or adopts the P2 proposal category or any P3 resolution apparatus"
  - "structural automorphisms are established physical gauge transformations"
  - "a class label establishes physical admissibility, covariance, or empirical adequacy"
  - "general EqSrc is discharged"
  - "M_src, g_eff, matter coupling, or Einstein equations are derived"
  - "the exact-GR benchmark is promoted, refuted, or derived from source structure"
  - "a Gate Chair verdict, publication authority, external replication, or human endorsement exists"
  - "future source extensions are impossible"
  - "the AEther-flow ontology or full research program is globally rejected"

advance_matrix:
  added_source_structure: "Construct, cost, audit, and stress a minimal target-neutral extension before any protected ontology review."
  representative_irrelevance: "Prove quotient factorization or complete declared observable independence, then audit physical-gauge and empirical scope separately."
  dynamical_symmetry_breaking: "Supply source-side dynamics, state data, well-posedness, branch stability, and benchmark-compatible physical interpretation."
  probabilistic_selection: "Supply a typed natural measure or kernel, provenance, stochastic semantics, and calibrated observable bridge."
  scoped_obstruction: "Preserve the exact theorem scope and pursue only a named reopening criterion or a strictly broader proof."

child_conclusions:
  primary: >-
    The five classes are philosophically and scientifically distinct only when
    the operative resolution, added assumptions, claim layer, and authority
    status are all explicit. Their names are not evidentiary shortcuts.
  overlap: >-
    Mixed constructions are expected. Exactly one primary class should name
    the operative terminal resolution, while supporting classes expose rather
    than conceal auxiliary source, dynamics, probability, or quotient costs.
  current_project_status: >-
    The P2 deterministic selector theorem remains proposal-only and scoped.
    P3-T01 may normalize routes from that result, but it does not adopt a route,
    alter canonical ontology, change Distance-to-GR, or confer physics promotion.

