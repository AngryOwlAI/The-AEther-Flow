declared_mathematical_universe:
  frozen_problem_record: "B = (G, S, E, K, V, T), where G is the declared source-variation groupoid, S:G->Set is the eligible-choice functor, E:G->Set is the downstream-output functor when present, K:S=>E is the declared readout, V records the admitted variation scope, and T states the success target."
  deterministic_selector_space: "Sel(B) = Nat(1_G,S)."
  deterministic_output_map: "K_*:Sel(B)->Nat(1_G,E), with K_*(sigma)=K composed with sigma."
  probability_extension: "Delta S is the declared probability-measure functor obtained from S only after its measurable or finite-set semantics have been supplied."
  evidence_domain: "Every classification is relative to an explicitly hashed B and to an explicit target T; changing any component creates a new evaluation domain."
  target_types:
    - "deterministic_point"
    - "deterministic_downstream_output"
    - "quotient_or_observable"
    - "dynamically_realized_branch"
    - "probability_law_or_distributional_output"
    - "scoped_route_disposition"

global_classification_invariants:
  exact_class_set:
    - "added_source_structure"
    - "representative_irrelevance"
    - "dynamical_symmetry_breaking"
    - "probabilistic_selection"
    - "scoped_obstruction"
  class_count: 5
  primary_cardinality: "A valid resolved record has exactly one primary class. An unresolved or invalid record has no primary class, never a guessed class."
  supporting_cardinality: "Zero or more evidence-complete supporting classes may be recorded, but they do not replace or weaken the primary burden."
  domain_parity: "All predicates in one classification must be evaluated on the same declared problem record B unless an extension or reduct map is explicitly part of the evidence."
  no_label_only_resolution: "A class name is not evidence; every required predicate must be discharged or the class evaluates false."
  no_authority_upgrade: "Mathematical satisfaction of a class predicate supplies a route classification only, not ontology adoption, physical admissibility, gauge status, benchmark recovery, or publication authority."
  no_globalization: "A counterexample or obstruction may be generalized only to the exact quantified family proved."

assumption_cost_schema:
  policy: "Record a vector with evidence; do not collapse unlike assumptions to one scalar score."
  required_fields:
    source_signature_delta:
      allowed_values:
        - "none"
        - "conservative_definitional_extension"
        - "new_source_primitive"
        - "protected_ontology_change"
    selector_or_readout_law_delta:
      allowed_values:
