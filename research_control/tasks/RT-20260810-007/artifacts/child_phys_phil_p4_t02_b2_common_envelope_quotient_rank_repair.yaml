positive_projective_repair:
  quotient_action: "R_{>0} acts by one common multiplication on nonzero response triples."
  distinction_from_real_projectivization: "Because negative multiplication is not quotiented, opposite rays remain distinct."
  nonzero_p_s_chart:
    domain: "a=k(u)=p_S(k) is nonzero"
    continuous_coordinate: "t=epsilon k(z)/k(u)=(p_R-p_D)/(2p_S)"
    discrete_sheet: "sigma=sgn(a)"
    correct_normal_form: "[Resp(k)]_+=[sigma(1+t),sigma,sigma(1-t)]_+ after division by |a|"
    continuous_dimension: 1
    precision_note: "The bare expression [1+t,1,1-t]_+ covers only sigma=+1. The pair (sigma,t) records the two positive-ray sheets on this chart; sigma is discrete and does not restore a second continuous ratio."
  omitted_chart_boundary:
    condition: "a=0 and b is nonzero"
    response_rays: "[+1,0,-1]_+ or [-1,0,+1]_+, with the sign fixed by epsilon b"
    q_sign_status: "outside the nonzero-coordinate Q_sign domain because the S response is zero"
  zero_response:
    condition: "a=0 and b=0"
    quotient_status: "excluded from Q_ray and Q_sign"

