  continuous_dimension: 1
  sheet_count: 2
  precision_limit: "The bare representative [1+t,1,1-t]_+ covers only sigma=+1. Positive-scale quotienting does not identify the sigma=-1 sheet."
  all_positive_cell: "sigma=+1 and -1<t<1"

