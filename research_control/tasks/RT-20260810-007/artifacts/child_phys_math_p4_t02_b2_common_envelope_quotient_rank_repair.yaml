assumptions_and_typed_objects:
  assumption_set_id: "ASM-V22-P4T02-B2-QUOTIENT-RANK-REPAIR-001"
  source_patch: "U is a declared smooth four-dimensional source patch; x is a point of U, V=T_xU, and V*=T_x^*U. U is proposal-only source scaffolding and is not asserted to be physical spacetime."
  finite_sector_domain:
    set: "S_eq={R,S,D}"
    typed_members:
      R: "the equipped Rod_src control only"
      S: "the equipped Signal_src control only"
      D: "the equipped Detector_src control only"
    cardinality: 3
    strict_subfamily_of_p7: true
    all_p7_sectors_claimed: false
  source_data:
    - "h_0 in V*"
    - "u,z in V"
    - "h_0(u)=1"
    - "h_0(z)=0"
    - "z is nonzero"
    - "epsilon=1/3"
  independence_proof: "If alpha u+beta z=0, evaluation by h_0 gives alpha=0; then beta z=0 and z nonzero gives beta=0. Hence u and z are linearly independent."
  proposal_vectors:
    R: "v_R=u+epsilon z"
    S: "v_S=u"
    D: "v_D=u-epsilon z"
  proposal_forms:
    definition: "p_s:V*->R is p_s(k)=k(v_s) for s in S_eq."
    degree: 1
    density_weight: 0
    physical_characteristic_status: "not_claimed"
  fixed_epsilon_status: "The repaired candidate fixes epsilon=1/3. Statements for general epsilon are edge-case diagnostics, not a change of candidate data."

formal_unit_typing:
  typing_id: "TYPE-V22-P4T02-B2-FORMAL-RESPONSE-LINES-001"
  raw_lines: "For each s in S_eq, L_s is a declared oriented one-dimensional real formal-response line with positive reference vector e_s."
  bookkeeping_line: "L is one declared oriented one-dimensional real bookkeeping line with positive reference vector e."
  typed_relabelings: "For each s, iota_s:L_s->L is a fixed positive linear isomorphism satisfying iota_s(e_s)=e."
  typed_raw_response: "hat_p_s(k)=p_s(k)e_s in L_s."
  relabelled_response: "r_s(k)=iota_s(hat_p_s(k))=p_s(k)e in L."
  cross_sector_identity_domain: "The equality r_R+r_D=2r_S is formed only in the common line L after applying the declared iota_s; adding elements of distinct L_s is not typed."
  meaning_of_units: "The e_s, e, and iota_s are proposal-only formal bookkeeping data. They are neither empirical calibrations nor an assertion that the three physical protocols share a measured unit."
  common_scale_rule: "Changing e by one common positive factor leaves Q_ray and Q_sign unchanged. Arbitrary independent positive changes of the three iota_s generally change response ratios and the displayed image plane; they are not symmetries of the fixed Q_ray repair."
  sign_only_rule: "Q_sign is insensitive to independent positive sectorwise rescaling, provided orientations are preserved."
  forbidden_unit_inference: "The formal ratios below do not establish commensurable empirical observables or physical response magnitudes."

typed_response_map:
  map_id: "MAP-V22-P4T02-B2-TYPED-RESPONSE-RANK-REPAIR-001"
  domain: "V*=T_x^*U"
  codomain: "L^3=L_Relabelled x L_Relabelled x L_Relabelled, ordered by (R,S,D)"
  definition: "Resp_typed(k)=(r_R(k),r_S(k),r_D(k))."
  scalar_coordinates_relative_to_e:
    abbreviations: "a=k(u) and b=k(z)"
    formula: "Resp(k)=(a+epsilon b,a,a-epsilon b)"
    exact_epsilon_formula: "For epsilon=1/3, Resp(k)=(a+b/3,a,a-b/3)."
  nonzero_component_domain: "D={k in V*:p_R(k)p_S(k)p_D(k) is nonzero}=Resp^{-1}((L minus {0})^3)."
  zero_response_branch: "Resp_typed(k)=0 iff a=b=0 iff k belongs to ann(span{u,z}); this branch is excluded from every projective quotient."
  nonzero_component_boundaries:
    middle_zero: "p_S=0 iff a=0."
    rod_zero_on_a_chart: "p_R=0 iff t=-1."
    detector_zero_on_a_chart: "p_D=0 iff t=+1."
    quotient_status: "Any zero component puts k outside D, so neither Q_ray nor Q_sign is assigned there by the repaired candidate."

response_image_rank_theorem:
  theorem_id: "THM-V22-P4T02-B2-TYPED-RESPONSE-IMAGE-RANK-001"
  statement:
    image: "im(Resp_typed)=H_L={(r_R,r_S,r_D) in L^3:r_R+r_D=2r_S}."
    scalar_image: "After the fixed formal trivialization by e, H={r in R^3:r_R+r_D=2r_S}."
    rank: 2
    kernel: "ker(Resp_typed)=ann(span{u,z})"
    kernel_dimension: 2
    restricted_image: "Resp_typed(D)=H_L intersect (L minus {0})^3."
    restricted_differential_rank: 2
  proof:
    containment: "The formula gives (a+epsilon b)+(a-epsilon b)=2a, so every response lies in H_L."
    surjectivity_onto_plane: "Given r in H in scalar coordinates, set a=r_S and b=(r_R-r_D)/(2epsilon). Since u,z are independent, the restriction V*->span{u,z}* is onto, so some k realizes these a,b. Thus every r in H occurs."
    rank: "H is a two-dimensional linear plane, hence Resp_typed has rank two."
    kernel: "For nonzero epsilon, Resp=0 implies a=0 from the middle coordinate and b=0 from either outer coordinate. Conversely a=b=0 makes every component zero. Thus the kernel is ann(span{u,z}); rank-nullity in dim(V*)=4 gives dimension two."
  exact_linear_relation: "r_R+r_D=2r_S"
  information_correction: "The response image has two linear dimensions, and common positive projectivization removes one continuous scale. Q_ray therefore retains one continuous ratio coordinate plus a discrete oriented sheet, not two independent continuous ratios."

positive_projective_response_image:
  quotient_id: "Q-RAY-V22-P4T02-B2-RANK-REPAIR-001"
  positive_ray_relation: "For r,r' in (L minus {0})^3, r~_+r' iff r'=lambda r for one common lambda>0."
  equivalence_proof: "Reflexivity uses lambda=1, symmetry uses lambda^{-1}, and transitivity uses multiplication of positive scalars."
  quotient_map: "Q_ray:D->((L minus {0})^3)/R_{>0}, Q_ray(k)=[Resp_typed(k)]_+."
  image: "im(Q_ray)=((H_L intersect (L minus {0})^3)/R_{>0})."
  continuous_dimension: 1
  discrete_sheet: "sigma=sign(a)=sign(p_S) in {+1,-1} survives because negative common scaling is not quotiented."
  a_nonzero_chart:
    chart_id: "CHART-V22-P4T02-B2-A-NONZERO-001"
    domain: "The full projective locus with a nonzero; it contains all of D."
    coordinate: "t=epsilon b/a=(p_R-p_D)/(2p_S)"
    sheet: "sigma=sign(a)"
    exact_factorization: "Resp=a(1+t,1,1-t)."
    positive_normalized_representative: "[Resp]_+=[sigma(1+t,1,1-t)]_+, obtained by division by |a|."
    ratio_identities: "p_R/p_S=1+t and p_D/p_S=1-t."
    correction_to_sigma_free_formula: "[1+t,1,1-t]_+ is valid only on the sigma=+1 sheet; omitting sigma incorrectly identifies oppositely oriented positive rays."
  complementary_b_nonzero_chart:
    chart_id: "CHART-V22-P4T02-B2-B-NONZERO-001"
    chart_scope: "This is a closure/completeness chart on the broadened projectivization (H_L minus {0})/R_{>0}. It does not enlarge the declared Q_ray or Q_sign domain D; only its intersection with D carries either quotient value."
    domain: "The broadened nonzero-vector response-image locus with c=epsilon b nonzero."
    coordinates: "s=a/c and tau=sign(c)."
    exact_factorization: "Resp=c(s+1,s,s-1)."
    positive_normalized_representative: "[Resp]_+=[tau(s+1,s,s-1)]_+."
    a_zero_boundary: "a=0 is the point s=0 on each tau sheet, with response c(1,0,-1). These are closure/boundary rays of the broadened response image and are strictly outside D because p_S=0; Q_ray and Q_sign are undefined there."
    transition_on_overlap: "Where a and c are both nonzero, s=1/t and tau=sigma sign(t)."
  atlas_coverage: "The a-chart and closure b-chart together cover the broadened projectivization of H_L minus {0} for nonzero epsilon. The actual Q_ray image is obtained only after restricting this atlas to D, which removes every component-zero boundary ray."
  domain_restriction_in_chart: "On D, a is nonzero and t is not -1 or +1."
  positive_covector_ray_descent: "Because all p_s have equal degree one, k->mu k with mu>0 multiplies Resp by the one common mu and leaves Q_ray unchanged. A negative mu changes the oriented sheet."

sign_orbit_classification:
  theorem_id: "THM-V22-P4T02-B2-SIX-SIGN-ORBITS-001"
  sign_quotient_relation: "r~_sign r' iff r'_s=lambda_s r_s for independent lambda_s>0 in sectors s=R,S,D."
  quotient_map: "Q_sign:D->{ordered nonzero sign orbits}."
  realized_orbits_count: 6
  classification:
    - sheet: "sigma=+1"
      interval: "t<-1"
      orbit: "-++"
    - sheet: "sigma=+1"
      interval: "-1<t<1"
      orbit: "+++"
    - sheet: "sigma=+1"
      interval: "t>1"
      orbit: "++-"
    - sheet: "sigma=-1"
      interval: "t<-1"
      orbit: "+--"
    - sheet: "sigma=-1"
      interval: "-1<t<1"
      orbit: "---"
    - sheet: "sigma=-1"
      interval: "t>1"
      orbit: "--+"
  existence_proof: "Every listed interval is nonempty. For any selected sigma and t, choose a with sign sigma and b=at/epsilon; surjectivity of V*->span{u,z}* supplies k, and t not equal to +/-1 ensures k lies in D."
  excluded_orbits: ["+-+", "-+-"]
  exclusion_proof: "If r_R and r_D are positive while r_S is negative, then r_R+r_D>0 but 2r_S<0, contradicting the image-plane identity. Reversing all signs excludes -+-."
  projective_geometry: "The oriented projectivization (H_L minus {0})/R_{>0} is one-dimensional; removing the six boundary rays where one coordinate vanishes leaves exactly the six open sign arcs listed above."

all_positive_preimage_identities:
  identity_id: "ID-V22-P4T02-B2-ALL-POSITIVE-PREIMAGES-001"
  common_positive_domain:
    definition: "Gamma_intersection={k in V*:p_R(k)>0,p_S(k)>0,p_D(k)>0}."
    scalar_formula: "Gamma_intersection={k:a>|epsilon b|}."
    chart_formula: "Gamma_intersection is the locus sigma=+1 and -1<t<1."
  ray_positive_stratum: "C_+++ is the subset of im(Q_ray) whose representatives have all three components positive; it is a one-parameter stratum, not a single response ray."
  sign_positive_orbit: "O_+++ is the single all-positive Q_sign orbit."
  ray_identity: "Q_ray^{-1}(C_+++)=Gamma_intersection"
  sign_identity: "Q_sign^{-1}(O_+++)=Gamma_intersection"
  proof: "On D, either target condition holds exactly when all three p_s(k) are positive. Positive common or independent sector scales preserve component signs. The simultaneous inequalities a+epsilon b>0, a>0, and a-epsilon b>0 are equivalent to a>|epsilon b|."
  validity_status:
    q_ray_well_defined_for_fixed_typed_representatives: true
    q_sign_well_defined: true
    ray_preimage_identity_valid: true
    sign_preimage_identity_valid: true
  limitation: "The identities classify formal common positivity only; they do not identify physical causal directions, common physical propagation, or an effective metric."

epsilon_and_boundary_controls:
  control_id: "CTRL-V22-P4T02-B2-EPSILON-BOUNDARIES-001"
  admitted_value: "epsilon=1/3>0"
  nonzero_generalization: "For any real epsilon nonzero, the image plane, rank two, kernel, one-dimensional positive-projective image, six sign orbits, and formula Gamma={a>|epsilon b|} remain valid after using t=epsilon b/a."
  negative_epsilon: "Changing the sign of epsilon reverses the b parameter and exchanges the two outer formulas. It does not change the rank or orbit set, but typed R and D protocol labels may be exchanged only when their contexts are transported as well."
  magnitude_range: "No bound such as |epsilon|<1 is needed for the linear-algebra claims. The admitted candidate nevertheless remains fixed at 1/3; robustness constants for varying vectors are local and candidate-specific."
  epsilon_zero_degeneracy:
    branch: "If epsilon=0, v_R=v_S=v_D=u, Resp=(a,a,a), rank drops to one, and ker(Resp)=ann(span{u}) has dimension three."
    quotient_effect: "The nonzero positive-projective image then consists of two oriented diagonal rays and only +++ and --- sign orbits occur."
    product_effect: "P_product=a^3 has triple multiplicity."
    candidate_status: "This branch is excluded by the fixed epsilon=1/3 assumption and is not evidence for a global obstruction."
  a_zero_case: "For epsilon nonzero and a=0,b nonzero, Resp=epsilon b(1,0,-1). It is a legitimate nonzero response-image boundary ray but is outside D."
  b_zero_case: "For b=0,a nonzero, t=0 and Resp=(a,a,a). This is one covector response on the diagonal; it does not make the three forms identical on V*."
  component_zero_cases: "t=-1 gives p_R=0 and t=+1 gives p_D=0; both lie outside D."
  total_zero_case: "a=b=0 is precisely the two-dimensional kernel and has no projective class."
  multiplicity_case: "For a test covector q with q(z)=0, the three roots of lambda->P_product(q+lambda h_0) coincide. Hyperbolicity survives, but strict hyperbolicity and simple-root control do not follow."

product_and_common_cone_preservation:
  preservation_id: "PRES-V22-P4T02-B2-PRODUCT-CONE-001"
  product: "P_product(k)=p_R(k)p_S(k)p_D(k)=a(a^2-epsilon^2 b^2)."
  homogeneous_degree: 3
  density_weight: 0
  h0_evaluations: "p_R(h_0)=p_S(h_0)=p_D(h_0)=1 because h_0(v_s)=1."
  hyperbolicity_proof: "For every q in V*, p_s(q+lambda h_0)=q(v_s)+lambda, so the three roots of lambda->P_product(q+lambda h_0) are -q(v_R), -q(v_S), and -q(v_D), with multiplicity. All are real and P_product(h_0)=1, hence P_product is hyperbolic with respect to the supplied h_0."
  component_proof: "On the connected component of {P_product nonzero} containing h_0, no p_s can change sign, so every p_s remains positive. Conversely the intersection of the three positive half-spaces is convex, connected, contains h_0, and lies in {P_product nonzero}. Thus the containing component equals Gamma_intersection."
  characteristic_boundaries: "{P_product=0} is the union of the three sector hyperplanes {p_s=0}; these hyperplanes are generally distinct and share ann(span{u,z})."
  preserved_after_rank_repair: true
  physical_overread_block: "A common positive component is only formal common time-covector admissibility for this proposal. It does not make the sector characteristic hypersurfaces equal and does not establish universal propagation, physical causality, conformal geometry, or g_eff."

source_presentation_covariance:
  covariance_id: "COV-V22-P4T02-B2-SOURCE-H0-TYPED-REPAIR-001"
  one_transition:
    tangent_map: "Let A:V->V' be an invertible derivative of an allowed source-presentation change."
    source_vectors: "u'=Au, z'=Az, and v'_s=Av_s."
    covectors: "h'_0=(A^{-1})^*h_0 and k'=(A^{-1})^*k."
    evaluations: "h'_0(u')=1, h'_0(z')=0, and p'_s(k')=k'(v'_s)=k(v_s)=p_s(k)."
    response: "Under the compatible formal response-line maps, Resp'_typed(k') is the transported Resp_typed(k), so the plane relation, rank, kernel, t, sigma, and sign orbit transport."
    product: "P'_product(k')=P_product(k)."
    common_domain: "Gamma'_intersection=(A^*)^{-1}(Gamma_intersection)."
  overlap_data:
    source_maps: "For charts i,j, A_ij:V_i->V_j is invertible."
    h0_rule: "h_{0,j}=(A_ij^{-1})^*h_{0,i}."
    sector_line_maps: "g_{s,ij}:L_{s,i}->L_{s,j} are positive isomorphisms."
    common_line_map: "g_ij:L_i->L_j is one positive isomorphism."
    typed_compatibility: "iota_{s,j} composed with g_{s,ij} equals g_ij composed with iota_{s,i} for every sector s."
    significance: "The one common g_ij preserves Q_ray ratios and the image-plane equation. If only unrelated positive sector factors exist, Q_sign still glues but the fixed Q_ray and its plane coordinates do not."
  inverse_obligations:
    source: "A_ji=A_ij^{-1}"
    sector_lines: "g_{s,ji}=g_{s,ij}^{-1}"
    common_line: "g_ji=g_ij^{-1}"
  cocycle_obligations:
    source: "On i->j->k overlaps, A_ik=A_jk composed with A_ij."
    sector_lines: "g_{s,ik}=g_{s,jk} composed with g_{s,ij}."
    common_line: "g_ik=g_jk composed with g_ij."
  transition_status: "These are explicit proposal-only compatibility obligations. Their global satisfaction is not derived from the bare source patch and no target atlas or target geometry may be used to supply them."

typed_sector_relabeling:
  relabeling_id: "RELABEL-V22-P4T02-B2-EQUIPPED-SECTORS-001"
  allowed_operation: "A typed relabeling is a bijection pi:S_eq->S_eq together with transport of each sector's protocol context, response line, and vector/form data."
  equivariance: "The ordered response is permuted with the transported data, and the relation 'outer pair sums to twice the midpoint sector' is carried to the correspondingly relabelled equation."
  not_an_extra_quotient: "The candidate does not quotient Q_ray or Q_sign by the full symmetric group. R, S, and D remain distinct typed protocol roles."
  rd_exchange: "The formal exchange R<->D is compatible with z->-z (or epsilon->-epsilon) only when the typed Rod_src and Detector_src contexts are transported; an untyped protocol swap is not allowed."
  scope_preservation: "Relabeling the three equipped controls neither adds unequipped P7 sectors nor establishes full-sector universality."

strict_margin_and_open_neighborhood_robustness:
  robustness_id: "ROB-V22-P4T02-B2-STRICT-MARGIN-001"
  base_margin: "delta=min_{s in S_eq} h_0(v_s)=1."
  topology: "Equip the finite-dimensional spaces V and V* with any auxiliary norms; all such norm topologies agree. Use the product topology on a covector h and the finite family of vectors (v_R,v_S,v_D)."
  open_condition: "The evaluation maps (h,v_s)->h(v_s) are continuous. Therefore there is a product-open neighborhood of (h_0,v_R,v_S,v_D) in which |h'(v'_s)-1|<1/2 for all three sectors."
