new_mathematical_payloads:
  payload_count: 5
  payloads:
    - payload_id: "NMP-RT009-PM-001"
      payload_type: "proper_invariant_admissibility_subsheaf_theorem"
      title: "Clopen component-union subsheaf theorem"
      exact_scope: "Nonempty boundaryless smooth four-manifolds, smooth open embeddings, and ordinary open-cover topology."
      statement: "Clop(U)={A in Open(U) | U\\A is open} defines a nonempty proper full-Diff-invariant contravariant subsheaf of Open(-). For every manifold U, Clop(U) is exactly the set of unions of connected components; hence for connected U it equals {empty,U}."
      hypotheses:
        - "U and V are nonempty boundaryless smooth four-manifolds."
        - "j:V->U is a smooth open embedding."
        - "Cover families are ordinary open covers and local elements agree after inverse-image restriction on all overlaps."
      proof:
        - "If A is clopen in U, j^{-1}(A) is open and its complement V\\j^{-1}(A)=j^{-1}(U\\A) is open, so inverse image restricts to Clop. Identities and compositions are inherited from Open(-)."
        - "Every diffeomorphism is an open embedding with open inverse, so pullback preserves Clop and supplies full-Diff invariance."
        - "For compatible A_i in Clop(U_i), A=union_i A_i is the unique Open(-) glue. Compatibility implies U\\A=union_i(U_i\\A_i): a point outside A lies in some U_i and its local complement, while a point in a local complement cannot lie in any A_j on an overlap. Thus U\\A is open and A is clopen."
        - "Each connected component of a manifold is open because manifolds are locally connected. A clopen A meets each connected component in a clopen subset, hence either the whole component or the empty set. Conversely any union of open components has open complementary component union."
        - "A coordinate chart contains a smaller proper nonempty open ball that is not closed in U, so Clop(U) is a proper subset of Open(U); empty and U show nonemptiness."
      falsifier: "A smooth open embedding whose inverse image of a clopen set is not clopen, a compatible local clopen family whose unique union has nonopen complement, or a connected smooth four-manifold with a proper nonempty clopen subset falsifies the stated theorem."
      novelty_relative_to_rt007: "RT007 classified natural selected elements of Open(U); this theorem constructs and classifies a proper invariant descent-closed subobject of the entire carrier."
      physical_or_occurrence_semantics: false
    - payload_id: "NMP-RT009-PM-002"
      payload_type: "restriction_versus_descent_counterexample"
      title: "Endpoint subpresheaf is not a subsheaf on disconnected sources"
      exact_scope: "The same open-embedding site including disconnected boundaryless smooth four-manifolds."
      statement: "E(U)={empty,U} is a full-Diff-invariant contravariant subpresheaf of Open(-), but it fails open-cover descent whenever U is the disjoint union of two nonempty open components."
      hypotheses:
        - "U=U_1 disjoint_union U_2 with U_1 and U_2 nonempty open smooth four-manifolds."
        - "The cover is {U_1,U_2}; empty overlaps impose compatibility vacuously."
      proof:
        - "For every open embedding j:V->U, inverse image sends empty to empty and U to V, so E is a contravariant subpresheaf and is Diff-invariant."
        - "Choose local elements A_1=U_1 in E(U_1) and A_2=empty in E(U_2). They agree on the empty overlap. Their unique Open(-) glue is U_1, which is neither empty nor U, so it is not in E(U)."
      falsifier: "If the stated local family is not compatible, if its Open(-) glue is an endpoint, or if disconnected objects and their component cover are excluded from the declared domain, this counterexample does not apply."
      novelty_relative_to_rt007: "It separates inverse-image stability from descent closure, a distinction not decided by the empty-or-total natural-section theorem."
      physical_or_occurrence_semantics: false
    - payload_id: "NMP-RT009-PM-003"
      payload_type: "natural_formal_measure_nonuniqueness_theorem"
      title: "Continuum of restriction-natural normalized formal measures"
      exact_scope: "Connected nonempty boundaryless smooth four-manifolds and smooth open embeddings between connected objects, on the two-element Clop fiber."
      statement: "For every t in [0,1], mu_t,U=(1-t)delta_empty+t delta_U is normalized and satisfies Prob(j^*)(mu_t,U)=mu_t,V for every j:V->U. Distinct t give distinct measures, so restriction naturality, full-Diff invariance, normalization, and the clopen carrier do not select one formal measure."
      hypotheses:
        - "U and V are connected, so Clop(U)={empty,U} and Clop(V)={empty,V}."
        - "Prob(j^*) denotes finite-measure pushforward along endpoint inverse image."
        - "No physical probability, stochastic event, or realized occurrence meaning is assigned."
      proof:
        - "Endpoint restriction sends empty to empty and U to V, so pushforward sends delta_empty to delta_empty and delta_U to delta_V. Linearity gives Prob(j^*)(mu_t,U)=mu_t,V."
        - "Normalization follows because (1-t)+t=1 and both weights are nonnegative."
        - "Evaluation on the singleton {U} gives mu_t,U({U})=t, so mu_t,U differs from mu_s,U whenever t differs from s."
      falsifier: "A declared current-source structural equation satisfied by exactly one t, failure of endpoint restriction, or equality of mu_t and mu_s for distinct t falsifies the corresponding nonselection claim."
      novelty_relative_to_rt007: "RT007 exhibited continuum many formal measures on a fixed binary carrier; this strengthens the control to a natural family compatible with every connected open embedding."
      physical_or_occurrence_semantics: false
    - payload_id: "NMP-RT009-PM-004"
      payload_type: "scoped_structural_independence_corollary"
      title: "Carrier, descent, invariance, and normalization are jointly insufficient for unique selection"
      exact_scope: "Only the structural axiom set H_struct explicitly listed in this child; no claim about all possible future source laws."
      statement: "Within H_struct, unique formal-measure selection is not a logical consequence because the family in NMP-RT009-PM-003 supplies continuum many models satisfying the same restrictions, invariance, clopen descent control, and normalization."
      hypotheses:
        - "H_struct contains only the fixed Open carrier, Clop restriction and descent, full-Diff invariance, and formal-measure normalization and naturality."
        - "No additional source-law root G_src is included."
      proof:
        - "NMP-RT009-PM-003 constructs one H_struct-compatible family for every t in [0,1]."
        - "At least t=0 and t=1 differ on the total endpoint event. If H_struct entailed one unique family, every H_struct model would agree, contradicting these two explicit models."
      falsifier: "An already-declared source-only axiom within H_struct that rules out all but one t, or a proof that the t=0 and t=1 constructions violate one listed axiom, falsifies this corollary."
      novelty_relative_to_rt007: "It identifies the exact axiom boundary of the nonselection control and converts carrier-only nonuniqueness into a route dependency on a new source-law root."
      global_no_go: false
    - payload_id: "NMP-RT009-PM-005"
      payload_type: "p4_route_typing_discriminant"
      title: "Typed codomain and fiber criterion for a materially distinct Route C"
      exact_scope: "Packet admissibility for Route C under the fixed RT003 and RT007 sources."
      statement: "A Route C packet is materially distinct only after a current-source-derived codomain functor D_P4, a natural map q_U:A(U)->D_P4(U), explicit fibers of q_U, and a new factorization or nonfactorization theorem are typed. None of these decision-bearing objects is present in the fixed inputs, so Route C is unavailable now but not impossible."
      hypotheses:
        - "Carrier nonselection alone is fixed by RT007 and cannot count as new Route C payload."
        - "Every P4 relevance object must factor through declared current-source data and may not import target geometry or desired output."
      proof:
        - "Without a codomain, q_U has no type; without q_U, its fibers and factorization statement have no mathematical proposition."
        - "Repeating only Open-carrier section or kernel nonselection therefore adds no P4-relevance theorem beyond RT007."
        - "The inspected fixed sources define no independent D_P4 or q_U, so the route fails packet readiness rather than mathematical possibility."
      falsifier: "A registered source-only D_P4 and q_U with explicit fibers, naturality, and a genuinely new P4 factorization or nonfactorization theorem makes the current unavailability judgment false."
      novelty_relative_to_rt007: "This is a precise type-level admission test for a distinct P4 theorem, not another carrier nonselection claim."
      global_no_go: false

