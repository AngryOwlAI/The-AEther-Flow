new_mathematical_payload:
  payload_count: 4
  payloads:
    - payload_id: "NMP-RT009-PHIL-001"
      payload_type: "definitional_extension_nonprogress_lemma"
      name: "OpenRenameCannotSupplyProposalSemantics"
      formal_domain: "A theory T_Open containing the RT007 Open presheaf and a putative extension T_rename with F_prop definitionally equal to Open and every added map eliminable into Open operations."
      statement: "If T_rename is a purely definitional extension of T_Open, then reduct and unique definitional expansion give an equivalence of model categories. Consequently T_rename adds no independent proposal objects, source-law discrimination, occurrence selector, or physical interpretation and cannot discharge the RT003 semantic rows merely by renaming opens as proposals."
      proof: "Replace every F_prop term and added map by its defining Open expression. Every T_rename model reduces to a T_Open model, and every T_Open model has a unique expansion satisfying the definitions. Thus no two models agreeing on Open data can differ on the added symbols, so the extension contains no non-eliminable semantic or selector degree of freedom."
      falsifier: "A future packet supplies at least one independently typed proposal object, law root, comparison map, or axiom not eliminable into Open(-), with target-free provenance and a model pair showing genuine added discrimination."
      decision_consequence: "Route B is materially distinct only if it passes a non-definitional-content test; otherwise it fails back to scoped obstruction rather than claiming progress."
    - payload_id: "NMP-RT009-PHIL-002"
      payload_type: "dependency_graph_acyclicity_criterion"
      name: "NoDiagnosticBackEdgeCriterion"
      formal_domain: "A finite dependency graph with source nodes S, proposed law nodes G={F_prop,Adm,K,Gen_occ}, and forbidden diagnostic nodes D={desired_P4_label,target_geometry,empirical_outcome,benchmark_result}."
      statement: "A necessary syntactic condition for noncircular Route B generation is that no node of D is an ancestor of any node of G. When this holds, a topological ordering places permitted source and disclosed proposal roots before generated law nodes and all diagnostics after them. This condition is necessary but not sufficient for semantic source purity."
      proof: "In a finite directed acyclic graph, absence of a path D->G permits every diagnostic node relevant only downstream to occur after G in a topological order. Any path D->G makes some proposed law depend on the result it is later meant to diagnose, which is circular preload. Semantic inspection remains separately required because labels can hide target content without an explicit graph edge."
      falsifier: "A primitive, coefficient, admissibility predicate, kernel weight, loss function, or acceptance rule used in G reads a desired P4, target, empirical, benchmark, frozen-route, or protected-status node, or a semantic audit reveals an equivalent hidden import."
      decision_consequence: "The selected packet must publish a dependency graph and a later independent Smuggling Audit; an acyclic graph alone cannot authorize adoption."
    - payload_id: "NMP-RT009-PHIL-003"
      payload_type: "natural_nonselection_theorem"
      name: "FormalKernelDoesNotNaturallySelectToken"
      formal_domain: "Nonempty finite sets X, their probability simplices Prob(X), and bijections acting by pushforward."
      statement: "There is no family of maps s_X:Prob(X)->X that is equivariant under every bijection and assigns a realized token to every probability measure."
      proof: "Take X={0,1} and its uniform measure u. The transposition tau fixes u. Equivariance would give s_X(u)=s_X(tau_*u)=tau(s_X(u)), but tau has no fixed point in X. Therefore no such natural selector exists."
      falsifier: "A separately source-derived mark, ordering, random seed, or realization structure breaks the transposition symmetry and types an additional token-selection map; that extra datum, not the kernel alone, carries the selection."
      decision_consequence: "Even a successful Route B kernel remains a formal law candidate and may not be reported as a realized occurrence or physical event."
    - payload_id: "NMP-RT009-PHIL-004"
      payload_type: "packet_selection_dependency_map_update"
      name: "ConstructiveRouteDominanceUnderCurrentBoundary"
      formal_domain: "The exact four job-declared routes A, B, C, and D with the RT003 first-missing dependency, RT007 theorem, role constructive-preference rule, and present authority flags fixed."
      statement: "Under the current boundary, B is the unique route that both remains non-protected and proposes to add the first missing source-law dependency; A and C are diagnostic theorem routes, while D is admissible only after A, B, and C require protected authority."
      proof: "Direct inspection of the four typed packet classes gives A and C type source_side_irrelevance_theorem, B type ontology_law_research_packet, and D type human_gated_ontology_change_required. RT003 identifies a missing source law, the selector role prefers a constructive non-promotional packet when available, and B can be proposal-only with adoption blocked. Therefore B dominates for this decision without proving its future law correct."
      falsifier: "B is shown to require a forbidden import or present adoption, or A or C is retyped with a concrete non-eliminable source-law construction under the same non-promotional authority."
      decision_consequence: "Select B now, execute nothing, and preserve A as a likely later Refuter stress after a concrete law exists."

