    name: "FiberRestrictionArrows"
    definition: "Measurable restriction maps over Open-carrier arrows, with identity, composition, and declared variance."
  - domain_id: "DOM-04"
    name: "AdmissibleSubfunctor"
    definition: "A nonempty measurable proposal-only subfunctor Adm_ext contained in F_ext and closed under restriction and declared cover descent."
  - domain_id: "DOM-05"
    name: "NormalizedOccurrenceKernels"
    definition: "Normalized finite or standard-Borel kernels K_ext on Adm_ext, natural for the declared source-arrow action and compatible with restriction."
