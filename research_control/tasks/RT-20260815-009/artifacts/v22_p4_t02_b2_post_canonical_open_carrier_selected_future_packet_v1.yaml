    name: "DeclaredSourceArrowGroupoid"
    definition: "Proposal-only transport arrows and automorphisms with explicit provenance; no EqSrc adoption follows."
  - domain_id: "DOM-09"
    name: "RobustnessControls"
    definition: "A predeclared topology or metric on law data used only for a bounded continuity or stability theorem, never imported from target geometry."
  - domain_id: "DOM-10"
    name: "ExclusivePacketResult"
    definition: "Exactly one constructed proposal-only candidate pending audit or the first precise typing, provenance, naturality, descent, normalization, generator, or robustness obstruction."

