theorem_targets:
  - theorem_id: "THM-01"
    name: "Minimum-interface well-typedness and category coherence"
    target: "Every object, arrow, identity, composition, admission, and transport expression is well typed and satisfies the declared finite laws."
  - theorem_id: "THM-02"
    name: "Old-language conservativity"
    target: "Forgetting every extension datum returns exactly R_cur and changes no Sigma_cur sentence."
  - theorem_id: "THM-03"
    name: "Complete automorphism and naturality classification"
    target: "Enumerate every automorphism and every Boolean predicate; prove exactly which predicates satisfy every declared naturality square."
  - theorem_id: "THM-04"
    name: "Independent provenance or precise obstruction"
    target: "For every asymmetric datum, prove a noncircular source-only provenance path fixed before outcome inspection or return source_provenance_obstruction."
  - theorem_id: "THM-05"
    name: "Conditional finite construction"
    target: "Only after THM-01 through THM-04 pass, construct one finite unique-admission witness and verify every category, automorphism, transport, reduct, and import condition."
  - theorem_id: "THM-06"
    name: "Semantic nonpromotion"
    target: "Prove that the finite admission predicate has no physical, empirical, causal, metric, or adoption meaning in this packet."

