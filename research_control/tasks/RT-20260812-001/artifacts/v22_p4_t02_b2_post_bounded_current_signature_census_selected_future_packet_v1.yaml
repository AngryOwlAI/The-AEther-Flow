  - obligation_id: "PO-06"
    requirement: "Enumerate all automorphisms and all Boolean predicates in every finite branch."
  - obligation_id: "PO-07"
    requirement: "Check every nonidentity naturality square; exclusions require an independently sourced typing rule."
  - obligation_id: "PO-08"
    requirement: "List every asymmetric datum before outcome inspection and prove its provenance without using desired admission or P4 success."
  - obligation_id: "PO-09"
    requirement: "If provenance fails, return source_provenance_obstruction and prohibit positive construction."
  - obligation_id: "PO-10"
