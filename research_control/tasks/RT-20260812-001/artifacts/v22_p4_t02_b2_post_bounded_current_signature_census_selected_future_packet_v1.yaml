      failure_result: "precise_extension_typing_or_category_obstruction"
    - gate_id: "GATE-02"
      requirement: "Theory-scope old-language conservativity over the exact fixed reduct."
      failure_result: "nonconservative_reduct_obstruction"
    - gate_id: "GATE-03"
      requirement: "Exhaustive automorphism, predicate, and nonidentity naturality classification."
      failure_result: "automorphism_or_naturality_obstruction"
    - gate_id: "GATE-04"
      requirement: "Independent noncircular source provenance for every asymmetric datum before the positive branch."
      failure_result: "source_provenance_obstruction"
    - gate_id: "GATE-05"
      requirement: "No target atlas, metric, desired cone, empirical label, benchmark answer, workflow status, or frozen-route import."
      failure_result: "forbidden_import_obstruction"
    - gate_id: "GATE-06"
      requirement: "Proposal-only status, blocked adoption, and explicit separation of syntax, mathematics, provenance, physical meaning, empirical meaning, and workflow authority."
      failure_result: "semantic_layer_or_authority_obstruction"

