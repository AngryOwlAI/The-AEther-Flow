new_mathematical_payload:
  payload_count: "4"
  items:
    - payload_id: "PAYLOAD-RT001-PM-001"
      payload_type: "theorem"
      name: "current-language reduct-fibre nondefinability theorem"
      hypotheses: "Let U:E->R be a forgetful map from expansions to current reducts. Let q:E->Q encode added presentation-admission data. Assume e0 and e1 lie in one U-fibre but q(e0) differs from q(e1)."
      statement: "No function q_bar on im(U) satisfies q=q_bar composed with U. In particular no current-language term or formula explicitly selects q between those expansions."
      proof: "If q=q_bar composed with U, then U(e0)=U(e1) implies q(e0)=q_bar(U(e0))=q_bar(U(e1))=q(e1), contradicting the hypothesis. Current-language interpretations depend only on the reduct, so they cannot distinguish the pair."
      exact_application: "RT013 supplies same-reduct expansions with distinct presentation cardinality and admission truth. The conclusion is current-language explicit nondefinability only."
      falsifier: "A current-language construction q_bar whose value changes across the alleged same-reduct pair, or proof that the pair does not have the same Sigma_cur reduct, falsifies the application."
      novelty: "Upgrades the RT013 paired control to an exact fibre-factorization decision criterion for all proposed route outputs."
      forbidden_overread: "This does not prove that no richer source language can define presentation admission."
    - payload_id: "PAYLOAD-RT001-PM-002"
      payload_type: "lemma"
      name: "minimum typed presentation-admission interface deletion lemma"
      hypotheses: "A packet must form presentation objects, type nonidentity arrows, compose them, state a Boolean admission value, and test transport naturality."
      statement: "The interface Sigma_min containing PresObj, PresArrow, src, tgt, id, comp, admit, and transport is componentwise necessary for those stated typing and covariance obligations. It is syntactically sufficient to state them, but not epistemically sufficient to select an admission law."
      proof: "Delete PresObj and admit has no domain. Delete PresArrow, src, or tgt and no nonidentity square is typed. Delete id or comp and category coherence cannot be stated. Delete admit and there is no discriminator. Delete transport and the two sides of a nonidentity naturality square have no common typed comparison. Conversely the full interface types every listed expression. No component supplies a source reason for any particular admit value."
      falsifier: "A strictly smaller typed signature that forms every listed expression with the same declared semantics falsifies minimality; a source-independent unique admit term in Sigma_min falsifies the epistemic insufficiency clause."
      novelty: "Separates formation sufficiency from source provenance, physical meaning, and adoption in one deletion-testable signature."
    - payload_id: "PAYLOAD-RT001-PM-003"
      payload_type: "theorem"
      name: "two-object swap-orbit naturality theorem"
      hypotheses: "G_swap has objects p0,p1 and a swap arrow s. Bool transport is trivial. Admission a maps objects to Bool and is natural for s."
      statement: "a(p0)=a(p1). Exactly two natural predicates exist: constant false and constant true. Therefore no swap-natural predicate uniquely admits one object."
      proof: "Naturality for s gives a(p1)=a(s(p0))=a(p0) under trivial transport. The reverse swap gives the same equality. The four Boolean predicates on two objects reduce to the two equal-coordinate predicates. Both constants satisfy every groupoid law and naturality square."
      falsifier: "A typed nontrivial Boolean transport, a restricted arrow class excluding s for a sourced reason, or a predicate with a commuting swap square and unequal values falsifies the stated application."
      novelty: "Makes the RT013 swap countercontrol exhaustive by classifying all four predicates and the exact two-element invariant subset."
      forbidden_overread: "This is a finite extension control, not a global ontology theorem or a physical gauge claim."
    - payload_id: "PAYLOAD-RT001-PM-004"
      payload_type: "finite_witness_feasibility_proposition"
      name: "rooted two-object unique-admission control"
      hypotheses: "Add a disclosed proposal-only token rho=p0 and restrict morphisms of the rooted presentation structure to those preserving rho."
      statement: "The predicate admit_rho(p) iff p=rho uniquely admits p0 and is natural under every rooted automorphism. The unrooted swap is not an automorphism of the rooted structure because it sends rho to p1."
      proof: "On {p0,p1}, admit_rho has values true,false. Any rooted automorphism fixes p0 and hence also p1, so it is the identity and preserves admit_rho. The swap fails the root-preservation premise and is correctly rejected rather than silently ignored."
      falsifier: "A nonidentity rooted automorphism that preserves rho but changes admit_rho, or a proof that rho is definable from the current reduct rather than additional data, falsifies the corresponding clause."
      novelty: "Exhibits the smallest exact symmetry-breaking feasibility control and localizes the unresolved burden to provenance of rho rather than typing."
      authority_limit: "This selector-level control does not execute the selected packet, propose physical meaning, derive rho from current ontology, or authorize adoption."

