new_mathematical_payload:
  payload_count: "4"
  items:
    - payload_id: "NMP-RT001-PHIL-001"
      payload_type: "theorem_with_nonimplications"
      name: "three-gate presentation-admission sufficiency theorem"
      formal_statement: "For a proposal E, syntactic sufficiency means that carrier, arrows, category laws, admit, and transport are well typed; epistemic sufficiency means that the choice of E and every asymmetric datum have noncircular source provenance and are invariant or equivariant under declared EqSrc; adoption means that protected authority accepts E into canonical ontology. Syntactic sufficiency does not imply epistemic sufficiency, and epistemic sufficiency does not imply adoption."
      proof: "For the first nonimplication, C2_root with stipulated r is fully typed and yields a_r, yet the same current reduct supports the alternative root, so typing alone gives no source reason for r. For the second, even a uniquely source-derived proposal remains a draft scientific result until the protected human adoption relation is invoked; that relation is absent from mathematical premises."
      decision_consequence: "Select a packet that can test the first two gates while leaving the third explicitly unavailable."
      falsifier: "A rule in the current authority model proving that every well-typed extension is uniquely source-derived, or that theorem truth automatically changes canonical ontology, would falsify the corresponding nonimplication; no such rule exists in the inspected sources."
      scope: "proposal-only extension reasoning and project authority; not a global theorem about all scientific institutions"
    - payload_id: "NMP-RT001-PHIL-002"
      payload_type: "finite_theorem_with_exhaustive_proof"
      name: "two-object swap admission nonselection lemma"
      formal_statement: "Let C2 have objects p0 and p1 and let sigma swap them. A Boolean admission predicate a is invariant under sigma exactly when a(p0)=a(p1). Therefore the invariant predicates are only constant false and constant true, and no invariant predicate admits exactly one object."
      proof: "There are four Boolean pairs (false,false), (false,true), (true,false), and (true,true). The equation a composed with sigma equals a exchanges the two coordinates, retaining exactly (false,false) and (true,true). Neither has one true coordinate."
      decision_consequence: "A finite unique-admission witness must disclose symmetry-breaking data; it cannot derive unique admission from the unrooted symmetric carrier alone."
      falsifier: "Exhibit a nonconstant pair (x,y) with (x,y)=(y,x). Exhaustive enumeration shows none."
      scope: "the finite C2 swap control only; not a global physical gauge, ontology, or future-extension no-go"
    - payload_id: "NMP-RT001-PHIL-003"
      payload_type: "conditional_witness_and_countermodel"
      name: "rooted witness provenance countermodel"
      formal_statement: "Adding r=p0 to C2 makes a_r=(true,false) definable and leaves only automorphisms fixing p0, but adding r=p1 instead gives the equally typed witness (false,true). After forgetting r, both expansions have the same unrooted reduct."
      proof: "In a rooted structure, an automorphism must preserve the distinguished object, so the swap is no longer an automorphism and a_r is invariant under the remaining identity. Forgetting r returns C2 in both cases, while the two predicates differ."
      decision_consequence: "A root can establish conditional syntactic sufficiency but not epistemic source selection; Route C is honest only when its absorbed Route B gates type and source the asymmetry before construction."
      falsifier: "A source-only definition that uniquely fixes r from the unrooted current reduct would eliminate one rooted expansion and discharge the provenance burden."
      scope: "finite extension control; no root is proposed as physical or canonical"
    - payload_id: "NMP-RT001-PHIL-004"
      payload_type: "epistemic_trilemma"
      name: "finite unique-witness asymmetry trilemma"
      formal_statement: "Any finite witness that uniquely admits one object in a nontrivial swap orbit must use asymmetry that is source-derived, merely stipulated, or imported from the target outcome. In the first case it remains a candidate pending proof and audit; in the second it is proposal-only and does not explain selection; in the third it is forbidden target smuggling."
      proof: "The swap lemma excludes unique selection from symmetric carrier data. Hence the witness contains some datum not invariant under the swap. Its provenance is either within allowed source evidence, outside that evidence but disclosed as a stipulation, or outcome/target dependent under the task classification. The three cases have the stated status consequences."
      decision_consequence: "Route C's mandatory absorbed Route B gate must classify every asymmetric token before any witness can count as source-facing progress."
      falsifier: "Produce a uniquely selecting swap-invariant predicate without asymmetric data, or exhibit a fourth provenance class not reducible to source evidence, disclosed stipulation, or forbidden outcome import."
      scope: "the declared finite witness and provenance taxonomy"

