reopening_criteria:
  same_candidate_family:
    - "A materially new source-only protocol relation removes the exact Clock-FreeFall invariant conflict while preserving every declared typing and no-target-import guard."
    - "A declared comparison notion other than bijective isomorphism, such as a quotient, refinement, embedding, or functor, is specified with exact universality conditions and nontrivial controls."
    - "A source-side continuum or scaling construction supplies field equations and a leading operator from which a principal symbol can actually be computed."
    - "A source-derived interpretation map connects the formal relation to physical propagation with independent calibration and falsification conditions."
  protected_adoption:
    - "Any canonical ontology, source-law, effective-metric, or physical-propagation adoption requires separate human-gated authority."
  non_reopening:
    - "renaming states or tokens"
    - "repeating the same finite invariant calculation"
    - "validator, checkpoint, registry, or generated-derivative success"
    - "assuming one target metric in every matter sector"

open_obligations:
  - "derive rather than stipulate any canonical source propagation primitive"
  - "decide whether a lawful non-bijective common structure is scientifically intended"
  - "supply continuum field equations before requesting a principal-symbol calculation"
  - "supply a scale or limit map before using low-energy language"
