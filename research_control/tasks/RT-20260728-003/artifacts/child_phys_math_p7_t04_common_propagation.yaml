formal_support_relation:
  carrier:
    notation: "X_(D,i)"
    definition: "the finite configuration carrier of protocol D under declared intervention label i"
  one_step_support:
    notation: "A_(D,i)(y,x)"
    definition: "A_(D,i)(y,x)=1 iff there exists an enabled declared source transition T with s(T)=x, t(T)=y, and K_(D,i)(T|x)>0; otherwise A_(D,i)(y,x)=0"
    codomain: "{0,1}"
    orientation: "matrix columns are source states x and rows are target states y; edge-list strings use x->y"
    identity_rule: "Each typed identity transition contributes x->x."
    off_diagonal_part: "B_(D,i)=A_(D,i) with all identity loops removed"
    physical_interpretation: false
  boolean_composition:
    semiring:
      addition: "logical OR"
      multiplication: "logical AND"
    zero_power: "A^[0]=I"
    recurrence: "A^[n+1](z,x)=OR_(y in X)(A(z,y) AND A^[n](y,x))"
    reachability: "Reach_A(z,x)=OR_(n=0 to |X|-1) A^[n](z,x)"
    exact_meaning: "A^[n](z,x)=1 records existence of a formal n-record support composition, with identity loops able to pad a composition"
    physical_time_claimed: false
    physical_duration_claimed: false
    causal_order_claimed: false
  invariant_conventions:
    strongly_connected_components: "computed on the directed support graph; identity loops do not merge components"
    nontrivial_cycle: "a directed cycle containing at least one off-diagonal edge"
    off_diagonal_reachability_diameter: "maximum shortest B-path length among distinct reachable ordered pairs; defined as 0 when no distinct pair is reachable"
    invariance_scope: "preserved by bijective support transport only"

