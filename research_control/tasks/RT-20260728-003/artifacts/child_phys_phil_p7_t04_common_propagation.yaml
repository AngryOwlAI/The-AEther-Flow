transport_theorem_premise_result_audit:
  theorem_id: "P7T04-THM-BOOLEAN-SUPPORT-TRANSPORT-001"
  admissible_premises:
    - "finite source configuration sets Omega_D and Omega_E"
    - "explicit bijection b:Omega_D->Omega_E"
    - "A_E(b(y),b(x))=A_D(y,x) for every ordered source pair"
    - "the same typed-identity convention on both sides"
  exact_results:
    - "the adjacency matrices are related by permutation conjugacy"
    - "every Boolean power and Reach_le_n relation transports under b"
    - "reflexive-transitive reachability transports under b"
    - "the declared invariant profile is equal"
  results_not_licensed:
    - "equality of kernel weights unless transition-row transport is separately shown"
    - "equality of readout tokens unless a token map is separately shown"
    - "operational equivalence"
    - "empirical indistinguishability"
    - "common physical propagation"
    - "common characteristic cone or metric"
    - "universality across matter sectors"
  converse_guard: >-
    Equality of selected invariants is necessary but not sufficient for
    support isomorphism. Equality of the response value one quarter is also
    neither necessary nor sufficient for support isomorphism.

three_address_subfamily_audit:
  theorem_id: "P7T04-THM-THREE-ADDRESS-SUBFAMILY-001"
  common_skeleton: "C3_reflexive_forward_chain"
  skeleton_vertices: ["0", "1", "2"]
  skeleton_nonidentity_edges: ["0->1", "1->2"]
  protocol_profiles:
    Rod_src:
      vertices: ["r_0", "r_1", "r_2"]
      nonidentity_edges: ["r_0->r_1", "r_1->r_2"]
      profile:
        vertex_count: 3
        nonidentity_edge_count: 2
        strongly_connected_component_count: 3
        nontrivial_directed_cycle: false
        reachable_pair_diameter: 2
    Signal_src:
      vertices: ["s_0", "s_1", "s_2"]
      nonidentity_edges: ["s_0->s_1", "s_1->s_2"]
      profile:
        vertex_count: 3
        nonidentity_edge_count: 2
        strongly_connected_component_count: 3
        nontrivial_directed_cycle: false
        reachable_pair_diameter: 2
    Detector_src:
      vertices: ["q_0", "q_1", "q_2"]
      nonidentity_edges: ["q_0->q_1", "q_1->q_2"]
      profile:
        vertex_count: 3
        nonidentity_edge_count: 2
        strongly_connected_component_count: 3
        nontrivial_directed_cycle: false
        reachable_pair_diameter: 2
  transport_maps:
    signal_to_detector:
      map: "b_SD(s_j)=q_j for j=0,1,2"
      provenance: "explicit P7-T03 declared history and transition bijection"
      status: "fixed proposal-only source data"
    rod_to_signal:
      map: "b_RS(r_j)=s_j for j=0,1,2"
      provenance: >-
        P7-T03 permits the comparison only under a declared source-address
        bijection; this concrete map must be declared by P7-T04 and checked
        on identity and forward edges.
      status: "new proposal-only source-extension data, not derived by current ontology"
    rod_to_detector:
      map: "b_RD=b_SD composed with b_RS"
      status: "conditional composed source transport"
  exactly_allowed_claim: >-
    Under the explicit maps above, the three selected finite support graphs
    are isomorphic to the same reflexive forward-chain skeleton, and their
    Boolean reachability relations transport accordingly.
  blocked_overreads:
    - "the three roles are physical matter sectors"
    - "the chain is a spacetime trajectory"
    - "the edge orientation is physical time or causal order"
    - "the common skeleton is a physical cone"
    - "the endpoint count is distance"
    - "the formal horizon is travel time"
    - "the trigger token is empirical detection"
    - "the subfamily establishes universal propagation"
    - "the subfamily establishes a common metric or equivalence principle"

