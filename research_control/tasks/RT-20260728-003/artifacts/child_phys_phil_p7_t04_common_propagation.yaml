conservative_reopening_criteria:
  exact_family_freeze_recommendation: >-
    Freeze repetition of the exact P7-T02/P7-T03 support-profile calculation
    after the parent records the theorem and obstruction. Repeating the same
    relations, maps, and invariants is not new progress.
  valid_reopening_classes:
    - reopening_class: "new_uniform_source_relation_selector"
      required_delta: >-
        Supply a new target-atlas-free rule selecting a support relation for
        every protocol and intervention variant, together with a proof of
        uniform source transport.
    - reopening_class: "new_matter_sector_family"
      required_delta: >-
        Supply an explicit parameterized family of admitted source-matter
        sectors and one uniform relation schema across that family.
    - reopening_class: "new_comparison_not_exact_isomorphism"
      required_delta: >-
        Define and justify a source-only quotient, embedding, common cover,
        product, or coarse-graining predicate, state how it differs from the
        exact-bijection predicate refuted here, and preserve all loss-of-data
        caveats.
    - reopening_class: "new_continuum_or_operator_construction"
      required_delta: >-
        Supply a reproducible source-side scaling or continuum construction,
        local field equations, and a genuine operator from which a principal
        symbol may be computed.
    - reopening_class: "new_physical_interpretation_bridge"
      required_delta: >-
        Supply explicit calibrated maps for time, distance, signaling,
        detection, energy regime, and sector meaning, then route them through
        audit, stress, and protected authority.
    - reopening_class: "protected_source_law_authority"
      required_delta: >-
        Supply explicit human-gated authority for canonical-ontology
        candidate designation, adoption, or rejection; the current relay and
        this child review cannot supply that authority.
  invalid_reopening_bases:
    - "renaming the same finite graph as a cone or metric"
    - "using a target metric or desired GR result to select source edges"
    - "treating equal response coefficients as universality"
    - "treating a validator or checkpoint PASS as scientific evidence"
    - "repeating the same exact relation family without a material premise delta"

