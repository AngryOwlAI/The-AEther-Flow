    critical_type_distinction: >-
      The five protocol roles are not declared matter sectors. P7-T01 sector
      labels are preserved along edges, but P7-T03 does not supply one
      parameterized protocol or relation for every admitted matter sector.
    intervention_distinction: >-
      FreeFall_src supplies at least two enabled-row relations, one for the
      baseline and one for i_block_move. Therefore the exact extracted object
      is an intervention-indexed relation family, not automatically one
      relation per English role name.

formal_relation_contract:
  one_step_support:
    symbol: "A_D(y,x)"
    definition: >-
      A_D(y,x)=1 exactly when at least one enabled declared transition of the
      selected protocol control has source x and target y; otherwise it is
      zero.
    algebra: "Boolean"
    full_support_includes_typed_identity_loops: true
    exact_meaning: "declared finite source adjacency only"
  nonidentity_support:
    symbol: "N_D"
    definition: "N_D is A_D with only the distinguished typed identity edges removed"
    purpose: >-
      N_D makes nontrivial cycle and hop content explicit so that ubiquitous
      identity loops are not misreported as propagation cycles.
    exact_meaning: "declared nonidentity source adjacency only"
  bounded_reachability:
    symbol: "Reach_D_le_n"
    definition: "Reach_D_le_n = I OR A_D OR A_D^[2] OR ... OR A_D^[n] over the Boolean semiring"
    exact_meaning: "existence of a declared source-transition word of at most n formal compositions"
    not_meaning:
      - "causal accessibility"
      - "physical future"
      - "signal transmission"
      - "spacetime path"
      - "finite propagation speed"
  unbounded_finite_reachability:
    symbol: "Reach_D_star"
    definition: "the reflexive transitive closure of A_D on the finite declared configuration set"
    exact_meaning: "finite graph reachability only"
  invariant_conventions:
    vertex_count: "cardinality of the selected finite configuration set"
    nonidentity_edge_count: "cardinality of N_D"
    strongly_connected_component_count: "SCC count of the directed support graph"
    nontrivial_directed_cycle: "a directed cycle using at least one nonidentity edge"
    reachable_pair_diameter: >-
      Maximum shortest-path length over distinct reachable ordered pairs
      using nonidentity edges, with value zero when no distinct pair is
      reachable.
    convention_guard: >-
      Every theorem and validator must use these exact conventions. An
      unqualified cycle count would be ambiguous because every control has
      typed identity loops.

