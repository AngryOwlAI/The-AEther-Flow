review_question: >-
  What exact source-side relation, reachability, transport, and
  non-isomorphism statements follow from the fixed proposal-only P7-T02
  finite controls and P7-T03 protocol suite, and which physical,
  operational, geometric, matter-sector, coupling, or GR interpretations
  remain blocked?

review_outcome:
  result_kind: "precise_obstruction_with_constructive_subfamily_theorem"
  candidate_id: "CommonSourcePropagationProfileCandidate_v1"
  relation_id: "SourceSupportRelation_v1"
  theorem_ids:
    - "P7T04-THM-BOOLEAN-SUPPORT-TRANSPORT-001"
    - "P7T04-THM-THREE-ADDRESS-SUBFAMILY-001"
  obstruction_id: "OBST-P7T04-FULL-SUITE-COMMON-PROPAGATION-001"
  exact_allowed_result: >-
    Inside the stipulated finite proposal-only controls, Boolean support and
    finite reachability are source combinatorics. Rod_src, Signal_src, and
    Detector_src have a common three-address-chain support skeleton only
    under explicit source-address and transition bijections. The full
    intervention-indexed P7-T03 relation family is not one isomorphism class:
    in particular Clock_src and baseline FreeFall_src have equal vertex
    cardinality but incompatible strongly-connected-component and
    nontrivial-cycle invariants. Therefore the current candidate data do not
    supply one common support relation by bijective transport across the
    whole suite.
  exact_obstruction_scope: >-
    The obstruction is limited to exact bijective transport of the explicit
    finite source-support relations in the current P7-T03 candidate,
    including its declared intervention variants. It is not a physical
    multi-cone result, not birefringence, not nonuniversality of matter
    sectors, not a global no-go theorem, and not a future source-extension
    impossibility claim.
  physical_low_energy_result: "underdetermined_not_refuted"
  proof_authority: false
  physics_promotion_authorized: false

