formal_relations:
  full_support:
    symbol: "R_C"
    definition: "x R_C y iff some enabled declared source transition T in E_x has target y"
    includes_typed_identity: true
  reduced_support:
    symbol: "R_C_circ"
    definition: "R_C after deleting only declared typed identity transitions"
  exact_reachability:
    symbol: "Q_C_[n]"
    definition: "Boolean nth power of A_C with Q_C_[0] equal to the identity"
  bounded_reachability:
    symbol: "Q_C_[le_n]"
    definition: "Boolean union of exact reachability relations from zero through n"
  semantic_limit: "finite source relation syntax only"

profile_invariants:
  - "vertex_count"
  - "reduced_edge_count"
  - "strongly_connected_component_count"
  - "reduced_directed_cycle_present"
  - "finite_reachability_diameter"

