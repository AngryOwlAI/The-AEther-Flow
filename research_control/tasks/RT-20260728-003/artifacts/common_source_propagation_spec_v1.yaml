theorems:
  - theorem_id: "P7T04-THM-BOOLEAN-SUPPORT-TRANSPORT-001"
    hypotheses:
      - "b is a bijection of finite source address sets"
      - "b transports every declared support edge and typed identity in both directions"
    conclusions:
      - "all exact and bounded Boolean reachability relations intertwine"
      - "the finite support profile is invariant"
    physical_propagation_claimed: false
  - theorem_id: "P7T04-THM-THREE-ADDRESS-SUBFAMILY-001"
    hypotheses:
      - "the rod signal and detector rows are the explicit P7-T03 identity-plus-forward chains"
      - "the rod-to-signal and signal-to-detector source bijections are declared"
    conclusions:
      - "all three controls are copies of the same three-address source relation"
      - "address zero first reaches address two after two nonidentity hops"
    physical_time_distance_cone_or_detector_claimed: false

universality_claim:
  claim_id: "P7T04-U-BIJ-001"
  statement: "one finite relation and one bijective support intertwiner for every P7-T03 role"
  status: "precisely obstructed for the current explicit suite"
  minimal_countermodel:
    left: "Clock_src two-address control"
    right: "FreeFall_src baseline two-address control"
    same_vertex_count: true
    incompatible_invariants:
      - "strongly_connected_component_count: 1 versus 2"
      - "reduced_directed_cycle_present: true versus false"
  scope: "current proposal-only P7-T03 explicit controls under bijective support transport"
  global_no_go_claimed: false
  future_source_extension_impossibility_claimed: false

