new_mathematical_payload:
  payload_count: 4
  payloads:
    - payload_id: "NMP-RT002-PHIL-001"
      payload_type: "occurrence_representation_factorization_lemma"
      name: "Representation descent requires fiber constancy or independently sourced occurrence data"
      statement: "For a forgetful fibration pi:E->S and bridge B:E->Rep, a map b:S->Rep satisfying B=b composed with pi on an admitted fiber exists only if B is constant on that fiber modulo the declared equivalence. If B is not constant, a distributional output on S requires an independently source-derived normalized kernel kappa and is B_star_kappa rather than a selected token."
      proof: "If e_1 and e_2 lie over the same s, factorization gives B(e_1)=b(s)=B(e_2). Conversely, fiber constancy defines b when arrow and descent compatibility hold. Without constancy, only an independently supplied measure can be pushed forward; B alone contains no rule choosing or weighting fiber points."
      falsifier: "Exhibit a well-defined b despite two admitted same-fiber lifts with unequal B values, or derive a current-source kernel kappa whose provenance is independent of B."
      novelty: "The lemma turns occurrence versus representation into an exact dependency test for any extension fibration, not another nonselection theorem about a frozen candidate."
      scope_limit: "It does not assert that a source-derived kernel or section is globally impossible."
    - payload_id: "NMP-RT002-PHIL-002"
      payload_type: "finite_group_action_discriminator"
      name: "The two-point swap has a unique invariant kernel but no deterministic section"
      statement: "For the transitive Z2 action on two points, no point is fixed, no proper nonempty subset is invariant, and the unique invariant normalized kernel is uniform."
      proof: "The nonidentity element swaps both points, so neither is fixed and every singleton moves. An invariant probability has weights p_0=p_1 and normalization p_0+p_1=1, hence p_0=p_1=1/2."
      falsifier: "A fixed point, invariant singleton, or invariant normalized weights unequal to one half."
      novelty: "This proves that probability-kernel existence is logically weaker than deterministic natural selection and that a kernel is not a realized token."
      scope_limit: "No physical randomness, empirical frequency, or response semantics is inferred."
    - payload_id: "NMP-RT002-PHIL-003"
      payload_type: "infinite_torsor_kernel_obstruction"
      name: "The integer translation torsor admits no normalized invariant probability"
      statement: "The transitive translation action of Z on itself has no deterministic fixed point and no countably additive normalized invariant probability measure."
      proof: "Translation invariance assigns one common mass c to every singleton. If c>0 the total mass is infinite, while c=0 gives total mass zero. Therefore no normalized invariant probability exists."
      falsifier: "A countably additive probability measure on Z invariant under every integer translation."
      novelty: "The control shows that replacing token selection by an occurrence kernel is a substantive new existence burden, not automatic symmetry averaging."
      scope_limit: "The result concerns this exact torsor and does not prohibit kernels after additional source structure or compactness."
    - payload_id: "NMP-RT002-PHIL-004"
      payload_type: "route_dependency_lemma"
      name: "Occurrence-admissibility precedes any fiber-varying richer bridge"
      statement: "If a proposed Route C bridge varies on proposal lifts over one current-source reduct, then it has no current-source occurrence output until Route A supplies fiber constancy, a deterministic section, or a normalized kernel with provenance and descent."
      proof: "Apply the occurrence-representation factorization lemma. Fiber variation blocks descent through the reduct; a section or kernel must be specified independently to select or weight the varying outputs. Building a richer codomain does not change this dependency."
      falsifier: "Construct a richer target-free bridge that is already constant on every admitted current-source fiber, or exhibit its independently current-source-derived occurrence datum and descent proof."
      novelty: "The lemma gives a new roadmap decision consequence: it blocks representation proliferation without claiming source extensions impossible."
      scope_limit: "A future Route C satisfying the prerequisite remains open."

