decision_controls:
  occurrence_representation_order:
    statement: "A representation-valued bridge has occurrence force only after an independently source-defined admissible-lift, section, invariant-subfunctor, or occurrence-kernel law is supplied."
    consequence: "Adding another bridge before testing the occurrence layer repeats the decisive predecessor debt even if the new bridge mathematics is correct."
    scope_guard: "This is a dependency ordering for P4-T02 research, not a claim that representation research is globally irrelevant."
  deterministic_section_control:
    statement: "A natural deterministic section over a one-object groupoid requires a fixed point of the source automorphism action on the proposal fiber."
    two_point_swap_result: "The swap torsor has no fixed point and therefore no deterministic natural section."
    novelty_guard: "The future packet must generalize beyond earlier point-root controls by auditing admissible subfunctors, kernels, descent, and provenance together."
  invariant_kernel_control:
    finite_swap_result: "The two-point swap has a unique normalized invariant kernel, the uniform distribution, although it selects neither token."
    translation_result: "A real translation torsor has no invariant Borel probability: equal masses of disjoint unit translates either exceed one or vanish and fail normalization."
    consequence: "Probabilistic occurrence is neither automatic nor equivalent to deterministic selection."
  locality_descent_control:
    statement: "Local admissibility subsets or kernels glue only when their overlap restrictions agree and the source-arrow cocycle acts coherently."
    consequence: "Predeclared locality and descent are independent burdens, not validation metadata."
  source_provenance_factor:
    statement: "Any claimed occurrence law must factor through typed current-source data fixed before bridge or P4 outputs; same-reduct opposite desired labels refute such factorization."
    consequence: "A proposal-only formal carrier may be studied, but current-ontology derivation and adoption remain separate."
  route_C_tractability_control:
    statement: "A rational symmetrizable first-order pencil gives a nonempty open convex energy cone and a Jordan pencil gives an exact symmetrizer obstruction."
    consequence: "A richer bridge remains constructively available later, so a human-gated stop is premature, but it is logically downstream of occurrence/admissibility."

