new_mathematical_payload:
  payload_count: 3
  items:
    - payload_id: "PAYLOAD-RT002-PM-001"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "section-admissibility-kernel separation lemma"
      statement: "For a group G acting on a lift fiber F, a natural deterministic section at the reduct requires a G-fixed point; a proper nonempty invariant admissible subset only filters F and need not select a point; and a normalized equivariant kernel requires a G-invariant probability measure. A fixed point yields a Dirac invariant kernel, but the converse fails, and neither an admissible subset nor a probability distribution is an occurring token."
      proof: "Naturality of a section under every automorphism g gives g.s=s, so s lies in F^G. If s is fixed, delta_s is an invariant normalized measure. For F={a,b} with G=Z2 swapping a and b, F^G is empty, while invariance forces and is satisfied uniquely by kappa(a)=kappa(b)=1/2. Thus an invariant kernel need not yield a section and supplies no realized token. For F={a,b,c,d} with G generated by (a b)(c d), A={a,b} is proper, nonempty, and invariant but contains no fixed point, so admissibility need not select occurrence. Conversely, a singleton fiber has a section but no proper nonempty admissible subset."
      falsifier: "Exhibit a fixed point for the two-point swap, show that its unique invariant probability is not uniform, show that A={a,b} is not invariant under (a b)(c d), or identify an unstated implication stronger than those proved."
      novelty: "Separates three occurrence-law tiers that prior projective-conormal nonselection work did not distinguish and prevents a probability kernel from being relabeled as deterministic source occurrence."
      scope_limit: "This is a fiberwise selector lemma. It does not prove that the current ontology supplies any tier, that local tiers descend, or that every future source extension fails."
    - payload_id: "PAYLOAD-RT002-PM-002"
      payload_type: "countermodel_or_obstruction"
      name: "translation-torsor normalized-kernel obstruction"
      statement: "For the translation action of G=Z on the torsor F=Z, no countably additive normalized G-invariant probability measure exists."
      proof: "Translation invariance forces every singleton {n} to have the same mass p. If p=0, countable additivity gives total mass zero. If p>0, the mass of the first N integers is Np and exceeds one for large N. Both contradict normalization."
      falsifier: "Provide a countably additive probability on Z invariant under every integer translation, or show that the future packet explicitly uses a different finite-additive or nonnormalized object and does not call it a probability kernel."
      novelty: "Shows that randomization is not a universal cure for natural nonselection: some homogeneous fibers admit neither deterministic sections nor normalized invariant kernels."
      scope_limit: "The obstruction is exact for the displayed countable translation torsor and countably additive normalization; it is not a global no-kernel theorem."
    - payload_id: "PAYLOAD-RT002-PM-003"
      payload_type: "dependency_map_update"
      name: "occurrence-before-representation route precedence theorem"
      statement: "Under the active constructive-preference rule, Route A precedes Route C whenever a representation-valued bridge is formed but no independently source-provenanced occurrence or admissibility tier is established, because enriching the representation alone cannot supply the missing section, admissible subfunctor, or kernel factorization."
      proof: "Bridge:E->Y_rep maps already supplied lift data to representations. Any attempt to infer an occurring lift from Bridge requires an inverse choice on each reduct fiber. Such a choice is exactly additional section, admissibility, or kernel data and must satisfy automorphism, restriction, gluing, and provenance constraints. Route A tests and formalizes those logically prior data. Route C may become eligible after Route A identifies an occurrence tier, but selecting C first would leave the predecessor obstruction unchanged. Route B is nonconstructive and cannot infer irrelevance from nonselection alone; Route D is unavailable because Route A is a lawful non-promotional packet."
      falsifier: "Exhibit a current-source-provenanced Bridge with a proved inverse occurrence law already satisfying all automorphism, restriction, gluing, and provenance obligations, or show that Route A necessarily requires protected adoption merely to perform its draft/control calculation."
      novelty: "Adds a formal route dependency rather than replaying the frozen candidate or another bare natural-nonselection argument."
      scope_limit: "This theorem selects a research packet only; it proves neither the future occurrence theorem nor a source law."

