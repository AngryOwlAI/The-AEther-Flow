selector_mathematical_payload_contract:
  required: true
  candidate_payloads:
    - payload_id: "PAYLOAD-A-OCCURRENCE-REPRESENTATION-SEPARATION"
      statement: "A representation-valued bridge over a current source reduct has occurrence-selecting force only if an independently source-defined admissible-lift or section law is supplied; multiple inequivalent lifts over one reduct otherwise prevent inversion from bridge syntax to occurrence."
      required_precision: "State an exact forgetful map, source automorphism action, and section or nonsection hypotheses; do not claim global impossibility."
    - payload_id: "PAYLOAD-B-SOURCE-PRINCIPAL-HYPERBOLICITY-CRITERION"
      statement: "A source-native differential operator family can induce a hyperbolicity cone only after its principal symbol, admissible field bundle, covariance law, and occurrence rule are independently source-defined; a supplied symmetrizer or desired cone is additional data."
      required_precision: "Separate the conditional PDE theorem from current-ontology provenance and from physical response or metric interpretation."
    - payload_id: "PAYLOAD-C-FACTOR-SEPARATION-NO-GO-CRITERION"
      statement: "A scoped irrelevance theorem must exhibit a source-derived P4-relevant codomain or prove that every admissible bridge factors through a quotient that erases the required distinction; mere nonselection does not imply irrelevance."
      required_precision: "Give a clear decision consequence and avoid replay of prior finite-root, K_star, or projective-line nonselection theorems."
    - payload_id: "PAYLOAD-D-HUMAN-GATE-NECESSITY-CRITERION"
      statement: "A protected stop is justified only after all three non-promotional routes require canonical ontology adoption or an equivalent protected authority expansion."
      required_precision: "Missing local data, difficult calculations, or proposal-only primitives do not by themselves trigger the gate."
  minimum_payload_count: 1

