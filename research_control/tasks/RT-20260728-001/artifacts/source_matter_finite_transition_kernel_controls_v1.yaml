      recurrence_check: "mu_(n+1)(x_u)=mu_n(x_u)/2 and mu_(n+1)(x_v)=mu_n(x_v)+mu_n(x_u)/2"
      total_bookkeeping_mass: "1"
    stable_property: "all coefficients remain in [0,1] and sum to one"
