        id_uu: "1/2"
        joint_e1e2: "1/2"
        row_sum: "1"
      x_vv:
        id_vv: "1"
        row_sum: "1"
    nonfactorization:
      projected_first_row: ["id_1", "move_a"]
      projected_second_row: ["id_2", "move_b"]
      cartesian_product_cardinality: 4
      actual_joint_row_cardinality: 2
      missing_mixed_records:
