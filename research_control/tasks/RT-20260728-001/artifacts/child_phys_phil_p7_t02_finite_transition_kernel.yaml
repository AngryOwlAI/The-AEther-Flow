conflict_review_input:
  blocking_conflicts_found: false
  items_parent_must_resolve_or_state:
    - conflict_id: "PHIL-CONFLICT-01"
      issue: "Uniformity can be overread as equal likelihood or as forced by symmetry."
      required_resolution: "State that uniformity is a lawful stipulated choice and that equivariance alone does not prove uniqueness or empirical indifference."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-02"
      issue: "An identity transition can be overread as physical persistence or waiting."
      required_resolution: "Define it as a typed reflexive bookkeeping convention and deny time, duration, survival, stability, and vacuum semantics."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-03"
      issue: "Sector preservation can be presented as a new conservation law."
      required_resolution: "Separate inherited endpoint constraints from the new update-level support lift and deny Noether or physical-conservation status."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-04"
      issue: "Nonfactorization can be caused by finite truncation rather than a source-declared joint rule."
      required_resolution: "Supply explicit joint source enablement or qualify the witness as candidate-relative nonfactorization only."
      blocking_if_unresolved: false
    - conflict_id: "PHIL-CONFLICT-05"
      issue: "Presentation equivariance can be overclaimed for an arbitrary finite subset."
      required_resolution: "Compare Omega with its transported Omega_prime and require a row bijection, rather than asserting automorphism invariance without closure."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-06"
      issue: "Duplicate identity records would make row cardinality and coefficients presentation-dependent."
      required_resolution: "Specify a set or canonical record identity and exactly one distinguished identity record per row."
      blocking_if_unresolved: true
    - conflict_id: "PHIL-CONFLICT-07"
      issue: "The words enabled, successor, interaction, mass, and evolution carry physical connotations."
      required_resolution: "Use explicit candidate-relative qualifiers and the preferred bookkeeping vocabulary throughout the fused artifact."
      blocking_if_unresolved: false

