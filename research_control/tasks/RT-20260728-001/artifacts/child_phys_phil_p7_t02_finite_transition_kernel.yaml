  - claim_id: "PHIL-LIC-04"
    statement: "Bookkeeping support remains inside inherited P7-T01 Q and D sectors because every enabled transition is required to satisfy the P7-T01 chain constraints."
  - claim_id: "PHIL-LIC-05"
    statement: "The transported kernel and update are equivariant under compatible source-presentation isomorphisms that bijectively transport the entire finite control."
  - claim_id: "PHIL-LIC-06"
    statement: "Uniform bookkeeping coefficients factor under an explicitly Cartesian product control."
