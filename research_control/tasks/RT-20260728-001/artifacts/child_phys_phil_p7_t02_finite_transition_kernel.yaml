fixed_basis:
  candidate_id: "SourceMatterIncidenceCandidate_v1"
  status: "proposal-only"
  configuration: "Psi=(m,z)"
  candidate_sector: "Sec_src(Psi)=(Q(Psi),D(Psi)) with D(Psi)=[z]"
  transition_record: "T=(Psi_minus,J,w,Pi,Psi_plus)"
  transition_conditions:
    - "q_plus-q_minus=partial_1 J"
    - "z_plus-z_minus=partial_2 w"
    - "Pi uses only declared source data"
  fixed_absences:
    - "no transition selector or weight"
    - "no action or Hamiltonian"
    - "no physical or formal time supplied by P7-T01"
    - "no probability, rate, frequency, or propensity semantics"
    - "no detector, observer, or empirical interpretation"
    - "no target geometry, stress energy, coupling, or GR input"
  underdetermination_statement: >-
    Current ontology and the fixed proposal-only P7-T01 candidate do not
    derive which kinematically admissible transition is enabled, how
    alternatives are weighted, or how finite updates compose.
  impossibility_claimed: false

model_to_world_ladder:
  level_1_stipulated_candidate_primitives:
    inherited:
      - "finite augmented source-incidence complex and coefficient groups"
      - "occupation and defect data"
      - "derived charge-label map and P7-T01 transition grammar"
    added_here:
      - "finite control configuration set Omega"
      - "finite source-declared enabled-transition rows T_x"
      - "exactly one typed identity record in each row"
      - "uniform row coefficient K_Omega(x,T)=1/|T_x| on enabled records"
      - "formal composition index and bookkeeping update U_Omega"
    status_effect: "All added items are proposal-only source-extension candidate data, not ontology derivations or adopted physical primitives."
  level_2_candidate_derived_mathematics:
    licensed_if_proved:
      - "finite nonempty rows"
      - "nonnegative rational coefficients"
      - "exact row normalization"
      - "finite update closure"
      - "preservation of total bookkeeping mass"
      - "transport equivariance under compatible source-presentation isomorphisms"
      - "conditional factorization under an explicitly declared product control"
      - "candidate-sector support inherited from P7-T01 admissibility"
    status_effect: "Exact theorem status is internal to the stipulated finite candidate and does not supply physical truth or adoption."
  level_3_physical_or_empirical_interpretation:
    status: "open_not_supplied"
    missing_maps:
      - "candidate configuration to physical matter"
      - "bookkeeping coefficient to empirical chance, rate, or frequency"
      - "formal update iterate to clock time, duration, or causal order"
      - "source record to detector outcome or measurement"
      - "source nonfactorization to physical interaction or coupling"
      - "candidate sector to physical charge, defect, or superselection sector"
  level_4_canonical_or_protected_status:
    status: "human-gated"
    blocked_here:
      - "canonical-ontology candidate designation"
      - "source-law adoption"
      - "matter-ontology adoption"
      - "physical interpretation adoption"
      - "benchmark or derivation promotion"
  ladder_rule: >-
    An exact consequence at level 2 cannot, by validation, notation,
    familiarity, or analogy, be promoted to level 3 or level 4.

semantic_findings:
  identity_transition_convention:
    proposed_record: "I_x=(x,0,0,id_x,x)"
    exact_candidate_status: >-
      I_x is a typed reflexive transition convention. It is P7-T01 admissible
      when id_x is a declared source-only update because both chain residuals
      vanish.
    mathematical_function:
      - "ensures every finite enabled row is nonempty"
      - "makes the row-normalization denominator positive"
      - "provides an absorbing bookkeeping row when no nonidentity record is enabled"
      - "supports a total update map on every declared control configuration"
    does_not_mean:
      - "physical persistence of a system or particle"
      - "an event in which nothing physically happens"
      - "elapsed time, waiting time, or survival probability"
      - "zero energy, inertial motion, equilibrium, or stability"
      - "absence of interaction or coupling"
      - "physical vacuum persistence"
    exactness_requirement: >-
      Rows must contain exactly one distinguished identity record per
      configuration under a record-identity convention that prevents
      duplicate copies from changing |T_x| and therefore changing the kernel.
    derivation_status: "stipulated convention, not derived law"

  uniform_bookkeeping_weights:
    formula: "K_Omega(x,T)=1/|T_x| for T in T_x and 0 otherwise"
    exact_mathematical_description: "finite nonnegative row-normalized rational bookkeeping kernel"
    licensed_consequences:
      - "K_Omega(x,T) is nonnegative"
      - "sum over T in T_x of K_Omega(x,T) equals 1"
      - "every declared enabled record has equal positive bookkeeping coefficient"
      - "row cardinality is preserved under a row bijection, so transported uniform rows have equal coefficients"
    stipulated_elements:
      - "which records belong to each enabled row"
      - "the use of equal rather than nonuniform coefficients"
      - "the finite control cutoff or domain"
      - "the decision to normalize each row to one"
    blocked_readings:
      - "transition probability"
      - "objective chance"
      - "empirical propensity"
      - "rate or frequency"
      - "principle of indifference"
      - "maximum-entropy inference"
      - "quantum amplitude or Born weight"
      - "thermodynamic ensemble"
    nonuniqueness_warning: >-
      Presentation equivariance makes the uniform assignment lawful but does
      not generally prove it unique. Other equivariant coefficient systems
      may exist when additional source-only orbit data are declared.
    semantic_rule: >-
      Call K_Omega a bookkeeping coefficient or normalized kernel. Do not
      call it a transition probability, rate, likelihood, propensity, or
      empirical distribution.

  bookkeeping_update_and_index:
    formula: >-
      (U_Omega mu)(y)=sum_x mu(x) sum_{T in T_x with target(T)=y}
      K_Omega(x,T)
    input_status: "finite nonnegative rational bookkeeping assignment mu on Omega"
    exact_candidate_consequences:
      - "U_Omega mu is a finite nonnegative rational bookkeeping assignment"
      - "total bookkeeping mass is preserved by row normalization"
      - "normalized input assignments remain normalized"
      - "iteration U_Omega^n is algebraically defined for nonnegative integer n when the control system is closed"
    index_semantics: "formal composition count only"
    index_does_not_mean:
      - "physical time"
      - "proper time"
      - "clock time or duration"
      - "causal precedence"
      - "continuum limit"
      - "worldline parameter"
      - "measured update frequency"
    modality: >-
      U_Omega transports bookkeeping assignments over candidate-allowed
      records. It does not select one actual history, say that an event occurs,
      or assign a chance that nature realizes an endpoint.
    terminology_guard:
      preferred:
        - "formal update iterate"
        - "composition index"
        - "bookkeeping assignment"
        - "total bookkeeping mass"
      avoid:
        - "time step"
        - "future state"
        - "probability distribution"
        - "physical evolution"
        - "conserved probability"

  modal_versus_empirical_claims:
    support_meaning: >-
      Membership T in T_x means only that the record is enabled inside the
      stipulated finite candidate control. It is stronger than bare P7-T01
      kinematic admissibility but remains candidate-relative.
    support_does_not_establish:
      - "physical possibility"
      - "actual occurrence"
      - "deterministic succession"
      - "empirical accessibility"
      - "relative frequency"
      - "causal influence"
      - "persistent identity across endpoints"
    positive_coefficient_meaning: >-
      A positive K_Omega value means that the enabled record contributes to
      the formal bookkeeping update. It does not mean nonzero physical chance.
    endpoint_language: >-
      Psi_minus and Psi_plus are source-record endpoints in a typed tuple.
      Their notation does not establish temporal before and after, trajectory,
      motion, or worldline semantics.
    empirical_status: "No observational, measurement, calibration, prediction, or detector claim is licensed."

  inherited_versus_new_consequences:
    inherited_from_p7_t01_or_imposed_support:
      - "transition endpoints are admissible P7-T01 configurations"
      - "q_plus-q_minus=partial_1 J"
      - "z_plus-z_minus=partial_2 w"
      - "Pi is source-only"
      - "each supported transition preserves the source-label Q and defect class D=[z]"
      - "malformed transitions are excluded fail-closed"
    newly_derived_from_kernel_given_the_stipulations:
      - "row normalization"
      - "finite nonnegative update closure"
      - "total bookkeeping-mass preservation"
      - "no bookkeeping support crosses Q and D sectors when every enabled record obeys the inherited constraints"
      - "source-presentation equivariance when the entire finite control and its rows transport bijectively"
      - "conditional product factorization under an explicitly product-closed independent control"
    careful_sector_statement: >-
      The kernel newly lifts inherited endpoint-sector support to
      distribution-level support. It does not newly derive the endpoint
      constraints themselves and it does not create a physical conservation
      law.
    not_preserved_without_extra_conditions:
      - "representation grade M"
      - "occupation count N"
      - "energy, momentum, angular momentum, or stress energy"
      - "physical particle number or charge"
    noether_status: "No action or independently derived symmetry-to-conservation argument exists here."

  source_presentation_equivariance:
    exact_hypothesis: >-
      A compatible P7-T01 source-presentation isomorphism must transport
      Omega to Omega_prime and induce a bijection T_x to
      T_prime_transport(x), including identity records and targets.
    exact_consequence: >-
      Row cardinalities agree, uniform coefficients agree under transport,
      and pushforward commutes with the finite bookkeeping update.
    does_not_mean:
      - "diffeomorphism invariance"
      - "target-coordinate covariance"
      - "physical gauge symmetry"
      - "observational equivalence"
      - "empirical indistinguishability"
    scope_warning: >-
      Equivariance compares a control with its transported control. An
      arbitrary finite truncation is not automatically invariant under every
      automorphism of one presentation.

  independence_and_interaction:
    independent_control_hypotheses:
      - "a declared source decomposition into two component controls"
      - "configuration domain Omega=Omega_1 times Omega_2"
      - "enabled row T_(x1,x2)=T^1_x1 times T^2_x2"
      - "componentwise target and identity records"
      - "no omitted or added joint record in the declared product row"
    exact_factorization_result: >-
      Under those hypotheses, row cardinalities multiply and the uniform
      bookkeeping coefficient factors as K=K_1 K_2.
    independence_does_not_mean:
      - "statistical independence of physical events"
      - "spacelike separation"
      - "causal isolation"
      - "absence of a physical force"
      - "absence of universal matter coupling"
      - "ontological separability"
    interacting_control_exact_meaning: >-
      A candidate-relative interacting control is one whose declared
      multi-occupation enabled row is not the Cartesian product of declared
      component rows, so its bookkeeping update does not have the above
      product form.
    interaction_does_not_mean:
      - "physical interaction"
      - "force, potential, scattering, or energy exchange"
      - "matter coupling"
      - "locality or nonlocality in spacetime"
      - "entanglement or empirical correlation"
    regulator_warning: >-
      Apparent nonfactorization caused only by an arbitrary finite cutoff or
      omitted records is not an intrinsic interaction result. The fused
      candidate must either provide a source-declared joint enablement rule or
      qualify the result as a nonfactorizing finite control witness.
    preferred_term: "candidate-relative nonfactorizing source control"

branch_distinctions:
  null:
    defining_condition: "m=0 and z=0"
    kind: "configuration-content stratum"
    exact_meaning: "valid empty source configuration with Q=0 and D=[0]"
    blocked_meanings:
      - "physical vacuum"
      - "ground state"
      - "minimum-energy state"
      - "cosmological background"
      - "absence of all physical matter"
  degenerate:
    defining_condition: "a valid enabled row has only its identity record, or an explicitly declared orbit-degenerate coefficient assignment"
    kind: "candidate-update row property"
    exact_meaning: "the formal bookkeeping update leaves that row at its source configuration"
    blocked_meanings:
      - "physical stability"
      - "equilibrium"
      - "dynamical arrest"
      - "infinite lifetime"
      - "zero interaction"
    relation_to_null: >-
      Nullity and degeneracy are logically distinct. The chosen null control
      may also be degenerate, but nonnull configurations can be degenerate and
      a different proposal could give a null configuration nonidentity
      enabled records.
  malformed:
    defining_condition: >-
      A record, row, or control violates typing, P7-T01 admissibility,
      identity-row uniqueness, nonempty-row, normalization, transport, or
      no-target-import requirements.
    kind: "fail-closed invalid result"
    exact_meaning: "the candidate evaluator returns a recorded bottom result and excludes the invalid datum from the valid kernel"
    blocked_meanings:
      - "zero-probability physical event"
      - "forbidden event in nature"
      - "degenerate state"
      - "null configuration"
      - "evidence against all future source extensions"
    zero_weight_distinction: >-
      K=0 off an otherwise valid enabled row records absence from the
      stipulated support; it must not be used to disguise a malformed record
      as a valid zero-weight transition.
  underdetermined:
    defining_condition: "all supplied data are well typed but the candidate contains no rule for the requested classification"
    kind: "missing-rule result"
    exact_meaning: "the question remains open inside the candidate"
    distinct_from:
      - "null"
      - "degenerate"
      - "malformed"
    example: "asking which detector outcome corresponds to a bookkeeping update"

