candidate_construction:
  formal_system:
    symbol: "(Omega,Tcal)"
    name: "finite source control system"
    configuration_set:
      type: "finite nonempty set of P7-T01 admissible configurations"
      condition: "Omega contains no malformed or underdetermined record"
    transition_set:
      type: "finite set of extensionally distinct typed P7-T01 transition records"
      endpoint_condition: "s(T) and t(T) lie in Omega for every T in Tcal"
      admissibility_condition: "every T in Tcal satisfies all fixed P7-T01 transition conditions"
      duplicate_rule: "Extensional duplicates are not counted as separate row tokens; distinct Pi records may distinguish otherwise equal endpoint data."
    enabled_row:
      definition: "Tcal_x={T in Tcal | s(T)=x}"
      cardinality: "d_x=|Tcal_x|"
      exact_condition: "1 <= d_x < infinity for every x in Omega"
  typed_identity_transition:
    symbol: "id_x"
    tuple: "(x,0,0,Pi_id_x,x)"
    update_record: "Pi_id_x is the exact fieldwise no-op on the primitive occupation record of x"
    admissibility_check:
      charge: "q(x)-q(x)=0=partial_1 0"
      defect: "z(x)-z(x)=0=partial_2 0"
      source_only: "Pi_id_x uses only the declared source record x"
    inclusion_rule: "id_x is included exactly once in Tcal_x for every x in Omega"
    logical_role: "makes every valid control row nonempty; this is a new proposal convention, not inherited dynamics"
  row_kernel:
    symbol: "K_Omega(x,T)"
    coefficient_domain: "Q_nonnegative"
    definition:
      enabled: "K_Omega(x,T)=1/d_x when T is in Tcal_x"
      otherwise: "K_Omega(x,T)=0"
    support_rule: "positive kernel support is exactly the enabled P7-T01 transition row"
    semantic_rule: "coefficients are source-bookkeeping weights only"
  endpoint_kernel:
    symbol: "P_Omega(x,y)"
    definition: "P_Omega(x,y)=sum_{T in Tcal_x and t(T)=y} K_Omega(x,T)"
    type: "nonnegative rational matrix indexed by Omega x Omega"
    semantic_rule: "endpoint aggregation does not add physical probability semantics"
  bookkeeping_space:
    linear_space: "Q^Omega"
    nonnegative_cone: "Q_nonnegative^Omega"
    normalized_slice: "Delta_Omega={mu in Q_nonnegative^Omega | sum_x mu(x)=1}"
    terminology: "mu is a bookkeeping coefficient vector; Delta_Omega is not asserted to be a physical probability simplex"
  update:
    candidate_id: "SourceMatterBookkeepingUpdate_v1"
    symbol: "U_Omega"
    definition: "(U_Omega mu)(y)=sum_{x in Omega} mu(x) sum_{T in Tcal_x, t(T)=y} K_Omega(x,T)"
    equivalent_definition: "(U_Omega mu)(y)=sum_x mu(x) P_Omega(x,y)"
    iteration: "mu_(n+1)=U_Omega mu_n for n in N_0"
    iteration_semantics: "n is a formal composition counter only; it is not physical time, duration, causal order, or a measured step"

mathematical_checks:
  - check_id: "P7T02-MATH-CHECK-ROW-NORMALIZATION"
    statement: "Every enabled row is exactly normalized."
    hypotheses:
      - "Tcal_x is finite and nonempty."
      - "Each of its d_x members has weight 1/d_x."
    derivation:
      - "sum_{T in Tcal_x} K_Omega(x,T)=sum_{T in Tcal_x} 1/d_x"
      - "the finite sum has d_x terms"
      - "therefore the result is d_x/d_x=1"
    conclusion: "sum_{T in Tcal_x} K_Omega(x,T)=1"
    consequence_class: "new exact candidate-relative consequence"
    physical_conservation_claimed: false

  - check_id: "P7T02-MATH-CHECK-FINITE-CLOSURE"
    statement: "The update is a well-defined rational-linear endomorphism and preserves the nonnegative cone."
    derivation:
      - "Omega and every row are finite, so every defining sum is finite."
      - "All K_Omega coefficients are nonnegative rationals."
      - "Every target t(T) is in Omega."
      - "Thus U_Omega maps Q^Omega to Q^Omega and Q_nonnegative^Omega to Q_nonnegative^Omega."
    conclusion: "U_Omega is finite, closed on the declared bookkeeping domain, and positivity preserving."
    consequence_class: "new exact candidate-relative consequence"

  - check_id: "P7T02-MATH-CHECK-TOTAL-BOOKKEEPING-MASS"
    statement: "The update preserves the sum of bookkeeping coefficients."
    quantity: "B(mu)=sum_{x in Omega} mu(x)"
    derivation:
      - "B(U_Omega mu)=sum_y sum_x mu(x) sum_{T in Tcal_x,t(T)=y} K_Omega(x,T)"
      - "finite sums may be regrouped by x and then by all T in Tcal_x"
      - "row normalization gives B(U_Omega mu)=sum_x mu(x)"
    conclusion: "B(U_Omega mu)=B(mu); in particular U_Omega maps Delta_Omega to Delta_Omega."
    consequence_class: "new exact candidate-relative normalization consequence"
    prohibited_overread: "B is not physical mass, probability, energy, charge, or another empirical conserved quantity"

  - check_id: "P7T02-MATH-CHECK-SECTOR-SUPPORT"
    statement: "The update is block diagonal on the inherited P7-T01 sector fibers."
    inherited_input: "For every enabled T, Sec_src(t(T))=Sec_src(s(T)) because T is P7-T01 admissible."
    derivation:
      - "If P_Omega(x,y)>0, at least one enabled T has s(T)=x and t(T)=y."
      - "The inherited transition constraint gives Q(y)=Q(x) and D(y)=D(x)."
      - "Therefore no update coefficient crosses a (Q,D) sector fiber."
    sector_quantity: "B_sigma(mu)=sum_{x in Omega,Sec_src(x)=sigma} mu(x)"
    conclusion: "B_sigma(U_Omega mu)=B_sigma(mu) for every represented sector sigma."
    consequence_class:
      inherited: "pathwise Q and D preservation on enabled support"
      new: "sector-block closure and sector-resolved bookkeeping-mass preservation under U_Omega"
    explicit_nonconclusion: "No statement is made that M is transition invariant; no physical superselection or conservation law is established."

  - check_id: "P7T02-MATH-CHECK-SOURCE-PRESENTATION-EQUIVARIANCE"
    statement: "Transport of the control system along a compatible source-presentation isomorphism commutes with the kernel and update."
    hypotheses:
      - "g=(F_i,alpha,beta,phi,gamma) is a P7-T01 admissible source-presentation isomorphism."
      - "Omega_prime=g(Omega)."
      - "Tcal_prime=g(Tcal), including g(id_x)=id_(g x)."
      - "The induced maps x -> g x and T -> g T are bijections preserving source and target."
    derivation:
      - "The row map Tcal_x -> Tcal_prime_(g x) is bijective, hence d_(g x)=d_x."
      - "Thus K_Omega_prime(g x,g T)=1/d_(g x)=1/d_x=K_Omega(x,T)."
      - "Define (g_* mu)(g x)=mu(x); change variables through the finite bijections in the update sum."
    conclusion:
      kernel: "K_Omega_prime(g x,g T)=K_Omega(x,T)"
      update: "U_Omega_prime composed with g_* equals g_* composed with U_Omega"
    fixed_system_corollary: "If g is an automorphism preserving Omega and Tcal setwise, U_Omega commutes with its permutation action."
    consequence_class: "new exact candidate-relative naturality theorem using the inherited P7-T01 transport theorem"
    prohibited_overread: "not target covariance, diffeomorphism invariance, physical gauge symmetry, or observational equivalence"

factorization_and_interaction:
  disjoint_source_sum:
    definition: "For declared disjoint source systems S_1 and S_2, configurations and transitions combine componentwise as x_1 direct_sum x_2 and T_1 direct_sum T_2."
    admissibility_reason: "Boundary, continuity, defect, and Pi conditions hold componentwise on the direct sum."
  independent_control:
    exact_condition:
      configuration_set: "Omega=Omega_1 x Omega_2"
      enabled_rows: "Tcal_(x_1,x_2)=Tcal^1_(x_1) x Tcal^2_(x_2)"
      transition: "(T_1,T_2) acts componentwise"
    cardinality: "d_(x_1,x_2)=d^1_(x_1)d^2_(x_2)"
    kernel_derivation: "K_Omega((x_1,x_2),(T_1,T_2))=1/(d^1_(x_1)d^2_(x_2))=K_1(x_1,T_1)K_2(x_2,T_2)"
    update_conclusion: "U_Omega=U_1 tensor U_2 on decomposable bookkeeping vectors, extending linearly."
    classification: "exact candidate-relative independent-factorization theorem"
  interacting_control_criterion:
    definition: "A declared joint row is nonfactorizing when it is not the Cartesian product of its component row projections."
    exact_test: "Tcal_x is interacting_control iff Tcal_x is not equal to pr_1(Tcal_x) x pr_2(Tcal_x)."
    semantic_limit: "interacting_control is a mathematical enabled-row classification only; it is not evidence of a physical force, coupling, nonlocality, entanglement, or interaction."
  synchronized_nonfactorizing_witness:
    source_components:
      - "For i=1,2, use a copy of the P7-T01 two-vertex system with vertices u_i,v_i, links e_i and ell_i, partial_1 e_i=[v_i]-[u_i], partial_1 ell_i=0, C_2=0, A_int=B_def=Z, and chi(rho_i)=1."
    component_states:
      x_i: "one rho_i occupation at u_i with z_i=ell_i"
      y_i: "one rho_i occupation at v_i with z_i=ell_i"
      tau_i: "(x_i,e_i,0,Pi_(u_i to v_i),y_i)"
    joint_states:
      x: "x_1 direct_sum x_2"
      y: "y_1 direct_sum y_2"
      Omega_joint: "{x,y}"
    joint_rows:
      at_x: "{id_x,tau_1 direct_sum tau_2}"
      at_y: "{id_y}"
    admissibility_check:
      charge: "q(y)-q(x)=partial_1(e_1+e_2)"
      defect: "z(y)-z(x)=0=partial_2 0"
      source_only: "the joint Pi is the declared simultaneous componentwise occupation update"
    kernel_values:
      at_x: "K(x,id_x)=1/2 and K(x,tau_1 direct_sum tau_2)=1/2"
      at_y: "K(y,id_y)=1"
    nonfactorization_proof:
      - "The two component row projections at x are each {id_i,tau_i}."
      - "Their Cartesian product has four members, including the two single-component moves."
      - "The declared joint row has only id_x and the synchronized double move."
      - "Therefore the joint row is not Cartesian and its update is not U_1 tensor U_2."
    interpretation: "This witnesses an exact nonfactorizing source-control rule by stipulation; it does not derive a physical interaction."

