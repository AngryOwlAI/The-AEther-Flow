decision_basis:
  summary: "The scoped obstruction should not be inflated into theory closure, but it should also not be hidden behind another abstract selector obligation. A finite toy response target is the disciplined middle route: it makes the missing response semantics testable in a small source-side setting while keeping ontology adoption and benchmark claims blocked."
  conceptual_rationale:
    - "Human-gated ontology change is not yet required because a non-promotional constructive packet remains available."
    - "A controlled source extension may eventually be necessary, but immediate source-extension selection would risk treating missing response semantics as permission to add ontology."
    - "A finite toy target exposes whether response sign, scale, and token semantics can be coherently represented as source-side data before any canonical adoption."
    - "The target preserves the distinction between model scaffolding, ontology, and empirical benchmark recovery."
finite_toy_target_constraints:
  source_set: "A deliberately finite source set with explicit toy tags for orientation, normalization, and token semantics; tags are hypothetical draft/control scaffolding rather than canonical primitives."
  response_relation: "A response relation that records what the toy source explicitly provides and refuses to fill missing sign scale or token semantics by convention."
  metric_response_analogue: "A toy metric-response analogue used only as a consistency target, not as evidence for an effective Lorentzian metric."
  invariance_checks: "Check that arbitrary naming conventions do not change response content and that explicit source tags, not target-GR expectation, carry the response relation."
claim_boundary_preservation: "The route does not authorize canonical ontology edit, Resp_lc adoption, future source-extension impossibility, benchmark promotion, Gate Chair review, completed-derivation language, candidate reconstruction, or global theory rejection."
