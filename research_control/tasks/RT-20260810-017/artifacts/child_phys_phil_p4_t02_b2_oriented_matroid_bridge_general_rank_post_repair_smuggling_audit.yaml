intrinsic_rank_target_dimension_nonselection_lemma:
  payload_id: "PAYLOAD-RT017-PHIL-INTRINSIC-RANK-TARGET-DIMENSION-NONSELECTION"
  payload_type: "lemma"
  object_name: "intrinsic-rank target-dimension nonselection lemma"
  hypotheses:
    - "A:F^S->V is a supplied finite configuration with finite intrinsic rank r>=1."
    - "W_A=span_F{v_s:s in S}."
    - "All non-rank Bridge_OM definitions and typing repairs are held fixed."
    - "No independently justified interpretation map from Bridge_OM data to physical spacetime dimension is supplied."
  statement: "Bridge_OM can determine r as an invariant of a supplied configuration, but it cannot thereby select an ambient dimension or a physical spacetime dimension."
  argument:
    - "The rank is dim_F(W_A), invariant under the held-fixed presentation groupoid and independent of a chosen unused ambient complement."
    - "Restriction V*->W_A* is surjective, so the realized sign covectors are already determined on W_A."
    - "Kernels, positive circuits, ranks, column minors, compatible refinements, and embedded tame-path records depend on the columns in W_A, not on unused ambient directions."
    - "For every q>=0, embedding the same effective configuration into W_A direct_sum F^q leaves the fixed Bridge_OM data unchanged while changing ambient dimension."
    - "Physical spacetime dimension is not a variable or output of Bridge_OM. Identifying it with r would require a separate interpretation or source law absent from this packet."
  conclusion: "Intrinsic rank removes ambient-dimension preload but supplies no physical-dimension selector."
  nonimplication: "This lemma neither derives the supplied configuration nor shows that r is physically irrelevant in every future adopted bridge."
  burden_effect: "audits"
  claim_status: "draft/control"

