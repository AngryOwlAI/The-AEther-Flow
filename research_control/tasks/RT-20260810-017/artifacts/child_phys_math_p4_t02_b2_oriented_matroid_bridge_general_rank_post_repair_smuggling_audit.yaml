new_mathematical_payload:
  - payload_id: "NMP-RT017-MATH-001"
    payload_type: "lemma"
    object_name: "Effective-span embedding invariance and ambient-dimension nonselection"
    claim_status: "draft/control"
    source_path: "research_control/tasks/RT-20260810-017/artifacts/child_phys_math_p4_t02_b2_oriented_matroid_bridge_general_rank_post_repair_smuggling_audit.yaml"
    burden_effect: "audits"
    hypotheses:
      - "F is the fixed adequate exact field class and S is finite."
      - "A_W:F^S->W has image W and rank r>=1."
      - "j:W->V' is any injective linear embedding into a finite-dimensional ambient space."
    statement: >-
      For A_j=j composed with A_W, Bridge_OM(A_j) is canonically isomorphic to
      Bridge_OM(A_W). In particular, the embeddings j_m:W->W direct-sum F^m
      for arbitrary m>=0 produce identical bridge data in ambient dimensions
      r+m, so no function of Bridge_OM alone can recover the unused ambient
      dimension on all such embeddings.
    proof_steps:
      - "Injectivity gives ker(A_j)=ker(A_W) and rank(A_j)=r."
      - "The dual restriction j^*:(V')^*->W^* is surjective by finite-dimensional linear extension, so every evaluation sign pattern and strict-chamber witness on W extends to V'."
      - "Positive circuits and the total branch depend only on the common kernels and coefficient signs."
      - "Coherently embedded presentation, refinement, and tame-path data have the same oriented columns, ranks, minor-zero strata, and transported certificate fibers."
      - "Taking m=0 and m=1 gives the same bridge output with different ambient dimensions, contradicting any purported ambient-dimension recovery function."
    intrinsic_rank_caveat: >-
      The bridge can retain the intrinsic rank r; the lemma does not erase
      algebraic rank. Because the theorem admits every finite r and supplies no
      law mapping r to physical spacetime dimension, interpreting r physically
      would be an additional premise outside Bridge_OM.
    forbidden_overread: "This does not prove that no future independent source law can select physical dimension."
  - payload_id: "NMP-RT017-MATH-002"
    payload_type: "theorem"
    object_name: "Support-minimal positive-circuit nullity and sharp bound audit"
    claim_status: "draft/control"
    source_path: "research_control/tasks/RT-20260810-017/artifacts/child_phys_math_p4_t02_b2_oriented_matroid_bridge_general_rank_post_repair_smuggling_audit.yaml"
    burden_effect: "audits"
    statement: >-
      If alpha_C>0 and A_C alpha_C=0 on an inclusion-minimal support C, then
      dim ker(A_C)=1, rank(A_C)=card(C)-1<=r, and card(C)<=r+1. The bound is
      sharp for A_r^-=[e_1,...,e_r,-sum_i e_i] at every finite r>=1.
    proof_steps:
      - "Assume beta in ker(A_C) is independent of alpha_C and replace beta by -beta if necessary so some beta_i>0."
      - "Set t=min{alpha_i/beta_i:beta_i>0}; this finite minimum exists in any ordered field and is positive."
      - "Then gamma=alpha_C-t beta is nonzero, nonnegative, in ker(A_C), and has at least one zero coordinate. Its nonzero support has a strictly positive dependence and is a proper subset of C, contradicting minimality."
      - "Thus nullity is one and rank-nullity gives the bound."
      - "For A_r^-, the all-one coefficient vector is positive, deleting the last column leaves a basis, and deleting e_j leaves the negative-sum column with a unique nonzero j component; hence every proper subset is independent and support r+1 is sharp."
    target_import_check: "The proof uses only finite support, ordered-field arithmetic, rank-nullity, and intrinsic rank."
    forbidden_overread: "A combinatorial support bound is not a sector census, causal cone, empirical law, or metric statement."
  - payload_id: "NMP-RT017-MATH-003"
    payload_type: "theorem"
    object_name: "Finite-fixture rank-cap and physical-dimension nonidentifiability"
    claim_status: "draft/control"
    source_path: "research_control/tasks/RT-20260810-017/artifacts/child_phys_math_p4_t02_b2_oriented_matroid_bridge_general_rank_post_repair_smuggling_audit.yaml"
    burden_effect: "audits"
    statement: >-
      Let F_test be any nonempty finite fixture family and let R be its maximum
      intrinsic rank. For every integer N>=R, the capped domain H_N={A:1<=rank(A)<=N}
      and the arbitrary-finite-rank domain H_infinity have identical domain
      membership and identical fixed Bridge_OM outputs on F_test. Therefore a
      finite conformance trace identifies neither a unique finite cap nor the
      absence of a cap, and it supplies no physical-dimension observation.
    proof_steps:
      - "Every fixture rank is at most R, so every fixture belongs to every H_N with N>=R and to H_infinity."
      - "The candidate map is held fixed, so its output on a fixture does not depend on which of those supersets is declared as the global theorem domain."
      - "The infinitely many hypotheses H_R,H_(R+1),... and H_infinity therefore have the same restriction to F_test."
      - "No finite trace can distinguish hypotheses whose restrictions to every observed fixture are equal."
      - "The fixture labels deny an empirical or physical observation map, so their formal ranks cannot identify a physical dimension."
    exact_rt017_window: "For tested ranks 1 through 8, all caps N>=8 agree; the exact model samples N=8 through 16 and returns one common membership vector."
    crossing_control_consequence: >-
      Rank-five and rank-six controls demonstrate exact behavior beyond the old
      cap and expose that four was not a mathematical boundary. They do not by
      themselves prove unbounded scope; the arbitrary-rank algebraic proof does.
    forbidden_overread: "This is a finite-evidence nonidentifiability theorem, not a global no-go theorem or future-extension impossibility."
  - payload_id: "NMP-RT017-MATH-004"
    payload_type: "lemma"
    object_name: "Nonphysical conformance-quarantine sufficiency criterion"
    claim_status: "draft/control"
    source_path: "research_control/tasks/RT-20260810-017/artifacts/child_phys_math_p4_t02_b2_oriented_matroid_bridge_general_rank_post_repair_smuggling_audit.yaml"
    burden_effect: "audits"
    statement: >-
      A bounded fixture suite is quarantined from theorem-domain and target
      authority when the general theorem has an independent symbolic proof,
      every fixture is explicitly classified as nonphysical conformance only,
      theorem-domain and target/source/physical/empirical evidence flags are
      false, and no downstream status is inferred from fixture numerals,
      branches, counts, or validation success.
    candidate_check:
      independent_arbitrary_rank_proof: true
      every_bounded_fixture_explicitly_nonphysical: true
      theorem_domain_restriction_false: true
      target_dimension_evidence_false: true
      source_ontology_evidence_false: true
      empirical_evidence_false: true
      physical_or_p7_evidence_false: true
      validation_or_workflow_authority_excluded: true
      downstream_status_unchanged: true
    conclusion: "The repaired candidate satisfies the criterion for this focused local audit."
