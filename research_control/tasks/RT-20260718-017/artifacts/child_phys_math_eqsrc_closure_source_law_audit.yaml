formal_findings:
  - finding_id: "FM-EQSRC-CLOSURE-001"
    severity: "blocking"
    subject: "acceptance_direction"
    observation: "The fail-closed clause has the logical direction Accept_src(w) implies that typing, provenance, ledger congruence, negative controls, and no-target checks pass."
    consequence: "It does not state the converse and cannot create an accepted witness from successful checks."
  - finding_id: "FM-EQSRC-CLOSURE-002"
    severity: "blocking"
    subject: "reflexivity"
    observation: "The identity clause supplies a typed token 1_A in Cert_src(A,A), but it does not assert Accept_src(1_A)."
    consequence: "The proof's phrase accepted identity token is stronger than the stated clause."
  - finding_id: "FM-EQSRC-CLOSURE-003"
    severity: "blocking"
    subject: "symmetry"
    observation: "The inverse clause says that an inverse-provenance token may be accepted only if specified conditions hold. This is a necessary condition on acceptance, not an existence or totality assertion for an accepted inverse of every accepted witness."
    consequence: "An accepted A-to-B witness may coexist with no accepted B-to-A witness while every written only-if condition remains satisfied."
  - finding_id: "FM-EQSRC-CLOSURE-004"
    severity: "blocking"
    subject: "transitivity"
    observation: "The composition clause says that a composite token may be accepted only when its conditions hold. It does not assert that every composable pair of accepted witnesses has an accepted composite."
    consequence: "Accepted A-to-B and B-to-C witnesses may coexist with no accepted A-to-C witness."
  - finding_id: "FM-EQSRC-CLOSURE-005"
    severity: "supporting"
    subject: "candidate_internal_evidence"
    observation: "The candidate's own missing-inverse and missing-composition branches explicitly record the same failures."
    consequence: "Those branches are consistent with the written admissibility filters but inconsistent with the proposition's unqualified proof unless stronger closure hypotheses are added."
  - finding_id: "FM-EQSRC-CLOSURE-006"
    severity: "nonblocking"
    subject: "associativity"
    observation: "Associativity compatibility is useful for a certificate algebra but is not needed to prove that the binary relation is transitive."
    consequence: "It may remain as a separate coherence obligation, but it cannot substitute for accepted-composite existence."

minimal_source_only_models:
  - model_id: "MODEL-EQSRC-REFLEXIVITY-001"
    tested_property: "reflexivity"
    objects:
      - "A"
    certificate_data:
      - "Cert_src(A,A) contains the typed identity token 1_A."
      - "Identity, inverse, and composition token data can be chosen ledger-congruent and source-only."
    accepted_witnesses: []
    only_if_conditions: "Satisfied vacuously because no token is accepted."
    induced_relation: "empty relation on {A}"
    failure: "A is not related to A, so reflexivity fails."
    target_data_used: false
  - model_id: "MODEL-EQSRC-SYMMETRY-001"
    tested_property: "symmetry"
    objects:
      - "A"
      - "B"
    certificate_data:
      - "Accepted source-only identity tokens 1_A and 1_B are present."
      - "An accepted source-only witness w_AB is in Cert_src(A,B)."
      - "A typed inverse token u_BA may exist in Cert_src(B,A), with a ledger-congruent double-inverse token, but u_BA is not accepted."
    accepted_witnesses:
      - "1_A"
      - "1_B"
      - "w_AB"
    only_if_conditions: "The inverse acceptance implication is satisfied because u_BA is not accepted."
    induced_relation: "A is related to B, while B is not related to A."
    failure: "Symmetry fails even when inverse-token existence is granted, because accepted-inverse totality is absent."
    target_data_used: false
  - model_id: "MODEL-EQSRC-TRANSITIVITY-001"
    tested_property: "transitivity"
    objects:
      - "A"
      - "B"
      - "C"
    certificate_data:
      - "Accepted source-only identities and accepted inverse pairs are present for A-to-B and B-to-C."
      - "A typed composition token c_AC may exist in Cert_src(A,C), but c_AC is not accepted."
      - "All accepted tokens preserve the declared source ledger and satisfy the no-target guard."
    accepted_witnesses:
      - "1_A"
      - "1_B"
      - "1_C"
      - "w_AB"
      - "u_BA"
      - "v_BC"
      - "u_CB"
    only_if_conditions: "The composition acceptance implication is satisfied because c_AC is not accepted."
    induced_relation: "A is related to B and B is related to C, while A is not related to C."
    failure: "Transitivity fails even with reflexive and symmetric accepted subrelations, because accepted-composite totality is absent."
    target_data_used: false

repair_obligations:
  - obligation_id: "REPAIR-EQSRC-CLOSURE-IDENTITY-001"
    requirement: "State explicitly that Accept_src(1_A) holds for every A in the declared source family, subject to the closed source grammar."
  - obligation_id: "REPAIR-EQSRC-CLOSURE-INVERSE-001"
    requirement: "For every accepted w in Cert_src(A,B), require existence of inverse provenance and an accepted inverse witness u in Cert_src(B,A), with source-only typing, ledger congruence, and no-target preservation."
  - obligation_id: "REPAIR-EQSRC-CLOSURE-COMPOSITION-001"
    requirement: "For every composable pair of accepted witnesses, require existence of an accepted source-side composite in Cert_src(A,C), with ledger congruence and no-target preservation."
  - obligation_id: "REPAIR-EQSRC-CLOSURE-ACCEPTANCE-001"
    requirement: "Keep fail-closed necessary checks, but do not infer accepted witnesses from them. Add explicit accepted-witness existence clauses or a separately justified acceptance-completeness axiom."
  - obligation_id: "REPAIR-EQSRC-CLOSURE-GRAMMAR-001"
    requirement: "Define the allowed source vocabulary and formation rules for ledger annotations, proxy incidence, negative controls, provenance, congruence, and acceptance so target or process authority cannot enter through an undefined source-labeled predicate."
  - obligation_id: "REPAIR-EQSRC-CLOSURE-THEOREM-001"
    requirement: "Restate the proposition with the strengthened accepted-closure hypotheses and make each proof step cite the corresponding existence clause."

