construction_theorems:
  theorem_count: 5
  theorems:
    - theorem_id: "THM-RT005-PHIL-001"
      name: "Unoriented projective conormal descent"
      statement: "If q_j=phi_ji composed q_i with phi_ji a one-dimensional local diffeomorphism, then [dq_j]=[dq_i] on overlaps, so the local projective conormals glue to a unique smooth global section ell."
      proof: "The chain rule gives dq_j=phi_prime_ji(q_i)dq_i. The derivative is nowhere zero, so both covectors span the same line even when the derivative is negative. Equality on overlaps and the transition cocycle give unique sheaf gluing of the smooth projective sections."
      falsifier: "An overlap component where q_j is not a reparametrization of q_i, where phi_prime_ji vanishes, or where the triple cocycle fails."
    - theorem_id: "THM-RT005-PHIL-002"
      name: "Proper line-stabilizer frame reduction"
      statement: "A smooth cotangent line subbundle L defines a nonempty smooth principal H_line subbundle P_H of Fr(M), and H_line is a proper subgroup of GL(4,R)."
      proof: "At every x choose a frame u carrying the reference covector line to L_x. Frames satisfying this condition form one right H_line torsor and vary smoothly in local trivializations of L. A linear map whose cotangent action sends span(e^0) to span(e^0+e^1) lies outside H_line, proving properness."
      falsifier: "A point where L_x vanishes or is nonsmooth, an empty adapted-frame fibre, failure of the right H_line torsor law, or equality H_line=GL(4,R)."
    - theorem_id: "THM-RT005-PHIL-003"
      name: "Restriction refinement gluing and proposal naturality"
      statement: "The descended line and reduction restrict to opens, are unchanged by compatible cover refinement and local label reparametrization, glue from compatible local proposal data, and transform naturally under typed foliation-preserving proposal morphisms."
      proof: "Restriction commutes with differentiation and projectivization. Reparametrization multiplies dq by a nowhere-zero scalar, leaving its line fixed. Compatible local sections equal on overlaps and glue uniquely. For q_prime_a composed f=psi_ai composed q_i, the chain rule gives f_star L_prime=L, and the induced frame map transports P_H."
      falsifier: "A restriction that destroys submersion status, a refinement without compatible reparametrizations, unequal projective lines on an overlap, or a claimed morphism lacking the displayed compatibility equation."
    - theorem_id: "THM-RT005-PHIL-004"
      name: "Same-manifold K_star nonfactorization witness"
      statement: "Bridge_PCR does not factor through frozen unchanged K_star as an objectwise classifier."
      proof: "On M=R4 let F_A have the single global label q_A(x)=x^0 and F_B have q_B(x)=x^1. Both forget to the same M and therefore have the same K_star(M). Their bridge images are the distinct constant projective lines [dx^0] and [dx^1]. A map factoring only through K_star(M) would assign equal outputs, contradiction."
      falsifier: "Equality of [dx^0] and [dx^1], a difference in the underlying K_star assignment, or a factorization domain that legitimately retains the q-atlas rather than only frozen K_star."
    - theorem_id: "THM-RT005-PHIL-005"
      name: "Bounded proposal-only bridge construction"
      statement: "The tuple consisting of the declared foliation atlas, descended projective conormal, proper line-stabilizer reduction, and Bridge_PCR is a nonconstant target-free source-extension candidate in the proposal category."
      proof: "The first three theorems construct and naturalize the object; the fourth proves nonconstancy and nonfactorization against unchanged K_star. Every primitive is declared source-side before outcomes and no metric, Lorentz group, cone, time direction, empirical label, or desired P4 answer appears in the definitions."
      falsifier: "Any failed formation, descent, properness, naturality, nonfactorization, or source-purity premise named above changes the result to a precise obstruction or invalid-under-boundary result."

exact_fixtures_and_falsifiers:
