  fixtures:
    - fixture_id: "FIX-01"
      name: "Sign-reversal presentation invariance"
      data: "M=R4, q=x^0, and q_prime=-x^0."
      expected: "The projective conormal line is [dx^0] in both presentations, so no coorientation or time direction is selected."
      falsifier: "If [dx^0] differs from [-dx^0], projective descent is malformed."
    - fixture_id: "FIX-02"
      name: "Nonlinear local reparametrization invariance"
      data: "q_prime=phi(q) with phi(s)=s+s^3 and phi_prime(s)=1+3s^2 greater than zero."
      expected: "dq_prime is a nowhere-zero scalar multiple of dq and defines the same projective line."
      falsifier: "A point where phi_prime vanishes or the projective lines differ."
