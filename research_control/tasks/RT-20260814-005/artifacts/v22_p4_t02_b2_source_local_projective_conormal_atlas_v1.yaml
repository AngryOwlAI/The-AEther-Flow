  forgetful_map: "Forget sends the proposal object to the underlying smooth source arena M"
  frozen_classifier_map: "K_star depends only on Forget and remains unchanged"

descent_theorem:
  identity: "THM-V22-P4T02-B2-PROJECTIVE-CONORMAL-DESCENT-001"
  statement: "Because dq_i equals gamma_ij prime of q_j times dq_j and the derivative is nowhere zero, the local differential lines agree on every overlap and satisfy the declared cocycle; therefore they glue uniquely to L_q."
  proof_status: "exact_conditional_proof"

proper_reduction_theorem:
  identity: "THM-V22-P4T02-B2-PROJECTIVE-CONORMAL-PROPER-REDUCTION-001"
  statement: "The stabilizer H of a covector line has dimension thirteen and codimension three in GL(4,R); the frames mapping L_q to ell_0 form a principal H-subbundle."
  proof_status: "exact_conditional_proof"

nonfactorization_theorem:
  identity: "THM-V22-P4T02-B2-PROJECTIVE-CONORMAL-KSTAR-NONFACTORIZATION-001"
  statement: "On the same M=R4 the q=x0 and r=x0+x1 presentations have the same underlying smooth source and hence the same frozen K_star but distinct projective conormal lines; therefore Bridge_PCR cannot factor through K_star."
  proof_status: "exact_fixture_proof"

