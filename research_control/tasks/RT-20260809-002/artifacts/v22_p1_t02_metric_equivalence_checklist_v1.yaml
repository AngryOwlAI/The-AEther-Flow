schema_id: "v22_p1_t02_metric_equivalence_checklist_v1"
plan_task_id: "P1-T02"
task_id: "RT-20260809-002"
authority_status: "draft_control_science_audit"
decision_vocabulary:
  - "not_metric_equivalent"
  - "metric_adjacent"
  - "metric_bearing"
  - "metric_completing"
  - "ambiguous_fail_closed"
definitions:
  metric_bearing: "Data D are metric-bearing when a natural source-independent recovery map from D determines a Lorentzian conformal class without additional physical input."
  metric_completing: "Data D are metric-completing when they determine a Lorentzian metric including scale, possibly after pairing an explicitly declared conformal class with independently supplied normalization data."
  provenance_rule: "If metric-bearing or metric-completing data are assumed rather than derived from independently registered source fields and laws, the result is postulation or reconstruction and receives no emergence credit."
decision_algorithm:
  - step_id: "ME-01"
    question: "Are the data typed entirely on the source side with exact provenance?"
    fail_result: "ambiguous_fail_closed"
  - step_id: "ME-02"
    question: "Can a Lorentzian null cone or conformal class be recovered without new physical input?"
    yes_result: "metric_bearing"
  - step_id: "ME-03"
    question: "Can normalization or volume data also fix the conformal scale?"
    yes_result: "metric_completing"
  - step_id: "ME-04"
    question: "Were every metric-bearing ingredient and recovery hypothesis independently derived from source fields and laws?"
    no_effect: "postulation_or_reconstruction_no_emergence_credit"
  - step_id: "ME-05"
    question: "Does any coefficient choice use target metric values, benchmark solutions, target atlas, or observational predictions?"
    yes_effect: "forbidden_target_import_hard_fail"
cases:
  - case_id: "coframe"
    input: "A pointwise invertible coframe e^I_a together with a fixed internal Lorentzian form eta_IJ."
    recovery: "g_ab = eta_IJ e^I_a e^J_b"
    classification: "metric_completing"
    hypothesis_boundary: "A bare coframe without an internal bilinear form is only metric-adjacent; the standard Lorentzian coframe package includes eta and therefore completes a metric."
    assumption_effect: "forbidden_target_import unless e and eta have independent source derivations"
  - case_id: "constitutive_tensor"
    input: "A local linear constitutive tensor with an explicitly proved closure/no-birefringence condition whose Fresnel quartic is the square of one nondegenerate Lorentzian quadratic factor."
    recovery: "Fresnel polynomial P(k) = (Q^{ab} k_a k_b)^2 recovers the conformal class [Q^{-1}]."
    classification: "metric_bearing"
    hypothesis_boundary: "A generic constitutive tensor may be birefringent, degenerate, or nonmetric and is ambiguous until the recovery hypotheses are proved; dilaton or volume normalization can complete scale."
    assumption_effect: "forbidden_target_import when the single cone or constitutive coefficients are assumed or target-matched"
  - case_id: "quadratic_form"
    input: "A nondegenerate symmetric Lorentzian quadratic form Q on each cotangent or tangent space."
    recovery: "Q is an inverse metric or metric after the declared variance convention."
    classification: "metric_completing"
    hypothesis_boundary: "If only the zero set of Q is retained, the result is a conformal class and is metric-bearing rather than scale-complete."
    assumption_effect: "forbidden_target_import unless Q is independently source-derived"
  - case_id: "principal_polynomial"
    input: "A gauge- and constraint-reduced principal polynomial with one universal nondegenerate Lorentzian quadratic characteristic factor, considered up to positive multiplication."
    recovery: "The characteristic zero set determines a Lorentzian conformal class."
    classification: "metric_bearing"
    hypothesis_boundary: "Higher-degree, multicone, sector-dependent, degenerate, or unreduced polynomials are ambiguous and do not establish one physical cone."
    assumption_effect: "eligible only when the polynomial is derived from source dynamics before comparison with GR"
  - case_id: "volume_structure"
    input: "A nowhere-vanishing orientation-compatible volume density omega on a four-dimensional source vector bundle."
    recovery: "No conformal class follows from omega alone. For g_s = diag(-exp(2s), exp(-2s), 1, 1), det(g_s)=-1 for every s while g_s and g_r are not conformally equivalent under the identity map for s != r."
    classification: "not_metric_equivalent"
    hypothesis_boundary: "Volume is metric-adjacent debt. Given a Lorentzian conformal class [h], the unique positive factor Omega satisfying vol_(Omega^2 h)=omega completes scale; in four dimensions Omega=(omega/vol_h)^(1/4)."
    assumption_effect: "volume alone cannot earn metric emergence credit; volume plus an assumed conformal class is metric-completing postulation"
theorems:
  - theorem_id: "V22-P1-T02-METRIC-RECOVERABILITY-CLASSIFICATION-THEOREM-V1"
    statement: "Coframe-plus-eta and nondegenerate Lorentzian quadratic data are metric-completing; a universal single-cone characteristic factor is metric-bearing; any assumed such datum reclassifies the result as postulation or reconstruction unless its own source provenance is derived."
    proof_status: "proved_within_stated_algebraic_hypotheses"
  - theorem_id: "V22-P1-T02-VOLUME-CONFORMAL-SCALE-COMPLETION-V1"
    statement: "In dimension n, a positive volume density and Lorentzian conformal class determine a unique positive conformal factor; for n=4 the factor is the fourth root of the volume-density ratio."
    proof_status: "proved_within_stated_pointwise_hypotheses"
countermodels:
  - countermodel_id: "V22-P1-T02-SAME-VOLUME-LORENTZIAN-NON-EQUIVALENCE-COUNTERFAMILY-V1"
    parameter: "s in R"
    family: "g_s = diag(-exp(2s), exp(-2s), 1, 1)"
    determinant: "-1"
    conclusion: "A volume density alone does not determine a Lorentzian conformal class."
    scope: "pointwise linear-algebra counterfamily; not a physical spacetime model or global no-go theorem"
result:
  status: "PASS_METRIC_EQUIVALENCE_TEST_FORMALIZED"
  required_case_count: 5
  classified_case_count: 5
  ambiguous_cases_fail_closed: true
  emergence_credit_from_assumed_metric_bearing_data: false
  ontology_or_metric_adoption_count: 0
