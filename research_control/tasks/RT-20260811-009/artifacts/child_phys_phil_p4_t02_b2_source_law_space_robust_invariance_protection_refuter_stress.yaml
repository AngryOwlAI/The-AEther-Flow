new_mathematical_and_conceptual_payload:
  payload_count: 5
  items:
    - payload_id: "PAYLOAD-RT009-FIXED-RADIUS-VERSUS-FAMILY-INFIMUM"
      payload_type: "exact_family_uniformity_obstruction_theorem"
      statement: "For D_epsilon on the half-line, the distance in the constant-law sup norm from F_epsilon to the complement of strict tangent inclusion is exactly epsilon, while the family infimum of those distances over positive rational epsilon is zero."
      proof_obligations:
        - "Show that |u|<epsilon implies epsilon+u>0."
        - "Exhibit u=-epsilon as a zero-margin strict failure."
        - "Use epsilon_n=1/n to prove infimum zero while every finite n member passes."
      proof: "The only active conormal is dx, so the residual is epsilon+u. Positivity holds precisely for u>-epsilon; the centered open ball of greatest radius is epsilon. The sequence epsilon_n is positive and converges to zero."
      significance: "The proposal has local openness at every fixed positive-margin tuple but no family-uniform protection without a new source-derived lower bound."
      falsifier: "A current-ontology theorem defining the admissible family independently and proving inf m(epsilon)>0 would defeat this obstruction on that family."
    - payload_id: "PAYLOAD-RT009-SHARP-VARIATION-ENLARGEMENT-THRESHOLD"
      payload_type: "exact_threshold_lemma"
      statement: "For Delta_alpha={-alpha*epsilon}, strict protection holds exactly for alpha<1, reaches strict-failure tangency at alpha=1, and fails weak tangency for alpha>1."
      proof_obligations:
        - "Evaluate dx[F_epsilon-alpha*epsilon]=(1-alpha)*epsilon."
        - "Separate positive, zero, and negative residual cases."
      proof: "Because epsilon>0, the sign of the residual is the sign of 1-alpha. The symmetric interval control has the same worst member."
      significance: "An admissibility cutoff below one is mathematical data, not something the pass verdict may select after the fact."
      falsifier: "An independently source-derived Delta law with a proved strict bound alpha<=alpha_*<1 would close this branch without changing the fixed theorem."
    - payload_id: "PAYLOAD-RT009-COMPLETE-TRANSPORT-ORIENTATION-SEPARATION"
      payload_type: "typed_transport_discriminator"
      statement: "Complete reflection pushforward preserves the strict residual, whereas reversing K while retaining the old vector field fails; only the former is an EqSrc comparison."
      proof_obligations:
        - "Push forward K, F, Delta, and the conormal under g(x)=-x."
        - "Compute the complete and incomplete residuals separately."
      proof: "The transported conormal and velocity are both negated, so their pairing remains epsilon. Negating only the conormal changes the pairing to -epsilon."
      significance: "The result protects covariance from a false refutation while proving that covariance itself supplies no orientation-selection law."
      falsifier: "A defect in the typed full-tuple pushforward or a failure of residual preservation under an admitted coherent arrow would refute the preserved transport claim."
    - payload_id: "PAYLOAD-RT009-SAME-SLICE-TRANSVERSE-NONSELECTION"
      payload_type: "exact_dimensional_extension_pair"
      statement: "Two C1 lifts agreeing with the passing base law on z=0 have opposite strict-invariance verdicts on the bounded product K'."
      proof_obligations:
        - "Evaluate dx on the x-face for both lifts."
        - "Evaluate -dz at z=+1 and +dz at z=-1."
        - "Check all intersections of active faces."
      proof: "Both lifts have x residual epsilon. F^- gives transverse residual nu at each transverse face; F^+ gives -nu at each. At corners the corresponding face results hold simultaneously."
      significance: "A lower-dimensional protected slice cannot select its full-state continuation."
      falsifier: "A current-ontology transverse-closure theorem uniquely deriving the inward lift and excluding the escaping lift on independent grounds would repair this scoped debt."
    - payload_id: "PAYLOAD-RT009-MODAL-STRENGTH-LADDER"
      payload_type: "conceptual_nonimplication_theorem"
      statement: "The ordered claims actual-tuple conditional invariance, local openness at fixed margin, uniform family robustness, source derivation and epistemic selection, and physical or empirical universality have strictly increasing premise burdens; none of the upward implications is licensed here."
      exact_separators:
        - "D_epsilon proves local openness while the epsilon_n family defeats uniformity."
        - "D1, D2, and D3 prove that classifier syntax and verdict do not invert to a selected root orbit."
        - "The formal codomain contains no physical or empirical interpretation map."
      significance: "This blocks the category error of treating mathematical openness as source derivation or physical robustness while preserving the genuine local theorem."
      falsifier: "A typed chain of independently proven source maps establishing each upward implication, followed by authorized physical and empirical interpretation, would defeat the corresponding separator."

