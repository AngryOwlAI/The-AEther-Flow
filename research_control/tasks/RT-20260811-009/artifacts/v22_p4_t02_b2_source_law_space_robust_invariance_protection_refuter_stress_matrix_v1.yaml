stress_branches:
  - branch_id: "STRESS-01-FIXED-MARGIN-OPENNESS"
    input: "D_epsilon=(R,R_ge_0,{F_epsilon=epsilon},{0},Id) with fixed epsilon>0 and scalar field perturbation delta"
    exact_result: "The boundary residual is epsilon. Every |delta|<epsilon preserves strict positivity; delta=-epsilon reaches zero margin and delta<-epsilon is outward."
    disposition: "fixed_positive_margin_tuple_is_locally_robust"
  - branch_id: "STRESS-02-FAMILY-MARGIN-COLLAPSE"
    input: "The same D_epsilon family as epsilon decreases to zero"
    exact_result: "Every epsilon>0 passes with margin epsilon, while D_0 fails strict inclusion. The family converges uniformly in every compact-open Ck seminorm and has no positive uniform margin."
    disposition: "candidate_supplies_no_family_wide_protection_radius"
  - branch_id: "STRESS-03-NESTED-VARIATION-ENLARGEMENT"
    input: "F=epsilon and Delta_alpha=[-alpha*epsilon,+alpha*epsilon]"
    exact_result: "The worst boundary residual is (1-alpha)*epsilon: strict pass for alpha<1, zero-margin strict failure for alpha=1, and outward failure for alpha>1."
    disposition: "variation_bound_must_be_independently_selected"
  - branch_id: "STRESS-04-ORIENTATION-TRANSPORT"
    input: "Reflection y=-x from K=x>=0 with F=+1"
    exact_result: "Complete transport gives K'=y<=0, F'=-1, inward conormal -dy, and residual +1. Reversing K while holding F=+1 gives residual -1 and is a different root tuple, not an EqSrc transport."
    disposition: "covariance_preserves_but_does_not_select_orientation"
  - branch_id: "STRESS-05-SAME-SLICE-PRODUCT-LIFTS"
    input: "K'=R_ge_0 x [-1,1] and F_minus=(epsilon,-nu*z) versus F_plus=(epsilon,+nu*z)"
    exact_result: "Both lifts agree with (epsilon,0) on z=0. F_minus has transverse residuals (+nu,+nu) and passes; F_plus has (-nu,-nu) and fails."
    disposition: "reduced_slice_does_not_select_full_state_lift"
  - branch_id: "STRESS-06-TRANSVERSE-MARGIN-THRESHOLD"
    input: "The passing lift F=(epsilon,-lambda*z+eta) on R_ge_0 x [-rho,rho]"
    exact_result: "The lower and upper transverse residuals are lambda*rho+eta and lambda*rho-eta. Strict protection holds exactly when |eta|<lambda*rho, reaches zero at equality, and fails beyond."
    disposition: "each_full_state_lift_needs_its_own_protected_margin"
  - branch_id: "STRESS-07-CONSTANT-TRANSVERSE-DRIFT"
    input: "F=(epsilon,eta) on R_ge_0 x [-rho,rho]"
    exact_result: "The two transverse residuals are eta and -eta, so no constant eta strictly protects both faces; eta=0 is tangent and non-strict."
    disposition: "dimensional_extension_requires_new_inward_law_structure"
  - branch_id: "STRESS-08-NONTRIVIAL-EQSRC-DEMAND"
    input: "Theta={0,1}, F_0=1, F_1=2 on R_ge_0, with both individual laws passing"
    exact_result: "The identity-only groupoid is automatic. An identity-state-map parameter swap is incoherent because F_1 differs from F_0, while a state scaling arrow can be coherent. RobInv selects neither arrow class."
    disposition: "nontrivial_presentation_coherence_is_extra_unselected_structure"
  - branch_id: "STRESS-09-ROOT-ORBIT-NONSELECTION"
    input: "RT008's passing dimension-one and dimension-two root tuples"
    exact_result: "Both pass but cannot share a C1 presentation orbit because ambient dimension is invariant. Stress results therefore cannot be inverted into a unique root family."
    disposition: "root_selection_debt_preserved"
  - branch_id: "STRESS-10-FROZEN-ROUTE-CONTROLS"
    input: "All five inherited frozen candidate families"
    exact_result: "No shared tau, repaired Q_ray, common-character or holonomy law, oriented-matroid bridge, or signed-cubic selector is used to choose roots, margins, variations, lifts, orientations, or arrows."
    disposition: "all_inherited_freezes_preserved"

new_mathematical_payload:
  - payload_id: "MATH-RT009-FIXED-MARGIN-STABILITY"
    payload_type: "theorem"
    statement: "For a fixed boundary residual margin m>0, every perturbation whose active-conormal residual norm is less than m preserves strict robust invariance; the distance to the scalar constant-field failure boundary is exactly m."
  - payload_id: "MATH-RT009-FAMILY-UNIFORMITY"
    payload_type: "obstruction"
    statement: "The family D_epsilon passes for every epsilon>0 but converges to a zero-margin strict failure, so the candidate predicate supplies no root-family-uniform protection radius even though each fixed member is locally open."
  - payload_id: "MATH-RT009-VARIATION-THRESHOLD"
    payload_type: "theorem"
    statement: "For the nested compact variation family Delta_alpha=[-alpha*epsilon,+alpha*epsilon], the exact pass boundary is alpha=1 and the worst residual is (1-alpha)*epsilon."
  - payload_id: "MATH-RT009-FULL-STATE-LIFT-NONSELECTION"
    payload_type: "countermodel"
    statement: "Two product lifts agreeing exactly on the original embedded slice have opposite strict-invariance verdicts; an independently supplied inward transverse law and margin are necessary for full-state protection."
  - payload_id: "MATH-RT009-GROUPOID-DEMAND-SEPARATION"
    payload_type: "obstruction"
    statement: "Two individually passing generators need not descend under a demanded nontrivial parameter-swap arrow, while a different scaled state arrow may work; classifier truth does not choose the presentation groupoid."

