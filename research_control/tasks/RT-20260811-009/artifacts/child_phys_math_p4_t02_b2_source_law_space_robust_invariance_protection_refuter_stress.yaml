new_mathematical_payload:
  - payload_id: "NMP-RT009-CHILD-MATH-001"
    payload_type: "theorem"
    name: "Fixed-fibre openness and family-uniformity obstruction theorem"
    hypotheses:
      - "For epsilon>0, D_epsilon has X=R, K=R_ge_0, rho=x, F_epsilon=epsilon, Delta={0}, and identity EqSrc."
      - "Boundary-velocity perturbations are measured by Hausdorff distance d_boundary on nonempty compact subsets of R."
    statement: "Every D_epsilon passes and is open in its fixed K and EqSrc law-variation fibre: d_boundary(W,{epsilon})<epsilon implies W is contained in (0,infinity), and d_boundary(W,{epsilon})<=epsilon/2 gives residual at least epsilon/2. Nevertheless epsilon_n=1/n gives passing tuples with inf_n m_epsilon_n=0. For every proposed absolute radius r>0 choose n with 2/n<r; replacing Delta={0} by Delta_2={-2/n} changes the boundary velocity from 1/n to -1/n at Hausdorff distance 2/n<r and fails even weak tangency. Hence the candidate typing alone yields no positive family-uniform protection radius."
    proof: "At the only boundary point, Int T_K(0)=(0,infinity) and the unperturbed velocity is epsilon. A Hausdorff perturbation smaller than epsilon cannot reach zero. The sequence and the Delta_2 perturbation give the exact zero-infimum and arbitrary-radius counterexample."
    compact_parameter_corollary: "If a single compact parameter family contains epsilon_n and joint continuity extends it to epsilon=0, then the limit generator has zero boundary residual and the declared strict relation fails at that parameter."
    scope: "source_extension_candidate"
    novelty: "Quantifies both honest local stability and exact failure of any candidate-derived family-wide absolute margin; neither RT007 nor RT008 supplied this uniformity result."
  - payload_id: "NMP-RT009-CHILD-MATH-002"
    payload_type: "lemma"
    name: "Exact variation-enlargement threshold"
    statement: "For epsilon>0 and Delta_alpha={-alpha*epsilon}, the unique boundary residual is (1-alpha)*epsilon. The candidate returns strict pass exactly for alpha<1, strict fail with weak tangency at alpha=1, and outward fail outside T_K for alpha>1."
    proof: "The admitted boundary velocity is epsilon-alpha*epsilon. Its sign gives all three branches because T_K(0)=[0,infinity) and Int T_K(0)=(0,infinity)."
