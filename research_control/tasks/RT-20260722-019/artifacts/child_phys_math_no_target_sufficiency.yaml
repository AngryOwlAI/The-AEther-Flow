purpose: >-
  Supply a task-local formal evidence logic in which a bounded no-target
  certificate is necessary for Gate A through Gate D evidence readiness but
  is not sufficient for that readiness. The artifact gives exact assumptions,
  a proof, finite countermodels, dimension-independence witnesses, and
  authority boundaries for parent synthesis. It does not decide the readiness
  of any current scientific object and does not create adoption or promotion
  authority.

