derived_predicates:
  evidence_complete_for_gate_review:
    symbol: "E_g(r)"
    definition: "E_g(r) := S_g(r) AND N_g(r) AND CorePos_g(r) AND Q_g(r)."
    meaning: >-
      The record has the structural and positive evidence required to be
      presented for a separately authorized protected gate decision. It is not
      itself that decision.
  protected_gate_promotion:
    symbol: "A_g(r)"
    definition: "A_g(r) := E_g(r) AND H_g(r)."
    meaning: >-
      A compact logical placeholder for the conjunction of evidence readiness
      and exact protected authority. This packet does not assert that A_g holds
      for any subject and does not perform an adoption or promotion.

minimal_theory_assumptions:
  - assumption_id: "H1-SCOPE-INDEXING"
    statement: >-
      Every predicate is indexed by the same exact subject, gate, and claim
      scope. Evidence cannot be transferred between subjects, gates, or scopes
      without a separately proved transport rule.
  - assumption_id: "H2-BOOLEAN-RECORD-SEMANTICS"
    statement: >-
      For the finite countermodel argument, each primitive predicate receives a
      Boolean truth value. The production schemas may retain richer statuses,
      but only statuses admitted by the relevant gate profile map to true.
  - assumption_id: "H3-CONJUNCTIVE-READINESS"
    statement: >-
      E_g is exactly the conjunction stated above; every common positive
      dimension and every gate-specific atom is noncompensatory.
  - assumption_id: "H4-NO-BRIDGING-AXIOMS"
    statement: >-
      The minimal theory contains no axiom N_g implies D_g, U_g, L_g, Y_g,
      O_g, R_g, V_g, or Q_g, and no axiom makes any positive dimension imply
      another or imply N_g.
  - assumption_id: "H5-PROCESS-RECEIPT-EXCLUSION"
    statement: >-
      Validator, build, registry, checkpoint, role, handoff, route, generated
      derivative, and commit receipts are excluded from the scientific
      valuations except as provenance or process-integrity records.
  - assumption_id: "H6-PROTECTED-AUTHORITY-SEPARATION"
    statement: >-
      H_g is independent of E_g and can become true only through the exact
      protected authority path. Evidence completeness cannot manufacture H_g.
  - assumption_id: "H7-STATUS-PRESERVATION"
    statement: >-
      Evaluating E_g is read-only with respect to canonical object status. A
      false result records an unmet evidence obligation, not rejection or
      impossibility; a true result records review eligibility, not promotion.

theorem:
  theorem_id: "NTP-NECESSARY-NOT-SUFFICIENT-THEOREM-V1"
  theorem_name: "No-target necessity, non-sufficiency, and authority separation"
  theorem_status: "proved_in_task_local_policy_logic"
  statement:
    - claim_id: "T1-NECESSITY"
      formula: "For every g in {A,B,C,D} and r in R, E_g(r) implies N_g(r)."
      interpretation: "A no-target pass is necessary for evidence-complete gate-review eligibility under this policy."
    - claim_id: "T2-NONSUFFICIENCY"
      formula: "For every g in {A,B,C,D}, N_g(r) does not imply E_g(r) in the minimal theory."
      interpretation: "A source-pure record may lack every positive physical-readiness obligation."
    - claim_id: "T3-POSITIVE-NONREDUNDANCY"
      formula: >-
        For each d in {D,U,L,Y,O,R,V} and each gate g, the conjunction of S_g,
        N_g, Q_g, and the other six positive dimensions does not imply d in the
        minimal theory.
      interpretation: "No positive coordinate can be silently supplied by the others."
    - claim_id: "T4-POSITIVE-PAIRWISE-NONIMPLICATION"
      formula: "For distinct d_i and d_j in {D,U,L,Y,O,R,V}, d_i does not imply d_j in the minimal theory."
      interpretation: "Logical independence is a policy property; it is not a claim of physical statistical independence."
    - claim_id: "T5-EVIDENCE-NOT-AUTHORITY"
      formula: "For every g in {A,B,C,D}, E_g(r) does not imply A_g(r) in the minimal theory."
      interpretation: "Even an evidence-complete record requires separately instantiated protected authority."
  proof:
    proof_kind: "finite_model_construction_plus_conjunction_elimination"
    steps:
      - step_id: "P1"
        argument: >-
          By definition E_g(r) is S_g(r) AND N_g(r) AND CorePos_g(r) AND
          Q_g(r). Conjunction elimination therefore yields N_g(r), proving T1.
      - step_id: "P2"
        argument: >-
          Fix any gate g and use world W-NT-ONLY below. It sets S_g and N_g true
          while every positive dimension and Q_g are false. The world satisfies
          H1 through H7, N_g is true, and E_g is false. Thus N_g does not imply
          E_g, proving T2.
      - step_id: "P3"
        argument: >-
          For each positive dimension d, use omission world W-MISS-d. It sets
          S_g, N_g, Q_g, and the other six dimensions true while d is false.
          H4 admits this valuation and E_g is false. Therefore d is not
          derivable from the remaining readiness conjuncts, proving T3.
      - step_id: "P4"
        argument: >-
          For each ordered pair of distinct dimensions (d_i,d_j), singleton
          world W-ONLY-d_i makes d_i true and d_j false. The world satisfies the
          minimal assumptions because H4 contains no bridging axiom. This gives
          a countermodel to every directed implication d_i -> d_j, proving T4.
      - step_id: "P5"
        argument: >-
          World W-EVIDENCE-NO-AUTHORITY makes E_g true and H_g false. Since
          A_g is E_g AND H_g, A_g is false. Hence E_g does not imply A_g,
          proving T5.
      - step_id: "P6"
        argument: >-
          World W-POSITIVE-TARGET-TAINTED makes every positive and gate-specific
          atom true but N_g false. It witnesses that positive evidence cannot
          erase the no-target requirement and that the two evidence classes are
          logically distinct.
    proof_limit: >-
      The proof establishes only relations among the defined evidence and
      authority predicates. It neither proves the truth of any scientific
      premise nor evaluates the current repository subjects against the predicates.

finite_countermodels:
  valuation_convention: >-
    Each listed world has a one-record domain {r_g} for an arbitrary fixed gate
    g. Unless stated otherwise, unlisted primitive predicates are false. All
    worlds preserve H1 through H7 and are logical fixtures rather than proposed
    physical systems.
  worlds:
    - world_id: "W-NT-ONLY"
      purpose: "Countermodel to no-target sufficiency."
      valuation:
        S_g: true
        N_g: true
        D_g: false
        U_g: false
        L_g: false
        Y_g: false
        O_g: false
        R_g: false
        V_g: false
        Q_g: false
        H_g: false
        E_g: false
        A_g: false
      witness_claims:
        - "N_g does not imply E_g."
        - "N_g alone supplies none of the seven positive dimensions."
    - world_id: "W-EVIDENCE-NO-AUTHORITY"
      purpose: "Countermodel to evidence completeness as protected adoption or promotion."
      valuation:
        S_g: true
        N_g: true
        D_g: true
        U_g: true
        L_g: true
        Y_g: true
        O_g: true
        R_g: true
        V_g: true
        Q_g: true
        H_g: false
        E_g: true
        A_g: false
      witness_claims:
        - "E_g does not imply A_g."
        - "Review eligibility does not instantiate protected authority."
    - world_id: "W-POSITIVE-TARGET-TAINTED"
      purpose: "Countermodel to the positive conjunction as a replacement for source hygiene."
      valuation:
        S_g: true
        N_g: false
        D_g: true
        U_g: true
        L_g: true
        Y_g: true
        O_g: true
        R_g: true
        V_g: true
        Q_g: true
        H_g: false
        E_g: false
        A_g: false
      witness_claims:
        - "CorePos_g AND Q_g does not imply N_g."
        - "Positive evidence and no-target hygiene are jointly required and non-substitutable."
  dimension_omission_worlds:
    common_valuation: >-
      S_g, N_g, Q_g, and six of the seven positive dimensions are true; H_g is
      false; the named omitted dimension is false. Consequently E_g and A_g are false.
    worlds:
      - world_id: "W-MISS-SOURCE-DERIVATION"
        omitted_dimension: "source_derivation"
        omitted_symbol: "D_g"
      - world_id: "W-MISS-UNIQUENESS-OR-QUOTIENT"
        omitted_dimension: "uniqueness_or_quotient"
        omitted_symbol: "U_g"
      - world_id: "W-MISS-NATURALITY"
        omitted_dimension: "naturality"
        omitted_symbol: "L_g"
      - world_id: "W-MISS-DYNAMICS"
        omitted_dimension: "dynamics"
        omitted_symbol: "Y_g"
      - world_id: "W-MISS-OPERATIONAL-SYSTEMS"
        omitted_dimension: "operational_systems"
        omitted_symbol: "O_g"
      - world_id: "W-MISS-ROBUSTNESS"
        omitted_dimension: "robustness"
        omitted_symbol: "R_g"
      - world_id: "W-MISS-INDEPENDENT-REVIEW"
        omitted_dimension: "independent_review"
        omitted_symbol: "V_g"
  dimension_singleton_worlds:
    common_valuation: >-
      Exactly the named positive dimension is true. S_g is true; N_g, Q_g,
      H_g, the other six positive dimensions, E_g, and A_g are false. For any
      distinct dimension d_j, this world is a countermodel to d_i -> d_j.
    worlds:
      - world_id: "W-ONLY-SOURCE-DERIVATION"
        sole_true_dimension: "source_derivation"
        sole_true_symbol: "D_g"
      - world_id: "W-ONLY-UNIQUENESS-OR-QUOTIENT"
        sole_true_dimension: "uniqueness_or_quotient"
        sole_true_symbol: "U_g"
      - world_id: "W-ONLY-NATURALITY"
        sole_true_dimension: "naturality"
        sole_true_symbol: "L_g"
      - world_id: "W-ONLY-DYNAMICS"
        sole_true_dimension: "dynamics"
        sole_true_symbol: "Y_g"
      - world_id: "W-ONLY-OPERATIONAL-SYSTEMS"
        sole_true_dimension: "operational_systems"
        sole_true_symbol: "O_g"
      - world_id: "W-ONLY-ROBUSTNESS"
        sole_true_dimension: "robustness"
        sole_true_symbol: "R_g"
      - world_id: "W-ONLY-INDEPENDENT-REVIEW"
        sole_true_dimension: "independent_review"
        sole_true_symbol: "V_g"
  model_count_summary:
    explicit_base_worlds: 3
    omission_worlds: 7
    singleton_worlds: 7
    directed_positive_dimension_nonimplications_witnessed: 42
    note: >-
      Seven singleton worlds cover all 7 times 6 ordered pairwise
      non-implications. The omission worlds separately show that each dimension
      remains nonredundant even when all other readiness conjuncts pass.

dimension_independence_analysis:
  result: "logically_independent_in_the_minimal_policy_theory"
  exact_scope: >-
    Independence means non-derivability from H1 through H7. It does not assert
    causal, probabilistic, statistical, metaphysical, or empirical independence.
  conclusions:
    - conclusion_id: "DI-01"
      statement: "No-target purity does not imply any positive dimension."
      witness: "W-NT-ONLY"
    - conclusion_id: "DI-02"
      statement: "The conjunction of all positive dimensions and Q_g does not imply no-target purity."
      witness: "W-POSITIVE-TARGET-TAINTED"
    - conclusion_id: "DI-03"
      statement: "Each positive dimension is nonredundant in E_g."
      witness: "the corresponding W-MISS-d world"
    - conclusion_id: "DI-04"
      statement: "No positive dimension implies any distinct positive dimension."
      witness: "the corresponding W-ONLY-d_i world"
    - conclusion_id: "DI-05"
      statement: "Evidence completeness does not imply protected authority."
      witness: "W-EVIDENCE-NO-AUTHORITY"
  possible_future_strengthening: >-
    A later scoped scientific theorem may establish dependencies among selected
    dimensions under additional premises. Such a theorem must name its subject,
    gate, maps, assumptions, proof, and transport scope; it changes none of the
    default non-implications outside that scope.

status_and_authority_boundaries:
