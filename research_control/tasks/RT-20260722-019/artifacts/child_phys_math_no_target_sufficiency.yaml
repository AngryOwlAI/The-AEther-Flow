formal_language:
  carrier: >-
    Let R be the class of finite evidence records. Each r in R names one
    subject, one exact claim scope s, one gate g, its source and evidence
    references, and its authority state.
  gate_domain:
    - "gate_a"
    - "gate_b"
    - "gate_c"
    - "gate_d"
  truth_domain:
    values: [false, true]
    fail_closed_rule: >-
      Missing, malformed, out-of-scope, or unevidenced atoms evaluate false for
      evidence-completeness purposes. False means the record does not discharge
      the obligation; it is not a global impossibility or rejection theorem.
  scope_predicate:
    symbol: "S_g(r)"
    meaning: >-
      The record is exact-shape, internally scoped, and applicable to gate g.
      Scope validity alone has no scientific or promotion force.
  no_target_predicate:
    symbol: "N_g(r)"
    meaning: >-
      A bounded audit for the declared gate and subject found no prohibited
      target topology, target atlas, target metric, benchmark-success, empirical
      observer, process-authority, or generated-derivative import among the
      checked premises. This is negative structural-admissibility evidence only.
    necessary_scope: >-
      N_g is policy-necessary for source-facing Gate A through Gate D evidence
      readiness under this packet. It is not asserted to be a metaphysical
      necessity or a sufficient condition for physical truth.
  positive_dimension_order:
    - "source_derivation"
    - "uniqueness_or_quotient"
    - "naturality"
    - "dynamics"
    - "operational_systems"
    - "robustness"
    - "independent_review"
  positive_predicates:
    source_derivation:
      symbol: "D_g(r)"
      meaning: "The in-scope result follows from named source-side premises with exact source provenance rather than benchmark or process receipts."
    uniqueness_or_quotient:
      symbol: "U_g(r)"
      meaning: "The subject is unique in the declared sense or its residual equivalence relation and quotient scope are explicitly defined and supported."
    naturality:
      symbol: "L_g(r)"
      meaning: "The construction has the required source-morphism covariance or naturality without an unrecorded arbitrary choice."
    dynamics:
      symbol: "Y_g(r)"
      meaning: "The relevant dynamics meet the gate-specific derived or validated standard rather than merely being named or specified."
    operational_systems:
      symbol: "O_g(r)"
      meaning: "Source-defined devices or protocols connect the claimed structure to the gate-specific operational meaning."
    robustness:
      symbol: "R_g(r)"
      meaning: "The result persists over the declared perturbation, model-choice, or admissible-variation scope required by the gate."
    independent_review:
      symbol: "V_g(r)"
      meaning: "A sufficiently independent executed review or replication has exact provenance and evidence references."
  positive_vector:
    symbol: "P_g(r)"
    notation: "P_g(r) = (D_g(r), U_g(r), L_g(r), Y_g(r), O_g(r), R_g(r), V_g(r))"
    conjunction_symbol: "CorePos_g(r) = D_g AND U_g AND L_g AND Y_g AND O_g AND R_g AND V_g"
    non_score_rule: >-
      P_g is not a scalar score. No passed coordinate compensates for a failed
      coordinate, and no coordinate inherits evidence from another.
  gate_specific_predicate:
    symbol: "Q_g(r)"
    meaning: >-
      The conjunction of every gate-specific minimum-evidence atom listed for
      gate g below. These atoms refine rather than replace the seven common
      positive dimensions.
  protected_authority_predicate:
    symbol: "H_g(r)"
    meaning: >-
      A separately authorized protected human decision exists for the exact
      gate, object, claim, and scope. A job, role, validator, checkpoint,
      registry row, or review-readiness record cannot set H_g to true.

