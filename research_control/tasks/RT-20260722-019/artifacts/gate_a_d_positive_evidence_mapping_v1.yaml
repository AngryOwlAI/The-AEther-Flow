      source_derivation: "source primitives and laws are traced to exact source premises"
      uniqueness_or_quotient: "residual multiplicity is resolved or an exact quotient is defined"
      naturality: "source construction is choice-controlled"
      dynamics: "source dynamics are explicit and evidenced"
      operational_systems: "source observables or protocols are defined without target labels"
      robustness: "source result survives declared variations"
      independent_review: "executed review has adequate provenance"
    current_verdict: "not_issued_by_p14_t03"
    blocked_overread: "No metric or downstream promotion."
  gate_b:
    purpose: "effective geometry readiness"
    minimum_evidence:
      - "causal or characteristic structure derived"
      - "conformal structure justified"
      - "scale operationally calibrated"
      - "Lorentzian signature and nondegeneracy established"
      - "transformation law and uniqueness up to declared equivalence established"
      - "robustness and propagation meaning established"
