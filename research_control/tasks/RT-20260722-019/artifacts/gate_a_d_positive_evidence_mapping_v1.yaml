      source_derivation: "P11-T05 status source_derived"
      uniqueness_or_quotient: "P11-T05 status unique or quotient_defined"
      naturality: "P11-T05 status derived"
      dynamics: "P11-T05 status derived or validated"
      operational_systems: "P11-T05 status constructed or validated"
      robustness: "P11-T05 status robust"
      independent_review: "P11-T05 status human_expert_review or independent_replication"
    current_verdict: "not_issued_by_p14_t03"
    blocked_overread: "No matter coupling or field equations."
  gate_c:
    purpose: "matter-coupling readiness"
    minimum_evidence:
      - "source matter ontology and dynamics defined"
      - "operational devices constructed"
      - "common propagation geometry proved"
      - "universal coupling, matter action, stress-energy, and conservation established"
      - "equivalence-principle status, audit, stress, and independent review complete"
    positive_dimension_application:
      source_derivation: "P11-T05 status source_derived"
      uniqueness_or_quotient: "P11-T05 status unique or quotient_defined"
      naturality: "P11-T05 status derived"
      dynamics: "P11-T05 status validated"
      operational_systems: "P11-T05 status validated"
      robustness: "P11-T05 status robust"
      independent_review: "P11-T05 status human_expert_review or independent_replication"
    current_verdict: "not_issued_by_p14_t03"
    blocked_overread: "No Einstein equations or benchmark promotion."
  gate_d:
    purpose: "Einstein-sector readiness"
    minimum_evidence:
      - "one closure route selected and its assumptions satisfied"
      - "effective gravitational action or constraint structure derived"
      - "field equations obtained"
      - "constraints, modes, hyperbolicity, stability, and corrections established"
      - "audit and independent review complete"
