      source_derivation: "the closure chain traces through source-derived geometry and matter inputs"
      uniqueness_or_quotient: "closure and residual equivalence are exact in scope"
      naturality: "no unrecorded closure choice imports the target"
      dynamics: "field dynamics and constraint propagation are derived and tested in scope"
      operational_systems: "the equations connect to the already-evidenced matter and detector protocols"
      robustness: "hyperbolicity, stability, corrections, and declared variations are controlled"
      independent_review: "executed review covers the complete closure chain"
