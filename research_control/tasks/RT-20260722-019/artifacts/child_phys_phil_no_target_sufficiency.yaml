forbidden_overread_lexicon:
  - overread: "source-pure therefore source-derived"
    correction: "Source purity excludes named target imports; derivation requires a constructive source-backed argument."
  - overread: "source-pure therefore physically meaningful"
    correction: "Physical meaning additionally requires operational systems, dynamics, robustness, and the relevant authority."
  - overread: "no-target certificate proves emergence"
    correction: "Emergence requires a non-circular source-to-effective reconstruction with regime, robustness, and an operational bridge."
  - overread: "exact-GR agreement proves first-principles recovery"
    correction: "Exact-GR agreement is benchmark or interpretive evidence; it is not source derivation."
  - overread: "formal equivalence or a quotient implies emergence"
    correction: "Formal equivalence and emergence are independent P14-T01 categories with different certificates."
  - overread: "validator PASS or clean checkpoint proves the physics"
    correction: "Those are operational receipts only."
  - overread: "evidence complete means adopted or promoted"
    correction: "Evidence completion only makes a packet eligible for a separately authorized protected review."
  - overread: "missing positive evidence refutes the mathematical object"
    correction: "Preserve correct scoped mathematics while withholding stronger physical and promotional claims."
  - overread: "a local freeze or obstruction is a global impossibility theorem"
    correction: "State the exact premises and scope; same-milestone continuation remains open unless a separate theorem closes it."

theorem_inventory_guidance:
  required_fields_per_entry:
    - "claim_or_theorem_id"
    - "exact_subject_and_scope"
    - "assumption_set_and_source_hashes"
    - "mathematical_result_kind"
    - "no_target_audit_status_and_audited_import_class"
    - "source_derivation_status"
    - "uniqueness_or_quotient_status"
    - "naturality_status"
    - "dynamics_status"
    - "operational_systems_status"
    - "robustness_status"
    - "independent_review_status_and_provenance"
    - "P14_success_category_statuses"
    - "authority_status"
    - "downstream_blocked_overreads"
    - "reopening_or_next_evidence_condition"
  rules:
    - >-
      Record no-target purity as its own negative certificate; never fold it
      into source_derivation, genuine_emergence, operational_meaning, or
      physical_readiness.
    - >-
      Distinguish missing, proposed, conditional, established-in-scope,
      refuted-in-scope, not-applicable-with-reason, and not-assessed; absence
      of evidence is not automatically a theorem of impossibility.
    - >-
      Keep mathematical validity, physical interpretation, empirical status,
      and protected authority in separate fields.
    - >-
      For a quotient or selector result, state whether the theorem is general,
      conditional, finite, local, task-local, or merely a target; do not infer
      physical gauge status from formal resemblance.
    - >-
      For a negative result, preserve its premises, countermodel family,
      frozen scope, and reopening condition, and explicitly set
      global_theory_rejection to false unless separately proved and authorized.
    - >-
      A validator or proof build may verify artifact integrity but must not
      populate a scientific-evidence dimension.

