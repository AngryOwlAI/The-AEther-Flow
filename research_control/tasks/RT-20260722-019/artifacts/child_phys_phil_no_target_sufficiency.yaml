shared_claim_boundary:
  exact_gr_benchmark_preserved: true
  ontology_modified: false
  source_law_adopted: false
  scientific_ledger_modified: false
  gate_chair_verdict_issued: false
  physical_interpretation_promoted: false
  physics_promotion_authorized: false
  completed_derivation_claimed: false
  global_theory_rejection_claimed: false
  validator_or_checkpoint_treated_as_science: false
  status_statement: >-
    No-target purity is admissibility evidence about what a construction did
    not import. Positive physical readiness requires additional constructive
    evidence, and any protected adoption or promotion still requires its
    separate authority.

claim_layer_separation:
  ontology:
    question: "What kind of world-level or source-level entities and relations are proposed?"
    admissible_current_claim: >-
      The registered ontology gives the project a disciplined proposed
      AEther/AEther-flow interpretation and an exact-closure benchmark line.
    no_target_contribution: >-
      A no-target audit can show that a proposed source definition does not
      explicitly encode a target atlas, metric, benchmark answer, or other
      prohibited target datum within the audited scope.
    positive_evidence_still_required:
      - "A decided ontology regime and explicitly typed source objects and morphisms."
      - "Source dynamics, observables, admissible variations, and automorphism behavior."
      - "A proved EqSrc, a defined quotient, or a precisely scoped obstruction."
      - "Stress evidence and appropriately provenanced independent review."
    authority_limit: >-
      Target independence does not establish that an ontology is physically
      true, uniquely selected, canonical, adopted, or capable of deriving GR.

  model:
    question: "What mathematical object or construction exists under which exact assumptions and scope?"
    admissible_current_claim: >-
      Source-only objects, source-extension records, finite witnesses,
      profiles, certificates, and selector candidates can remain rigorous and
      scientifically useful mathematical or control objects in their exact
      declared scopes.
    no_target_contribution: >-
      Source purity can support the internal admissibility of a model by
      excluding a declared class of circular target imports.
    positive_evidence_still_required:
      - "Existence or construction from named source premises."
      - "Uniqueness, conditional uniqueness, or an explicit quotient and residual equivalence relation."
      - "Naturality under the declared source morphisms."
      - "Dynamics and robustness in a declared variation class."
    authority_limit: >-
      A source-pure model is not thereby a physical object, physical theory,
      effective metric, matter sector, field equation, or empirical result.

  empirical:
    question: "What operationally testable content, device semantics, or benchmark distinction is established?"
    admissible_current_claim: >-
      The exact-closure manuscript line retains the operational predictions of
      GR and supplies an interpretive dictionary; it does not claim an
      independent low-energy deviation in that line.
    no_target_contribution: >-
      No-target purity can block circular use of measured or benchmark target
      answers as source premises, but it supplies no detector, clock, rod,
      observable, calibration, prediction, or falsification condition.
    positive_evidence_still_required:
      - "Source-defined operational systems and explicit measurement protocols."
      - "A bridge from source or effective variables to observables."
      - "Propagation, calibration, robustness, and uncertainty control."
      - "For novelty, a nonempty operational discriminator from the named benchmark."
    authority_limit: >-
      Exact-GR agreement is target-side benchmark evidence, not source
      derivation; source purity is not emergence, operational meaning, or
      empirical novelty.

  authority:
    question: "Who or what may change a scientific object's status?"
    admissible_current_claim: >-
      Task-local proofs and checks can establish only their exact scoped
      mathematical or control conclusions. Protected status changes require
      the separately specified tracked authority.
    no_target_contribution: >-
      A no-target certificate can be cited as one evidence item in a later
      review packet; it cannot act as the reviewing authority.
    non_authoritative_receipts:
      - "validator PASS"
      - "test PASS"
      - "clean checkpoint"
      - "successful TeX build"
      - "registry presence"
      - "role diversity without an executed calibrated review"
    protected_statuses:
      - "canonical ontology adoption or edit"
      - "source-law adoption"
      - "unscoped metric status"
      - "physical matter coupling"
      - "Einstein-equation derivation status"
      - "benchmark promotion"
      - "completed derivation"
    authority_limit: >-
      Evidence completeness can at most make a packet eligible for a protected
      review. It does not supply the protected verdict.

no_target_policy:
  policy_id: "NT-POSITIVE-READINESS-POLICY-V1"
  logical_role: >-
    A bounded no-target certificate is a negative admissibility condition: it
    rules out specified forms of target import for the audited artifact and
    scope. It is not a constructive existence, derivation, uniqueness,
    naturality, dynamics, operational, robustness, review, or authority
    certificate.
  necessity_scope: >-
    Any claim that a target structure is sourced, reconstructed, or emergent
    must pass an appropriate target-independence audit for the exact premises,
    construction, admissibility criteria, and evaluation protocol it uses.
  insufficiency_scope: >-
    Passing that audit alone cannot complete Gate A, B, C, or D and cannot
    establish formal equivalence, genuine emergence, empirical novelty,
    physical meaning, or promotion.
  positive_evidence_dimensions:
    - id: "source_derivation"
      question: "Is the claimed result derived from named source-side premises with exact provenance?"
    - id: "uniqueness_or_quotient"
      question: "Is the result unique, conditionally unique in stated scope, or represented by a defined quotient?"
    - id: "naturality"
      question: "Is the construction invariant or equivariant under every declared admissible source morphism without an untracked choice?"
    - id: "dynamics"
      question: "Do source-derived dynamics select, preserve, or generate the claimed structure in the required regime?"
    - id: "operational_systems"
      question: "Are source-defined devices or protocols connected to the claimed physical and measurement semantics?"
    - id: "robustness"
      question: "Does the result survive the declared perturbations, variations, and model choices?"
    - id: "independent_review"
      question: "Has a sufficiently calibrated review or independent replication actually been executed with exact provenance?"
  protected_authority_conjunct: >-
    Even when every positive evidence dimension is complete in scope, a
    protected adoption or promotion still requires the exact separate
    authority named for that gate.
  mathematics_preservation_rule: >-
    Failure to establish physical readiness does not invalidate a correct
    source-pure definition, theorem, finite witness, quotient, obstruction, or
    counterexample. Preserve its mathematical status and narrow its physical
    and promotional interpretation.
  underdetermination_rule: >-
    When the current ontology does not derive a required selector, law, or
    bridge, report that exact absence. Do not infer impossibility without a
    separately proved no-go theorem, and do not convert a local freeze into a
    global theory rejection.

