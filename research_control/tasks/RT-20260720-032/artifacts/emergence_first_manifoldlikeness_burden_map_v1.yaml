burdens:
  - burden_id: "EF-ML-01-SCALE-LIMIT"
    layer: "source family and continuum limit"
    status: "open"
    required_result: "Define an intrinsic refinement, growth, or ensemble family plus coarse-graining scale and convergence notion."
    forbidden_shortcut: "Inferring a continuum from one finite order or choosing only target-embeddable histories."
  - burden_id: "EF-ML-02-TOPOLOGY"
    layer: "topology"
    status: "open"
    required_result: "Recover stable local and global topology from source-internal order data and prove target compatibility."
    forbidden_shortcut: "Importing target neighborhoods, covers, charts, hypersurfaces, or boundary conditions."
  - burden_id: "EF-ML-03-DIMENSION"
    layer: "dimension"
    status: "open"
    required_result: "Give convergent source-defined dimension estimators, agreement criteria, and a reason four-dimensional behavior is selected in the relevant regime."
    forbidden_shortcut: "Encoding four coordinates or using a target dimension to train the source selector."
  - burden_id: "EF-ML-04-DIFFERENTIABILITY"
    layer: "differentiability"
    status: "open"
    required_result: "Recover local coordinate candidates, overlap maps, regularity, and stable smooth calculus from source observables."
    forbidden_shortcut: "Supplying a target atlas or assuming that topology and dimension imply a smooth structure."
  - burden_id: "EF-ML-05-CAUSAL-SEMANTICS"
    layer: "physical causal structure and orientation"
    status: "open"
    required_result: "Prove when formal source precedence represents relativistic causal or chronological order, including locality and orientation."
    forbidden_shortcut: "Relabeling prec as physical causality, time, or a target cone relation."
  - burden_id: "EF-ML-06-MEASURE-SCALE"
    layer: "measure volume and scale"
    status: "open"
    required_result: "Derive and calibrate a counting-to-volume or other measure law, fluctuation control, physical scale, and units."
    forbidden_shortcut: "Treating local finiteness as physical volume, density, or a fundamental length."
  - burden_id: "EF-ML-07-METRIC-GEOMETRY"
    layer: "conformal and metric geometry"
    status: "open"
    required_result: "Construct conformal, signature, scale, nondegeneracy, connection, and metric data with existence and stability controls."
    forbidden_shortcut: "Importing the exact-GR target metric or assuming order and counting uniquely fix physical geometry."
  - burden_id: "EF-ML-08-DYNAMICS-TYPICALITY"
    layer: "source dynamics and typicality"
    status: "open"
    required_result: "Supply a source-only history law and show that the manifoldlike sector is generated non-negligibly with controlled effective dynamics."
    forbidden_shortcut: "Conditioning the law on target manifoldlikeness, target metric data, or Einstein solutions."
  - burden_id: "EF-ML-09-DISCRIMINATOR"
    layer: "manifoldlikeness discriminator"
    status: "open"
    required_result: "Define a target-neutral discriminator with positive, negative, ambiguous, false-positive, false-negative, and scale-sensitivity controls."
    forbidden_shortcut: "Calling every locally finite order manifoldlike or using validation status as scientific evidence."
  - burden_id: "EF-ML-10-UNIQUENESS-STABILITY"
    layer: "uniqueness stability and robustness"
    status: "open"
    required_result: "Bound inequivalent continuum realizations and show recovery is stable under admissible source variation and coarse graining."
    forbidden_shortcut: "Treating one faithful embedding as unique reconstruction."
  - burden_id: "EF-ML-11-OPERATIONAL-GR"
    layer: "operational semantics matter coupling and GR recovery"
    status: "open"
    required_result: "Derive clocks observers detectors matter semantics universal coupling gravitational dynamics and exact-GR recovery through an acyclic source-to-target chain."
    forbidden_shortcut: "Using exact-GR benchmark success as a source premise or calling structural relabeling physical gauge."
