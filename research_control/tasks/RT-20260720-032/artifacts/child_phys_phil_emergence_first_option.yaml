scope: "Philosophical and epistemic audit of one task-local emergence-first process-order option; no ontology-regime selection, adoption, rejection, or canonical ontology edit."

epistemic_separations:
  ontology: "The task-local proposal names possible basic entities and relations: a bare event carrier, an acyclic locally finite order or process relation, finite-fragment composition, task-local labels, and an unfilled dynamics target. These are not canonical project ontology."
  mathematical_model: "A model specifies these primitives and laws sufficiently to construct and compare finite examples. Formal precision does not supply physical meaning, continuum recovery, empirical interpretation, or adoption authority."
  interpretation: "Calling the option emergence-first expresses an explanatory ambition: spacetime structure would be reconstructed rather than assumed. The label is not evidence that emergence occurs."
  target_realization: "A map, correspondence, embedding, coarse-graining, or functor into a target continuum is a target-side test condition. The target manifold, atlas, dimension, metric, signature, volume form, or causal order must not be included in the source data used to satisfy that condition."
  physical_theory: "Physical-theory status would require adopted semantics, dynamics, observables, empirical commitments, and a demonstrated bridge to the target. None is supplied by this child audit or by finite source examples."
  exact_gr_benchmark: "The exact-GR benchmark remains target-side closure. Benchmark compatibility, if later studied, would not by itself establish first-principles recovery from the proposed source."
  process_receipt: "Validation, registry, checkpoint, commit, and handoff records are operational evidence only; they are not scientific proof or ontology authority."

strict_weakness_assessment:
  overall: "The proposed source vocabulary is genuinely weaker than a differentiable four-dimensional manifold only under the negative guards below. It lacks the structures needed even to state target differentiability, metric distance, Lorentzian signature, physical duration, or continuum volume internally."
  components:
    - primitive: "carrier"
      assessment: "A countable or otherwise bare set of events has identity and incidence capacity but no topology, dimension, coordinates, differentiability, measure, metric, or physical interpretation."
      guard: "Do not type elements as spacetime points or assign hidden coordinate tuples."
    - primitive: "order_or_process_relation"
      assessment: "An acyclic or partial-order relation supplies precedence syntax only. It is not yet physical time, causal order, Lorentzian interval, orientation, or a generator flow on a manifold."
      guard: "Use structural precedence language until an independently justified bridge supplies physical semantics."
    - primitive: "finite_fragment_composition"
      assessment: "Order-compatible gluing or categorical composition supplies algebraic assembly rules without transition maps, smooth overlap data, target neighborhoods, or coordinate transformations."
      guard: "Composition interfaces may mention only source-internal boundary data; target chart compatibility cannot be encoded as an admissibility rule."
    - primitive: "local_finiteness"
      assessment: "Finiteness of order intervals is a combinatorial regularity assumption. By itself it supplies no physical density, continuum volume, fundamental length, metric scale, or probability measure."
      guard: "Any later number-to-volume or discreteness-scale interpretation requires a separate law and calibration."
    - primitive: "task_local_labels"
      assessment: "Finite labels may distinguish source states without introducing target dimension, tensor type, chart index, timelike character, matter species, detector outcome, or metric signature."
      guard: "Every label requires source-internal operational or algebraic meaning and a hidden-import audit."
    - primitive: "dynamics_target"
      assessment: "An explicitly empty slot for an update, amplitude, history measure, or transition law states a future burden rather than smuggling in a law."
      guard: "Do not infer typicality, manifoldlikeness, covariance, or physical evolution until such a law is proposed and tested."
  conditionality: "Strict weakness is a property of the typed primitive inventory and admissibility rules, not of pregeometric naming. Any rule that consults target coordinates, dimension, smoothness, metric, signature, volume, clocks, matter, or GR solutions would invalidate the assessment."

hidden_import_risks:
  - risk_id: "PHIL-P4T03-HI-001"
    risk: "Calling carrier elements events or points may silently grant them spacetime localization."
    control: "Treat event as a neutral source token; localization is an output of a later realization map, if one exists."
  - risk_id: "PHIL-P4T03-HI-002"
    risk: "Precedence notation may be read as temporal succession or relativistic causality."
    control: "State only acyclic source precedence and require a separate order-to-physical-causality bridge."
  - risk_id: "PHIL-P4T03-HI-003"
    risk: "Local finiteness may be read as a physical spacetime discreteness scale or number-volume correspondence."
    control: "Keep density, volume, scale, and stochastic sprinkling outside the primitive ontology unless separately proposed and justified."
  - risk_id: "PHIL-P4T03-HI-004"
    risk: "A finite-fragment boundary may be defined using neighborhoods, hypersurfaces, chart overlap, or metric separation."
    control: "Define boundaries only through source incidence, down-set, up-set, interface, or factorization data."
  - risk_id: "PHIL-P4T03-HI-005"
    risk: "Labels can encode four coordinates, tangent data, signature, matter types, clocks, or preferred foliation under neutral names."
    control: "Audit each label's type, transformation rule, and admissibility test for target-dependent content."
  - risk_id: "PHIL-P4T03-HI-006"
    risk: "Selecting only source histories known to embed in a chosen manifold can make target reconstruction circular."
    control: "State manifoldlikeness criteria source-internally and test them against positive, negative, and ambiguous families without consulting a preferred target during selection."
  - risk_id: "PHIL-P4T03-HI-007"
    risk: "A faithful realization can be overread as an ontological identification between the source and continuum spacetime."
    control: "Treat realization as a scoped relation between a source model and a target model, with existence, non-uniqueness, stability, and approximation error all explicit."
  - risk_id: "PHIL-P4T03-HI-008"
    risk: "Exact-GR target success can be used backward as the source dynamics or selection principle."
    control: "Keep GR recovery as a downstream benchmark burden and require source-side dynamics and selection criteria fixed prospectively."

overread_risks:
  - "A coherent pregeometric model is not an established physical ontology."
  - "A finite diamond, chain, antichain, or composed fragment is not evidence that a continuum emerges."
  - "An order-preserving target realization is not proof of recovered topology, dimension, differentiability, causal structure, measure, or metric."
  - "Reconstruction of one structural layer would not automatically reconstruct the others."
  - "Existence of one continuum approximation would not establish uniqueness, genericity, stability, or dynamical production."
  - "Structural automorphisms or relabeling invariance are not physical gauge or operational indistinguishability without a physical interface."
  - "A source update relation is not physical time evolution without clocks, observables, and an interpretation law."
  - "Proposal completion and validator PASS do not authorize ontology selection, adoption, rejection, promotion, publication, or a completed-GR claim."

external_literature_scope:
  general_boundary: "The cited causal-set literature supplies modeling precedents and examples of reconstruction burdens only. The project-specific proposal is literature-informed but is not identified with causal set theory, and the literature does not establish this project's ontology or continuum emergence."
  sources:
    - citation_key: "BombelliEtAl1987"
      allowed_use: "Precedent for studying a locally finite partial order as pregeometric mathematical data and for treating continuum approximation as an additional relation."
      forbidden_use: "No inference that the project source order is physical causal order, that a target manifold is recovered, or that this option is adopted."
    - citation_key: "RideoutSorkin2000"
      allowed_use: "Precedent showing that a separate sequential-growth dynamics can be formulated for an ordered discrete model."
      forbidden_use: "No import or adoption of classical sequential growth, probabilities, covariance conditions, or physical time semantics as project source law."
    - citation_key: "MajorRideoutSurya2007"
      allowed_use: "Precedent that continuum-topology recovery requires a nontrivial reconstruction proposal and controlled approximation assumptions."
      forbidden_use: "No claim that the cited construction applies to this candidate, uniquely recovers topology, or discharges any project burden."
  calibration: "Similarity of primitive vocabulary establishes relevance of a literature comparison, not theoretical identity, empirical support, or inheritance of the literature's results."

continuum_emergence_burden:
  exact_status: "No continuum emergence result is present. Genuine emergence remains a compound, open derivational burden."
  required_layers:
    - burden_id: "PHIL-P4T03-B01"
      layer: "source-internal manifoldlikeness discriminator"
      burden: "Define criteria using only source observables that distinguish continuumlike families from non-manifoldlike and ambiguous families."
      principal_risk: "A target-trained selector can conceal the desired continuum in its definition."
    - burden_id: "PHIL-P4T03-B02"
      layer: "existence of approximation or realization"
      burden: "Construct a controlled map or relation from qualifying source families to target continuum models with an explicit approximation regime and error notion."
      principal_risk: "Isolated hand-picked examples may exist while typical source histories have no continuum approximation."
    - burden_id: "PHIL-P4T03-B03"
      layer: "topology"
      burden: "Recover local and global topological structure without importing neighborhoods, covers, charts, or boundary conditions from the target."
      principal_risk: "Different target topologies may fit the same finite or coarse source evidence."
    - burden_id: "PHIL-P4T03-B04"
      layer: "dimension"
      burden: "Provide convergent and mutually consistent source-defined dimension estimators and explain why four-dimensional behavior is selected in the relevant regime."
      principal_risk: "Dimension may be scale-dependent, estimator-dependent, or fixed by hidden labels."
    - burden_id: "PHIL-P4T03-B05"
      layer: "differentiability"
      burden: "Recover a stable smooth structure and calculus from source composition or coarse-graining rather than assuming smooth transition data."
      principal_risk: "Topological or dimensional approximation alone does not imply differentiability."
    - burden_id: "PHIL-P4T03-B06"
      layer: "physical causal structure and orientation"
      burden: "Derive when structural precedence represents relativistic causal order, including orientation and locality, without using a target metric to define the source relation."
      principal_risk: "The same order syntax may admit non-temporal interpretations or fail to determine the required physical structure."
    - burden_id: "PHIL-P4T03-B07"
      layer: "measure, volume, and scale"
      burden: "Derive and calibrate a number-to-volume or other measure correspondence, fluctuation bounds, and physical scale from source-side assumptions."
      principal_risk: "Local finiteness supplies cardinality bounds but not physical units, continuum measure, c, G, or metric normalization."
    - burden_id: "PHIL-P4T03-B08"
      layer: "uniqueness and stability"
      burden: "Show that qualifying source data do not equally approximate physically inequivalent target continua and that recovery is robust under admissible source variation."
      principal_risk: "Multiple inequivalent continuum targets or unstable coarse-grainings would underdetermine the claimed emergence."
    - burden_id: "PHIL-P4T03-B09"
      layer: "dynamics and typicality"
      burden: "Supply a source-side update law or history measure that generates the manifoldlike sector non-negligibly and without target-conditioned selection."
      principal_risk: "Manifoldlike structures may be kinematically possible but dynamically exceptional."
    - burden_id: "PHIL-P4T03-B10"
      layer: "physical and empirical semantics"
      burden: "Define source observables, matter and detector interfaces, clocks, and empirical matching before interpreting reconstructed structure as physical spacetime."
      principal_risk: "Mathematical resemblance can be mistaken for physical recovery."
    - burden_id: "PHIL-P4T03-B11"
      layer: "GR recovery"
      burden: "After the preceding layers, derive the effective metric, universal matter coupling, gravitational dynamics, and exact-GR benchmark behavior through an acyclic source-to-target chain."
      principal_risk: "Using exact-GR closure as an input would reverse the explanatory direction and make recovery circular."
  aggregate_risk: "The emergence-first option reduces primitive spacetime structure but sharply increases existence, uniqueness, stability, typicality, semantic, and dynamical burdens. Its explanatory promise is therefore conditional on future source-side constructions, not a present advantage established by P4-T03."

