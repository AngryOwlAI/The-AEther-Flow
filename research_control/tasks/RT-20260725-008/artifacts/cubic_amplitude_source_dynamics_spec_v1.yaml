selected_candidate:
  candidate_id: "V21-P5-T03-CUBIC-AMPLITUDE-SOURCE-DYNAMICS-V1"
  candidate_name: "cubic_amplitude_source_order_dynamics"
  formalism: "autonomous_first_order_amplitude_update_rule"
  rationale: >-
    A one-dimensional autonomous generator is the narrowest formalism that
    uses only the P5-T01 admissible amplitude witness, creates a differentiable
    P5-T02 semiflow with a nontrivial global forward solution, and avoids a
    source-arena metric, volume form, action, symplectic form, or target import.
  state_space:
    notation: "Q_amp={q_a(theta)=a sin(theta_1) | a in R}"
    smooth_model: "R transported through a |-> q_a"
    topology: "transported Euclidean topology"
    tangent_space: "T_(q_a)Q_amp=span{sin(theta_1)}"
    admissible_variations: "Var_src(q_a)=span{sin(theta_1)}"
    observable: "F(q_a)=a"
  source_base:
    arena: "T^4"
    boundary: "compact and boundaryless"
    status: "P5-T01 proposal-only witness, not physical spacetime"
  parameter:
    carrier: "R_ge_0"
    operation: "addition"
    identity: "0"
    interpretation: "source order only"
    physical_time: false
  coefficient:
    symbol: "gamma"
    domain: "gamma>0"
    status: "new proposal assumption"
    derived_by_current_ontology: false
  redundancy:
    Red_src: "identity arrows only"
    compatibility_scope: "exact witness only"
    physical_gauge_claimed: false
  initial_data: "q(0)=q_(a0), a0 in R"
  generator:
    signature: "X_gamma:Q_amp->TQ_amp"
    rule: "X_gamma(q_a)=-gamma a^3 sin(theta_1)"
    all_domain: true
    admissible_variation_compatible: true
  equation:
    configuration_form: "d^+q/dlambda=X_gamma(q)"
    amplitude_form: "da/dlambda=-gamma a^3"
  solution:
    formula: "a(lambda)=a0/sqrt(1+2 gamma a0^2 lambda)"
    domain: "lambda in R_ge_0, a0 in R"
    global_forward: true
    unique: true
    nontrivial_for_nonzero_a0: true
  induced_action:
    signature: "Phi^gamma:R_ge_0 x Q_amp->Q_amp"
    formula: "Phi^gamma_lambda(q_a)=q_[a/sqrt(1+2 gamma a^2 lambda)]"
    identity: true
    composition: true
    joint_smoothness: true
    admissibility: true
    redundancy_compatibility: true
    generator_recovered: true

derivation:
  - step_id: "D1_TYPE_REDUCTION"
    statement: "q(lambda)=a(lambda) sin(theta_1) and X_gamma(q_a) is in the exact admitted variation line."
  - step_id: "D2_AMPLITUDE_EQUATION"
    statement: "Equality of the sin(theta_1) coefficients gives da/dlambda=-gamma a^3."
  - step_id: "D3_GLOBAL_SOLUTION"
    statement: "Separation gives a(lambda)=a0/sqrt(1+2 gamma a0^2 lambda), whose denominator is positive for every forward parameter."
  - step_id: "D4_SEMIGROUP"
    statement: "Direct substitution gives f_lambda(f_mu(a))=f_(lambda+mu)(a)."
  - step_id: "D5_GENERATOR"
    statement: "The right derivative of Phi_lambda at lambda=0 is X_gamma."

proved_properties:
  - property_id: "P5T03-PROP-GLOBAL-FORWARD"
    result: "unique_global_forward_solution"
  - property_id: "P5T03-PROP-PHI-COMPATIBILITY"
    result: "P5_T02_identity_composition_admissibility_redundancy_and_smoothness"
  - property_id: "P5T03-PROP-RANGE"
    result: "injective_not_surjective_for_every_positive_parameter"
    exact_range: "(-1/sqrt(2 gamma lambda),1/sqrt(2 gamma lambda))"
  - property_id: "P5T03-PROP-NO-GLOBAL-R-ACTION"
    result: "nonzero backward trajectories blow up at lambda=-1/(2 gamma a0^2)"
    nonconclusion: "not information loss physical irreversibility entropy causality or spacetime singularity"
  - property_id: "P5T03-PROP-LYAPUNOV"
    result: "dL/dlambda=-gamma a^4=-4 gamma L^2<=0"

source_control_functional:
  notation: "L(q_a)=a^2/2"
  status: "source_control_Lyapunov_functional"
  monotone: true
  strict_on_nonzero_orbits: true
  physical_energy: false
  action: false
  Hamiltonian: false
  entropy: false
  gradient_claimed: false
