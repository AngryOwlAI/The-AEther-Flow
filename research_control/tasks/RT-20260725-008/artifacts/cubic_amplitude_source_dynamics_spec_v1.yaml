scale_and_provenance:
  formal_unit_relation: "[gamma]=[lambda]^-1[a]^-2"
  amplitude_physical_dimension_selected: false
  parameter_physical_unit_selected: false
  physical_dimensionful_scale_introduced: false
  invariant_orbit_combination: "gamma a0^2 lambda"
  active_parameter_rescaling: "Phi^gamma_(c lambda)=Phi^(c gamma)_lambda"
  passive_parameter_regraduation: "lambda'=c lambda gives gamma'=gamma/c"
  amplitude_regraduation: "a'=d a gives gamma'=gamma/d^2"
  clock_nonconclusion: "gamma fixes no absolute rate, physical unit, or clock calibration"

positive_control:
  control_id: "P5T03-POSITIVE-NONZERO-ORBIT"
  inputs: "gamma=1, a0=1, lambda=1"
  expected_amplitude: "1/sqrt(3)"
  symbolic_checks:
    - "differentiate the closed form and recover da/dlambda=-gamma a^3"
    - "verify f_lambda(f_mu(a))=f_(lambda+mu)(a)"
    - "verify dL/dlambda=-gamma a^4"
    - "verify the orbit is nonconstant for a0!=0"

controls:
  - control_id: "P5T03-CONTROL-ZERO-RATE"
    kind: "trivial"
    condition: "gamma=0"
    exact_failure: "identity action supplies no nontrivial orbit"
    result: "fail_closed_nontriviality"
  - control_id: "P5T03-CONTROL-NEGATIVE-RATE"
    kind: "unstable"
    condition: "gamma=-beta with beta>0"
    exact_failure: "a(lambda)=a0/sqrt(1-2 beta a0^2 lambda) blows up at finite positive parameter"
    result: "fail_closed_global_forward_totality"
  - control_id: "P5T03-CONTROL-LAMBDA-SQUARED"
    kind: "malformed"
    condition: "hat_f_lambda(a)=exp(-gamma lambda^2)a"
    exact_failure: "hat_f_lambda after hat_f_mu differs from hat_f_(lambda+mu) when gamma lambda mu a is nonzero"
    result: "fail_closed_composition"
  - control_id: "P5T03-CONTROL-OFF-TANGENT"
    kind: "malformed"
    condition: "X_bad=-gamma a^3 sin(theta_1)+epsilon cos(theta_2), epsilon!=0"
    exact_failure: "cos(theta_2) lies outside Var_src(q_a) and the update leaves Q_amp"
    result: "fail_closed_variation_and_admissibility"
  - control_id: "P5T03-CONTROL-TARGET-IMPORT"
    kind: "malformed"
    condition: "gamma or X_gamma is selected from target metric curvature congruence exact-GR solution or benchmark fit"
    exact_failure: "hidden target import"
    result: "fail_closed_target_import"
  - control_id: "P5T03-CONTROL-PHYSICAL-OVERREAD"
    kind: "malformed_interpretation"
    condition: "L is called energy action Hamiltonian or entropy, or lambda is called physical time"
    exact_failure: "untyped physical structure is asserted"
    result: "fail_closed_physical_overread"

