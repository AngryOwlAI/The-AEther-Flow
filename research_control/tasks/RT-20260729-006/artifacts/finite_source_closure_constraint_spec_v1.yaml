finite_input:
  carrier: "one exact declared finite P7-T02 carrier Omega"
  row_kernel: "P in Q_nonnegative^(Omega x Omega) with row sums one"
  conductance: "C=(P+P^T)/2"
  laplacian: "L_C=Diag(sum_{y != x} C_xy)-C_off_diagonal"
  source_configuration: "u in Q^Omega in the exact adopted P7-T06 variation domain"
  source_response: "a_C(u)=L_C u"
  source_response_status: "adopted_by_postulate_in_exact_P7_scope"

formal_objects:
