  measure:
    definition: "counting measure"
  gauge_kernel:
    symbol: "K_C"
    definition: "ker L_C, componentwise constants"
  gravitational_carrier:
    symbol: "Q_C"
    definition: "Q^Omega / K_C"
    interpretation_status: "proposal_only_not_physical_gravity"
  balanced_matter_response:
    symbol: "A_C"
    definition: "K_C orthogonal complement, equivalently componentwise zero-sum vectors"
  source_to_matter_map:
    symbol: "a_C"
    definition: "u maps to L_C u in A_C"
  source_to_closure_map:
    symbol: "C_C"
    definition: "u maps to [L_C^+ a_C(u)] = [u] in Q_C"
  response_operator:
    symbol: "E_C"
    definition: "E_C([h];u)=alpha L_C h-beta a_C(u)"
  action_family:
    symbol: "S_C^(alpha,beta)"
    definition: "(alpha/2) h^T L_C h - beta a_C(u)^T h"
  named_candidate_coefficients:
    alpha: "1"
    beta: "1"

derivation:
  first_variation: "delta S[eta]=eta^T(alpha L_C h-beta a_C(u))"
  constraint: "alpha L_C h=beta L_C u"
  unique_solution_class: "[h]=(beta/alpha)[u]"
  named_candidate_solution: "[h]=[u]"
  named_candidate_on_shell_value: "-V_src(u)"
  solvability_condition: "a is componentwise balanced"
  gauge_invariance_condition: "a is componentwise balanced"
  Helmholtz_check: "alpha L_C is symmetric in the stipulated counting pairing"
  gluing_check: "finite edge and vertex densities use a fixed ownership partition with zero overlap defect"
  automorphism_check: "R^T L_C R=L_C implies simultaneous (h,u) equivariance"

