schema_id: "v21_stable_burden_definitions_v1"
authority: "project_control"
status_fields_are_forbidden: true
definition_source_path: "research_control/design/gr_derivation_burden_map.md"
current_status_source_path: "registries/DISTANCE_TO_GR_LEDGER.csv"
dependency_semantics: "Authored roadmap dependencies are planning dependencies only. They do not establish scientific sufficiency adoption promotion or completed derivation."
definitions:
  - milestone: "source_ontology"
    required_object: "primitive substrate data"
    depends_on: []
    route_kind: "core_chain"
    blocking_burden_definition: "canonical adoption rules"
    accept_criteria_definition: "source-only definitions with claim boundaries"
    failure_or_freeze_definition: "human-gated ontology change"
  - milestone: "source_equivalence_eqsrc"
    required_object: "EqSrc and its supporting source-equivalence objects"
    depends_on:
      - "source_ontology"
    route_kind: "core_chain"
    blocking_burden_definition: "equivalence under variations"
    accept_criteria_definition: "theorem plus stress pass"
    failure_or_freeze_definition: "freeze route"
  - milestone: "source_localization_obsloc_lc"
    required_object: "ObsLoc_lc"
    depends_on:
      - "source_equivalence_eqsrc"
    route_kind: "core_chain"
    blocking_burden_definition: "robustness and exact-branch limits"
    accept_criteria_definition: "concrete witness plus audit"
    failure_or_freeze_definition: "freeze route"
  - milestone: "response_localization_resp_lc"
    required_object: "Resp_lc"
    depends_on:
      - "source_localization_obsloc_lc"
    route_kind: "core_chain"
    blocking_burden_definition: "selector data o^R nu^R and kappa^R"
    accept_criteria_definition: "source-only witness or admissible extension"
    failure_or_freeze_definition: "NDCL-RESP-LC-SELECTOR-UNDERDETERMINATION or human gate"
  - milestone: "source_manifold_m_src"
    required_object: "M_src"
    depends_on:
      - "response_localization_resp_lc"
    route_kind: "core_chain"
    blocking_burden_definition: "response and localization bridge"
    accept_criteria_definition: "construction theorem"
    failure_or_freeze_definition: "freeze route"
  - milestone: "effective_metric_g_eff"
    required_object: "g_eff"
    depends_on:
      - "source_manifold_m_src"
    route_kind: "core_chain"
    blocking_burden_definition: "metric law"
    accept_criteria_definition: "source-to-metric map"
    failure_or_freeze_definition: "freeze route"
  - milestone: "matter_coupling"
    required_object: "universal coupling"
    depends_on:
      - "effective_metric_g_eff"
    route_kind: "core_chain"
    blocking_burden_definition: "response semantics"
    accept_criteria_definition: "coupling derivation"
    failure_or_freeze_definition: "freeze route"
  - milestone: "einstein_equations"
    required_object: "field equations"
    depends_on:
      - "matter_coupling"
    route_kind: "core_chain"
    blocking_burden_definition: "dynamics action and variation"
    accept_criteria_definition: "derivation theorem"
    failure_or_freeze_definition: "freeze route"
  - milestone: "benchmark_promotion"
    required_object: "exact-GR benchmark and Gate Chair status"
    depends_on:
      - "einstein_equations"
    route_kind: "protected_terminal_chain"
    blocking_burden_definition: "all prior objects and protected verdict authority"
    accept_criteria_definition: "explicit human-gated Gate Chair approval"
    failure_or_freeze_definition: "human gate"
  - milestone: "finite_toy_metric_response"
    required_object: "finite source-to-response toy model"
    depends_on:
      - "source_equivalence_eqsrc"
    route_kind: "auxiliary_control_target"
    blocking_burden_definition: "minimal finite response analogue"
    accept_criteria_definition: "source set response relation toy metric analogue and invariance checks"
    failure_or_freeze_definition: "route frozen or redesigned before full GR"
forbidden_conclusions:
  - "authored dependency as proof of scientific sufficiency"
  - "generated current status as independent scientific authority"
  - "control status as ontology adoption"
  - "mathematical status as physical interpretation"
  - "validator PASS as proof or promotion authority"
  - "scoped source evidence as completed derivation"
