conditional_metric_normalization_theorem:
  theorem_id: "THM-P4T02-CONSTANT-RESCALING-UNDERDETERMINATION"
  title: "Order invariance does not uniquely normalize a Lorentzian metric"
  hypotheses:
    - "C_src is a continuum-first premetric source tuple as typed above."
    - "A smooth Lorentzian metric g on A exists; this is a conditional hypothesis and not a member of C_src."
    - "g is order-invariant: Phi_lambda^* g = g for every lambda in Lambda_plus."
  conclusion: "For every positive real c, g_c = c^2 g is a smooth order-invariant Lorentzian metric. If c and d are distinct positive constants, then g_c and g_d are distinct tensor fields. Therefore C_src together with existence and order invariance of g does not uniquely fix metric normalization."
  proof:
    - "Multiplication by c^2 > 0 preserves smoothness, symmetry, nondegeneracy, and the inertia indices of g, so g_c is Lorentzian."
    - "Pullback is linear and c is constant, hence Phi_lambda^* g_c = Phi_lambda^*(c^2 g) = c^2 Phi_lambda^* g = c^2 g = g_c."
    - "If c != d, nondegeneracy gives at any chosen point p tangent vectors v and w with g_p(v,w) != 0; then (g_c - g_d)_p(v,w) = (c^2-d^2)g_p(v,w) != 0. Thus g_c != g_d."
    - "The positive constants therefore produce a continuum of distinct invariant Lorentzian tensor fields whenever one such g exists, leaving normalization unselected by the stated primitive data."
  exact_limits:
    - "This is conditional and supplies no existence theorem for a Lorentzian metric."
    - "It does not select Lorentzian signature, a conformal class, causal structure, orientation, or a source-to-target map."
    - "It does not claim that constant rescalings are physically inequivalent; units, calibration, or a later source law could relate or select them."
    - "It proves only failure of unique tensor normalization under the stated data, not impossibility of future scale selection."
    - "It derives neither clock rates nor physical time from lambda or Phi."

