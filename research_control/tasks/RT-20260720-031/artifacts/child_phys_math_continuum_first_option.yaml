continuum_first_premetric_primitive_tuple:
  symbol: "C_src = (A, tau, U_infinity, Lambda_plus, Phi, I, {E_i -> A}_{i in I}, C_adm, G_str)"
  object_type: "class of source models"
  components:
    - component: "(A, tau, U_infinity)"
      type: "connected, Hausdorff, second-countable, boundaryless smooth manifold of dimension four, with chosen topology tau and maximal smooth atlas U_infinity"
      status: "explicit primitive debt"
      boundary: "The continuum-first branch assumes dimension, topology, connectedness, boundary convention, and differentiability; it does not derive or select them."
    - component: "Lambda_plus"
      type: "the additive ordered monoid (R_{>=0}, +, 0)"
      status: "explicit primitive debt"
      boundary: "Its parameter is an ordering label and is not physical clock time."
    - component: "Phi"
      type: "smooth left action Phi: Lambda_plus x A -> A satisfying Phi_0 = id_A and Phi_(lambda+mu) = Phi_lambda o Phi_mu"
      status: "proposal-only source structure"
      boundary: "No Lorentzian time direction, causal order, clock rate, or evolution law follows from the action axioms alone."
    - component: "I and {E_i -> A}_{i in I}"
      type: "a declared index set and declared smooth finite-rank source bundles over A"
      status: "typed primitive field content"
      boundary: "Bundle sections have no matter, detector, stress-energy, or observable semantics unless a later independent bridge supplies them."
    - component: "C_adm"
      type: "a prospectively fixed subset of the product of smooth section spaces Product_i Gamma(E_i), defined only by source-side regularity and constraint predicates"
      status: "proposal-only admissible configuration space"
      boundary: "Admissibility may not be defined by importing a target metric, target atlas, Einstein equations, or successful benchmark behavior."
    - component: "G_str"
      type: "a declared groupoid of structural morphisms of source models, covering smooth maps that preserve the stated source data"
      status: "proposal-only structural relation"
      boundary: "G_str is not physical gauge and does not establish operational indistinguishability."
  premetric_meaning: "No metric, conformal class, affine or Levi-Civita connection, causal cone, time orientation, metric volume element, Hodge operator, proper-time functional, or metric-dependent action is a member of C_src."

