overread_risks_and_resolutions:
  - risk_id: "OR-P4T02-001"
    risk: "Mathematical precision is read as ontology adoption."
    resolution: "Attach draft/control and proposal-only status to the object and require protected authority for any adoption."
  - risk_id: "OR-P4T02-002"
    risk: "Starting from a smooth four-manifold is reported as explaining why spacetime is four-dimensional and smooth."
    resolution: "Record dimension, topology, and differentiability as explicit primitive debt and remove manifold emergence only from this branch's internal target list."
  - risk_id: "OR-P4T02-003"
    risk: "The order action is relabeled as physical time."
    resolution: "Keep lambda as an ordering parameter and require causal, clock, matter, detector, and operational bridge data before physical-time language."
  - risk_id: "OR-P4T02-004"
    risk: "Source automorphism invariance is promoted to physical gauge."
    resolution: "Reserve physical-gauge language until an adopted operational equivalence and observable semantics are supplied."
  - risk_id: "OR-P4T02-005"
    risk: "The source arena is identified with the exact-GR spacetime because both are four-dimensional manifolds."
    resolution: "Maintain distinct source and target types; require a no-target-import realization construction, noting that a diffeomorphism alone would not derive metric or physical semantics."
  - risk_id: "OR-P4T02-006"
    risk: "Exact-GR target closure is recycled as evidence that the source option derives GR."
    resolution: "Use exact GR only as the operational target and recovery burden; preserve every source-to-metric, matter, coupling, and dynamics obligation."
  - risk_id: "OR-P4T02-007"
    risk: "A local underdetermination result is inflated into an impossibility or regime verdict."
    resolution: "State only what current primitives fail to select and preserve future source-extension, P4-T03, comparison, and human-gated adoption routes."
