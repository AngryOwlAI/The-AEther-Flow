natural_root_obstruction:
  theorem_id: "THM-RT002-PM-NO-EQUIVARIANT-ROOT-001"
  object: "The regular two-element S2-torsor P={0,1}."
  hypothetical_map: "r:one->P, where one has the trivial S2 action."
  formal_statement: "There is no S2-equivariant map r from one to P; equivalently, the unbroken two-object torsor admits no automorphism-natural distinguished root."
  proof: "Let sigma be the nontrivial swap. Equivariance requires sigma(r(*))=r(sigma(*))=r(*). But sigma fixes neither 0 nor 1. Thus no possible value of r(*) satisfies equivariance."
