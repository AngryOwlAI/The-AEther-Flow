      arrow_action: "a_00->a_11;a_01->a_10;a_10->a_01;a_11->a_00"
      status: "automorphism"
  exhaustion_proof: "Every category automorphism induces a bijection of the two-object set, hence either e or sigma. In a pair groupoid there is exactly one arrow for each ordered pair, so the object action uniquely forces the arrow action. Both forced actions preserve source, target, identities, composition, and inverse. No third automorphism exists."
  falsifier: "A category automorphism whose object action is neither e nor sigma, or two distinct arrow actions over one fixed object permutation, would falsify exhaustion."

