theory_scope_old_language_conservativity:
  theorem_id: "THM-RT002-PM-PRODUCT-CONSERVATIVITY-001"
  theorem_name: "disjoint finite product-expansion conservativity theorem"
  old_signature: "Sigma_cur"
  old_theory: "T_cur"
  extension_theory: "T_pair"
  expansion_construction: "For every M satisfying T_cur and epsilon in {0,1}, E_epsilon(M) retains the entire Sigma_cur interpretation of M unchanged and adjoins the fixed pair groupoid, Bool_ext, identity transports, and the constant predicate q_epsilon."
  reduct_identity: "U(E_epsilon(M))=M exactly for every M satisfying T_cur."
  model_expandability_scope: "Every model of T_cur has at least the two expansions E_0(M) and E_1(M) satisfying T_pair."
  formal_statement: "For every Sigma_cur sentence phi, T_pair entails phi if and only if T_cur entails phi."
  proof: "The reverse direction holds because T_pair contains T_cur. For the forward direction, suppose T_cur does not entail phi. Then some M satisfies T_cur and not phi. Its disjoint product expansion E_0(M) satisfies T_pair, and because phi uses only Sigma_cur, E_0(M) also satisfies not phi. Hence T_pair does not entail phi."
  status: "PASS_THEORY_SCOPE"
  exact_scope_limit: "This proves old-language logical conservativity of the disconnected finite shell. It does not prove that the added carrier, arrows, predicate, root, or bridge are definable or derivable from current source data."
  falsifier: "A model M of T_cur having no T_pair expansion, an extension axiom that constrains an old symbol, or a Sigma_cur sentence entailed by T_pair but not by T_cur would falsify the theorem at the claimed scope."

