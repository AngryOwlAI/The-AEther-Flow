new_mathematical_payload:
  payload_count: "5"
  items:
    - payload_id: "PAYLOAD-PHIL-01"
      payload_type: "theorem"
      object_name: "pair-groupoid natural-admission classification"
      claim_status: "draft/control"
      burden_effect: "obstructs"
      statement: "For the connected thin pair groupoid on two objects with trivial Boolean transport, naturality along either nonidentity arrow forces equality of the two admission values. Hence exactly the constant-false and constant-true predicates are natural, and no singleton admission exists."
      proof: "There are four functions from two objects to Bool. Naturality along s01 is a(p0)=a(p1); s10 repeats the reverse equality. Exactly two functions satisfy it."
      falsifier: "Exhibit a third Boolean predicate satisfying both explicitly stated identity-transport equations, or show that one enumerated arrow or predicate is missing."
    - payload_id: "PAYLOAD-PHIL-02"
      payload_type: "theorem"
      object_name: "two-object natural-root impossibility"
      claim_status: "draft/control"
      burden_effect: "obstructs"
      statement: "No automorphism-equivariant rule selects one root from the unbroken two-object pair groupoid."
      proof: "The swap is an automorphism of the unlabelled input and fixes no object. Equivariance would require the selected root to be fixed by that swap, a contradiction."
      falsifier: "Provide a root-selection rule invariant under the displayed swap, or provide independently sourced structure that removes the swap from the admissible automorphism group."
    - payload_id: "PAYLOAD-PHIL-03"
      payload_type: "countermodel"
      object_name: "conservativity-without-epistemic-selection counterpair"
      claim_status: "draft/control"
      burden_effect: "narrows"
      statement: "Two expansions E0 and E1 over the same R_cur may be equally old-language conservative while choosing opposite roots or admissions; therefore conservativity is necessary but not an epistemic selector."
      proof: "Attach the same two-object finite carrier to R_cur, designate p0 in E0 and p1 in E1, and forget all added data. Both reducts equal R_cur, yet their added admissions differ."
      falsifier: "Prove a unique-expansion or definitional-extension theorem in Sigma_cur that makes E0 and E1 identical over R_cur."
    - payload_id: "PAYLOAD-PHIL-04"
      payload_type: "lemma"
      object_name: "syntax-provenance-adoption nonimplication trilemma"
      claim_status: "draft/control"
      burden_effect: "narrows"
      statement: "Syntactic sufficiency, epistemic provenance, and canonical adoption are pairwise noncollapsing gates: a rooted fixture can be well typed without source provenance; an independently sourced proposal can remain unadopted; validation or adoption authority cannot retroactively derive its mathematics from the current ontology."
      proof: "The conditional rooted fixture witnesses syntax without provenance. The governance boundary permits proposal-only source data while blocking adoption. Workflow status is explicitly non-scientific, so none of the three implications is licensed."
      falsifier: "Provide a tracked authority rule and source theorem that explicitly identifies the relevant two layers without using desired admission, target behavior, or workflow success as a premise."
    - payload_id: "PAYLOAD-PHIL-05"
      payload_type: "obstruction"
      object_name: "canonical-manifold provenance obstruction"
      claim_status: "draft/control"
      burden_effect: "obstructs"
      statement: "The current smooth-manifold primitive does not naturally supply a presentation root or orientation. On the admitted R4 control, translations have no common fixed point; smoothness alone also neither entails orientability nor selects an orientation when two exist."
      proof: "For any proposed point x in R4, translation by nonzero v sends x to x+v, so no diffeomorphism-natural distinguished point exists. Orientation is additional structure, not part of the definition of a smooth manifold."
      falsifier: "Cite a pre-outcome canonical source datum such as a distinguished point, uniquely characterized invariant, chosen orientation, or lawful Phi_src structure, with an acyclic source-only derivation and no target import."

