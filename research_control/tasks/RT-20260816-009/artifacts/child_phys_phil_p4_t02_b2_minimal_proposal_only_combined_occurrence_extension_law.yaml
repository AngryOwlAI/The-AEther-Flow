theorem_targets:
  - theorem_id: "THM-01-GROTHENDIECK-TYPING"
    status: "proved_for_declared_candidate"
    hypotheses: "D_SOURCE_OPEN is a category; F_occ is functorial; Adm_occ is a nonempty invariant subfunctor."
    statement: "The category X_OCC=Integral(Adm_occ) and projection U:X_OCC->D_SOURCE_OPEN are well formed, and U is a discrete opfibration over source isomorphisms and restriction arrows."
    proof: "Objects are base objects with an admissible section. Functorial transport supplies the unique lifted target along each admitted base arrow. Identity and composition follow from section transport, while E-intertwining keeps transported sections in Adm_occ."
    falsifier: "A base arrow without a typed field transport, a failure of identity or composition, or a transported solution that fails the target equation destroys the claimed total category."
  - theorem_id: "THM-02-GROUPOID-SECTION"
    status: "proved_as_control_not_selected_mode"
    hypotheses: "A groupoid G acts functorially on a fibre A."
    statement: "A natural deterministic section exists on a connected component exactly when a representative isotropy group has a fixed element; the candidate does not use such a section."
    proof: "Naturality forces the representative value to be fixed by every isotropy arrow. Conversely, transport of a fixed representative value is path-independent because two paths differ by isotropy."
    falsifier: "A two-point C2 torsor has empty fixed locus and therefore no natural section."
  - theorem_id: "THM-03-CONSERVATIVE-REDUCT"
    status: "proved_model_conservative_not_definitionally_conservative"
    hypotheses: "Every current homogeneous source model has the zero-section expansion, and old-language satisfaction depends only on Red."
    statement: "The proposal is semantically conservative for old-language statements because Red is surjective on base models, but it is not a definitional extension when one reduct has inequivalent q=0 and q=c expansions."
    proof: "Any old countermodel d lifts to (d,0), so no new old-language theorem is forced. Unique definability would require a unique expansion over d up to the admitted over-d identity; zero and a nonzero constant solution are distinct and linear source arrows preserve zero."
    falsifier: "Failure of a zero solution would block the surjectivity proof; proof that every reduct has exactly one expansion up to unique over-d isomorphism would refute nondefinitionality."
  - theorem_id: "THM-04-NONDEFINABILITY-CONTROL"
    status: "proved_for_declared_candidate"
    hypotheses: "A nonempty open admits q=0 and a nonzero constant q=c for the fixed first-order homogeneous law."
    statement: "The old source reduct does not select a unique proposal token, even though the entire admissible fibre is constructed naturally."
    proof: "Both expansions have identical D, open domain, equations, arrows, and reduction data but different q values. The reduct forgets q, so selection of one expansion needs additional structure not present in the old reduct."
    falsifier: "An independently current-source-derived natural rule uniquely selecting one q in every fibre would defeat this particular nonselection conclusion."
  - theorem_id: "THM-05-NATURALITY"
    status: "proved_under_exact_current_source_arrow_hypothesis"
    hypotheses: "Every admitted source arrow g carries a field transport T_g satisfying E_{d_prime} T_g=T_g E_d and compatible open restriction."
    statement: "F_occ, Adm_occ, restriction, gluing, and U commute with every independently admitted source arrow."
    proof: "Intertwining sends solutions to solutions. Functor laws for T_g give identity, inverse, and composition coherence. Field transport commutes with restriction, and uniqueness of smooth gluing makes transport commute with gluing."
    falsifier: "An independently admitted source arrow lacking an E-intertwiner, or a restriction square that fails to commute, yields a source-category typing or naturality obstruction."
  - theorem_id: "THM-06-PROVENANCE-ACYCLICITY"
    status: "proved_for_recorded_candidate_graph"
    hypotheses: "The declared finite dependency edges are exactly those listed in the provenance DAG and are fixed before P4 comparison."
    statement: "The recorded candidate is syntactically nonadaptive to P4 output, target geometry, empirical response, and benchmark answers."
    proof: "The displayed node order is topological: source roots and the explicit semantic proposal root precede field fibres, solution membership, transport, total carrier, and the future comparison interface. No forbidden output node has an edge into an earlier candidate declaration."
    falsifier: "Adding any dependency from a desired P4 verdict, Y_PS value, cone, metric, empirical response, or benchmark output into F_occ, Adm_occ, transport, attachment, or arrow admission breaks the topological order."

new_mathematical_payload:
  payload_count: 5
  payloads:
    - payload_id: "NMP-RT016-009-PHIL-001"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "Local-solution subfunctor descent theorem"
      statement: "For a local differential source operator E_d, the assignment O maps to ker(E_d|_O) is a sheaf: solutions restrict, and overlap-compatible local solutions glue uniquely to a solution."
      proof: "Restriction commutes with a local differential operator. Smooth local sections glue uniquely when equal on overlaps. The glued E_d(q) restricts to zero on every cover member and therefore vanishes locally and globally."
      falsifier: "A nonlocal equation whose value on O depends on data outside O, or incompatible local sections, invalidates the sheaf conclusion."
      burden_effect: "proposal_carrier_typing_only_no_distance_delta"
    - payload_id: "NMP-RT016-009-PHIL-002"
      payload_type: "bridge_map_candidate"
      name: "Proposal-only Grothendieck solution carrier"
      statement: "Integral(ker E) with projection U gives a typed combined carrier whose morphisms are induced entirely by source restrictions and E-intertwining presentation arrows."
      proof: "The local-solution assignment is functorial by THM-05, so the category-of-elements construction supplies objects, arrows, identities, composition, and projection."
      falsifier: "Failure of an admitted arrow to preserve ker E makes the carrier nonfunctorial."
      burden_effect: "source_extension_candidate_only_no_distance_delta"
    - payload_id: "NMP-RT016-009-PHIL-003"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "Semantic conservativity and nondefinitionality separation"
      statement: "Zero-section liftability makes the proposal model-conservative for the old language, while two distinct same-reduct solutions make the extension nondefinitional and nonselecting."
      proof: "Every old model lifts, preserving old countermodels. Yet q=0 and q=c lie over the same reduct and cannot both be the unique definition of a new token."
      falsifier: "A base model with no solution defeats model conservativity; unique expansion of every base model defeats the nondefinitionality witness."
      burden_effect: "logical_classification_only_no_distance_delta"
    - payload_id: "NMP-RT016-009-PHIL-004"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "Finite-family zero-section robustness lemma"
      statement: "For any finite family of homogeneous local source operators E_j on the same typed field bundles, each candidate solution fibre is nonempty because q=0 lies in every ker(E_j), and the restriction/gluing proof remains valid for every j."
      proof: "Homogeneity gives E_j(0)=0. Locality for each E_j supplies restriction and gluing. The argument is uniform over a finite indexed family and needs no physical norm."
      falsifier: "An affine source term with E_j(0) nonzero defeats this nonemptiness witness; a nonlocal E_j defeats the descent statement."
      burden_effect: "bounded_structural_robustness_only_no_distance_delta"
    - payload_id: "NMP-RT016-009-PHIL-005"
      payload_type: "countermodel_or_obstruction"
      name: "Output-independent attachment versus selected-arrow circularity"
      statement: "The full current source-arrow class can act on ker E when arrows intertwine E, whereas restricting arrows to those preserving a preferred q would manufacture naturality from the desired attachment."
      proof: "E-intertwining is stated solely in source-law terms and preserves the whole solution fibre. A preferred-q restriction depends on the candidate output and reverses the intended dependency direction."
      falsifier: "An independently preexisting source axiom selecting q before the proposal would remove the circularity objection for that q, but no such axiom is claimed here."
      burden_effect: "smuggling_control_only_no_distance_delta"

