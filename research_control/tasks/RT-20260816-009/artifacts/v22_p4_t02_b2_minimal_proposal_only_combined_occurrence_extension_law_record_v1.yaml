construction:
  source_base: "D_source is the independently admitted source-presentation and source-open system carrying the registered P4-T01 rank-six reduced equation bundle W_eq and invertible equation-frame covariance."
  fibre_functor: "F_occ(d,O)=Gamma(O,End(W_eq(d))). A source/equation-frame arrow g with invertible S_g transports P by source pullback and S_g P S_g inverse."
  admissibility: "Adm_occ(d,O) is the pointwise idempotent subsheaf P squared equals P."
  grothendieck_extension: "X_OCC is the category of elements of Adm_occ; U:X_OCC->D_source forgets P."
  attachment_semantic_mode: "deterministic_natural_null_section"
  attachment: "s0(d,O)=(d,O,0_W_eq). Conjugation and restriction fix zero."
  absent_attachment_modes:
    invariant_subfunctor_as_attachment: false
    normalized_equivariant_kernel: false
    physical_probability: false
  restriction_and_gluing: "Smooth endomorphism sections restrict and glue. Pointwise idempotency is local, so compatible local idempotents glue to an idempotent."
  robustness: "d_rank,O(P,Q)=sup_x rank(P_x-Q_x) takes values from zero through six, is conjugation invariant and restriction nonexpansive, and isolates zero from every nonzero idempotent by distance at least one."
  conservativity: "Proposal decorations are inert in every old source equation, coefficient, constraint, gauge rule, and lawful reduction. Every old model has the zero expansion, so old-language validity is model conservative under this explicit expansion hypothesis."
  point_selection_nonuniqueness: "P=0 and P=I are distinct admissible X_OCC objects over the same old reduct. This shows that the old reduct does not choose an arbitrary decoration token."
  definitionality_precision: "End(W_eq), the zero map, identity, idempotency, and rank are algebraically definable once W_eq is present. The same-reduct control does not prove the carrier sort or zero map nondefinable; it proves only that a chosen P token is not recoverable from the old reduct. The proposal novelty is the occurrence/admissibility/attachment semantics."

