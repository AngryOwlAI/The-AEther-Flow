theorem_targets:
  theorem_count: 6
  items:
    - theorem_id: "THM-01-GROTHENDIECK-TYPING"
      status: "proved_conditionally"
      statement: "Equation-frame conjugation defines functorial fibres, the idempotent subfunctor, X_OCC, and U."
      proof: "Conjugation preserves products and idempotency; invertible frame transports satisfy identity, composition, and inverse laws, so the category of elements is well formed."
      falsifier: "A source arrow without an invertible typed equation-frame map or with incoherent composition destroys F_occ."
    - theorem_id: "THM-02-GROUPOID-SECTION"
      status: "proved_conditionally"
      statement: "Natural sections exist componentwise exactly at transport-coherent isotropy-fixed points; zero supplies the candidate section."
      proof: "Naturality forces isotropy fixation, and a fixed representative transports path-independently. Every conjugation fixes zero."
      falsifier: "The two-point swap torsor has no fixed point and no deterministic natural section."
    - theorem_id: "THM-03-CONSERVATIVE-REDUCT"
      status: "proved_under_explicit_hypothesis"
      statement: "The inert decoration extension is old-language model conservative because every old model has a zero expansion."
      proof: "Every old countermodel lifts with P=0 and the reduct changes no old interpretation."
      falsifier: "Any proposal axiom constraining an old source equation, coefficient, constraint, gauge rule, or reduction invalidates the proof."
    - theorem_id: "THM-04-SAME-REDUCT-NONSELECTION"
      status: "proved_with_definitionality_qualification"
      statement: "The old reduct does not select an arbitrary idempotent token because P=0 and P=I lie over the same reduct."
      proof: "Both are idempotent and equation-frame natural while Red forgets P."
      falsifier: "An independently current-source-derived rule recovering one chosen P from every reduct would defeat token nonselection."
      qualification: "This does not show End(W_eq), zero, identity, or the carrier functor are algebraically nondefinable."
    - theorem_id: "THM-05-NATURALITY-DESCENT-RANK-ISOLATION"
      status: "proved_conditionally"
      statement: "Conjugation transport, restriction, gluing, and d_rank are natural; d_rank is bounded by six, restriction nonexpansive, and the null section is isolated from nonzero idempotents."
      proof: "Conjugation preserves products and matrix rank. Idempotency is local. Supremum over a smaller open cannot increase. A nonzero matrix has positive rank."
      falsifier: "A noninvertible frame map, nonlocal admissibility law, or physical-norm interpretation invalidates the stated scope."
    - theorem_id: "THM-06-PROVENANCE-ACYCLICITY"
      status: "proved_for_written_dag"
      statement: "The disclosed dependency graph is acyclic and has no target, empirical, P4, or frozen-output ancestor of the carrier, admissibility, attachment, or controls."
      proof: "A topological order is source base and W_eq; algebraic operations and proposal semantic roots; fibres and Adm; X_OCC and s0; comparison only."
      falsifier: "Adding desired P4 success as an ancestor of the attachment or arrow class creates the exact back-edge cycle."

