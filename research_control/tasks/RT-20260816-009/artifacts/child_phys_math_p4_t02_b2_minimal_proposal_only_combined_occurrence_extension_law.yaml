    - theorem_id: "THM-03-CONSERVATIVE-REDUCT"
      title: "Old-language semantic conservativity of the inert proposal extension"
      statement: "If proposal decorations enter no old source equation, coefficient, constraint, gauge generator, redundancy, or lawful reduction, then Red is surjective on models via P=0 and the extension is conservative for old-language consequences."
      hypotheses:
        - "Every old model has the zero-decoration extension."
        - "Old-language satisfaction depends only on the reduct d."
        - "No proposal datum modifies the fixed P4-T01 law or reduction."
      proof:
        - "Let an old-language sentence phi fail in an old model d."
        - "The pair (d,0) is an extended model because zero is idempotent."
        - "By inertness, (d,0) has the same old-language truth values as d and still falsifies phi."
        - "Thus the extension cannot create a new old-language consequence."
      falsifier: "An old model without any admissible decoration or any P-dependent change to an old equation or reduction invalidates the conservativity proof."
      status: "proved_conditionally_for_disclosed_inert_law"
    - theorem_id: "THM-04-NONDEFINABILITY-CONTROL"
      title: "Same-reduct nondefinability witness"
      statement: "For nonzero W_eq, the extensions (d,0) and (d,I) have the same old reduct but distinct admissible decorations of ranks zero and six, so the full proposal extension is not a unique definitional expansion of the old language."
      hypotheses:
        - "W_eq has positive rank; the fixed P4-T01 instance has rank six."
        - "Both zero and identity are admitted idempotents."
        - "The attachment section does not remove other admissible carrier objects."
      proof:
        - "Zero squared equals zero and identity squared equals identity, so both lie in Adm_occ(d)."
        - "Red forgets P, hence both pairs reduce to the same d."
        - "Conjugation preserves rank; rank zero cannot be conjugate to rank six. Therefore the expansions are distinct even modulo admitted equation-frame isomorphism."
        - "A unique-expansion condition required for definitional extension fails. The distinguished s0 is only a base attachment, not an axiom deleting (d,I)."
      falsifier: "If W_eq were the zero bundle or the extended theory explicitly admitted only P=0, this particular two-expansion witness would fail."
      status: "proved_for_fixed_rank_six_instance"
    - theorem_id: "THM-05-NATURALITY-RESTRICTION-GLUING-ROBUSTNESS"
      title: "Source naturality, descent, and bounded algebraic rank robustness"
      statement: "Conjugation transport commutes with restriction, compatible local admissible endomorphisms glue uniquely, and d_rank is a bounded metric with values from zero through six that is invariant under source-arrow conjugation and nonincreasing under restriction."
      hypotheses:
        - "W_eq is a smooth finite-rank equation bundle on each admitted source open."
        - "Local sections agree on overlaps under the fixed bundle identifications."
        - "Equation-frame maps are invertible and restrict compatibly."
      proof:
        - "Restriction of S P S inverse equals restricted S times restricted P times restricted S inverse, proving transport-restriction commutation."
        - "Smooth endomorphism sections form a sheaf. Agreeing P_i glue uniquely to P, and P squared=P holds because the equality is pointwise local."
        - "Rank(P_x-Q_x) lies between zero and six. Symmetry and separation are immediate, and rank(A+C) is at most rank(A)+rank(C), yielding the triangle inequality pointwise and after supremum."
        - "Simultaneous conjugation preserves rank, so d_rank is source-arrow invariant. Restricting the supremum to a smaller open cannot increase it."
      falsifier: "Noncompatible local endomorphisms do not glue; a noninvertible or output-relative transport need not preserve the construction; and d_rank supplies no continuity or physical-norm claim beyond its exact bounded algebraic properties."
      status: "proved_for_disclosed_proposal"
    - theorem_id: "THM-06-PROVENANCE-ACYCLICITY"
      title: "Pre-outcome provenance acyclicity"
      statement: "The disclosed dependency graph for F_occ, Adm_occ, X_OCC, s0, and d_rank is acyclic and every ancestor is a fixed source root or one of four proposal roots declared before P4 diagnostics; therefore no desired P4 or target node is an ancestor in the written construction."
