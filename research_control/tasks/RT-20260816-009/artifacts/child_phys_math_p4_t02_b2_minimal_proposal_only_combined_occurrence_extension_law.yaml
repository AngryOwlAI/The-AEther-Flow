theorem_targets:
  theorem_target_count: 6
  targets:
    - theorem_id: "THM-01-GROTHENDIECK-TYPING"
      title: "Grothendieck typing of the idempotent-decoration extension"
      statement: "Conjugation transport makes Adm_occ a well-defined functor on every fixed-open source groupoid; its category of elements X_OCC and projection U are therefore well typed."
      hypotheses:
        - "Each admitted source arrow carries an invertible equation-frame map S_g between the fixed rank-six W_eq fibres."
        - "All source arrows are fixed independently of candidate output."
        - "Admissible decorations satisfy P squared equals P pointwise."
      proof:
        - "Identity transport is I P I inverse=P."
        - "For composable g,h, conjugation by S_h S_g equals conjugation by S_h after conjugation by S_g, so composition is exact."
        - "Conjugation by S_g inverse is the inverse transport."
        - "If P squared equals P, then (S_g P S_g inverse) squared equals S_g P squared S_g inverse=S_g P S_g inverse."
        - "The standard category-of-elements construction now gives objects (d,P), arrows g satisfying T_g(P)=P_prime, associative composition, identities, and the projection U."
      falsifier: "A noninvertible equation-frame map, an output-filtered arrow class, or one pair g,h for which T_hg differs from T_h after T_g destroys the stated groupoid functor and blocks X_OCC typing."
      status: "proved_for_disclosed_proposal"
    - theorem_id: "THM-02-GROUPOID-SECTION"
      title: "Isotropy fixed-point criterion and null-section existence"
      statement: "A natural deterministic section of a groupoid action exists componentwise exactly when each component representative has an isotropy-fixed admissible decoration. In this proposal zero is admissible and fixed by all conjugations, so s0 exists and is natural."
      hypotheses:
        - "The source-presentation arrows form groupoids on fixed opens."
        - "Adm_occ is the functor proved in THM-01."
      proof:
        - "Any natural section value P_d must satisfy T_h(P_d)=P_d for every h in Aut_source(d)."
        - "Conversely, choose one fixed P_r on each groupoid component representative r and transport it to any d; isotropy fixation makes the result independent of chosen isomorphism."
        - "For this construction P_r=0. Conjugation sends zero to zero for every arrow, so the componentwise choices assemble as s0."
      falsifier: "The two-point C2 torsor has no fixed point and therefore no natural deterministic section. This blocks a section for that control but does not block its carrier."
