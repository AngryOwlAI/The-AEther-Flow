    - payload_id: "PAYLOAD-C-PROVENANCE-FACTORIZATION"
      statement: "A proposed asymmetry is current-source derived only if it factors naturally through the registered source presentation functor; two admissible expansions over the same current reduct with different asymmetry data refute such factorization."
