new_mathematical_payload:
  payload_count: 5
  items:
    - payload_id: "PAYLOAD-RT014-PM-001"
      payload_type: "theorem"
      name: "torsor fixed-point criterion"
      statement: "For every group G and G-set P, evaluation at the unique point of the terminal G-set gives a bijection Hom_G(One,P) isomorphic to P^G. If P is a nonempty free torsor for a nontrivial G, then P^G is empty and no equivariant root exists."
      proof: "A G-map r:One->P is determined by p=r(*). Equivariance gives g.p=r(g.*)=r(*)=p for every g, so p lies in P^G. Conversely every fixed p defines a G-map. A free action has a fixed point only if every g is the identity; therefore a nontrivial free torsor has none."
      falsifier: "Exhibit a nontrivial free G-torsor with a G-fixed element, or an equivariant map One->P whose value is not fixed."
      scope_limit: "This theorem applies only to the declared G-action and does not forbid a richer source theory from adding independently provenanced symmetry-breaking structure."
      burden_effect: "obstructs_unsourced_root"
    - payload_id: "PAYLOAD-RT014-PM-002"
      payload_type: "theorem"
      name: "orbit quotient information-loss theorem"
      statement: "If P is a nonempty transitive G-set, then P/G is a singleton. If P is additionally a nontrivial free torsor, q:P->P/G is noninjective and has no G-equivariant section when the quotient carries its canonical trivial action."
      proof: "Transitivity places every element in one orbit, so the quotient has one element. A nontrivial torsor has more than one element, hence q is noninjective. An equivariant section would select a G-fixed element of P, contradicting the torsor fixed-point criterion."
      falsifier: "Exhibit two distinct orbits in a transitive P, injectivity of q for a nontrivial torsor, or a G-equivariant section of q."
      scope_limit: "The quotient can remain a lawful invariant; the theorem denies recovery of the lost root, not all diagnostic uses of orbit data."
      burden_effect: "rules_out_root_recovery_from_orbit_alone"
    - payload_id: "PAYLOAD-RT014-PM-003"
      payload_type: "theorem"
      name: "invariant factorization and zero-selector-force corollary"
      statement: "Every G-invariant map f:P->D to a trivially acted set factors uniquely through q:P->P/G. For a transitive P, the factor domain is a singleton, so f is constant and cannot discriminate presentation roots or unique admissions."
      proof: "The orbit quotient is the coequalizer of the action maps, so invariance makes f constant on each orbit and defines a unique map f_bar:P/G->D with f=f_bar composed with q. A transitive action has one orbit."
      falsifier: "Provide a G-invariant map to a trivial G-set that differs on two elements in the same orbit, or show that q lacks the quotient universal property."
      scope_limit: "A nontrivial equivariant downstream codomain may retain structured information, but its source definition and P4 relevance must be separately proven and cannot be supplied by the orbit label itself."
      burden_effect: "shows_route_B_has_zero_selector_force_without_new_source_map"
    - payload_id: "PAYLOAD-RT014-PM-004"
      payload_type: "theorem"
      name: "same-reduct provenance-factorization obstruction"
      statement: "Let U:E->C_cur forget presentation extensions and let alpha assign an asymmetry over each reduct. If alpha is current-source derived, there must exist a natural alpha_bar on C_cur with alpha=alpha_bar composed with U. Hence two admissible expansions e0 and e1 with U(e0)=U(e1) but alpha(e0) not equal to alpha(e1) refute factorization of that alpha through current source data."
      proof: "If alpha=alpha_bar composed with U and U(e0)=U(e1)=R, then alpha(e0)=alpha_bar(R)=alpha(e1), contradicting unequal fibre values."
      falsifier: "Construct a natural alpha_bar and prove equality with alpha on every admitted expansion, or show that the alleged same-reduct pair does not share an exact reduct."
      scope_limit: "One same-reduct pair refutes only the displayed alpha under the displayed extension class; it is not a global no-go against all conservative source extensions."
      burden_effect: "tests_independent_source_provenance"
    - payload_id: "PAYLOAD-RT014-PM-005"
      payload_type: "dependency_map_update"
      name: "current-model-groupoid audit before source-law proposal"
      statement: "The finite GATE-04 absence result does not exhaust parameter-free natural constructions on all current source models. A materially new audit must define C_cur, candidate functors P, and every structure-preserving automorphism; then either construct a natural selector or use one separating model with empty fixed-point fibre plus same-reduct factorization controls to issue a scoped obstruction. Only the obstruction branch makes a proposal-only source-law formalization the next evidence-changing route."
      proof: "A natural transformation must be invariant at every object, so one empty fixed-point fibre is sufficient to obstruct it. Conversely a candidate surviving one automorphism control is not a global natural transformation until transport along every audited arrow is proved."
      falsifier: "Show that RT002 already defined and exhausted the full current-source model groupoid and all natural selector functors, or exhibit a complete current-source natural selector now."
      burden_effect: "selects_materially_distinct_route_A"

