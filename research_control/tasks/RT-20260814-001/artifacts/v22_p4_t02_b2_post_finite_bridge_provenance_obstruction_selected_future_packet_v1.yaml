  - branch_id: "FB-08"
    result: "invalid_audit"
    trigger: "A target atlas metric cone empirical response benchmark answer or desired P4 outcome enters a definition."
  - branch_id: "FB-09"
    result: "invalid_audit"
    trigger: "Any of the six frozen candidate families is reconstructed or renamed."
  - branch_id: "FB-10"
    result: "overclaim_block"
    trigger: "A scoped current-source obstruction is stated as a global no-go or future-extension impossibility theorem."
  - branch_id: "FB-11"
