packet:
  packet_id: "PKT-V22-P4T02-B2-CURRENT-SOURCE-EQUIVARIANT-ASYMMETRY-DERIVATION-AUDIT-V1"
  packet_type: "bounded_theoretical_calculation"
  route_id: "A_CURRENT_SOURCE_EQUIVARIANT_ASYMMETRY_DERIVATION_AUDIT"
  route_label: "ordinary-research-packet"
  next_role_family: "ontology-formalizer@0.2.0"
  selected_packet_executed: false
  requires_human_gate: false
  objective: "Construct the semantic model and isomorphism groupoid of the exact registered current-source signature, then decide whether any predeclared presentation-relevant asymmetry is a natural current-source construction or whether a precise scoped typing naturality or factorization obstruction holds."
  target_derivation_milestone: "effective_metric_g_eff"
  milestone_burden: "Decide current-source equivariant asymmetry before proposing a new source law, without finite-fixture replay, target import, or root stipulation."
  result_scope: "current_source_derivation_audit_only"
  adoption_status: "not_applicable_current_source_audit"

fixed_inputs:
  current_source_package:
    source_arena: "Sub is a smooth four-dimensional source manifold carried as primitive debt"
    unresolved_slot: "Phi_src is an unresolved abstract source-order or evolution slot with no assigned domain action invertibility gauge or physical-time meaning"
    excluded_structure:
      - "source metric"
      - "source orientation"
      - "distinguished point or root"
      - "source order"
      - "presentation carrier or labels"
      - "admission predicate"
      - "EqSrc arrow category"
      - "source-to-presentation map"
  fixed_predecessor_obstruction_id: "OB-V22-P4T02-B2-FINITE-TYPED-PRESENTATION-ADMISSION-BRIDGE-SOURCE-PROVENANCE-001"
  fixed_predecessor_failed_gate: "GATE-04"
  finite_pair_groupoid_replay_permitted: false
  conditional_root_fixture_replay_permitted: false

formal_domains:
  - domain_id: "DOM-01"
    name: "Sigma_cur"
    definition: "The exact registered current-source signature extracted from canonical foundations and dynamics, with unresolved Phi_src represented only at its declared type boundary."
  - domain_id: "DOM-02"
    name: "Mod_cur"
    definition: "The predeclared class of models of Sigma_cur admitted by the audit, or an exact typing-obstruction result if that class cannot be formed without extra structure."
  - domain_id: "DOM-03"
    name: "Iso_cur"
    definition: "All isomorphisms preserving exactly the typed Sigma_cur structure, with identities inverses and composition checked."
  - domain_id: "DOM-04"
    name: "Exp_cur"
    definition: "Meta-level conservative presentation-data expansions used only to test factorization; no expansion is adopted as source ontology."
  - domain_id: "DOM-05"
    name: "AsymGrammar_cur"
    definition: "The finite predeclared candidate-codomain grammar for point root orientation order label admission and arrow-subclass asymmetries."
  - domain_id: "DOM-06"
    name: "NatCur"
    definition: "Natural transformations from the terminal current-source functor or another explicitly current-source-defined input functor into a candidate asymmetry functor."
  - domain_id: "DOM-07"
    name: "ControlFamilies"
    definition: "Exact translation reflection permutation and same-reduct families declared before outcome computation."
  - domain_id: "DOM-08"
    name: "AuditEvidence"
    definition: "Typed formation naturality factorization automorphism and falsifier records with exact source provenance."
  - domain_id: "DOM-09"
    name: "AuditResult"
    definition: "The exclusive result sum of current-source derivation theorem scoped naturality-factorization obstruction or current-source groupoid typing obstruction."

formal_objects:
  - object_id: "OBJ-01"
    name: "CurrentSourceSignatureRecord"
    type: "finite registered signature and explicit unresolved-slot boundary"
  - object_id: "OBJ-02"
    name: "CurrentSourceModelGroupoid"
    type: "groupoid or precise formation obstruction"
  - object_id: "OBJ-03"
    name: "CandidateAsymmetryFunctorFamily"
    type: "finite predeclared functor grammar"
  - object_id: "OBJ-04"
    name: "NaturalAsymmetryTransformationSpace"
    type: "disjoint union of natural-transformation spaces over the grammar"
  - object_id: "OBJ-05"
    name: "CurrentReductForgetfulMap"
    type: "U_cur:Exp_cur->Mod_cur"
  - object_id: "OBJ-06"
    name: "ExpansionAsymmetryDatum"
    type: "q:Exp_cur->AsymData"
  - object_id: "OBJ-07"
    name: "AutomorphismWitnessFamily"
    type: "typed nonidentity automorphisms and invariant failures"
  - object_id: "OBJ-08"
    name: "FactorizationWitnessOrCountermodel"
    type: "q_bar with q=q_bar o U_cur or a same-fibre counterpair"
  - object_id: "OBJ-09"
    name: "SourceHashAndDefinitionManifest"
    type: "acyclic provenance record"
  - object_id: "OBJ-10"
    name: "CurrentSourceAsymmetryAuditResult"
    type: "exclusive three-branch result"

formal_maps:
  - map_id: "MAP-01"
    signature: "Models:Sigma_cur->Mod_cur"
    purpose: "Form the exact current-source semantic model class."
  - map_id: "MAP-02"
    signature: "Iso:Mod_cur^op x Mod_cur->Set"
    purpose: "Enumerate or characterize every declared current-structure isomorphism."
  - map_id: "MAP-03"
    signature: "A_i:Mod_cur->GSet_i"
    purpose: "Interpret each predeclared asymmetry codomain functor."
  - map_id: "MAP-04"
    signature: "eta_i:1=>A_i"
    purpose: "Represent a candidate current-source natural asymmetry."
  - map_id: "MAP-05"
    signature: "U_cur:Exp_cur->Mod_cur"
    purpose: "Forget proposal-only presentation-expansion data."
  - map_id: "MAP-06"
    signature: "q_i:Exp_cur->AsymData_i"
    purpose: "Expose whether asymmetry varies inside one current-reduct fibre."
  - map_id: "MAP-07"
    signature: "Factor_i(q_i,U_cur)->Option(q_bar_i)"
    purpose: "Construct a factor or return an exact fibre countermodel."
  - map_id: "MAP-08"
    signature: "AutoTest_i(eta_i,g)->Bool"
    purpose: "Check naturality under every declared current-structure automorphism."
  - map_id: "MAP-09"
    signature: "DecideAudit(Evidence)->AuditResult"
    purpose: "Return exactly one permitted result without adoption or extension."

predeclared_candidate_codomain_grammar:
  budget: 6
  candidates:
    - candidate_id: "ASYM-POINT"
      output: "a distinguished source point or nonempty finite point set"
      primary_control: "translations of affine R4 viewed only as a model control"
    - candidate_id: "ASYM-ORIENTATION"
      output: "one sheet of the orientation double cover"
      primary_control: "orientation-reversing diffeomorphism"
    - candidate_id: "ASYM-ORDER"
      output: "a total source or presentation order"
      primary_control: "order-reversing or permutation automorphism where typed"
    - candidate_id: "ASYM-ROOT-LABEL"
      output: "a distinguished presentation root or label"
      primary_control: "formation check followed by full automorphism nonselection"
    - candidate_id: "ASYM-ADMISSION"
      output: "a nonconstant natural admission predicate"
      primary_control: "formation check and orbit constancy"
    - candidate_id: "ASYM-ARROW-SUBCLASS"
      output: "a proper natural allowed-arrow subclass"
      primary_control: "closure identity inverse composition and conjugation checks"
  grammar_fixed_before_outcomes: true
  grammar_is_current_ontology: false
  grammar_is_physical_semantics: false

theorem_targets:
  - theorem_id: "THM-01"
    name: "CurrentSourceModelGroupoidFormationOrObstruction"
    target: "Form Mod_cur and Iso_cur from only the registered signature, or identify the first exact missing type or law."
  - theorem_id: "THM-02"
    name: "EquivariantTerminalSectionFixedPointCriterion"
    target: "Prove Nat(1,A) is naturally identified with the fixed-point subobject when the declared action is well typed."
  - theorem_id: "THM-03"
    name: "CurrentReductFactorizationIffFibreConstancy"
    target: "Prove q factors through U_cur exactly when q is constant on every U_cur fibre under the declared set-level hypotheses."
  - theorem_id: "THM-04"
    name: "BareSmoothSourceTranslationPointControl"
    target: "Show the affine R4 translation control admits no natural distinguished point or nonempty finite subset under its full translation subgroup."
  - theorem_id: "THM-05"
    name: "BareSmoothSourceOrientationReversalControl"
    target: "Show a natural orientation fails in a groupoid containing an orientation-reversing automorphism unless extra current-source structure excludes it."
  - theorem_id: "THM-06"
    name: "PresentationAsymmetryFormationAndNaturalityAudit"
    target: "For root label order admission and arrow-subclass candidates, either type the output functor from registered source data and test all arrows or return the first precise formation obstruction."
  - theorem_id: "THM-07"
    name: "ExclusiveCurrentSourceAuditDecision"
    target: "Return exactly one permitted result with a constructive witness or minimal scoped obstruction and explicit falsifier."

proof_obligations:
  - obligation_id: "PO-01"
    text: "Bind every canonical source and registry row by live hash before forming Sigma_cur."
  - obligation_id: "PO-02"
    text: "Separate typed current primitives from unresolved interpretive vocabulary and target benchmark structure."
  - obligation_id: "PO-03"
    text: "Construct Mod_cur and Iso_cur without importing a source metric orientation order root label or presentation carrier."
  - obligation_id: "PO-04"
    text: "Check identities inverses composition and structure preservation for every declared isomorphism class."
  - obligation_id: "PO-05"
    text: "Fix the six-candidate asymmetry grammar and all budgets before inspecting results."
  - obligation_id: "PO-06"
    text: "Type each asymmetry candidate as a functor or record its first exact formation failure."
  - obligation_id: "PO-07"
    text: "Compute or characterize the complete relevant automorphism action rather than an identity-only or pair-swap subset."
  - obligation_id: "PO-08"
    text: "Prove naturality for any positive candidate under every arrow in the declared groupoid."
  - obligation_id: "PO-09"
    text: "Apply the fibre-constancy factorization theorem to every expansion-supplied asymmetry claim."
  - obligation_id: "PO-10"
    text: "Include exact translation reflection and same-reduct controls with explicit scopes and falsifiers."
  - obligation_id: "PO-11"
    text: "Demonstrate material distinctness from the RT002 pair-groupoid and conditional-root fixtures."
  - obligation_id: "PO-12"
    text: "Audit target atlas metric desired cone empirical label benchmark answer workflow status and all six frozen-family imports."
  - obligation_id: "PO-13"
    text: "Return one exclusive theorem or scoped obstruction without adding adopting rejecting or editing source ontology."
  - obligation_id: "PO-14"
    text: "State all physical empirical adequacy B2 P4-T03 Gate proof publication push and external-action non-conclusions."

failure_branches:
  - branch_id: "FB-01"
    result: "precise_current_source_model_groupoid_typing_obstruction"
    trigger: "Mod_cur or Iso_cur cannot be formed without adding unregistered structure."
  - branch_id: "FB-02"
