new_mathematical_payload:
  payload_count: 4
  items:
    - payload_id: "PAYLOAD-RT014-PHIL-001"
      payload_type: "theorem"
      object_name: "equivariant-selector fixed-point criterion"
      claim_status: "draft/control"
      burden_effect: "narrows"
      statement: "For a group G acting on a set P, a G-equivariant map from the terminal G-set one to P exists if and only if P has a G-fixed point. In particular, a nonempty free torsor under a nontrivial G admits no equivariant root."
      proof: "A map r:one->P is determined by p=r(*). Equivariance requires g.p=r(g.*)=r(*)=p for every g, so p is fixed. Conversely any fixed p defines an equivariant map. A free nontrivial action has no fixed point."
      falsifier: "Exhibit an equivariant terminal-to-P map whose value is not fixed, or a fixed point in the declared free torsor."
      forbidden_overread: "This theorem concerns the declared action only; it does not prove that richer source theories cannot generate asymmetry."
    - payload_id: "PAYLOAD-RT014-PHIL-002"
      payload_type: "theorem"
      object_name: "orbit classification does not supply selection"
      claim_status: "draft/control"
      burden_effect: "narrows"
      statement: "A transitive G-set P can have singleton orbit quotient P/G while admitting no equivariant representative section. Thus a root-free orbit value can preserve symmetry and still contain no unique-admission information."
      proof: "Transitivity makes P/G a singleton. An equivariant section from that singleton to P would be an equivariant terminal-to-P map, which exists exactly when P has a fixed point. A nontrivial free torsor has none."
      falsifier: "Construct an equivariant section P/G->P for the declared free transitive action, or show the quotient contains additional source-defined separating data."
      forbidden_overread: "A quotient can remain useful for classification; the theorem denies only representative selection under the stated action."
    - payload_id: "PAYLOAD-RT014-PHIL-003"
      payload_type: "theorem"
      object_name: "current-source provenance descent criterion"
      claim_status: "draft/control"
      burden_effect: "narrows"
      statement: "Let U:E->C forget extension data and let a assign asymmetry data to objects of E. If a is derived solely from the current reduct, then a must descend through U and be coherent on every U-fibre. Two admissible extensions e0 and e1 with U(e0)=U(e1) but inequivalent a(e0) and a(e1) refute such descent."
      proof: "Current-reduct derivation means there is bar_a on C with a=bar_a composed with U, up to the declared equivalence. Equal reducts then have equal bar_a values. A differing same-fibre pair contradicts factorization."
      falsifier: "Provide a well-typed bar_a and natural coherence proving factorization for every admitted extension, including the displayed same-reduct controls."
      forbidden_overread: "Failure to descend through the current reduct does not prohibit a disclosed conservative source extension from carrying new law data."
    - payload_id: "PAYLOAD-RT014-PHIL-004"
      payload_type: "lemma"
      object_name: "semantic definability physical interpretation adoption separation"
      claim_status: "draft/control"
      burden_effect: "dependency_map_update"
      statement: "Semantic definability on the full current-source model groupoid, physical interpretation, empirical interpretation, and canonical adoption are separate gates. A natural current-source assignment, if one exists, is not thereby a physical or adopted object."
      proof: "Semantic definability requires a natural transformation and factorization through exact source structure. Physical and empirical interpretation require additional lawful source-to-world and measurement maps. Adoption requires protected authority. None of the premises of the first gate supplies the missing maps or authority of the later gates."
      falsifier: "Cite a tracked rule or theorem that explicitly identifies two of these gates for this exact object without using target success or workflow status as a premise."
      forbidden_overread: "A positive Route A derivation certificate would not itself establish physical meaning or adoption."

