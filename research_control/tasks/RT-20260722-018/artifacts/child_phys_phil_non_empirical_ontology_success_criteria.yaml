evaluation_protocol:
  status_domain:
    - "met"
    - "not_met"
    - "indeterminate"
  status_semantics:
    met: "The scoped source record supplies every mandatory evidence component named for the criterion, including the relevant anti-circularity and comparison controls."
    not_met: "The declared evidence certificate is not satisfied in the present source record. This is an evidence-status result, not a theorem of impossibility and not a rejection of future source extensions."
    indeterminate: "The present source record contains potentially relevant evidence but does not decide whether the full certificate is satisfied at the declared scope."
  not_met_is_not_impossibility: true
  no_aggregation_rule: "The seven statuses form a non-compensatory profile. No status implies another, no favorable criterion cancels an unmet one, and no overall scalar, weighted total, rank, or ontology verdict is authorized."
  comparison_rule: "Comparison is by explicit assets, debts, and missing certificates at matched scope. Familiarity, implementation cost, or primitive count may be reported but cannot determine scientific or ontological superiority."
  evidence_priority:
    - "A source-grounded derivation or theorem with explicit hypotheses, dependency structure, and anti-target-import audit."
    - "A robustness, uniqueness, counterfactual, or cross-domain constraint result tied to the criterion."
    - "A bounded counterexample or obstruction that decides a declared question without being generalized beyond its premises."
    - "Narrative organization or mathematical convenience only as context, never as a substitute for the certificate above."

criterion_families:
  assumption_compression:
    evaluative_question: "Does the ontology derive the same declared target content from fewer independent substantive commitments, rather than merely renaming, bundling, or hiding them?"
    demonstrated_non_empirical_value:
      mandatory_evidence:
        - "A matched-scope dependency graph for baseline GR, the current program, and any compared ontology, with primitive leaves distinguished from derived nodes."
        - "A proof that target structures counted as removed assumptions are reconstructible from the retained source commitments."
        - "A representation-sensitive audit showing that an opaque selector, reconstruction map, prior, admissibility condition, or source law has not merely repackaged the removed target information."
        - "A circularity check establishing that adopted target metric, signature, matter coupling, or Einstein dynamics do not return as source premises."
      evidence_example: "A source theory derives dimension, Lorentzian signature, metric scale, universal matter coupling, and Einstein dynamics from a smaller set of independently stated source laws, with an acyclic proof graph and a matched baseline showing that the target assumptions are no longer primitive leaves."
      counterexample: "Replace the GR action and coupling assumptions by one function named Reconstruct whose definition or admissibility rule encodes the desired GR model. The vocabulary has fewer primitive names, but the informational and modal burden has only been hidden."
    non_substitutions:
      narrative_coherence: "A single story linking AEther, flow, slices, and S-time does not show that any benchmark assumption has been eliminated."
      aesthetic_preference: "Feeling that one substrate is simpler or more natural is a preference until independent commitment classes and hidden-law complexity are audited."
      familiar_mathematics: "A compact smooth-manifold or category-theoretic notation may conceal strong topology, regularity, or equivalence assumptions."
      workflow_metrics: "Fewer task fields, shorter validators, or cleaner registries do not reduce scientific assumptions."
      artifact_production: "An assumption ledger makes debt visible but does not itself discharge or compress that debt."
      exact_gr_empirical_equivalence: "Matching all GR predictions fixes target behavior; it does not show that GR's metric, matter, or dynamical assumptions were derived from fewer source commitments."
    current_program_assessment:
      status: "not_met"
      source_refs:
        - "SRC-ASSUMPTION-LEDGER"
        - "SRC-FOUNDATIONS"
        - "SRC-P14-T01-CATEGORIES"
      rationale: "The ledger records four-dimensionality and differentiable structure as proposed source primitives, while Lorentzian signature, scale, source matter semantics, universal source coupling, physical covariance, and substrate dynamics remain open and the target GR metric, matter action, constants, and Einstein dynamics remain adopted benchmark inputs. No matched-scope proof of net assumption reduction is present."
      uncertainty: "The record does not prove that future source laws cannot compress these commitments."
    failure_modes:
      - "Syntactic primitive counting without comparing logical or descriptive content."
      - "Moving target assumptions into a reconstruction law, selector, prior, boundary condition, or admissibility class."
      - "Counting target-side benchmark adoption as a source-side derivation."
      - "Treating explicit bookkeeping as scientific compression."
      - "Comparing options at unequal target scope or unequal accuracy."
    material_future_evidence:
      - "A matched, acyclic source-to-target assumption graph whose primitive leaves are normalized across the current program and baseline GR."
      - "A theorem deriving several presently adopted target assumptions from independently motivated source laws, with a smuggling audit and sensitivity to alternative formulations."
      - "A robustness analysis showing that the claimed compression survives equivalent reparameterizations and does not rely on an oracle-like reconstruction rule."
    non_scalar_comparison:
      baseline_gr: "The repository exposes GR's metric action, universal matter coupling, constants, and equations as target-side benchmark inputs. That transparency supplies the comparison burden but is not itself a claim of ontological minimality."
      current_program: "It retains the exact-GR target closure and adds a four-dimensional substrate, ordered motion, slice, S-time, and congruence dictionary; the source record has not shown a net reduction of independent commitments."
      continuum_first: "It is commendably explicit about a four-dimensional smooth arena, ordered action, bundle syntax, admissibility class, and groupoid as proposal primitives. This improves debt visibility, while its explicit extra structure prevents any current compression claim."
      emergence_first: "Its minimum token-and-order signature is syntactically leaner, but topology, dimension, smoothness, dynamics, measure, matter, and the full reconstruction law remain debts. Primitive austerity is not demonstrated compression until those laws are stated and audited."
      comparison_conclusion: "No source-grounded dominance relation is established. Continuum-first exposes more up-front debt; emergence-first defers more reconstruction debt; the current program has not proved net compression relative to GR."

  unification:
    evaluative_question: "Does one independently motivated source structure or law constrain multiple previously separate physical domains and generate cross-domain relations that could have failed?"
    demonstrated_non_empirical_value:
      mandatory_evidence:
        - "At least two independently specified target domains reconstructed from the same source object or dynamics."
        - "A shared source constraint yielding a nontrivial relation among those domains, not separate fit functions collected under one vocabulary."
        - "Evidence that the relation is not already guaranteed solely by importing the GR metric and Einstein equations."
        - "Scope, failure conditions, and a test showing what would count as loss of unification."
      evidence_example: "One source dynamics derives both effective geometry and matter propagation and forces a shared conservation or coupling relation that was not separately stipulated for either sector."
      counterexample: "Use the word flow to redescribe expansion, acceleration, vorticity, shear, redshift, frame dragging, waves, and local SR after all are already supplied by one GR metric and a chosen congruence. This is a useful interpretive organization, but it adds no source-side unifying constraint."
    non_substitutions:
      narrative_coherence: "A common metaphor or dictionary is not unification unless it produces shared constraints or derivations."
      aesthetic_preference: "Preferring a single-substrate picture does not show that the substrate law accounts for multiple sectors."
      familiar_mathematics: "Writing all sectors in tensor or category language shows common formal expressibility, not a common source cause."
      workflow_metrics: "One pipeline, role, schema, or registry spanning many topics is administrative integration, not physical unification."
      artifact_production: "Many cross-linked documents do not establish one law behind their contents."
      exact_gr_empirical_equivalence: "Exact agreement with GR inherits GR's integrated phenomenology but does not demonstrate that the added ontology unifies it from deeper source principles."
    current_program_assessment:
      status: "not_met"
      source_refs:
        - "SRC-GEOMETRY"
        - "SRC-FOUNDATIONS"
        - "SRC-ASSUMPTION-LEDGER"
      rationale: "The flow-geometry source gives a disciplined GR congruence dictionary for multiple phenomena, but it explicitly subordinates that dictionary to the already adopted metric and Einstein law and denies a source derivation of the congruence choice. Source dynamics, matter semantics, coupling, and the source-to-GR bridge remain absent."
      uncertainty: "The interpretive dictionary may guide a future unifying source law, but the present record does not supply that law."
    failure_modes:
      - "Vocabulary unification mistaken for dynamical unification."
      - "Independent sector-specific maps hidden behind one source label."
      - "GR's existing geometric unification credited again to the added ontology."
      - "Common mathematical representation mistaken for shared explanatory dependence."
      - "A broad claim made without a failure condition or cross-domain constraint."
    material_future_evidence:
      - "One source-side dynamics that reconstructs geometry, operational clocks, and at least one matter sector with a shared conservation or consistency theorem."
      - "A cross-domain relation that is derived without target inputs and survives changes of representation and regime."
      - "A comparative demonstration that neither baseline GR alone nor separately tuned bridge maps provide the same source-level constraint."
    non_scalar_comparison:
      baseline_gr: "At the effective level GR already organizes gravitation, causal structure, clocks, and universal metric matter coupling through one metric dynamics. This is the benchmark unification the added ontology must deepen rather than merely relabel."
      current_program: "It provides coherent interpretive organization inside GR but no additional source law connecting the sectors."
      continuum_first: "Its shared smooth arena and bundle syntax make joint formalization easier, but no action, dynamics, matter semantics, or universal source coupling is supplied."
      emergence_first: "Its order and guarded composition offer a common minimal syntax, but no dynamics, continuum reconstruction, matter, or cross-domain relation is present."
      comparison_conclusion: "Baseline GR has the effective unification asset in this source record. Neither the current deeper ontology nor either proposal-only alternative presently demonstrates additional source-level unification."

  inevitability:
    evaluative_question: "Relative to explicit source axioms and an explicit equivalence notion, is the target structure forced rather than selected by hand from multiple admissible realizations?"
    demonstrated_non_empirical_value:
      mandatory_evidence:
        - "A declared source class, target class, and physically relevant equivalence relation."
        - "Existence of a source-to-target construction for the claimed scope."
        - "A uniqueness, rigidity, categoricity, or no-alternative theorem up to the declared equivalence."
        - "A target-independence audit showing that selection does not use the desired target atlas, metric, dimension, matter model, or GR equations."
        - "Robustness under admissible perturbations or an exact statement of the narrow conditions under which necessity holds."
      evidence_example: "Every source model satisfying axioms H has one effective Lorentzian geometry up to the declared gauge/equivalence, and a proved reconstruction functor supplies that geometry without target-side selection data."
      counterexample: "Choose a GR solution or observer congruence because it fits the desired phenomenon, or posit a realization relation whose admissible pairs are defined by target agreement. The target is compatible with the source description but not inevitable from it."
    non_substitutions:
      narrative_coherence: "A story in which GR naturally follows is not a uniqueness theorem."
      aesthetic_preference: "Calling an outcome natural, elegant, or inevitable expresses judgment unless a relative-necessity proof is supplied."
      familiar_mathematics: "A canonical-looking construction can still depend on arbitrary normalization, atlas, boundary, congruence, or selector choices."
      workflow_metrics: "A deterministic build or validator result establishes operational reproducibility, not physical necessity."
      artifact_production: "Repeatedly obtaining one target in hand-built examples does not rule out inequivalent alternatives."
      exact_gr_empirical_equivalence: "Agreement with the selected GR target shows adequacy of that target, not that the source uniquely forces it."
    current_program_assessment:
      status: "not_met"
      source_refs:
        - "SRC-FOUNDATIONS"
        - "SRC-GEOMETRY"
        - "SRC-CONTINUUM-OPTION"
        - "SRC-EMERGENCE-OPTION"
      rationale: "The foundations source labels the slice embedding and S-time functional as schematic and non-unique, while the geometry source says congruence choice is generally non-unique and interpretive. The continuum-first proposal proves a normalization family c^2 g under its added hypotheses, and the emergence-first proposal exhibits one finite order in both two- and four-dimensional target embeddings. No general unique source-to-GR reconstruction exists."
      uncertainty: "These underdetermination results are scoped; they do not prove that a stronger future source law cannot yield uniqueness."
    failure_modes:
      - "Compatibility or existence presented as uniqueness."
      - "Uniqueness stated without an equivalence relation."
      - "Target data used inside the selector that allegedly derives the target."
      - "One finite or symmetric example generalized to the full model class."
      - "A scoped underdetermination witness inflated into a global no-go theorem."
    material_future_evidence:
      - "A source-internal reconstruction map with proved existence and uniqueness up to a physically justified equivalence."
      - "A rigidity theorem that excludes alternative dimensions, signatures, normalizations, or couplings under stated source axioms."
      - "Perturbation and regime analyses showing when the result remains forced and where it becomes indeterminate."
    non_scalar_comparison:
      baseline_gr: "The repository fixes GR as the operative target law; it does not claim that GR is uniquely forced by the AEther source ontology. Benchmark adoption is distinct from inevitability."
      current_program: "Several central maps and congruence choices are acknowledged placeholders or admissible choices, so the target is not currently forced from source data."
      continuum_first: "Its smooth arena shortens the typing path but leaves metric existence, normalization, clocks, matter, dynamics, and realization nonunique or open; the normalization theorem provides direct scoped underdetermination evidence."
      emergence_first: "It leaves more target structure to be reconstructed, but its finite dimension-nonselection witness and open manifoldlikeness selector show that austerity has not produced inevitability."
      comparison_conclusion: "None of the compared positions supplies a source-relative inevitability certificate. The two alternatives expose different locations of underdetermination rather than an ordering of truth."

  explanatory_depth:
    evaluative_question: "Does the ontology replace target-level brute facts with a source-grounded, contrastive account of why those facts obtain and how they would change under admissible source variation?"
    demonstrated_non_empirical_value:
      mandatory_evidence:
        - "A multi-level source-to-target derivation with each bridge object and law typed and independently motivated."
        - "A contrastive answer to why the realized target rather than a relevant alternative occurs."
        - "Counterfactual or intervention structure connecting source changes to target changes."
        - "Target-independence, robustness, and regime conditions showing that the explanation is not a redescription of the explanandum."
        - "An explicit inventory of which brute facts were reduced and which were merely relocated."
      evidence_example: "A source dynamics explains why observers obtain a Lorentzian metric with a particular scale and coupling by deriving those features, excludes nearby alternatives through a source selector, and predicts how target geometry changes when a source invariant is varied."
      counterexample: "State that observed three-space is a slice and S-time is experienced order, then choose the slice, functional, metric, and congruence from the already available GR model. The narrative may be coherent and clarifying but does not answer the source-level why-question."
    non_substitutions:
      narrative_coherence: "Coherent redescription is an interpretive achievement, but it is not demonstrated depth without a non-circular bridge and contrastive dependence."
      aesthetic_preference: "A preference for mechanical imagery, process, order, or ontological realism does not settle explanatory adequacy."
      familiar_mathematics: "Standard congruence kinematics can sharpen a dictionary while leaving the deeper source explanation untouched."
      workflow_metrics: "Clearer documentation or more explicit gates improve epistemic hygiene, not the physical depth of the ontology."
      artifact_production: "A long derivation plan or many burden maps can expose missing explanations without providing them."
      exact_gr_empirical_equivalence: "Empirical equivalence preserves successful predictions but cannot by itself decide whether an added ontology explains them more deeply."
    current_program_assessment:
      status: "not_met"
      source_refs:
        - "SRC-FOUNDATIONS"
        - "SRC-GEOMETRY"
        - "SRC-P14-T01-STATUS"
      rationale: "The present program has a disciplined and source-explicit interpretive redescription: P14-T01 records that category as met. The canonical sources simultaneously state that the slice, S-time, congruence choice, source dynamics, matter coupling, and recovery of Einstein gravity are not derived. Thus narrative and interpretive clarity are present, while the stronger source-grounded explanatory certificate is not."
      uncertainty: "This status applies to the operational criterion defined here; it does not deny that interpretation can have philosophical or heuristic value."
    failure_modes:
      - "Redescription of GR variables treated as explanation of their existence or law."
      - "Target facts moved into a source name without new dependence relations."
      - "Greater explanatory ambition credited as achieved explanation."
      - "One successful example used without contrast cases, robustness, or failure conditions."
      - "A philosophical account presented as if it were a physical derivation."
    material_future_evidence:
      - "A contrastive source mechanism deriving at least one presently adopted target structure while explaining why nearby alternatives do not arise."
      - "A counterfactual map from source variations to target variations with robustness and regime bounds."
      - "An anti-smuggling audit plus an updated assumption graph showing a genuine reduction, rather than relocation, of unexplained structure."
    non_scalar_comparison:
      baseline_gr: "GR supplies deep geometric explanations of gravitational phenomena within its own effective structure, while the repository does not ask it to derive the existence of its four-dimensional Lorentzian arena from the AEther ontology."
      current_program: "It offers a disciplined deeper reading of the GR structures but has not yet converted that reading into a source-derived contrastive explanation."
      continuum_first: "It explicitly begins after a smooth four-dimensional arena is assumed, so its attainable explanation is narrower but its immediate bridge burden is shorter. Its metric, clock, matter, coupling, and dynamics explanations remain open."
      emergence_first: "It seeks to explain topology, dimension, smoothness, and geometry as well as downstream physics, giving it greater explanatory ambition; no continuum reconstruction or dynamics currently turns that ambition into achieved depth."
      comparison_conclusion: "The alternatives trade narrower explicit starting assumptions against broader unfulfilled reconstruction ambition. No present source evidence establishes deeper explanatory success over baseline GR."

  dimension_and_signature_explanation:
    evaluative_question: "Are both effective dimension and Lorentzian signature selected or reconstructed from source-internal structure rather than assumed, target-fitted, or read from an embedding?"
    satisfaction_rule: "The family is met only when both dimension and signature obligations are satisfied for the declared target regime. Evidence for one is recorded without compensating for absence of the other."
    demonstrated_non_empirical_value:
      mandatory_evidence:
        - "A source-internal dimension observable or reconstruction theorem with convergence to four in the declared regime."
        - "A source-internal selector or theorem for Lorentzian signature, including exclusion or control of Euclidean and other-signature alternatives."
        - "Uniqueness or equivalence conditions, stability under admissible source perturbations, and dynamical typicality where histories are involved."
        - "A no-target-import audit: target dimension, atlas, metric, causal cones, or faithful embedding cannot define source admissibility."
        - "Operational connection showing how the reconstructed signature supports clocks, causal order, and propagation rather than only a formal sign pattern."
      evidence_example: "An ensemble generated by a source law has a source-defined estimator that converges robustly to dimension four, while an independent source theorem reconstructs a unique Lorentzian conformal class and operational time orientation without assuming a four-dimensional Lorentzian target."
      counterexample: "Start with a four-dimensional differentiable substrate or a four-dimensional triangulation, or faithfully embed a finite order into a chosen Lorentzian manifold, and then report four dimensions or Lorentzian signature as emergent. The target feature entered as premise or evaluator choice."
    non_substitutions:
      narrative_coherence: "Calling observed space a three-dimensional slice of a deeper four-dimensional substrate does not explain why the substrate is four-dimensional or why the effective metric is Lorentzian."
      aesthetic_preference: "Preference for four dimensions, process order, or Lorentzian causality is not a selection result."
      familiar_mathematics: "Using a smooth 4-manifold or timelike congruence makes the desired structures available but does not derive them."
      workflow_metrics: "Coverage of dimension and signature fields in a ledger measures visibility, not explanation."
      artifact_production: "Dimension estimators, examples, or diagrams without convergence, uniqueness, and target-independence do not satisfy the criterion."
      exact_gr_empirical_equivalence: "Exact GR behavior presupposes the target Lorentzian structure in this program; reproducing its predictions does not source-derive dimension or signature."
    current_program_assessment:
      status: "not_met"
      source_refs:
        - "SRC-FOUNDATIONS"
        - "SRC-ASSUMPTION-LEDGER"
        - "SRC-CONTINUUM-OPTION"
        - "SRC-EMERGENCE-OPTION"
        - "SRC-LITERATURE-MATRIX"
      rationale: "The canonical foundations posit a four-dimensional differentiable substrate, and the ledger classifies four-dimensionality as a proposed primitive while Lorentzian signature remains an adopted target-side benchmark input. Continuum-first likewise takes four-dimensional smoothness as primitive and leaves physical signature open. Emergence-first assumes neither but supplies no reconstruction; its finite diamond has the same order relation in two- and four-dimensional target embeddings."
      uncertainty: "The finite witness establishes only nonselection for that fragment and does not preclude a richer source dynamics or asymptotic reconstruction theorem."
    failure_modes:
      - "Dimension or signature imported through the source carrier, building blocks, target embedding, or admissibility criterion."
      - "One estimator value without convergence, scale control, uniqueness, or typicality."
      - "Causal vocabulary used as a substitute for a physical Lorentzian-signature bridge."
      - "Continuum-conditional literature results transferred as if their hypotheses were derived."
      - "A finite nonselection witness inflated into a universal impossibility theorem."
    material_future_evidence:
      - "A target-neutral source dynamics and family of histories with a robust source-internal dimension estimator converging to four."
      - "A signature-selection theorem or reconstruction of Lorentzian causal/conformal structure from source primitives, plus scale and time-orientation controls."
      - "Uniqueness, stability, and typicality results that survive alternative coarse-grainings and do not use faithful target embedding as a source premise."
    non_scalar_comparison:
      baseline_gr: "In the repository benchmark, four-dimensional Lorentzian spacetime is operative target structure, not a source-derived result."
      current_program: "It adds a four-dimensional substrate and exact-GR interpretive closure but presently assumes rather than explains both decisive target features at their relevant layers."
      continuum_first: "It openly treats dimension four and smooth structure as primitive, so it does not aim to explain dimension within that branch; it still owes physical Lorentzian signature, scale, and operational meaning."
      emergence_first: "It preserves the possibility of explaining both by omitting them from its minimum signature, but no current law reconstructs either, and finite order alone does not select target dimension."
      comparison_conclusion: "Baseline GR and continuum-first carry explicit target or source primitives; emergence-first carries the larger reconstruction burden. Omission is explanatory opportunity, not evidence of successful explanation."

  matter_or_quantum_connection:
    evaluative_question: "Does the ontology make a source-grounded, operationally meaningful connection to matter or quantum structure rather than supplying empty mathematical slots or importing the benchmark matter theory?"
    satisfaction_rule: "A complete certificate in either the matter branch or the quantum branch can satisfy this family at its exact declared scope. Partial evidence in one branch cannot be represented as success in the other, and neither branch currently has such a certificate."
    demonstrated_non_empirical_value:
      matter_branch:
        - "Source-defined stable localized sectors or degrees of freedom with matter semantics."
        - "Operational observables, detector or clock semantics, stress-energy or an equivalent source response object, and conservation control."
        - "A universal coupling and backreaction bridge derived rather than copied from the GR matter action."
      quantum_branch:
        - "A source-defined state or history space, composition rule, probability or amplitude law, observables, and consistency conditions."
        - "A controlled relation to quantum field or quantum-gravity structure, including a declared classical or semiclassical regime."
        - "Evidence that quantum terminology is not merely attached to a classical source order or an unconstrained kernel placeholder."
      evidence_example: "The source ontology yields stable excitation sectors, a source observable algebra, a normalized dynamics, and a theorem relating their conserved response to one effective metric, with a controlled quantum-to-classical limit."
      counterexample: "Declare fibre bundles as matter slots, adopt S_matter[g,psi] at the target level, or note that locally covariant QFT can be formulated on supplied spacetimes. These establish typing or benchmark compatibility, not AEther-derived matter or quantum structure."
    non_substitutions:
      narrative_coherence: "Saying S-time arises from matter, light, and flow does not define matter states, observables, detectors, coupling, or quantum dynamics."
      aesthetic_preference: "A substrate that sounds material, processual, or quantum-like is not thereby connected to matter or quantum theory."
      familiar_mathematics: "Bundles, Hilbert-like language, categories, kernels, or amplitudes are only syntax until their source semantics and laws are supplied."
      workflow_metrics: "Matter-related task coverage or gate completion is not a matter-sector derivation."
      artifact_production: "Candidate profiles, theorem targets, and evidence/preconditions remain distinct from adopted matter semantics or quantum theory."
      exact_gr_empirical_equivalence: "Ordinary matter coupling inherited from exact GR is empirical benchmark closure, not a source-side explanation of matter or quantum structure."
    current_program_assessment:
      status: "not_met"
      source_refs:
        - "SRC-FOUNDATIONS"
        - "SRC-ASSUMPTION-LEDGER"
        - "SRC-SCOPED-VOCABULARY"
        - "SRC-COMPARISON-REPORT"
      rationale: "The canonical program adopts ordinary target-level matter coupling through exact GR. The assumption ledger states that source matter semantics, universal source coupling, and substrate dynamics are absent or open, and the scoped vocabulary forbids upgrading matter-sector evidence/preconditions to matter coupling. No source quantum state space, amplitude law, observable algebra, or controlled limit is established in the inspected sources."
      uncertainty: "The absence of a current certificate does not exclude future matter-sector or quantum source extensions."
    failure_modes:
      - "Target matter action or QFT framework imported and relabeled as source-derived."
      - "Mathematical field slots mistaken for matter ontology."
      - "Order, discreteness, stochastic language, or an amplitude symbol mistaken for quantum structure."
      - "Evidence/precondition status promoted to semantics, coupling, stress energy, or action."
      - "A matter or quantum connection claimed without observables, conservation, backreaction, or regime control."
    material_future_evidence:
      - "A source-internal construction of stable matter-like sectors with operational observables and conserved response."
      - "A universal coupling and backreaction theorem that does not assume the target GR matter action."
      - "Alternatively, a source-defined quantum dynamics with normalized composition, observables, and a controlled link to effective fields and classical geometry."
      - "A target-import audit plus explicit failure tests for the proposed matter or quantum bridge."
    non_scalar_comparison:
      baseline_gr: "The exact benchmark includes ordinary universal matter coupling at the effective level, but the inspected record does not present GR as a quantum-gravity or source-matter derivation."
      current_program: "It inherits the benchmark matter sector and has no established source matter semantics or quantum law."
      continuum_first: "Bundles and configuration spaces provide convenient mathematical slots, while the proposal explicitly leaves matter meaning, coupling, dynamics, scale, and backreaction open."
      emergence_first: "The minimum order signature contains no matter, field, probability, amplitude, action, or observable structure; all such connections require additional source laws."
      comparison_conclusion: "Baseline GR has effective matter coupling in scope; the current deeper ontology and both proposal-only alternatives lack the source-grounded matter or quantum certificate defined here."

  problem_solving_fertility:
    evaluative_question: "Does working from the ontology generate independently checkable solutions, theorems, obstructions, methods, or research questions whose value is not exhausted by maintaining the ontology's own workflow?"
    demonstrated_non_empirical_value:
      mandatory_evidence:
        - "A problem stated independently of the desire to vindicate the ontology, with predeclared success or obstruction conditions."
        - "A result that materially resolves, narrows, or reframes that problem and whose derivation uses a distinctive ontology commitment rather than generic bookkeeping."
        - "Transfer, reuse, or independent rederivation evidence sufficient to distinguish a research contribution from artifact volume."
        - "A negative result may count when it is a scoped theorem or counterexample that closes a genuine option under stated premises; task failure or validator failure does not count."
      evidence_example: "An ontology-specific invariant yields a new rigidity theorem or a reusable obstruction for source-to-spacetime reconstruction, solves a problem posed before the construction, and is rederived from the published assumptions by an independent method."
      counterexample: "Produce many tasks, registries, validators, diagrams, and narrowly renamed GR calculations. The program is active and organized, but no independently posed scientific or mathematical problem has been solved because of the ontology."
    non_substitutions:
      narrative_coherence: "A fertile story suggests questions; it does not show that any question has been solved."
      aesthetic_preference: "Finding an ontology inspiring is a heuristic judgment, not a result certificate."
      familiar_mathematics: "Reapplying standard GR congruence formulas under new names is useful exposition but not automatically ontology-driven problem solving."
      workflow_metrics: "Task throughput, validator passes, role diversity, and handoff counts are explicitly excluded."
      artifact_production: "File, theorem-target, or candidate counts do not establish scientific yield; the content and independent problem relation govern."
      exact_gr_empirical_equivalence: "Exact benchmark agreement is a viability property, not evidence that the added ontology has solved new problems."
    current_program_assessment:
      status: "indeterminate"
      source_refs:
        - "SRC-ASSUMPTION-LEDGER"
        - "SRC-CONTINUUM-OPTION"
        - "SRC-EMERGENCE-OPTION"
        - "SRC-COMPARISON-REPORT"
      rationale: "The inspected record contains genuine bounded results useful to research control and conceptual diagnosis: a no-circular-upgrade theorem, a metric-normalization underdetermination theorem, a finite dimension-nonselection witness, and explicit alternative burden maps. The record does not establish that these results solve independently posed problems, depend essentially on the canonical ontology, transfer beyond the project, or have been independently rederived. Treating their mere number as fertility is prohibited, so the current record does not decide the full criterion."
      uncertainty: "A focused provenance and transfer audit could move this status to met for a narrow result or to not_met for the declared program-wide scope. No independent-replication claim is made here."
    failure_modes:
      - "Internal activity or artifact volume used as a proxy for scientific yield."
      - "A standard result renamed in ontology vocabulary without new consequence."
      - "A problem formulated only after its answer is known, eliminating risk of failure."
      - "A bounded obstruction overstated as a global theory result."
      - "Heuristic inspiration treated as demonstrated transfer or independent confirmation."
    material_future_evidence:
      - "A pre-registered list of independently motivated problems and explicit success, obstruction, and failure conditions."
      - "One ontology-essential theorem, construction, or scoped no-go result that materially resolves a listed problem and is not obtainable by merely restating GR."
      - "A separate rederivation, reuse in another formal context, or external scientific audit of that result, without upgrading beyond the exact reviewed scope."
      - "A provenance argument showing which ontology commitments were indispensable to the result."
    non_scalar_comparison:
      baseline_gr: "Within this packet GR is the mature exact benchmark and source of the standard congruence machinery, but no comprehensive comparison of its historical problem-solving record is attempted."
      current_program: "It has produced bounded conceptual and mathematical diagnostics, while the ontology-essential, independently posed, and transferable status of those diagnostics remains undecided."
      continuum_first: "It has already yielded a scoped normalization-underdetermination theorem and an explicit bridge contract; this is a concrete research product but not yet evidence of broader or independent fertility."
      emergence_first: "It has yielded guarded finite composition, finite controls, and a dimension-nonselection witness; these sharpen burdens but do not yet establish continuum or physics problem solutions."
      comparison_conclusion: "The proposals show different forms of local diagnostic fertility. The source record does not justify ranking them, crediting artifact volume, or claiming that the current ontology has demonstrated program-wide problem-solving success."

current_program_non_compensatory_profile:
  assumption_compression: "not_met"
  unification: "not_met"
  inevitability: "not_met"
  explanatory_depth: "not_met"
  dimension_and_signature_explanation: "not_met"
  matter_or_quantum_connection: "not_met"
  problem_solving_fertility: "indeterminate"
  interpretation_rule: "Read each status only at its criterion-specific scope. The profile is not a score, rank, rejection, adoption decision, global no-go, or Distance-to-GR update."

cross_criterion_guards:
  - "Exact-GR empirical equivalence does not imply any of the seven non-empirical ontology-value criteria."
  - "Interpretive redescription can be met while explanatory depth, assumption compression, and inevitability are not met."
  - "Assumption compression does not by itself imply unification, inevitability, dimension/signature explanation, matter/quantum connection, or fertility."
  - "Explanatory ambition does not imply explanatory achievement."
  - "A lean primitive signature does not imply successful emergence, reconstruction, or physical truth."
  - "Familiar formalism and repository compatibility are engineering assets only unless a criterion-specific scientific certificate is also supplied."
  - "A scoped obstruction or not_met status does not imply global impossibility or rejection of future conservative source extensions."

