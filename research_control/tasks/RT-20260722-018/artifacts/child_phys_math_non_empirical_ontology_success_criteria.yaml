scope:
  evidence_base: "repository-local sources only; no web research"
  assessed_subject: "Current AEther-Flow exact-GR benchmark and open source-ontology program"
  benchmark: "ordinary GR over the declared exact-GR operational domain"
  status_domain: ["met", "not_met", "indeterminate"]
  not_met_semantics: "Present evidence does not discharge the stated certificate; this is not an impossibility theorem or a global no-go result."

criteria:
  assumption_compression:
    operational_obligation: "Derive matched target content from fewer independent substantive commitments than the benchmark, without hiding removed commitments in names, selectors, bridges, priors, or admissibility rules."
    certificate_obligations:
      - "Normalize source and benchmark primitive leaves and give an acyclic provenance graph to a common consequence set."
      - "Prove the removed benchmark premises reconstructible from retained source premises and audit target import and representation dependence."
    current_status: "not_met"
    evidence_boundary: "P4-T01 exposes proposed four-dimensionality, differentiability, and order plus open signature, scale, matter, coupling, covariance, and dynamics; exact-GR closure remains adopted target input. Visibility of debt is not net compression."
    counterexample: "A single Reconstruct rule whose definition encodes the desired GR model reduces names while preserving all informational burden."
    future_material_evidence: "A source-hashed matched-scope dependency DAG proving a strict premise reduction that survives equivalent reformulations and a hidden-target audit."

  unification:
    operational_obligation: "Use one independently specified source structure or law to derive at least two predeclared physical sectors and a nontrivial compatibility relation between them."
    certificate_obligations:
      - "Type the shared source object or law and give separate source-to-sector derivations."
      - "Prove a cross-sector constraint, identify failure cases, and show it is not inherited solely from imported GR closure."
    current_status: "not_met"
    evidence_boundary: "The current program organizes several GR phenomena with one interpretive vocabulary, but no source dynamics derives geometry together with matter or quantum structure and their compatibility."
    counterexample: "Calling geometry, clocks, redshift, and matter effects flow while mapping each independently from an already chosen GR solution is vocabulary unification only."
    future_material_evidence: "One source law deriving effective geometry and a matter or clock sector, including a checked shared conservation, universality, or consistency theorem."

  inevitability:
    operational_obligation: "Show that declared source axioms force the target up to a physically stated equivalence, rather than selecting a compatible target by hand."
    certificate_obligations:
      - "Declare source and target classes, equivalence, and a source-only existence construction."
      - "Prove uniqueness, rigidity, or robust dynamical selection and audit all selector, gauge, boundary, normalization, and target-import choices."
    current_status: "not_met"
    evidence_boundary: "Canonical slicing and S-time maps are schematic and non-unique, while P4-T04 records unresolved realization, scale, dynamics, and reconstruction choices. No general source-to-GR uniqueness certificate exists."
    counterexample: "Choose the embedding, congruence, normalization, or admissible realization because it reproduces the desired GR target."
    future_material_evidence: "A source-internal reconstruction theorem with existence and uniqueness up to declared equivalence, plus robustness or explicit attractor-basin conditions."

  explanatory_depth:
    operational_obligation: "Replace a target-level brute fact with a non-circular, contrastive, counterfactual source mechanism and state which burden was reduced rather than relocated."
    certificate_obligations:
      - "Give a typed multilevel mechanism and an acyclic source-to-target dependency map."
      - "Derive responses to declared source interventions, distinguish the realized target from relevant alternatives, and state robustness and regime limits."
    current_status: "not_met"
    evidence_boundary: "P14-T01 supports disciplined interpretive redescription, but foundations leaves slice selection, microphysics, source action, controlled matter coupling, and relativistic recovery open. Redescription does not discharge a mechanism certificate."
    counterexample: "Read observed space as a slice and S-time as order after choosing the slice, metric, and dynamics from GR; the story changes while dependencies do not."
    future_material_evidence: "A source mechanism yielding novel contrastive and counterfactual consequences under controlled interventions, with an anti-smuggling and burden-relocation audit."

  dimension_and_signature_explanation:
    operational_obligation: "Derive effective dimension and Lorentzian signature through separate source-only subcertificates; neither coordinate may compensate for the other."
    certificate_obligations:
      - "Prove dimension selection against a declared alternative class without presupposing a four-dimensional target."
      - "Prove Lorentzian signature and time orientation without importing the target metric, then establish stability under declared source variations."
    current_status: "not_met"
    evidence_boundary: "Foundations posits a four-dimensional differentiable substrate, while P4-T01 records target Lorentzian signature and causal orientation as adopted or open rather than source-derived."
    counterexample: "Assume a four-dimensional Lorentzian manifold and read its dimension and signature back as emergent properties."
    future_material_evidence: "Independent no-target-import dimension-selection and signature-selection theorems with robustness and relevant-alternative analyses."

  matter_or_quantum_connection:
    operational_obligation: "Construct at least one typed matter or quantum sector from source primitives, with dynamics, observables, and a controlled correspondence to the benchmark regime."
    certificate_obligations:
      - "Define source-side states or matter objects, their dynamics, observables, and operational semantics."
      - "Prove the benchmark or low-energy bridge; where coupling is claimed, establish universality, conservation, and robustness without importing the benchmark action."
    current_status: "not_met"
    evidence_boundary: "Ordinary matter coupling is adopted in exact-GR closure; P4-T01 and P4-T04 leave source matter semantics, universal coupling, observables, quantum structure, and recovery open."
    counterexample: "Insert the standard matter action, Hilbert space, stress-energy tensor, or detector semantics and relabel it as source-derived."
    future_material_evidence: "A source-defined matter or quantum construction with non-circular dynamics and observables, plus a checked universal-coupling or low-energy correspondence theorem."

  problem_solving_fertility:
    operational_obligation: "Enable an independently checkable result on a predeclared scientific problem, with explicit dependence on an ontology principle rather than on workflow throughput."
    certificate_obligations:
      - "Predeclare the problem and supply a theorem, calculation, constraint, countermodel, or discriminator enabled by the ontology."
      - "Show counterfactual dependence on the ontology and obtain independent checking, reuse, or transfer beyond the producing workflow."
    current_status: "indeterminate"
    evidence_boundary: "The repository contains scoped selector results, countermodels, and obstruction artifacts, but the present record does not decide whether their scientific value depends on the ontology or transfers independently."
    counterexample: "Count tasks, artifacts, validators, candidates, or PASS receipts as evidence that the ontology solves scientific problems."
    future_material_evidence: "A preregistered ontology-dependent problem solution with a dependency ablation and independent replication or reuse."

noncompensation:
  rule: "Each criterion is a distinct structured certificate containing premises, witness, scope, alternatives, and robustness conditions; evidence in one certificate cannot fill a missing field in another."
  scalar_score_authorized: false
  weighted_sum_authorized: false
  reasons:
    - "Scalarization erases which premise graph, witness, and failure conditions were established."
    - "Weights encode preferences rather than new scientific evidence and can reverse rankings of mixed vectors."
    - "A favorable coordinate cannot prove a missing dimension, signature, matter, uniqueness, or mechanism result."
  allowed_comparison: "Compare coordinate certificates at matched scope; preserve mixed or incomplete profiles without a total ontology ranking."

