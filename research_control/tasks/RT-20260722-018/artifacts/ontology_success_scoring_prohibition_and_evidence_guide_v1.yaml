status_semantics:
  met: "Every criterion-specific evidence obligation is discharged in the declared scope by source-backed evidence."
  not_met: "At least one declared evidence obligation is presently unsatisfied; this is not an impossibility theorem."
  indeterminate: "The available source record does not decide whether the complete evidence obligation is satisfied."
evidence_certificate:
  required_fields:
    - "scope_and_hypotheses"
    - "acyclic_source_to_result_premise_map"
    - "criterion_specific_witness_or_theorem"
    - "benchmark_and_alternative_comparison"
    - "robustness_and_failure_conditions"
  inadmissible_substitutes:
    - "workflow success"
    - "validator success"
    - "registry status"
    - "role authority"
    - "artifact count"
    - "candidate count"
    - "commit count"
    - "narrative coherence"
scoring_prohibition:
  scalar_score_authorized: false
  weighted_sum_authorized: false
  total_ranking_authorized: false
  compensatory_tradeoff_authorized: false
  reasons:
    - "A score discards the premise graph witness alternative class robustness conditions and source authority."
    - "A strong coordinate cannot supply a missing certificate in another coordinate."
    - "Chosen weights encode preferences and can reverse mixed rankings without adding evidence."
    - "Workflow metrics and output volume are not ontology value."
  allowed_comparison:
    - "Display each criterion status and its exact evidence certificate separately."
    - "Compare alternatives only under the same declared scope and benchmark."
    - "Report a strict coordinate-wise advantage only when every compared obligation is source-backed."
    - "Leave mixed evidence vectors incomparable and preserve uncertainty."
    - "Present aesthetic or engineering preferences separately from scientific evidence."
criteria:
  assumption_compression:
    operational_definition: "Recover a common consequence set from a demonstrably smaller or less independent premise basis than the benchmark-relative formulation without reintroducing removed assumptions in bridges selectors boundary conditions or reconstruction rules."
    required_evidence:
      - "A normalized inventory of independent source and benchmark premises."
      - "An acyclic translation or derivation map from source premises to the compared consequences."
      - "A proof of genuine reduction or dependency consolidation."
      - "A hidden-premise and target-import audit."
    evidence_example: "Several benchmark postulates are proved as corollaries of one independently specified source law."
    counterexample: "GR variables are renamed and substrate labels are added while all benchmark premises remain adopted."
    aesthetic_or_process_trap: "Primitive austerity narrative familiar notation and fewer named fields do not prove compression."
    future_material_evidence: "A source-hashed acyclic premise graph with a proved reduction and no hidden target premise."
  unification:
    operational_definition: "Use one independently specified source structure or law to derive at least two previously separate result families and their compatibility relation."
    required_evidence:
      - "Two or more predeclared result families."
      - "One shared source law or structure."
      - "Separate derivations and a compatibility theorem."
      - "Failure cases showing the result is not mere bundling."
    evidence_example: "One source dynamics derives both geometrical response and matter coupling under shared hypotheses."
    counterexample: "Geometry and matter are placed in one glossary or action after both are independently imported."
    aesthetic_or_process_trap: "Common vocabulary common repository location or shared tooling is not scientific unification."
    future_material_evidence: "A single source law with separately checked derivations of multiple sectors."
  inevitability:
    operational_definition: "Prove uniqueness up to a stated equivalence or robust source-only dynamical selection over a declared admissible alternative class."
    required_evidence:
      - "A source-defined alternative class."
      - "A uniqueness quotient or selection theorem."
      - "All selector gauge boundary and normalization choices exposed."
      - "Robustness under declared source variations."
    evidence_example: "A theorem proves a unique equivalence class of effective structures from the admitted source data."
    counterexample: "A preferred representative is chosen because it matches the target benchmark."
    aesthetic_or_process_trap: "Simplicity familiarity or one successful construction does not establish inevitability."
    future_material_evidence: "A source-only uniqueness theorem or a robust attractor result with explicit basin conditions."
  explanatory_depth:
    operational_definition: "Supply a non-circular mechanism or dependency structure that answers contrastive and counterfactual questions not answered by the benchmark description alone."
    required_evidence:
      - "A typed mechanism or dependency map."
      - "Declared source interventions or controlled variations."
      - "Derived counterfactual consequences."
      - "Limits and failure cases."
    evidence_example: "A source variation theorem explains why a stable effective property changes while another remains invariant."
    counterexample: "An interpretive dictionary leaves every benchmark dependency unchanged and adds only narrative imagery."
    aesthetic_or_process_trap: "Narrative coherence intuitive appeal and visual clarity are not mechanism evidence."
    future_material_evidence: "A source mechanism with independently checked contrastive consequences."
  dimension_and_signature_explanation:
    operational_definition: "Derive effective dimension and Lorentzian signature through separate source-only subcertificates and show stability without assuming a four-dimensional smooth Lorentzian target."
    required_evidence:
      - "A dimension-selection theorem with relevant alternatives."
      - "A signature and time-orientation theorem."
      - "A no-target-import audit."
      - "Stability under declared variations or dynamics."
    evidence_example: "Source rules select a four-dimensional Lorentzian effective sector and exclude competing dimensions or signatures under explicit hypotheses."
    counterexample: "A four-dimensional differentiable substrate or target metric is assumed and its dimension or signature is then read back as explained."
    aesthetic_or_process_trap: "Using four-dimensional notation or Lorentzian tools is not an explanation of either feature."
    future_material_evidence: "Independent source-only dimension and signature results with robustness evidence."
  matter_or_quantum_connection:
    operational_definition: "Construct a typed matter or quantum sector from source primitives with dynamics observables and a controlled bridge to the benchmark limit; where coupling is claimed also discharge universality conservation operational semantics and robustness."
    required_evidence:
      - "Source-defined matter or quantum objects."
      - "Source dynamics and observables."
      - "A controlled correspondence or low-energy limit."
      - "Coupling conservation and robustness evidence when applicable."
    evidence_example: "Source representations and dynamics yield a matter sector and its universal low-energy coupling without importing the benchmark action."
    counterexample: "The ordinary matter action Hilbert space stress-energy tensor or detector semantics is inserted by hand."
    aesthetic_or_process_trap: "Mentioning fields particles information or quanta does not create a matter or quantum connection."
    future_material_evidence: "A source-derived matter or quantum construction with a checked benchmark limit."
  problem_solving_fertility:
    operational_definition: "Enable an independently checkable result on a predeclared problem whose dependence on the ontology is explicit and whose value is not reducible to workflow output."
    required_evidence:
      - "A predeclared external or internal scientific problem."
      - "A theorem calculation constraint countermodel or discriminator enabled by the ontology."
      - "A dependency argument showing why the ontology matters."
      - "Independent checking or reuse evidence."
    evidence_example: "A source principle resolves a previously open construction problem and the result survives independent checking."
    counterexample: "The project produces many tasks candidates artifacts validators or PASS receipts."
    aesthetic_or_process_trap: "Research activity and automation throughput are not problem-solving fertility."
    future_material_evidence: "An ontology-dependent result with independent verification and demonstrable transfer."
baseline_and_alternative_rule:
  baseline: "ordinary GR on the declared exact-GR operational domain"
  baseline_constraint: "Empirical equivalence is fixed comparison context and supplies no non-empirical criterion certificate by itself."
  alternatives:
    - "continuum-first premetric proposal"
    - "emergence-first process-order proposal"
  comparison_boundary:
    - "Both alternatives remain proposal-only."
    - "Engineering tractability is reported separately from ontology value."
    - "Explanatory ambition is reported separately from demonstrated explanatory depth."
    - "No criterion weights select an ontology."
recommendation_coverage:
  V21-R62: "Directly implemented by seven operational criterion families and source-grounded current assessment."
