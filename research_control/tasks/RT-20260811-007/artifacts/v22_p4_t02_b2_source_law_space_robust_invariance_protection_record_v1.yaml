formal_maps:
  - map_id: "MAP-SLSRIP-01"
    signature: "(K,x)->T_K(x)"
    definition: "Bouligand contingent tangent cone."
  - map_id: "MAP-SLSRIP-02"
    signature: "(K,rho,x)->N_K_plus(x)"
    definition: "Positive span of active inward conormals d rho_i(x)."
  - map_id: "MAP-SLSRIP-03"
    signature: "(A,Delta,x)->V_adm(x)"
    definition: "Union of F_theta(x)+Delta(x) over every admitted theta."
  - map_id: "MAP-SLSRIP-04"
    signature: "(K,A,Delta)->RobInv_src in {pass,fail,undefined}"
    definition: "Pass iff V_adm(x) is contained in Int T_K(x) on every relevant boundary stratum; fail on an exact violating witness; undefined when a required root, effective boundary test, or transport datum is absent."
  - map_id: "MAP-SLSRIP-05"
    signature: "barrier presentation->certificate orbit"
    definition: "Forget raw representative while preserving active conormal sign and residual-margin relations."
  - map_id: "MAP-SLSRIP-06"
    signature: "g_*(K,A,Delta,T_K)"
    definition: "For an arrow (g,eta_g), K'=gK, F'_{eta_g(theta)}(gx)=Dg_x F_theta(x), Delta'(gx)=Dg_x Delta(x), and T_K'(gx)=Dg_x T_K(x)."
  - map_id: "MAP-SLSRIP-07"
    signature: "(rho_i,alpha_i,delta_i,h_i)->(h_i rho_i,h_i alpha_i,h_i delta_i)"
    definition: "Positive local certificate regraduation on an active face."
  - map_id: "MAP-SLSRIP-08"
    signature: "(ell,F,E,-E)->(ell(F+E),ell(F-E))"
    definition: "Balanced-normal obstruction map."

definitions:
  tangent_cone_regular_formula: "T_K(x)={v:d rho_i(x)[v]>=0 for every active i}"
  tangent_interior_regular_formula: "Int T_K(x)={v:d rho_i(x)[v]>0 for every active i}"
  positive_conormal_formula: "N_K_plus(x)=pos{d rho_i(x):i active}"
  perturbed_velocity_formula: "V_adm(x)=union_{F in A}(F(x)+Delta(x))"
  robust_relation_formula: "RobInv_src(K,A,Delta) iff V_adm(x) subset Int T_K(x) for every relevant x in boundary K"
  certificate_margin_formula: "d rho_i[F]>=alpha_i>delta_i>=sup_{E in Delta}|d rho_i[E]|"

theorems:
  - theorem_id: "THM-SLSRIP-01"
    name: "regular active-conormal characterization"
    hypotheses:
      - "K has a local finite C1 inequality presentation with LICQ at x"
      - "x lies on a declared boundary stratum"
    conclusion: "T_K(x) and its ambient interior are exactly the weak and strict active-conormal half-space intersections printed in definitions."
    proof: "LICQ and the regular inequality-set tangent formula identify the contingent cone with the linearized feasible cone. A finite intersection of independent closed half-spaces has ambient interior obtained by replacing each active weak inequality with a strict one."
  - theorem_id: "THM-SLSRIP-02"
    name: "strict source-law-space strong-invariance theorem"
    hypotheses:
      - "DOM-SLSRIP-01 through DOM-SLSRIP-04 hold"
      - "all declared solutions are absolutely continuous and remain in a compact local solution tube on each bounded time interval"
      - "V_adm is locally bounded and outer-semicontinuous and V_adm(x) is contained in Int T_K(x) at every relevant boundary point with locally uniform positive conormal margin"
    conclusion: "Every declared Caratheodory solution of dot x in V_adm(x) that begins in K remains in K throughout its declared forward domain."
    proof: "By THM-SLSRIP-01 each active barrier derivative is uniformly positive at the boundary for every admitted velocity. Continuity of the barriers and local boundedness or upper semicontinuity of the velocity multifunction preserve a positive half-margin on a neighborhood of each contacted face. If a solution had a first exit, an active barrier would have to cross from nonnegative to negative while its absolutely continuous derivative is positive almost everywhere in the last face neighborhood, which is impossible. A finite subcover of the compact contacted boundary portion handles simultaneous strata."
  - theorem_id: "THM-SLSRIP-03"
    name: "finite conormal quantitative certificate"
    hypotheses:
      - "rho_i only presents an independently supplied K"
      - "d rho_i[F]>=alpha_i and |d rho_i[E]|<=delta_i with alpha_i>delta_i>=0 for every active face admitted F and admitted E"
    conclusion: "Every active residual is at least alpha_i-delta_i>0; hence THM-SLSRIP-02 applies."
    proof: "Linearity gives d rho_i[F+E]>=d rho_i[F]-|d rho_i[E]|>=alpha_i-delta_i>0. Apply THM-SLSRIP-01 and THM-SLSRIP-02."
  - theorem_id: "THM-SLSRIP-04"
    name: "certificate-orbit regraduation theorem"
    hypotheses:
      - "tilde rho_i=h_i rho_pi(i) near the active face"
      - "h_i is positive and C1 and pi is a permutation; redundant positive presentations are treated groupoid-wise"
    conclusion: "On the active face d tilde rho_i=h_i d rho_pi(i), so signs and residual-margin ratios remain in the same certificate orbit."
    proof: "The product rule gives d(h_i rho)=h_i d rho+rho d h_i; the second term vanishes on rho=0. Positivity preserves sign and scales alpha_i and delta_i together."
  - theorem_id: "THM-SLSRIP-05"
    name: "EqSrc presentation-transport theorem"
    hypotheses:
      - "(g,eta_g) is a declared locally C1,1 diffeomorphism plus parameter homeomorphism with inverse and overlap coherence"
      - "K A Delta and solution domains transport by MAP-SLSRIP-06"
    conclusion: "RobInv_src has the same pass fail or undefined value after transport, and strong invariance solutions correspond by g."
    proof: "The contingent-cone chain rule gives T_gK(gx)=Dg_x T_K(x). Because Dg_x is an invertible linear open map, it maps the cone interior to the transported cone interior. It also maps V_adm(x) exactly to V_adm'(gx), proving equivalence of inclusion. The chain rule maps absolutely continuous solutions and their inverses."
  - theorem_id: "THM-SLSRIP-06"
    name: "balanced-normal-variation obstruction"
    hypotheses:
      - "ell is a nonzero active inward conormal at x"
      - "ell(F(x))=0"
      - "Delta(x) contains E and -E with ell(E)!=0"
    conclusion: "Strict robust invariance fails at x; one admitted velocity has negative ell-sign and lies outside T_K(x)."
    proof: "The two conormal velocities are ell(E) and -ell(E). They are opposite and nonzero, so one is negative and violates even weak tangent inclusion."
  - theorem_id: "THM-SLSRIP-07"
    name: "nonselection and nonphysical-semantics boundary"
    hypotheses:
      - "only the formal objects and maps in this record are supplied"
    conclusion: "RobInv_src classifies supplied roots but selects none of X_law K A Delta EqSrc arrows physical components matter sectors causal interpretations or occurrence probabilities."
    proof: "Every evaluation of MAP-SLSRIP-04 takes the roots as arguments and contains no inverse map from a pass value to any unique root. Positive regraduation and presentation transport further identify multiple certificate representatives. No physical or empirical codomain is present."

