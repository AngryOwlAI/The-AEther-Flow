  - domain_id: "DOM-SLSRIP-01"
    name: "finite-dimensional source-law chart"
    definition: "A real finite-dimensional C1 chart X_law with no identification as M_src or physical spacetime."
  - domain_id: "DOM-SLSRIP-02"
    name: "regular admissible subsets"
    definition: "Closed full-dimensional sets K locally presented by finitely many C1 inequalities rho_i>=0 whose active differentials satisfy LICQ; all relevant solution tubes have locally uniform data."
  - domain_id: "DOM-SLSRIP-03"
    name: "admissible generator family"
    definition: "A predeclared compact parameter space Theta and jointly continuous family A={F_theta} of locally uniformly Lipschitz source vector fields with declared forward solution domains."
  - domain_id: "DOM-SLSRIP-04"
    name: "admitted variations"
    definition: "A predeclared nonempty compact-valued, locally bounded, outer-semicontinuous multifunction Delta such that V_adm is locally bounded and outer-semicontinuous; admissible selections are measurable in time and satisfy the declared Caratheodory hypotheses."
  - domain_id: "DOM-SLSRIP-05"
    name: "regular barrier certificates"
    definition: "Finite active barrier families presenting an already supplied K; raw barriers do not supply K's authority."
  - domain_id: "DOM-SLSRIP-06"
    name: "source-presentation groupoid"
    definition: "Declared locally C1,1 diffeomorphisms g with locally C1,1 inverses, coherent parameter homeomorphisms eta_g, and inverse and overlap coherence transporting all roots and solution domains."
  - domain_id: "DOM-SLSRIP-07"
    name: "exact rational controls"
    definition: "Q-valued fixtures embedded in R and quarantined as conformance-only calculations."
  - domain_id: "DOM-SLSRIP-08"
    name: "excluded targets"
    definition: "No target atlas, metric, tetrad, coframe, physical norm, desired GR cone, detector response, empirical result, or benchmark calibration belongs to the theorem domain."

