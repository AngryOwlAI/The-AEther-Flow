exact_hypotheses:
  - hypothesis_id: "H-01"
    text: "X_law is a finite-dimensional C2 manifold. No spacetime, target metric, physical norm, physical cone, or matter structure is part of its type."
  - hypothesis_id: "H-02"
    text: "K is closed and full-dimensional and has a finite C2 presentation K={rho_i>=0}. At each boundary x, I(x) is nonempty and every active d rho_i(x) is nonzero."
  - hypothesis_id: "H-03"
    text: "The Mangasarian-Fromovitz inward condition holds on every boundary stratum: for each x in boundary K there is w_x in T_x X_law with d rho_i(x)[w_x]>0 for every i in I(x)."
  - hypothesis_id: "H-04"
    text: "Theta is compact metrizable; (theta,x) maps jointly continuously to F_theta(x); and on every compact source chart the family {F_theta} is uniformly bounded and equi-Lipschitz in x. Hence each A_x is compact. Admitted forward solutions of each declared perturbed field exist uniquely on a maximal interval."
  - hypothesis_id: "H-05"
    text: "Delta is nonempty compact-valued, locally bounded, and outer-semicontinuous in the source tangent bundle; E_Delta is a declared class of locally Lipschitz sections locally equi-Lipschitz on compact charts, fixed without inspecting the desired P4-T02 outcome. Consequently V is nonempty compact-valued, locally bounded, and outer-semicontinuous."
  - hypothesis_id: "H-06"
    text: "Every G in L_pert has the form F+e with F in A and e in E_Delta, so G(x) belongs to V(x) at every state in its domain."
  - hypothesis_id: "H-07"
    text: "The strict source relation holds with a locally uniform conormal margin: for every x in boundary K there are a source-chart neighborhood U_x and mu_x>0 such that nu(v)<=-mu_x for every y in U_x intersect boundary K, every nu in C_out(y), and every v in V(y). Equivalently, after shrinking U_x if needed, every active finite-barrier residual is bounded below by a positive local margin."
  - hypothesis_id: "H-08"
    text: "Each EqSrc arrow is a pair (phi,eta_phi): phi is a C1,1-local diffeomorphism with C1,1-local inverse, eta_phi is a homeomorphism of compact law-parameter spaces satisfying identity and composition coherence, and the pair transports K, A, Delta, and admitted sections by the declared pushforward rules."
  - hypothesis_id: "H-09"
    text: "Certificate changes use a permutation pi and positive C1 factors c_i, with rho_prime_i(y)=c_i(y) rho_{pi(i)}(phi^{-1}(y)); no zero or negative factor is admitted."
  - hypothesis_id: "H-10"
    text: "X_law, K, A, Delta, E_Delta, G_src, and their presentation data are explicit proposal-only roots. Their claimed source independence is not a theorem hypothesis disguised as a conclusion; it remains a separate audit obligation."
  - hypothesis_id: "H-11"
    text: "The construction neither factors through nor reconstructs any of the five frozen candidate routes."

intrinsic_and_certificate_definitions:
  strict_tangent_relation: "For all x in boundary K and all v in V(x), v lies in Int T_K(x)."
  finite_barrier_residual: "r_i(x)=min{d rho_i(x)[v]:v in V(x)} for i in I(x)."
  normalized_conormal_certificate_set: "C_out(x)={-sum_{i in I(x)} lambda_i d rho_i(x):lambda_i>=0 and sum_i lambda_i=1}."
  polar_margin: "q(x)=min{-nu(v):nu in C_out(x), v in V(x)}."
  normalization_status: "The coefficient simplex is finite certificate algebra only. It is not a physical norm, a canonical conormal normalization, or an adopted source magnitude."
  certificate_orbit: "For a fixed finite regular presentation, its orbit consists of all presentations reached by declared EqSrc diffeomorphisms, active-index permutations, and positive C1 regraduations. Redundant presentations may define the same intrinsic tangent cone but are not declared canonical orbit representatives."
  intrinsic_primitive: "R_prot on the typed full law-space tuple; barriers and conormal inequalities are optional certificates."

theorem_and_proof:
  theorem_name: "Conditional source-law-space robust-invariance, certificate-equivalence, transport, and balanced-normal obstruction theorem"
  clauses:
    - clause_id: "T-01-TANGENT-BARRIER-POLAR-EQUIVALENCE"
      statement: "Under H-01 through H-06, at each boundary x the contingent cone equals the finite half-space intersection, its topological interior is obtained by making every active inequality strict, and its outward polar is cone{-d rho_i}. Consequently V(x) subset Int T_K(x) iff r_i(x)>0 for every active i, iff nu(v)<0 for every nonzero nu in N_out_K(x) and every v in V(x), iff q(x)>0."
      proof:
        - "The regular finite inequality tangent-cone formula follows from H-02 and the MFCQ inward vector in H-03; the same inward vector proves that the half-space intersection has nonempty interior and that its interior is exactly the simultaneous strict inequalities."
        - "The finite-dimensional polar of an intersection of active closed half-spaces is the conic hull of their outward defining covectors -d rho_i. MFCQ excludes zero from C_out(x), because evaluation on w_x is strictly negative for every normalized nonnegative coefficient vector."
        - "Compactness of V(x) and C_out(x) makes all displayed minima attained. The strict barrier inequalities are equivalent to positive r_i. Nonnegative conormal combinations then evaluate strictly negatively; conversely the generators -d rho_i recover every active strict barrier inequality. Compactness converts strict negativity on the product C_out(x) x V(x) to q(x)>0."
    - clause_id: "T-02-STRONG-VIABILITY"
      statement: "Under H-01 through H-07, K is forward invariant for every G in L_pert on the maximal forward interval of each admitted solution starting in K. The conclusion includes simultaneous active faces and corners."
      proof:
        - "For G=F+e, H-06 gives G(x) in V(x). T-01 and H-07 therefore give d rho_i(x)[G(x)]>0 for every active i at every boundary state."
        - "Outer semicontinuity and local boundedness of V, continuity of d rho_i, compactness of the fibers, and the local margin in H-07 give a neighborhood of each boundary point on which every relevant admitted velocity retains at least a half-margin in each active exit direction. This bound is uniform over theta and admitted variation values, not selected separately for one favorable law."
        - "Assume an admitted C1 solution starting in K has a first exit. At the first boundary time t_star, at least one constraint rho_i is zero and was nonnegative immediately before t_star. On a short interval ending at t_star, the half-margin gives d/dt rho_i(x(t))>0. Integrating yields rho_i(x(t_star))>rho_i(x(t_star-epsilon))>=0, contradicting rho_i(x(t_star))=0."
        - "Every simultaneously active index obeys the same inequality, so no face or corner supplies an exit. Thus the solution remains in K throughout its maximal forward interval."
    - clause_id: "T-03-QUANTITATIVE-FINITE-CERTIFICATE-STABILITY"
      statement: "If at a boundary state x the individual residual vector r_I(x) is positive, then every admitted velocity has an exact positive source directional margin in every active barrier. Under a positive regraduation, residual i becomes c_i r_{pi(i)} at the transported boundary state."
      proof:
        - "The first claim is the definition of the attained minimum r_i and T-01."
        - "At rho_{pi(i)}=0, differentiating c_i times rho_{pi(i)} eliminates the rho_{pi(i)} d c_i product term and leaves c_i d rho_{pi(i)}. Positivity of c_i preserves and rescales the strict sign."
      scope: "This is certificate arithmetic, not an adopted primitive, physical scale, physical cone, or preferred normalization."
    - clause_id: "T-04-EQSRC-AND-DIFFEOMORPHISM-TRANSPORT"
      statement: "For every declared EqSrc arrow (phi,eta_phi), K_prime=phi(K), F_prime_{eta_phi(theta)}=phi_*F_theta, and Delta_prime(phi(x))=D phi_x Delta(x) satisfy T_{K_prime}(phi(x))=D phi_x T_K(x), Int T_{K_prime}(phi(x))=D phi_x Int T_K(x), and R_prot(K,A,Delta)=R_prot(K_prime,A_prime,Delta_prime). Outward conormals transport by inverse dual, and parameter labels satisfy the EqSrc cocycle."
      proof:
        - "A C1 diffeomorphism and its inverse map contingent sequences in both directions, proving equality of contingent cones. Its derivative is a linear homeomorphism, so it maps cone interiors bijectively."
        - "The velocity pushforward rule gives V_prime(phi(x))=D phi_x V(x). Applying the tangent equality proves both directions of robust-relation invariance."
        - "For nu in the outward polar, nu_prime=(D phi_x^{-1})^*nu satisfies nu_prime(D phi_x v)=nu(v), proving polar transport and overlap coherence. Composition and inversion of these rules give a certificate groupoid rather than a preferred representative."
        - "The homeomorphisms eta_phi transport the compact parameter spaces without selecting a parameter; their identity and composition laws make the field-family pushforward coherent on EqSrc overlaps."
    - clause_id: "T-05-BALANCED-NORMAL-OBSTRUCTION"
      statement: "Let x lie in boundary K, let nonzero nu lie in N_out_K(x), and let a nominal velocity a satisfy nu(a)=0. If Delta(x) contains both e and -e with nu(e) nonzero, then one of a+e and a-e has positive outward evaluation and is outside T_K(x). Hence strict R_prot fails at x."
      proof:
        - "The two outward evaluations are nu(a+e)=nu(e) and nu(a-e)=-nu(e). Since nu(e) is nonzero, exactly one is positive."
        - "Every tangent velocity has nonpositive evaluation against an outward polar conormal. The positive member is therefore not tangent, so V(x) cannot be contained in Int T_K(x)."
      failed_premise: "H-07, the strict tangent inclusion, fails; the result does not establish a global no-go for other independently sourced positive-margin or asymmetric source extensions."
    - clause_id: "T-06-NONSELECTION"
      statement: "The truth of the conditional theorem and the existence of a certificate orbit do not derive or select X_law, K, A, Delta, E_Delta, G_src, a physical component, a physical cone, a matter sector, a causal interpretation, or canonical adoption."
      proof:
        - "These objects occur as typed roots in H-01 through H-10, not as theorem conclusions."
        - "Different typed tuples can satisfy the same relation, and the negative control below can fail it. Therefore the predicate classifies supplied tuples but does not select one."

