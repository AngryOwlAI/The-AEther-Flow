conditional_theorem:
  theorem_id: "THM-RT007-SLSRIP-CONDITIONAL-ROBUST-INVARIANCE-001"
  name: "proposal-rooted strict source-law-space robust-invariance theorem"
  claim_status: "draft/control"
  source_extension_status: "proposal-only"
  formal_statement: "Let X_law be a finite-dimensional C2 source-law manifold. Let K be a closed, full-dimensional subset admitting a finite C2 regular presentation K={x:rho_i(x)>=0 for all i}, with MFCQ and nonzero active differentials on every active stratum. Let Theta be compact metrizable and A={F_theta}_{theta in Theta} be jointly continuous and uniformly bounded and equi-Lipschitz on compact source charts. Let Delta be a nonempty compact-valued, locally bounded, outer-semicontinuous admitted-variation multifunction with declared locally Lipschitz sections that are locally equi-Lipschitz on compact charts, so V(x)=A_x+Delta(x) inherits nonempty compact values, local boundedness, and outer semicontinuity. If the normalized outward-conormal residual has a locally uniform strictly positive margin on every declared boundary neighborhood, then V(x) is contained in Int T_K(x), and every admitted forward solution beginning in K remains in K throughout its maximal declared interval of existence. The result transports through each declared coherent arrow (g,eta_g), where g is a C1,1 local source-presentation diffeomorphism and eta_g is a coherent parameter-space homeomorphism, when K, A, Delta, and their tangent data are pushed forward together."
  hypotheses:
    - hypothesis_id: "H-01"
      statement: "X_law is a finite-dimensional C2 manifold with a declared tangent bundle and dual pairing; it is proposal-only and is neither physical spacetime nor adopted M_src."
    - hypothesis_id: "H-02"
      statement: "K is closed and full-dimensional and has a finite C2 presentation rho_i>=0 whose active differentials are nonzero and satisfy MFCQ at every declared boundary stratum."
    - hypothesis_id: "H-03"
      statement: "The inequality direction rho_i>=0, and hence the inward tangent orientation, is fixed as part of the proposal before the packet evaluates any P4-T02 outcome."
    - hypothesis_id: "H-04"
      statement: "A={F_theta}_{theta in Theta} is predeclared over a compact metrizable parameter space Theta; (theta,x)->F_theta(x) is jointly continuous and the family is uniformly bounded and equi-Lipschitz in x on every compact source chart."
    - hypothesis_id: "H-05"
      statement: "Delta is predeclared, nonempty, compact-valued, locally bounded, and outer-semicontinuous and has a declared class of locally Lipschitz sections locally equi-Lipschitz on compact charts; it is not narrowed after inspecting a failure witness."
    - hypothesis_id: "H-06"
      statement: "The induced V(x)=A_x+Delta(x) is nonempty compact-valued, locally bounded, and outer-semicontinuous. Every admitted field G=F_theta+e, with e a declared locally Lipschitz section, has a unique forward C1 solution on its maximal declared interval; the invariance conclusion universally quantifies over all admitted fields and solutions."
    - hypothesis_id: "H-07"
      statement: "At every declared boundary point x there are a source-chart neighborhood U_x and mu_x>0 such that every normalized nonzero outward conormal nu and every admitted v in V(y), for y in U_x intersect boundary K, satisfy nu(v)<=-mu_x; equivalently the active finite-barrier residuals have a positive locally uniform lower bound after shrinking U_x."
    - hypothesis_id: "H-08"
      statement: "Every source-presentation arrow is a pair (g,eta_g): g is a declared C1,1 local diffeomorphism with C1,1 local inverse, eta_g is a homeomorphism between compact law-parameter spaces, identity and composition are coherent, K'=g(K), F'_{eta_g(theta)}(g(x))=Dg_x F_theta(x), and Delta'(g(x))=Dg_x Delta(x)."
    - hypothesis_id: "H-09"
      statement: "Any optional barrier certificate uses only positive regraduation or positive monomial changes after K has been fixed; no barrier or conormal defines K, A, Delta, a component, or a physical cone."
    - hypothesis_id: "H-10"
      statement: "No target atlas, target metric, tetrad, coframe, desired GR cone, physical norm, detector response, empirical calibration, benchmark answer, or P4 success locus appears in the root definitions or variation bounds."
  proof:
    tangent_formula: "For the finite C2 inequality presentation, nonzero active differentials plus MFCQ give T_K(x)={v:D rho_i(x)[v]>=0 for every active i}; the common strict inward MFCQ direction makes the tangent full-dimensional and gives Int T_K(x)={v:D rho_i(x)[v]>0 for every active i}. LICQ is not required because unique multiplier coordinates are not claimed."
    strict_inclusion_step: "H-07 therefore places every F(x)+E, with F in A and E in Delta(x), in Int T_K(x)."
    invariance_step: "Outer semicontinuity and local boundedness of V, continuity of active differentials, compact fibers, and H-07 give a uniform half-margin near each boundary point. If an admitted solution starting in K had a first exit at t_star, an active constraint would be zero at t_star and nonnegative immediately before it, while its derivative would stay strictly positive on a short interval ending at t_star. Integration would give rho_i(x(t_star))>rho_i(x(t_star-epsilon))>=0, contradicting rho_i(x(t_star))=0. Applying the argument on every simultaneous active stratum proves forward invariance on the maximal interval."
    presentation_transport_step: "For a declared C1,1 local diffeomorphism g, the contingent cone satisfies T_{gK}(g(x))=Dg_x T_K(x). Because Dg_x is a linear homeomorphism, it also carries Int T_K(x) to Int T_{gK}(g(x)); typed parameter transport and the coherent pushforward hypotheses therefore preserve R_prot and the regularity used by the dynamical conclusion."
    certificate_orbit_step: "For rho_i'=h_i rho_i with h_i>0, D rho_i'[v]=h_i D rho_i[v] on rho_i=0. A positive diagonal-permutation change likewise only rescales and permutes active residuals. Strict signs and the theorem are invariant, while the raw certificate is noncanonical."
    balanced_normal_step: "If a boundary point has zero nominal residual in an active covector and Delta contains both E and -E with a nonzero normal component, one sign has nonpositive residual. Thus strict inclusion fails; if the component is nonzero, one sign is strictly outward."
    proof_scope_limit: "This proof establishes an implication inside the proposal model. It does not prove that the current ontology entails any theorem hypothesis, root, arrow, or physical interpretation."
  conclusions:
    - "Conditional strict robust inclusion R_prot holds under H-01 through H-10."
    - "All admitted proposal-model trajectories preserve K on their declared existence intervals."
    - "R_prot is invariant under the declared coherent C1,1 presentation arrows and their typed parameter-space homeomorphisms."
    - "Positive regraduation and positive monomial presentation changes preserve certificate signs but do not canonically select a raw barrier."
    - "Balanced zero-margin normal variation is an exact falsifier of strict protection."
  forbidden_conclusions:
    - "The current ontology derives X_law, K, A, Delta, G_src, or R_prot."
    - "The proposal model is canonical ontology, M_src, physical spacetime, or an actual dynamical law."
    - "The mathematical tangent cone is a physical causal cone."
    - "Forward invariance supplies physical causality, response semantics, sector universality, gauge status, empirical adequacy, or g_eff."
    - "A proof inside draft/control proposal data has protected proof or adoption authority."

