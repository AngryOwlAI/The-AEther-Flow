    payload_type: "lemma"
    object_name: "certificate orientation inheritance lemma"
    statement: "Positive regraduation and positive monomial transport preserve the inward sign of an already oriented K, but cannot select that orientation from an unoriented zero set."
    proof: "On rho_i=0, D(h_i rho_i)=h_i D rho_i for h_i>0, so signs are preserved. The alternative -rho_i reverses the inequality and describes the complementary local side; it is not in the positive orbit. Hence orbit invariance presupposes rather than derives side selection."
