formal_packet_specification:
  source_patch: >-
    A declared smooth four-dimensional proposal-only source patch U.  No
    target atlas, metric, tetrad, coframe, connection, measure, or desired GR
    cone is part of the packet input.
  sector_domain: >-
    A finite explicitly enumerated domain S.  Initially S may be only the
    honestly equipped Rod Signal Detector subfamily; no full-P7-sector credit
    is available without a separate all-sector operator and protocol theorem.
  reduced_principal_forms:
    definition: |-
      For each s in S, the next packet must independently supply a nonzero
      source-covariant real homogeneous reduced principal form
        p_s : T^*U -> L_s,
      of degree d_s>=1, where L_s is a declared oriented real coefficient or
      density line.  It must record the reduced operator provenance, degree,
      multiplicity, density weight, regularity domain, and every degeneracy
      branch.  The selector does not supply any p_s.
    independence_rule: >-
      No p_s may be obtained by copying a common factor, common tangent line,
      target cone, or benchmark answer into every sector.  Equal factors are
      allowed only if independently derived and later audited.
  oriented_hyperbolicity_data:
    definition: |-
      Each independently supplied p_s must be hyperbolic on its declared
      regular branch and must carry a source-justified choice Gamma_s of one
      oriented hyperbolicity-cone component.  Define the admissible tuple
      domain
        H_cap = { ((p_s,Gamma_s))_{s in S}
                  | intersection_s Gamma_s is nonempty }.
    orientation_guard: >-
      A common h may certify membership in the intersection after the
      independently oriented components are supplied.  Choosing h first by
      target fit and orienting all factors around it is forbidden preload.
  product_line: "L_product = tensor_product_{s in S} L_s"
  product_degree: "d_product = sum_{s in S} d_s"
  product_map: |-
    Prod : product_s Poly_hom^{d_s}(T^*U;L_s)
           -> Poly_hom^{d_product}(T^*U;L_product),
    Prod((p_s)_s)=P_product=product_s p_s.
  cone_intersection_map: |-
    Cap : H_cap -> OpenCone(T^*U),
    Cap(((p_s,Gamma_s))_s)=Gamma_cap=intersection_s Gamma_s.
  envelope_map: |-
    Env : H_cap ->
          Poly_hom(T^*U;L_product) x OpenCone(T^*U),
    Env(((p_s,Gamma_s))_s)=(P_product,Gamma_cap).
  source_covariance: |-
    For every allowed source diffeomorphism phi, require each principal form
    and oriented cone to transport by the cotangent lift.  Tensor product and
    set intersection then commute with transport:
      phi_*P_product=product_s(phi_*p_s),
      phi_*Gamma_cap=intersection_s(phi_*Gamma_s).
    This is source-presentation covariance only, not physical covariance or
    target-geometry recovery.

product_hyperbolicity_lemma:
  lemma_id: "LEM-V22-P4T02-B2-COMMON-HYPERBOLICITY-PRODUCT-001"
  claim_status: "elementary_conditional_mathematical_payload"
  pointwise_domain: "a finite-dimensional real vector space V, specialized to V=T_x^*U"
  hypotheses:
    - "S is finite."
    - "Every p_s is a nonzero real homogeneous polynomial on V."
    - "There exists h in V such that every p_s is hyperbolic with respect to h."
    - "Signs are oriented consistently so p_s(h)>0 for every s."
  statement: |-
    P=product_{s in S}p_s is hyperbolic with respect to h.  If Gamma_s is the
    hyperbolicity-cone component of p_s containing h, then the component of
    {P!=0} containing h is
      Gamma_h(P)=intersection_{s in S} Gamma_s.
  proof_sketch: |-
    For any q in V,
      P(q+t h)=product_s p_s(q+t h).
    Its multiset of roots is the union, with multiplicity, of the roots of the
    factors, so every root is real and P(h)=product_s p_s(h)>0.  For the cone
    identity use the standard root characterization
      Gamma_h(p)={q | every root of t -> p(q-t h) is positive}.
    The roots for P are again the union of the factor roots; all product roots
    are positive exactly when all roots for every p_s are positive.  Therefore
    Gamma_h(P)=intersection_s Gamma_h(p_s).
  source_bundle_extension: >-
    The lemma applies fiberwise.  A cone-field result additionally requires
    regularity, compatible coefficient-line orientations, constant degree on
    the branch, and source-covariant gluing across U.
  what_the_lemma_does_not_prove:
    - "It does not supply or derive any sector principal form."
    - "It does not select an oriented component when sector data leave it ambiguous."
    - "It does not imply strong or symmetric hyperbolicity of the full systems."
    - "It does not imply equal characteristic sets or universal propagation."
    - "It does not turn Gamma_h(P) into a physical causal cone."

linear_factor_specialization:
  specialization_id: "SPEC-V22-P4T02-B2-INDEPENDENT-LINEAR-FACTORS-001"
  assumptions: |-
    At x, independently supply nonzero proposal-only sector vectors
    v_s in T_xU and let p_s(k)=k(v_s).  Suppose a covector h satisfies
    h(v_s)>0 for every s.
  derivation: |-
    The polynomial t -> p_s(q-t h) has the one real root
      t_s=q(v_s)/h(v_s).
    Hence p_s is hyperbolic with respect to h,
      Gamma_s={k in T_x^*U | k(v_s)>0},
      P_product(k)=product_s k(v_s),
      Gamma_cap=intersection_s {k | k(v_s)>0}.
  epsilon_split_viability_witness: |-
    Let v,w be independent, choose h with h(v)>0 and h(w)=0, and set
      v_R=v+epsilon w, v_S=v, v_D=v-epsilon w.
    For every epsilon, h(v_R)=h(v_S)=h(v_D)=h(v)>0.  Thus the prior
    sector-split witness has a nonempty common hyperbolicity-cone intersection
    even though its three characteristic hyperplanes are distinct for
    epsilon!=0.  This proves that the envelope route is mathematically
    distinct from line locking; it does not construct source provenance for
    v,w, or h.
  characteristic_boundary_accounting: |-
    Char(P_product)=union_s {k | k(v_s)=0}.  Unless the v_s are positive
    scalar multiples, these sector characteristic hyperplanes differ.
    Gamma_cap therefore records common time-covector admissibility only.  It
    neither identifies the sector boundaries nor establishes a universal
    signal speed, one propagation law, or one physical cone.
  empty_intersection_control: >-
    If two admitted factors are k(v) and k(-v), no h is positive on both and
    Gamma_cap is empty.  The next packet must fail closed on this branch.

robustness_condition:
  certificate_id: "CERT-V22-P4T02-B2-STRICT-COMMON-CONE-MARGIN-001"
  general_condition: |-
    On every declared compact K subset U, require an open conic subbundle H
    with nonempty fibers such that the projective closure of H is contained in
    every selected Gamma_s over K.  Require a neighborhood V of the entire
    sector-polynomial tuple in the independently varied compact-open
    coefficient topology such that every p'_s in V remains hyperbolic on the
    same regular branch and H is contained in every transported Gamma'_s.
    This strict common interior, not mere pointwise nonempty intersection, is
    the robustness certificate.
  sufficient_analytic_burden: >-
    Uniform strict hyperbolicity or an appropriate uniform root-separation and
    symmetrizer estimate may establish the required neighborhood.  Repeated
    roots, degree changes, constraint-rank changes, and multiplicity collisions
    must be tracked rather than hidden by the product.
  linear_case: |-
    For continuous h and v_s over compact K, if
      delta_K=min_{x in K,s in S} h_x(v_s(x))>0,
    then every independent perturbation satisfying
      |h_x(v'_s(x)-v_s(x))|<delta_K/2
    preserves h_x(v'_s(x))>delta_K/2 and hence preserves a common
    hyperbolicity witness.  This uses only the canonical scalar pairing and a
    declared source variation neighborhood, not a target metric norm.
  failure_conditions:
    - "Gamma_cap becomes empty for one admitted independent sector variation."
    - "The common interior collapses to a boundary or loses strict margin."
    - "A factor becomes nonhyperbolic, identically zero, or changes degree on the branch."
    - "The argument varies all sectors diagonally or suppresses a split direction."
    - "The witness h or cone orientation is selected by desired target behavior."

exact_limitations:
  - limitation_id: "LIM-BOUNDARY-INEQUIVALENCE"
    statement: >-
      A nonempty cone intersection does not make Char(p_s) equal.  The product
      characteristic set is their union and generally retains birefringent or
      multirefringent sector boundaries.
  - limitation_id: "LIM-PRODUCT-NOT-SECTOR-OPERATOR"
    statement: >-
      P_product is an envelope polynomial.  Without a source-derived coupled
      operator or quotient theorem it is not the principal polynomial of each
      sector and not the determinant of one physical universal system.
  - limitation_id: "LIM-WELL-POSEDNESS"
    statement: >-
      Polynomial hyperbolicity alone does not prove strong or symmetric
      hyperbolicity, constraint propagation, energy estimates, or PDE
      well-posedness for the reduced sector systems.
  - limitation_id: "LIM-ORIENTATION-PRELOAD"
    statement: >-
      If sector data do not independently select oriented cone components,
      inserting a common h or preferred component is a new unproved source
      primitive and may replay the frozen goal-property preload in dual form.
  - limitation_id: "LIM-OPERATIONAL-QUOTIENT"
    statement: >-
      A source-only operational quotient or compatibility law is still needed
      to explain why Gamma_cap controls every declared protocol.  Formal token
      agreement and the word envelope do not supply physical semantics.
  - limitation_id: "LIM-SECTOR-SCOPE"
    statement: >-
      Evidence on the three equipped controls cannot be generalized to all P7
      sectors without typed all-sector principal forms and protocols.
  - limitation_id: "LIM-NO-PHYSICAL-CONE"
    statement: >-
      Gamma_cap is an algebraic common time-covector domain.  It is not a
      physical causal cone, time orientation, Lorentzian conformal class,
      scale, g_eff, or Gate B result.

