selector_level_results:
  strict_finite_alternative:
    result_id: "THM-V22-P4T02-B2-STRICT-FINITE-ALTERNATIVE-001"
    setup: "Let S be finite, V a finite-dimensional real vector space, and v_s nonzero oriented vectors fixed before evaluation."
    statement: "Exactly one of the following holds: there is k in V* with k(v_s)>0 for every s, or there is a nonzero alpha in R_{>=0}^S with sum_s alpha_s v_s=0."
    proof: "If both held, applying k to the nonnegative dependence would give a strictly positive sum equal to zero. If the strict-positive system is infeasible, finite-dimensional strict separation gives a nonzero nonnegative vector in the kernel of the sector-vector map."
    certificate_symmetry: "Both the feasible witness and the obstructing dependence are decisive outputs from the same fixed input."
  minimal_positive_circuit_bound:
    result_id: "LEM-V22-P4T02-B2-POSITIVE-CIRCUIT-SUPPORT-BOUND-001"
    statement: "A support-minimal nonzero nonnegative dependence has strictly positive coefficients on its support, one-dimensional kernel on that support, and support size at most rank(V_S)+1; hence at most five when dim(V)=4."
    proof: "A zero coefficient could be removed. If the restricted kernel had dimension above one, a signed kernel perturbation could cancel one positive coefficient while retaining nonnegativity, contradicting support minimality. Rank-nullity then gives |C|=rank(V_C)+1."
  presentation_invariance:
    result_id: "LEM-V22-P4T02-B2-ORIENTED-CONFIGURATION-INVARIANCE-001"
    statement: "Realized sign covectors and positive-circuit supports are invariant under source-linear isomorphisms, independent positive sector rescaling, and relabeling."
    coefficient_rule: "Under v_s -> lambda_s v_s with lambda_s>0, a circuit coefficient alpha_s transforms to alpha_s/lambda_s."
    orientation_limit: "Negative rescaling is a reorientation and is not an allowed invariance unless independently source-authorized."
  refinement_relations:
    result_id: "LEM-V22-P4T02-B2-FINITE-SECTOR-REFINEMENT-001"
    statement: "For S subseteq T in one declared configuration, realized covectors restrict surjectively from T to S, Gamma_T is contained in Gamma_S, and every positive circuit supported in S persists after adjoining sectors."
    consequence: "Adding sectors can destroy common feasibility but cannot erase an already supported positive-circuit obstruction."
  preload_neutrality_criterion:
    result_id: "CRIT-V22-P4T02-B2-TOTAL-ALTERNATIVE-PRELOAD-NEUTRALITY-001"
    statement: "A total two-certificate classifier avoids success preload only when its sector set, vector orientations, and provenance are fixed before evaluation and its obstruction branch is accepted as a terminal result."
    failure_condition: "Choosing inputs, orientations, or refinements because they yield the all-plus branch invalidates the criterion."

