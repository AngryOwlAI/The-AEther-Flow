      statement: "Return exactly constructed_candidate, minimal_countermodel, precise_obstruction, or invalid_under_claim_boundary, while blocking physical causality, empirical response, adoption, D7, B2, P4-T03, g_eff, Gate, proof, promotion, and external action."
