selector_level_mathematics:
  positive_diagonal_descent_theorem:
    payload_id: "NMP-RT013-MATH-001"
    payload_type: "theorem"
    name: "Positive-diagonal and source-linear descent of the total oriented bridge"
    statement: "Let A:R^S->V have nonzero columns. For positive diagonal D, T in GL(V), and a sector permutation P, A'=T A D P^{-1} has the same total covector/circuit alternative as A up to the induced dual, support, and label transports. In particular Cstar, Gamma feasibility, minimal positive-circuit supports, circuit rank, and the feasible-or-obstructed branch descend to the presentation quotient."
    proof:
      - "For ell' in V*, A'^*ell'=P D A^* T^* ell'; positive D preserves every coordinate sign and P only relabels coordinates, so realized covectors transport bijectively."
      - "ell is positive on every v_s iff ell composed with T^{-1} is positive on every T v_s; positive column scaling and relabeling do not change strict positivity."
      - "If A_C alpha=0 with alpha>0, then A'_{P(C)} P D_C^{-1} alpha=0 with positive coefficients; inclusion-minimality, rank, and kernel dimension are preserved by invertible maps."
    consequence: "Route B is a well-defined non-character bridge on positive-ray configurations and does not need cross-sector magnitude normalization."
    exact_limit: "The theorem gives formal presentation naturality only; it supplies no physical gauge interpretation or P7 completeness."

  holonomy_forgetful_fiber_theorem:
    payload_id: "NMP-RT013-MATH-002"
    payload_type: "theorem"
    name: "Holonomy-forgetful fiber nonreconstruction theorem"
    statement: "Let K have nonzero H1(K;R), let |S|>=2, and let P=Conf(S,V) x H1(K;R)^S. Any Route-B object factors through the projection pi:P->Conf(S,V). Every fiber of pi contains both a diagonal holonomy tuple and a nondiagonal tuple, so no Route-B covector, circuit, totality, or refinement output can reconstruct or decide common-character holonomy protection."
    proof: "Fix any configuration A and nonzero eta in H1(K;R). The points (A,(0,...,0)) and (A,(0,eta,0,...,0)) have the same pi image, while the first holonomy tuple is diagonal and the second is not. Any function factored through pi agrees on them and therefore cannot determine the diagonal-holonomy predicate."
    freeze_consequence: "Selecting Route B does not reopen NDCL-V22-P4T02-B2-COMMON-CHARACTER-HOLONOMY-PROTECTION."

  fine_ray_forgetful_countermodel:
    payload_id: "NMP-RT013-MATH-003"
    payload_type: "countermodel"
    name: "Fine-magnitude nonreconstruction under positive column scaling"
    construction: "Take A=(e1,e2,e3) and A'=(2e1,e2,e3) in R^3."
    exact_result: "A and A' have identical Cstar, empty positive-circuit families, and nonempty Gamma, but any coordinate retaining the first-to-second sector magnitude ratio changes by a factor of two."
    freeze_consequence: "The selected bridge cannot reconstruct Q_ray or the repaired quotient's fine magnitude data."

  totality_and_support_theorem:
    payload_id: "NMP-RT013-MATH-004"
    payload_type: "theorem"
    name: "Finite total alternative with bounded obstruction support"
    statement: "Exactly one of Gamma(A) nonempty or there exists nonzero alpha>=0 with A alpha=0. In the obstructed branch, a support-minimal alpha gives C in Cir_plus(A), rank(A_C)=|C|-1, dim ker(A_C)=1, and |C|<=r+1<=5."
    proof: "Gordan's strict alternative gives exclusivity and exhaustiveness. Support-minimality makes every proper subfamily independent, so C is a circuit with rank |C|-1 and one-dimensional kernel. Since rank(A_C)<=r<=4, |C|<=5. Positivity of alpha excludes any ell positive on every column by applying ell to A_C alpha=0."
    bridge_consequence: "The future packet can terminate with either a witness or a finite exact obstruction; failure need not be hidden or repaired."

  route_separation_lemma:
    payload_id: "NMP-RT013-MATH-005"
    payload_type: "lemma"
    name: "Pairwise separation of configuration and holonomy routes"
    statement: "Route B and Route C are logically independent at selector level. Route B cannot imply Route C by the holonomy-forgetful fiber theorem. Route C cannot imply Route B because the same diagonal holonomy data can accompany A_plus=(e1,e2), which is strictly feasible, or A_zero=(e1,-e1), which has the positive circuit (1,1)."
    consequence: "The non-character packet is a genuinely different bridge family, not a concealed protection-law repair. Route A is a theorem about a chosen functor class and Route D is protected governance, so neither supplies the Route-B total configuration object."

  freeze_independence_lemma:
    payload_id: "NMP-RT013-MATH-006"
    payload_type: "lemma"
    name: "Three-freeze primitive independence lemma"
    route_b_dependency_set:
      - "finite S"
      - "real V"
      - "nonzero oriented rays [v_s]_+"
      - "A, A*, Cstar(A), Gamma(A), Cir_plus(A), Tot(A), and finite inclusion maps"
    excluded_dependency_set:
      - "shared tau or a common projective tangent line"
      - "Q_ray, the RT007 midpoint relation, repaired-quotient rank-two plane, or six-cell reconstruction"
      - "G_src, chi, cochains, anchors, H1 protection, or common-character flow"
    proof: "The Route-B definitions close under only the listed configuration operations. NMP-RT013-MATH-003 proves loss of fine magnitude, and NMP-RT013-MATH-002 proves loss of holonomy. No selected covector tau is required because the output records all realized covectors and accepts an obstruction branch."
    acceptance_guard: "A future artifact that returns only one preselected all-positive witness, reconstructs fine rays, or imports character/holonomy data fails material distinctness and must not count as this route."

