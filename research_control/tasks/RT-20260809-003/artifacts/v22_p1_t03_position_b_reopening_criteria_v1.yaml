schema_id: "v22_p1_t03_position_b_reopening_criteria_v1"
criteria_id: "POSITION-B-REOPENING-CRITERIA-V1"
task_id: "RT-20260809-003"
job_id: "AJ-RT-20260809-003-001"
current_position: "A"
position_b_status: "not_open"
reopening_semantics: "Meeting these criteria may authorize a separate research program; it does not establish matter emergence or adopt ontology."
all_required: true
program_opening_predicates:
  - predicate_id: "PB-OPEN-01"
    requirement: "A materially distinct source-side matter-emergence hypothesis and explicit scientific rationale are recorded."
    evidence_required: "hash-bound hypothesis packet with source provenance and falsifiable differences from Position A"
  - predicate_id: "PB-OPEN-02"
    requirement: "A separate registered plan, finite budget, claim boundary, and ordinary or protected route are authorized."
    evidence_required: "tracked plan task, AgentJob, budget, and exact authority source"
  - predicate_id: "PB-OPEN-03"
    requirement: "The program explicitly separates itself from Position A and preserves the P7 protected-postulate boundary and negative-result history."
    evidence_required: "scope comparison and non-erasure ledger"
  - predicate_id: "PB-OPEN-04"
    requirement: "The target research obligations are preregistered before results are known."
    evidence_required: "typed obligation matrix covering every required domain below"
  - predicate_id: "PB-OPEN-05"
    requirement: "Source-provenance, falsification, robustness, and continuum/refinement tests plus family identity and reopening rules are specified."
    evidence_required: "test protocol and family-freeze record"
  - predicate_id: "PB-OPEN-06"
    requirement: "The evidence-only no-postulate Gate B/D policy remains binding."
    evidence_required: "policy hash and evaluator conformance fixtures"
required_research_obligations:
  - "particle or field degrees of freedom"
  - "internal symmetry and representations"
  - "classical or quantum statistics"
  - "Hilbert-space or algebraic state structure"
  - "source locality and any target microcausality bridge"
  - "interactions and dynamics"
  - "controlled continuum or refinement behavior"
  - "effective Standard Model sectors and their stated approximation domain"
  - "operational observables and falsification conditions"
  - "universal-coupling and source-to-geometry compatibility obligations"
forbidden_reopening_bases:
  - "renaming the exact P7 finite package"
  - "a protected decision without a materially distinct evidence-supported hypothesis"
  - "validator or checkpoint PASS"
  - "target Standard Model or GR structure imported as a source premise"
  - "removing Position A or P7 history by reinterpretation"
  - "an unlimited or post-result source-extension budget"
reopening_evaluator:
  rule: "open only if every PB-OPEN predicate has admissible tracked evidence"
  missing_predicate_result: "NOT_OPEN"
  protected_selection_may_change_truth_values: false
  automatic_ontology_adoption: false
authority_limits:
  position_b_opened_by_this_task: false
  realistic_matter_emergence_claimed: false
  canonical_ontology_edit_authorized: false
  source_law_adoption_authorized: false
  gate_verdict_authorized: false
  physics_promotion_authorized: false
  completed_derivation_authorized: false
