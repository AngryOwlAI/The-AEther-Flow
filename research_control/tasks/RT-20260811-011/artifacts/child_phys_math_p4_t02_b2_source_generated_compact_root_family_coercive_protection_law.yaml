new_mathematical_payload:
  payload_count: 5
  items:
    - payload_id: "PAYLOAD-RT011-PM-001"
      payload_type: "nondefinability_theorem"
      name: "Pres_src admission/category nonselection theorem"
      statement: >-
        Let T_cur be the inspected source theory in language L_cur. Extend its language by a new
        presentation sort U={p0,p1}, an admission predicate Adm, and identity-only EqSrc arrows.
        With no L_cur definition or source axiom relating Adm to current source data, the expansions
        Adm_A={p0} and Adm_B={p0,p1} have the same L_cur reduct and both form valid small groupoids,
        but their admitted categories are not isomorphic because they have one and two objects.
        Hence bare category axioms and the current reduct do not implicitly define Pres_src.
      hypotheses:
        - "The inspected current source package supplies no L_cur formula or theorem defining AdmPres_src and EqSrc arrow admission."
        - "The added presentation tags carry no target, outcome, benchmark, role, registry, or validation data."
        - "Only ordinary identity, inverse, and composition category axioms are imposed on the new admitted subcategory."
      proof: >-
        Fix any model M of T_cur. Form expansion E_A with new sort U={p0,p1}, admit only p0, and
        give p0 its identity arrow. Form E_B with the same M and U, admit p0 and p1, and give each
        only its identity arrow. Both expansions satisfy every sentence of T_cur because their
        L_cur reduct is exactly M, and both satisfy the groupoid axioms. Their admitted categories
        have different object cardinalities, so they are not isomorphic. If T_cur plus the bare
        category axioms implicitly determined Pres_src, all expansions of M would agree up to the
        required unique structure; E_A and E_B contradict that. A new source-derived admission law
        can remove this obstruction, so the result is scoped rather than global.
      decisive_use: "Proves the first exact failed premise at Pres_src provenance."

    - payload_id: "PAYLOAD-RT011-PM-002"
      payload_type: "paired_completion_theorem"
      name: "Generator-before-modulus same-reduct theorem"
      statement: >-
        Even after granting the proposal-only one-object identity groupoid Pres_src={P}, the same
        current-source reduct admits completion E_1 with R_P={r0}, kappa=1 and completion E_2 with
        R_P={r0,r1}, kappa=1 on both roots. Both root spaces are finite nonempty compact discrete
        spaces; identity EqSrc, identity variation, identity transverse closure, and kappa naturality
        all hold. The root fibres are nonisomorphic by cardinality, so G_src and CompleteRoot are not
        selected by the reduct. On the fixed two-root fibre, constant moduli kappa_1=1 and kappa_2=2
        are both finite, positive, continuous, and natural, so modulus normalization is also unselected.
      proof: >-
        Finite discrete spaces are compact and every real-valued function on them is continuous and
        therefore lower-semicontinuous. Identity actions satisfy identity, inverse, and cocycle laws
        and preserve every constant modulus. Forgetting all added symbols sends every completion to
        the same current-source reduct. The singleton and doubleton fibres cannot be homeomorphic
        because a bijection would contradict their cardinalities. On the common doubleton fibre the
        two constant natural transformations differ at every root. Therefore neither complete-root
        generation nor modulus normalization follows from compactness, positivity, l.s.c., closure,
        or groupoid coherence alone.
      exact_fixtures:
        completion_E1: "R={r0}; kappa(r0)=1"
        completion_E2: "R={r0,r1}; kappa(r0)=kappa(r1)=1"
        modulus_E3: "R={r0,r1}; kappa(r0)=kappa(r1)=2"
        cardinalities: "|R_E1|=1 and |R_E2|=2"
      decisive_use: "Shows G_src/CompleteRoot is the first nondefinitional failure if Pres_src is bookkeeping."

    - payload_id: "PAYLOAD-RT011-PM-003"
      payload_type: "conditional_theorem"
      name: "Compact-total positive-l.s.c. minimum theorem"
      statement: >-
        If R_total is a nonempty compact topological space and kappa:R_total->R_{>0} is finite-valued
        and lower-semicontinuous, then kappa attains a minimum kappa_star>0. If EqSrc transport
        preserves kappa and every admitted variation and transverse image remains in R_total, the
        same kappa_star bounds every transported, varied, and transversely extended root.
      proof: >-
        A finite lower-semicontinuous real function on a nonempty compact space attains its infimum.
        Let r_star be a minimizer. Because the declared codomain is R_{>0}, kappa_star=kappa(r_star)>0.
        Naturality preserves kappa along EqSrc arrows, while closure places every admitted operation
        image back in R_total; every such image therefore has value at least kappa_star.
      dependency_limit: >-
        This theorem is valid mathematics about supplied data. It derives neither AdmPres_src,
        G_src, R_total, kappa, admitted operations, nor their source provenance.

    - payload_id: "PAYLOAD-RT011-PM-004"
      payload_type: "nonfactorization_countermodel"
      name: "Six-frozen-diagnostic fibre-separation control"
      statement: >-
        Let U={r0,r1}. For each frozen route j in {1,...,6}, let D_j:U->Y_j be constant, while let
        chi_complete(r0)=1, chi_complete(r1)=0. Then chi_complete cannot factor through any D_j or
        through their product D=(D_1,...,D_6). On the generated two-root control let kappa(r0)=1 and
        kappa(r1)=2 while every D_j remains constant; kappa likewise cannot factor through any D_j
        or D. Thus proposal syntax can be materially distinct from all six frozen diagnostics, but
        the countermodel supplies no current-source rule selecting chi_complete or kappa.
      proof: >-
        If chi_complete=h_j composed with D_j, equality D_j(r0)=D_j(r1) would force equal membership
        values, contradicting 1!=0. The same argument applies to the product diagnostic and to kappa,
        where 1!=2. This is a source-extension independence control, not a derivation or adoption.
      decisive_use: "Separates material distinctness from epistemic source selection."

    - payload_id: "PAYLOAD-RT011-PM-005"
      payload_type: "coherence_and_closure_controls"
      name: "EqSrc orbit-constant naturality and operation-closure controls"
      exact_results:
        identity_groupoid: "Identity-only EqSrc satisfies identity, inverse, cocycle, and kappa naturality trivially."
