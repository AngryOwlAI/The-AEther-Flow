new_mathematical_payload:
  payload_count: 3
  items:
    - payload_id: "NMP-RT011-PHIL-001"
      payload_type: "countermodel_or_obstruction"
      name: "same-reduct expansion nondefinability theorem"
      formal_statement: "Let B_src=(T^4,Phi_open) be the canonical source reduct. Expansion E_1 has one proposal presentation P, G_1(P)={r_0}, kappa_1(r_0)=1, identity EqSrc, and identity variation/transverse closure. Expansion E_2 has the same reduct and presentation P, G_2(P)={r_0,r_1}, kappa_2(r_0)=kappa_2(r_1)=1, a coherent C_2 swap action, and identity closure. Expansion E_3 keeps E_2's roots and C_2 action but sets kappa_3(r_0)=kappa_3(r_1)=2. Every root space is finite nonempty compact, every modulus is finite positive lower-semicontinuous and natural, and all stated coherence laws hold. G_1 is not isomorphic to G_2 because their fibres have different cardinality, while E_2 and E_3 have different natural modulus normalizations. Therefore the current reduct determines neither CompleteRoot/G_src nor the kappa profile."
      proof: "Every canonical sentence concerns only the smooth source arena and unresolved Phi_src slot, so forgetting the added symbols sends all three expansions to the same B_src. Finite discrete root spaces are compact, every real function on them is continuous, and the identity and order-two swap actions satisfy their group laws. Constant kappa is invariant under the swap. Any construction uniquely derived from B_src would have the same value in every expansion of that reduct. The displayed nonisomorphic root fibres and distinct natural modulus normalizations contradict uniqueness, so new source laws are required."
      scope: "nondefinability relative to the current canonical reduct, not impossibility under future extensions"
      falsifier: "A canonical source term or theorem that constructs one unique CompleteRoot/G_src value from B_src and excludes one displayed expansion would falsify this obstruction."
    - payload_id: "NMP-RT011-PHIL-002"
      payload_type: "lemma"
      name: "typing-before-generation ordering lemma"
      formal_statement: "A functor G:C->D can be claimed source-derived only after C's admitted objects and arrows are source-derived or explicitly demoted to definitional bookkeeping; typing C by declaration cannot itself establish the epistemic selection of C."
      proof: "Functoriality quantifies over the objects and arrows of C. If the admissibility predicate for those quantifiers is not fixed by the source theory, different declared domains produce different functor burdens while preserving the source reduct. Thus domain declaration precedes and cannot be inferred from functor coherence."
      falsifier: "An explicit current-source category-formation law AdmPres_src with existence, uniqueness, and provenance would move the first nondefinitional failure to CompleteRoot/G_src."
    - payload_id: "NMP-RT011-PHIL-003"
      payload_type: "conceptual_separator"
      name: "coercive-goal preload separator"
      formal_statement: "Compactness plus finite strict positivity and lower semicontinuity honestly prove a uniform positive minimum, but they do not explain why the current source ontology supplies that compact domain or positive modulus."
      proof: "Minimum attainment is a mathematical implication from the displayed hypotheses. Source derivation is a distinct provenance relation between canonical primitives and those hypotheses. Logical validity of the implication does not create that relation."
      falsifier: "A pre-outcome derivation of the total topology and kappa values from canonical source equations, invariant under all admitted source presentations and operations, would convert the theorem from a supplied-model result into a current-source theorem."

