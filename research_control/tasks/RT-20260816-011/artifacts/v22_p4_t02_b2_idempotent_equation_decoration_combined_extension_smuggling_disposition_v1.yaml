new_mathematical_payload:
  - payload_id: "NMP-RT016-011-001"
    payload_type: "natural_section_nonselection_theorem"
    name: "Two universal natural idempotent endpoints"
    summary: "A frame-independent idempotent endomorphism commuting with every GL(6) change of equation frame is scalar, hence equals zero or identity. Both define restriction- and conjugation-natural sections, so naturality plus idempotency does not select the null endpoint."
    proof: "Diagonal frame scalings eliminate off-diagonal entries, permutation frames equate all diagonal entries, and lambda squared equals lambda gives lambda in {0,1}."
    falsifier: "An independently source-derived law excluding identity while retaining zero would select the null endpoint and overturn this conditional nonselection."
  - payload_id: "NMP-RT016-011-002"
    payload_type: "semantic_relabeling_lemma"
    name: "Algebraic data cannot fix occurrence vocabulary"
    summary: "Keeping the carrier, arrows, idempotent locus, zero section, and rank control fixed while swapping the external labels occurrence and nonoccurrence leaves every equation and validation invariant."
    proof: "The labels occur in no algebraic predicate or transport equation; the identity map on the formal structure is an isomorphism between the two labeled readings after forgetting labels."
    falsifier: "A source-side observable or law whose value changes under the relabeling would make the two readings distinguishable."
  - payload_id: "NMP-RT016-011-003"
    payload_type: "rank_topology_counterfamily"
    name: "Rank isolation does not imply perturbative isolation"
    summary: "For P=diag(1,0,...,0) and S_t=I+tE_21, P_t=S_t P S_t inverse=P+tE_21 is idempotent and tends to P in every ordinary finite-dimensional matrix norm as t tends to zero, while rank(P_t-P)=1 for every nonzero t."
    proof: "E_21 squared is zero, P E_21=0, E_21 P=E_21, and S_t inverse=I-tE_21; the displayed formula and rank claim follow exactly."
    falsifier: "A separately sourced topology and uniform stability theorem connecting source perturbations to P would establish a stronger robustness result not present here."
  - payload_id: "NMP-RT016-011-004"
    payload_type: "conjugacy_orbit_theorem"
    name: "Idempotent conjugacy classes are classified by rank"
    summary: "Over each real rank-six fibre every idempotent is diagonalizable with eigenvalues zero and one, so GL(6) conjugacy classes are exactly ranks zero through six."
    proof: "The minimal polynomial divides x(x-1), which has distinct roots, and conjugation preserves rank."
    falsifier: "Over a non-field coefficient ring or without a vector-bundle fibre this classification need not hold; those domains are outside the fixed packet."
  - payload_id: "NMP-RT016-011-005"
    payload_type: "conservativity_scope_lemma"
    name: "Inert expansion is sufficient but not self-justifying"
    summary: "If no old equation, coefficient, constraint, gauge rule, or lawful reduction reads P, then forgetting P maps every expanded model to its old reduct and the zero section lifts every old model."
    proof: "Old-language truth is evaluated on unchanged old symbols, while the zero decoration supplies an expansion for every old model."
    falsifier: "Any old rule depending on P invalidates the lifting argument."
  - payload_id: "NMP-RT016-011-006"
    payload_type: "firewall_dependence_lemma"
    name: "Endpoint-dependent projector descendants"
    summary: "The two universal endpoints exchange extreme descendants: im(0)=0 and ker(0)=W_eq, while im(I)=W_eq and ker(I)=0. Therefore any descendant-based sector or quotient meaning inherits the unselected endpoint choice."
    proof: "The image and kernel identities follow from the definitions of zero and identity."
    falsifier: "A bridge invariant under exchanging the two endpoints and independently sourced from current ontology would evade this particular dependence, but none is supplied."

