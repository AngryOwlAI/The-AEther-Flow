new_mathematical_payload:
  payload_count: 5
  payloads:
    - payload_id: "NMP-RT011-PHIL-001"
      payload_type: "central_idempotent_nonselection_theorem"
      name: "Full equation-frame conjugation fixes exactly zero and identity among idempotents"
      assumptions: "Let V be the real rank-six equation fibre and let P in End(V) satisfy S P S inverse equals P for every S in GL(V)."
      statement: "P is a scalar multiple of the identity; if P is idempotent, then P is either zero or identity. Thus full frame-conjugation naturality leaves at least the two algebraically natural idempotents zero and identity and cannot by itself select the null attachment semantics."
      proof: "Commutation with every invertible diagonal matrix forces every off-diagonal entry of P to vanish in a chosen basis. Commutation with every permutation matrix forces all diagonal entries to be equal, so P=lambda I. Idempotency gives lambda squared equals lambda over the reals, hence lambda is zero or one. Both zero and identity also commute with source pullback and restriction."
      falsifier: "Exhibit a non-scalar endomorphism fixed by conjugation under all GL(6,R) frame changes, or derive from the fixed candidate axioms an algebraic condition satisfied by zero and not identity."
      scope_limit: "This pointwise theorem assumes the full GL(6,R) equation-frame class. A separately source-derived reduction of the frame group could have a larger fixed locus but is not present or adopted here."
      burden_effect: "narrows_semantic_selection_burden"
    - payload_id: "NMP-RT011-PHIL-002"
      payload_type: "semantic_expansion_underdetermination_theorem"
      name: "Algebraic truth does not determine occurrence or physical-state semantics"
      assumptions: "Use the candidate algebraic language containing W_eq, End, Adm_occ, X_OCC, U, s0, restriction, conjugation, and d_rank, but no physical-occurrence or detector predicate."
      statement: "The same algebraic candidate admits semantic expansions in which s0 is or is not associated with a realized physical occurrence, because the algebraic axioms constrain no such predicate. Therefore no candidate theorem entails occurrence, nonoccurrence, physical state, probability, or empirical response for s0."
      proof: "Fix any algebraic model of the candidate. Add a fresh predicate PhysOcc without axioms. One expansion interprets PhysOcc(s0) as true and another as false while leaving every algebraic symbol and theorem unchanged. Since both expansions satisfy the same algebraic theory, neither interpretation follows from that theory."
      falsifier: "Supply an independently authorized source-to-physical axiom or empirical interpretation rule in the governing language that fixes PhysOcc(s0)."
      scope_limit: "This proves semantic underdetermination of the current written packet, not that no future source extension can supply meaning."
      burden_effect: "preserves_adoption_and_physical_meaning_block"
    - payload_id: "NMP-RT011-PHIL-003"
      payload_type: "rank_topology_separation_theorem"
      name: "Rank distance is discontinuous relative to small operator perturbations"
      assumptions: "Embed a two-dimensional plane in the rank-six fibre. Let P0 be orthogonal projection onto the first coordinate and P_theta projection onto the unit vector (cos theta,sin theta)."
      statement: "For every nonzero sufficiently small theta, P_theta and P0 are idempotent, the operator norm of P_theta minus P0 tends to zero with theta, but rank(P_theta minus P0) equals two."
      proof: "On the two-plane, P_theta-P0 has matrix [[-sin(theta)^2,cos(theta)sin(theta)],[cos(theta)sin(theta),sin(theta)^2]]. Its determinant is minus sin(theta)^2, so it has rank two whenever sin(theta) is nonzero. The operator norm equals the sine of the principal angle and tends to zero. Extend both projectors by zero on the remaining four dimensions."
      falsifier: "Find a nonzero sequence theta_n tending to zero for which rank(P_theta_n-P0) tends to zero, or show the stated determinant vanishes."
      scope_limit: "The theorem does not deny algebraic conjugation invariance or integer-valued isolation; it denies perturbative, continuum, physical, and empirical robustness credit."
      burden_effect: "clarifies_rank_control_scope"
    - payload_id: "NMP-RT011-PHIL-004"
      payload_type: "model_conservativity_scope_lemma"
      name: "Zero expansion yields old-language conservativity only under inertness"
      assumptions: "Every model of the old source theory has an expansion with P=0, and no new axiom changes the interpretation of an old symbol."
      statement: "Any old-language sentence entailed by every model of the expanded theory was already entailed by the old theory. This logical conservativity supplies no physical equivalence or semantic interpretation."
      proof: "If an old-language sentence were not entailed by the old theory, an old countermodel would exist. By hypothesis it has a zero-decoration expansion, which remains a countermodel to the same old-language sentence, contradicting entailment by the expanded theory."
      falsifier: "Produce an old model with no permitted zero expansion or an expanded axiom that constrains an old equation, coefficient, constraint, gauge rule, or reduction."
      scope_limit: "The premise is a declared proposal condition and not a theorem that nature or current ontology realizes the extension."
      burden_effect: "preserves_exact_conservativity_scope"
    - payload_id: "NMP-RT011-PHIL-005"
      payload_type: "output_independent_arrow_criterion"
      name: "Full-arrow covariance is distinct from decoration-stabilizer covariance"
      assumptions: "Let A be the source/equation-frame arrow class fixed before choosing P, and let A_P be the subclass whose transports fix a selected P."
      statement: "Covariance on A is output-independent; covariance proved only after replacing A by A_P is circular selection evidence unless A_P has an independent source definition."
      proof: "Membership in A is evaluated without P, whereas membership in A_P contains the equation T_g(P)=P. The latter makes preservation of P true by definition. The RT009 full-class rule uses all inherited arrows and its swap control shows that deleting a P-moving arrow can manufacture a false fixed section."
      falsifier: "Show that the operative arrow class in the fixed candidate is selected by T_g(P)=P, or provide an independently current-source-derived definition of the same restricted class."
      scope_limit: "The criterion does not adopt A as EqSrc or physical symmetry; it audits only written output independence."
      burden_effect: "clarifies_arrow_provenance"

