new_exact_mathematical_results:
  result_count: 5
  results:
    - result_id: "THM-PM-RT011-001-CENTRAL-IDEMPOTENTS"
      result_type: "theorem"
      name: "Full-frame central-idempotent and null-nonselection theorem"
      hypotheses:
        - "W is a real vector space of dimension six."
        - "The admitted equation-frame isotropy contains every S in GL(W) and acts on End(W) by conjugation."
      statement: "The idempotents fixed by every equation-frame conjugation are exactly zero and identity. Therefore full-frame naturality leaves at least two canonical idempotent sections and cannot select the declared null attachment."
      proof: "If A is fixed by every conjugation, then AS=SA for every invertible S. Commutation with elementary transvections and coordinate swaps forces every off-diagonal entry of A to vanish and all diagonal entries to agree, so A=lambda I. Idempotency gives lambda squared equals lambda, hence lambda is zero or one. Both zero and identity are fixed."
      falsifier: "A non-scalar idempotent commuting with all of GL(6,R) would refute the theorem. If the actual admitted isotropy is a proper subgroup, the theorem's full-frame hypothesis fails and its fixed locus must be recomputed; that does not create target import."
      audit_consequence: "The zero attachment is algebraically canonical but not uniquely selected by naturality; its occurrence meaning remains a proposal semantic root."
    - result_id: "THM-PM-RT011-002-IDEMPOTENT-ORBIT"
      result_type: "theorem"
      name: "Idempotent splitting and rank-orbit classification theorem"
      hypotheses:
        - "P is an idempotent endomorphism of a finite-dimensional real vector space W."
      statement: "W equals im(P) direct_sum ker(P), P is GL(W)-conjugate to diag(I_r,0) for r=rank(P), and two idempotents are conjugate exactly when they have equal rank."
      proof: "For w, write w=Pw+(w-Pw); the first term is in im(P), the second in ker(P), and their intersection is zero. A basis adapted to this direct sum gives diag(I_r,0). Equal ranks give equal normal forms, while conjugation preserves rank."
      falsifier: "Two real idempotents of equal rank that are not GL-conjugate, or an idempotent whose image and kernel do not form a direct sum, would refute the theorem."
      audit_consequence: "Rank strata are exact algebraic conjugacy classes, not independently sourced occurrence sectors or physical propagation sectors."
    - result_id: "COR-PM-RT011-003-QUOTIENT-FIREWALL"
      result_type: "lemma"
      name: "Projector image-kernel-quotient availability lemma"
      hypotheses:
        - "P squared equals P on W."
      statement: "The restriction of P induces a canonical isomorphism W/ker(P) to im(P), while I-P projects onto ker(P). Thus image, kernel, complementary projector, quotient, and rank are algebraic consequences of admitting P even if no packet-local bridge names them."
      proof: "The first isomorphism theorem gives W/ker(P) isomorphic to im(P). The identities P(I-P)=0, (I-P)P=0, and (I-P) squared equals I-P give the complementary projection."
      falsifier: "Failure of the induced quotient map to be bijective or failure of I-P to be idempotent would refute the lemma."
      audit_consequence: "The candidate firewall is sound only as a prohibition on semantic, response, frozen-route, and P4 use; it cannot assert literal algebraic absence."
    - result_id: "THM-PM-RT011-004-RANK-LOCAL-CONSTANCY"
      result_type: "theorem"
      name: "Smooth-idempotent rank local-constancy theorem"
      hypotheses:
        - "P is a continuous or smooth idempotent section over a source open O."
      statement: "rank(P_x)=trace(P_x) is locally constant and therefore constant on each connected component of O."
      proof: "An idempotent has minimal polynomial dividing t(t-1), so its eigenvalues are zero or one and rank equals trace. The trace is continuous while taking integer values from zero through six, hence is locally constant."
      falsifier: "A continuous path of idempotents whose rank changes would refute the theorem. A path through non-idempotents is outside the hypothesis and does not refute it."
      audit_consequence: "The printed null isolation is a disconnected projector-stratum fact, not norm-small dynamical or physical robustness."
    - result_id: "LEM-PM-RT011-005-INERT-CONSERVATIVITY"
      result_type: "lemma"
      name: "Inert zero-expansion model-conservativity lemma"
      hypotheses:
        - "Every old model has at least one zero-decoration expansion."
        - "The extension changes no old symbol, equation, coefficient, constraint, gauge rule, or lawful reduction."
      statement: "The extension is conservative for old-language sentences, but this alone does not establish semantic definitionality or unique expansion."
      proof: "If an old-language sentence has an old countermodel, the zero expansion is a countermodel of the extension. Hence no new old-language consequence arises. Existence of an expansion is weaker than unique definitional recovery of scientific semantics."
      falsifier: "An old model without an admissible expansion or a new axiom constraining old-language data invalidates conservativity."
      audit_consequence: "RT009's model-conservativity claim is correct under its explicit inertness hypothesis and supplies no occurrence-selection credit."

