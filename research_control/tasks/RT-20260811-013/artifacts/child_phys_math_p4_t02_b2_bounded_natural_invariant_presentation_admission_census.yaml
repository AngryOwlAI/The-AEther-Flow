new_mathematical_payload:
  payload_count: 5
  items:
    - payload_id: "PAYLOAD-RT013-PM-001"
      payload_type: "theorem"
      object_name: "missing-result-sort closure theorem"
      claim_status: "draft/control exact mathematics"
      statement: >-
        Let Sigma be a many-sorted signature with sort set S. If a requested sort a is not in S and
        no terminal or constructor has output a, then no Sigma-term of sort a is well formed. If a is
        conservatively adjoined as an empty-output sort, Term_a(Sigma) is empty at every depth.
      proof: >-
        A well-formed term is either a terminal of its result sort or is obtained by applying a
        constructor whose declared output is that sort. Both cases are absent for a. Structural
        induction therefore has no base or inductive case producing a. For Sigma_0 this applies to
        PresCand_src, AdmissionPredicate_src, and EqSrcArrow.
      decision_consequence: "The requested internal source admission object cannot be returned by this grammar."

    - payload_id: "PAYLOAD-RT013-PM-002"
      payload_type: "theorem"
      object_name: "exact depth-two raw census and completeness theorem"
      claim_status: "draft/control exact mathematics"
      statement: >-
        Under literal typed-AST equality, ordered binary and/or constructors, and height at most two,
        the cumulative sort counts are (1,1,2) at depth zero, (1,2,13) at depth one, and
        (1,2,357) at depth two; hence the exact total is 360.
      proof: >-
        At depth zero the four terminals give the stated counts. At depth one, Nat contains four and
        dim(Sub), while Bool has 2 constants + 1 eqNat term + 2 not terms + 4 and terms + 4 or terms
        =13. At depth two, SrcArena remains 1 and Nat remains 2, while Bool has
        2 + 2^2 + 13 + 13^2 + 13^2 =357. Constructor induction shows every well-typed term of height
        at most two appears, and literal AST equality prevents accidental cross-constructor collapse.
      exact_counts:
        src_arena_terms: 1
        nat_terms: 2
        bool_terms: 357
        all_terms: 360
        bool_terms_height_at_most_one: 13

    - payload_id: "PAYLOAD-RT013-PM-003"
      payload_type: "theorem"
      object_name: "dimension-four Boolean constant-collapse theorem"
      claim_status: "draft/control exact mathematics"
      statement: >-
        Every T_Bool term evaluates to a constant function on Red_4. The semantic kernel quotient of
        the 357 raw Bool terms has exactly two classes, constant false and constant true, and contains
        zero nonconstant presentation selectors.
      proof: >-
        Sub is the only source-dependent terminal, and it can enter a Boolean term only through dim.
        On Red_4, dim(Sub)=four=4, so every Nat subterm evaluates to 4. Structural induction through
        eqNat and the Boolean connectives makes every Bool evaluation independent of the reduct.
        The true and false terminals realize the two distinct constant classes, proving exactness.
      exact_counts:
        raw_bool_terms: 357
        semantic_bool_classes: 2
        nonconstant_bool_function_classes: 0

    - payload_id: "PAYLOAD-RT013-PM-004"
      payload_type: "countermodel"
      object_name: "paired same-reduct conservative presentation/admission expansions"
      claim_status: "draft/control exact countermodel"
      statement: >-
        Fix one Sigma_0 reduct B=(Sub,dim(Sub)=4). One conservative expansion has PresCand={p}; a
        second has PresCand={p0,p1}. A separate pair keeps PresCand={p} but assigns Adm(p)=true and
        Adm(p)=false. Every pair has the same B reduct but incompatible extension data.
      proof: >-
        Forgetting the newly adjoined sort and predicate returns exactly B in every case. Cardinality
        distinguishes the first pair, and the predicate truth value distinguishes the second. Hence
        neither presentation cardinality nor admission truth factors through the current reduct.
      decision_consequence: "The current signature does not uniquely determine a presentation/admission completion."

    - payload_id: "PAYLOAD-RT013-PM-005"
      payload_type: "lemma"
      object_name: "identity-only naturality vacuity and swap countercontrol"
      claim_status: "draft/control exact mathematics"
      statement: >-
        Every objectwise term family is natural on the identity-only groupoid G_id. This does not
        imply naturality after adding a nonidentity arrow: on a two-element presentation orbit, the
        singleton indicator passes both identity squares but fails the swap square.
      proof: >-
        Naturality on an identity arrow is Eval=Eval. For the swap s(0)=1 and s(1)=0, the indicator
        chi(0)=true, chi(1)=false would require chi(0)=chi(s(0)), which is false. Thus identity-only
        coverage has zero power to certify nonidentity covariance.
      decision_consequence: "No physical or source EqSrc covariance follows from the declared identity checks."

