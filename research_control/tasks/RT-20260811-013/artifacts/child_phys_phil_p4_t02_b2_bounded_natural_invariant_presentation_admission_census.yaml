      scope: "the frozen current-signature grammar; not every possible future extension"
      falsifier: "A canonical current-source typing rule or constructor whose codomain is PresCand_src or AdmissionPredicate_src, with a complete registered-source derivation, would falsify this obstruction and move the burden to enumeration, nontriviality, and naturality."
    - payload_id: "NMP-RT013-PHIL-002"
      payload_type: "theorem_with_hypotheses_and_proof"
      name: "closed-Boolean constant-collapse theorem"
      formal_statement: "On Red_cur, every closed Bool term of Gram_2 is constant across reducts. Both truth values occur among the 357 terms, but no term distinguishes two current reducts or presentation candidates."
      proof: "The only SrcArena term is Sub. The only Nat terms are four and dim(Sub), and both evaluate to 4 on every reduct in Red_cur. Every eqNat atom is therefore a constant truth value. Boolean terminals are constants and not, and, and or preserve constancy. Structural induction proves the claim for every closed Bool term, including all depth-two terms."
