      name: "missing-codomain type-formation theorem"
      formal_statement: "Let a typed term grammar have terminal types and constructor codomains contained in T={SrcArena,Nat,Bool}. Every derivable term has a type in T. Hence if PresCand_src, AdmissionPredicate_src, and function formation are absent from T and all constructor signatures, no term of type PresCand_src or AdmissionPredicate_src is derivable at any finite depth, in particular at depth two."
