      scope: "closed terms in Gram_2 over reducts constrained by dim(Sub)=4"
      falsifier: "One frozen-grammar Bool term with different values on two valid Red_cur reducts would falsify the theorem."
    - payload_id: "NMP-RT013-PHIL-003"
      payload_type: "countermodel_or_obstruction"
      name: "same-reduct conservative admission expansions"
      formal_statement: "Fix any current source reduct R. Expansion E_false adds one presentation p, its identity arrow, and Admit(p)=false. Expansion E_true adds the same presentation and identity arrow with Admit(p)=true. Both have identical Sigma_cur reduct R and satisfy identity-category laws, but disagree on admission. A second pair may use one versus two presentation objects to show category-formation nonselection."
