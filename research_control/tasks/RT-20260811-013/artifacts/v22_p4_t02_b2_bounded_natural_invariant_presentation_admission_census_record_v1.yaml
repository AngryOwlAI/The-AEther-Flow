theorems:
  - theorem_id: "THM-01"
    name: "Bounded typed enumeration completeness"
    statement: "The recurrence S_d=1, N_d=1+S_(d-1), B_d=2+N_(d-1)^2+B_(d-1)+2*B_(d-1)^2 enumerates every well-typed structural term of height at most d. At d=2 the counts are S_2=1, N_2=2, B_2=357."
    proof: "Induct on term height. Every terminal is counted at height zero. The last constructor of a nonterminal term uniquely determines its output type and an ordered tuple of lower-height typed arguments; the recurrence contains exactly those tuples. Literal typed AST equality makes the decomposition injective."
  - theorem_id: "THM-02"
    name: "Empty admission-codomain typing theorem"
    statement: "If a typed signature has neither a type P nor any constructor with codomain P, then its initial term algebra contains no closed term of type P. Hence this grammar contains no PresCand_src or AdmissionPredicate_src term."
    proof: "Structural induction. Terminals have only the three declared types. Each constructor has codomain Nat or Bool. No induction case produces P."
  - theorem_id: "THM-03"
    name: "Constant closed-Bool census"
    statement: "Every one of the 357 Bool terms has the same value on every reduct in the declared class."
    proof: "The only reduct-dependent terminal is Sub, and the only constructor consuming it is dim. The reduct axiom fixes dim(Sub)=4. Every later Nat and Bool evaluation therefore depends only on 4 and the fixed truth tables."
  - theorem_id: "THM-04"
    name: "Identity-only naturality limitation"
    statement: "Every term commutes with declared identity controls, but this supplies no theorem for a nonidentity EqSrc arrow because the current signature has no EqSrcArrow type."
    proof: "Identity transport preserves every value by definition. A nonidentity naturality square cannot be formed without an arrow object and source and target transport maps."
  - theorem_id: "THM-05"
    name: "Conservative-extension nonselection"
    statement: "The same current reduct admits a one-presentation identity extension and a two-presentation swap extension. Their presentation-cardinality outputs differ, so the current reduct cannot select between them without extra extension data."
    proof: "Forget the added presentation sorts and arrows in each finite extension. Both forgetful images are the identical carrier Sub with dimension four, while the added sorts have cardinalities one and two."
  - theorem_id: "THM-06"
    name: "Affine translation control"
    statement: "For the separately declared affine R4 control, no point is fixed by every translation."
    proof: "For any point x choose a nonzero translation v; then x+v is not x. This control is not promoted to a theorem about an arbitrary smooth source manifold."

