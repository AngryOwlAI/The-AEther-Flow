new_mathematical_payload:
  payload_count: 7
  genuinely_new_payload_count: 4
  items:
    - payload_id: "NMP-RT001-PM-001"
      payload_type: "theorem"
      name: "Ambient C1 non-neighborhood theorem for the integrable proposal domain"
      genuinely_new_in_rt001: true
      statement: "On every fixed compact coordinate box K in R4, the proposal line L0=span(dx0) has arbitrarily C1-close nowhere-zero projective line fields that are not locally conormal to any codimension-one foliation."
      proof:
        - "Let alpha_epsilon=dx0+epsilon*x1*dx2. Its dx0 coefficient is one, so it is nowhere zero for every epsilon."
        - "The standard coordinate C1 norm of alpha_epsilon-dx0 on K is bounded by abs(epsilon) times the sum of one and sup_K abs(x1), and hence tends to zero with epsilon. Projectivization is smooth near the nonzero dx0 coefficient, so the line fields converge in C1."
