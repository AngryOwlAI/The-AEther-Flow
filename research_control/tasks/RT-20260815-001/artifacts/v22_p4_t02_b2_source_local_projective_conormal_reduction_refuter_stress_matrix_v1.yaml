stress_branches:
  - branch_id: "STRESS-01-INTEGRABILITY-DOMAIN"
    dimension_id: "integrability_domain_and_arbitrarily_small_nonfrobenius_variation"
    input: "L_0=Span(dx0), alpha_epsilon=dx0+epsilon*x1*dx2, and beta_epsilon=d(x0+epsilon*x1*x2) on a fixed compact chart."
    exact_result: "alpha_epsilon wedge d alpha_epsilon equals epsilon dx0 wedge dx1 wedge dx2 and is nonzero for every epsilon!=0, while beta_epsilon is exact. Both converge to dx0 in C1 as epsilon tends to zero."
    disposition: "candidate_domain_has_no_ambient_c1_protection_at_fixture"
  - branch_id: "STRESS-02-ARROW-GROUPOID-CLOSURE"
    dimension_id: "output_relative_arrow_groupoid_closure_and_nonprobative_naturality"
    input: "Proposal arrows f and g satisfying f^*L_2=L_1 and g^*L_3=L_2."
    exact_result: "Identities, inverses, and compositions preserve the defining line equation, so the declared proposal arrows form a valid groupoid."
    disposition: "conditional_groupoid_mathematics_preserved"
  - branch_id: "STRESS-03-ARROW-ADMISSIBILITY-FORCE"
    dimension_id: "output_relative_arrow_groupoid_closure_and_nonprobative_naturality"
    input: "Naturality of Bridge_PCR on the line-preserving proposal groupoid."
    exact_result: "The line-component naturality equation is identical to the arrow predicate; a full-source diffeomorphism moving the line is excluded only after the output line is supplied."
    disposition: "no_independent_eqsrc_or_admissibility_force"
  - branch_id: "STRESS-04-PROPOSAL-QUOTIENT"
    dimension_id: "proposal_isomorphism_quotient_and_strict_identity_over_m_scope"
    input: "Constant lines Span(dx0) and Span(dx0+dx1) on the same R4 source reduct."
    exact_result: "They differ over id_M, but a determinant-one shear transports the first to the second; more generally GL+(4) is transitive on projective covector lines."
    disposition: "strict_fixture_separation_collapses_on_constant_line_proposal_quotient"
  - branch_id: "STRESS-05-NATURAL-LINE-SELECTION"
    dimension_id: "bare_source_natural_selection_nonuniqueness"
    input: "Bare SmoothMan_4 with all source diffeomorphisms."
    exact_result: "At the origin of R4, GL+(4) moves every projective covector line, so no all-diffeomorphism-natural line section exists."
    disposition: "current_source_selector_absent"
  - branch_id: "STRESS-06-COORIENTATION"
    dimension_id: "coorientation_positive_ray_and_time_orientation_loss"
    input: "The line stabilizer H and its positive-multiplier subgroup H_plus."
    exact_result: "The multiplier-sign map H to {+1,-1} has kernel H_plus and index two; diag(-1,-1,1,1) has positive determinant, preserves Span(dx0), and flips its ray."
    disposition: "projective_output_selects_no_positive_ray_or_time_orientation"
  - branch_id: "STRESS-07-SAME-REDUCT-SCOPE"
    dimension_id: "same_reduct_nonfactorization_and_realization_scope"
    input: "Two enriched proposals over identical bare R4 and frozen K_star reducts."
    exact_result: "Extra line data changes strict Bridge_PCR output, but K_star equality and strict inequality neither select occurrence nor establish proposal-isomorphism or physical inequivalence."
    disposition: "nonfactorization_is_strict_embedded_only"
  - branch_id: "STRESS-08-CONFORMAL-LIFT"
    dimension_id: "line_only_lorentz_conformal_lift_obstruction"
    input: "G/H=P(V*) with dim(H)=13 and Lorentz-conformal target G/CO(1,3) with dim(CO(1,3))=7."
    exact_result: "A G-equivariant homogeneous-space map would require H inside a conjugate of CO(1,3), which dimension forbids. The family diag(-1,a,b,c), a,b,c>0, supplies infinitely many nonconformal completions sharing the same line."
    disposition: "line_only_lorentz_conformal_lift_obstructed"
  - branch_id: "STRESS-09-FINITE-VARIATION-SELECTION"
    dimension_id: "finite_variation_conditioning_and_admissible_domain_selection"
    input: "Ambient C1 line-field variations versus the coherent exact-label subdomain."
    exact_result: "Every ambient C1 neighborhood at the fixture contains admissible exact-label and inadmissible non-Frobenius lines. Excluding the latter requires an additional source-side admissible-variation law."
    disposition: "robustness_is_domain_relative_and_domain_selection_remains_missing"
  - branch_id: "STRESS-10-AUTHORITY-BOUNDARY"
    dimension_id: "physical_empirical_p4_and_workflow_authority_boundary"
    input: "All exact conditional theorems, model checks, source hashes, compilation, registries, and workflow receipts."
    exact_result: "None supplies current-ontology provenance, empirical response, physical causality, P4 acceptance, adoption, Gate authority, or Distance-to-GR progress."
    disposition: "all_downstream_claim_and_workflow_locks_preserved"

