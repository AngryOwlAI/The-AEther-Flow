new_mathematical_and_conceptual_payload:
  payload_count: 5
  payloads:
    - payload_id: "NMP-RT001-PHIL-001"
      payload_type: "local_empty_interior_theorem"
      name: "Foliation-presentable projective conormals have no ambient C1 neighborhood at the standard local model"
      assumptions: "Work on a fixed compact coordinate ball in a smooth four-manifold with the admitted local presentation q_0=x0."
      statement: "Every ambient C1 neighborhood of L_0=span(dx0) contains a smooth nonvanishing projective covector-line field whose kernel is not Frobenius integrable and therefore is not locally of the form span(dq)."
      proof: "Use alpha_epsilon=dx0+epsilon*x1*dx2. Its C1 distance from dx0 is O(abs(epsilon)) on the ball, it stays nonzero for small epsilon, and alpha_epsilon wedge d(alpha_epsilon)=epsilon*dx0 wedge dx1 wedge dx2 is nonzero for every epsilon not equal to zero."
      falsifier: "Produce an ambient C1 neighborhood of L_0 containing only Frobenius-integrable projective lines, or show the displayed three-form vanishes for all sufficiently small nonzero epsilon."
      novelty_relative_to_rt006: "RT006 supplied one off-domain family as an audit boundary; this theorem states and proves the topological empty-neighborhood consequence used by the freeze decision."
      scope_limit: "The theorem does not refute openness inside coherently perturbed q-presentations and is local rather than a global topology claim."
    - payload_id: "NMP-RT001-PHIL-002"
      payload_type: "proposal_orbit_collapse_theorem"
      name: "The constant-line strict nonfactorization family collapses on the proposal-isomorphism quotient"
      assumptions: "Consider all linear submersions q_a on R4 with nonzero constant covector a and proposal arrows containing determinant-positive linear diffeomorphisms that transport the descended line."
      statement: "The strict outputs L_a vary over projective covector space while all proposal objects lie in one GL_plus isomorphism orbit; hence this entire family gives no nonconstant quotient-level bridge witness."
      proof: "GL_plus(4,R) acts transitively on projective nonzero covectors. For every a and b, choose an orientation-preserving linear map whose pullback sends span(b) to span(a). It is an admitted proposal isomorphism, while frozen K_star remains constant after forgetting q."
      falsifier: "Exhibit two nonzero constant covector lines in different GL_plus orbits or a proposal-isomorphism invariant of the fixed construction that separates them."
      novelty_relative_to_rt006: "RT006 noted that the A/B pair is isomorphic; this result classifies the full constant-line witness family as a single quotient orbit."
      scope_limit: "The theorem does not claim every nonlinear or globally topologically distinct foliation proposal is isomorphic."
    - payload_id: "NMP-RT001-PHIL-003"
      payload_type: "proposal_automorphism_fixed_data_obstruction"
      name: "A projective-conormal proposal object has no automorphism-natural coorientation or Lorentzian conformal lift"
      assumptions: "At the homogeneous object R4 with L_0=span(dx0), require any assigned ray or conformal class to be natural under every determinant-positive line-preserving linear proposal automorphism."
      statement: "No positive ray in L_0 and no Lorentzian conformal class is invariant under the full proposal automorphism group H_plus."
      proof: "The element diag(-1,-1,1,1) reverses the ray and lies in H_plus. If a Lorentzian conformal class were invariant, H_plus of dimension thirteen would lie in its conjugate CO(1,3) stabilizer of dimension seven, which is impossible."
      falsifier: "Exhibit an H_plus-invariant positive ray or Lorentzian conformal class, or independently reduce the pre-output automorphism group with new source data."
      novelty_relative_to_rt006: "This combines orientation erasure and conformal-lift underdetermination into one quotient-descent obstruction controlled by the actual proposal automorphism group."
      scope_limit: "Additional independently source-derived coorientation or tensor structure can define a smaller automorphism group and is not forbidden."
    - payload_id: "NMP-RT001-PHIL-004"
      payload_type: "typed_robustness_domain_discriminator"
      name: "Coherent-label openness and ambient line-field robustness are logically compatible but inequivalent"
      assumptions: "Distinguish the C1 topology on submersion label presentations from the ambient C1 topology on nonvanishing projective covector-line fields."
      statement: "The fixed rank-margin theorem proves openness only in the first typed domain; the local empty-neighborhood theorem denies a corresponding open neighborhood in the second. Neither statement contradicts the other."
      proof: "Every coherently varied q_epsilon gives the closed representative dq_epsilon and hence an integrable kernel, whereas alpha_epsilon is a valid ambient line representative but is not a differential-line presentation. The quantifier domains differ."
      falsifier: "An exact equivalence between all sufficiently close ambient line variations and coherent differentials dq_epsilon would collapse the distinction."
      novelty_relative_to_rt006: "The discriminator turns the audit qualifier into a formal type boundary that prevents a false theorem conflict."
      scope_limit: "It assigns no physical topology or admissibility measure."
    - payload_id: "NMP-RT001-PHIL-005"
      payload_type: "realization_nonidentifiability_lemma"
      name: "Strict q-dependence supplies no realization selector"
      assumptions: "The bridge is evaluated on proposal data q, frozen K_star depends only on the forgotten smooth arena, and proposal occurrence weights or a source selection law are absent."
      statement: "Nonfactorization through frozen K_star proves only that bridge output depends on added q-data; it cannot identify which q-orbit occurs or assign physical inequivalence, probability, or empirical distinguishability."
      proof: "The q_a family has constant forgotten reduct, varying strict output, one proposal-isomorphism orbit, and no occurrence map in the candidate signature. Dependence therefore does not entail realization selection."
      falsifier: "Add an independently source-derived occurrence or probability map on proposal-isomorphism classes and a quotient-level operational discriminator."
      novelty_relative_to_rt006: "The lemma explicitly separates functional dependence, quotient classification, and ontological realization."
      scope_limit: "It does not deny that a future source law can select or probabilistically weight richer proposal classes."

