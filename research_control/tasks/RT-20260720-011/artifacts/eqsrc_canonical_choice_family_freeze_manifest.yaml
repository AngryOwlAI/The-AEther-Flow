reopening_criteria:
  - criterion_id: "REOPEN-EQSRC-CURRENT-ONTOLOGY-DERIVATION-001"
    qualification_class: "current_ontology_derivation"
    evidence_required: "A tracked proof derives the decisive selector and its morphism and variation behavior from registered current ontology without added primitives or target import."
    opens: "only the exact family whose missing selector is derived"
  - criterion_id: "REOPEN-EQSRC-GENERAL-SELECTOR-THEOREM-002"
    qualification_class: "general_theorem"
    evidence_required: "A tracked proposal-neutral theorem establishes existence, uniqueness, naturality, fixed-point, or obstruction conditions for the relevant selector class and maps the exact family to those hypotheses."
    opens: "a theorem-directed audit or construction packet, not automatic family adoption"
  - criterion_id: "REOPEN-EQSRC-PHYSICAL-IRRELEVANCE-003"
    qualification_class: "physical_irrelevance_theorem"
    evidence_required: "A tracked source-side theorem proves that every admissible choice yields the same declared physical observable or equivalence class under independently justified physical morphisms."
    opens: "only the family and observable covered by the theorem"
  - criterion_id: "REOPEN-EQSRC-MATERIAL-LEDGER-DELTA-004"
    qualification_class: "material_ledger_delta"
    evidence_required: "A separately authorized tracked result changes the active derivation burden in an independently validated way; validator or task-count changes do not qualify."
    opens: "only the route named by the authoritative changed burden"
  - criterion_id: "REOPEN-EQSRC-PROTECTED-ONTOLOGY-AUTHORITY-005"
    qualification_class: "human_gate"
    evidence_required: "Explicit protected human Gate Chair authority names the exact ontology proposal and scope."
    opens: "only the authorized protected decision; no implicit promotion"
