formal_findings:
  - finding_id: "FM-EQSRC-CLOSURE-V2-001"
    severity: "resolved_from_v1"
    subject: "accepted_totality"
    observation: "V2 explicitly asserts an accepted identity for every object, an accepted inverse for every accepted certificate, and an accepted composite for every composable accepted pair."
    consequence: "The finite countermodels used against v1 no longer satisfy the v2 accepted-totality clauses. OBST-EQSRC-CLOSURE-TOTALITY-001 is repaired at statement level."
  - finding_id: "FM-EQSRC-CLOSURE-V2-002"
    severity: "nonblocking_for_relation_theorem"
    subject: "conditional_equivalence_proof"
    observation: "Reflexivity follows from accepted identity existence, symmetry from accepted inverse existence, and transitivity from accepted composition existence."
    consequence: "No unit inverse associativity or component-congruence premise is needed for the relation-level equivalence theorem. Those clauses concern coherence of chosen certificate operations."
  - finding_id: "FM-EQSRC-CLOSURE-V2-003"
    severity: "blocking_for_closed_signature_claim"
    subject: "proxy_constructor_declarations"
    observation: "The displayed Sigma_src contains F_src Lambda_src P_src N_src Pi0_src LedgerOK ProxyOK and NegPass, but not typed symbols for p_id,A p_inv(w) or p_comp(v,w). The law later uses all three as terms."
    consequence: "Read literally, the totality clauses are not formulas in the declared signature. Their truth depends on undeclared expansion data. If the symbols are intended merely as existential proxy variables, the quantifiers and scopes must be written explicitly and the later coherence clauses must bind compatible selections."
  - finding_id: "FM-EQSRC-CLOSURE-V2-004"
    severity: "blocking_for_closed_congruence_claim"
    subject: "component_congruences"
    observation: "Sigma_src declares ledger congruence equiv_L, but certificate congruence also invokes declared congruences for proxy-incidence data negative-control outcomes and provenance terms without declaring those relations or specifying that literal equality is intended."
    consequence: "The certificate congruence clause is underdetermined by Sigma_src, even though it is not needed for the three equivalence-relation axioms."
  - finding_id: "FM-EQSRC-CLOSURE-V2-005"
    severity: "blocking_for_non_circular_acceptance_audit"
    subject: "decision_predicate_dependency"
    observation: "NegPass_n is used on a certificate w before its exact typed domain and dependency order are declared. The no-target list forbids target and process definitions but does not expressly forbid NegPass_n from depending on Accept_src or on the existence of closure witnesses."
    consequence: "A source-only but circular implementation is not syntactically excluded. A well-founded dependency rule or primitive-relation declaration independent of Accept_src and the closure law is required."
  - finding_id: "FM-EQSRC-CLOSURE-V2-006"
    severity: "supporting"
    subject: "least_grammar_scope"
    observation: "The least-constructor condition closes Pi_src provenance terms only. P_src remains an arbitrary declared domain and the proxy witness operations are not generated by an analogous least grammar."
    consequence: "The provenance repair is sound in its stated scope but does not justify the broader claim closed_and_target_free_by_construction for every certificate component."
  - finding_id: "FM-EQSRC-CLOSURE-V2-007"
    severity: "pass"
    subject: "process_authority"
    observation: "No target atlas metric reconstruction detector benchmark registry role validator generated derivative handoff checkpoint or approval status appears as a mathematical premise."
    consequence: "No explicit target-GR import or process-authority laundering is detected in the text."

minimal_formal_witness:
  witness_id: "MODEL-EXPANSION-EQSRC-CLOSURE-V2-SIGNATURE-001"
  witness_type: "same_declared_signature_nonunique_undeclared_expansions"
  purpose: "Show that the truth of the accepted identity clause is not determined by the displayed Sigma_src."
  declared_signature_interpretation:
    objects:
      - "A"
    ledger_domain:
      - "e_A"
    proxy_domain:
      - "p_plus"
      - "p_minus"
    negative_controls: []
    base_provenance: []
    provenance_terms:
      - "id[A]"
    predicate_values:
      - "LedgerOK_AA(e_A) = true"
      - "ProxyOK_AA(p_plus) = true"
      - "ProxyOK_AA(p_minus) = false"
    certificates: "All well-typed tuples (A,A,e_A,p,id[A]) for p in P_src."
  expansion_plus:
    added_undeclared_assignment: "p_id,A = p_plus"
    result: "The distinguished identity tuple passes the explicit acceptance conjunction."
  expansion_minus:
    added_undeclared_assignment: "p_id,A = p_minus"
    result: "The distinguished identity tuple fails ProxyOK and therefore is blocked."
  conclusion: "The two expansions agree on every displayed Sigma_src component but disagree on the identity-totality clause. Thus p_id,A is substantive undeclared structure, not notation fixed by the declared signature. Analogous two-expansion witnesses apply to p_inv and p_comp."
  target_data_used: false
  process_authority_used: false

minimal_circularity_witness:
  witness_id: "DEPENDENCY-EQSRC-CLOSURE-V2-ACCEPT-001"
  witness_type: "source_only_unexcluded_definition_cycle"
  setup:
    - "Take one well-typed certificate w for which LedgerOK ProxyOK and provenance membership all pass."
    - "Take N_src = {n}."
    - "Define the otherwise unconstrained source decision predicate by NegPass_n(w) iff not Accept_src(w)."
  induced_equation: "Accept_src(w) iff not Accept_src(w)"
  conclusion: "The no-target and no-process clauses alone do not make acceptance well founded. This is not a model of a repaired primitive-predicate semantics; it is a minimal dependency witness showing the missing syntactic guard."
  target_data_used: false
  process_authority_used: false

