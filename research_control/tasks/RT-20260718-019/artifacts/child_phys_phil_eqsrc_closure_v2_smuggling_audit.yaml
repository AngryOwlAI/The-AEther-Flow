  status: "source_only_semantic_ambiguity_witness"
  construction:
    - "Take one source object A one ledger label e_A one proxy datum p and provenance term id[A]."
    - "Let the typing LedgerOK and ProxyOK conjuncts be true for the identity tuple."
    - "Use one negative control n and define NegPass_n(1_A) if and only if Accept_src(1_A)."
    - "Then the displayed acceptance biconditional reduces to Accept_src(1_A) if and only if Accept_src(1_A), so the acceptance definition alone does not determine a truth value."
  interpretation: "The witness uses no target atlas metric detector benchmark registry role validator approval handoff checkpoint or generated derivative. It shows that source-labelled domains alone do not establish well-founded acceptance."
  limit: "The v2 law separately demands that the identity be accepted, so the witness does not refute the conditional equivalence theorem. It isolates the missing non-circularity condition in the claimed closed grammar."
