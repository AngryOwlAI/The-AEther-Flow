new_mathematical_payload:
  payload_count: 4
  items:
    - payload_id: "NMP-RT012-PHIL-001"
      payload_type: "theorem"
      name: "orbit-quotient admission factorization theorem"
      formal_statement: >-
        Let a groupoid G act on a set P and let q:P->P/G be the orbit map. A binary predicate
        a:P->{0,1} is G-invariant if and only if there is a unique predicate bar_a:P/G->{0,1}
        with a=bar_a o q. Consequently a nonconstant invariant admission predicate exists only if
        the permitted source-definable Boolean algebra on P/G contains a nontrivial subset.
      proof: >-
        If a is invariant, define bar_a([p])=a(p). Invariance makes this independent of the orbit
        representative, and surjectivity of q gives uniqueness. Conversely every composite with q
        is constant on each orbit. Nonconstancy is therefore exactly nontriviality of the selected
        union of orbits, with definability imposing the additional source-language restriction.
      decision_consequence: >-
        The future packet can reduce admission search to source-definable subsets of a bounded orbit
        quotient and can return a precise obstruction if that Boolean algebra is trivial.
      scope: "exact for the declared bounded action; no claim about unenumerated terms, arrows, or extensions"
      falsifier: >-
        An explicit L_cur-derived nonconstant predicate on Q_N, with a complete derivation tree and
        naturality proof, falsifies the null-census obstruction and triggers the construction branch.
    - payload_id: "NMP-RT012-PHIL-002"
      payload_type: "lemma"
      name: "reduct-fibre factorization guard"
      formal_statement: >-
        For U:E->R and S:E->Y, there is a unique map bar_S:im(U)->Y with S=bar_S o U' exactly when
        S is constant on every fibre of U, where U' has codomain im(U). If U is surjective, bar_S is
        the unique factor on R.
      proof: >-
        A factor is constant on fibres by equality of U-values. Conversely define bar_S(U(e))=S(e);
        fibre constancy makes the definition well defined, and the image restriction gives existence
        and uniqueness without assuming U is surjective onto all of R.
      decision_consequence: "Retains Route A as an exact guard without selecting it as the successor."
      falsifier: "One pair e1,e2 with U(e1)=U(e2) and S(e1)!=S(e2) refutes factorization."
    - payload_id: "NMP-RT012-PHIL-003"
      payload_type: "countermodel"
      name: "transitive-swap nonselection control"
      formal_statement: >-
        Let P={p0,p1} and let C2 act transitively by swapping p0 and p1. Every invariant binary
        predicate is constant, so neither singleton is naturally admissible. Under the identity-only
        action the two singleton predicates become invariant, showing that nonselection depends on
        the declared action and cannot be globalized.
      proof: "Swap invariance gives a(p0)=a(p1); for the identity action there is no cross-point equality constraint."
      decision_consequence: "Makes the transformation-class dependence of every negative census literal."
      falsifier: "A nonconstant predicate satisfying swap invariance would falsify the control."
    - payload_id: "NMP-RT012-PHIL-004"
      payload_type: "conceptual_separator"
      name: "naturality-without-ontology lemma"
      formal_statement: >-
        Naturality of a term relative to a stipulated test groupoid establishes only conditional
        covariance. It does not establish that the current ontology derives the groupoid, treats it
        as physical gauge, or adopts the term as an admission primitive.
      proof: >-
        Naturality is a relation among supplied objects, arrows, and values. Source derivation is a
        separate relation from canonical premises to those objects and arrows. Models may agree on
        the canonical reduct while supplying different groupoids, so the former relation does not
        entail the latter.
      decision_consequence: "Prevents a successful mathematical census fixture from erasing the RT011 provenance obstruction."
      falsifier: "A canonical source theorem uniquely deriving G_N and its action would remove this specific provenance gap."

