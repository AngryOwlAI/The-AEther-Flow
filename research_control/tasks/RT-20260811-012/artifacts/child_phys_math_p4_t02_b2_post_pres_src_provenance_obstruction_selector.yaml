new_mathematical_payload:
  payload_count: 5
  items:
    - payload_id: "PAYLOAD-RT012-PM-001"
      payload_type: "theorem"
      object_name: "forgetful-map fibre-factorization theorem"
      claim_status: "draft/control exact mathematics"
      statement: >-
        Let U:E->R and S:E->Y be set maps. There is a unique map S_bar:im(U)->Y with
        S=S_bar composed with U exactly when S is constant on every nonempty fibre U^{-1}(r).
        If U is surjective, im(U)=R and the factor on all of R is unique. Without surjectivity,
        fibre constancy determines only the factor on im(U); values on R\im(U) are additional data.
      proof: >-
        Any factorization makes S(e)=S_bar(U(e)), so equal U-values force equal S-values. Conversely,
        if S is fibre-constant, define S_bar(U(e))=S(e). Fibre constancy makes this definition
        independent of the representative and it is visibly the unique factor on im(U). Surjectivity
        identifies im(U) with R. When U is not surjective, the factorization equation constrains no
        value outside im(U), so ambient extensions are not unique whenever the codomain permits more
        than one choice.
      exact_rt011_witness: >-
        U(one_root)=U(two_root)=B_src while the requested completion outputs have cardinalities one
        and two. Therefore root-cardinality and root-isomorphism-class selectors do not factor through
        the current reduct.
      decision_limit: >-
        This proves irrelevance of reduct-only data to the displayed expansion-dependent output. It
        does not prove P4-T02 irrelevance of every future source extension or select an admission law.

    - payload_id: "PAYLOAD-RT012-PM-002"
      payload_type: "theorem"
      object_name: "affine translation nonselection control"
      claim_status: "draft/control exact scoped mathematics"
      statement: >-
        Under the full translation action T_a(x)=x+a on affine R^4, no point and no nonempty finite
        subset is invariant under every translation. Consequently, a point or finite-subset selector
        natural under all translations cannot be constructed from bare affine R^4 data alone.
      proof: >-
        A fixed point x would satisfy x+a=x for every a, contradicted by any nonzero a. If a nonempty
        subset F is invariant, choose x in F. For every y in R^4 take a=y-x; invariance gives
        y=T_a(x) in F. Thus F=R^4 and is not finite. Equivalently, for a finite F an integer
        translation longer than its first-coordinate range sends F to a different set.
      exact_scope: >-
        This is only an affine-R^4 symmetry control. Extra source fields or other independently
        derived structure may break the translation symmetry and permit a selector; no global
        source-extension impossibility follows.

    - payload_id: "PAYLOAD-RT012-PM-003"
      payload_type: "theorem"
      object_name: "finite typed grammar termination theorem"
      claim_status: "draft/control exact mathematics"
      statement: >-
        Fix finitely many types, a finite typed variable alphabet, finitely many typed constants,
        finitely many finite-arity constructors, and a finite maximum term depth d. Then the set of
        well-typed terms of depth at most d is finite and can be exhaustively enumerated. Quotienting
        by any declared equations cannot increase its cardinality.
      proof: >-
        At depth zero only the finite variables and constants occur. Inductively, if each typed term
        set through depth n is finite, every finite-arity constructor receives arguments from finite
        products of those sets; a finite union over constructors and output types remains finite.
        Induction through d proves termination. Any quotient is the image of this finite set and is
        therefore finite.
      exact_boolean_fixture: >-
        Starting with TRUE, FALSE, SRC_ATOM and closing under NOT and commutative AND to cumulative
        depths zero, one, and two yields exactly 3, 12, and 93 distinct syntax terms.
      completeness_boundary: >-
        Exhaustiveness is relative only to the declared signature, constants, constructor grammar,
        equations, variables, and depth. It does not cover arbitrary real parameters, unbounded
        formulas, all natural transformations, or future source extensions. Enumeration termination
        also does not make semantic naturality proof automatically decidable.

    - payload_id: "PAYLOAD-RT012-PM-004"
      payload_type: "lemma"
      object_name: "finite census construction-or-obstruction dichotomy"
      claim_status: "draft/control exact mathematics"
      statement: >-
        Let T be the finite enumerated term set, and suppose every t in T receives a complete exact
        certificate for source typing, naturality, source provenance, admission separation, and
        frozen-route independence. Let W be the subset passing all five predicates. Then either W is
        nonempty and the first term under a predeclared total order is a bounded witness, or W is empty
        and the collection of failure certificates is a complete obstruction relative to T.
      proof: >-
        Finiteness makes the predeclared order attain a least element on every nonempty subset. If W
        is empty, universal failure over T follows from the complete per-term classification. These
        two cases are exhaustive and disjoint. The negative case quantifies only over T, so it is
        grammar-relative rather than global.
      decision_consequence: >-
        The selected packet must return exactly one source-natural admission witness or one
        grammar-relative symmetry obstruction; an obligations list or inconclusive census is invalid.

    - payload_id: "PAYLOAD-RT012-PM-005"
      payload_type: "definition"
      object_name: "constructive material-separation criterion"
      claim_status: "draft/control selector definition"
      definition: >-
        A proposed admission witness A is materially separated only if its carrier, operations,
        control arrows, evaluation, and covariance are fixed before CompleteRoot, G_src, kappa,
        RobInv, P4-T02 success, target geometry, empirical response, and all six frozen classifiers;
        every dependency has a source-provenance certificate; and either typed-domain independence or
        an exact same-frozen-output/different-A pair blocks factorization through each frozen route.
      exact_failure: >-
        Merely renaming AdmPres_src, defining admission by a desired pass set, or using a frozen
        diagnostic as an atom fails the criterion and is route replay.

