  selected_next_role_family: "ontology-formalizer@0.2.0"
  decision_basis: "Both independent child perspectives and the parent select the only route that is constructive without stipulating a new primitive: a predeclared finite typed census over the exact current registered source signature. Route A is retained as a factorization guard but repeats RT011 if executed alone; Route B lacks a source-prior carrier and risks renamed replay; Route D is premature while a bounded nonpromotional calculation remains available."
