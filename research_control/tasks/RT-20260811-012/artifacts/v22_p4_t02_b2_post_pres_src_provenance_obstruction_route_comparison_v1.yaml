exact_mathematical_controls:
  fibre_factorization_theorem:
    statement: "For maps U:E->R and F:E->Y, there exists a unique map F_bar:im(U)->Y with F=F_bar composed with U exactly when F is constant on every nonempty fibre of U. If U is surjective, F_bar is unique on all R; without surjectivity, values outside im(U) remain unconstrained."
    proof: "Fibre constancy makes F_bar(U(e))=F(e) well-defined and unique on im(U). Conversely any factorization is constant on each fibre. Surjectivity identifies im(U) with R; otherwise arbitrary codomain choices may extend F_bar off the image."
    selector_use: "retained_guard_inside_route_C_not_a_standalone_global_irrelevance_claim"
  affine_translation_control:
    statement: "No nonempty finite subset of affine R^4 is invariant under every translation; in particular no point is translation invariant."
    proof: "For a finite nonempty set A and a nonzero translation vector v, invariance under all translations would contain a+n v for every integer n for any a in A, contradicting finiteness."
    scope: "affine_R4_translation_action_only"
  bounded_grammar_termination:
    statement: "A finite typed terminal set, finitely many finite-arity constructors, and a fixed finite depth produce only finitely many well-typed terms; exhaustive enumeration terminates and is complete relative to that declared grammar and depth."
    proof: "Induct on depth. The depth-zero set is finite. Applying finitely many finite-arity constructors to a finite prior set gives a finite next set; finite union preserves finiteness. The constructor induction also gives relative enumeration completeness."
    exact_fixture_counts: [3, 12, 93]
    limitation: "Completeness is grammar-relative; it says nothing about excluded terminals, constructors, depths, parameter families, or future source extensions."

