  - payload_id: "PAYLOAD-RT006-PHIL-PROVENANCE-ORDER-NONCIRCULARITY"
    payload_type: "lemma"
    object_name: "provenance-order noncircularity lemma"
    statement: "Let L be a law-state set, Q:L->Y a diagnostic, and G a desired subset of Y. If the admissible relation is defined after outcome inspection by R_G(l)={l' in L:Q(l') in G}, then the assertion that every admitted successor has diagnostic in G is true by definition and provides no evidence that tracked source premises select R_G."
    proof: "For every l and l' in R_G(l), membership in R_G(l) is exactly the proposition Q(l') in G. The claimed protection is therefore a definitional implication independent of any source dynamics. A different relation containing one l' with Q(l') outside G remains equally compatible until separate source premises exclude it."
    conceptual_meaning: "Outcome-filtered admissibility is goal-property preload, not a derived protection mechanism."
    sharp_falsifier_of_circularity_diagnosis: "Derive and freeze K_src, F_src, Delta_src, and tangent or polar structure from named source equations and equivalences before defining or evaluating the P4 diagnostic, then prove the protection theorem without adding success-filtered exclusions."
    claim_status: "draft/control"
    burden_effect: "narrows"
  - payload_id: "PAYLOAD-RT006-PHIL-ROBUST-TANGENCY-PROTECTION"
    payload_type: "lemma"
    object_name: "source robust-tangency protection lemma"
    statement: "Let K_src be a closed source-side admissible subset of a typed state space X_src, let F_src be a nominal source-law multifunction, and let Delta_src be an admissible perturbation multifunction. Under the declared existence and regularity hypotheses, if F_src(x)+Delta_src(x) is contained in the interior, or the explicitly justified relative interior, of the contingent tangent cone T_{K_src}(x) for every boundary state in the theorem domain, then every admitted perturbed trajectory starting in K_src remains in K_src on that domain."
    proof_status: "Future packet must state the exact viability or Nagumo-type hypotheses and prove the theorem; this child records the theorem shape, not its truth for any source model."
    conceptual_meaning: "Robust protection requires an independently justified admissible region and perturbation class. Covariance, a static token, or a coordinate barrier alone cannot supply them."
    sharp_falsifiers:
      - "One boundary state x and admitted v in F_src(x)+Delta_src(x) with v outside Int T_{K_src}(x) falsifies the strict tangency certificate."
      - "An empty or topology-dependent interior with no independently justified relative-interior replacement invalidates the stated certificate."
      - "One justified source-equivalence arrow under which K_src, F_src, Delta_src, or T_{K_src} fails to transport falsifies covariance."
      - "Evidence that K_src, Delta_src, a conormal, or an optional barrier was defined using desired P4 success invalidates the claim under the no-goal-preload boundary."
