  status_label: "proposal-only"
  material_class: "source-extension data"
  category: "new_ontology_primitive_candidate"
  current_ontology_derivation_claimed: false
  conservative_definitional_layer: "Tangent-cone, polar-cone, set-valued inclusion, and positive certificate-regraduation operations applied after their source-side domains are independently supplied."
  new_primitive_layer: "The source-intrinsic admissible full-state set K, the source-law family A, the admitted variation multifunction Delta, and their presentation-transport law."
