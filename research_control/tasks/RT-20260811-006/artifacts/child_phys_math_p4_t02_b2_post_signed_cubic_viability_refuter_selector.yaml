new_mathematical_payload:
  - payload_id: "NMP-RT006-CHILD-MATH-001"
    payload_type: "theorem_with_hypotheses_and_proof"
    name: "Quantitative full-state multi-barrier protection theorem"
    representation_role: "Optional sufficient certificate for the source-law-space robust-invariance relation; not the proposed primitive itself."
    definitions:
      - "Let X be a smooth source-state domain, F a locally Lipschitz generator, rho_i:X->R continuously differentiable for i=1,...,m, and N={x:rho_i(x)>=0 for all i}."
      - "At x in the boundary of N, let I(x)={i:rho_i(x)=0}."
      - "Let H be a class of continuous locally Lipschitz variations for which solutions of F+h are locally unique."
    hypotheses:
      - "There are constants alpha_i>0 and delta_i>=0 with delta_i<alpha_i."
      - "For every boundary point x in N, every active i in I(x), and every h in H, d rho_i(F(x))>=alpha_i and |d rho_i(h(x))|<=delta_i."
      - "Forward solutions exist over the interval under consideration."
    statement: "For every h in H, N is forward invariant under x_dot=F(x)+h(x). At every active boundary face, d rho_i(F+h)>=alpha_i-delta_i>0, including simultaneous active faces at corners."
    proof:
      - "Fix h and a solution starting in N. The boundary inequality follows by linearity of the differential and the triangle inequality."
      - "If the solution first left N, continuity would give a first boundary time and an active rho_i that becomes negative immediately afterward."
      - "At that boundary point the strictly positive derivative of rho_i along F+h persists on a short interval by continuity, so rho_i increases rather than becoming negative, a contradiction."
      - "The argument applies to every active index and therefore includes corners; hence no first exit exists."
    scope_limit: "This is a conditional source-side invariance theorem. It derives no physical time, causal cone, conformal class, scale, g_eff, coupling, or equation."
    novelty: "Unlike RT005's signed one-coordinate barrier, the theorem specifies a full-state, multi-face, variation-uniform certificate and isolates exactly which source provenance must be supplied before robustness can be claimed."

  - payload_id: "NMP-RT006-CHILD-MATH-002"
    payload_type: "countermodel_or_obstruction"
    name: "Balanced normal variation obstruction to two-sided strict protection"
    definitions:
      - "Let x be an active boundary point with rho(x)=0 and d rho_x nonzero."
      - "Assume d rho_x(F(x))=0 and the admissible variation class contains both +epsilon*h and -epsilon*h for all sufficiently small epsilon>0, with d rho_x(h(x)) nonzero."
    statement: "For every sufficiently small epsilon, one of F+epsilon*h or F-epsilon*h has strictly negative rho-directional derivative at x. Therefore no two-sided strict inward certificate at x follows from the tangent base law and the balanced variation class."
    proof:
      - "The two derivatives are +epsilon*d rho_x(h(x)) and -epsilon*d rho_x(h(x))."
      - "Because d rho_x(h(x)) is nonzero, exactly one is negative."
      - "Thus a strict robust certificate requires either a positive source-derived base margin or a source-derived asymmetric restriction on admissible normal variations."
    scope_limit: "The lemma obstructs the stated strict certificate only; it is not a global no-go and does not prove that every source extension fails."
    novelty: "It converts RT005's one-family sign observation into a coordinate-independent dependency test for any proposed full-state protection packet without reconstructing the frozen candidate."

  - payload_id: "NMP-RT006-CHILD-MATH-003"
    payload_type: "dependency_map_update"
    name: "Protection-certificate dependency and route-dominance map"
    dependencies:
      - upstream: "tracked source descriptor"
        supplies: "full source-state domain X_src and generator F_src"
        present_now: "partial_or_proposal_only"
      - upstream: "source-local invariant-set provenance"
        supplies: "K_src fixed before desired outcomes, with optional rho_i only as a certificate presentation"
        present_now: false
      - upstream: "complete admitted source-law neighborhood"
        supplies: "L_src, Delta_src, and optional directional-derivative bounds delta_i"
        present_now: false
      - upstream: "source tangent or polar data plus strict inclusion"
        supplies: "F(x)+Delta_src(x) subset Int T_K(x), optionally certified by alpha_i>delta_i"
        present_now: false
      - upstream: "quantitative multi-barrier theorem"
        supplies: "conditional full-state robust invariance once the previous data are proved"
        present_now: true
      - downstream: "P4-T02 physical screen"
        supplies: "no automatic stable common physical cone, universality, or B2 verdict"
        present_now: false
    route_consequence: "Route A tests the missing invariant set, law space, variation multifunction, and tangent inclusion directly. Route B can close an enrichment class but constructs none of them. Route C introduces an observable topology and spectral gap first. Route D is unavailable while Route A remains lawful."

