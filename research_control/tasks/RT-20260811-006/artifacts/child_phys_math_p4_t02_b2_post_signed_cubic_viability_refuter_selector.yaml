selected_future_packet_contract:
  packet_id: "PKT-V22-P4T02-B2-SOURCE-LAW-SPACE-ROBUST-INVARIANCE-PROTECTION-FORMALIZATION-V1"
  packet_status: "selected_not_executed"
  selected_packet_executed: false
  task_type: "v22_p4_t02_b2_source_law_space_robust_invariance_protection_formalization_or_obstruction"
  route_label: "ontology-law-research-packet"
  trigger_classification: "derivation_critical_missing_source_law"
  next_role_family: "ontology-formalizer@0.2.0"
  objective: "Determine whether tracked source premises derive, or can transparently support as proposal-only source-extension data, one typed full-state source-law-space robust-invariance relation with independently source-provenanced K_src, admissible laws, Delta_src, and tangent or polar data; prove robust invariance, optionally through the quantitative multi-barrier certificate, or return the smallest exact missing primitive or countermodel, without reconstructing any frozen route."
  target_derivation_milestone: "effective_metric_g_eff"
  milestone_burden: "Supply or precisely obstruct a full-state source-derived finite-variation protection certificate before any P4-T02 common-physical-cone claim."
  formal_objects:
    - "X_src, L_src, F_src, K_src, Delta_src, T_K, optional T_K_polar, RobInv_src, EqSrc transport, Cert_prot, and optional rho_i, alpha_i, delta_i certificate data."
  proof_obligations:
    - obligation_id: "PO-01-FULL-STATE-TYPING"
      requirement: "Type every source-state component, source-law-space element, generator domain, and law-space neighborhood from tracked source premises or label the addition proposal-only source-extension data."
    - obligation_id: "PO-02-PREOUTCOME-BOUNDARY-PROVENANCE"
      requirement: "Define K_src and any optional rho_i presentation before evaluating viability, principal structure, desired cone, or benchmark agreement."
    - obligation_id: "PO-03-COMPLETE-VARIATION-CLASS"
      requirement: "Define L_src and Delta_src independently of success and include every admitted transverse, token-like, refinement, and normal law variation rather than filtering failures."
    - obligation_id: "PO-04-NO-TARGET-NORM"
      requirement: "Type tangent or polar and optional directional-derivative data from source-local structure; do not import a target metric, norm, scale, tetrad, coframe, or desired cone."
    - obligation_id: "PO-05-UNIFORM-ACTIVE-FACE-MARGIN"
      requirement: "Prove F(x)+Delta_src(x) subset Int T_K(x), or an exact declared source-side analogue, at every boundary point; if barriers are used, prove alpha_i>delta_i with stated uniformity assumptions."
    - obligation_id: "PO-06-CORNER-AND-DEGENERACY-CONTROL"
      requirement: "Check simultaneous active constraints, nonsmooth boundary points, vanishing differentials, and generator degeneracies."
    - obligation_id: "PO-07-EXISTENCE-AND-UNIQUENESS"
      requirement: "State the solution class and prove the local existence, uniqueness, and forward interval assumptions used by the first-exit argument."
    - obligation_id: "PO-08-EQSRC-TRANSPORT"
      requirement: "Prove explicit covariance of X_src, L_src, K_src, Delta_src, tangent or polar data, RobInv_src, and any optional barrier certificate under justified source-presentation arrows without declaring physical gauge."
    - obligation_id: "PO-09-BALANCED-NORMAL-CONTROL"
      requirement: "Apply the balanced-normal lemma wherever the base field is tangent and the variation class contains both normal signs."
    - obligation_id: "PO-10-FULL-STATE-NONREPLAY"
      requirement: "Use no fixed binary token, signed half-line, cubic generator, or one-mode restriction as the protection mechanism."
    - obligation_id: "PO-11-FIVE-FREEZE-INDEPENDENCE"
      requirement: "Prove that no shared tau, repaired quotient, common character, oriented matroid, or unchanged SignedCubicViabilitySelector_v1 is reconstructed."
    - obligation_id: "PO-12-SOURCE-EXTENSION-CLASSIFICATION"
      requirement: "Classify each underived object, preserve blocked_adoption_open_continuation, and send any constructed proposal through a later Smuggling Auditor packet before stress or adoption."
    - obligation_id: "PO-13-P4-T02-SEPARATION"
      requirement: "Separate source-set invariance from a stable common physical cone, time orientation, sector universality, conformal structure, physical scale, and g_eff."
    - obligation_id: "PO-14-DECISIVENESS"
      requirement: "Return an explicit candidate law with theorem and complete typing, or the smallest exact missing primitive or countermodel; an obligations-only completion is invalid."
  failure_branches:
    - branch_id: "FB-01-UNTYPED-FULL-STATE"
      exact_failure: "X_src, L_src, F_src, K_src, Delta_src, tangent data, a transverse mode, or a domain restriction lacks source-side typing."
    - branch_id: "FB-02-GOAL-FILTERED-REGION"
      exact_failure: "K_src, Delta_src, tangent data, or an optional rho_i is chosen because it retains the desired candidate, cone, sector, or benchmark outcome."
    - branch_id: "FB-03-INCOMPLETE-VARIATION-CLASS"
      exact_failure: "L_src or Delta_src removes outward or transverse law variations only after their failure is observed."
    - branch_id: "FB-04-TARGET-DERIVED-BOUND"
      exact_failure: "A metric, norm, scale, cone, calibration, or GR coefficient supplies alpha_i, delta_i, or the boundary geometry."
    - branch_id: "FB-05-ZERO-OR-NONUNIFORM-MARGIN"
      exact_failure: "Strict tangent inclusion fails at some boundary point, or an optional claimed positive conormal margin has no uniform source proof."
    - branch_id: "FB-06-BALANCED-NORMAL-OBSTRUCTION"
      exact_failure: "The base field is tangent while Delta_src admits both signs of a nonzero normal variation."
    - branch_id: "FB-07-CORNER-OR-REGULARITY-DEFECT"
      exact_failure: "A corner, vanishing differential, nonunique flow, or incomplete solution invalidates the first-exit proof."
    - branch_id: "FB-08-EQSRC-COVARIANCE-DEFECT"
      exact_failure: "The region, variation class, margin, or certificate changes under an admitted source-presentation arrow."
    - branch_id: "FB-09-ONE-MODE-OR-TOKEN-REPLAY"
      exact_failure: "The packet reduces to the frozen signed-cubic fixed-token one-mode selector or attempts to repair it."
    - branch_id: "FB-10-OTHER-FROZEN-ROUTE-REPLAY"
      exact_failure: "The packet reconstructs shared tau, Q_ray or repaired quotient, common character or holonomy, or Bridge_OM selection."
    - branch_id: "FB-11-PHYSICAL-OVERREAD"
      exact_failure: "Source invariance is identified with physical causality, common matter propagation, conformal structure, time orientation, scale, g_eff, coupling, or Einstein equations."
    - branch_id: "FB-12-OBLIGATIONS-ONLY-FOG"
      exact_failure: "The completion lists desiderata without one complete candidate theorem or one precise missing primitive or countermodel."
  allowed_future_results:
    - "proposal_only_full_state_source_protection_law_formalized_pending_smuggling_audit"
    - "smallest_missing_source_boundary_variation_or_margin_primitive_precisely_obstructed"
