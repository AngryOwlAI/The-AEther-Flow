constitutive_adoption_rule:
  sole_status_changing_premise: >-
    The exact protected human authorization explicitly assigns physical and
    operational meanings to the fixed P7 records.
  model_to_world_effect: >-
    Within this project's canonical interpretation, the fixed formal records
    are henceforth to be treated as the authorized P7 physical-matter model in
    their exact declared domains.
  epistemic_non_effect: >-
    A constitutive assignment licenses use of the model under the adopted
    interpretation. It does not show that nature uniquely realizes the model,
    that the interpretation follows from the prior ontology, or that the
    interpretation is empirically adequate.
  logical_form: >-
    Human authority adds an explicit interpretive postulate; it does not add a
    missing mathematical derivation, validation datum, uniqueness theorem, or
    target-side bridge.
