source_intrinsic_first_jet_topology:
  definition_id: "DEF-V22-P4T02-B2-COMPACT-OPEN-C1-JET-001"
  base_data: >-
    Let pi:E->U be any declared smooth source bundle and Gamma^1(E) its C1
    source sections.  The first-jet prolongation is
    j^1:Gamma^1(E)->C^0(U,J^1E).
  topology_name: "compact-open C1 first-jet topology"
  definition: |-
    Give C^0(U,J^1E) the compact-open topology with subbasic sets
      [K,O] = { f : U -> J^1E | f(K) is a subset of O },
    where K is compact in U and O is open in J^1E.  Define
      T_co^1(E) = (j^1)^*(T_co(J^1E)).
    Equivalently, a subbasic section neighborhood is
      N(K,O) = { u in Gamma^1(E) | j^1u(K) is a subset of O }.
    For the RT023 C2 section space, use the subspace topology induced by the
    inclusion Gamma^2(E) -> Gamma^1(E).  For m sectors, use the finite product
    topology product_{s=1}^m T_co^1(E_s).
  coordinate_independence_theorem:
    theorem_id: "THM-V22-P4T02-B2-JET-TOPOLOGY-NATURALITY-001"
    statement: >-
      A smooth bundle isomorphism F:E->E' covering a source diffeomorphism
      phi:U->U' induces a homeomorphism of section spaces equipped with
      T_co^1; hence no source-coordinate component norm or numerical
      coordinate threshold occurs in the definition.
    proof: |-
      Jet functoriality gives
        j^1(F_*u) = J^1F o j^1u o phi^{-1}.
      Both phi and J^1F are homeomorphisms.  They send compact sets to compact
      sets and open sets to open sets, so preimages and images of every
      compact-open subbasic set are compact-open.  Applying the same argument
      to F^{-1} proves that the induced map is a homeomorphism.
  vector_field_specialization: >-
    For sector leading fields use E=TU.  Convergence tau_n->tau means
    j^1tau_n->j^1tau compact-open; it is not a componentwise sup bound and
    requires no source or target metric.
  repaired_prior_defect: "F2-PRESENTATION-NORM"
  target_metric_used: false
  target_atlas_used: false

typed_operational_bridge:
  bridge_family_id: "B-V22-P4T02-B2-EQUIPPED-P7-RATIONALIZED-PROTOCOL-V1"
  status: "constructed_on_exact_equipped_subfamily"
  bridge_scope: "Rod Signal and Detector controls only"
  common_finite_data:
    carrier: "B_3={b_0,b_1,b_2}"
    sample_grid: "a fixed finite nonempty declared source grid G_0"
    quantization_parameter: "an integer N>=1"
    sample_space: "A=(R^{B_3})^{G_0}"
  deterministic_rationalizer:
    map_id: "MAP-V22-P4T02-B2-SIGNED-CLIPPED-RATIONALIZER-001"
    formula: |-
      q_N(t) = sgn(t) floor(N min{|t|,1})/N, with sgn(0)=0.
    codomain: "{-1,-(N-1)/N,...,0,...,(N-1)/N,1} subset Q"
    tie_rule: "floor after clipping; there are no rounding ties"
    source_only_basis: >-
      The map uses only the declared real source-fiber component, scalar
      order, integer N, and the exact finite carrier labels.  It uses no
      metric, device calibration, benchmark answer, or empirical threshold.
  normalization:
    formula: |-
      For a in A set
        z_b(a) = sum_{g in G_0} |q_N(a(g,b))| in Q_{>=0},
        Z(a)   = sum_{b in B_3} z_b(a).
      If Z(a)>0, set w_b(a)=z_b(a)/Z(a).  If Z(a)=0, set
        w(a)=delta_{b_0}.
      For the exact equipment bijection kappa_s:Omega_s->B_3, define
        mu_{s,a}(x)=w_{kappa_s(x)}(a).
  exact_properties:
    - "The construction is total and deterministic on A."
    - "Every mu_{s,a}(x) is a nonnegative rational."
    - "sum_{x in Omega_s} mu_{s,a}(x)=1."
    - >-
      Because q_N has finite image and G_0 is finite, the preparation image is
      finite and therefore satisfies the P7-T03 finite-preparation-set type.
    - >-
      The construction commutes with exact ordered-equipment relabelings that
      transport b_0, G_0, carrier components, and the fixed protocol context.
  zero_branch:
    condition: "Z(a)=0, equivalently every rationalized component is zero"
    output: "mu_{s,a}=delta at the declared initial address kappa_s^{-1}(b_0)"
    semantic_guard: >-
      This is a deterministic typing fallback.  It is not a physical vacuum,
      a no-event observation, zero matter, or a detector statement.
  p7_t03_context_type:
    definition: |-
      Ctx_s^adm = {
        ((Control_s,mu,2), i_{s,0}, 2,
         (A_s,r_s^P7,S_s,F_s))
        | mu in Q_{>=0}^{Omega_s}, sum_x mu(x)=1
      }.
      Here (Control_s,mu,2) has exactly the P7-T03 preparation type;
      i_{s,0} is the declared baseline intervention; A_s is the exact token
      alphabet; r_s^P7:H_2(Control_s)->A_s is the exact total readout; S_s is
      the success-token subset; and F_s is the exact failure classifier.
    scalar_response_domain: >-
      Appending alpha in A_s to an element of Ctx_s^adm gives an input of the
      exact scalar token-response map R_{Device_s,p,i,2}(alpha).
  common_bridge_formula: |-
    B_{s,N}: A -> Ctx_s^adm,
    B_{s,N}(a)=((Control_s,mu_{s,a},2),i_{s,0},2,
                (A_s,r_s^P7,S_s,F_s)).
    With the exact finite sampling map S_{s,0}, the typed composite is
    Bhat_{s,N}=B_{s,N} o S_{s,0}:Gamma^1(E_s)->Ctx_s^adm.
  admissible_image: >-
    im(B_{s,N}) is the finite proposal-only subset of Ctx_s^adm whose
    preparation weights are produced by the displayed rationalization and
    normalization.  Every output has unit rational bookkeeping mass, the
    exact equipped control, declared baseline intervention, horizon two, and
    the protected total token readout context.
  protocols:
    - bridge_id: "BRIDGE-V22-P4T02-B2-ROD-P7T03-001"
      sector_control_tag: "(Rod,sigma_R)"
      equipment: "kappa_R(r_i)=b_i for i=0,1,2"
      domain: "(R^3)^{G_0}"
      codomain: "Ctx_Rod^adm"
      preparation: "p_R(a)=(Control_Rod,mu_{R,a},2)"
      fixed_intervention: "i_{R,0}"
      fixed_horizon: 2
      fixed_total_readout: "r_Rod^P7:H_2(Control_Rod)->A_Rod"
      success_token: "endpoint_2"
      zero_branch: "delta_{r_0}"
      admissible_image: "finite unit-rational preparations on {r_0,r_1,r_2} with exact Rod context"
    - bridge_id: "BRIDGE-V22-P4T02-B2-SIGNAL-P7T03-001"
      sector_control_tag: "(Signal,sigma_S)"
      equipment: "kappa_S(s_i)=b_i for i=0,1,2"
      domain: "(R^3)^{G_0}"
      codomain: "Ctx_Signal^adm"
      preparation: "p_S(a)=(Control_Signal,mu_{S,a},2)"
      fixed_intervention: "i_{S,0}"
      fixed_horizon: 2
      fixed_total_readout: "r_Signal^P7:H_2(Control_Signal)->A_Signal"
      success_token: "arrived_2"
      zero_branch: "delta_{s_0}"
      admissible_image: "finite unit-rational preparations on {s_0,s_1,s_2} with exact Signal context"
    - bridge_id: "BRIDGE-V22-P4T02-B2-DETECTOR-P7T03-001"
      sector_control_tag: "(Detector,sigma_D)"
      equipment: "kappa_D(q_i)=b_i for i=0,1,2"
      domain: "(R^3)^{G_0}"
      codomain: "Ctx_Detector^adm"
      preparation: "p_D(a)=(Control_Detector,mu_{D,a},2)"
      fixed_intervention: "i_{D,0}"
      fixed_horizon: 2
      fixed_total_readout: "r_Detector^P7:H_2(Control_Detector)->A_Detector"
      success_token: "triggered_2"
      zero_branch: "delta_{q_0}"
      admissible_image: "finite unit-rational preparations on {q_0,q_1,q_2} with exact Detector context"
  nonphysical_status: >-
    The bridges are conservative proposal-only coercions into the P7-T03
    preparation schema.  They do not amend or adopt the protected P7 suite;
    do not turn guarded labels into physical rods, signals, or detectors; and
    do not derive empirical response, probability, duration, distance,
    causality, a leading line, a cone, a metric, scale, or coupling.
  known_mathematical_limits:
    - "q_N is discontinuous at quantization thresholds."
    - "B_{s,N} is many-to-one and has no left inverse on the sample space."
    - "The bridge is not defined for arbitrary P7 sectors lacking an exact P7-T03 protocol tuple."

equivariant_selector_obstruction:
  theorem_id: "THM-V22-P4T02-B2-NO-NATURAL-LINE-SELECTOR-001"
  obstruction_id: "OBST-V22-P4T02-B2-NATURAL-LINE-LOCK-001"
  setting: |-
    Fix x in the four-dimensional smooth source patch U and let
    D_fin denote the abstract finite P7 control data.  D_fin has no embedding,
    soldering map, frame, covector, tangent vector, or other datum coupling it
    to T_xU.  Source-presentation germs fixing x therefore act trivially on
    D_fin, while their derivatives realize GL(T_xU)=GL(4,R).
  candidate_map: |-
    Lambda_x:D_fin -> P(T_xU), required to satisfy
      Lambda_x(phi_*D_fin)=P(d phi_x) Lambda_x(D_fin)
    for every allowed source-presentation germ phi fixing x.
  theorem_statement: >-
    No such full source-presentation-natural map exists under the stated bare
    source data.
  proof: |-
    Let ell=Lambda_x(D_fin).  Because phi_*D_fin=D_fin, naturality requires
      ell=P(A)ell for every A in GL(T_xU).
    Choose 0!=v in ell and choose w not in span(v).  Extend {v,w} to a basis
    and define the invertible shear A by A(v)=v+w, A(w)=w, and A equal to the
    identity on the remaining basis vectors.  Then
      P(A)ell=[v+w]!=[v]=ell,
    contradicting the required fixed-line condition.  Hence GL(4,R) has no
    fixed point in P(T_xU), and Lambda_x cannot be formed from D_fin alone.
  characteristic_link: >-
    A nonzero tangent line ell=[tau_x] determines the cotangent hyperplane
    { [k] | k(tau_x)=0 } without a metric.  Thus absence of a natural line
    selector blocks the RT023 common principal generator before any claim of
    a physical cone or metric arises.
  exact_failed_premise: >-
    The current ontology and fixed P7 controls do not derive a
    source_presentation_natural_line_locking_selector.
  missing_primitive: "source_presentation_natural_line_locking_selector"
  permitted_repair: >-
    A materially new proposal-only source structure may reduce the isotropy
    or couple finite data to a tangent line and must then pass naturality,
    descent, independent-sector variation, and hidden-import audit.
  obstruction_scope: "current ontology plus fixed finite controls and a bare smooth source patch"
  global_no_go_claimed: false
  future_source_extension_impossibility_claimed: false

sector_split_theorem:
  theorem_id: "THM-V22-P4T02-B2-DIAGONAL-EMPTY-INTERIOR-001"
  witness_id: "WIT-V22-P4T02-B2-EPSILON-SECTOR-SPLIT-001"
  statement: |-
    Let V=T_xU with dim(V)>=2 and m>=2.  In the product topology on
    P(V)^m, the common-line diagonal
      Delta_m={(ell_1,...,ell_m) | ell_1=...=ell_m}
    has empty interior.
  proof: |-
    Take any diagonal point (ell,...,ell), write ell=[v], and choose w not in
    span(v).  Every basic product neighborhood O_1 x ... x O_m of the point
    has ell in each O_i.  The curve ell_epsilon=[v+epsilon w] converges to ell
    in P(V).  Hence, for all sufficiently small nonzero epsilon,
      (ell,ell_epsilon,ell,...,ell)
    lies in O_1 x ... x O_m but not in Delta_m.  No point of Delta_m is
    interior.
  explicit_three_sector_witness:
    basis: "choose independent v,w in T_xU"
    epsilon_condition: "0<|epsilon|, arbitrarily small"
    lines:
      Rod: "[v+epsilon w]"
      Signal: "[v]"
      Detector: "[v-epsilon w]"
    coordinate_display_only: >-
      With v=e_0 and w=e_1 the associated linear principal generators are
      k_0+epsilon k_1, k_0, and k_0-epsilon k_1; for epsilon!=0 they are not
      nonzero scalar associates, so their principal ideals are distinct.
  first_jet_section_lift: |-
    Choose C1 local vector fields tau and nu with tau_x=v and nu_x=w.  Vary
    only sector two by tau_{2,epsilon}=tau+epsilon nu and keep the other
    sector fields equal to tau.  Linearity of j^1 gives
      j^1(tau+epsilon nu)=j^1tau+epsilon j^1nu,
    so the split tuple converges to the diagonal in the finite product
    compact-open C1 topology while leaving it for every sufficiently small
    nonzero epsilon at x.
  consequence: >-
    Common-line robustness is not an open property under independent sector
    variations.  Restricting variations to the diagonal merely assumes a
    locking law; it does not derive one.
  global_no_go_claimed: false

