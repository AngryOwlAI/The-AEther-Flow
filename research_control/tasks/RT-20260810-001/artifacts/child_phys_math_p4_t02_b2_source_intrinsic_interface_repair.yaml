refuter_support:
  classification: "scoped_obstruction"
  branches:
    collapse:
      branch_id: "REFUTE-V22-P4T02-B2-COLLAPSE-001"
      target: "constant or zero line repair"
      witness: >-
        A zero vector defines no point of P(T_xU).  A nonzero constant line
        ell_0 ignores the finite data and is moved by a GL(4,R) shear while
        the finite data remain fixed.
      result: "fails full presentation equivariance"
      disposition: "blocking_for_line_selector"
    nonuniqueness:
      branch_id: "REFUTE-V22-P4T02-B2-NONUNIQUENESS-001"
      target: "unique line selected by fixed finite control data"
      witness: >-
        For any two projective lines ell_1 and ell_2 there is A in GL(4,R)
        with P(A)ell_1=ell_2, while A acts trivially on the abstract finite
        control record.  The record therefore provides no orbit discriminator.
      result: "the current data do not select a unique projective line"
      disposition: "blocking_for_line_selector"
    inverse_defect:
      branch_id: "REFUTE-V22-P4T02-B2-INVERSE-DEFECT-001"
      target: "inverse or reconstruction claim for the typed operational bridge"
      witness: >-
        For any nonzero sample a, q_N(a) and q_N(-a) have equal absolute
        carrier weights, hence B_{s,N}(a)=B_{s,N}(-a).  Also every sample with
        |a(g,b)|<1/N enters the same zero branch.  Thus no map L can satisfy
        L o B_{s,N}=id_A.
      result: "bridge is intentionally many-to-one; no inverse or line reconstruction follows"
      disposition: "nonblocking_for_F5_typing_but_blocks_overread"
    cocycle_defect:
      branch_id: "REFUTE-V22-P4T02-B2-COCYCLE-DEFECT-001"
      target: "descent of chartwise coordinate-fixed line choices"
      witness: >-
        On an overlap let one presentation transition have derivative A with
        A(e_0)=e_0+e_1.  A chartwise rule that chooses [e_0] in both charts
        requires [e_0]=P(A)[e_0]=[e_0+e_1], which is false.  The local lines
        do not descend; proportional overlap units are not typed, so inverse
        and triple-cocycle identities cannot be asserted.
      result: "chartwise coordinate choices fail projective descent"
      disposition: "blocking_for_line_selector"
    variation_fragility:
      branch_id: "REFUTE-V22-P4T02-B2-VARIATION-FRAGILITY-001"
      target: "open robustness of common sector line under independent variation"
      witness: "WIT-V22-P4T02-B2-EPSILON-SECTOR-SPLIT-001"
      result: "the diagonal common-line locus has empty interior"
      disposition: "blocking_without_line_locking_law"

