finding_status_table:
  - finding_id: "F1-SECTOR-COVERAGE"
    exact_status: "restricted_control_scope_repaired_full_sector_burden_obstructed"
    repair: "Restrict every field, operator, selector attempt, and operational bridge to the exact tagged equipped-control set {Rod_src, Signal_src, Detector_src}."
    evidence: "P7-T01 defines sectors by source records, while P7-T05 supplies explicit equipment for only three protocol controls and expressly withholds an all-sector equipment constructor."
    full_descriptor_blocking: true
    full_sector_b2_credit: false
    reason_no_full_credit: "A lawful statement over three equipped controls is not a universal quantifier over every admitted P7-T01 sector, and protocol-role names do not prove an exhaustive matter-sector taxonomy."
  - finding_id: "F2-PRESENTATION-NORM"
    exact_status: "repaired_on_declared_source_patch"
    repair: "Replace the componentwise coordinate sup threshold by the compact-open topology pulled back along the first-jet extension."
    evidence: "Jet functoriality makes this topology invariant under smooth source-presentation changes of the declared source bundle; its neighborhoods use compact source subsets and open jet-bundle subsets rather than coordinate component magnitudes."
    full_descriptor_blocking: false
    full_sector_b2_credit: false
    reason_no_full_credit: "This repairs only presentation dependence on the proposal-only smooth patch; it neither derives that patch from P7 nor repairs the all-sector and common-leading burdens."
  - finding_id: "F3-SHARED-LEADING-PRELOAD"
    exact_status: "precise_obstruction"
    repair_attempt: "Require each sector leading line to be selected from its own source data and impose equivariance under the full allowed source-presentation derivative action."
    evidence: "At a fixed source point the finite P7 data contain no tangent datum, while derivatives of local presentation changes range over GL(4,R). Equivariance would require one projective line fixed by all of GL(4,R), and no such line exists."
    missing_primitive: "source_presentation_natural_line_locking_selector"
    full_descriptor_blocking: true
    full_sector_b2_credit: false
    reason_no_full_credit: "The common principal line cannot be counted as derived when the only available construction inserts the same line into every sector equation."
  - finding_id: "F4-SECTOR-SPLIT-VARIATION"
    exact_status: "precise_obstruction"
    repair_attempt: "Use the product compact-open topology for independently varied sector line fields and admit arbitrarily small one-sector or opposite-sector perturbations."
    evidence: "For nonzero arbitrarily small epsilon, [e0+epsilon e1], [e0], and [e0-epsilon e1] are nearby but distinct; equivalently their linear principal generators are pairwise nonassociate. The common-line diagonal has empty interior."
    missing_primitive: "a source-derived law constraining independent sector data to a common line"
    full_descriptor_blocking: true
    full_sector_b2_credit: false
    reason_no_full_credit: "Removing sector-split directions would define the admissible neighborhood to remain on the desired commonity locus and would therefore preload the answer."
  - finding_id: "F5-UNTYPED-OPERATIONAL-BRIDGE"
    exact_status: "repaired_on_exact_equipped_protocol_domain_full_sector_extension_absent"
    repair: "Use a fixed bounded-denominator rationalization, nonnegative component aggregation, normalization with a declared zero branch, and append the exact P7-T03 context to form a protocol request for each equipped control."
    evidence: "The image consists of normalized rational preparations paired with declared controls, interventions, horizons, token alphabets, total readouts, success sets, and failure classifiers."
    full_descriptor_blocking: true
    full_sector_b2_credit: false
    reason_no_full_credit: "The bridge is defined only where an exact P7-T03 protocol is supplied; arbitrary P7-T01 sectors remain outside its domain, and formal protocol typing supplies no empirical semantics."

