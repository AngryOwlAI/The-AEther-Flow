theorems:
  - theorem_id: "THM-V22-P4T02-B2-NO-NATURAL-LINE-SELECTOR-001"
    hypotheses:
      - "U is a smooth source patch of dimension at least two with no additional tangent-line structure."
      - "Finite P7 control data are unchanged by source-presentation germs fixing the source point."
      - "The selector is natural under every allowed local source-presentation diffeomorphism."
    conclusion: "No selector from the fixed finite control data to P(T_xU) exists."
    proof_key: "Naturality makes the selected line fixed by every derivative in GL(T_xU); a shear or coordinate exchange moves every proposed line, so no global fixed projective line exists."
  - theorem_id: "THM-V22-P4T02-B2-DIAGONAL-EMPTY-INTERIOR-001"
    hypotheses:
      - "dim(T_xU)>=2"
      - "at least two sector lines vary independently in the product topology"
    conclusion: "The diagonal common-line locus has empty interior."
    proof_key: "Every product neighborhood of (ell,ell,ell) contains (ell_epsilon,ell,ell_minus_epsilon) with distinct nearby projective lines."
