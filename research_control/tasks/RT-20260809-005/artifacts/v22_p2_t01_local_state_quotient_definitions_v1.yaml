definitions:
  - definition_id: "DEF-P2-T01-SOURCE-STATE"
    symbol: "S subset J^k E_src"
    kind: "finite_order_local_state_manifold"
    domain: "one open source patch"
    regularity: "finite-dimensional C1 minimum; smooth in the manuscript model"
    authority: "proposal-only mathematical type"
    forbidden_overread: "The primitive source manifold and bundle are not physical spacetime or adopted ontology."
  - definition_id: "DEF-P2-T01-SOURCE-VERTICAL"
    symbol: "V_src(z)"
    kind: "source_redundancy_vertical_distribution"
    domain: "constant-rank local patch around z"
    regularity: "locally constant rank"
    authority: "declared theorem hypothesis"
    forbidden_overread: "No canonical EqSrc is adopted."
  - definition_id: "DEF-P2-T01-OUTPUT-STATE"
    symbol: "Y"
    kind: "abstract_candidate_output_manifold"
    domain: "one local candidate-output patch"
    regularity: "finite-dimensional C1"
    authority: "abstract test codomain"
    forbidden_overread: "Y is not an adopted Lorentzian metric space."
  - definition_id: "DEF-P2-T01-OUTPUT-VERTICAL"
    symbol: "V_out(y)"
    kind: "coordinate_or_candidate_gauge_vertical_distribution"
    domain: "constant-rank local patch around y"
    regularity: "locally constant rank"
    authority: "declared theorem hypothesis"
    forbidden_overread: "No physical gauge group is derived."
  - definition_id: "DEF-P2-T01-QUOTIENT-TANGENTS"
    symbol: "Q_src and Q_out"
    kind: "local_quotient_tangent_spaces"
    formula: "Q_src(z)=T_z S/V_src(z); Q_out(y)=T_y Y/V_out(y)"
    regularity: "local quotient submersions exist"
    authority: "representation-independent rank surface"
    forbidden_overread: "A global Hausdorff orbit space or global section is not assumed."
  - definition_id: "DEF-P2-T01-RECONSTRUCTION"
    symbol: "R and R_bar"
    kind: "equivariant_local_reconstruction"
    formula: "pi_Y o R = R_bar o pi_S"
    regularity: "C1 and equivalence-respecting"
    authority: "conditional candidate map"
    forbidden_overread: "The map is neither constructed from canonical source laws nor physically adopted."
  - definition_id: "DEF-P2-T01-STATISTIC"
    symbol: "I"
    kind: "source_quotient_statistic"
    formula: "R_bar=F o I"
    regularity: "exact C1 local factorization"
    authority: "route-specific factor object"
    forbidden_overread: "Approximate or nonlocal factorizations require separate error and domain analysis."
  - definition_id: "DEF-P2-T01-CAPACITY"
    symbol: "c_I"
    kind: "local_source_information_capacity"
    formula: "c_I([z])=rank(dI_[z])"
    regularity: "evaluated on a declared rank stratum"
    authority: "necessary-condition rank"
    forbidden_overread: "Capacity is not raw field count, coordinate dimension, entropy, or sufficiency."
  - definition_id: "DEF-P2-T01-OPERATIONAL-PROBE"
    symbol: "P"
    kind: "invariant_physically_typed_probe_family"
    formula: "P:Y_bar -> R^m"
    regularity: "C1 on the tested quotient patch"
    authority: "admitted only with complete P1-T04 provenance"
    forbidden_overread: "A familiar label or finite token contributes no operational covector."
  - definition_id: "DEF-P2-T01-REQUIRED-RANK"
    symbol: "n"
    kind: "operationally_independent_realized_response_dimension"
    formula: "n=dim W for W subset image(dR_bar) and dP restricted to W injective"
    regularity: "same state, quotient patch, and operational context"
    authority: "candidate-specific lower-bound input"
    forbidden_overread: "The number is not inferred from written tensor components."
  - definition_id: "DEF-P2-T01-STOCHASTIC-CAPACITY"
    symbol: "rank_Fisher"
    kind: "regular_score_tangent_rank"
    formula: "rank_Fisher(mu_s) <= rank(dI_s)"
    regularity: "dominated C1 family with source-independent Markov kernel after I"
    authority: "conditional stochastic proposition"
    forbidden_overread: "Noise dimension and entropy are not source-parametric rank."
