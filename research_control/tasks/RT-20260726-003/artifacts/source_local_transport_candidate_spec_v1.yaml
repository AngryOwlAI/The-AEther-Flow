  solution: "a(s,y)=a_0(y)/(1+2 gamma s a_0(y)^2)^(1/2)"
  p5_flow_recovered_on_each_integral_curve: true
  linearized_equation: "L_V u + 3 gamma a_bar^2 u = 0"
  linearized_solution: "u(s,y)=u_0(y)(1+2 gamma s a_0(y)^2)^(-3/2)"
  p5_tangent_response_recovered: true

characteristic_calculation:
  principal_symbol: "sigma_x(xi) u = xi(V_x) u"
  principal_polynomial: "P_x(xi)=xi(V_x)"
  characteristic_set: "Char_x^*=Ann(V_x) minus the zero covector"
  polynomial_degree: 1
  hyperbolic: true
  hyperbolicity_condition: "choose h with h(V_x)>0"
  hyperbolicity_component: "Gamma_x={xi:xi(V_x)>0}"
  closed_dual_propagation_cone: "Gamma_x^circ={r V_x:r>=0}"
  propagation_sector_count: 1
  lorentzian_cone_claimed: false
  conformal_metric_reconstructed: false

formal_influence:
  relation: "x preceq_V y iff y=chi_s(x) for some s>=0"
  relation_type: "forward reachability preorder"
  response_support: "support is transported along positive V-flow lines with the exact nonzero P5 tangent multiplier"
  physical_causality_claimed: false
  antisymmetry_requires: "absence of distinct points on common closed positive V-orbits"

covariance_and_normalization:
  source_diffeomorphism_covariant: true
  positive_rescaling_characteristic_invariant: true
  positive_rescaling_rule: "V maps to fV and P maps to fP for f>0"
  equation_rescaling_requires: "gamma maps to f gamma if the whole equation is to scale by f"
  unparameterized_ray_selected_by_characteristics: true
  parameter_scale_derived: false

controls:
