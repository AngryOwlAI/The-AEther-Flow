candidate_equation:
  equation: "E_V[a] = L_V a + gamma a^3 = 0"
  local_coordinate_form: "V^A partial_A a + gamma a^3 = 0"
  equation_order: 1
  field_count: 1
  source_side_only: true
  metric_required: false
  connection_required: false

exact_flow_box_solution:
