    source_arena: "R^4 with coordinates (s,y1,y2,y3)"
    vector_field: "V=partial_s"
    initial_data: "a_0(y)=A exp(-|y|^2), A nonzero"
    characteristic_condition: "xi_s=0"
    propagation_ray: "positive partial_s ray"
    result: "PASS_NONTRIVIAL_EXACT_SOLUTION"
  zero_field:
