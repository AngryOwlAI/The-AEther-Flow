  closed_orbit:
    source_arena: "S^1 x R^3"
    vector_field: "V=partial_theta"
    result: "FAIL_CLOSED_ANTISYMMETRIC_CAUSAL_ORDER"
    failed_obligation: "global chronology or source time function"
  competing_generators:
    first: "V=partial_s"
    second: "W=partial_s+kappa partial_y1, kappa nonzero"
    common_restricted_data: "same P5 cubic equation on transverse-constant fields"
    different_output: "different characteristic hyperplanes and propagation rays"
    result: "PRECISE_SELECTOR_NONSELECTION"
  multiple_sectors:
    equation: "diag(L_V,L_W) u + lower-order terms = 0"
    determinant: "P_x^(2)(xi)=xi(V_x)xi(W_x)"
    result: "TWO_RAYS_WHEN_V_AND_W_ARE_NONCOLLINEAR"
    universality_derived: false

approximation:
  method: "backward source-oriented finite difference"
  formula: "D^-_epsilon a(s,y)=[a(s,y)-a(s-epsilon,y)]/epsilon"
  consistency_order: "O(epsilon)"
  error_bound: "|D^-_epsilon a-partial_s a| <= epsilon/2 sup |partial_s^2 a|"
  effective_metric_reconstruction_error: "undefined because no source-to-target reconstruction map is supplied"

