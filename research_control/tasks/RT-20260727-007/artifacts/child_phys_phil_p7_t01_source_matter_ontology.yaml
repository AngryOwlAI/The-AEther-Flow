consensus:
  disposition: "conditionally_fusable_after_required_corrections"
  findings:
    - finding_id: "PHIL-CONS-001"
      statement: "The finite source-incidence proposal is materially stronger than an interface-only profile because it stipulates an explicit configuration domain and derives algebraic sector records from declared source-side data."
    - finding_id: "PHIL-CONS-002"
      statement: "Its mathematical success is candidate-relative: it establishes neither that the variables denote physical matter nor that the candidate is fundamental, emergent, or realized by the selected substrate."
    - finding_id: "PHIL-CONS-003"
      statement: "Source-incidence relabeling, internal-label transport, and chain-level balance can support exact conditional theorems without importing target geometry, but every such theorem must retain its declared candidate hypotheses."
    - finding_id: "PHIL-CONS-004"
      statement: "The proposal can instantiate a source-intrinsic non-bottom mathematical split that earlier profile schemas lacked, but it does not thereby adopt MatSrcDiscLaw_v1, SemMatter_src, matter semantics, or a physical sector classification."
    - finding_id: "PHIL-CONS-005"
      statement: "All legacy matter-profile and readiness objects remain target grammar, proposal-only schema, or scoped evidence/precondition at their existing statuses."
    - finding_id: "PHIL-CONS-006"
      statement: "The P6 Gate B zero-of-eight result and local freeze remain unchanged because this packet assumes no effective geometry and supplies no lawful geometry input."

ontological_level_map:
  stipulated_candidate_primitives:
    status: "proposal-only task-local mathematical inputs"
    objects:
      - "finite source-incidence complex and its declared boundary operators"
      - "finitely generated abelian internal charge-label group"
      - "finite internal label set and any explicitly declared internal action"
      - "occupation assignments and admissible-transition grammar"
    interpretation: "Primitive within this candidate presentation only; not established fundamental physical entities and not adopted canonical ontology."
  mathematically_derived_candidate_objects:
    status: "conditional algebraic consequences inside the candidate"
    objects:
      - "total source charge-label record"
      - "candidate defect homology class"
      - "source-relabeling orbit or invariant record"
      - "chain-level balance status for an admissible transition"
    interpretation: "Derived mathematically from the stipulated candidate data; mathematical derivation does not supply physical reference."
  physical_interpretation:
    status: "open and not authorized"
    blocked_identifications:
      - "occupation as physical particle number or mass density"
      - "internal charge label as measured physical charge"
      - "one-chain as physical transport current or worldline"
      - "homology class as a physical topological defect"
      - "source-invariant record as a detector observable"
      - "incidence adjacency as spacetime locality, causality, or distance"
  emergence_status:
    mathematically_emergent: "Sector and defect invariants may be derived from the candidate primitives in the limited algebraic sense."
    physically_emergent: false
    fundamental_physical_status: false
    substrate_excitation_status: "proposal-only metaphor unless a later source dynamics defines a reference state, admissible perturbations, stability, and an interpretation map."
    required_wording: "The candidate treats its matter variables as stipulated source-side degrees of freedom. It does not decide whether physical matter is fundamental, emergent, or a substrate excitation."

identity_and_individuation:
  required_identity_ladder:
    presentation_identity: "Exact equality of all declared incidence, coefficient, occupation, current, defect, and internal-label fields."
    candidate_relabeling_equivalence: "Isomorphism under declared incidence-preserving cell bijections together with compatible transport of coefficients and internal labels."
    sector_coincidence: "Equality of the declared sector index or orbit; this is coarser than configuration identity."
    physical_identity: "Not supplied. Neither numerical identity of physical objects nor persistence of particles across transitions follows."
  source_equivalence_boundary: "Candidate-specific relabeling equivalence is not the unresolved general EqSrc relation and must not be presented as physical observational equivalence or gauge."
  no_haecceity_requirement: "Bare vertex, edge, token, or file identifiers must not individuate candidate excitations. Only transported structural assignments may contribute to the candidate-relative identity."
  transition_boundary: "An admissible source transition relates two candidate configurations. It does not establish a physical trajectory, worldline, causal propagation, or persistence relation."
  sector_boundary:
    statement: "A sector taxonomy is an algebraic partition of candidate configurations, not a physical species taxonomy or superselection theorem."
    required_guard: "Equality of total charge-label and defect class does not imply equality or physical indistinguishability of configurations."
    neutral_nontrivial_case: "A nonzero charge-neutral configuration may share total charge with the null configuration; the taxonomy must retain configuration-level distinction."
  excitation_boundary:
    statement: "The term excitation requires a declared reference configuration plus a rule for departures from it."
    guard: "A designated null configuration is a mathematical basepoint only, not a physical vacuum, ground state, or energy minimum."

internal_symmetry_and_label_semantics:
  source_relabeling:
    acts_on: "source cells, incidence maps, and transported assignments"
    does_not_mean:
      - "physical coordinate transformation"
      - "spacetime diffeomorphism"
      - "observational gauge equivalence"
  internal_symmetry:
    acts_on: "declared internal coefficient or representation-label data only"
    status: "stipulated candidate structure unless separately derived"
    does_not_mean:
      - "physical gauge symmetry"
      - "local Lorentz symmetry"
      - "observer frame change"
      - "empirically calibrated charge symmetry"
  compatibility_requirement: "The candidate must declare whether source relabeling and internal transport commute, form a semidirect action, or are restricted to a specified compatible subgroup."
  charge_orbit_requirement:
    risk: "If an allowed internal automorphism acts nontrivially on the charge group, a raw total-charge label need not be invariant."
    lawful_options:
      - "restrict the declared internal symmetry to automorphisms that fix the sector charge"
      - "define the charge part of the sector as the orbit of total charge under the declared internal action"
    forbidden_shortcut: "Call the transformation a symmetry while retaining a non-invariant raw charge as an unchanged sector identifier."
  representation_label_guard: "A finite label set is not a mathematical representation unless an acting group, carrier, and action or homomorphism are explicitly supplied. Otherwise use internal label rather than representation."

source_observable_semantics:
  preferred_term: "source-invariant record"
  admissible_definition: "A declared function of valid candidate configurations that is constant on the specified candidate-relabeling classes or transforms equivariantly under the declared internal action."
  nonconclusions:
    - "not an empirical observable"
    - "not an observer-localized quantity"
    - "not a detector readout"
    - "not an operational clock or rod reading"
    - "not calibrated, dimensioned, or measurable merely because it is invariant"
  operational_upgrade_requirements:
    - "a separately authorized detector or probe semantics"
    - "an interpretation map from source records to possible outcomes"
    - "calibration, units, and error or robustness conditions"
    - "observer and localization semantics"
    - "compatibility with later lawful geometry and universal coupling"
  legacy_token_guard: "SourceProbeToken_v1, SourceDetectorReadout_v1, and MatterResponseToken_v1 remain source syntax. Their names do not confer empirical or detector meaning."

null_malformed_and_underdetermined_branches:
  valid_null:
    status: "member of the valid candidate configuration space"
    required_fields: "All declared structural typing remains present; occupation, charge, current, and defect data take their declared zero values."
    nonconclusions:
      - "not absence of a source object"
      - "not physical vacuum"
      - "not nonmatter semantics"
      - "not ground-state or minimum-energy status"
  nontrivial_neutral:
    status: "valid and distinct from null"
    example_class: "Oppositely labeled occupations or a nonzero closed current can have zero total charge-label while retaining nonzero configuration data."
    required_guard: "Zero total charge-label alone must never define nullity."
  malformed:
    status: "outside the admissible candidate configuration space"
    examples:
      - "undeclared cell or coefficient"
      - "boundary-composition failure"
      - "domain-codomain mismatch"
      - "missing required internal action or representation carrier"
      - "target, detector, stress-energy, action, process-authority, or generated-authority import"
    evaluator_result: "fail closed to bottom with an exact reason"
    required_guard: "Malformed is not a sector and must not be quotiented with the valid null configuration."
  underdetermined:
    status: "typed input exists but the declared candidate rules do not decide the requested classification"
    required_guard: "Record a scoped obstruction or guarded-undetermined result; do not silently replace missing information with zero, null, or a target interpretation."

conditional_theorem_interpretation:
  source_relabeling_sector_naturality:
    acceptable_claim: "Under the declared candidate isomorphism and compatible internal transport hypotheses, the sector index is preserved or transported to its declared orbit."
    forbidden_claim: "Physical matter sectors are gauge invariant or observationally identical."
  total_charge_statement:
    acceptable_claim: "If admissible transitions are defined by a chain-level balance equation and the augmentation annihilates incidence boundaries, then the total source charge-label is equal at the two endpoints."
    disclosure: "If transition admissibility includes the balance equation by definition, the result is a conditional algebraic invariant or consistency lemma, not an independently derived dynamical conservation law."
    forbidden_claim: "Physical charge conservation, Noether conservation, stress-energy conservation, or universal matter conservation has been derived."
  defect_statement:
    acceptable_claim: "A declared cycle determines a candidate homology class modulo declared source boundaries."
    forbidden_claim: "A stable physical topological defect exists."
  theorem_authority: "Task-local proof under explicit candidate hypotheses only; no theorem truth, ontology adoption, or physical interpretation is inferred from validator or checkpoint success."

