semantic_risks_and_counterexamples:
  - risk_id: "PHIL-RISK-001"
    class: "reification"
    counterexample: "The same finite chain complex can be interpreted as matter bookkeeping, network traffic, or abstract coloring while preserving all algebraic facts."
    implication: "Algebraic structure alone underdetermines physical matter reference."
  - risk_id: "PHIL-RISK-002"
    class: "topology_or_geometry_smuggling"
    counterexample: "An incidence edge records a declared source relation but supplies no length, causal precedence, Lorentzian signature, neighborhood scale, or target-manifold chart."
    implication: "Combinatorial adjacency cannot be called physical locality or spacetime geometry."
  - risk_id: "PHIL-RISK-003"
    class: "sector_identity_collapse"
    counterexample: "A nonzero charge-neutral pair and the valid null configuration have the same total charge-label but are different configurations."
    implication: "Sector coincidence is not configuration identity and total charge alone is not a complete taxonomy."
  - risk_id: "PHIL-RISK-004"
    class: "internal_symmetry_inconsistency"
    counterexample: "An allowed automorphism sends Q to a distinct group element while a raw-Q sector map is claimed invariant."
    implication: "The candidate must restrict the symmetry or quotient the charge label into a declared orbit."
  - risk_id: "PHIL-RISK-005"
    class: "current_as_motion_overread"
    counterexample: "A nonzero closed one-chain has zero boundary but no supplied time parameter, transport law, velocity, worldline, or detector signature."
    implication: "Current is a chain-level candidate record, not physical motion or flux."
  - risk_id: "PHIL-RISK-006"
    class: "defect_as_physical_object_overread"
    counterexample: "Changing the declared two-cell set can change homology while leaving lower-dimensional labels fixed."
    implication: "Defect status is relative to the stipulated source complex and is not a robust physical defect theorem."
  - risk_id: "PHIL-RISK-007"
    class: "superselection_overread"
    counterexample: "A taxonomy may partition configurations even when later admitted transitions connect the partitions."
    implication: "Sector does not mean dynamically superselected sector without a separate transition-invariance result."
  - risk_id: "PHIL-RISK-008"
    class: "emergence_overread"
    counterexample: "Calling a nonzero assignment an excitation supplies neither a derived base state nor a stability or dynamics theorem."
    implication: "Physical emergence and substrate excitation remain undecided."
  - risk_id: "PHIL-RISK-009"
    class: "null_malformed_conflation"
    counterexample: "A record missing its charge group is not equivalent to a valid record whose charge is the group identity."
    implication: "Missing or malformed data must fail closed rather than be imputed as zero."
  - risk_id: "PHIL-RISK-010"
    class: "operational_semantics_smuggling"
    counterexample: "A relabeling-invariant integer can be computed without any apparatus, calibration, unit, or possible outcome relation."
    implication: "Invariance does not make a source record empirically observable."
  - risk_id: "PHIL-RISK-011"
    class: "conservation_law_smuggling"
    counterexample: "Defining admissible transitions to satisfy a balance equation guarantees endpoint equality by construction."
    implication: "The result is a candidate consistency condition unless independent dynamics derives that admissibility rule."
  - risk_id: "PHIL-RISK-012"
    class: "legacy_status_laundering"
    counterexample: "A positive-sounding legacy profile label retains exactly the same fields whether it is called evidence or adopted semantics."
    implication: "Names and profile mappings cannot change tracked authority status."

required_fusion_corrections:
  - correction_id: "PHIL-CORR-001"
    severity: "blocking_for_parent_fusion"
    requirement: "State the four levels explicitly: stipulated candidate primitives, candidate-derived mathematical invariants, open physical interpretation, and protected ontology adoption."
    acceptance_test: "No sentence moves from mathematical construction to physical matter or canonical ontology without a separately named future authority."
  - correction_id: "PHIL-CORR-002"
    severity: "blocking_for_parent_fusion"
    requirement: "Include the identity ladder and say that candidate relabeling equivalence is neither general EqSrc nor physical observational equivalence."
    acceptance_test: "Presentation identity, candidate isomorphism, sector coincidence, and physical identity are not conflated."
  - correction_id: "PHIL-CORR-003"
    severity: "blocking_for_parent_fusion"
    requirement: "Define how internal automorphisms interact with the sector map: fix the raw charge or use its declared orbit."
    acceptance_test: "Every allowed internal symmetry transports the sector index according to an explicit equation."
  - correction_id: "PHIL-CORR-004"
    severity: "blocking_for_parent_fusion"
    requirement: "Use source-invariant record as the primary term and reserve empirical or operational observable for a later detector-semantics route."
    acceptance_test: "No invariant is described as measured, observable by an agent, calibrated, or physically operational."
  - correction_id: "PHIL-CORR-005"
    severity: "blocking_for_parent_fusion"
    requirement: "Label the total-charge result as a conditional chain-level source-label invariant and disclose when it follows from the definition of admissible transition."
    acceptance_test: "The packet makes no physical, Noether, stress-energy, or dynamical conservation claim."
  - correction_id: "PHIL-CORR-006"
    severity: "blocking_for_parent_fusion"
    requirement: "Keep valid null, valid nontrivial neutral, malformed, and underdetermined records as four distinct branches."
    acceptance_test: "Neither missing data nor zero total charge is sufficient to classify a record as null."
  - correction_id: "PHIL-CORR-007"
    severity: "blocking_for_parent_fusion"
    requirement: "Provide an object-by-object legacy mapping with exact inherited status and an explicit no-upgrade field."
    acceptance_test: "PositiveMSProfile_v1, readiness objects, bridge objects, and candidate-law schemas retain their tracked status."
  - correction_id: "PHIL-CORR-008"
    severity: "blocking_for_parent_fusion"
    requirement: "State that incidence, orientation, coefficients, internal groups, and transition grammar are task-local candidate assumptions rather than source-derived physical primitives."
    acceptance_test: "No combinatorial cell, arrow, orientation, or homology class is identified with spacetime, causal, or physical topology."
  - correction_id: "PHIL-CORR-009"
    severity: "blocking_for_parent_fusion"
    requirement: "Describe the nontrivial witness as existence inside the finite candidate model only."
    acceptance_test: "The witness is not evidence that physical matter exists, that the ontology is realized, or that matter coupling is possible."
  - correction_id: "PHIL-CORR-010"
    severity: "blocking_for_parent_fusion"
    requirement: "Retain exact-GR recovery and human-gated adoption as explicit downstream obligations."
    acceptance_test: "The packet neither uses the exact-GR benchmark as a premise nor changes P6 Gate B, effective-metric, coupling, or benchmark status."

unique_philosophical_contributions:
  - contribution_id: "PHIL-UNIQUE-001"
    statement: "The packet needs a model-to-world separation: a genuine mathematical ontology inside a model is not yet an ontology of physical matter."
  - contribution_id: "PHIL-UNIQUE-002"
    statement: "Sector identity is deliberately coarser than configuration identity and much weaker than physical individuation or superselection."
  - contribution_id: "PHIL-UNIQUE-003"
    statement: "Physical emergence remains open even when sector and defect invariants are mathematically derived; algebraic emergence and physical emergence are different claims."
  - contribution_id: "PHIL-UNIQUE-004"
    statement: "Candidate transitions provide no diachronic identity for particles or excitations. They encode endpoint relations and balance only."
  - contribution_id: "PHIL-UNIQUE-005"
    statement: "Internal symmetry is not observer redundancy by default. Its interpretive role depends on a later physical semantics and cannot be inferred from equivariance alone."
  - contribution_id: "PHIL-UNIQUE-006"
    statement: "A source invariant becomes operational only after a separately justified measurement relation, calibration, localization, and robustness package."
  - contribution_id: "PHIL-UNIQUE-007"
    statement: "The valid null record is a mathematical basepoint; malformed and underdetermined records are epistemic or typing failures and must not be ontologized as vacuum or nonmatter."

