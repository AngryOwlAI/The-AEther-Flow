    - "audit null, malformed, and underdetermined branches"
    - "map legacy profile evidence without status change"
    - "state exact-GR recovery and protected-adoption obligations"
  forbidden:
    - "canonical ontology edit or source-law adoption"
    - "canonical-ontology candidate, adopted, or rejected status"
    - "physical matter, charge, current, defect, gauge, or conservation-law adoption"
    - "target atlas, metric, effective geometry, stress-energy, matter action, detector semantics, or coupling import"
