naturality_proof_skeleton:
  hypotheses:
    - "F_i are source-basis chain isomorphisms with F_(i-1) partial_i = partial_i_prime F_i."
    - "alpha: A_int -> A_int_prime and beta: B_def -> B_def_prime are group isomorphisms."
    - "gamma: R_decl -> R_decl_prime is a label bijection compatible with the internal-group isomorphism."
    - "chi_prime gamma = alpha chi."
    - "F_0 is induced by a vertex bijection and preserves augmentation."
  induced_maps:
    charge_chains: "L_i^A = F_i tensor alpha"
    defect_chains: "L_i^B = F_i tensor beta"
    occupations: "m_prime(F_0 v, gamma r) = m(v,r)"
  configuration_check:
    derivation: "q_prime_(F_0 v) = sum_r m(v,r) chi_prime(gamma r) = alpha(sum_r m(v,r) chi(r))"
    consequence: "the derived-charge admissibility condition is preserved"
  transition_check:
    derivation: "partial_1_prime L_1^A J = L_0^A partial_1 J = L_0^A(q_plus-q_minus)"
    consequence: "charge-current admissibility is preserved"
  defect_check:
    derivation: "partial_1_prime L_1^B z = L_0^B partial_1 z = 0 and L_1^B partial_2 w = partial_2_prime L_2^B w"
    consequence: "cycles, boundaries, and defect classes transport functorially"
  sector_check:
    total_charge: "Q_prime(Psi_prime) = alpha(Q(Psi))"
    defect: "[z_prime] = H_1(F;beta)[z]"
    representation_grade: "M_prime = gamma_* M"
  malformed_check:
    derivation: "An isomorphism maps a nonzero continuity residual to a nonzero residual."
  theorem_scope: "exact source-presentation equivariance for the declared proposal-only candidate"
  excluded_claims:
    - "target-coordinate covariance"
    - "diffeomorphism invariance"
    - "physical gauge invariance"
    - "physical equivalence"
    - "canonical EqSrc theorem"

risks_and_counterexamples:
  - risk_id: "P7T01-RISK-001"
    counterexample: "Take one occupied vertex and independently assign two different q values while keeping nu and r fixed. The current draft admits both, so q is not determined by the proposed matter degree of freedom."
    mitigation: "derive q through chi and occupation multiplicities"
  - risk_id: "P7T01-RISK-002"
    counterexample: "Let Pi replace one charge-neutral pair of representation labels by another while preserving q and z. The current transition remains admissible but M_r changes."
    mitigation: "separate invariant sector from representation grade or constrain Pi"
  - risk_id: "P7T01-RISK-003"
    counterexample: "A finite free chain complex may have a one-boundary whose coefficients do not sum to zero; then epsilon partial_1 is nonzero and the total-charge proof fails."
    mitigation: "make augmented incidence an explicit axiom"
  - risk_id: "P7T01-RISK-004"
    counterexample: "If a two-cell f with partial_2 f=ell is added to the witness, [ell]=0 even though ell is a nonzero cycle."
    mitigation: "retain C_2=0 in the witness or compute image(partial_2) explicitly before calling a defect class nontrivial"
  - risk_id: "P7T01-RISK-005"
    counterexample: "An arbitrary permutation of representation labels need not preserve charge assignment or representation type."
    mitigation: "restrict gamma by chi_prime gamma = alpha chi and representation transport compatibility"
  - risk_id: "P7T01-RISK-006"
    counterexample: "Calling O_src an operational observable can be read as detector semantics even when it is only an algebraic invariant record."
    mitigation: "prefer source-invariant bookkeeping record and explicitly defer operational protocols"
  - risk_id: "P7T01-RISK-007"
    counterexample: "Calling [z] a topological defect can import spacetime topology."
    mitigation: "call it finite incidence homology or combinatorial defect class and retain the explicit no-spacetime-topology guard"

