consensus:
  shared_conclusion: "A finite augmented source-incidence complex with internal coefficient data can support a nontrivial proposal-only source-matter configuration space, algebraic charge sectors, current constraints, and defect classes without importing target geometry."
  mathematical_disposition: "conditionally_acceptable_after_required_corrections"
  no_hidden_target_import_found: true
  current_draft_strength: "The boundary-chain, homology, continuity, null, and malformed constructions are mathematically viable and materially stronger than the legacy interface-label packets."
  current_draft_limit: "As presently written, q and r are independent labels subject only to a support condition, and the internal-group representation structure is not connected to either q or the naturality theorem. The draft therefore has not yet fully answered the legacy arbitrary-nonbottom-label stress."
  authority_conclusion: "The construction can be an exact theorem inside the task-local proposal, but it cannot establish physical matter, physical charge, a physical conservation law, canonical ontology, matter coupling, or GR recovery."

recommended_mathematical_core:
  augmented_source_incidence_complex:
    datum: "K_src = (C_2 --partial_2--> C_1 --partial_1--> C_0 --epsilon--> Z)"
    coefficient_ring: "Z"
    requirements:
      - "Each C_i is a finite free abelian group with a declared source-cell basis."
      - "partial_1 partial_2 = 0."
      - "epsilon partial_1 = 0."
      - "For link incidence, every one-cell boundary has one declared positive endpoint and one declared negative endpoint, allowing a self-loop to have zero boundary."
    interpretation: "finite algebraic source incidence only"
  internal_candidate_datum:
    tuple: "I_src = (G_int, A_int, B_def, R_decl, chi)"
    fields:
      G_int: "declared internal group; no physical gauge interpretation"
      A_int: "finitely generated abelian source charge-label group"
      B_def: "finitely generated abelian source defect-label group"
      R_decl: "finite set of declared internal representation labels, with an empty label 0_R"
      chi: "charge-label map chi: R_decl -> A_int with chi(0_R)=0"
    compatibility: "For an admissible internal-data isomorphism (phi, alpha, beta, gamma), require chi_prime(gamma(r)) = alpha(chi(r)); if R_decl names actual representation classes, also require gamma([V]) = [V composed with phi_inverse]."
  configuration:
    preferred_occupation_field: "m: V x R_decl -> N_0 with finite support"
    derived_fields:
      occupation: "nu(v) = sum_r m(v,r)"
      local_charge: "q_v = sum_r m(v,r) chi(r)"
      charge_chain: "q(Psi) = sum_v q_v [v] in C_0(K_src; A_int)"
      representation_content: "M_r(Psi) = sum_v m(v,r)"
    independent_defect_field: "z in ker(partial_1: C_1(K_src; B_def) -> C_0(K_src; B_def))"
    reason_for_derivation: "This makes nonzero charge and representation content consequences of declared source occupation data rather than independent matter-named tags."
  transition:
    tuple: "T = (Psi_minus, J, w, Pi, Psi_plus)"
    charge_current_constraint: "q_plus - q_minus = partial_1 J"
    defect_constraint: "z_plus - z_minus = partial_2 w"
    occupation_update: "Pi must map the declared occupation multiset and must be compatible with the derived q fields; P7-T01 still does not select which admissible transition occurs."
    physical_dynamics_claimed: false
  sector_and_stratum_split:
    transition_invariant_sector: "Sigma_inv(Psi) = (Q(Psi), [z]) in A_int x H_1(K_src; B_def)"
    total_charge: "Q(Psi) = epsilon_A(q(Psi))"
    representation_grade: "M(Psi) in N_0^(R_decl), equivariant under label bijections but not conserved unless Pi is separately constrained"
    presentation_invariant_record: "O_src(Psi) = (N(Psi), Q(Psi), [z], M(Psi))"
    configuration_strata:
      - "null: m=0 and z=0"
      - "neutral_nulldefect_excitation: m is nonzero, Q=0, and [z]=0"
      - "charged_excitation: Q is nonzero"
      - "defect_excitation: [z] is nonzero"
      - "mixed_excitation: Q and [z] are both nonzero"
    warning: "Do not call the entire tuple (Q, [z], M) transition-conserved unless Pi is required to preserve M."

mathematical_findings:
  - finding_id: "P7T01-MATH-001"
    severity: "blocking_before_fused_acceptance"
    topic: "charge and representation binding"
    finding: "The current draft permits arbitrary q_v and r(v) whenever nu(v) is nonzero. Hence a nonzero q or a label rho can still be attached by declaration, reproducing the precise arbitrary-nonbottom-label weakness identified by the legacy Refuter."
    required_correction: "Add a declared source-side map chi: R_decl -> A_int and derive q_v from occupation multiplicities and chi. A minimal single-label variant is q_v = nu(v) chi(r(v)); the more robust variant uses m(v,r) and q_v = sum_r m(v,r) chi(r)."
    why_required: "Without this relation, charge and representation are parallel bookkeeping fields, not an integrated source-matter ontology."
  - finding_id: "P7T01-MATH-002"
    severity: "blocking_before_internal_automorphism_claim"
    topic: "internal symmetry"
    finding: "G_int is declared, but the current draft specifies neither its representations nor its action on A_int, B_def, R_decl, configurations, or transitions."
    required_correction: "Define the admitted internal-data automorphisms and require chi_prime gamma = alpha chi. State equivariance under those automorphisms, not an unqualified internal gauge invariance."
    why_required: "A bare group name and a label bijection do not establish representation or internal-automorphism naturality."
  - finding_id: "P7T01-MATH-003"
    severity: "major_precision"
    topic: "sector versus grade"
    finding: "The current composite sector includes M_r, but admissible transitions constrain only charge and defect chains. Therefore Q and [z] are preserved, while M_r may change through the unconstrained update record Pi."
    required_correction: "Either define the transition-invariant sector as (Q,[z]) and call M_r a representation grade, or add an explicit representation-content continuity rule if M_r is intended to be sector-preserved."
    why_required: "The candidate should not silently identify a presentation-invariant descriptor with a transition invariant."
  - finding_id: "P7T01-MATH-004"
    severity: "major_precision"
    topic: "augmentation"
    finding: "epsilon partial_1 = 0 is essential to the total-charge calculation but is not a consequence of an arbitrary finite chain complex."
    required_correction: "Include the augmentation or the endpoint-incidence condition in the definition of admissible K_src, rather than only asserting it after the definition."
    why_required: "The total-charge theorem depends exactly on this hypothesis."
  - finding_id: "P7T01-MATH-005"
    severity: "major_precision"
    topic: "coefficientwise naturality"
    finding: "The naturality proof informally writes F_i with alpha or beta applied coefficientwise, but F_i was introduced only on integer chain groups."
    required_correction: "Name the extended maps F_i tensor alpha on A_int chains and F_i tensor beta on B_def chains, then write the commuting squares with those maps."
    why_required: "This removes a type mismatch and makes the equivariance equation exact."
  - finding_id: "P7T01-MATH-006"
    severity: "major_precision"
    topic: "identity language"
    finding: "The phrase source-equivalence orbit may be overread as the canonical EqSrc relation, while the task only defines task-local chain and internal-data isomorphisms."
    required_correction: "Use task-local candidate-presentation-isomorphism orbit unless an exact registered EqSrc comparison is separately supplied."
    why_required: "The correction preserves the canonical source-equivalence burden."
  - finding_id: "P7T01-MATH-007"
    severity: "accepted"
    topic: "current and defect constraints"
    finding: "Given an augmented incidence complex, q_plus-q_minus=partial_1 J implies preservation of total source charge labels, and z_plus-z_minus=partial_2 w implies preservation of the defect homology class."
    exact_scope: "kinematic theorem inside the proposal-only candidate"
  - finding_id: "P7T01-MATH-008"
    severity: "accepted"
    topic: "malformed branch"
    finding: "The J=0 branch for endpoints whose charge difference is [v]-[u] has a nonzero residual and fails closed. Invertible source relabeling cannot map that nonzero residual to zero."
    exact_scope: "task-local malformed-transition result"

