  milestone_burden: "Replace interface-only matter profiles with an actual matter ontology target."
  missing_source_law: "A source-side matter ontology defining configurations, sector membership, internal charges, currents, defect classes, representation labels, and malformed configurations independently of effective geometry and coupling."
  underdetermination_statement: "Current ontology does not derive a source-side matter ontology with configuration, sector, charge, current, defect-class, representation, and malformed-configuration laws."
  no_go_theorem_status: "not_proved"
  adoption_status:
    current_adoption: "blocked"
    continuation: "open"
    status_pair: "blocked_adoption_open_continuation"
  packet_payload_mode: "candidate_law_payload"
  candidate_law_payload:
    status_label: "proposal-only"
    source_side_definition: "Define source-matter configurations and transitions over a finite source incidence complex with internal labels, chain-level charges and currents, defect homology classes, and fail-closed admissibility."
    formal_objects:
      - "SourceMatterIncidenceCandidate_v1"
      - "SourceMatterSectorMap_v1"
      - "SourceMatterTransition_v1"
      - "SourceMatterMalformed_v1"
    domains:
      - "finite source incidence complexes"
      - "finitely generated abelian internal charge groups"
      - "finite internal representation-label sets"
      - "admissible and malformed source configurations"
    maps:
      - "source configuration to total charge and defect sector"
      - "source transition to chain-level continuity status"
      - "source configuration to source-invariant record"
      - "source configuration to admissible null or malformed status"
    proof_obligations:
      - "define every object from source-side data and source equivalence only"
      - "give one nontrivial admissible configuration"
      - "give one null configuration"
      - "give one explicit malformed configuration and failed axiom"
      - "prove source-relabeling and internal-automorphism equivariance"
      - "prove total source-charge conservation for admissible transitions"
      - "preserve exact-GR recovery obligations before any later adoption"
  exact_gr_recovery_obligations:
    checklist:
      - "keep exact GR as a target benchmark rather than a source premise"
      - "derive any later effective geometry independently from source structure"
      - "derive any physical charge interpretation detector semantics matter action stress energy and coupling in later distinct burdens"
      - "derive Einstein equations and benchmark comparison only after their named burdens"
      - "retain protected human authority for any ontology or benchmark promotion"
  no_target_import_audit_scope:
    forbidden_source_classes:
