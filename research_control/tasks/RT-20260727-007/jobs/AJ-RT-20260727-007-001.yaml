      - "stress_energy_semantics"
      - "matter_action"
      - "detector_semantics"
      - "coupling_law"
  known_risks:
    - "combinatorial incidence mistaken for adopted physical spacetime geometry"
    - "internal labels mistaken for measured physical charges"
    - "source invariants mistaken for detector observables"
    - "proposal-only theorem mistaken for a canonical conservation law"
  failed_alternatives:
    - "reuse interface-only matter-profile labels as ontology; rejected because labels and certificates do not supply intrinsic source degrees of freedom"
    - "use the frozen P6 geometry package; rejected because Gate B remains zero of eight and P7-T01 assumes no effective geometry"
