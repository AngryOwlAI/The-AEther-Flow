  - finding_id: "CF-03"
    finding: "Under an explicit conservative fixed-source-law product hypothesis, occurrence decorations cannot change the reduced principal data, so R_PS is fibre-constant."
    qualification: "This is a conditional control, not a current-source derivation of the combined extension category."
