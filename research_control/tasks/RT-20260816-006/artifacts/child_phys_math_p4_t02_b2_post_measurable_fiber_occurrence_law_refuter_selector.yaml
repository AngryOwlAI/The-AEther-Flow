new_mathematical_payloads:
  payload_count: 6
  payloads:
    - payload_id: "NMP-RT016-006-PM-001"
      payload_type: "theorem"
      title: "Image factorization and all-domain uniqueness theorem"
      exact_scope: "Set-level relevance maps, with a separate structured-naturality gate."
      statement: "For U:X->D, q:X->im(U), and R:X->Y, a unique f_im:im(U)->Y satisfying R=f_im after q exists exactly when R is constant on every U-fibre. An all-D factor exists exactly when f_im extends across i:im(U)->D. If U is surjective it is unique. If U is not surjective, Y has at least two elements, and one unrestricted set-level extension exists, then at least two extensions exist. The singleton-Y exception is explicit."
      hypotheses:
        - "X, D, and Y are sets and U and R are total functions."
        - "For the nonuniqueness clause, D minus im(U) is nonempty and Y contains two distinct elements."
        - "For categorical or natural factors, the induced f_im must separately be proved to be a morphism or natural transformation."
      proof:
        - "If R=f_im after q, then U(x)=U(x') implies q(x)=q(x') and hence R(x)=R(x')."
        - "If R is fibre-constant, define f_im(U(x))=R(x). Fibre constancy makes the definition independent of representative; q is surjective, so the factor is unique."
        - "An all-D factor is precisely an extension of f_im across i. If U is surjective, i is the identity and uniqueness follows."
        - "If d0 lies outside im(U) and y0 differs from y1 in Y, changing only f_D(d0) between y0 and y1 yields two factors with the same composite after U."
      falsifier: "A same-fibre pair with unequal R values falsifies factorization. A non-surjective U with a singleton Y falsifies an overbroad claim that all-D uniqueness always requires surjectivity."
      novelty_relative_to_predecessors: "RT003 recorded a generic same-reduct criterion. This payload types its exact P4-T01 determinant-line codomain, separates im(U) from D, states the singleton exception, and adds the structured-naturality gate."
      global_no_go: false
    - payload_id: "NMP-RT016-006-PM-002"
      payload_type: "theorem"
      title: "Product-expansion old-language conservativity theorem"
      exact_scope: "Theory-scope conservativity, not definitional eliminability."
      statement: "If every current-source model d has at least one occurrence expansion e and the extension imposes no new constraint on the old source signature, then the reduct U:D times E_occ->D is surjective and every old-language countermodel expands. Therefore the product theory adds no old-language consequence. Multiple same-reduct p or coupling expansions still prevent a definitional-extension claim."
      hypotheses:
        - "E_occ is nonempty over every admitted d."
        - "New axioms constrain only extension data and do not restrict old-source interpretations."
      proof:
        - "Let phi be an old-language sentence not entailed by the old theory and choose an old model d with not phi."
        - "Choose any admitted e over d. The combined model (d,e) satisfies the product extension while its reduct still falsifies phi."
        - "Hence the extension cannot entail a new old-language sentence. Distinct e over the same d show that e is not uniquely definable from d."
      falsifier: "An old model with no admitted expansion, or an extension axiom that removes an old model, falsifies theory-scope conservativity. A unique definability proof for p and coupling would falsify the nondefinitional clause."
      novelty_relative_to_predecessors: "Separates model-theoretic old-language conservativity from the fixed RT003 same-reduct nondefinability of the occurrence primitive."
      global_no_go: false
    - payload_id: "NMP-RT016-006-PM-003"
      payload_type: "explicit_witness"
      title: "Conservative source-principal factor witness"
      exact_scope: "The fixed P4-T01 lawful reduction under a noninteracting occurrence product."
      statement: "For X_prod=D times E_occ, U=projection_D, and R_cons(d,e)=r0(d), R_cons is U-fibre-constant and factors uniquely through all D as r0 because U is surjective."
      proof:
        - "Two expansions with the same d have identical r0(d), independently of p, coupling, initial law, or realization data."
        - "Nonemptiness of E_occ makes the projection surjective, so NMP-RT016-006-PM-001 gives the unique all-D factor."
      falsifier: "A source-typed term in the principal coefficients or reduction that depends on e produces a same-reduct pair with different R_PS and falsifies this conservative witness for that combined theory."
      novelty_relative_to_predecessors: "Connects the occurrence proposal to the registered P4-T01 principal extraction without calling either object physical."
      global_no_go: false
    - payload_id: "NMP-RT016-006-PM-004"
      payload_type: "countermodel"
      title: "Coefficient-entry and reduction-entry nonfactorization controls"
      exact_scope: "Source-side formal countermodels only; neither coupling is adopted."
      statement: "Let D={d_star}, E={0,1}, X=D times E, and U constant. On a source chart with independent vector fields Z0 and Z1, define L_e u=Z_e u. Then R_PS(d_star,0) and R_PS(d_star,1) have characteristic hyperplanes k(Z0)=0 and k(Z1)=0 and are unequal, so no factor exists. Separately, for diag(k(Z0),k(Z1)), let e choose the admitted reduced channel; the reduced symbols again differ on one U-fibre."
      proof:
        - "Choose a covector k with k(Z0)=0 and k(Z1) nonzero. It belongs to the first characteristic set but not the second."
        - "For the reduction control, the e=0 and e=1 reduced one-channel determinant factors are k(Z0) and k(Z1), which the same covector separates."
        - "Both pairs have identical current reduct because U forgets the added occurrence-to-operator or occurrence-to-reduction coupling. NMP-RT016-006-PM-001 therefore forbids factorization."
      falsifier: "If source axioms force Z0=Z1 or force the two reduced channels to be equivalent in Y_PS, the displayed separating covector disappears and this particular control fails."
      novelty_relative_to_predecessors: "Shows exactly how occurrence data could become P4 material through coefficients or lawful reduction, so conservative factorization may not be assumed."
      global_no_go: false
    - payload_id: "NMP-RT016-006-PM-005"
      payload_type: "countermodel"
      title: "Nonselection is logically independent of P4 relevance"
      exact_scope: "Two-element same-reduct fibre."
      statement: "With D={d_star}, X={x0,x1}, and U constant, both R_const(x0)=R_const(x1) and R_sep(x0) not equal to R_sep(x1) have identical reduct multiplicity and occurrence nonselection. R_const factors and R_sep does not. Therefore nonselection, nonidentifiability, or multiple expansions alone implies neither P4 irrelevance nor P4 relevance."
      proof:
        - "Apply the fibre criterion to each map. Constancy holds for R_const and fails for R_sep."
        - "The domain X and reduct U are identical in both models, so the opposite conclusions cannot follow from fibre multiplicity alone."
      falsifier: "An additional independently sourced axiom that fixes all admissible R values on each fibre removes one of the two models and may support a scoped consequence."
      novelty_relative_to_predecessors: "Turns the RT005 nonselection boundary into an exact theorem-admission control for Routes A and B."
      global_no_go: false
    - payload_id: "NMP-RT016-006-PM-006"
      payload_type: "dependency_map_update"
      title: "Narrow P4-T01 codomain availability and bridge-materiality criterion"
      exact_scope: "Packet readiness only."
      statement: "The registered P4-T01 source supplies Y_PS and r0 for the fixed lawful reduction, so a narrow principal-relevance audit is formed. It does not supply physical response, detector semantics, universal matter sectors, occurrence coupling, or a full P4 outcome map. A later bridge is material only if its carrier, maps, covariance, response semantics, and failure modes are source-provenanced and distinct from all nine freezes."
      proof:
        - "The P4-T01 specification explicitly types V_red, W_eq, sigma_L, P_D, determinant-line covariance, characteristic sets, and multiplicities."
        - "The same source explicitly denies physical-cone, metric, matter-universality, and response interpretations."
        - "Thus Y_PS is sufficient for Route A but insufficient for a global Route B irrelevance claim or an untyped Route C bridge."
      falsifier: "A registered current-source map from the occurrence law to a broader P4 response codomain, with independent provenance and exact fibres, would enlarge the presently available audit target."
      novelty_relative_to_predecessors: "Resolves the prior codomain-readiness gap narrowly without overreading P4-T01."
      global_no_go: false

