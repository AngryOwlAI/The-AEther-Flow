  selected_route_id: "A_CURRENT_SOURCE_OCCURRENCE_ADMISSIBILITY_RELEVANCE_FACTORIZATION_AUDIT"
  decision_basis: "P4-T01 supplies a registered source-principal codomain, while RT005 proves only that the occurrence-law candidate lacks robust selection force. A valid P4 irrelevance claim still requires a typed combined extension space, forgetful map, relevance map, conservative-extension boundary, and fibre theorem. Route A is the lowest-assumption formed packet that can prove factorization, exhibit nonfactorization, or identify the first typing/provenance obstruction. Route B depends on that audit, Route C adds higher-risk new bridge structure before relevance is known, and Route D is premature."
  theoretical_method: "Type the current source-law category D, a candidate occurrence/admissibility extension category X, the forgetful map U:X->D, the registered determinant-line principal-data codomain Y_PS, and the P4 relevance map R:X->Y_PS. Prove or refute fibre constancy, construct the factor on im(U), state the surjectivity condition for global uniqueness, prove source-arrow naturality, and separate conservative occurrence-only variations from changes to highest-derivative coefficients or the constraint/gauge reduction."
  decision_consequence: "After this transaction is checkpointed, one separately admitted Ontology Formalizer AgentJob may execute the bounded audit. A factorization theorem would license a later scoped occurrence-law irrelevance theorem; a same-reduct nonfactorization witness would show genuine P4 dependence; a typing/provenance obstruction would identify the exact missing source primitive before any bridge proposal."
  constructive_preference_note: "The packet constructs or precisely obstructs the missing dependency diagram using existing registered source-principal data. It adds no candidate law or bridge and therefore carries less assumption debt than Route C."
  preserves_claim_blocks: true
  requires_human_gate: false
  human_gate_reason: ""
  selected_packet_executed: false

new_mathematical_payload:
  - payload_id: "NMP-RT016-006-001"
    payload_type: "factorization_theorem_target"
    object_name: "OccurrenceP4FibreConstancyFactorization_v1"
    summary: "For U:X->D and R:X->Y_PS, R factors through U on im(U) exactly when R is constant on each U-fibre."
    proof_control: "Define f(U(x))=R(x); fibre constancy gives well-definedness, and the converse follows from R=f after U."
    falsifier: "Two elements x1,x2 with U(x1)=U(x2) but R(x1) distinct from R(x2)."
  - payload_id: "NMP-RT016-006-002"
    payload_type: "factor_uniqueness_scope"
    object_name: "ImageFactorVersusGlobalUniqueness_v1"
    summary: "The factor is unique on im(U); uniqueness on all of D requires U to be surjective or an independently fixed extension off im(U)."
    proof_control: "Two finite factors agreeing on im(U) but differing outside it provide the exact non-surjective countercontrol."
    falsifier: "A proof that values outside im(U) are forced without surjectivity or additional structure."
  - payload_id: "NMP-RT016-006-003"
    payload_type: "operator_dependence_control"
    object_name: "ConservativeOccurrencePrincipalDataConstancy_v1"
    summary: "On the declared conservative subcategory that holds the source equations, background, principal coefficients, constraints, gauge generators, and reduced quotient fixed, the registered P4-T01 principal data is constant across occurrence-law variations."
    proof_control: "The principal map depends only on the fixed reduced highest-derivative operator; exact p, coupling, initial-law, and rate-duration fixtures all return the same determinant-line signature."
    falsifier: "Occurrence data changes a highest-derivative coefficient, constraint space, gauge generator, or reduced quotient while the pair is still claimed to lie in one conservative U-fibre."
  - payload_id: "NMP-RT016-006-004"
    payload_type: "nonfactorization_countercontrol"
    object_name: "OccurrenceDiagnosticVersusP4RelevanceSeparation_v1"
    summary: "The occurrence parameter p varies within one declared fixed-source-law fibre and therefore does not itself factor through the source-law reduct; this does not imply the independently typed P4 map behaves the same way."
    proof_control: "Exact p=1/3,2/3,3/4 fixtures share one base source datum while their occurrence diagnostics differ."
    falsifier: "A current-source theorem identifying p as a function of the fixed source-law reduct."
  - payload_id: "NMP-RT016-006-005"
    payload_type: "route_dependency_map"
    object_name: "AuditBeforeIrrelevanceOrBridge_v1"
    summary: "A scoped irrelevance theorem or new response bridge is downstream of the typed relevance audit: factorization supports the theorem, nonfactorization demands genuine dynamics analysis, and typing failure identifies the missing primitive."
    proof_control: "Each audit result has a distinct non-promotional roadmap consequence and none requires selected-packet execution in RT006."
    falsifier: "A route-B theorem or route-C bridge already typed from current sources with a complete dependency diagram and no need for X,U,R."

