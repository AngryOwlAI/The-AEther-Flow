new_mathematical_payload:
  payload_count: 3
  payloads:
    - payload_id: "NMP-RT016-006-PHIL-001"
      payload_type: "factorization_theorem_schema"
      name: "Occurrence-extension source-principal factorization criterion"
      statement: "For U:X_OCC->D_SRC and R:X_OCC->Y_PR, a map f on im(U) with R=f after U exists exactly when R is constant on every U-fibre. If U is surjective, f is uniquely defined on all D_SRC."
      proof: "Necessity follows because equal U-images have equal f(U(-)) values. For sufficiency, define f(d)=R(x) for any x with U(x)=d; fibre constancy makes the value independent of the choice. Surjectivity is required only to define and uniquely determine f on every d outside im(U)."
      falsifier: "A pair x0,x1 with U(x0)=U(x1) but R(x0) different from R(x1) disproves factorization."
    - payload_id: "NMP-RT016-006-PHIL-002"
      payload_type: "operator_dependence_lemma"
      name: "Conservative occurrence decorations have no source-principal selector force"
      statement: "If occurrence or admissibility data changes neither the highest-derivative equation coefficients nor the constraint, gauge, redundancy, and reduction data, then R=F_P4T01 after U and all P4-T01 symbol, polynomial, multiplicity, and branch data are constant on U-fibres."
      proof: "Under the hypotheses, same-reduct expansions have the same reduced field and equation spaces and the same leading operator. Principal-symbol formation and determinant-line reduction therefore return identical Y_PR data, giving fibre constancy and the factorization criterion."
      scope_guard: "This proves only source-principal independence under H_CONS. It does not prove irrelevance to lower-order dynamics, physical response semantics, matter-sector assignment, empirical interpretation, or every P4-T02 acceptance criterion."
      falsifier: "Let an occurrence bit e enter a leading coefficient so that L_e=L_0+eY, or let it change a constraint or gauge quotient. Then sigma_e(k)=sigma_0(k)+e k(Y) or the reduced domain changes, and same-reduct expansions can have different R values."
    - payload_id: "NMP-RT016-006-PHIL-003"
      payload_type: "dependency_and_semantic_boundary_theorem"
      name: "Nonselection does not entail P4 irrelevance"
      statement: "Failure to select an occurrence law concerns multiplicity of extensions; P4 principal irrelevance concerns constancy of R on U-fibres. Neither proposition implies the other without a typed U, R, and codomain."
      proof: "A nonunique extension family can have constant R, yielding nonselection plus principal irrelevance, or varying R, yielding nonselection plus principal relevance. Conversely, a unique extension can be principal-relevant. These logically possible cases separate cardinality from dependence."
      falsifier: "A derivation showing that extension nonuniqueness alone logically forces fibre constancy or nonconstancy for every typed R would refute the separation; no such implication exists."

