stress_branches:
  - branch_id: "STRESS-01-FIXED-BOUNDARY"
    dimension_id: "fixed_candidate_and_rt003_audit_preservation"
    exact_result: "Every exact conditional RT001 and RT003 theorem survives; the Refuter attacks only standalone robust occurrence and clock-selection force."
    disposition: "fixed_mathematics_and_narrow_source_purity_preserved"
  - branch_id: "STRESS-02-COUPLING-ISOLATION"
    dimension_id: "natural_coupling_isolation_and_finite_variation"
    exact_result: "For fixed p, exchange-symmetric token-class couplings J_a satisfy max(0,2p-1)<=a<=p and d_TV(J_a,J_b)=2|a-b|. Hence the shared a=p law has arbitrarily close natural same-marginal alternatives."
    disposition: "shared_coupling_not_isolated_or_robustly_selected"
  - branch_id: "STRESS-03-PARAMETER"
    dimension_id: "kernel_parameter_identifiability"
    exact_result: "Every p in (0,1) preserves normalization, swap equivariance, restriction naturality, and total admission; no candidate equation isolates one p."
    disposition: "parameter_family_remains_unselected"
  - branch_id: "STRESS-04-STATIONARITY"
    dimension_id: "stationary_law_selector_force"
    exact_result: "The stationary measures are exactly the complement-invariant measures for every p in (0,1), so stationary snapshots select neither p, token, orbit weight, nor realized occurrence."
    disposition: "stationarity_has_zero_root_selection_force"
  - branch_id: "STRESS-05-FINITE-LAG"
    dimension_id: "finite_lag_spectral_ambiguity"
    exact_result: "K_p has spectrum {1,2p-1} and K_p^n has nontrivial eigenvalue (2p-1)^n. Every even lag identifies p and 1-p, while odd lags separate them away from p=1/2."
    disposition: "even_lag_observation_is_noninjective"
  - branch_id: "STRESS-06-CONTINUOUS-TIME"
    dimension_id: "continuous_time_embeddability_and_clock_scale"
    exact_result: "A finite homogeneous two-state CTMC embedding exists exactly for p>1/2. For p=1/2 K_p is singular; for p<1/2 det K_p<0. On the positive branch p=(1+exp(-2 lambda tau))/2, so only lambda*tau is fixed."
    disposition: "candidate_has_no_uniform_continuous_time_semantics_or_clock_normalization"
  - branch_id: "STRESS-07-OCCURRENCE"
    dimension_id: "initial_law_sample_realization_and_token_occurrence"
    exact_result: "The kernel supplies neither an initial law nor a sample seed or realization map, and the complement swap has no fixed token."
    disposition: "formal_transition_weights_do_not_select_realized_occurrence"
  - branch_id: "STRESS-08-ADMISSION"
    dimension_id: "total_admission_and_restriction_naturality"
    exact_result: "Adm equals the full section fiber, so it accepts every p and every admitted natural token-class coupling and supplies no discriminator."
    disposition: "total_admission_is_mathematically_valid_but_selector_free"
  - branch_id: "STRESS-09-EMPTY-OPEN"
    dimension_id: "empty_open_and_total_variation_scope"
    exact_result: "The empty-open fiber is a singleton fixed by complement, so all kernels collapse to the same Dirac law and total variation is zero."
    disposition: "edge_case_preserved_without_physical_metric_force"
  - branch_id: "STRESS-10-AUTHORITY"
    dimension_id: "source_provenance_physical_semantics_and_p4_relevance"
    exact_result: "No exact model, theorem, registry, validator, or checkpoint supplies independent current-source provenance, empirical calibration, physical probability, realized occurrence, clock, P4 acceptance, or adoption."
    disposition: "all_downstream_claim_and_workflow_locks_preserved"

new_mathematical_payload:
  - payload_id: "NMP-RT016-005-001"
    payload_type: "finite_variation_countermodel"
    statement: "At every p in (0,1), the shared token-class coupling a=p has arbitrarily close fully natural same-marginal alternatives a=p-epsilon with exact joint-law total variation 2 epsilon."
    falsifier: "An independently source-derived law isolating a=p from all other natural couplings would overturn this candidate-local nonisolation result."
  - payload_id: "NMP-RT016-005-002"
    payload_type: "spectral_theorem"
    statement: "The two-state kernel has nontrivial eigenvalue 2p-1 and exact n-step form with eigenvalue (2p-1)^n."
    falsifier: "A different fixed kernel or extra observed odd-lag transition data would change the inference problem but is outside the unchanged candidate."
  - payload_id: "NMP-RT016-005-003"
    payload_type: "nonidentifiability_theorem"
    statement: "For every even n, K_p^n=K_(1-p)^n, giving an exact p versus 1-p ambiguity."
    falsifier: "An independently specified one-step direction or any exact odd-lag law would distinguish the pair away from p=1/2."
  - payload_id: "NMP-RT016-005-004"
    payload_type: "embeddability_theorem"
    statement: "The complement-equivariant two-state K_p is a finite-time homogeneous CTMC transition matrix exactly when p>1/2; p=1/2 is singular and p<1/2 has negative determinant."
    falsifier: "A nonhomogeneous, discrete-time-only, or enlarged hidden-state dynamics is not covered and would require a materially different candidate."
  - payload_id: "NMP-RT016-005-005"
    payload_type: "clock_nonidentifiability_corollary"
    statement: "On the embeddable branch, K_p fixes only lambda*tau=-1/2 log(2p-1), leaving rate and elapsed time separately unselected."
    falsifier: "An independent source clock or rate standard would remove the scale freedom."
  - payload_id: "NMP-RT016-005-006"
    payload_type: "scoped_obstruction"
    statement: "The unchanged proposal cannot serve as a standalone robust natural occurrence and clock selector because its coupling, parameter, initial law, realization, and rate-duration split remain unselected."
    falsifier: "A materially distinct source-derived selection law with robustness and realization certificates could reopen continuation without invalidating this local freeze."

