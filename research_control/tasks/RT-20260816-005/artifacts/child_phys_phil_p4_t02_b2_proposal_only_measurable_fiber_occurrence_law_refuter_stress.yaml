exact_stress_results:
  natural_coupling_fragility:
    theorem: "For every p in (0,1) and every epsilon>0, the shared endpoint a=p has a distinct fully restriction-natural, source-diffeomorphism-natural, complement-equivariant same-marginal token-class coupling at b=p-delta with joint total-variation distance 2delta<epsilon."
    construction: "Choose 0<delta<min(epsilon/2, p-max(0,2p-1)); the interval gap is positive for every p in (0,1), and set b=p-delta."
    proof: "The four joint atoms change by delta, -delta, -delta, and delta, so one half of their absolute-mass sum is 2delta. The RT003 token-class proof shows every parameter in the interval is natural under restriction and pullback and complement-equivariant. Therefore the shared endpoint is not isolated in the admitted natural same-marginal family."
    decisive_scope: "candidate_internal_robust_isolation_fails"
    falsifier: "An independently source-derived admissibility axiom that excludes every b<p while preserving the fixed candidate could isolate the shared endpoint; no such axiom is present."
  kernel_spectrum_and_lags:
    matrix: "K_p=[[p,1-p],[1-p,p]]."
    spectrum: "The symmetric and antisymmetric eigenvalues are 1 and lambda=2p-1."
    n_step_formula: "K_p^n has stay probability (1+lambda^n)/2 and flip probability (1-lambda^n)/2."
    proof: "Diagonalize in the constant and sign representations of the complement involution; the corresponding eigenvalues exponentiate to 1 and lambda^n."
    even_lag_result: "For every even n, K_p^n=K_(1-p)^n because replacing p by 1-p changes lambda to -lambda and leaves lambda^n fixed."
    qualification: "Exact one-step or odd-lag access to an already chosen kernel identifies p; the obstruction is that the current source package supplies neither a source selection of p nor a calibrated observational lag law."
    falsifier: "An independently sourced calibrated odd-lag transition observable would distinguish the two roots, but it would be additional evidence not contained in the fixed proposal."
  stationary_law_nonselection:
    theorem: "For p in (0,1), T_p(mu)=mu if and only if c_*mu=mu, so the stationary class is independent of p."
    proof: "T_p(mu)-mu=(1-p)(c_*mu-mu), and 1-p is nonzero."
    orbit_result: "Each two-point orbit is uniform internally, while arbitrary probability weights among distinct complement orbits remain stationary."
    selector_result: "Stationarity selects neither p nor an orbit weight nor one token."
    falsifier: "A source-derived asymmetric stationary observable or inter-orbit transition law could add selection force; none is present."
  finite_time_symmetric_ctmc_embeddability:
    theorem: "For p in (0,1), K_p=exp(t Q_r) for finite r>=0 and finite t>0 in the homogeneous symmetric two-state CTMC class if and only if p>1/2."
    proof: "The nontrivial eigenvalue of exp(t Q_r) is exp(-2rt)>0, so equality requires 2p-1=exp(-2rt). This has a finite solution exactly when 0<2p-1<1."
    endpoint: "At p=1/2 equality is reached only as rt tends to infinity, not at finite rate-duration product."
    negative_branch: "For p<1/2 the nontrivial eigenvalue is negative and cannot equal an exponential of a finite real nonnegative rate-duration product."
    identified_quantity: "When p>1/2, only rt=-(1/2)log(2p-1) is fixed; r and t are separately unidentifiable."
    qualification: "This theorem is scoped to finite homogeneous symmetric two-state CTMC embeddings. Hidden-state, time-inhomogeneous, signed-rate, or other enlarged models are outside the fixed class and are not globally excluded."
    falsifier: "A finite r>=0 and t>0 in the same symmetric two-state class satisfying exp(-2rt)=2p-1 for p<=1/2 would falsify the theorem; no such real pair exists."
  kernel_occurrence_separation:
    theorem: "K_p fixes conditional one-step transition weights but determines neither an initial distribution nor a realized sample."
    proof: "delta_0 K_p and delta_1 K_p are distinct path-start laws. Even after choosing an initial law, a measure is not one of its sampled outcomes; a probability space and random-variable or sampling map remain additional data."
    empirical_extension_needed: "Measured frequency additionally needs an observation map, calibrated trials or path segmentation, and a convergence assumption such as an applicable ergodic theorem."
    falsifier: "An independently sourced initial law plus explicit realization and operational observation maps would define a stronger packet, but those data are absent here."
  total_admission_nonselection:
    theorem: "Adm(O)=F(O) satisfies closure and restriction conditions trivially but its characteristic predicate is identically true and therefore distinguishes no admissible from inadmissible proposal section."
    proof: "For every s in F(O), s is in Adm(O) by equality; no counterclass exists on which an admission criterion can carry selector information."
    falsifier: "A nontrivial independently source-derived subfunctor with explicit accepted and rejected sections would supply discriminating admission data."
  empty_open_and_metric_scope:
    theorem: "On each nonempty two-point complement orbit d_TV(K_p(x),K_q(x))=|p-q|, while on the unique empty-open section all kernels are the same point mass and the distance is zero."
    proof: "The nonempty orbit has two atom differences p-q and q-p; the half L1 norm is |p-q|. The empty-open fiber has one complement-fixed section and no distinct atom."
    physical_scope: "These are formal finite-fiber metrics, not physical finite-variation conditioning or an empirical norm."
    falsifier: "A claimed universal equality d_TV=|p-q| including the empty-open singleton would be false; a different nontrivial empty-open fiber would change the fixed candidate."

