ten_dimension_stress:
  required_dimension_count: 10
  stressed_dimension_count: 10
  all_dimensions_decisively_classified: true
  dimensions:
    - dimension_id: "fixed_candidate_and_rt003_audit_preservation"
      stress_status: "PRESERVED"
      exact_evidence: "The stress changes no fixed root or theorem. RT003 source_pure_as_written remains true only for disclosed written syntax, and the source-extension class remains proposal-only new ontology primitive."
      proof: "Every countermodel varies only an already admitted free proposal parameter a, p, initial law, or clock factor and introduces no target or empirical premise."
      falsifier: "Any stress step that repairs a root, changes the candidate formulas, reverses the narrow source-purity verdict, or imports a target output."
    - dimension_id: "natural_coupling_isolation_and_finite_variation"
      stress_status: "OBSTRUCTED_NONISOLATED_SHARED_ENDPOINT"
      exact_evidence: "For fixed p and every a in D_p, J_{p,a} is restriction-natural, source-diffeomorphism-natural, token-swap-equivariant, and has the fixed one-token Bernoulli-p marginals. The shared law is a=p."
      proof: "The four joint masses are a,p-a,p-a,1-2p+a. Their pairwise TV distance is 2|a-b|. For every delta>0 choose 0<epsilon<min(p,1-p,delta/2); then a=p-epsilon is admissible, distinct, fully natural, and within TV distance 2epsilon<delta of the shared endpoint."
      falsifier: "A source-derived axiom that excludes every a<p while preserving the fixed arrow class and assumptions, or any admissible a,b for which the exact TV formula fails."
    - dimension_id: "kernel_parameter_identifiability"
      stress_status: "FULL_ONE_STEP_IDENTIFIABLE_BUT_SOURCE_UNSELECTED"
      exact_evidence: "A fully labeled one-step kernel identifies p through K_p(x,{x})=p, but current source syntax, normalization, naturality, total admission, and stationarity select no value of p."
      proof: "Distinct p and q give distinct one-step diagonal masses, while the same current reduct admits every p in (0,1). Mathematical recoverability from supplied transition data is not source derivation or selection."
      falsifier: "A current-ontology term or independent source law that uniquely fixes p without target, empirical, or workflow input."
    - dimension_id: "stationary_law_selector_force"
      stress_status: "OBSTRUCTED_STATIONARY_CLASS_P_INDEPENDENT"
      exact_evidence: "For p in (0,1), mu is stationary exactly when c_*mu=mu; on each nonempty complement orbit the stationary law is uniform and does not depend on p."
      proof: "T_p(mu)-mu=(1-p)(c_*mu-mu), and 1-p is nonzero. Distinct complement orbits may retain arbitrary invariant mixture weights."
      falsifier: "A complement-asymmetric stationary measure for p in (0,1), or a stationary observable within the fixed candidate that uniquely identifies p, an orbit, or a realized token."
    - dimension_id: "finite_lag_spectral_ambiguity"
      stress_status: "OBSTRUCTED_AT_EVEN_LAGS"
      exact_evidence: "On a nonempty complement orbit spec(K_p)={1,2p-1} and K_p^n=Pi_plus+(2p-1)^n Pi_minus."
      proof: "The symmetric and antisymmetric vectors diagonalize K_p. Since 2(1-p)-1=-(2p-1), K_p^(2m)=K_(1-p)^(2m) for every positive m, whereas odd-lag or labeled one-step data distinguish the pair unless p=1/2."
      falsifier: "An even positive lag m for which K_p^(2m) differs from K_(1-p)^(2m), or a claimed ambiguity for complete labeled one-step data."
    - dimension_id: "continuous_time_embeddability_and_clock_scale"
      stress_status: "OBSTRUCTED_BRANCH_DEPENDENT_AND_SCALE_NONSELECTING"
      exact_evidence: "A finite positive-time homogeneous symmetric two-state CTMC embedding exists exactly for p>1/2. At p=1/2 the kernel is singular; for p<1/2 its nontrivial eigenvalue and determinant are negative."
      proof: "For Q_lambda=[[-lambda,lambda],[lambda,-lambda]], exp(tau Q_lambda)=Pi_plus+exp(-2lambda tau)Pi_minus. Matching K_p requires exp(-2lambda tau)=2p-1. Thus p>1/2 is necessary and sufficient, and only lambda*tau=-(1/2)log(2p-1) is fixed. At p=1/2 finite exponentials cannot be singular; at p<1/2 their determinant cannot be negative."
      falsifier: "Finite positive lambda and tau embedding p<=1/2, failure of the displayed construction for p>1/2, or separate recovery of lambda and tau from one dimensionless transition matrix."
    - dimension_id: "initial_law_sample_realization_and_token_occurrence"
      stress_status: "OBSTRUCTED_MISSING_INITIAL_AND_REALIZATION_DATA"
      exact_evidence: "K_p gives conditional transition weights only. A path law additionally requires mu_0, and an occurrence additionally requires a probability space, random variables, and an interpretation or observation map."
      proof: "For p not equal to 1/2, delta_0 K_p and delta_1 K_p differ and expose explicit dependence on the unchosen initial law. At p=1/2 the first transition erases that dependence, but the kernel still contains no rule choosing mu_0. A measure is not one of its sampled outcomes, and a stationary ensemble does not specify which omega or token is realized."
      falsifier: "A fixed-candidate term that uniquely supplies mu_0 and a realization map with operational source semantics."
    - dimension_id: "total_admission_and_restriction_naturality"
      stress_status: "PRESERVED_MATHEMATICS_ZERO_SELECTOR_FORCE"
      exact_evidence: "Adm_ext(O)=F_ext(O) is closed under every declared restriction and admits both shared and alternative natural coupling laws."
      proof: "Total admission accepts every locally constant section, so it cannot distinguish a, p, initial laws, sample paths, or clock scales. Restriction naturality remains exact but nondiscriminating."
      falsifier: "A nontrivial selector theorem derived from total admission alone, or a declared open restriction under which a valid fixed section becomes inadmissible."
    - dimension_id: "empty_open_and_total_variation_scope"
      stress_status: "PRESERVED_DEGENERATE_EDGE_CASE"
      exact_evidence: "F_ext(empty) is a singleton, complement is the identity, K_p_empty is the same Dirac kernel for all p, its spectrum is {1}, and every parameter or coupling TV distance is zero."
      proof: "There is one empty function and no antisymmetric complement orbit. Hence the nonempty-orbit spectral, |p-q| TV, coupling, and CTMC classifications are explicitly inapplicable there."
      falsifier: "A second empty-open section, a p-dependent empty kernel, a nonzero empty-open TV distance, or application of the two-state eigenvalue to the singleton."
    - dimension_id: "source_provenance_physical_semantics_and_p4_relevance"
      stress_status: "OBSTRUCTION_LOCAL_NO_PHYSICAL_OR_P4_CREDIT"
      exact_evidence: "The stress finds no hidden target import and preserves RT003 written purity, but no source law selects the missing coupling, p, initial state, realization, or clock primitives."
      proof: "All exact results are finite formal consequences of disclosed proposal data. None constructs a causal cone, sector-universal principal structure, conformal geometry, scale, g_eff, matter coupling, or empirical occurrence."
      falsifier: "An independently sourced and audited selection law satisfying P4-T02 robustness and physical interpretation without target import."

coupling_fragility_theorem:
  theorem_id: "THM-RT16005-PM-COUPLING-TV-NONISOLATION-001"
  assumptions:
    - "p in (0,1)"
    - "two token-class stay indicators J_0,J_1 with common marginal p"
    - "exchange symmetry under token swap"
    - "mixed-token section so all four driver outcomes are distinguishable"
  admissible_interval: "max(0,2p-1)<=a<=p"
  joint_mass_formula:
    both_stay: "a"
    zero_stays_one_flips: "p-a"
    one_stays_zero_flips: "p-a"
    both_flip: "1-2p+a"
  shared_parameter: "a=p"
  independent_token_parameter: "a=p^2"
