fixed_rt007_mathematics:
  source_domain: "D_source"
  source_principal_construction: "Prin"
  source_principal_codomain: "Y_PS"
  source_principal_codomain_status: "registered_source_principal_data_only"
  image_factorization_theorem: "For typed U:X->D and R:X->Y, a unique f_im:im(U)->Y with R=f_im after U exists if and only if R is constant on every U-fibre."
  image_scope_qualification: "The theorem is canonical only on im(U); existence and uniqueness of an all-D extension are separate obligations."
  surjective_case: "If U is surjective, the image factor is the unique all-D factor."
  nonsurjective_case: "If U is not surjective and Y has at least two elements, distinct off-image values give multiple all-D extensions."
  singleton_exception: "If Y is a singleton, all-D uniqueness may hold even when U is not surjective."
  conservative_product_control: "For X_ctrl=D_source x E, R_PS=Prin after U only when source equations, highest-derivative coefficients, constraints, gauge generators, redundancies, and lawful reduction are all held fixed."
  coefficient_change_control: "At k=(1,2,3,5), the fixed six-factor polynomial is 60480; replacing the first source vector (1,1,0,0) by (1,2,0,0) changes it to 100800 and leaves the honest conservative fibre."
  reduction_change_control: "Removing one reduced channel by a changed constraint, gauge, or redundancy direction changes determinant degree from six to five and leaves the honest conservative fibre."
  nonselection_independence_control: "One two-root unselected fibre admits both a constant factorable relevance map and a separating nonfactorable relevance map, so nonselection implies neither relevance nor irrelevance."
  naturality_qualification: "Naturality requires independently typed source-arrow actions and commuting U and R squares; deleting arrows because they do not preserve a desired output is circular."
  current_source_instance_status: "D_source, Prin, and Y_PS are formed; X_OCC, its arrows, U, and the actual R are not current-source formed."

