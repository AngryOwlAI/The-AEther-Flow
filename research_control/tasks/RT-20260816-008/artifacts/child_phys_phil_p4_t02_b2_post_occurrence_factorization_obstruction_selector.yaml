new_mathematical_payload:
  payload_count: 3
  payloads:
    - payload_id: "NMP-RT016-008-PHIL-001"
      payload_type: "categorical_construction_theorem"
      name: "Source-groupoid Grothendieck carrier criterion"
      statement: "Let G be a groupoid and A:G->Set a functor. The category Integral(A), with objects (d,a) and arrows g:(d,a)->(d_prime,A(g)(a)), has a projection U:Integral(A)->G that is a discrete opfibration. Thus a coherent combined carrier and its arrow class are formed from A exactly when the proposed transports satisfy the functor identity and composition laws."
      proof: "Identity arrows act by A(id_d)=id_A(d), and composition is well defined because A(g2 after g1)=A(g2) after A(g1). For each g:d->d_prime and (d,a), the arrow labelled g has the unique target (d_prime,A(g)(a)), giving the discrete opfibration lift. Conversely, any claimed transport failing identity or composition makes identities or composition in the total category ill defined, so the advertised carrier-with-arrows is not formed."
      novelty_relative_to_rt007: "RT007 proves conditional factorization after typed U and R and records that X_OCC is absent. This theorem supplies a precise future formation test for the carrier, arrow class, and attachment transport without asserting that a source-provenanced A exists."
      falsifier: "Exhibit a source arrow g with A(id) not identity, or composable g1 and g2 with A(g2 after g1) unequal to A(g2) after A(g1); then Integral(A) is not a coherent source extension."
      burden_effect: "selector_level_schema_only_no_distance_delta"
    - payload_id: "NMP-RT016-008-PHIL-002"
      payload_type: "naturality_obstruction_theorem"
      name: "Automorphism fixed-point criterion for a distinguished occurrence token"
      statement: "On each connected component of a source groupoid G, a natural section selecting s_d in A(d) exists if and only if one representative d0 has an element a0 fixed by every automorphism in Aut_G(d0); the values elsewhere are then forced by transport."
      proof: "Necessity follows from naturality along h:d0->d0, which gives A(h)(s_d0)=s_d0. For sufficiency, choose a fixed a0 and define s_d=A(g)(a0) for any g:d0->d. If g_prime is another choice, g_prime inverse after g is an automorphism of d0, so fixedness makes the value independent of the choice; functoriality gives naturality. Repeat by component."
      semantic_guard: "The theorem concerns a formal natural section only. It neither requires a section to form Integral(A) nor interprets a section as realized physical occurrence, probability, or empirical selection."
      falsifier: "A source object whose stabilizer acts on A(d) without a fixed point, such as a two-token fibre exchanged by a Z2 automorphism, forbids any distinguished natural section on that component."
      burden_effect: "conditional_naturality_gate_only_no_distance_delta"
    - payload_id: "NMP-RT016-008-PHIL-003"
      payload_type: "provenance_acyclicity_lemma"
      name: "Recorded noncircularity criterion for a proposal-only law"
      statement: "For a finite dependency graph, if every definition of E, A, and transport is topologically downstream only of declared source-side roots and there is no path from a desired P4 output, Y_PS value, target cone, metric, or benchmark label into those definitions, then the recorded construction is syntactically nonadaptive to those outputs."
      proof: "A finite acyclic graph admits a topological ordering. Induction along that order expresses each candidate declaration only in terms of earlier source-side declarations, so none can depend on a later forbidden output node when no path from such a node exists. This establishes recorded syntactic nonadaptivity only; it does not establish independent physical truth or canonical-ontology justification."
      falsifier: "Any dependency edge or path from a desired relevance verdict, selected cone, target metric, benchmark answer, or observed outcome into E, A, admissibility, or transport defeats the criterion and makes the proposal circular for this route."
      burden_effect: "provenance_control_only_no_distance_delta"

