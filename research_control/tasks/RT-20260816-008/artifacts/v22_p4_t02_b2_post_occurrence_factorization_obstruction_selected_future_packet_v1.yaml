theorem_targets:
  - theorem_id: "THM-01-GROTHENDIECK-TYPING"
    statement: "Typed functorial fibres yield a well-formed combined extension and projection U."
  - theorem_id: "THM-02-GROUPOID-SECTION"
    statement: "Natural sections exist componentwise exactly when representative isotropy actions have transport-coherent fixed points."
  - theorem_id: "THM-03-CONSERVATIVE-REDUCT"
    statement: "The proposed extension preserves every old-language theorem only under an explicit conservative-reduct hypothesis; this does not make the new primitive definitionally conservative."
  - theorem_id: "THM-04-NONDEFINABILITY-CONTROL"
    statement: "Two same-reduct expansions with distinct added roots witness failure of old-language definitional selection."
  - theorem_id: "THM-05-NATURALITY"
    statement: "Transport, admissibility, and any chosen attachment commute with every independently admitted source arrow."
  - theorem_id: "THM-06-PROVENANCE-ACYCLICITY"
    statement: "No carrier, admissibility law, arrow class, section, or kernel may depend on a P4 diagnostic, desired principal-data result, cone, or target geometry."

proof_obligations:
  - "PO-01 Type D_source without importing target geometry."
  - "PO-02 Type nonempty proposal fibres and every source-arrow transport map."
  - "PO-03 Prove identity, composition, and inverse coherence."
  - "PO-04 Form X_OCC and U without using desired P4 output."
  - "PO-05 Type admissibility as an invariant subfunctor or return a precise obstruction."
  - "PO-06 Choose exactly one attachment semantic mode and do not conflate section, admissible set, and kernel."
  - "PO-07 Prove the groupoid-section criterion and exact fixed-point controls."
  - "PO-08 If a kernel is used, type sigma-algebras, normalization, and equivariance without interpreting it as physical probability."
  - "PO-09 Prove current-source arrow naturality; output-preserving arrows are inadmissible evidence."
  - "PO-10 Prove old-language model conservativity or state its exact failure."
  - "PO-11 Prove non-definitionality when distinct same-reduct expansions exist."
  - "PO-12 Provide an acyclic, pre-outcome source-provenance graph."
  - "PO-13 Demonstrate material distinctness from all nine frozen routes and RT007."
  - "PO-14 Provide proof and falsifier for every theorem target."
  - "PO-15 Preserve all fourteen Distance-to-GR rows as no_delta."
  - "PO-16 Return one exact construction or first precise obstruction; do not adopt or promote."

failure_branches:
  - branch_id: "FB-01"
    trigger: "No source-only D_source or source-arrow class can be typed."
    result: "source_category_typing_obstruction"
  - branch_id: "FB-02"
    trigger: "F_occ is stipulated without independently disclosed source provenance."
    result: "source_provenance_obstruction"
  - branch_id: "FB-03"
    trigger: "Transport fails identity, inverse, or composition coherence."
    result: "functoriality_obstruction"
  - branch_id: "FB-04"
    trigger: "The fibre is empty on an admitted object."
    result: "nonempty_extension_obstruction"
  - branch_id: "FB-05"
    trigger: "Admissibility is defined from desired P4 success or a frozen candidate outcome."
    result: "circular_goal_preload"
  - branch_id: "FB-06"
    trigger: "A deterministic section is claimed where isotropy has no fixed point."
    result: "automorphism_fixed_point_obstruction"
  - branch_id: "FB-07"
    trigger: "A kernel or subfunctor is relabeled as a realized token or deterministic selector."
    result: "semantic_type_error"
  - branch_id: "FB-08"
    trigger: "Allowed arrows are restricted by preservation of the proposed output."
    result: "output_relative_arrow_circularity"
  - branch_id: "FB-09"
    trigger: "Same-reduct expansions are distinct but definitional conservativity is claimed."
    result: "definitional_nonconservativity"
  - branch_id: "FB-10"
    trigger: "The construction replays RT007 or one of the nine frozen route encodings."
    result: "material_distinctness_failure"
  - branch_id: "FB-11"
    trigger: "Target atlas, metric, cone, empirical response, or benchmark output enters a source root."
    result: "forbidden_target_or_empirical_import"
  - branch_id: "FB-12"
    trigger: "A P4 diagnostic is used to select carrier, root, parameter, or attachment."
    result: "provenance_dag_cycle"
  - branch_id: "FB-13"
    trigger: "Construction is treated as current-ontology derivation or adoption."
    result: "authority_overread"
  - branch_id: "FB-14"
    trigger: "Any Distance-to-GR delta, D7 reevaluation, B2 action, or P4-T03 unlock is claimed."
    result: "downstream_scope_violation"

