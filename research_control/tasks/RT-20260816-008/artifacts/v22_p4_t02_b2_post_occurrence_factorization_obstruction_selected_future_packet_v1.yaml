  - domain_id: "DOM-05-ADM"
    definition: "A proposed invariant admissibility subobject or predicate, defined before P4 diagnostics."
  - domain_id: "DOM-06-ATTACH"
    definition: "Candidate deterministic section, invariant subfunctor, or normalized equivariant kernel with its semantic type declared."
  - domain_id: "DOM-07-EQSRC"
    definition: "Only independently current-source-typed arrows; an output-preserving arrow restriction is forbidden."
  - domain_id: "DOM-08-CONS"
    definition: "Old-language reduct and conservative-extension comparison domain."
  - domain_id: "DOM-09-PROV"
    definition: "Acyclic source-provenance dependency graph with no P4-output back-edge."
