    statement: "For a groupoid G and functor F:G->Set, natural transformations 1=>F on each connected component correspond exactly to fixed points of the representative isotropy action, transported coherently along arrows."
    proof: "Naturality makes the representative value invariant under every automorphism. Conversely, transport an invariant value from a representative; invariance makes the result independent of the chosen arrow and supplies naturality."
    falsifier: "A natural section whose representative value is moved by an isotropy automorphism, or an isotropy-fixed representative value whose transport is not coherent."
  torsor_control:
    statement: "A one-object C2 groupoid acting by swap on a two-point torsor has no natural section."
    proof: "The swap action has no fixed point."
    falsifier: "An element of the two-point carrier fixed by swap."
  pointed_control:
    statement: "A C2 action fixing 0 and swapping 1 with 2 has exactly one natural section."
    proof: "The isotropy fixed locus is exactly {0}."
    falsifier: "A second fixed element."
  old_reduct_nonselection:
    statement: "Two expansions of one old source reduct can carry distinct fixed roots while agreeing on every old-language datum, so old-source reduct equality does not select the new root."
    proof: "The finite model holds the source object and arrows fixed while changing the added action/root pair; the expansion fingerprints differ."
    falsifier: "An old-language formula that distinguishes the two expansions or defines their distinct roots."
  route_dependency_control:
    statement: "RT007 already localizes the current typing failure at X_OCC. A new current-source audit must add an independently bounded signature/automorphism result; a scoped irrelevance theorem requires a typed domain and relevance map; a proposal-only source extension remains a lawful fail-closed construction; protected stop is premature while that construction remains non-promotional."

