new_mathematical_payload:
  - payload_id: "NMP-RT016-008-001"
    payload_type: "groupoid_section_equivalence"
    object_name: "ComponentwiseIsotropyFixedPointSectionCriterion_v1"
    summary: "For a groupoid G and functor F:G->Set, natural sections 1=>F on each connected component are in bijection with fixed points of a representative isotropy action."
    proof_control: "Naturality forces invariance. Conversely, transport a fixed representative value; isotropy invariance makes transport independent of the arrow choice."
    falsifier: "A claimed natural section moved by an automorphism or an invariant representative whose transported values violate naturality."
  - payload_id: "NMP-RT016-008-002"
    payload_type: "fixed_point_exact_controls"
    object_name: "TorsorVersusPointedActionControl_v1"
    summary: "The C2 swap torsor has zero natural sections, whereas a C2 action fixing one point and swapping two has exactly one."
    proof_control: "The exact fixed loci are empty and singleton respectively."
    falsifier: "A fixed token in the torsor or a second fixed point in the pointed action."
  - payload_id: "NMP-RT016-008-003"
    payload_type: "transport_coherence_control"
    object_name: "ConnectedGroupoidFixedLocusTransport_v1"
    summary: "Conjugate isotropy actions transport their fixed loci, and a representative fixed point determines one coherent section over a connected component."
    proof_control: "The exact two-object permutation control transports fixed locus (10) to (30) and satisfies inverse coherence."
    falsifier: "A conjugate action whose transported fixed point is not fixed or whose inverse transport fails."
  - payload_id: "NMP-RT016-008-004"
    payload_type: "old_reduct_nonselection"
    object_name: "SameReductDistinctExtensionRootTheorem_v1"
    summary: "Distinct added fibre actions and roots can expand the same old source reduct, so old-language equality does not definitionally select the proposal root."
    proof_control: "The finite paired expansions share the source object and arrows while their added roots and expansion fingerprints differ."
    falsifier: "An old-language formula that distinguishes or uniquely defines the two roots."
  - payload_id: "NMP-RT016-008-005"
    payload_type: "route_dependency_theorem"
    object_name: "ConstructionBeforeIrrelevanceOrProtectedStop_v1"
    summary: "After a first-principle typing obstruction at X_OCC, a fail-closed proposal-only construction is logically prior to any occurrence irrelevance theorem and keeps protected stop untriggered."
    proof_control: "Route C lacks its domain and map; Route D's necessity premise is false while Route B remains bounded and non-promotional; Route A risks repeating the already-localized absence without a new grammar."
    falsifier: "A current-source-typed X_OCC and relevance map supporting a new irrelevance theorem, or proof that every proposal-only construction necessarily requires protected adoption."

