new_mathematical_payloads:
  payload_count: 5
  payloads:
    - payload_id: "NMP-RT016-008-PM-001"
      payload_type: "theorem"
      title: "Natural-section fixed-point criterion for a proposal carrier"
      exact_scope: "A conditional category-of-elements schema over a groupoid; no current-source E or X_OCC instance is asserted."
      statement: "Let S be a groupoid and E:S->Set a functor. The projection U:Integral(E)->S admits a functorial section sigma with U after sigma=id exactly when each connected component has a representative d whose fibre E(d) contains an element fixed by every automorphism of d."
      hypotheses:
        - "S is a small groupoid or the argument is restricted to a small full subgroupoid."
        - "E is an independently defined functor into sets."
        - "A section means a functor sigma with strict projection identity."
      proof:
        - "If sigma exists, write sigma(d)=(d,e_d). For any h in Aut_S(d), functoriality of sigma gives E(h)(e_d)=e_d, so e_d lies in Fix_E(d)."
        - "Conversely choose one representative r per connected component and one e_r in Fix_E(r). For d in that component choose an isomorphism g:r->d and define e_d=E(g)(e_r)."
        - "If g_prime:r->d is another choice, g_prime inverse after g is an automorphism of r and fixes e_r, so E(g)(e_r)=E(g_prime)(e_r). Thus e_d is well defined."
        - "For an arrow k:d->d_prime, the definitions give E(k)(e_d)=e_d_prime, so d maps to (d,e_d) as a functorial section."
      falsifier: "For the one-object groupoid with automorphism group Z2 acting on E={e0,e1} by transposition, Integral(E) and U exist but Fix_E is empty, so no natural section exists."
      novelty_relative_to_rt007: "RT007 showed that the current record does not form X_OCC. This theorem separates future carrier formation from canonical occurrence selection and supplies an exact automorphism test without inferring irrelevance."
      result_use: "Route B may form a carrier without claiming a selected realized occurrence; a missing fixed point blocks only a natural section."
      global_no_go: false
    - payload_id: "NMP-RT016-008-PM-002"
      payload_type: "theorem"
      title: "Total-fibre semantic conservativity criterion"
      exact_scope: "Old-language model conservativity of a proposal-only expansion, not definitional eliminability or ontology adoption."
      statement: "Let M be the class of current-source models and E assign extension data to each model. If every current model d has at least one e in E(d), every pair (d,e) reduces to d, and satisfaction of every old-language sentence by (d,e) equals satisfaction by d, then the extended model class is conservative over the current theory for old-language consequences."
      hypotheses:
        - "Every current model has a nonempty extension fibre."
        - "The reduct of each extended model is its original current model."
        - "New axioms do not alter old-language satisfaction."
      proof:
        - "Assume an old-language sentence phi is not entailed by the current theory and choose a current model d that falsifies phi."
        - "Choose e in E(d) by total-fibre nonemptiness. The extended model (d,e) exists and its reduct-satisfaction condition makes it falsify phi."
        - "Therefore the extended class does not entail phi. By contraposition, every old-language consequence of the extension was already a consequence of the current theory."
        - "If one reduct has two nonisomorphic extensions over its identity arrow, the unique-expansion condition needed for a definitional-extension claim fails, even though semantic conservativity may hold."
      falsifier: "An admitted current model with an empty extension fibre or an extension axiom that changes an old-language truth value invalidates this conservativity certificate. A naturally unique definability theorem would invalidate only the nondefinitional warning."
      novelty_relative_to_rt007: "RT007's product control fixed one conditional principal recomputation. This theorem gives the future packet an exact model-level condition for retaining every old source model while separating that property from unique definability."
      result_use: "Route B must prove this criterion or return conservative-reduct failure; it may not call a mere product notation conservative."
      global_no_go: false
    - payload_id: "NMP-RT016-008-PM-003"
      payload_type: "lemma"
      title: "Finite provenance-DAG source-root separation lemma"
      exact_scope: "Recorded syntactic dependency provenance only; semantic proxy audits remain separate."
      statement: "In a finite dependency DAG, if every leaf ancestor of candidate nodes E and alpha is classified as a registered source root or explicitly declared proposal-only source root and no forbidden target node has a directed path to E or alpha, then E and alpha are source-rooted relative to the recorded graph."
      hypotheses:
        - "The dependency graph is finite and acyclic."
        - "Every leaf is exhaustively classified."
        - "Edges represent all declared direct dependencies."
      proof:
        - "Take a topological ordering of the finite DAG."
        - "Induct from leaf ancestors toward E and alpha. Each node inherits only the classifications of its predecessor ancestors."
        - "Because no forbidden target is an ancestor and all leaves are source-classified, every recorded dependency path into E and alpha begins at an allowed source root."
      falsifier: "Adding one edge from a target atlas, desired P4 verdict, physical cone, metric, empirical response, or benchmark-fit node into any ancestor of E or alpha creates a forbidden path and fails the certificate. An omitted semantic proxy also falsifies completeness even if the graph remains formally acyclic."
      novelty_relative_to_rt007: "RT007 named missing independent provenance. This lemma turns provenance into a fail-closed graph obligation while explicitly withholding any semantic purity claim from graph shape alone."
      result_use: "Route B must provide both the DAG certificate and a semantic smuggling inventory."
      global_no_go: false
    - payload_id: "NMP-RT016-008-PM-004"
      payload_type: "lemma"
      title: "Attachment naturality square criterion"
      exact_scope: "Conditional coherence of a future proposal-only attachment; no attachment is constructed here."
      statement: "For functors E,A:S->Set, a family alpha_d:E(d)->A(d) defines a source-natural attachment exactly when A(g) after alpha_d equals alpha_d_prime after E(g) for every source arrow g:d->d_prime."
      hypotheses:
        - "E and A are independently typed on the same source groupoid."
        - "Every alpha_d is a total map with source-only provenance."
      proof:
        - "The displayed equality is precisely the naturality condition for a natural transformation alpha:E=>A."
        - "If it holds for all arrows, identities and composites commute by functoriality, so attachment transport is coherent."
        - "If it fails for one arrow and one element, the two transport paths disagree and no natural transformation with those components exists."
      falsifier: "In a one-object Z2 groupoid, let E(z) swap e0,e1, let A(z) swap a0,a1, and set alpha(e0)=alpha(e1)=a0. Then A(z)alpha(e0)=a1 while alpha(E(z)e0)=a0, so naturality fails."
      novelty_relative_to_rt007: "RT007 stated the structured-naturality qualification abstractly. This payload gives the selected construction packet an exact attachment-level commuting-square test and finite falsifier."
      result_use: "A failed square returns source-arrow naturality obstruction, not an output-relative deletion of the offending arrow."
      global_no_go: false
    - payload_id: "NMP-RT016-008-PM-005"
      payload_type: "packet_selection"
      title: "Post-X_OCC-obstruction dependency-map selection"
      exact_scope: "Selector-level routing only."
      statement: "Because X_OCC and its attachment are derivation-critical missing source laws, Route B is the unique constructive route among the four that can address the first missing primitive without assuming it, while Route C is ill typed and Route D is not triggered."
      proof:
        - "Route A has no instantiated current-source carrier or attachment beyond the absence already recorded by RT007."
        - "Route B permits a proposal-only construction-or-obstruction packet under existing science-draft authority and exact source-purity gates."
        - "Route C requires X_OCC, U, and R before its theorem can be stated, and absence or nonselection cannot supply them."
        - "Route D requires every non-promotional continuation to need protected authority, contradicted by the admissible proposal-only Route B packet."
      falsifier: "If Route B cannot even state a source-only candidate-root search without protected adoption, or if a complete current-source E and alpha already exist, the route ranking must be recomputed."
      novelty_relative_to_rt007: "RT007 selected only a generic theoretical selector. This payload fixes one exact future packet, route label, and next role while preserving all scientific locks."
      result_use: "Select one future Ontology Formalizer packet and execute none of it here."
      global_no_go: false

