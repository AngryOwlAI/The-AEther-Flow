schema_id: "v21_p1_t04_eqsrc_canonical_selection_notation_glossary_v1"
status: "draft/control"
task_id: "RT-20260720-012"
job_id: "AJ-RT-20260720-012-001"
plan_task_id: "P1-T04"
theorem_target_id: "EQSRC-CANONICAL-SELECTION-NATURALITY-TARGET-V1"
entries:
  - symbol: "G"
    name: "source symmetry groupoid"
    type: "groupoid"
    definition: "Objects are admitted source records and arrows are source isomorphisms declared independently of a distinguished choice or candidate relation."
  - symbol: "S,T"
    name: "source records"
    type: "objects of G"
    definition: "Source-side records containing no target atlas, target metric, benchmark verdict, generated derivative, registry, validator, role, handoff, file-order, or task-process premise."
  - symbol: "A"
    name: "carrier functor"
    type: "functor G -> Set"
    definition: "Assigns a source-state carrier A(S) and transports it by bijections A(f)."
  - symbol: "EqRel(A)"
    name: "relation functor"
    type: "functor G -> Set"
    definition: "Assigns equivalence relations on A(S) and pushes them forward along A(f)."
  - symbol: "X"
    name: "choice-space functor"
    type: "functor G -> Set"
    definition: "Assigns admissible distinguished structures such as roots, lines, orientations, partitions, response tokens, normalizations, ordered actions, components, or analogous source structures."
  - symbol: "K"
    name: "choice-to-relation map"
    type: "natural transformation X => EqRel(A)"
    definition: "Maps each admissible choice to its induced candidate relation while commuting with source isomorphisms."
  - symbol: "1_G"
    name: "terminal constant functor"
    type: "functor G -> Set"
    definition: "Assigns one singleton to every source object and its unique map to every arrow."
  - symbol: "s"
    name: "natural selector"
    type: "natural transformation 1_G => X"
    definition: "Selects s_S in X(S) with X(f)(s_S)=s_T for every source isomorphism f:S->T."
  - symbol: "Aut_G(S)"
    name: "source automorphism group"
    type: "group"
    definition: "All endomorphisms of S in the groupoid G."
  - symbol: "X(S)^Aut(S)"
    name: "fixed-point locus"
    type: "subset of X(S)"
    definition: "Choices fixed by every source automorphism; a necessary locus for natural selection."
  - symbol: "M"
    name: "broader source morphism category"
    type: "category"
    definition: "Optional independently declared extension beyond isomorphisms; its coherence obligations are not discharged by groupoid fixed points."
  - symbol: "V"
    name: "variation category"
    type: "category or declared variation family"
    definition: "Independently specified source-side variations used to test robustness without importing a desired relation or target behavior."
branch_tags:
  - "no_fixed_point"
  - "multiple_relation_fixed_points"
  - "choice_irrelevance"
  - "relation_unique_existence"
  - "morphism_or_variation_failure"
source_structure_kinds:
  - "roots"
  - "lines"
  - "orientations"
  - "partitions"
  - "response_tokens"
  - "normalizations"
  - "ordered_actions"
  - "components"
  - "analogous_distinguished_structures"
forbidden_interpretations:
  - "G as a target spacetime category"
  - "A as a target field or metric carrier"
  - "K as proof that a physical equivalence relation is selected"
  - "s as current-ontology-derived without a separate derivation"
  - "validator or task state as source-side naturality evidence"
