  - "the countermodel completions are adopted dynamics"
  - "the finite equation is an Einstein equation"
  - "healthy GR limit or exact-GR recovery"
  - "canonical ontology or source-law adoption or rejection"
  - "benchmark promotion proof publication push or completed derivation"
  - "global no-go or future source-extension impossibility"

