  - "component shifts are diffeomorphism gauge"
  - "positive quotient Hessian proves ghost freedom"
  - "graph eigenvalues are physical masses frequencies or characteristic speeds"
  - "the finite equation is hyperbolic elliptic or causal as a spacetime equation"
