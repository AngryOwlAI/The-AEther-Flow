failure_branches:
  - failure_id: "FCMS-F01"
    trigger: "Any fixed source hash differs."
    result: "stop; immutable dependency drift"
  - failure_id: "FCMS-F02"
    trigger: "A graph eigenvalue is renamed as a physical frequency mass or speed."
    result: "stop; unsupported dynamical interpretation"
  - failure_id: "FCMS-F03"
    trigger: "Positive static Hessian is used as a ghost-free or gradient-stable verdict."
    result: "stop; kinetic or spacetime-gradient data missing"
  - failure_id: "FCMS-F04"
    trigger: "Component shifts are called diffeomorphism gauge or first-class constraints."
    result: "stop; target-side gauge smuggling"
  - failure_id: "FCMS-F05"
    trigger: "Artificial countermodel dynamics are adopted as a source law or candidate repair."
    result: "stop; countermodel scope exceeded"
  - failure_id: "FCMS-F06"
    trigger: "Near-disconnection conditioning is called physical strong coupling."
    result: "stop; kinetic normalization and interactions missing"
  - failure_id: "FCMS-F07"
    trigger: "Candidate-scoped non-derivation is promoted to global impossibility."
    result: "stop; no-go overreach"

freeze_controls:
  repeated_burden_without_new_payload: false
  new_payload:
