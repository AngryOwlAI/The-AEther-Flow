new_mathematical_payload:
  payload_count: 7
  items:
    - payload_id: "PAYLOAD-RT16001-PM-001"
      payload_type: "theorem"
      name: "countable-component standard-Borel fiber theorem"
      statement: "For every base object (U,O), LC(O,{0,1}) is a standard-Borel space because pi_0(O) is at most countable and LC(O,S) is S^(pi_0(O))."
      proof: "Second countability and local connectedness make the disjoint open components countable; the coordinate product of countably many finite standard-Borel spaces is standard Borel."
      falsifier: "An admitted non-second-countable source object with an open set having uncountably many components, or a failure of the component-value bijection."
      burden_effect: "discharges"
    - payload_id: "PAYLOAD-RT16001-PM-002"
      payload_type: "construction"
      name: "contravariant locally constant proposal-section sheaf"
      statement: "F_ext(B)=LC(O,S) with pullback restrictions is a standard-Borel contravariant functor and a sheaf of sets on declared open covers."
      proof: "Restrictions are Borel coordinate maps satisfying identity and composition; compatible local functions glue uniquely and local constancy is local."
      falsifier: "A base arrow whose pullback is not locally constant or Borel, or compatible cover data with no unique glued section."
      burden_effect: "discharges"
    - payload_id: "PAYLOAD-RT16001-PM-003"
      payload_type: "theorem"
      name: "normalized natural complement kernel theorem"
      statement: "K_p(s)=p delta_s+(1-p) delta_c(s) is jointly measurable, normalized, restriction-natural, and C2-equivariant on every fiber."
      proof: "Evaluation functions are Borel, coefficients sum to one, and rho composed with c equals c composed with rho."
      falsifier: "A Borel event with nonmeasurable evaluation, failed normalization, or any restriction square whose pushforward measures differ."
      burden_effect: "discharges"
    - payload_id: "PAYLOAD-RT16001-PM-004"
      payload_type: "theorem"
      name: "exact total-variation orbit theorem with empty-open degeneration"
      statement: "d_TV(K_p(s),K_q(s)) equals |p-q| on every nonempty-open two-point complement orbit and equals zero on the empty-open singleton orbit; globally it is at most |p-q|."
      proof: "The singleton event {s} attains the two-point supremum; coincident atoms on the empty open collapse both mixtures to the same Dirac mass."
      falsifier: "A nonempty s=c(s), a two-point event producing a different supremum, or an empty-open kernel depending on p."
      burden_effect: "discharges"
    - payload_id: "PAYLOAD-RT16001-PM-005"
      payload_type: "countermodel"
      name: "local-marginal probability coupling nonuniqueness"
      statement: "Section-indexed shared-driver descent does not imply unique descent of arbitrary probability couplings."
      proof: "On a disjoint two-component cover, the shared global flip and independent local flips have identical local marginals but different global support."
      falsifier: "A theorem, under only the printed hypotheses, proving those two couplings equal."
      burden_effect: "narrows"
    - payload_id: "PAYLOAD-RT16001-PM-006"
      payload_type: "countermodel"
      name: "p=1/3 versus p=2/3 carrier-law nonidentifiability"
      statement: "The same nonempty carrier, fiber, restrictions, total admissibility, complement, and driver actions support distinct K_(1/3) and K_(2/3)."
      proof: "The event {s} receives weights 1/3 and 2/3, giving total variation 1/3."
      falsifier: "A current-source theorem deriving a unique p from the fixed carrier and law-independent data."
      burden_effect: "narrows"
    - payload_id: "PAYLOAD-RT16001-PM-007"
      payload_type: "theorem"
      name: "swap-equivariant kernel without deterministic token theorem"
      statement: "On every nonempty fiber complement orbit, K_p is C2-equivariant while no C2-equivariant deterministic root exists."
      proof: "Kernel pushforward commutes with complement, but a root from a trivial singleton would have to be a fixed point of the free complement action."
      falsifier: "A nonempty-open complement-fixed section or an equivariant deterministic root."
      burden_effect: "narrows"

