measurable_fiber_construction:
  token_space:
    symbol: "S"
    carrier:
      - 0
      - 1
    topology: "discrete"
    sigma_algebra: "power_set"
    automorphism_group: "C2={id,c}"
  fiber_definition:
    formula: "F_ext(U,O)=LC(O,S)"
    semantics: "New proposal-section tokens localized over the open O; O itself is not relabeled as a proposal or event."
    empty_open_value: "LC(empty,S) is the singleton containing the empty function."
  component_representation:
    formula: "LC(O,S) is bijective to S^(pi_0(O))."
    component_count_status: "at_most_countable"
    proof: "A smooth manifold is locally connected and second countable. Components of O are pairwise disjoint nonempty opens; assigning to each component one contained element of a countable base injects pi_0(O) into a countable set."
    standard_borel_proof: "A countable product of finite discrete standard-Borel spaces is standard Borel. The empty product is a singleton, finite products are finite discrete, and the countably infinite case is Borel-isomorphic to a Borel subset of Cantor space."
    load_bearing_hypothesis: "ordinary Hausdorff second-countable smooth-manifold convention"
