exact_formal_construction:
  base:
    symbol: "B"
    definition: "B is the category of elements of the fixed canonical contravariant Open carrier. Objects are (U,O); admitted arrows induce inverse-image restrictions O -> j^{-1}(O)."
    current_ontology_status: "current_carrier_only"
  fiber:
    token_set: "S={0,1}"
    sigma_algebra: "discrete"
    definition: "F_ext(U,O)=LC(O,S)"
    empty_open_value: "F_ext(U,empty) is a singleton containing the empty section"
    proposal_only: true
  standard_borel_typing:
    statement: "Every O is second countable and locally connected, so its pairwise disjoint nonempty open connected components inject into a countable basis; hence pi_0(O) is at most countable. Evaluation on components identifies LC(O,S) with S^{pi_0(O)}, a finite or countable product of a finite discrete standard-Borel space, and therefore a standard-Borel space under its cylinder sigma-algebra."
    empty_case: "The empty product is the one-point standard-Borel space."
    status: "proved_under_standard_smooth_manifold_convention"
  restriction:
    definition: "rho_j(x)=x composed with the induced map on j^{-1}(O), equivalently ordinary section restriction or pullback."
    locally_constant_preserved: true
    measurable: true
    identity: "rho_id=id"
    composition: "rho_(j composed k)=rho_k composed rho_j"
    variance: "contravariant over the Open-carrier base"
  admissibility:
    definition: "Adm_ext(U,O)=F_ext(U,O)"
    explicitly_total: true
    nonempty: true
    measurable: true
    restriction_closed: true
    descent_compatible: true
    selection_claimed: false
  complement:
    definition: "C(x)(u)=1-x(u)"
    measurable: true
    involutive: "C composed C=id"
    naturality: "rho_j composed C=C composed rho_j"
    empty_open_fixed_point: true
    nonempty_open_fixed_point: false
    token_privilege_created: false
  kernel:
    parameter: "p in (0,1)"
    definition: "K_p(x,A)=p*1_A(x)+(1-p)*1_A(Cx)"
    normalized: true
    measurable_in_x: true
    support: "{x,Cx}, collapsing to one point only for O=empty"
    restriction_naturality: "pushforward_(rho_j) K_p(x)=K_p(rho_j(x))"
    swap_equivariance: "K_p(Cx,C(A))=K_p(x,A)"
    deterministic_token_selected: false
    realized_occurrence_asserted: false
  generator:
    one_step_operator: "T_p f(x)=p*f(x)+(1-p)*f(Cx)"
    difference_generator: "L_p f(x)=(T_p-I)f(x)=(1-p)*(f(Cx)-f(x))"
    kernel_relation: "T_p(1_A)(x)=K_p(x,A)"
    continuous_time_generator_claimed: false
    physical_time_claimed: false
    source_dynamics_adopted: false
  cover_descent:
    section_statement: "Compatible locally constant sections on an open cover glue uniquely to one locally constant global section."
    section_status: "proved"
    law_statement: "A single predeclared packet-global Z_p is applied to the glued section and then restricted, so every local output is jointly stay or jointly complemented and the local transition data glue to K_p."
    law_status: "proved_under_disclosed_global_coupling"
    marginal_limitation: "The family of local marginal kernels alone does not determine cross-component or cross-chart correlation. Independent local flip bits and one global flip bit have the same local marginals but distinct joint laws on a disconnected cover."
    implication: "Law descent is construction data, not a consequence selected by the Open carrier."
  naturality:
    base_arrow_status: "canonical typed inverse-image arrows fixed before the output"
    token_swap_status: "the full S_2 action is declared before the output"
    output_relative_arrow_definition_used: false
    result: "rho, C, K_p, T_p, and L_p commute with every admitted restriction; K_p is equivariant under token swap."
  robustness:
    metric: "formal total variation"
    nonempty_open_exact_formula: "d_TV(K_p(x),K_q(x))=abs(p-q) when O is nonempty, because x and Cx are distinct"
    empty_open_exact_formula: "d_TV(K_p(x),K_q(x))=0 when O is empty, because x=Cx and both kernels are the same point mass"
    uniform_bound: "d_TV(K_p(x),K_q(x))<=abs(p-q) for every O and x"
    physical_robustness_credit: false
