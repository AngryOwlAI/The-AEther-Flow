new_conceptual_mathematical_payload:
  payload_count: "6"
  rows:
    - payload_id: "NMP-01"
      result: "Countable-component standard-Borel lemma"
      proof: "A second-countable locally connected O has at most countably many disjoint open components; LC(O,S) is therefore a countable product of finite discrete spaces and is standard Borel."
      falsifier: "Exhibit an admitted O with uncountably many open components or a non-cylinder measurable structure that is not standard Borel."
    - payload_id: "NMP-02"
      result: "Empty-open fixed-point correction"
      proof: "On O=empty the unique empty section equals its complement, so every K_p is the same point mass and TV is zero; the abs(p-q) equality holds only on nonempty opens."
      falsifier: "Produce two distinct sections of the empty open or a measurable set separating the unique empty section from its complement."
    - payload_id: "NMP-03"
      result: "Marginal-versus-joint descent distinction"
      proof: "Local K_p marginals do not determine whether flips on disconnected pieces are independent or synchronized. One predeclared global Z_p supplies the joint law whose outputs glue to a global section."
      falsifier: "Derive a unique cross-component coupling from local marginal kernels and overlap equalities alone on a disjoint two-set cover."
    - payload_id: "NMP-04"
      result: "Paired-root nonidentifiability theorem"
      proof: "p=1/3 and p=2/3 define distinct K_p on every nonempty-open fiber while sharing the same current Open reduct, fiber, restrictions, admission, complement, descent, and swap action."
      falsifier: "Exhibit a theorem in the bound current source language whose unique consequence is one of those two p values."
    - payload_id: "NMP-05"
      result: "Syntactic acyclicity is weaker than epistemic provenance"
      proof: "The proposal DAG is acyclic because roots precede diagnostics, yet each added root has indegree zero from current-source facts; therefore acyclicity prevents goal-smuggling without supplying a reason to believe or adopt the roots."
      falsifier: "Exhibit an acyclic canonical-source path deriving each of S, total admission, C, p, and the joint coupling without using target, empirical, benchmark, or outcome data."
    - payload_id: "NMP-06"
      result: "Swap equivariance without token selection"
      proof: "Complement implements the nontrivial S_2 action and K_p(Cx,C(A))=K_p(x,A); equivariance leaves token names exchangeable and creates no absolute token or realized event."
      falsifier: "Construct an S_2-equivariant deterministic choice of one absolute token that is fixed under the nontrivial swap."

