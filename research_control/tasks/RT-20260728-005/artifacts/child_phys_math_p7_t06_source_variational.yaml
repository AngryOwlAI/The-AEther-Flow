fixed_assumptions:
  finite_carrier:
    symbol: "Omega"
    type: "finite nonempty P7-T02 configuration carrier"
    cardinality: "n>=1"
  endpoint_kernel:
    symbol: "P"
    type: "n by n matrix over Q_nonnegative"
    convention: "P_xy is the endpoint weight from source x to target y; source configurations index rows"
    normalization: "sum_y P_xy=1 for every x"
    interpretation: "proposal-only endpoint bookkeeping kernel; not physical probability, rate, frequency, coupling, or evolution law"
    column_bookkeeping_note: "With column bookkeeping vectors, the P7-T02 update matrix is P^T; this transpose convention does not change the nonsymmetry obstruction."
  source_probe:
    symbol: "q"
    type: "arbitrary element of Q^Omega, extended to R^Omega only for ordinary differentiation language"
    dimensions: "dimensionless"
    interpretation: "formal source probe with no physical field, matter, time, detector, metric, or spacetime semantics"
  kernel_split:
    definitions:
      - "C=(P+P^T)/2"
      - "A=(P-P^T)/2"
    exact_types:
      C: "symmetric nonnegative rational conductance matrix"
      A: "skew-symmetric rational directional-residue matrix"
    identities:
      - "P=C+A"
      - "C^T=C"
      - "A^T=-A"
    semantic_limit: "C is not generally row normalized and must not be relabelled as an adopted transition kernel."
  variational_class:
    domain: "the full unconstrained coordinate space R^Omega"
    pairing: "the standard coordinate pairing"
    scalar_class: "scalar quadratic functionals for the exact representation test; the Hessian argument also covers C^2 scalar functionals whose gradient is the stated linear operator"
    excluded_variants:
      - "weighted inner-product gradients"
      - "restriction to a proper constraint subspace"
      - "auxiliary variables or doubled fields"
      - "nonlocal path-dependent functionals"
      - "nonsmooth generalized gradients"
  boundary_subset:
    symbol: "R"
    type: "an arbitrary subset of Omega"
    complement: "Omega minus R"
    orientation: "J_xy is counted outward from x toward y"

constructive_variational_object:
  functional:
    symbol: "V_src(q)"
    definition: "V_src(q)=(1/4) sum_(x,y in Omega) C_xy (q_y-q_x)^2"
    equivalent_unordered_form: "V_src(q)=(1/2) sum_({x,y},x!=y) C_xy (q_y-q_x)^2, with each unordered pair counted once"
    coefficient_field: "Q on rational probes and R after scalar extension"
    dimensions: "dimensionless"
    sign: "V_src(q)>=0 because C_xy>=0"
    diagonal_dependence: "none; every x=y summand vanishes"
    shift_invariance: "V_src(q+c 1)=V_src(q)"
    kernel_statement: "V_src(q)=0 exactly when q is constant on each connected component of the undirected positive-C support graph"
  first_variation:
    derivative_symbol: "D_x(q)"
    exact_formula: "D_x(q)=partial V_src/partial q_x=sum_y C_xy(q_x-q_y)"
    directional_formula: "delta V_src(q)[h]=sum_x D_x(q) h_x"
    proof:
      - "Differentiate the ordered-pair double sum once in the first-index occurrences and once in the second-index occurrences."
      - "Each contribution carries factor 1/2 after differentiating the square."
      - "Use C_xy=C_yx and rename the second-index sum; the two half-sums coincide."
      - "Their sum is D_x(q)=sum_y C_xy(q_x-q_y)."
  hessian:
    symbol: "L_C"
    formula: "L_C=Diag(C 1)-C"
    exact_properties:
      - "L_C^T=L_C"
      - "L_C 1=0"
      - "q^T L_C q=2 V_src(q)>=0"
      - "D(q)=L_C q"
    caveat: "L_C is a conductance graph Laplacian; it is not generally I-C and is not generally the symmetric part of I-P."
  source_flux:
    symbol: "J_xy(q)"
    definition: "J_xy(q)=C_xy(q_x-q_y)"
    exact_properties:
      - "J_yx(q)=-J_xy(q)"
      - "J_xx(q)=0"
      - "D_x(q)=sum_y J_xy(q)"
    interpretation: "finite antisymmetric source-flux bookkeeping record only"
  balance_identities:
    closed:
      formula: "sum_x D_x(q)=sum_(x,y) J_xy(q)=0"
      proof: "Pair each ordered edge (x,y) with (y,x); antisymmetry cancels the pair exactly."
      required_conditions:
        - "Omega is finite"
        - "C is symmetric"
        - "the full carrier Omega is summed"
      anomaly_term: "zero within the declared finite symmetric-conductance object"
    boundary:
      formula: "sum_(x in R) D_x(q)=sum_(x in R,y notin R) J_xy(q)"
      proof: "Internal terms with x,y both in R cancel pairwise; only cross-boundary terms remain."
      orientation: "positive right-hand side is outward under J_xy=C_xy(q_x-q_y)"
      anomaly_branches:
        - condition: "a non-symmetric edge weight is substituted for C"
          result: "pairwise cancellation is not established; the residual must be reported rather than called conservation"
        - condition: "only a subset R is summed"
          result: "the exact cross-boundary flux remains"
        - condition: "an external source term s_x is added to D_x"
          result: "sum_(x in R) D_x equals boundary flux plus the explicitly declared source contribution, subject to the new definition"
        - condition: "the input is malformed or target-derived"
          result: "no task-local variational or balance conclusion"

directional_update_representation_test:
  target_operator:
    row_source_convention: "H=I-P"
    column_bookkeeping_convention: "H_col=I-P^T=H^T"
    question: "Does a scalar quadratic Q on the full standard coordinate space satisfy grad Q(q)=Hq for every q?"
  necessary_and_sufficient_condition:
    statement: "Such a scalar quadratic exists in this fixed class if and only if H is symmetric, equivalently P is symmetric."
    necessity_proof:
      - "The gradient of a scalar quadratic has the form S q+b with S symmetric, because only the symmetric part of its quadratic coefficient contributes."
      - "Equality with the homogeneous linear map Hq for every q forces b=0 and S=H."
      - "Therefore H=H^T, equivalently P=P^T."
      - "More generally, if a C^2 scalar has gradient Hq on an open set, its constant Hessian is H and equality of mixed partials again forces H=H^T."
    sufficiency_proof:
      - "If P=P^T and P is row normalized, then C=P and C 1=1."
      - "Therefore L_C=I-P=H."
      - "The displayed V_src has grad V_src=Hq."
  relation_to_kernel_split:
    antisymmetric_part: "Skew(H)=(H-H^T)/2=-A"
    consequence: "Any nonzero directional residue A is an immediate obstruction to full-update scalar-gradient representation in the fixed class."
    symmetric_residual: "Sym(H)=I-C"
    variational_hessian: "L_C=Diag(C 1)-C"
    equality_condition: "L_C=Sym(H) exactly when C 1=1; because P 1=1, this is equivalent to P^T 1=1, i.e. P is doubly stochastic."
    scope_warning: "Even when P is doubly stochastic, a nonzero A still obstructs H itself; only Sym(H) is represented by L_C."

