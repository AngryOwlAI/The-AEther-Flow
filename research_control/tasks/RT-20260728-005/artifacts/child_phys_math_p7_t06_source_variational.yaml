conflicts_and_risks:
  - risk_id: "P7T06-RISK-SOURCE-EQUIVALENT-AMBIGUITY-001"
    severity: "high"
    issue: "Calling V_src source-equivalent without qualification can be misread as exact equivalence to the full P7-T02 update or to a physical matter action."
    resolution: "Use the exact phrase 'kernel-derived symmetric-conductance source variational object'; separately display L_C, I-P, and their difference."
  - risk_id: "P7T06-RISK-MATRIX-CONVENTION-001"
    severity: "medium"
    issue: "P7-T02 writes its bookkeeping update with rows target and columns source, while the endpoint kernel naturally has rows source and columns target."
    resolution: "Declare P_xy as source-row endpoint weights and state that the column-vector bookkeeping update is P^T. Show that I-P and I-P^T are both nonsymmetric for the forward control."
  - risk_id: "P7T06-RISK-CONDUCTANCE-NORMALIZATION-001"
    severity: "high"
    issue: "C=(P+P^T)/2 need not be row normalized even when P is row normalized."
    resolution: "Call C a conductance matrix, not a transition kernel; use L_C=Diag(C 1)-C rather than silently replacing it with I-C."
  - risk_id: "P7T06-RISK-DIAGONAL-DATA-LOSS-001"
    severity: "medium"
    issue: "All diagonal holding weights disappear from V_src because q_x-q_x=0."
    resolution: "Record that the functional retains only the symmetrized off-diagonal support and cannot reconstruct the full kernel."
  - risk_id: "P7T06-RISK-OBSTRUCTION-OVERREACH-001"
    severity: "high"
    issue: "The nonsymmetric-Hessian argument does not exclude weighted gradients, constrained subspaces, auxiliary-field actions, path-dependent functionals, or future source extensions."
    resolution: "Keep the obstruction scoped to the full standard coordinate space and the declared scalar-gradient class; do not state a global no-go."
  - risk_id: "P7T06-RISK-PHYSICAL-CONSERVATION-OVERREAD-001"
    severity: "high"
    issue: "The identity sum_x D_x=0 may resemble a physical conservation law."
    resolution: "Describe it only as finite source-flux balance from pairwise antisymmetry; no time derivative, Noether symmetry, energy, momentum, current, or stress-energy object is present."
  - risk_id: "P7T06-RISK-UNIVERSALITY-001"
    severity: "high"
    issue: "P7-T05 proves that current sector data do not select one universal control/comparison family."
    resolution: "Apply the construction conditionally to each explicitly declared P7-T02 kernel; do not claim universal matter-sector selection."

