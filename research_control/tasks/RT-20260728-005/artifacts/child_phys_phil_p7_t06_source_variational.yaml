obstruction_scope_audit:
  obstruction_id: "OBST-P7T06-DIRECTIONAL-KERNEL-NONVARIATIONAL-001"
  failed_object: >-
    A scalar quadratic F on the same finite coordinate space whose ordinary
    coordinate gradient equals (I-P)phi for every phi.
  minimum_hypotheses:
    - "P is the explicitly declared row-source matrix."
    - "F is a scalar quadratic function of phi alone."
    - "Gradient means the ordinary coordinate gradient under the standard pairing."
    - "Exact equality is required for every phi in the full finite vector space."
  proof_basis: >-
    Write F(phi)=1/2 phi^T H phi+b^T phi+c. Its gradient is
    ((H+H^T)/2)phi+b, so exact equality to (I-P)phi for every phi requires
    b=0 and I-P symmetric. The fixed forward control violates that necessary
    condition.
  transpose_branch: >-
    If the operator is instead written on P7-T02 column bookkeeping states,
    the exact matrix is I-P^T. It is also nonsymmetric, so the same
    scalar-quadratic necessary-condition failure holds.
  excluded_conclusions:
    - "No scalar quadratic can represent L_C."
    - "No scalar quadratic can represent the symmetric projection."
    - "No variational formulation with a weighted pairing exists."
    - "No formulation with auxiliary or doubled variables exists."
    - "No time-dependent or history-dependent variational principle exists."
    - "No restriction to an invariant subspace can be variational."
    - "No future source-side law can repair the missing structure."
    - "Physical matter dynamics are impossible."
    - "The theory is globally rejected."
  status_language: "current fixed directional residual is obstructed in the declared scalar-quadratic standard-gradient class; same-milestone continuation remains open"

