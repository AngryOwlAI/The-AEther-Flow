notation_and_type_audit:
  transition_matrix_orientation:
    recommended_definition: >-
      Define P_xy as the sum of K_C(T|x) over enabled records with target y,
      so rows are source configurations, columns are target configurations,
      and sum_y P_xy=1.
    relation_to_p7_t02_bookkeeping_update: >-
      P7-T02 writes column bookkeeping states with target rows and source
      columns, so its displayed update matrix is P^T.
    consequence: >-
      C=(P+P^T)/2 is independent of choosing P or P^T, while A changes sign
      and the phrase full directional operator must specify I-P on test
      functions or I-P^T on column bookkeeping states.
    risk_if_omitted: "matrix-transpose ambiguity masquerading as a physical distinction"
  probe_symbol:
    current_risk: >-
      P7-T01 already uses q(Psi) for a derived source charge chain. Reusing q
      for an unrelated scalar test labeling can imply a nonexistent charge,
      field, or matter interpretation.
    recommendation: >-
      Use phi:Omega->Q, f:Omega->Q, or another explicitly disjoint symbol and
      call it a formal dimensionless source test labeling. If q is retained,
      declare that it is not the P7-T01 charge chain q(Psi).
  symmetric_and_directional_parts:
    definitions:
      C: "C=(P+P^T)/2"
      A: "A=(P-P^T)/2"
    exact_properties:
      - "C^T=C and C_xy>=0 for a nonnegative P."
      - "A^T=-A."
      - "P=C+A."
      - "The diagonal of C does not contribute to V_src."
      - "For every real phi, phi^T A phi=0."
    semantic_limits:
      C: >-
        A task-local symmetric edge-weight matrix only. Calling it
        conductance does not establish physical conduction, locality,
        reversibility, a stationary measure, or detailed balance.
      A: >-
        An algebraic directional residue only. It is not an arrow of physical
        time, dissipation, causal orientation, force, or entropy production.
  scalar_functional:
    definition: "V_src(phi)=1/4 sum_(x,y) C_xy (phi_y-phi_x)^2"
    exact_type: "Q-valued nonnegative scalar quadratic on a finite rational test-labeling space"
    exact_properties:
      - "V_src(phi)>=0."
      - "V_src(phi+c*1)=V_src(phi)."
      - "V_src depends only on off-diagonal symmetric edge weights."
      - "Its stationary directions include constants on every connected component of the undirected C-support."
    not_an_action_because_missing:
      - "a physically interpreted configuration or field"
      - "physical units and an action scale"
      - "physical time or spacetime integration"
      - "a spacetime measure or metric"
      - "locality and causal structure"
      - "a stationary-action postulate"
      - "boundary and initial data with physical meaning"
      - "a model-to-world interpretation"
  first_variation:
    exact_result: "(D V_src(phi))_x=sum_y C_xy(phi_x-phi_y)=(L_C phi)_x"
    laplacian_definition: "L_C=diag(C*1)-C"
    hessian: "L_C"
    exact_properties:
      - "L_C is symmetric."
      - "L_C is positive semidefinite."
      - "L_C*1=0."
    crucial_nonidentity: >-
      L_C is not generally I-C, even though I-C is the symmetric part of
      I-P. Equality requires C*1=1, which follows if P is doubly stochastic
      but is false for the fixed forward control.
    consequence_for_wording: >-
      The functional is derived from the symmetric edge weights of P; it is
      not generally a variational representation of the symmetric part of the
      P7-T02 update residual.
  information_loss:
    exact_record: >-
      The map P -> V_src discards the skew matrix A, ignores diagonal holding
      weights inside edge differences, and can also differ from the symmetric
      update residual through the degree term diag(C*1).
    consequence: >-
      Source-equivalent may denote only a source-side variational surrogate
      of the type requested by the plan. It must not mean information
      equivalence, dynamical equivalence, or exact update equivalence.

