variational_object:
  notation: "V_src(q)=1/4 sum_(x,y) C_xy(q_y-q_x)^2"
  equivalent_form: "V_src(q)=1/2 q^T L_C q"
  laplacian:
    off_diagonal: "(L_C)_xy=-C_xy for x!=y"
    diagonal: "(L_C)_xx=sum_(z!=x) C_xz"
    properties:
      - "L_C^T=L_C"
      - "L_C 1=0"
      - "q^T L_C q>=0 over the declared rational probe space"
  shift_identity: "V_src(q+c1)=V_src(q)"
  nullspace: "q is constant on each connected component of the undirected positive support of C"
  physical_action: false
  energy_functional: false
  gauge_symmetry_claimed: false
  source_equivalent_qualification: "kernel-derived symmetric-conductance source variational surrogate only; not information-equivalent or dynamically equivalent to P7-T02 and not equivalent to a physical action"
  information_loss:
    exact_difference: "(I-P)-L_C=I-Diag(C 1)-A"
    symmetric_residual: "Sym(I-P)=I-C"
    equality_condition: "L_C=Sym(I-P) only when C 1=1; for row-normalized P this requires column normalization as well"
    omitted_records:
