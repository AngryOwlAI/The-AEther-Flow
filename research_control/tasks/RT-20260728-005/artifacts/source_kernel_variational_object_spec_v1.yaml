      - "diagonal holding weights, which vanish in all q_x-q_x terms"
      - "degree or diagonal-imbalance I-Diag(C 1)"

theorems:
  - theorem_id: "P7T06-THM-SOURCE-VARIATION-FLUX-BALANCE-001"
    title: "Exact first variation and finite source-flux balance"
    statement: "D V_src(q)[eta]=sum_x eta_x D_src,x(q), where D_src,x=sum_y C_xy(q_x-q_y). With J_src,xy=C_xy(q_x-q_y), J_src is antisymmetric, D_src,x=sum_y J_src,xy, the closed total sum is zero, and every subset B satisfies sum_(x in B)D_src,x=sum_(x in B,y notin B)J_src,xy."
    proof_basis:
      - "finite expansion of V_src(q+epsilon eta)"
      - "index exchange using C_xy=C_yx"
      - "pairwise cancellation of the antisymmetric edge record"
      - "internal-edge cancellation on each finite subset"
    exact_scope: "finite rational task-local source candidate"
    physical_conservation_theorem: false
    noether_theorem: false
  - theorem_id: "P7T06-THM-DIRECTIONAL-UPDATE-VARIATIONAL-OBSTRUCTION-001"
    title: "Fixed forward directional update fails the scalar-quadratic Hessian-symmetry criterion"
    statement: "For P_fwd=[[1/2,1/2],[0,1]], I-P_fwd=[[1/2,-1/2],[0,0]] is nonsymmetric. Every Euclidean gradient of a scalar quadratic has symmetric linear part. Therefore no scalar quadratic on the same two probe variables has gradient (I-P_fwd)q for all q."
    proof_basis:
      - "direct exact rational matrix subtraction"
      - "gradient of 1/2 q^T H q+b^T q+c equals ((H+H^T)/2)q+b"
      - "homogeneity forces b=0 and symmetry of the linear operator"
    exact_scope: "the fixed P7-T02 forward control, same probe variables, scalar quadratic class, and declared Euclidean pairing"
    global_no_go_claimed: false

