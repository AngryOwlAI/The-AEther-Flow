terminal_section_fixed_point_theorem:
  theorem_id: "THM-V22-CUR-GROUPOID-TERMINAL-SECTIONS-001"
  name: "GroupoidTerminalSectionFixedPointClassification"
  hypotheses:
    - "C is a small groupoid or a groupoid replaced by a small skeleton."
    - "A:C->Set is a well-typed functor."
    - "1_C is the constant terminal singleton functor."
  statement: "For one representative M_c of every connected component c of C, Nat(1_C,A) is naturally bijective to the product over c of A(M_c) fixed by Aut_C(M_c). In particular, evaluation at any M maps every natural section into A(M)^{Aut(M)}, and one object with empty fixed set obstructs every global natural section."
  proof_steps:
    - "A natural section eta gives eta_M in A(M). Naturality for every g in Aut(M) gives A(g)(eta_M)=eta_M."
    - "Conversely choose a_c in A(M_c) fixed by every automorphism. For N in component c and any f:M_c->N, set eta_N=A(f)(a_c)."
    - "If f and g both map M_c to N, then g^{-1}f is an automorphism of M_c and fixes a_c, so A(f)(a_c)=A(g)(a_c); the definition is independent of transport."
    - "For h:N->P, functoriality gives A(h)(eta_N)=eta_P, so eta is natural. The constructions are inverse."
  exact_scope: "This is a theorem about typed semantic groupoids and set-valued functors. It does not identify semantic isomorphisms with EqSrc, physical gauge, causality, time, or empirical response."
  smallest_falsifier: "A typed groupoid functor and component representative for which the displayed transport construction is not well defined, or a natural section whose value is moved by an automorphism."

current_reduct_factorization_theorem:
  theorem_id: "THM-V22-CUR-REDUCT-FIBRE-FACTORIZATION-001"
  name: "CurrentReductFactorizationIffFibreConstancy"
  hypotheses:
    - "U:E->R and q:E->Q are set-level maps."
    - "The factor is first required on im(U); if a factor on all R is demanded, U is assumed surjective or an extension outside im(U) is separately supplied."
  statement: "There is a unique map q_bar:im(U)->Q satisfying q=q_bar composed with U exactly when q is constant on every U-fibre. If U is surjective, q_bar is the unique factor R->Q."
  proof_steps:
    - "If q=q_bar composed with U and U(e0)=U(e1), then q(e0)=q_bar(U(e0))=q_bar(U(e1))=q(e1)."
    - "If q is fibre-constant, define q_bar(U(e))=q(e). Fibre constancy makes this well defined and the defining equation holds."
    - "Every point of im(U) has a preimage, so the factor on im(U) is unique. Surjectivity identifies im(U) with R."
  full_target_caveat: "When U is not surjective, fibre constancy alone fixes only the factor on im(U). Extending it to R can require a chosen value in Q and is not silently assumed."
  exact_scope: "This theorem is general set-level mathematics, not the RT002 finite four-point enumeration and not a source-law adoption."
  smallest_falsifier: "A fibre-constant q with no factor on im(U), or a factorable q that differs on one U-fibre."

