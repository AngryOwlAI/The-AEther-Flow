positive_witness:
  model_convention: "ordinary nonempty smooth-four-manifold source-arena convention"
  object_assignment: "K_star(M)=Diff_c(M) if Diff_c(M) is proper in Diff(M), otherwise K_star(M)={id_M}"
  arrow_assignment: "For h:M->N, H(h)(f)=h composed with f composed with h^-1"
  wide_subgroupoid_definition: "C_star has every object M, automorphism arrows K_star(M), and no cross-object arrows; cross-object arrows are not required for a wide subgroupoid."
  identity_proof: "supp(id_M) is empty and therefore compact."
  inverse_proof: "supp(f^-1)=f(supp(f)); a homeomorphism maps compact sets to compact sets."
  composition_proof: "supp(f composed with g) is contained in supp(g) union g^-1(supp(f)), a finite union of compact sets."
  conjugation_proof: "supp(h composed with f composed with h^-1)=h(supp(f)); therefore h Diff_c(M) h^-1=Diff_c(N), conjugation preserves the branch predicate Diff_c=Diff, and h K_star(M) h^-1=K_star(N)."
  nonidentity_proof: "A nonzero compactly supported smooth vector field on R4 has a nonidentity sufficiently small time flow in K_star(R4)=Diff_c(R4)."
  properness_proof: "K_star(M) is proper in the first branch by definition. In the fallback branch, every nonempty smooth manifold has a coordinate ball supporting a nonidentity compactly supported flow, so Diff(M) is nontrivial and {id_M} is proper."
  factorization_proof: "Compactness of support is determined by the smooth topology of M and does not vary with proposal-only presentation expansion data."
  current_source_derivation_scope: "semantic mathematical arrow-subclass only"
  selector_force: "none_established"
  physical_meaning: "none_assigned"
