  physics_promotion_authorized: false
  protected_gate_authority_created: false
  publication_authority_created: false
  completed_derivation_authorized: false

forbidden_conclusions:
  - "The exact-GR line is more than interpretive redescription on the evidence inspected here."
  - "Operational identity with GR is by itself a formal or categorical equivalence proof."
  - "A quotient notation or EqSrc candidate is a proved equivalence."
  - "Formal equivalence is genuine emergence."
  - "Source purity alone is genuine emergence."
  - "Interpretive or ontological difference is empirical novelty."
  - "Exact-GR compatibility empirically supports the substrate interpretation."
  - "Any scoped not_met value is a global no-go theorem or program-wide rejection."
  - "A validator, registry, generated derivative, role, checkpoint, or commit is scientific proof."
  - "This child artifact adopts ontology, establishes physical interpretation, proves general EqSrc, changes a scientific ledger, promotes a benchmark, authorizes publication, or completes the GR derivation."

