continuum_limit:
  source_fixture: "periodic source chart T_src^3 used as computational comparison domain only"
  state_space: "six periodic source scalar channels"
  operator: "L_A f=v_A dot source-gradient f"
  semigroup: "S_A(t)f(s)=f(s-v_A*t)"
  defined_by_target_agreement: false
  source_manifold_adopted: false
  physical_spacetime_claimed: false

refinement_family:
  symbol: "K_n"
  type: "directed tensor-product source-coordinate cell complexes"
  scaling_parameter: "h_n=max source-coordinate cell width"
  limit_condition: "h_n tends to zero"
  mesh_ratio_condition: "h_n/h_n,min <= 2 for the declared irregular and adapted fixtures"
  variants:
    - id: "uniform"
      definition: "s_j,i=i/n"
    - id: "graded"
      definition: "s_j,i=u_i+a_j*sin(2*pi*u_i)/(2*pi) with fixed a=(0.22,-0.17,0.13)"
    - id: "adaptive"
      definition: "positive cell widths from a fixed source-variation indicator with phases (0.07,0.23,0.41)"
      dynamically_regridded: false
      target_error_used: false
  mesh_and_tolerances_frozen_before_target_access: true

comparison_maps:
  sampling:
    symbol: "I_n"
    rule: "(I_n f)_i=f(s_i)"
    exact: true
  reconstruction:
    symbol: "R_n"
    rule: "R_n z is constant on each half-open directed source cell at the lower-node value"
    exact: true
    target_geometry_interpolation: false
  norm:
    discrete: "ell_infinity maximum absolute scalar difference"
    continuum: "source-chart scalar sup norm"
    physical_metric_norm: false
  reconstruction_bound: "||R_n I_n f-f|| <= sum_j h_j,max ||partial_j f|| <= 3 h_n max_j ||partial_j f||"

finite_evolution:
  scheme: "explicit first-order backward upwind for nonnegative fixed P3-T02 source velocities"
  rule: "(U_A,n z)_i=z_i-dt_n*sum_j v_A^j*(z_i-z_i-ej)/h_j,ij"
  source_cfl: "max_i dt_n*sum_j v_A^j/h_j,ij <= 1"
  computational_cfl_target: 0.45
  stability: "convex-combination monotonicity and ell_infinity contraction"
  constants_preserved: true
  scalar_range_preserved: true
  physical_conservation_claimed: false

analytic_bounds:
  smoothness: "C2 periodic source scalar data"
  global_evolution_error: "T/2*[dt_n*||(v_A dot grad)^2 f|| + sum_j v_A^j*h_j,max*||partial_jj f||]"
  convergence_class: "first order under dt_n=O(h_n)"
  principal_factor: "|Lambda_A,n(k)-i*v_A dot k| <= 1/2*sum_j v_A^j*h_j,max*|k_j|^2"
  product_convergence: "finite telescoping-product bound for the six fixed factors"
  mathematical_tool: "monotone finite-difference consistency plus ell_infinity stability and local source-sheaf restriction compatibility"
  finite_zero_remainder_used_as_proof: false

boundary_protocol:
  main_fixture: "periodic source chart"
  slab_fixture: "one-dimensional positive source transport with exact inflow trace"
  inflow_rule: "prescribe only faces entered by the backward source characteristic"
  outflow_rule: "do not prescribe independent outflow values"
  boundary_error_rule: "maximum inflow trace error propagates without amplification under the monotone update"
  finite_size_rule: "claim comparison only where the exact backward characteristic remains inside or first meets declared inflow"
