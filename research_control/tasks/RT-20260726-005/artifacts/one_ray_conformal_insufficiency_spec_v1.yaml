    claim: "Ann(V_x), a three-dimensional linear hyperplane, cannot be the null cone of a nondegenerate Lorentzian inverse form."
    hypotheses:
      - "dim T_x S=4"
      - "V_x is nonzero"
      - "the comparison form is real nondegenerate Lorentzian"
    proof_basis:
      - "polarization would make Ann(V_x) totally isotropic"
      - "Lorentzian Witt index is one"
    burden_effect: "obstructs direct null-cone identification"
  - theorem_id: "P6T03-THM-ONE-RAY-CONFORMAL-NONSELECTION"
    claim: "D_1(S,V) admits infinitely many pairwise nonconformal Lorentzian realizations even when V is stipulated future timelike."
    hypotheses:
      - "flow-box coordinates with V=partial_s"
      - "H is any smooth positive-definite symmetric 3x3 field"
    witness_family: "g_H=-ds^2+H_ij dy^i dy^j"
    separating_pair:
      H_0: "diag(1,1,1)"
      H_1: "diag(2,1,1)"
    burden_effect: "proves candidate-scoped nonselection"

