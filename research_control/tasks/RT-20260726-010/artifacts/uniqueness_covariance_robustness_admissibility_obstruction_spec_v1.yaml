    burden_effect: "uniform conditioning and signature robustness are not certified"
  - theorem_id: "P6T06-PROP-TRANSITION-INVERSE-COCYCLE-CONTROLS"
    claim: "2I fails Lorentz preservation, I and -I can fail inverse compatibility, and I,I,-I can fail the triple-overlap cocycle."
