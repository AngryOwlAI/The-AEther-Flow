    operational_transport_derived: false
    burden_effect: "declared gauge alone does not define physical observables"
  - theorem_id: "P6T06-PROP-FINITE-VARIATION-RESPONSE"
    claim: "The derivative in a is nonzero while source data remain fixed."
    derivative: "diag(0,2exp(2a),-2exp(-2a),0)"
    burden_effect: "finite-variation uniqueness is not certified"
  - theorem_id: "P6T06-PROP-UNIFORM-NONDEGENERACY-FAILURE"
    claim: "The inverse component epsilon^-2 diverges as epsilon tends to zero, and the signed continuation crosses degeneracy and signature."
