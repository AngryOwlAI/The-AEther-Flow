    claim: "The same-source q_(a,epsilon) family changes the classification of xi=e^0+e^1 and the e1/e2 transverse comparisons."
    inverse_value: "-1+exp(-2a)"
    classification:
      a_negative: "spacelike"
      a_zero: "null"
      a_positive: "timelike"
    transverse_values:
      e1: "exp(2a)"
      e2: "exp(-2a)"
    burden_effect: "unique cone and rod comparisons are not selected"
  - theorem_id: "P6T06-COR-GAUGE-QUOTIENT-BURDEN"
    claim: "B_a=diag(1,exp(a),exp(-a),1) preserves admitted source carriers and maps q_0 to q_a, but quotient identification requires a source-derived operational transport and representative-independence theorem."
