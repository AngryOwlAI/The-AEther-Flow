new_mathematical_payload:
  payload_count: 5
  items:
    - payload_id: "NMP-RT006-PM-001"
      payload_type: "theorem"
      name: "Bare SmoothMan_4 natural projective-covector nonselection theorem"
      genuinely_new_in_rt006: true
      statement: "There is no assignment (M,x)->ell(M,x) in P(T_x^*M) natural under all smooth four-manifold diffeomorphisms."
      proof:
        - "Assume such an assignment and evaluate it at the origin of R^4. Every orientation-preserving linear A in GL_plus(4,R) is a diffeomorphism fixing the origin, so naturality makes ell(R^4,0) fixed by the full dual GL_plus action."
        - "Choose a positive-determinant basis change carrying the alleged fixed line to R e^0. The determinant-one shear S with S^*e^0=e^0+e^1 moves that line. Conjugating S back moves the original line, contradicting fixedness."
      falsifier: "Exhibit one projective covector line fixed by every determinant-positive shear and basis change in GL_plus(4,R)."
      exact_scope: "bare smooth four-manifolds only; extra independently sourced structure may reduce isotropy"
      burden_effect: "proves_current_bare_source_nonselection_without_global_extension_no_go"
    - payload_id: "NMP-RT006-PM-002"
      payload_type: "theorem"
      name: "No H-equivariant Lorentz-conformal lift from a projective covector line"
      genuinely_new_in_rt006: true
      statement: "For V=R^4 and H=Stab_GL_plus(V)(R e^0), no GL_plus(V)-equivariant map P(V^*)->LC(V) exists."
      proof:
        - "Because P(V^*) is the homogeneous space GL_plus(V)/H, an equivariant map exists only if the proposed image of R e^0 is an H-fixed Lorentz-conformal class."
        - "For every t>0, D_t=diag(1,t,1,1) lies in H. If a nondegenerate symmetric matrix G represented an H-fixed conformal class, D_t^T G D_t=c_t G for some positive c_t."
        - "Taking determinants gives t^2 det(G)=c_t^4 det(G), hence c_t=t^(1/2). Each entry of D_t^T G D_t is multiplied by t^k with k equal to zero, one, or two, and none of those characters equals t^(1/2) for all t>0. Every entry of G must therefore vanish, contradicting nondegeneracy."
      falsifier: "Supply a nondegenerate Lorentz-signature G and positive function c_t satisfying D_t^T G D_t=c_t G for all rational t>0; the determinant and entry-weight equations are exact and jointly inconsistent."
      exact_scope: "the line and its full stabilizer alone; no claim about richer independently sourced structures"
      burden_effect: "blocks_line_alone_from_naturally_producing_Lorentz_conformal_geometry"
    - payload_id: "NMP-RT006-PM-003"
      payload_type: "lemma"
      name: "Projective-label quotient information-loss lemma"
      genuinely_new_in_rt006: true
      statement: "The map q->span(dq) forgets label origin, nonzero normalization, transverse orientation, and nonlinear one-dimensional reparametrization."
      proof:
        - "On R^4, every q_ab=a x^0+b with rational a nonzero and rational b has dq_ab=a dx^0 and therefore the same projective line R dx^0."
        - "The global diffeomorphism h(t)=t+t^3 also gives d(h composed with x^0)=(1+3(x^0)^2)dx^0, the same line with a nonconstant positive multiplier."
        - "Taking a<0 shows that the quotient identifies both transverse orientations. Thus no inverse can recover sign, scale, origin, or full label presentation from L_q."
      falsifier: "Construct a single-valued inverse that distinguishes q=x^0, q=-2x^0+1, and q=x^0+(x^0)^3 from their identical embedded projective line."
      exact_scope: "label data only; the underlying codimension-one hyperplane distribution is retained"
      burden_effect: "quarantines_orientation_normalization_time_and_response_overread"
    - payload_id: "NMP-RT006-PM-004"
      payload_type: "proposition"
      name: "Declared-arrow naturality has no independent admissibility force"
      genuinely_new_in_rt006: true
      statement: "When proposal arrows are defined by f^*L_target=L_source, Bridge_PCR naturality on those arrows is mathematically correct but follows from the arrow predicate and cannot independently justify that predicate."
      proof:
        - "The object part of Bridge_PCR contains L. The defining arrow equation is exactly the line-transport equation required for naturality of that object part."
        - "The adapted-frame transport then follows functorially from pullback, so no separate current-source law selecting the arrows enters the proof."
        - "Using this theorem to infer that line-preserving arrows are the independently admissible arrows would repeat the premise as the conclusion. The fixed packet avoids that inference by calling the category task-local and not EqSrc."
      falsifier: "Provide a current-ontology-derived arrow predicate that does not mention A, L_q, Bridge_PCR, target geometry, or desired P4 output, then prove independently that it implies line preservation. No such predicate appears in the fixed sources."
      exact_scope: "epistemic force of the naturality theorem, not its conditional mathematical correctness"
      burden_effect: "identifies_disclosed_arrow_circularity_without_repairing_the_candidate"
    - payload_id: "NMP-RT006-PM-005"
      payload_type: "proposition"
      name: "Frozen-K_star same-reduct nonselection corollary"
      genuinely_new_in_rt006: true
      statement: "The exact RT005 A/B fixture not only proves strict nonfactorization; it also proves that frozen K_star cannot select one of the two embedded projective lines."
      proof:
        - "Both proposal objects have the same literal M=R^4 and the same unchanged K_star(M)=Diff_c(R^4)."
        - "Their bridge lines R dx^0 and R(dx^0+dx^1) are unequal by exact coefficient comparison."
        - "Any selector depending only on the common reduct has one value on that reduct and therefore cannot agree with both proposal outputs."
      falsifier: "Show that the reduct objects differ or produce a nonzero lambda with dx^0+dx^1=lambda dx^0."
      exact_scope: "the unchanged K_star reduct only; no global no-go for materially enriched source data"
      burden_effect: "proves_K_star_information_loss_and_absence_of_epistemic_selection"

