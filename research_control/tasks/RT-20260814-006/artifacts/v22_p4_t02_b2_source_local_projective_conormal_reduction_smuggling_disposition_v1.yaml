new_mathematical_payload:
  - payload_id: "NMP-RT014-006-001"
    payload_type: "theorem"
    name: "Bare-source natural projective-covector nonselection theorem"
    summary: "No Diff-natural section of P(T*M) can be constructed from a bare smooth four-manifold because GL+(4) isotropy has no fixed projective covector line."
    falsifier: "An independently source-defined equivariant selector outside the bare reduct would evade but not contradict the scoped theorem."
  - payload_id: "NMP-RT014-006-002"
    payload_type: "theorem"
    name: "No GL4-equivariant conformal lift from one covector line"
    summary: "A G-equivariant map G/H to G/CO(1,3) would require H to embed in a conjugate conformal-Lorentz stabilizer, impossible because dimensions are thirteen and seven."
    falsifier: "Adding further source structure that reduces H could create a different domain and is not ruled out."
  - payload_id: "NMP-RT014-006-003"
    payload_type: "countermodel"
    name: "Arbitrarily small nonintegrable line-field perturbation"
    summary: "alpha_epsilon=dx0+epsilon*x1*dx2 satisfies alpha wedge d alpha=epsilon*dx0 wedge dx1 wedge dx2, while coherent exact dq perturbations remain integrable."
    falsifier: "The RT005 robustness claim survives because it was explicitly limited to coherent label perturbations."
  - payload_id: "NMP-RT014-006-004"
    payload_type: "nonuniqueness_theorem"
    name: "Projective conormal conformal underdetermination"
    summary: "diag(-1,1,1,1) and diag(-1,2,3,5) share the same distinguished covector line but are not conformally related."
    falsifier: "A separate source-derived spatial quadratic form could remove this underdetermination but is absent here."
  - payload_id: "NMP-RT014-006-005"
    payload_type: "quotient_lemma"
    name: "Coorientation and normalization erasure"
    summary: "Negative overlap reparametrizations and determinant-positive stabilizers reverse representative rays while preserving L_q, so the quotient selects no time orientation or response sign."
    falsifier: "A separately sourced positive-ray or coorientation primitive would define a distinct extension."
  - payload_id: "NMP-RT014-006-006"
    payload_type: "reduction_equivalence_theorem"
    name: "Covector-line and line-stabilizer reduction equivalence"
    summary: "For H equal to the GL(4,R) stabilizer of a reference covector line, projective cotangent-line sections and principal H-reductions of the frame bundle are equivalent data; P_H(q) supplies no selector beyond L_q."
    falsifier: "Two fixed-definition H-reductions over one line or an H-reduction with no recoverable associated line would refute the equivalence."
  - payload_id: "NMP-RT014-006-007"
    payload_type: "conditional_naturality_lemma"
    name: "Output-preserving proposal arrows make bridge naturality nonprobative"
    summary: "The admitted-arrow premise f^*L_target=L_source is exactly the L-component of Bridge_PCR naturality, so the theorem is conditionally correct but supplies no independent source-admissibility or EqSrc evidence."
    falsifier: "A pre-bridge current-source arrow law that does not mention the foliation, its line, or the desired bridge, together with a proof of line transport, would remove this circularity."

