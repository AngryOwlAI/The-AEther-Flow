new_mathematical_payload:
  payload_count: 3
  payloads:
    - payload_id: "NMP-RT006-PHIL-001"
      payload_type: "equivariant_nonselection_theorem"
      name: "Bare smooth manifolds do not naturally select projective covector lines"
      assumptions: "Assign to every smooth four-manifold M a smooth section ell_M of the projectivized nonzero cotangent bundle, using only the smooth structure, and require naturality under all diffeomorphisms."
      statement: "No such assignment exists. In particular, the current bare source arena cannot naturally select L_q without extra source structure or a restricted independently justified arrow category."
      proof: "Apply the alleged assignment to R4 and inspect ell at the origin. Every A in GL(4,R) defines a linear diffeomorphism fixing the origin. Naturality requires A_star ell_0 equals ell_0 for every A. But GL(4,R) acts transitively on projective covector lines and has no globally fixed line: for any nonzero alpha one can choose A with A_star alpha not proportional to alpha. This contradiction proves nonexistence."
      falsifier: "Exhibit a projective covector line fixed by the full GL(4,R) cotangent action, or exhibit additional independently source-derived structure that reduces the isotropy before the line is chosen."
      scope_limit: "This is a scoped nonselection theorem for bare smooth structure and full diffeomorphism naturality. It does not forbid proposal-only foliation data, restricted source categories, or future conservative source extensions."
      burden_effect: "narrows"
    - payload_id: "NMP-RT006-PHIL-002"
      payload_type: "reduction_information_equivalence_theorem"
      name: "A line-stabilizer reduction carries exactly the projective line data"
      assumptions: "Let H be the GL(4,R) stabilizer of a reference covector line ell_ref and let Fr(M) be the full frame bundle."
      statement: "Smooth projective cotangent-line sections and principal H-reductions of Fr(M) are equivalent data. Therefore the pair L_q and P_H(q) contains no independent geometric selector beyond L_q."
      proof: "The homogeneous space GL(4,R) divided by H is the projective covector space, so sections of the associated bundle Fr(M) times_GL GL/H correspond to H-reductions. From L, the fixed construction selects exactly frames u with u_star L_x equal ell_ref. Conversely, from an H-reduction, u inverse-star ell_ref is independent of the chosen adapted frame because H stabilizes ell_ref, and it recovers L. The two constructions are inverse."
      falsifier: "Produce two distinct fixed-definition adapted-frame reductions for the same line section, or an H-reduction from which the associated line cannot be recovered."
      scope_limit: "The theorem concerns the fixed line stabilizer H and does not classify reductions to smaller groups carrying additional independently supplied structure."
      burden_effect: "narrows"
    - payload_id: "NMP-RT006-PHIL-003"
      payload_type: "conditional_naturality_evidence_lemma"
      name: "Output-preserving arrows make output naturality nonprobative"
      assumptions: "A category of structured sources admits an arrow f only when f_star L_target equals L_source, and a bridge has object component L."
      statement: "The L-component of bridge naturality follows directly from arrow admissibility and therefore cannot independently validate the arrow class or select L."
      proof: "For every admitted f, the naturality square for the L-component is exactly the defining equality f_star L_target equals L_source. The adapted-frame component follows functorially from the same equality. Thus the conclusion restates an arrow premise and supplies no logically independent selection evidence."
      falsifier: "Provide admitted arrows defined entirely before and independently of L, then derive line transport as a nontrivial theorem for all of them."
      scope_limit: "The lemma does not deny that Bridge_PCR is a valid functor on the declared proposal category."
      burden_effect: "clarifies"

