# Validation layers are operational receipt layers, not promotion authority.
# Use PASS, PASS_WITH_WARNINGS, PENDING, FAIL, NOT_RUN, or NOT_APPLICABLE.
# PENDING requires evidence naming what remains pending and why it does not
# contradict any aggregate compatibility status.
validation_layers:
  pre_execution:
    status: ""
    evidence: []
  completion_internal:
    status: ""
    evidence: []
  post_write:
    status: ""
    evidence: []
  post_checkpoint:
    status: ""
    evidence: []
  renderer:
    status: ""
    evidence: []
  memory_bootstrap:
    status: ""
    evidence: []
  claim_language_linter:
    status: ""
    evidence: []
# Authorization layers are separate gate fields. The protected scoped review
# boolean is not downstream physics, benchmark, or completed-derivation
# promotion. Any true promotion boolean requires its exact authority source.
authorization_layers:
  protected_scoped_gate_review_authorized: false
  protected_scoped_gate_review_scope: ""
  protected_scoped_gate_review_authority_source_path: ""
  downstream_physics_promotion_authorized: false
  downstream_physics_promotion_authority_source_path: ""
  benchmark_promotion_authorized: false
  benchmark_promotion_authority_source_path: ""
  completed_derivation_authorized: false
  completed_derivation_authority_source_path: ""
# Three-tier summaries are reporting fields only. They must render adopted
# objects, accepted evidence/preconditions, open or blocked physical targets,
# and forbidden overreads without promoting claims beyond source authority.
three_tier_claim_summary:
  adopted_objects: []
  accepted_evidence_preconditions: []
  open_or_blocked_physical_targets: []
  forbidden_overread: []
